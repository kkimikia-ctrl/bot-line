<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ranking Global - Central de Jogos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .btn-voltar {
            display: block;
            width: 100%;
            background: #4b5563;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-decoration: none;
            text-align: center;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        h2 {
            margin-top: 0;
            color: #1e40af;
            font-size: 20px;
        }

        /* Seletor de Jogo por Abas */
        .seletor-jogo {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            -webkit-overflow-scrolling: touch;
        }
        .seletor-jogo::-webkit-scrollbar {
            display: none;
        }
        .btn-jogo-tab {
            background: #e5e7eb;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #4b5563;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-jogo-tab.active {
            background: #2563eb;
            color: white;
        }

        /* Tabela de Ranking */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
        }
        tr:nth-child(1) td { font-weight: bold; color: #b45309; }
        tr:nth-child(2) td { font-weight: bold; color: #4b5563; }
        tr:nth-child(3) td { font-weight: bold; color: #92400e; }
        
        .posicao {
            width: 35px;
            text-align: center;
        }
        .pontos {
            text-align: right;
            font-weight: bold;
        }
        .sem-dados {
            color: #6b7280;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="entretenimento.html" class="btn-voltar">⬅️ Voltar para o Início</a>

        <div class="card">
            <h2>🏆 Ranking por Jogo</h2>
            
            <div class="seletor-jogo" id="seletorJogos">
                <button class="btn-jogo-tab active" onclick="mudarJogo('genius', this)">💡 Desafio das Cores</button>
                <button class="btn-jogo-tab" onclick="mudarJogo('minicraque', this)">⚽ Mini Craque</button>
                <button class="btn-jogo-tab" onclick="mudarJogo('velha', this)">❌ Jogo da Velha</button>
                <button class="btn-jogo-tab" onclick="mudarJogo('forca', this)">🎯 Jogo da Forca</button>
                <button class="btn-jogo-tab" onclick="mudarJogo('memoria', this)">🧠 Jogo da Memória</button>
                <button class="btn-jogo-tab" onclick="mudarJogo('jokenpo', this)">🇧🇷 Jokenpô</button>
                <button class="btn-jogo-tab" onclick="mudarJogo('cobrinha', this)">🐍 Cobrinha</button>
            </div>

            <div id="conteudoRanking">
                </div>
        </div>
    </div>

    <script>
        // Mapeia todas as variações possíveis de chaves que os jogos antigos podiam usar
        const jogosRankings = {
            'genius': ['ranking_genius'],
            'minicraque': ['ranking_minicraque', 'minicraque_ranking', 'ranking_mini_craque', 'minicraque'],
            'velha': ['ranking_velha', 'velha_ranking', 'jogo_velha'],
            'forca': ['ranking_forca', 'forca_ranking', 'jogo_forca'],
            'memoria': ['ranking_memoria', 'memoria_ranking', 'jogo_memoria'],
            'jokenpo': ['ranking_jokenpo', 'jokenpo_ranking', 'jokenpo'],
            'cobrinha': ['ranking_cobrinha', 'cobrinha_ranking', 'snake_ranking']
        };

        function mudarJogo(jogoKey, elementoTab) {
            document.querySelectorAll('.btn-jogo-tab').forEach(btn => btn.classList.remove('active'));
            elementoTab.classList.add('active');
            carregarRanking(jogoKey);
        }

        function carregarRanking(jogoKey) {
            const chavesPossiveis = jogosRankings[jogoKey] || [jogoKey];
            let dados = [];

            // Tenta ler todas as chaves possíveis para garantir que acha os dados salvos
            for (let chave of chavesPossiveis) {
                try {
                    let salvo = localStorage.getItem(chave);
                    if (salvo) {
                        let parsed = JSON.parse(salvo);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            dados = parsed;
                            break;
                        }
                    }
                } catch (e) {
                    // Ignora erros de leitura individuais
                }
            }

            const container = document.getElementById('conteudoRanking');

            if (dados.length === 0) {
                container.innerHTML = `<div class="sem-dados">Ainda não há pontuações salvas para este jogo. Seja o primeiro a jogar!</div>`;
                return;
            }

            // Ordena do maior para o menor
            dados.sort((a, b) => (b.pontos || b.score || 0) - (a.pontos || a.score || 0));

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th class="posicao">#</th>
                            <th>Jogador</th>
                            <th class="pontos">Pontos</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            dados.slice(0, 100).forEach((item, index) => {
                let iconePos = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}º`;
                let nomeJogador = item.nome || item.name || 'Anônimo';
                let pontosJogador = item.pontos !== undefined ? item.pontos : (item.score !== undefined ? item.score : 0);

                html += `
                    <tr>
                        <td class="posicao">${iconePos}</td>
                        <td>${escapeHtml(nomeJogador)}</td>
                        <td class="pontos">${pontosJogador}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', () => {
            carregarRanking('genius');
        });
    </script>
</body>
</html>

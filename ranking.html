<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos - Ranking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .card-game {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .jogo-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn-voltar {
            background: #ccc;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="card-game">
    <button class="btn-voltar" onclick="window.location.href='index.html'">⬅ Voltar</button>
    
    <h2 style="text-align: center; color: #1e3a8a; font-size: 18px; margin-top: 0;">🏆 Ranking Global dos Jogos</h2>

    <div id="lista-ranking-global">
        <div style="text-align: center; color: #666; padding: 20px;">Carregando pontuações...</div>
    </div>
</div>

<script>
    // Lista com os seus 6 jogos baseada nos arquivos do GitHub
    const meusJogos = [
        { id: 'minicraque', nome: '⚽ Mini Craque' },
        { id: 'velha', nome: '❌ Jogo da Velha' },
        { id: 'forca', nome: '🎯 Jogo da Forca' },
        { id: 'memoria', nome: '🧠 Jogo da Memória' },
        { id: 'jokenpo', nome: '🇧🇷 Jokenpô Brasil' },
        { id: 'cobrinha', nome: '🐍 Jogo da Cobrinha' }
    ];

    function carregarRanking() {
        const containerLista = document.getElementById('lista-ranking-global');
        let htmlCards = '';

        meusJogos.forEach(jogo => {
            // Pega a pontuação salva (ajuste a chave do localStorage conforme você salva em cada jogo)
            let pontuacao = localStorage.getItem(`score_${jogo.id}`) || localStorage.getItem(`pontos_${jogo.id}`) || 0;

            htmlCards += `
                <div class="jogo-item">
                    <span style="font-weight: bold; color: #334155; font-size: 14px;">${jogo.nome}</span>
                    <span style="background: #059669; color: white; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold;">⭐ ${pontuacao} pts</span>
                </div>
            `;
        });

        containerLista.innerHTML = htmlCards;
    }

    // Executa ao carregar a página
    window.onload = carregarRanking;
</script>

</body>
</html>

<script type="module">
  // Importe as funções necessárias dos SDKs do Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // Configuração do seu aplicativo central-jogos
  const firebaseConfig = {
    apiKey: "AIzaSyBebQKn7Bi7FafIJLda7wBDb96-ZEuxIa8",
    authDomain: "ajuda-jp-ba2da.firebaseapp.com",
    projectId: "ajuda-jp-ba2da",
    storageBucket: "ajuda-jp-ba2da.firebasestorage.app",
    messagingSenderId: "274976182",
    appId: "1:274976182:web:6ad832d048e441d7c3c517",
    measurementId: "G-EDC1BMHPW0"
  };

  // Inicializa o Firebase e o Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Exemplo de função para salvar a pontuação de um jogo no ranking:
  // SalvarPontuacao("Jogo da Velha", "Kimikia", 150);
  window.salvarPontuacao = async function(nomeJogo, nomeJogador, pontos) {
    try {
      await addDoc(collection(db, "ranking_jogos"), {
        jogo: nomeJogo,
        jogador: nomeJogador,
        pontos: Number(pontos),
        data: new Date()
      });
      console.log("Pontuação salva com sucesso!");
    } catch (e) {
      console.error("Erro ao salvar pontuação: ", e);
    }
  };
</script>

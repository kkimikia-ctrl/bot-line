<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos - Ranking</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #45a049; }
        #mensagem { margin-top: 20px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Central de Jogos e Ranking</h2>
        <p>Conexão com o Firebase estabelecida com sucesso!</p>
        <button onclick="testarEnvio()">Testar Salvar Pontuação</button>
        <!-- Aqui vai aparecer a mensagem de erro ou sucesso -->
        <p id="mensagem"></p> 
    </div>

    <!-- Script de Conexão do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBebQKn7Bi7FafIJLda7wBDb96-ZEuxIa8",
            authDomain: "ajuda-jp-ba2da.firebaseapp.com",
            projectId: "ajuda-jp-ba2da",
            storageBucket: "ajuda-jp-ba2da.firebasestorage.app",
            messagingSenderId: "274976182",
            appId: "1:274976182:web:6ad832d048e441d7c3c517",
            measurementId: "G-EDC1BMHPW0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Função de teste com aviso na tela
        window.testarEnvio = async function() {
            const msgTexto = document.getElementById("mensagem");
            msgTexto.innerText = "Enviando para o banco de dados...";
            msgTexto.style.color = "blue";
            
            try {
                await addDoc(collection(db, "ranking_jogos"), {
                    jogo: "Teste Inicial",
                    jogador: "Kimikia",
                    pontos: 100,
                    data: new Date()
                });
                msgTexto.innerText = "✅ Sucesso! Pontuação salva no Firebase.";
                msgTexto.style.color = "green";
            } catch (e) {
                msgTexto.innerText = "❌ Erro: " + e.message;
                msgTexto.style.color = "red";
            }
        };
    </script>

</body>
</html>

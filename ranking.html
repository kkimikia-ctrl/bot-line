<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Geral de Jogos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #70b7ff 100%);
            margin: 0;
            padding: 10px;
            padding-top: 70px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-header {
            background-color: #003366;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .back-btn {
            position: absolute;
            left: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        .ranking-container {
            background: rgba(255, 255, 255, 0.95);
            max-width: 420px;
            width: 90%;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .game-tabs {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #0d47a1;
            color: white;
        }
        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 350px;
            overflow-y: auto;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .ranking-item:nth-child(-n+3) {
            font-weight: bold;
            background: #fff8e1;
            border-radius: 6px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <button class="back-btn" onclick="location.href='forca.html'">⬅ Voltar</button>
        Ranking dos Jogos 🏆
    </div>

    <div class="ranking-container">
        <h2 style="color: #0d47a1; font-size: 18px; text-align: center; margin-top: 0;">Top 15 por Modalidade</h2>
        
        <!-- Abas dos 5 Jogos -->
        <div class="game-tabs">
            <button class="tab-btn active" onclick="mudarJogo('jogo1', this)">🐍 Cobrinha</button>
            <button class="tab-btn" onclick="mudarJogo('jogo2', this)">❌ Forca</button>
            <button class="tab-btn" onclick="mudarJogo('jogo3', this)">🧠 Memória</button>
            <button class="tab-btn" onclick="mudarJogo('jogo4', this)">🎯 Alvo</button>
            <button class="tab-btn" onclick="mudarJogo('jogo5', this)">🧩 Puzzle</button>
        </div>

        <div id="listaRanking" class="ranking-list">
            <!-- Os 15 colocados serão inseridos aqui via JavaScript -->
        </div>
    </div>

    <script>
        // Dados simulados dos 15 melhores para cada um dos 5 jogos
        const dadosRanking = {
            jogo1: [
                {nome: "Carlos Silva", pontos: 1450}, {nome: "Ana Souza", pontos: 1320}, {nome: "Marcos Lima", pontos: 1200},
                {nome: "Juliana Mendes", pontos: 1100}, {nome: "Roberto Santos", pontos: 950}, {nome: "Fernanda Costa", pontos: 900},
                {nome: "Lucas Oliveira", pontos: 850}, {nome: "Mariana Rocha", pontos: 800}, {nome: "Paulo Ribeiro", points: 750},
                {nome: "Camila Duarte", pontos: 700}, {nome: "Bruno Carvalho", pontos: 650}, {nome: "Larissa Azevedo", pontos: 600},
                {nome: "Diego Martins", pontos: 550}, {nome: "Beatriz Freitas", pontos: 500}, {nome: "Gabriel Ramos", pontos: 450}
            ],
            jogo2: [
                {nome: "Ana Souza", pontos: 980}, {nome: "Carlos Silva", pontos: 910}, {nome: "Gabriel Ramos", pontos: 880},
                {nome: "Fernanda Costa", pontos: 820}, {nome: "Juliana Mendes", pontos: 790}, {nome: "Roberto Santos", points: 740},
                {nome: "Lucas Oliveira", pontos: 700}, {nome: "Marcos Lima", pontos: 660}, {nome: "Paulo Ribeiro", points: 620},
                {nome: "Camila Duarte", pontos: 590}, {nome: "Bruno Carvalho", pontos: 550}, {nome: "Larissa Azevedo", pontos: 510},
                {nome: "Diego Martins", pontos: 480}, {nome: "Beatriz Freitas", pontos: 430}, {nome: "Mariana Rocha", pontos: 400}
            ],
            jogo3: [
                {nome: "Juliana Mendes", pontos: 2000}, {nome: "Carlos Silva", pontos: 1850}, {nome: "Ana Souza", pontos: 1720},
                {nome: "Marcos Lima", pontos: 1600}, {nome: "Roberto Santos", points: 1500}, {nome: "Fernanda Costa", pontos: 1400},
                {nome: "Lucas Oliveira", pontos: 1300}, {nome: "Mariana Rocha", pontos: 1200}, {nome: "Paulo Ribeiro", points: 1100},
                {nome: "Camila Duarte", pontos: 1000}, {nome: "Bruno Carvalho", pontos: 900}, {nome: "Larissa Azevedo", pontos: 800},
                {nome: "Diego Martins", pontos: 700}, {nome: "Beatriz Freitas", pontos: 600}, {nome: "Gabriel Ramos", pontos: 500}
            ],
            jogo4: [
                {nome: "Fernanda Costa", pontos: 3100}, {nome: "Carlos Silva", pontos: 2950}, {nome: "Ana Souza", pontos: 2800},
                {nome: "Juliana Mendes", pontos: 2650}, {nome: "Marcos Lima", pontos: 2500}, {nome: "Roberto Santos", points: 2350},
                {nome: "Lucas Oliveira", pontos: 2200}, {nome: "Mariana Rocha", pontos: 2050}, {nome: "Paulo Ribeiro", points: 1900},
                {nome: "Camila Duarte", pontos: 1750}, {nome: "Bruno Carvalho", pontos: 1600}, {nome: "Larissa Azevedo", pontos: 1450},
                {nome: "Diego Martins", pontos: 1300}, {nome: "Beatriz Freitas", pontos: 1150}, {nome: "Gabriel Ramos", pontos: 1000}
            ],
            jogo5: [
                {nome: "Marcos Lima", pontos: 1250}, {nome: "Carlos Silva", pontos: 1190}, {nome: "Ana Souza", pontos: 1120},
                {nome: "Juliana Mendes", pontos: 1050}, {nome: "Fernanda Costa", pontos: 980}, {nome: "Roberto Santos", points: 910},
                {nome: "Lucas Oliveira", pontos: 850}, {nome: "Mariana Rocha", pontos: 790}, {nome: "Paulo Ribeiro", points: 730},
                {nome: "Camila Duarte", pontos: 670}, {nome: "Bruno Carvalho", pontos: 610}, {nome: "Larissa Azevedo", pontos: 550},
                {nome: "Diego Martins", pontos: 490}, {nome: "Beatriz Freitas", pontos: 430}, {nome: "Gabriel Ramos", pontos: 370}
            ]
        };

        function carregarRanking(jogo) {
            const lista = document.getElementById('listaRanking');
            lista.innerHTML = '';
            
            dadosRanking[jogo].forEach((item, index) => {
                let medalha = '';
                if(index === 0) medalha = '🥇 ';
                else if(index === 1) medalha = '🥈 ';
                else if(index === 2) medalha = '🥉 ';
                else medalha = (index + 1) + '. ';

                const li = document.createElement('li');
                li.className = 'ranking-item';
                li.innerHTML = `<span>${medalha}${item.nome}</span> <strong style="color: #0d47a1;">${item.pontos} pts</strong>`;
                lista.appendChild(li);
            });
        }

        function mudarJogo(jogo, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            carregarRanking(jogo);
        }

        // Carrega o primeiro jogo por padrão ao abrir a página
        carregarRanking('jogo1');
    </script>
</body>
</html>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
      authDomain: "ajuda-jp.firebaseapp.com",
      projectId: "ajuda-jp",
      storageBucket: "ajuda-jp.firebasestorage.app",
      messagingSenderId: "40121072206",
      appId: "1:40121072206:web:8a844e632f004f61d0a11f"
    };

    let db = null;
    const listContainer = document.getElementById('rankingList');

    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
    } catch (e) {
        console.error("Erro ao inicializar Firebase:", e);
        listContainer.innerHTML = `<div class="empty-state" style="color: #f87171;">Erro ao iniciar Firebase: ${e.message}</div>`;
    }

    window.registrarCliqueBanner = async function(bannerId, urlDestino) {
        try {
            if (db) {
                const bannerRef = doc(db, 'banners', bannerId);
                await updateDoc(bannerRef, { cliques: increment(1) });
            }
        } catch (error) {
            console.log("Erro ao contabilizar clique: ", error);
        } finally {
            window.location.href = urlDestino;
        }
    };

    const jogos = [
        { id: 'minicraque', nome: '⚽ Mini Craque' },
        { id: 'velha', nome: '❌ Jogo da Velha' },
        { id: 'forca', nome: '🎯 Jogo da Forca' },
        { id: 'memoria', nome: '🧠 Jogo da Memória' },
        { id: 'jokenpo', nome: '🇧🇷 Jokenpô' },
        { id: 'cobrinha', nome: '🐍 Cobrinha' }
    ];

    let jogoAtual = 'memoria';

    function inicializarAbas() {
        const tabsContainer = document.getElementById('gamesTabs');
        if (!tabsContainer) return;
        tabsContainer.innerHTML = '';

        jogos.forEach(jogo => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${jogo.id === jogoAtual ? 'active' : ''}`;
            btn.innerText = jogo.nome;
            btn.onclick = () => {
                jogoAtual = jogo.id;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                carregarRankingJogo(jogo.id);
            };
            tabsContainer.appendChild(btn);
        });
    }

    async function carregarRankingJogo(idJogo) {
        listContainer.innerHTML = '<div class="empty-state">Carregando Top 100...</div>';

        if (!db) {
            listContainer.innerHTML = '<div class="empty-state" style="color: #f87171;">Banco de dados não conectado.</div>';
            return;
        }

        try {
            let dadosRanking = [];
            const q = query(
                collection(db, `ranking_${idJogo}`),
                orderBy("pontos", "desc"),
                limit(100)
            );

            const querySnapshot = await getDocs(q);
            
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                dadosRanking.push({
                    nome: data.nome || "Jogador Anônimo",
                    pontos: Number(data.pontos) || 0
                });
            });

            if (dadosRanking.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">Nenhuma pontuação registrada ainda para este jogo.</div>';
                return;
            }

            let html = '';
            dadosRanking.forEach((jogador, index) => {
                let posicao = index + 1;
                let podiumClass = '';
                let iconePosicao = `#${posicao}`;

                if (posicao === 1) { podiumClass = 'podium-1'; iconePosicao = '🥇'; }
                else if (posicao === 2) { podiumClass = 'podium-2'; iconePosicao = '🥈'; }
                else if (posicao === 3) { podiumClass = 'podium-3'; iconePosicao = '🥉'; }

                html += `
                    <div class="player-card ${podiumClass}">
                        <div class="player-info">
                            <span class="player-rank">${iconePosicao}</span>
                            <span class="player-name">${escapeHtml(jogador.nome)}</span>
                        </div>
                        <div class="player-score">
                            ⭐ ${jogador.pontos.toLocaleString()} pts
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;

        } catch (error) {
            console.error("Erro ao buscar ranking:", error);
            // Mostra o erro exato na tela para facilitar o diagnóstico
            listContainer.innerHTML = `<div class="empty-state" style="color: #f87171; font-size: 12px; text-align: left; padding: 10px;">
                <b>Erro ao carregar ranking:</b><br>${error.message}<br><br>
                <i>Dica: Se for erro de índice, abra o console do navegador para ver o link gerado pelo Firebase para criar o índice automaticamente.</i>
            </div>`;
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Executa assim que o DOM carregar
    document.addEventListener("DOMContentLoaded", () => {
        inicializarAbas();
        carregarRankingJogo(jogoAtual);
    });
</script>

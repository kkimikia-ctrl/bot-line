<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Jogos - Ranking Global</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            padding-top: 155px !important;
            overscroll-behavior-y: none; /* Evita que o app feche/recarregue ao puxar para baixo */
        }

        .ranking-container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 82vh;
            max-height: 700px;
        }

        .header-panel {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: #fbbf24;
        }

        /* Estilo do Botão Voltar no Ranking */
        .btn-voltar-ranking {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .games-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .games-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border-color: #818cf8;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .ranking-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .ranking-scroll-area::-webkit-scrollbar {
            width: 5px;
        }

        .ranking-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-card.podium-1 {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(245, 158, 11, 0.05) 100%);
            border-color: rgba(251, 191, 36, 0.4);
        }

        .player-card.podium-2 {
            background: linear-gradient(135deg, rgba(148, 163, 184, 0.15) 0%, rgba(100, 116, 139, 0.05) 100%);
            border-color: rgba(148, 163, 184, 0.4);
        }

        .player-card.podium-3 {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.15) 0%, rgba(180, 83, 9, 0.05) 100%);
            border-color: rgba(217, 119, 6, 0.4);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-rank {
            font-weight: 700;
            font-size: 14px;
            width: 28px;
            text-align: center;
            color: #94a3b8;
        }

        .podium-1 .player-rank { color: #fbbf24; }
        .podium-2 .player-rank { color: #cbd5e1; }
        .podium-3 .player-rank { color: #f59e0b; }

        .player-name {
            font-weight: 600;
            font-size: 14px;
            color: #f1f5f9;
        }

        .player-score {
            font-weight: 700;
            font-size: 13px;
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="ranking-container">
    <div class="header-panel">
        <div class="top-row">
            <!-- Botão Voltar Inteligente -->
            <button class="btn-voltar-ranking" onclick="voltarDoRanking()">⬅ Voltar</button>
            <div class="title-area">
                <span>🏆</span> <span>Top 100 Global</span>
            </div>
        </div>
        <div class="games-tabs" id="gamesTabs"></div>
    </div>
    <div class="ranking-scroll-area" id="rankingList">
        <div class="empty-state">Carregando painel...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
      authDomain: "ajuda-jp.firebaseapp.com",
      projectId: "ajuda-jp",
      storageBucket: "ajuda-jp.firebasestorage.app",
      messagingSenderId: "40121072206",
      appId: "1:40121072206:web:8a844e632f004f61d0a11f"
    };

    let db = null;
    const listContainer = document.getElementById('rankingList');

    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
    } catch (err) {
        console.error("Erro Firebase:", err);
    }

    window.registrarCliqueBanner = async function(bannerId, urlDestino) {
        try {
            if (db) {
                await updateDoc(doc(db, 'banners', bannerId), { cliques: increment(1) });
            }
        } catch (e) {
            console.log(e);
        } finally {
            window.location.href = urlDestino;
        }
    };

    const jogos = [
        { id: 'minicraque', nome: '⚽ Mini Craque' },
        { id: 'velha', nome: '❌ Jogo da Velha' },
        { id: 'forca', nome: '🎯 Jogo da Forca' },
        { id: 'memoria', nome: '🧠 Jogo da Memória' },
        { id: 'jokenpo', nome: '🇧🇷 Jokenpô' },
        { id: 'cobrinha', nome: '🐍 Cobrinha' }
    ];

    let jogoAtual = 'memoria';

    function inicializarAbas() {
        const tabsContainer = document.getElementById('gamesTabs');
        if (!tabsContainer) return;
        tabsContainer.innerHTML = '';

        jogos.forEach(jogo => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${jogo.id === jogoAtual ? 'active' : ''}`;
            btn.innerText = jogo.nome;
            btn.onclick = () => {
                jogoAtual = jogo.id;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                carregarRankingJogo(jogo.id);
            };
            tabsContainer.appendChild(btn);
        });
    }

    async function carregarRankingJogo(idJogo) {
        listContainer.innerHTML = '<div class="empty-state">Carregando Top 100...</div>';

        if (!db) {
            listContainer.innerHTML = '<div class="empty-state" style="color: #f87171;">Erro de conexão com o banco.</div>';
            return;
        }

        try {
            const q = query(collection(db, `ranking_${idJogo}`), orderBy("pontos", "desc"), limit(100));
            const querySnapshot = await getDocs(q);
            
            let dadosRanking = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                dadosRanking.push({
                    nome: data.nome || "Jogador Anônimo",
                    pontos: Number(data.pontos) || 0
                });
            });

            if (dadosRanking.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">Nenhuma pontuação registrada ainda para este jogo.</div>';
                return;
            }

            let html = '';
            dadosRanking.forEach((jogador, index) => {
                let posicao = index + 1;
                let podiumClass = '';
                let iconePosicao = `#${posicao}`;

                if (posicao === 1) { podiumClass = 'podium-1'; iconePosicao = '🥇'; }
                else if (posicao === 2) { podiumClass = 'podium-2'; iconePosicao = '🥈'; }
                else if (posicao === 3) { podiumClass = 'podium-3'; iconePosicao = '🥉'; }

                html += `
                    <div class="player-card ${podiumClass}">
                        <div class="player-info">
                            <span class="player-rank">${iconePosicao}</span>
                            <span class="player-name">${jogador.nome}</span>
                        </div>
                        <div class="player-score">⭐ ${jogador.pontos.toLocaleString()} pts</div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;

        } catch (error) {
            console.error("Erro ranking:", error);
            listContainer.innerHTML = `<div class="empty-state" style="color: #f87171;">Ainda não há dados na coleção <b>ranking_${idJogo}</b> ou falta o índice no Firebase.</div>`;
        }
    }

    // Função inteligente do Botão Voltar
    window.voltarDoRanking = function() {
        const ultimoJogo = localStorage.getItem('ultimoJogoRetorno') || 'index.html';
        window.location.href = ultimoJogo;
    };

    document.addEventListener("DOMContentLoaded", () => {
        inicializarAbas();
        carregarRankingJogo(jogoAtual);
    });
</script>

<script src="bannersjogo.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        if (typeof carregarSistemaDeBanners === 'function') {
            carregarSistemaDeBanners("🏆 Ranking Global", "forca.html");
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ranking Global - Central de Jogos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .btn-voltar {
            display: block;
            width: 100%;
            background: #4b5563;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-decoration: none;
            text-align: center;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        h2 {
            margin-top: 0;
            color: #1e40af;
            font-size: 20px;
        }

        /* Tabela de Ranking Top 100 */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
        }
        tr:nth-child(1) td { font-weight: bold; color: #b45309; }
        tr:nth-child(2) td { font-weight: bold; color: #4b5563; }
        tr:nth-child(3) td { font-weight: bold; color: #92400e; }
        
        .posicao {
            width: 35px;
            text-align: center;
        }
        .pontos {
            text-align: right;
            font-weight: bold;
        }
        .sem-dados {
            color: #6b7280;
            padding: 20px;
            font-size: 14px;
        }
        .jogo-tag {
            font-size: 10px;
            background: #e5e7eb;
            padding: 2px 6px;
            border-radius: 4px;
            color: #4b5563;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="entretenimento.html" class="btn-voltar">⬅️ Voltar para o Início</a>

        <div class="card">
            <h2>🏆 Top 100 - Ranking Global</h2>
            <div id="conteudoRanking">
                </div>
        </div>
    </div>

    <script>
        function carregarRankingGeral() {
            // Lista todas as chaves de jogos salvas no navegador
            const chavesJogos = [
                { key: 'ranking_genius', nome: 'Desafio das Cores' },
                { key: 'ranking_minicraque', nome: 'Mini Craque' },
                { key: 'ranking_velha', nome: 'Jogo da Velha' },
                { key: 'ranking_forca', nome: 'Jogo da Forca' },
                { key: 'ranking_memoria', nome: 'Jogo da Memória' },
                { key: 'ranking_jokenpo', nome: 'Jokenpô' },
                { key: 'ranking_cobrinha', nome: 'Cobrinha' }
            ];

            let todosRecordes = [];

            // Junta as pontuações de todos os jogos em uma única lista
            chavesJogosforEachItem = chavesJogos.forEach(jogo => {
                try {
                    let dados = JSON.parse(localStorage.getItem(jogo.key) || '[]');
                    dados.forEach(item => {
                        todosRecordes.push({
                            nome: item.nome || 'Anônimo',
                            pontos: item.pontos || 0,
                            jogo: jogo.nome
                        });
                    });
                } catch (e) {
                    // Ignora erros de leitura individuais
                }
            });

            const container = document.getElementById('conteudoRanking');

            if (todosRecordes.length === 0) {
                container.innerHTML = `<div class="sem-dados">Ainda não há pontuações salvas. Jogue e seja o primeiro no Top 100!</div>`;
                return;
            }

            // Ordena todos do maior para o menor
            todosRecordes.sort((a, b) => b.pontos - a.pontos);

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th class="posicao">#</th>
                            <th>Jogador</th>
                            <th class="pontos">Pontos</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Pega até os 100 melhores
            todosRecordes.slice(0, 100).forEach((item, index) => {
                let iconePos = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}º`;
                html += `
                    <tr>
                        <td class="posicao">${iconePos}</td>
                        <td>${escapeHtml(item.nome)} <span class="jogo-tag">${item.jogo}</span></td>
                        <td class="pontos">${item.pontos}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', () => {
            carregarRankingGeral();
        });
    </script>
</body>
</html>

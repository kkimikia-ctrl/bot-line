<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking dos Jogos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e3a8a;
            color: #f8fafc;
            margin: 0;
            padding: 10px;
            text-align: center;
            padding-bottom: 40px;
        }
        h1 { color: #f8fafc; font-size: 20px; margin: 10px 0 15px 0; }
        
        /* Layout dos Banners Divididos em Dois Retângulos Lado a Lado */
        .banners-duplos-container {
            max-width: 450px;
            margin: 0 auto 15px auto;
            display: flex;
            gap: 8px;
        }
        .banner-box {
            flex: 1;
            height: 75px;
            background: #0f172a;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        .banner-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }
        .banner-slide {
            min-width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        .banner-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn-voltar {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            float: left;
            margin-bottom: 10px;
        }

        .container-card {
            background: white;
            color: #333;
            max-width: 450px;
            margin: 0 auto;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: left;
        }

        h2.titulo-secao {
            text-align: center;
            color: #1e3a8a;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        /* Abas de Modalidade */
        .abas-container {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        .aba-btn {
            background: #f1f5f9;
            border: none;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            color: #64748b;
        }
        .aba-btn.active {
            background: #1e3a8a;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid #f1f5f9;
        }
        .pos { font-weight: bold; text-align: center; width: 40px; }
        .gold { color: #d97706; }
        .silver { color: #64748b; }
        .bronze { color: #b45309; }
        .pts { text-align: right; font-weight: bold; color: #1e3a8a; }
        
        .tabela-wrapper {
            max-height: 420px;
            overflow-y: auto;
        }
    </style>
</head>
<body onscroll="pausarCarrosselAoRolar()">

        <button class="btn-voltar" onclick="window.location.href='entretenimento.html'">⬅ Voltar</button>
        <div style="clear: both;"></div>

    </div>

    <div class="container-card">
        <h2 class="titulo-secao">Top 30 por Modalidade</h2>
        
        <!-- Abas de Navegação dos Jogos -->
        <div class="abas-container">
            <button class="aba-btn active" onclick="mudarAba('Cobrinha', this)">🐍 Cobrinha</button>
            <button class="aba-btn" onclick="mudarAba('Forca', this)">❌ Forca</button>
            <button class="aba-btn" onclick="mudarAba('Memória', this)">🧠 Memória</button>
            <button class="aba-btn" onclick="mudarAba('Jankeipo', this)">✌️ Jankeipo</button>
        </div>

        <div class="tabela-wrapper">
            <table>
                <tbody id="corpoTabela">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Lógica dos dois carrosseles independentes
        let slide1 = 0, slide2 = 0;
        const t1 = document.getElementById('track1');
        const t2 = document.getElementById('track2');
        const slides1 = t1.querySelectorAll('.banner-slide');
        const slides2 = t2.querySelectorAll('.banner-slide');
        
        let intervaloCarrossel = setInterval(mudarBannersAutomaticos, 3500);
        let timeoutRetomada = null;

        function mudarBannersAutomaticos() {
            slide1 = (slide1 + 1) % slides1.length;
            slide2 = (slide2 + 1) % slides2.length;
            t1.style.transform = `translateX(-${slide1 * 100}%)`;
            t2.style.transform = `translateX(-${slide2 * 100}%)`;
        }

        function pausarCarrosselAoRolar() {
            clearInterval(intervaloCarrossel);
            clearTimeout(timeoutRetomada);
            timeoutRetomada = setTimeout(() => {
                intervaloCarrossel = setInterval(mudarBannersAutomaticos, 3500);
            }, 1000);
        }

        const nomesBase = [
            "Carlos Silva", "Ana Souza", "Marcos Lima", "Juliana Mendes", "Roberto Santos", 
            "Fernanda Costa", "Lucas Oliveira", "Mariana Rocha", "Paulo Ribeiro", "Camila Duarte",
            "Bruno Souza", "Beatriz Lima", "Gabriel Alves", "Larissa Dias", "Matheus Pinto",
            "Tatiane Rocha", "Rodrigo Mendes", "Vanessa Costa", "Felipe Santos", "Renata Oliveira",
            "Eduardo Lima", "Sabrina Souza", "Marcelo Dias", "Letícia Alves", "Vinicius Pinto",
            "Bianca Rocha", "Thiago Mendes", "Patrícia Costa", "Alexandre Santos", "Amanda Oliveira"
        ];

        let modalidadeAtual = 'Cobrinha';

        function obterDadosJogo(modalidade) {
            // Mapeia rigidamente as chaves exclusivas para evitar mistura de pontuação
            let chavesPossiveis = [];
            if (modalidade === 'Memória') {
                chavesPossiveis = ['ranking_memoria', 'ranking_memoria.html', 'memoria_ranking', 'ranking_jogo_memoria', 'memoria'];
            } else if (modalidade === 'Jankeipo') {
                chavesPossiveis = ['ranking_jankeipo', 'ranking_jokenpo', 'ranking_jokenp_brasil', 'jankeipo', 'jokenpo'];
            } else if (modalidade === 'Cobrinha') {
                chavesPossiveis = ['ranking_cobrinha', 'ranking_snake', 'cobrinha', 'snake'];
            } else if (modalidade === 'Forca') {
                chavesPossiveis = ['ranking_forca', 'forca'];
            } else {
                chavesPossiveis = [`ranking_${modalidade.toLowerCase()}`];
            }

            let lista = [];
            for (let chave of chavesPossiveis) {
                let dadosSalvos = JSON.parse(localStorage.getItem(chave) || "[]");
                if (Array.isArray(dadosSalvos) && dadosSalvos.length > 0) {
                    lista = dadosSalvos;
                    break;
                }
            }

            // Se o jogo de memória (ou qualquer outro) salvou a pontuação de forma isolada, garante a leitura correta
            // Preenche o restante até 30 com pontuações padrão caso precise
            if (lista.length < 30) {
                nomesBase.forEach((nome, idx) => {
                    if (lista.length < 30) {
                        let ptsBaixos = Math.max(5, (30 - idx) * 3);
                        if (!lista.some(item => item.nome === nome)) {
                            lista.push({ nome: nome, pontos: ptsBaixos });
                        }
                    }
                });
            }

            // Ordena estritamente do maior para o menor e retorna os 30 primeiros
            lista.sort((a, b) => Number(b.pontos) - Number(a.pontos));
            return lista.slice(0, 30);
        }

        function mudarAba(modalidade, elementoBtn) {
            modalidadeAtual = modalidade;
            document.querySelectorAll('.aba-btn').forEach(btn => btn.classList.remove('active'));
            elementoBtn.classList.add('active');

            let dados = obterDadosJogo(modalidade);
            let corpo = document.getElementById('corpoTabela');
            let html = "";

            dados.forEach((item, index) => {
                let posClass = index === 0 ? "gold" : index === 1 ? "silver" : index === 2 ? "bronze" : "";
                let posSimbolo = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `${index + 1}.`;
                
                html += `
                    <tr>
                        <td class="pos ${posClass}">${posSimbolo}</td>
                        <td>${item.nome}</td>
                        <td class="pts">${item.pontos} pts</td>
                    </tr>
                `;
            });

            corpo.innerHTML = html;
        }

        // Atualização em tempo real caso jogue e salve na mesma aba aberta
        setInterval(() => {
            mudarAba(modalidadeAtual, document.querySelector('.aba-btn.active'));
        }, 2000);

        window.onload = function() {
            mudarAba('Cobrinha', document.querySelector('.aba-btn'));
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiraAí - Conexões Casuais</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --accent-gradient: linear-gradient(135deg, #f59e0b, #d97706);
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(180deg, #f0f4ff 0%, #f8fafc 100%); 
            display: flex;
            flex-direction: column;
            padding: 10px;
            padding-top: 130px;
            color: var(--text-main);
        }

        .banner-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #e4e4e9;
            padding: 10px 0;
            z-index: 1000;
            overflow-x: auto;
            display: flex;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
        }
        .banner-carousel::-webkit-scrollbar { display: none; }
        .carousel-track {
            display: flex;
            gap: 12px;
            width: max-content;
            padding: 0 12px;
            animation: rolarInfinito 35s linear infinite;
        }
        .banner-carousel:hover .carousel-track,
        .banner-carousel:active .carousel-track {
            animation-play-state: paused;
        }
        .ad-banner-card {
            flex: 0 0 160px;
            height: 100px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 2px dashed #b0bec5;
            cursor: pointer;
        }
        .ad-placeholder-text {
            font-size: 11px;
            color: #555;
            font-weight: bold;
            z-index: 2;
            text-align: center;
            padding: 0 5px;
            background: rgba(255, 255, 255, 0.85);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        .main-header {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .main-header h1 {
            font-size: 18px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 2px 0;
            font-weight: 800;
        }

        .main-header p {
            font-size: 11.5px;
            color: var(--text-secondary);
            margin: 0;
        }

        .gira-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            overflow-y: auto;
        }

        .card-match {
            background: linear-gradient(135deg, #f8fafc, #eff6ff);
            border: 2px dashed #93c5fd;
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .match-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        .match-info h2 {
            font-size: 18px;
            margin: 0 0 4px 0;
            color: var(--text-main);
        }

        .match-info p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .btn-girar {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
            transition: all 0.2s ease;
            width: 100%;
            text-align: center;
        }

        .btn-girar:active { transform: scale(0.98); }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .btn-footer {
            background: var(--surface);
            color: #3b82f6;
            border: 1px solid #bfdbfe;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(59, 130, 246, 0.08);
            flex: 1;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="banner-carousel">
        <div class="carousel-track" id="carouselTrack">
            <div class="ad-banner-card">
                <div class="ad-placeholder-text"><span>🖼️ Anuncie Aqui</span><span style="font-size: 9px; color: #888; margin-top: 2px;">Gira 1</span></div>
            </div>
            <div class="ad-banner-card">
                <div class="ad-placeholder-text"><span>🖼️ Anuncie Aqui</span><span style="font-size: 9px; color: #888; margin-top: 2px;">Gira 2</span></div>
            </div>
        </div>
    </div>

    <div class="main-header">
        <h1>🎲 GiraAí</h1>
        <p>Conexões rápidas de 15 minutos (Modo de Teste: 20 Pessoas)</p>
    </div>

    <div class="gira-container">
        <div class="card-match" id="cardMatch">
            <div class="match-avatar" id="matchAvatar">✨</div>
            <div class="match-info" id="matchInfo">
                <h2>Pronto para girar?</h2>
                <p>Clique abaixo para testar o sorteio entre os 20 usuários simulados.</p>
            </div>
        </div>
        <button class="btn-girar" onclick="girarRoleta()">Girar Agora 🎲</button>
    </div>

    <div class="footer-nav">
        <a href="../chatindex.html" class="btn-footer">⬅️ Menu</a>
        <a href="../index.html" class="btn-footer">🏠 Home</a>
    </div>

    <script>
        // Lista com 20 pessoas de teste para simulação
        const pessoasTeste = [
            { nome: "Mariana Silva", idade: 28, emoji: "👩‍🦰", recado: "Curte um bom churrasco e música sertaneja!" },
            { nome: "Carlos Eduardo", idade: 32, emoji: "👨‍💻", trabajador: "Toyohashi - Fã de tecnologia e viagens." },
            { nome: "Juliana Santos", idade: 25, emoji: "👩‍🎓", recado: "Estudando japonês e amando culinária." },
            { nome: "Rafael Souza", idade: 30, emoji: "👨‍ sport", recado: "Praticante de futebol e churrasco aos domingos." },
            { nome: "Ana Paula", idade: 27, emoji: "👩‍🎨", recado: "Adoro café, fotografia e dias ensolarados." },
            { nome: "Lucas Mendes", idade: 26, emoji: "👨‍🔧", recado: "Trabalha com montagem e curte carros antigos." },
            { nome: "Beatriz Lima", idade: 29, emoji: "👩‍💼", recado: "Buscando novas amizades na região de Aichi." },
            { nome: "Diego Ferreira", idade: 34, emoji: "👨‍🎤", recado: "Karaokê é meu forte! Quem topa cantar?" },
            { nome: "Camila Rocha", idade: 24, emoji: "👩‍⚕️", recado: "Amadora de pets e caminhadas ao ar livre." },
            { nome: "Gabriel Costa", idade: 31, emoji: "👨‍🍳", recado: "Mestre cuca nas horas vagas. Adoro cozinhar." },
            { nome: "Larissa Martins", idade: 26, emoji: "👩‍💻", recado: "Curto maratonar séries e trocar ideia." },
            { nome: "Bruno Ribeiro", idade: 33, emoji: "👨‍🌾", recado: "Curto plantar frutas em vaso e cuidar de plantas." },
            { nome: "Fernanda Dias", idade: 28, emoji: "👩‍🏫", recado: "Professora, adoro ler e conhecer lugares novos." },
            { nome: "Thiago Cardoso", idade: 29, emoji: "👨‍🎨", recado: "Curto design, arte urbana e café forte." },
            { nome: "Patrícia Ramos", idade: 35, emoji: "👩‍🍳", recado: "Fã de doces caseiros e boa conversa." },
            { nome: "Rodrigo Nunes", idade: 27, emoji: "👨‍🚀", recado: "Fascinado por astronomia e tecnologia." },
            { nome: "Vanessa Melo", idade: 26, emoji: "👩‍🎤", recado: "Sempre ouvindo música boa e curtindo o fim de semana." },
            { nome: "Marcos Vinicius", idade: 30, emoji: "👨‍🔧", recado: "Apaixonado por motos e viagens longas." },
            { nome: "Renata Souza", idade: 32, emoji: "👩‍🌾", recado: "Amante da natureza e cultivo orgânico." },
            { nome: "Alexandre Pinto", idade: 28, emoji: "👨‍💻", recado: "Bate-papo leve e descontraído por 15 minutos!" }
        ];

        function girarRoleta() {
            const avatarEl = document.getElementById('matchAvatar');
            const infoEl = document.getElementById('matchInfo');
            const cardEl = document.getElementById('cardMatch');

            // Efeito visual rápido de sorteio
            cardEl.style.opacity = '0.5';
            infoEl.innerHTML = `<h2>🎲 Sorteando entre 20 pessoas...</h2><p>Buscando conexão compatível...</p>`;
            avatarEl.innerHTML = '💫';

            setTimeout(() => {
                // Sorteia aleatoriamente uma das 20 pessoas
                const pessoaSorteada = pessoasTeste[Math.floor(Math.random() * pessoasTeste.length)];

                cardEl.style.opacity = '1';
                avatarEl.innerHTML = pessoaSorteada.emoji;
                infoEl.innerHTML = `
                    <h2>${pessoa Sorteada = pessoaSorteada.nome}, ${pessoa Sorteada.idade || pessoaSorteada.idade} anos</h2>
                    <p style="margin-top: 4px; color: #1e3a8a; font-weight: 600;">"${pessoa Sorteada.recado}"</p>
                    <p style="margin-top: 8px; font-size: 11px; color: #059669;">🟢 Disponível para papo de 15 min</p>
                `;
            }, 500);
        }

        function configurarCarrosselInfinito() {
            const track = document.getElementById('carouselTrack');
            if (!track || track.dataset.initialized === "true") return;
            
            const items = Array.from(track.children);
            items.forEach(item => {
                const clone = item.cloneNode(true);
                track.appendChild(clone);
            });
            
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
            track.dataset.initialized = "true";
        }

        window.addEventListener('load', configurarCarrosselInfinito);
    </script>
</body>
</html>

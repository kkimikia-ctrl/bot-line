<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiraAí</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --radius-md: 14px;
            --radius-sm: 10px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(180deg, #f0f4ff 0%, #f8fafc 100%); 
            display: flex;
            flex-direction: column;
            padding: 16px;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }
        .container {
            background: var(--surface);
            max-width: 480px;
            width: 100%;
            padding: 24px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            text-align: center;
        }
        h1 { color: #2563eb; font-size: 24px; margin-bottom: 8px; }
        p { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
        .btn-voltar {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .btn-voltar:active { background: #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 GiraAí</h1>
        <p>Conexões casuais 1x1 de 15 minutos com pessoas de várias regiões.</p>
        <button class="btn-voltar" onclick="window.location.href = window.location.origin + '/';">Voltar ao Menu</button>
    </div>
</body>
</html>

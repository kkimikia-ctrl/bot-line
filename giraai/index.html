<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espaço de Comunicação</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(180deg, #f0f4ff 0%, #f8fafc 100%); 
            display: flex;
            flex-direction: column;
            padding: 10px;
            padding-top: 125px;
            color: var(--text-main);
        }

        /* Banner Carrossel Fixo */
        .banner-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #e4e4e9;
            padding: 10px 0;
            z-index: 1000;
            overflow-x: auto;
            display: flex;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
        }
        .banner-carousel::-webkit-scrollbar { display: none; }
        .carousel-track {
            display: flex;
            gap: 12px;
            width: max-content;
            padding: 0 12px;
            animation: rolarInfinito 35s linear infinite;
        }
        .ad-banner-card {
            flex: 0 0 160px;
            height: 100px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #b0bec5;
        }
        .ad-placeholder-text {
            font-size: 11px;
            color: #555;
            font-weight: bold;
            text-align: center;
            padding: 0 5px;
            background: rgba(255, 255, 255, 0.85);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        /* Container Principal */
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;

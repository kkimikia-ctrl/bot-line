<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Craque</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; }
        .card-game { background: white; padding: 15px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        canvas#gameCanvas { border: 4px solid #2e7d32; background-color: #2e7d32; cursor: pointer; border-radius: 8px; display: block; margin: 0 auto 10px auto; touch-action: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-game">
            <button onclick="window.location.href='../index.html'" style="background: #ccc; border: none; padding: 6px 12px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: left; font-weight: bold;">⬅ Voltar ao Menu</button>
            <div style="clear: both;"></div>
            <div style="background: #2e7d32; color: white; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 13px; font-weight: bold;">
                <span>⚽ Pontos: <span id="minicraque-score">0</span></span>
                <span>Tentativas: <span id="minicraque-attempts">3</span></span>
            </div>
            <canvas id="gameCanvas" width="360" height="500"></canvas>
            <p style="font-size: 11px; color: #666; margin: 5px 0 0 0;">Puxe a bola para trás e solte para chutar!</p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
        let score = 0, attempts = 3, interval = null;
        const ball = { x: 180, y: 410, startX: 180, startY: 410, radius: 12, vx: 0, vy: 0, isDragging: false, isMoving: false };
        const keeper = { x: 140, y: 30, width: 70, height: 16, speed: 2.4, direction: 1, minX: 90, maxX: 270 };

        function loop() {
            if (ball.isMoving) {
                ball.x += ball.vx; ball.y += ball.vy; ball.vy *= 0.99;
                if (ball.x - ball.radius < 30 || ball.x + ball.radius > 330) ball.vx *= -1;
                if (ball.y <= 45 && ball.x >= 90 && ball.x <= 270) {
                    score += 10; document.getElementById('minicraque-score').innerText = score; resetBall();
                }
                if (ball.x > keeper.x && ball.x < keeper.x + keeper.width && ball.y - ball.radius < keeper.y + keeper.height) miss();
                if (ball.y < 0 || ball.y > 500) { if (ball.y > 0) miss(); else resetBall(); }
            }
            keeper.x += keeper.speed * keeper.direction;
            if (keeper.x <= keeper.minX || keeper.x + keeper.width >= keeper.maxX) keeper.direction *= -1;

            ctx.fillStyle = '#2e7d32'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.strokeRect(30, 30, 300, 440); ctx.strokeRect(90, 30, 180, 70);
            ctx.fillStyle = '#64748b'; ctx.fillRect(keeper.x, keeper.y, keeper.width, keeper.height);
            if (ball.isDragging) {
                ctx.beginPath(); ctx.moveTo(ball.startX, ball.startY);
                ctx.lineTo(ball.startX + (ball.startX - ball.x), ball.startY + (ball.startY - ball.y));
                ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
            interval = requestAnimationFrame(loop);
        }
        function miss() {
            attempts--; document.getElementById('minicraque-attempts').innerText = attempts;
            if (attempts <= 0) { alert('Fim de jogo! Pontuação: ' + score); score = 0; attempts = 3; document.getElementById('minicraque-score').innerText = score; document.getElementById('minicraque-attempts').innerText = attempts; }
            resetBall();
        }
        function resetBall() { ball.isMoving = false; ball.isDragging = false; ball.x = ball.startX; ball.y = ball.startY; ball.vx = 0; ball.vy = 0; }
        
        function getPos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.touches ? e.touches[0].clientX : e.clientX) - r.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - r.top }; }
        canvas.addEventListener('mousedown', e => { if (!ball.isMoving && Math.hypot(getPos(e).x - ball.x, getPos(e).y - ball.y) < 30) ball.isDragging = true; });
        canvas.addEventListener('mousemove', e => { if (ball.isDragging) { let p = getPos(e); ball.x = p.x; ball.y = p.y; } });
        canvas.addEventListener('mouseup', () => { if (ball.isDragging) { ball.isDragging = false; ball.isMoving = true; ball.vx = (ball.startX - ball.x) * 0.18; ball.vy = (ball.startY - ball.y) * 0.18; ball.x = ball.startX; ball.y = ball.startY; } });
        
        loop();
    </script>
</body>
</html>

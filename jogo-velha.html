<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Forca</title>
    <!-- Importando o Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; }
        .card-game { background: white; padding: 15px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .action-btn { background-color: #2563eb; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .painel-info { display: flex; justify-content: space-around; background: #e0f2fe; padding: 8px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; font-size: 14px; color: #0369a1; }
        .letra-btn { width: 35px; height: 35px; font-size: 16px; font-weight: bold; margin: 3px; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; }
        .letra-btn:disabled { background: #cbd5e1; opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-game">
            <button onclick="window.location.href='central.html'" style="background: #ccc; border: none; padding: 6px 12px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: left; font-weight: bold;">⬅ Voltar</button>
            <div style="clear: both;"></div>
            <h3 style="color: #0047ab; margin: 5px 0;">🎯 Jogo da Forca </h3>
            
            <div id="forca-area-jogo">
                <div class="painel-info">
                    <div>❌ Erros: <span id="txt-erros">0</span>/6</div>
                    <div>🏆 Pontos: <span id="txt-pontos">0</span></div>
                </div>

                <div style="font-size: 13px; color: #64748b; margin-bottom: 5px;">Dica: <span id="txt-dica" style="font-weight: bold; color: #0f172a;">-</span></div>
                
                <!-- Desenho da Forca Simplificado -->
                <div style="font-family: monospace; font-size: 20px; background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 10px; letter-spacing: 2px;" id="txt-palavra">
                    _ _ _ _ _
                </div>

                <div id="teclado-letras" style="margin-bottom: 15px; max-width: 350px; margin-left: auto; margin-right: auto;">
                    <!-- Teclado gerado via JS -->
                </div>

                <button onclick="proximaPalavra()" id="btn-proxima" class="action-btn" style="background-color: #16a34a; display: none;">Próxima Palavra ➡️</button>
                
                <!-- Botão Salvar Pontos idêntico ao padrão desejado -->
                <button onclick="salvarPontuacaoFirebase()" id="btn-salvar-manual" class="action-btn" style="background-color: #0284c7;">💾 Salvar Pontos</button>
                
                <button onclick="reiniciarJogo()" id="btn-reiniciar" class="action-btn" style="background-color: #dc2626; display: none;">Jogar Novamente</button>
            </div>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
            authDomain: "ajuda-jp.firebaseapp.com",
            projectId: "ajuda-jp",
            storageBucket: "ajuda-jp.firebasestorage.app",
            messagingSenderId: "40121072206",
            appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const listaPalavras = [
            { palavra: "PROGRAMACAO", dica: "Desenvolvimento de softwares" },
            { palavra: "COMPUTADOR", dica: "Máquina usada para trabalhar e jogar" },
            { palavra: "FUTEBOL", dica: "Esporte mais popular do mundo" },
            { palavra: "INTERNET", dica: "Rede mundial de computadores" },
            { palavra: "GATO", dica: "Animal felino de estimação" },
            { palavra: "BANANA", dica: "Fruta amarela rica em potássio" },
            { palavra: "ESCOLA", dica: "Lugar onde aprendemos" },
            { palavra: "PIANO", dica: "Instrumento musical de teclas" }
        ];

        let palavraSecreta = "";
        let dicaAtual = "";
        let letrasDescobertas = [];
        let erros = 0;
        let pontos = 0;

        function iniciarJogo() {
            erros = 0;
            pontos = 0;
            document.getElementById('txt-pontos').innerText = pontos;
            document.getElementById('btn-salvar-manual').style.display = 'block';
            document.getElementById('btn-reiniciar').style.display = 'none';
            sortearPalavra();
        }

        function sortearPalavra() {
            let item = listaPalavras[Math.floor(Math.random() * listaPalavras.length)];
            palavraSecreta = item.palavra;
            dicaAtual = item.dica;
            letrasDescobertas = Array(palavraSecreta.length).fill('_');
            erros = 0;
            
            document.getElementById('txt-erros').innerText = erros;
            document.getElementById('txt-dica').innerText = dicaAtual;
            document.getElementById('btn-proxima').style.display = 'none';
            document.getElementById('btn-salvar-manual').style.display = 'block';
            
            atualizarTela();
            criarTeclado();
        }

        function atualizarTela() {
            document.getElementById('txt-palavra').innerText = letrasDescobertas.join(' ');
        }

        function criarTeclado() {
            let tecladoDiv = document.getElementById('teclado-letras');
            tecladoDiv.innerHTML = '';
            const alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            
            for (let letra of alfabeto) {
                let btn = document.createElement('button');
                btn.innerText = letra;
                btn.className = 'letra-btn';
                btn.id = 'btn-' + letra;
                btn.onclick = () => escolherLetra(letra);
                tecladoDiv.appendChild(btn);
            }
        }

        function escolherLetra(letra) {
            let btn = document.getElementById('btn-' + letra);
            btn.disabled = true;

            if (palavraSecreta.includes(letra)) {
                for (let i = 0; i < palavraSecreta.length; i++) {
                    if (palavraSecreta[i] === letra) {
                        letrasDescobertas[i] = letra;
                    }
                }
                atualizarTela();

                if (!letrasDescobertas.includes('_')) {
                    pontos += 20;
                    document.getElementById('txt-pontos').innerText = pontos;
                    document.getElementById('btn-proxima').style.display = 'block';
                    desativarTeclado();
                }
            } else {
                erros++;
                document.getElementById('txt-erros').innerText = erros;
                if (erros >= 6) {
                    document.getElementById('txt-palavra').innerText = palavraSecreta.split('').join(' ');
                    document.getElementById('btn-salvar-manual').style.display = 'none';
                    document.getElementById('btn-reiniciar').style.display = 'block';
                    desativarTeclado();
                }
            }
        }

        function desativarTeclado() {
            const botoes = document.querySelectorAll('.letra-btn');
            botoes.forEach(b => b.disabled = true);
        }

        function proximaPalavra() {
            sortearPalavra();
        }

        function reiniciarJogo() {
            iniciarJogo();
        }

        function salvarPontuacaoFirebase() {
            let nomeSalvo = localStorage.getItem('nomeJogadorCentral') || "Jogador";
            let nomeJogador = prompt("🏆 Digite seu nome para o Ranking Global:", nomeSalvo);
            
            if (!nomeJogador || nomeJogador.trim() === "") return;
            
            localStorage.setItem('nomeJogadorCentral', nomeJogador);
            
            const idUnicoDoc = `${nomeJogador}_${Date.now()}`;
            db.collection("ranking_forca").doc(idUnicoDoc).set({
                nome: nomeJogador.trim(),
                pontos: Number(pontos),
                data: new Date().toISOString()
            })
            .then(() => {
                let irRanking = confirm("✅ Pontuação salva com sucesso no Ranking Global!\n\nDeseja ir para a página do Ranking?");
                
                if (irRanking) {
                    localStorage.setItem('ultimoJogoRetorno', 'forca.html');
                    window.location.href = "ranking.html";
                }
            })
            .catch((error) => {
                console.error("Erro ao salvar: ", error);
                alert("❌ Erro ao salvar pontuação no ranking.");
            });
        }

        // Inicializa o jogo automaticamente ao carregar a página
        window.onload = function() {
            iniciarJogo();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Velha</title>
    <!-- Importando o Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; }
        .card-game { background: white; padding: 15px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .action-btn { background-color: #2563eb; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .painel-info { display: flex; justify-content: space-around; background: #e0f2fe; padding: 8px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; font-size: 14px; color: #0369a1; }

        /* --- CARROSSEL INFINITO DINÂMICO --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 30s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #eee;
            border: 1px solid #ddd;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-game">
            <!-- Botão Voltar para a forca.html -->
            <button onclick="window.location.href='forca.html'" style="background: #ccc; border: none; padding: 6px 12px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: left; font-weight: bold;">⬅ Voltar</button>
            <div style="clear: both;"></div>
            
            <!-- Carrossel Infinito -->
            <section class="carousel-container">
                <div class="carousel-track" id="carouselTrack">
                    <a href="fale-conosco.html"><img src="mini-banner-1.jpg" alt="Destaque 1"></a>
                    <a href="fale-conosco.html"><img src="mini-banner-2.jpg" alt="Destaque 2"></a>
                    <a href="fale-conosco.html"><img src="mini-banner-3.jpg" alt="Destaque 3"></a>
                    <a href="fale-conosco.html"><img src="mini-banner-4.jpg" alt="Destaque 4"></a>
                </div>
            </section>

            <h3 style="color: #0047ab; margin: 5px 0;">❌ Jogo da Velha ⭕</h3>
            
            <!-- Tela de Início: Escolha de Modo -->
            <div id="velha-modo-escolha" style="margin: 15px 0;">
                <p style="font-weight: bold; margin-top: 15px;">Escolha o modo:</p>
                <button onclick="iniciarJogoCompleto('amigo')" class="action-btn" style="background-color: #00796b;">👥 Jogar com Amigo</button>
                <button onclick="iniciarJogoCompleto('pc')" class="action-btn">🤖 Jogar contra PC</button>
            </div>

            <!-- Tela do Jogo -->
            <div id="velha-area-jogo" style="display: none;">
                <div class="painel-info">
                    <div>❤️ Vidas: <span id="txt-vidas">2</span></div>
                    <div>🏆 Pontos: <span id="txt-pontos">0</span></div>
                </div>

                <div style="font-weight: bold; margin-bottom: 10px;"><span id="status-jogo">Vez do X</span></div>
                
                <div style="display: grid; grid-template-columns: repeat(3, 85px); gap: 5px; justify-content: center; margin-bottom: 15px;">
                    <button onclick="jogar(0)" id="c-0" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                    <button onclick="jogar(1)" id="c-1" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                    <button onclick="jogar(2)" id="c-2" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                    <button onclick="jogar(3)" id="c-3" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                    <button onclick="jogar(4)" id="c-4" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                    <button onclick="jogar(5)" id="c-5" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                    <button onclick="jogar(6)" id="c-6" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                    <button onclick="jogar(7)" id="c-7" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                    <button onclick="jogar(8)" id="c-8" style="width: 85px; height: 85px; font-size: 32px; font-weight: bold; background: #fff; border: 2px solid #2563eb; border-radius: 8px; cursor: pointer;"></button>
                </div>

                <button onclick="proximaRodada()" id="btn-proxima" class="action-btn" style="background-color: #16a34a; display: none;">Próxima Partida ➡️</button>
                
                <!-- Botão para Salvar Pontos -->
                <button onclick="salvarPontuacaoFirebase()" id="btn-salvar-manual" class="action-btn" style="background-color: #0284c7;">💾 Salvar Pontos</button>
                
                <button onclick="reiniciarTudo()" id="btn-reiniciar" class="action-btn" style="background-color: #dc2626; display: none;">Jogar Novamente</button>
            </div>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
            authDomain: "ajuda-jp.firebaseapp.com",
            projectId: "ajuda-jp",
            storageBucket: "ajuda-jp.firebasestorage.app",
            messagingSenderId: "40121072206",
            appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let modo = 'amigo', tabuleiro = ['', '', '', '', '', '', '', '', ''], atual = 'X', ativo = true;
        let vidas = 2;
        let pontos = 0;

        function iniciarJogoCompleto(m) {
            modo = m;
            vidas = 2;
            pontos = 0;
            document.getElementById('txt-vidas').innerText = vidas;
            document.getElementById('txt-pontos').innerText = pontos;
            document.getElementById('btn-salvar-manual').style.display = 'block';
            document.getElementById('velha-modo-escolha').style.display = 'none';
            document.getElementById('velha-area-jogo').style.display = 'block';
            limparTabuleiro();
        }

        function limparTabuleiro() {
            tabuleiro = ['', '', '', '', '', '', '', '', ''];
            atual = 'X';
            ativo = true;
            document.getElementById('status-jogo').innerText = 'Vez do X';
            document.getElementById('btn-proxima').style.display = 'none';
            document.getElementById('btn-reiniciar').style.display = 'none';
            for (let i = 0; i < 9; i++) document.getElementById(`c-${i}`).innerText = '';
        }

        function jogar(i) {
            if (tabuleiro[i] === '' && ativo) {
                tabuleiro[i] = atual;
                document.getElementById(`c-${i}`).innerText = atual;
                let win = checarVitoria();
                
                if (win) {
                    ativo = false;
                    if (atual === 'X') {
                        pontos += 10;
                        document.getElementById('status-jogo').innerText = `🎉 Você Venceu a Rodada! (+10 pts)`;
                        document.getElementById('txt-pontos').innerText = pontos;
                        document.getElementById('btn-proxima').style.display = 'block';
                    } else {
                        vidas--;
                        document.getElementById('txt-vidas').innerText = vidas;
                        if (vidas > 0) {
                            document.getElementById('status-jogo').innerText = `⚠️ Você Perdeu a Rodada! (-1 Vida)`;
                            document.getElementById('btn-proxima').style.display = 'block';
                        } else {
                            document.getElementById('status-jogo').innerText = `💀 Game Over! Fim de Vidas.`;
                            document.getElementById('btn-salvar-manual').style.display = 'none';
                            document.getElementById('btn-reiniciar').style.display = 'block';
                        }
                    }
                    return;
                }

                if (!tabuleiro.includes('')) {
                    document.getElementById('status-jogo').innerText = `Empate! Nova rodada.`;
                    ativo = false;
                    document.getElementById('btn-proxima').style.display = 'block';
                    return;
                }

                atual = atual === 'X' ? 'O' : 'X';
                document.getElementById('status-jogo').innerText = `Vez do ${atual}`;
                if (modo === 'pc' && atual === 'O' && ativo) setTimeout(jogadaPC, 400);
            }
        }

        function jogadaPC() {
            let vazias = []; tabuleiro.forEach((v, i) => { if (v === '') vazias.push(i); });
            if (vazias.length > 0) jogar(vazias[Math.floor(Math.random() * vazias.length)]);
        }

        function checarVitoria() {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let c of w) { if (tabuleiro[c[0]] && tabuleiro[c[0]] === tabuleiro[c[1]] && tabuleiro[c[0]] === tabuleiro[c[2]]) return c; }
            return null;
        }

        function proximaRodada() {
            if (vidas > 0) {
                limparTabuleiro();
            }
        }

        function reiniciarTudo() {
            document.getElementById('velha-area-jogo').style.display = 'none';
            document.getElementById('velha-modo-escolha').style.display = 'block';
        }

        async function salvarPontuacaoFirebase() {
            if (pontos <= 0) {
                alert("Você precisa fazer alguns pontos antes de salvar!");
                return;
            }

            let nomeSalvo = localStorage.getItem('nomeJogadorCentral') || "Jogador";
            let nomeJogador = prompt("🏆 Digite seu nome para o Ranking Global:", nomeSalvo);
            
            if (!nomeJogador || nomeJogador.trim() === "") return;
            
            nomeJogador = nomeJogador.trim();
            localStorage.setItem('nomeJogadorCentral', nomeJogador);

            try {
                const colecaoRef = db.collection("ranking_velha");

                const querySnapshot = await colecaoRef.orderBy("pontos", "desc").limit(100).get();
                
                let pontuacoesTop = [];
                querySnapshot.forEach((docSnap) => {
                    pontuacoesTop.push(docSnap.data().pontos);
                });

                if (pontuacoesTop.length >= 100) {
                    const menorPontuacaoTop100 = pontuacoesTop[pontuacoesTop.length - 1];
                    
                    if (pontos <= menorPontuacaoTop100) {
                        alert(`Sua pontuação (${pontos}) não atingiu o mínimo necessário para entrar no Top 100 (mínimo atual: ${menorPontuacaoTop100} pts). Tente novamente!`);
                        return;
                    }
                }

                const idUnicoDoc = `${nomeJogador}_${Date.now()}`;
                await colecaoRef.doc(idUnicoDoc).set({
                    nome: nomeJogador,
                    pontos: Number(pontos),
                    data: new Date().toISOString()
                });
                
                localStorage.setItem('ultimoJogoRetorno', 'jogo-velha.html');

                alert("✅ Parabéns! Sua pontuação entrou para o Top 100 Global!");
                window.location.href = "ranking.html";
            } catch (error) {
                console.error("Erro ao salvar no Firebase:", error);
                alert("❌ Erro ao salvar pontuação online.");
            }
        }

        // Script do Carrossel Infinito
        const track = document.getElementById('carouselTrack');
        const items = Array.from(track.children);
        
        items.forEach(item => {
            const clone = item.cloneNode(true);
            track.appendChild(clone);
        });

        window.addEventListener('load', () => {
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
        });
    </script>
</body>
</html>

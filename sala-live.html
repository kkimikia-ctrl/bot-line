<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Transmissão Ao Vivo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .live-header {
            background-color: #1a1a1a;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        .btn-voltar {
            background: #333;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .live-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }
        .badge-aovivo {
            background-color: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .video-container {
            width: 100%;
            background-color: #000;
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 50vh;
        }
        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #222;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .interaction-area {
            background: #18181b;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 40vh;
        }
        .chat-box {
            flex-grow: 1;
            background: #111;
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            font-size: 12px;
            color: #ccc;
            text-align: left;
        }
        .chat-msg {
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .chat-msg span {
            color: #60a5fa;
            font-weight: bold;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .btn-acao {
            flex: 1;
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-acao.presente {
            background-color: #d97706;
        }

        /* Modo Paisagem (Quando vira o celular deitado) */
        @media (min-aspect-ratio: 4/3) {
            body {
                flex-direction: row;
            }
            .live-header {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.6);
                border: none;
            }
            .video-container {
                max-height: 100vh;
                height: 100vh;
                width: 70%;
            }
            .interaction-area {
                width: 30%;
                height: 100vh;
                padding-top: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="live-header">
        <button class="btn-voltar" onclick="window.location.href='lives.html'">⬅ Sair</button>
        <h2 class="live-title" id="displayTema">Carregando Live...</h2>
        <div class="badge-aovivo">AO VIVO</div>
    </div>

    <div class="video-container">
        <div class="video-placeholder">
            🎥 Transmissão ao Vivo<br><br><small style="color: #666;">(Gire o celular para o modo paisagem para expandir)</small>
        </div>
    </div>

    <div class="interaction-area">
        <div class="chat-box" id="chatBox">
            <div class="chat-msg"><span>Sistema:</span> Bem-vindo à transmissão!</div>
            <div class="chat-msg"><span>Carlos_JP:</span> Boa noite a todos!</div>
            <div class="chat-msg"><span>Mariana:</span> Excelente conteúdo! 👏</div>
        </div>
        <div class="action-buttons">
            <button class="btn-acao presente" onclick="alert('Abrindo opções de presentes...')">🎁 Presente</button>
            <button class="btn-acao" onclick="alert('Digite seu comentário...')">💬 Comentar</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const temaLive = urlParams.get('tema');
        
        if (temaLive) {
            document.getElementById('displayTema').innerText = decodeURIComponent(temaLive);
        } else {
            document.getElementById('displayTema').innerText = "Live da Comunidade";
        }
    </script>
</body>
</html>

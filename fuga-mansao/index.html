<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuga da Mansão</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111; color: #eee; padding: 15px; text-align: center; margin: 0; }
        #timer { font-size: 22px; color: #ff4444; font-weight: bold; margin-bottom: 10px; }
        #game-box { background: #222; padding: 15px; border-radius: 8px; max-width: 400px; margin: 0 auto; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #narrativa { min-height: 100px; margin-bottom: 15px; line-height: 1.4; font-size: 14px; }
        .botoes-rapidos { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        button, input { width: 100%; padding: 10px; border-radius: 5px; border: none; font-size: 14px; box-sizing: border-box; }
        .btn-acao { background: #444; color: #fff; cursor: pointer; text-align: left; }
        .btn-acao:hover { background: #555; }
        input { background: #333; color: #fff; margin-bottom: 8px; }
        #btn-enviar { background: #d9534f; color: white; font-weight: bold; cursor: pointer; }
        #btn-enviar:hover { background: #c9302c; }
    </style>
</head>
<body>

    <div id="timer">Tempo Restante: 60:00</div>

    <div id="game-box">
        <h3>Mansão Misteriosa</h3>
        <div id="narrativa">
            Você acorda trancado em uma sala escura. Há uma lareira moribunda, uma estante de livros, uma mesa de centro com um gravador e uma porta de ferro trancada. O que você faz?
        </div>

        <!-- Botões de ação rápida para celular -->
        <div class="botoes-rapidos">
            <button class="btn-acao" onclick="escolherAcao('Mexer na estante de livros')">📚 Mexer na estante de livros</button>
            <button class="btn-acao" onclick="escolherAcao('Inspecionar a lareira')">🔥 Inspecionar a lareira</button>
            <button class="btn-acao" onclick="escolherAcao('Ouvir o gravador na mesa')">📻 Ouvir o gravador na mesa</button>
            <button class="btn-acao" onclick="escolherAcao('Examinar o cadeado da porta')">🔒 Examinar o cadeado da porta</button>
        </div>

        <!-- Opção de digitar livremente -->
        <input type="text" id="acaoUsuario" placeholder="Ou digite outra coisa aqui...">
        <button id="btn-enviar" onclick="enviarTextoLivre()">Executar Ação</button>
    </div>

    <script>
        function escolherAcao(textoAcao) {
            document.getElementById('acaoUsuario').value = textoAcao;
            enviarTextoLivre();
        }

        function enviarTextoLivre() {
            const acao = document.getElementById('acaoUsuario').value;
            if (!acao) return;

            document.getElementById('narrativa').innerText = "Processando sua escolha: '" + acao + "'...";

            setTimeout(() => {
                document.getElementById('narrativa').innerText = "Você realizou a ação. O ambiente reage ao que você fez... O que deseja fazer agora?";
                document.getElementById('acaoUsuario').value = '';
            }, 1000);
        }
    </script>

</body>
</html>

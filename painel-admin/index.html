<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Login</title>
    <!-- Tailwind CSS para deixar bonito rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

    <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-96 border border-gray-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Painel Admin</h2>
        
        <!-- Formulário de Login -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">E-mail</label>
                <input type="email" id="email" required 
                    class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Senha</label>
                <input type="password" id="password" required 
                    class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200">
                Entrar
            </button>
        </form>

        <p id="error-message" class="text-red-400 text-sm mt-4 text-center hidden"></p>
    </div>

    <!-- Scripts do Firebase (versão modular compatível) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Configurações do Firebase do seu projeto
        const firebaseConfig = {
            apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
            authDomain: "ajuda-jp.firebaseapp.com",
            projectId: "ajuda-jp",
            storageBucket: "ajuda-jp.firebasestorage.app",
            messagingSenderId: "40121072206",
            appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Tenta fazer o login no Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // CAMADA EXTRA DE SEGURANÇA: Restrito apenas ao seu e-mail
                const meuEmailAdmin = "miha28@outlook.jp"; 

                if (user.email !== meuEmailAdmin) {
                    throw new Error("Acesso não autorizado para este e-mail.");
                }

                // Se deu tudo certo, redireciona para a página interna do painel
                alert("Login realizado com sucesso!");
                window.location.href = "dashboard.html"; // Página interna que criaremos depois

            } catch (error) {
                errorMessage.textContent = "Erro ao entrar: " + error.message;
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda JP - Início</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .header {
            background-color: #0047ab;
            color: white;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: white;
            border: 2px solid white;
            flex-shrink: 0;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        h3 {
            margin-top: 0;
            font-size: 16px;
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        button.btn-primary {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn-primary:active {
            background-color: #1d4ed8;
        }
        .result-box {
            background-color: #ecfdf5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 16px;
            white-space: pre-wrap;
            display: none;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .menu-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            border: none;
            font-size: 15px;
            font-weight: bold;
        }
        .menu-item span {
            display: block;
            font-size: 13px;
            color: #666;
            font-weight: normal;
            margin-top: 5px;
        }
        /* Modais */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: left;
        }
        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        /* Tela de Vídeo Direta */
        #videoContainer {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        video {
            width: 100%;
            max-height: 200px;
            background: #000;
            border-radius: 8px;
            object-fit: cover;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="IMG_6589.png" class="logo-img" alt="Logo">
        Ajuda JP - Início
    </div>

    <!-- Bloco de Tradução -->
    <div class="card">
        <h3>📸 Tradução de Texto e Fotos</h3>
        <p style="font-size: 14px; color: #666; margin-top:0;">Digite o texto em japonês ou português para traduzir na hora:</p>
        <textarea id="textoInput" rows="3" placeholder="Digite aqui..."></textarea>
        <button class="btn-primary" onclick="traduzirTexto()">Traduzir Agora</button>
        <div id="resultadoBox" class="result-box"></div>
    </div>

    <!-- Menu Principal -->
    <div class="grid-menu">
        <button class="menu-item" onclick="abrirModalTradutor()">
            📞 Tradutor
            <span>Prefeitura / Hospital</span>
        </button>
        <button class="menu-item" onclick="alert('Tela Carteira em desenvolvimento')">
            💰 Carteira
            <span>Saldo e Ganhos</span>
        </button>
        <button class="menu-item" onclick="alert('Tela Entretenimento e Notícias em desenvolvimento')">
            🎮 Entretenimento
            <span>Lives, Aulas e Notícias</span>
        </button>
        <button class="menu-item" onclick="alert('Tela Serviços em desenvolvimento')">
            📋 Serviços
            <span>Lojas, Ar-condicionado, Mecânico</span>
        </button>
    </div>

    <!-- Modal 1: Questionário do Tradutor -->
    <div id="modalTradutor" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <img src="IMG_6589.png" class="logo-img" alt="Logo">
                <h3 style="margin:0;">Chamar Tradutor</h3>
            </div>

            <label style="font-size: 14px; font-weight: bold;">Onde você está?</label>
            <select id="localAtendimento">
                <option value="Hospital">Hospital</option>
                <option value="Prefeitura">Prefeitura</option>
                <option value="Escola">Escola</option>
                <option value="Outros">Outros</option>
            </select>

            <label style="font-size: 14px; font-weight: bold;">Tempo estimado:</label>
            <select id="tempoAtendimento">
                <option value="30 minutos">30 minutos</option>
                <option value="1 hora">1 hora</option>
                <option value="Mais de 1 hora">Mais de 1 hora</option>
            </select>

            <div class="modal-buttons">
                <button class="btn-primary" style="background-color: #6b7280;" onclick="fecharModalTradutor()">Cancelar</button>
                <button class="btn-primary" onclick="iniciarEspera()">Confirmar Pedido</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Tela de Espera e Vídeo Chamada -->
    <div id="modalEspera" class="modal">
        <div class="modal-content" style="text-align: center;">
            <div class="modal-header" style="justify-content: center;">
                <img src="IMG_6589.png" class="logo-img" alt="Logo">
                <h3 id="statusTexto" style="margin:0;">Procurando tradutor...</h3>
            </div>
            
            <p id="subStatus" style="font-size: 14px; color: #666;">Aguarde um momento enquanto conectamos você.</p>
            
            <div id="videoContainer">
                <video id="webcam" autoplay playsinline muted></video>
                <p style="font-size: 12px; color: #10b981; font-weight: bold; margin-top: 5px;">🟢 Conectado à Sala de Vídeo</p>
            </div>

            <button class="btn-primary" style="background-color: #dc2626; margin-top: 15px;" onclick="cancelarChamada()">Sair / Cancelar</button>
        </div>
    </div>

    <script>
        let streamVideo = null;

        async function traduzirTexto() {
            const texto = document.getElementById('textoInput').value;
            const box = document.getElementById('resultadoBox');

            if (!texto.trim()) {
                alert('Digite algum texto primeiro!');
                return;
            }

            box.style.display = 'block';
            box.innerText = 'Traduzindo...';

            try {
                const resposta = await fetch('/api/traduzir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto })
                });

                const dados = await resposta.json();
                box.innerText = dados.traducao || 'Erro na tradução';
            } catch (e) {
                box.innerText = 'Erro ao conectar com o tradutor.';
            }
        }

        function abrirModalTradutor() {
            document.getElementById('modalTradutor').style.display = 'flex';
        }

        function fecharModalTradutor() {
            document.getElementById('modalTradutor').style.display = 'none';
        }

        function iniciarEspera() {
            fecharModalTradutor();
            const modalEspera = document.getElementById('modalEspera');
            const statusTexto = document.getElementById('statusTexto');
            const subStatus = document.getElementById('subStatus');
            const videoContainer = document.getElementById('videoContainer');
            
            modalEspera.style.display = 'flex';
            statusTexto.innerText = "Procurando tradutor...";
            subStatus.style.display = "block";
            videoContainer.style.display = "none";

            setTimeout(async () => {
                statusTexto.innerText = "Tradutor conectado!";
                subStatus.style.display = "none";
                videoContainer.style.display = "block";

                try {
                    streamVideo = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('webcam').srcObject = streamVideo;
                } catch (err) {
                    subStatus.style.display = "block";
                    subStatus.innerText = "Câmera pronta (Modo Simulação)";
                }
            }, 3000);
        }

        function cancelarChamada() {
            if (streamVideo) {
                streamVideo.getTracks().forEach(track => track.stop());
                streamVideo = null;
            }
            document.getElementById('modalEspera').style.display = 'none';
        }
    </script>

</body>
</html>

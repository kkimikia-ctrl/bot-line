<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda JP - Início</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .header {
            background-color: #0047ab;
            color: white;
            padding: 12px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        h3 {
            margin-top: 0;
            font-size: 16px;
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        button.btn-primary {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn-primary:active {
            background-color: #1d4ed8;
        }
        .result-box {
            background-color: #ecfdf5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 16px;
            white-space: pre-wrap;
            display: none;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .menu-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            border: none;
            font-size: 15px;
            font-weight: bold;
        }
        .menu-item span {
            display: block;
            font-size: 13px;
            color: #666;
            font-weight: normal;
            margin-top: 5px;
        }
        /* Estilos do Modal do Tradutor */
        #modalTradutor {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">Ajuda JP - Início</div>

    <!-- Bloco de Tradução -->
    <div class="card">
        <h3>📸 Tradução de Texto e Fotos</h3>
        <p style="font-size: 14px; color: #666; margin-top:0;">Digite o texto em japonês ou português para traduzir na hora:</p>
        <textarea id="textoInput" rows="3" placeholder="Digite aqui..."></textarea>
        <button class="btn-primary" onclick="traduzirTexto()">Traduzir Agora</button>
        <div id="resultadoBox" class="result-box"></div>
    </div>

    <!-- Menu Principal -->
    <div class="grid-menu">
        <button class="menu-item" onclick="abrirModalTradutor()">
            📞 Tradutor
            <span>Prefeitura / Hospital</span>
        </button>
        <button class="menu-item" onclick="alert('Tela Carteira em desenvolvimento')">
            💰 Carteira
            <span>Saldo e Ganhos</span>
        </button>
        <button class="menu-item" onclick="alert('Tela Entretenimento e Notícias em desenvolvimento')">
            🎮 Entretenimento
            <span>Lives, Aulas e Notícias</span>
        </button>
        <button class="menu-item" onclick="alert('Tela Serviços em desenvolvimento')">
            📋 Serviços
            <span>Lojas, Ar-condicionado, Mecânico</span>
        </button>
    </div>

    <!-- Modal de Chamada do Tradutor -->
    <div id="modalTradutor">
        <div class="modal-content">
            <h3>📞 Chamar Tradutor</h3>
            <label style="font-size: 14px; font-weight: bold;">Onde você está?</label>
            <select id="localAtendimento">
                <option value="Hospital">Hospital</option>
                <option value="Prefeitura">Prefeitura</option>
                <option value="Escola">Escola</option>
                <option value="Outros">Outros</option>
            </select>

            <label style="font-size: 14px; font-weight: bold;">Tempo estimado:</label>
            <select id="tempoAtendimento">
                <option value="30 minutos">30 minutos</option>
                <option value="1 hora">1 hora</option>
                <option value="Mais de 1 hora">Mais de 1 hora</option>
            </select>

            <div class="modal-buttons">
                <button class="btn-primary" style="background-color: #6b7280;" onclick="fecharModalTradutor()">Cancelar</button>
                <button class="btn-primary" onclick="confirmarChamadaTradutor()">Confirmar Pedido</button>
            </div>
        </div>
    </div>

    <script>
        async function traduzirTexto() {
            const texto = document.getElementById('textoInput').value;
            const box = document.getElementById('resultadoBox');

            if (!texto.trim()) {
                alert('Digite algum texto primeiro!');
                return;
            }

            box.style.display = 'block';
            box.innerText = 'Traduzindo...';

            try {
                const resposta = await fetch('/api/traduzir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto })
                });

                const dados = await resposta.json();
                box.innerText = dados.traducao || 'Erro na tradução';
            } catch (e) {
                box.innerText = 'Erro ao conectar com o tradutor.';
            }
        }

        function abrirModalTradutor() {
            document.getElementById('modalTradutor').style.display = 'flex';
        }

        function fecharModalTradutor() {
            document.getElementById('modalTradutor').style.display = 'none';
        }

        function confirmarChamadaTradutor() {
            const local = document.getElementById('localAtendimento').value;
            const tempo = document.getElementById('tempoAtendimento').value;
            
            alert(`Pedido enviado com sucesso!\nLocal: ${local}\nTempo estimado: ${tempo}`);
            fecharModalTradutor();
        }
    </script>

</body>
</html>

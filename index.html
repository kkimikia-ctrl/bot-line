<div class="tradutor-container">
    <h3>Tradutor Oficial (Google Cloud)</h3>
    
    <!-- Caixa onde o usuário digita o texto -->
    <textarea id="textoOrigem" placeholder="Digite o texto aqui..." rows="4" style="width: 100%; padding: 8px;"></textarea>
    
    <br><br>
    
    <!-- Botão para disparar a tradução -->
    <button id="btnTraduzir" style="padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Traduzir
    </button>

    <br><br>

    <!-- Onde o texto traduzido vai aparecer -->
    <div id="resultadoTraducao" style="background: #f1f3f4; padding: 12px; min-height: 50px; border-radius: 4px;">
        <em>A tradução aparecerá aqui...</em>
    </div>
</div>

<script>
    // Cole a sua chave de API oficial do Google Cloud aqui entre aspas
    const GOOGLE_API_KEY = 'SUA_CHAVE_DE_API_DO_GOOGLE';

    document.getElementById('btnTraduzir').addEventListener('click', async () => {
        const texto = document.getElementById('textoOrigem').value;
        const resultadoDiv = document.getElementById('resultadoTraducao');

        if (!texto.trim()) {
            alert('Digite algum texto para traduzir.');
            return;
        }

        resultadoDiv.innerHTML = 'Traduzindo...';

        // URL oficial da API v2 do Google Tradutor
        const url = `https://translation.googleapis.com/language/translate/v2?key=${GOOGLE_API_KEY}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    q: texto,
                    target: 'ja', // Idioma de destino (ex: 'ja' para japonês)
                    format: 'text'
                })
            });

            const data = await response.json();

            if (data.error) {
                resultadoDiv.innerHTML = `<span style="color: red;">Erro do Google: ${data.error.message}</span>`;
            } else {
                // Pega o texto traduzido retornado pelo Google
                const textoTraduzido = data.data.translations[0].translatedText;
                resultadoDiv.innerText = textoTraduzido;
            }
        } catch (error) {
            resultadoDiv.innerHTML = `<span style="color: red;">Erro de conexão com a API do Google.</span>`;
            console.error(error);
        }
    });
</script>

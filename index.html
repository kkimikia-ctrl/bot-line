<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda JP - Início</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #0047ab;
            color: white;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
        }
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        textarea {
            width: 100%;
            height: 90px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .resultado {
            margin-top: 12px;
            padding: 10px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            font-size: 14px;
            color: #166534;
            display: none;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .menu-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="header">Ajuda JP - Início</div>

    <div class="container">
        <!-- Bloco de Tradução -->
        <div class="card">
            <h3>📷 Tradução de Texto e Fotos</h3>
            <p style="font-size: 13px; color: #666;">Digite o texto em japonês ou português para traduzir na hora:</p>
            
            <textarea id="textoInput" placeholder="Digite aqui o texto em japonês ou português..."></textarea>
            
            <button class="btn" onclick="traduzirTexto()">Traduzir Agora</button>
            
            <div id="resultadoBox" class="resultado"></div>
        </div>

        <!-- Menu de Atalhos -->
        <div class="grid">
            <div class="menu-card">
                <h4>📞 Tradutor</h4>
                <p style="font-size: 12px; color: #777;">Prefeitura / Hospital</p>
            </div>
            <div class="menu-card">
                <h4>💰 Carteira</h4>
                <p style="font-size: 12px; color: #777;">Saldo e Ganhos</p>
            </div>
            <div class="menu-card">
                <h4>🎮 Entretenimento</h4>
                <p style="font-size: 12px; color: #777;">Lives e Aulas</p>
            </div>
            <div class="menu-card">
                <h4>📋 Serviços</h4>
                <p style="font-size: 12px; color: #777;">Lojas, Imobiliárias</p>
            </div>
        </div>
    </div>

    <script>
        async function traduzirTexto() {
            const texto = document.getElementById('textoInput').value;
            const box = document.getElementById('resultadoBox');

            if (!texto.trim()) {
                alert('Digite algum texto primeiro!');
                return;
            }

            box.style.display = 'block';
            box.innerText = 'Traduzindo...';

            try {
                const resposta = await fetch('/api/traduzir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto })
                });

                const dados = await resposta.json();
                box.innerText = 'Tradução: ' + dados.traducao;
            } catch (e) {
                box.innerText = 'Erro ao traduzir. Tente novamente.';
            }
        }
    </script>

</body>
</html>

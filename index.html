<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda JP</title>
    <!-- Seus estilos CSS originais -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            text-align: center;
        }
        .user-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 20px auto;
        }
        .user-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>Bem-vindo ao Ajuda JP</h1>
    <p>O seu assistente para brasileiros no Japão</p>

    <!-- Área onde o perfil do LINE pode ser exibido se necessário, ou mantido oculto/integrado -->
    <div class="user-card" id="user-info" style="display: none;">
        <img id="user-photo" src="" alt="Foto de Perfil">
        <h3 id="user-name">Carregando...</h3>
        <p>ID: <span id="user-id"></span></p>
    </div>

    <!-- Seus botões de navegação originais -->
    <div style="margin-top: 30px;">
        <a href="perfil.html" style="text-decoration: none; background: #06C755; color: white; padding: 12px 20px; border-radius: 5px; font-weight: bold;">Ir para Meu Perfil / Carteira</a>
    </div>

    <!-- SDK do LIFF do LINE -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // Inicializa o LIFF com o seu LIFF ID do Vercel
        liff.init({
            liffId: "2010902449-KWNNNsxn"
        }).then(() => {
            if (liff.isLoggedIn()) {
                // Puxa os dados do usuário logado no LINE em segundo plano
                liff.getProfile().then(profile => {
                    const userId = profile.userId;
                    const nomeUsuario = profile.displayName;
                    const fotoPerfil = profile.pictureUrl;
                    
                    // Atualiza os elementos caso eles existam na tela
                    const nameEl = document.getElementById('user-name');
                    const idEl = document.getElementById('user-id');
                    const photoEl = document.getElementById('user-photo');
                    
                    if (nameEl) nameEl.innerText = nomeUsuario;
                    if (idEl) idEl.innerText = userId;
                    if (photoEl && fotoPerfil) photoEl.src = fotoPerfil;

                    console.log("Usuário logado com sucesso:", nomeUsuario);
                }).catch(err => {
                    console.error("Erro ao buscar perfil:", err);
                });
            } else {
                // Se abrir fora do LINE, força a tela de login
                liff.login();
            }
        }).catch(err => {
            console.error("Erro ao inicializar o LIFF:", err);
        });
    </script>
</body>
</html>

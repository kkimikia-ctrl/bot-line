<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda da Semana</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            padding-top: 65px;
            padding-bottom: 20px;
            color: #1e293b;
            overflow-x: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2);
            box-sizing: border-box;
        }
        .header-title {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- CARROSSEL INFINITO DINÂMICO --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
        }
        .carousel-track a {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            width: 160px;
            height: 90px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            text-decoration: none;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border-left: 4px solid #0d47a1;
            max-height: 140px; 
            overflow-y: auto;  
        }
        .card::-webkit-scrollbar {
            width: 4px;
        }
        .card::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .card-date {
            font-weight: bold;
            font-size: 0.9rem;
            color: #0d47a1;
            margin-bottom: 4px;
        }
        .card-content {
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="header-btn">◀ Voltar</a>
        <div class="header-title">📅 Agenda da Semana</div>
        <a href="mes.html" class="header-btn">Ver Mês ▶</a>
    </header>

    <section class="carousel-container">
        <div class="carousel-track" id="carouselTrack">
            <!-- Os banners serão carregados aqui dinamicamente -->
        </div>
    </section>

    <div class="container" id="agendaContainer"></div>

    <!-- Script de Gestão da Agenda e Carregamento de Banners do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
            authDomain: "ajuda-jp.firebaseapp.com",
            projectId: "ajuda-jp",
            storageBucket: "ajuda-jp.firebasestorage.app",
            messagingSenderId: "40121072206",
            appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Banco de eventos opcional por data (Formato: "AAAA-MM-DD")
        const eventosAgenda = {
            "2026-08-27": "🇧🇷 Encontro da Comunidade Brasileira - 19:30 no Centro Comunitário"
        };

        const diasSemanaNomes = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
        const mesesNomes = ["de Janeiro", "de Fevereiro", "de Março", "de Abril", "de Maio", "de Junho", "de Julho", "de Agosto", "de Setembro", "de Outubro", "de Novembro", "de Dezembro"];

        function gerarAgendaSemana() {
            const container = document.getElementById('agendaContainer');
            container.innerHTML = "";
            const hoje = new Date();

            for (let i = 0; i < 7; i++) {
                const dataAtual = new Date(hoje);
                dataAtual.setDate(hoje.getDate() + i);

                const diaSemana = diasSemanaNomes[dataAtual.getDay()];
                const diaMes = dataAtual.getDate();
                const nomeMes = mesesNomes[dataAtual.getMonth()];
                
                const anoStr = dataAtual.getFullYear();
                const mesStr = String(dataAtual.getMonth() + 1).padStart(2, '0');
                const diaStr = String(diaMes).padStart(2, '0');
                const chaveData = `${anoStr}-${mesStr}-${diaStr}`;

                const textoEvento = eventosAgenda[chaveData] || "Nenhum evento programado.";

                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div class="card-date">${diaSemana}, ${diaMes} ${nomeMes}</div>
                    <div class="card-content">${textoEvento}</div>
                `;
                container.appendChild(card);
            }
        }

        async function carregarBannersFirebase() {
            const track = document.getElementById('carouselTrack');
            try {
                const querySnapshot = await getDocs(collection(db, "anuncios"));
                let bannersHtml = "";
                
                querySnapshot.forEach((docSnap) => {
                    const an = docSnap.data();
                    // Puxa se pertencer à categoria semana/mês ou geral
                    if (an.status === "ativo" && (an.categoria === "semanames" || an.categoria === "home" || !an.categoria)) {
                        const link = an.linkDestino && an.linkDestino !== "#" ? an.linkDestino : "#";
                        bannersHtml += `
                            <a href="${link}" target="_blank">
                                <img src="${an.imagemUrl}" alt="${an.nomeAnunciante || 'Banner'}">
                            </a>
                        `;
                    }
                });

                if (bannersHtml !== "") {
                    // Duplica para criar o efeito contínuo suave caso tenha poucos banners
                    track.innerHTML = bannersHtml + bannersHtml;
                } else {
                    track.innerHTML = `<div style="padding: 10px; font-size: 0.8rem; color: #64748b; width: 100%; text-align: center;">Nenhum banner ativo no momento</div>`;
                }
            } catch (err) {
                console.error("Erro ao carregar banners:", err);
                track.innerHTML = `<div style="padding: 10px; font-size: 0.8rem; color: #ef4444; width: 100%; text-align: center;">Erro ao carregar anúncios</div>`;
            }
        }

        gerarAgendaSemana();
        carregarBannersFirebase();
    </script>
</body>
</html>

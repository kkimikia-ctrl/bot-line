<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda da Semana</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            padding-top: 110px;
            padding-bottom: 20px;
            color: #1e293b;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2);
            box-sizing: border-box;
        }
        .header-title {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- BARRA DE REGIÕES --- */
        .regions-container {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100%;
            background: #ffffff;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            z-index: 999;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }
        .regions-container::-webkit-scrollbar {
            display: none;
        }
        .region-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .region-btn:hover {
            opacity: 0.8;
        }

        /* --- CORES CLARINHAS PARA OS BOTÕES DE FILTRO --- */
        .region-btn[data-regiao="todas"].active { background: #0d47a1; color: white; border-color: #0d47a1; }
        .region-btn[data-regiao="tokai"] { background-color: #e3f2fd; color: #0d47a1; border-color: #90caf9; }
        .region-btn[data-regiao="tokai"].active { background-color: #1e88e5; color: white; border-color: #1e88e5; }
        
        .region-btn[data-regiao="kanto"] { background-color: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; }
        .region-btn[data-regiao="kanto"].active { background-color: #43a047; color: white; border-color: #43a047; }

        .region-btn[data-regiao="kansai"] { background-color: #fffde7; color: #f57f17; border-color: #ffe082; }
        .region-btn[data-regiao="kansai"].active { background-color: #fbc02d; color: #333; border-color: #fbc02d; }

        .region-btn[data-regiao="hokuriku"] { background-color: #f3e5f5; color: #4a148c; border-color: #ce93d8; }
        .region-btn[data-regiao="hokuriku"].active { background-color: #ab47bc; color: white; border-color: #ab47bc; }

        .region-btn[data-regiao="tohoku"] { background-color: #e0f7fa; color: #006064; border-color: #80deea; }
        .region-btn[data-regiao="tohoku"].active { background-color: #00acc1; color: white; border-color: #00acc1; }

        .region-btn[data-regiao="chugoku"] { background-color: #fbe9e7; color: #bf360c; border-color: #ffab91; }
        .region-btn[data-regiao="chugoku"].active { background-color: #f4511e; color: white; border-color: #f4511e; }

        .region-btn[data-regiao="kyushu"] { background-color: #efebe9; color: #3e2723; border-color: #d7ccc8; }
        .region-btn[data-regiao="kyushu"].active { background-color: #6d4c41; color: white; border-color: #6d4c41; }


        /* --- CARROSSEL INFINITO --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 30s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #eee;
            border: 1px solid #ddd;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* --- BARRA DE PESQUISA --- */
        .search-box {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 12px;
            outline: none;
            box-sizing: border-box;
            background: #ffffff;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: #0d47a1;
            box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1);
        }

        /* --- CARTÕES DE EVENTOS COM CORES CLARINHAS --- */
        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border-left: 4px solid #cbd5e1;
            display: block;
        }
        .card.hidden {
            display: none;
        }
        .card-date {
            font-weight: bold;
            font-size: 0.9rem;
            color: #0d47a1;
            margin-bottom: 4px;
        }
        .card-content {
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.4;
        }

        /* Cores de fundo e bordas específicas por região nos cartões */
        .card[data-regiao="tokai"] { background-color: #e3f2fd !important; border-left-color: #1e88e5 !important; }
        .card[data-regiao="kanto"] { background-color: #e8f5e9 !important; border-left-color: #43a047 !important; }
        .card[data-regiao="kansai"] { background-color: #fffde7 !important; border-left-color: #fbc02d !important; }
        .card[data-regiao="hokuriku"] { background-color: #f3e5f5 !important; border-left-color: #ab47bc !important; }
        .card[data-regiao="tohoku"] { background-color: #e0f7fa !important; border-left-color: #00acc1 !important; }
        .card[data-regiao="chugoku"] { background-color: #fbe9e7 !important; border-left-color: #f4511e !important; }
        .card[data-regiao="kyushu"] { background-color: #efebe9 !important; border-left-color: #6d4c41 !important; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="header-btn">◀ Voltar</a>
        <div class="header-title">📅 Próximos 7 Dias</div>
        <a href="mes.html" class="header-btn">Ver Mês ▶</a>
    </header>

    <!-- Barra de Regiões -->
    <div class="regions-container">
        <button class="region-btn active" data-regiao="todas">🌐 Todas</button>
        <button class="region-btn" data-regiao="tokai">📍 Tokai (Aichi/Shizuoka/Gifu)</button>
        <button class="region-btn" data-regiao="kanto">📍 Kanto (Tokyo/Gunma...)</button>
        <button class="region-btn" data-regiao="kansai">📍 Kansai (Osaka/Mie...)</button>
        <button class="region-btn" data-regiao="hokuriku">📍 Hokuriku / Shinetsu</button>
        <button class="region-btn" data-regiao="tohoku">📍 Hokkaido / Tohoku</button>
        <button class="region-btn" data-regiao="chugoku">📍 Chugoku / Shikoku</button>
        <button class="region-btn" data-regiao="kyushu">📍 Kyushu / Okinawa</button>
    </div>

    <!-- Carrossel de Banners -->
    <section class="carousel-container">
        <div class="carousel-track" id="carouselTrack">
            <a href="mes.html"><img src="mini-banner-1.jpg" alt="Destaque 1"></a>
            <a href="mes.html"><img src="mini-banner-2.jpg" alt="Destaque 2"></a>
            <a href="mes.html"><img src="mini-banner-3.jpg" alt="Destaque 3"></a>
            <a href="mes.html"><img src="mini-banner-4.jpg" alt="Destaque 4"></a>
        </div>
    </section>

    <div class="container">
        <!-- Campo de Pesquisa por Texto -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Pesquisar evento ou cidade (ex: Toyohashi)...">

        <!-- Onde os cartões dos próximos 7 dias serão inseridos dinamicamente -->
        <div id="cardsContainer"></div>
    </div>

    <script>
        // Lista de eventos cadastrados no sistema
        const eventosCadastrados = [
            { data: '2026-09-03', regiao: 'tokai', texto: '🌸 Festival Cultural da Cidade - 14:00 na Praça Central (Toyohashi - Aichi / Tokai)' },
            { data: '2026-09-04', regiao: 'tokai', texto: '📌 Reunião comunitária em Hamamatsu - Shizuoka (Tokai)' },
            { data: '2026-09-06', regiao: 'kanto', texto: '🇧🇷 Encontro da Comunidade Brasileira - Tokyo (Kanto)' },
            { data: '2026-09-08', regiao: 'kansai', texto: '🎨 Feira de Arte e Artesanato - Osaka (Kansai)' },
            { data: '2026-09-09', regiao: 'tokai', texto: '🎵 Encontro Musical - Nagoya, Aichi (Tokai)' }
        ];

        // Gerar dinamicamente os próximos 7 dias a partir de hoje
        const container = document.getElementById('cardsContainer');
        const hoje = new Date();

        for (let i = 0; i < 7; i++) {
            const dataAtual = new Date(hoje);
            dataAtual.setDate(hoje.getDate() + i);

            // Formatar a data no formato YYYY-MM-DD para comparar com os eventos
            const yyyy = dataAtual.getFullYear();
            const mm = String(dataAtual.getMonth() + 1).padStart(2, '0');
            const dd = String(dataAtual.getDate()).padStart(2, '0');
            const dataFormatadaStr = `${yyyy}-${mm}-${dd}`;

            // Nome do dia da semana e data legível em Português
            const opcoesData = { weekday: 'long', day: 'numeric', month: 'long' };
            const dataLegivel = dataAtual.toLocaleDateString('pt-BR', opcoesData);
            const dataCapitalizada = dataLegivel.charAt(0).toUpperCase() + dataLegivel.slice(1);

            // Procurar se há evento para esta data específica
            const eventoEncontrado = eventosCadastrados.find(ev => ev.data === dataFormatadaStr);

            // Criar o HTML do cartão
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-regiao', eventoEncontrado ? eventoEncontrado.regiao : 'nenhuma');

            card.innerHTML = `
                <div class="card-date">${dataCapitalizada}</div>
                <div class="card-content">${eventoEncontrado ? eventoEncontrado.texto : 'Nenhum evento programado.'}</div>
            `;

            container.appendChild(card);
        }

        // Script do Carrossel Infinito
        const track = document.getElementById('carouselTrack');
        const items = Array.from(track.children);
        
        items.forEach(item => {
            const clone = item.cloneNode(true);
            track.appendChild(clone);
        });

        window.addEventListener('load', () => {
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
        });

        // Script de Filtro por Botões de Região
        const botoesRegiao = document.querySelectorAll('.region-btn');
        const searchInput = document.getElementById('searchInput');

        botoesRegiao.forEach(botao => {
            botao.addEventListener('click', () => {
                botoesRegiao.forEach(b => b.classList.remove('active'));
                botao.classList.add('active');
                searchInput.value = ''; 

                const regiaoSelecionada = botao.getAttribute('data-regiao');
                const cardsEvento = document.querySelectorAll('.card');

                cardsEvento.forEach(card => {
                    const regiaoCard = card.getAttribute('data-regiao');
                    if (regiaoSelecionada === 'todas' || regiaoCard === regiaoSelecionada) {
                        card.classList.remove('hidden');
                    } else {
                        card.classList.add('hidden');
                    }
                });
            });
        });

        // Script de Pesquisa por Texto
        searchInput.addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase().trim();
            const cardsEvento = document.querySelectorAll('.card');

            botoesRegiao.forEach(b => b.classList.remove('active'));
            document.querySelector('.region-btn[data-regiao="todas"]').classList.add('active');

            cardsEvento.forEach(card => {
                const textoCard = card.innerText.toLowerCase();
                if (textoCard.includes(termo)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>

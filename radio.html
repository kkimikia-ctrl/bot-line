<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádios & Som - Canais Ao Vivo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 10px;
            padding-top: 130px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-header {
            background-color: #0d47a1;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .back-btn {
            position: absolute;
            left: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Animações */
        @keyframes pulse-move {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* Banners Fixos no Topo */
        .banners-top-container {
            position: fixed;
            top: 48px;
            left: 0;
            width: 100%;
            background: rgba(13, 71, 161, 0.95);
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 6px 10px;
            z-index: 999;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .banner-retangulo {
            width: 48%;
            max-width: 190px;
            height: 55px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            animation: pulse-move 3s infinite ease-in-out;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .banner-slide { width: 100%; height: 100%; display: none; position: absolute; object-fit: cover; }
        .banner-slide.active { display: block; }

        /* --- CARROSSEL INFINITO DINÂMICO --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 30s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #eee;
            border: 1px solid #ddd;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        .radio-main-container {
            background: rgba(255, 255, 255, 0.95);
            max-width: 400px;
            width: 90%;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .header-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .radio-icon {
            width: 35px;
            height: 35px;
            object-fit: contain;
            animation: pulse-move 1.5s infinite alternate;
        }
        .radio-category { font-size: 11px; font-weight: bold; color: #666; text-align: left; margin: 15px 0 5px 0; text-transform: uppercase; }
        .radio-option { background: #f8f9fa; border: 1px solid #ddd; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; font-size: 13px; font-weight: bold; color: #0d47a1; transition: background 0.2s; }
        #containerPlayer { display: none; margin: 15px 0; background: #e3f2fd; padding: 12px; border-radius: 12px; border: 2px solid #90caf9; }
    </style>
</head>
<body>

    <div class="app-header">
        <button class="back-btn" onclick="location.href='entretenimento.html'">⬅ Voltar</button>
        Rádios & Som 🎧
    </div>

    <div class="banners-top-container">
        <div class="banner-retangulo">
            <img src="https://images.unsplash.com/photo-1516280440614-37939bbd805c?w=400&h=110&auto=format&fit=crop" class="banner-slide left-slide active">
            <img src="https://images.unsplash.com/photo-1494232410401-ad00d5433cfa?w=400&h=110&auto=format&fit=crop" class="banner-slide left-slide">
        </div>
        <div class="banner-retangulo">
            <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&h=110&auto=format&fit=crop" class="banner-slide right-slide active">
            <img src="https://images.unsplash.com/photo-1495423706813-131c703d622e?w=400&h=110&auto=format&fit=crop" class="banner-slide right-slide">
        </div>
    </div>

    <div class="radio-main-container">
        <!-- Carrossel Infinito -->
        <section class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <a href="fale-conosco.html"><img src="mini-banner-1.jpg" alt="Destaque 1"></a>
                <a href="fale-conosco.html"><img src="mini-banner-2.jpg" alt="Destaque 2"></a>
                <a href="fale-conosco.html"><img src="mini-banner-3.jpg" alt="Destaque 3"></a>
                <a href="fale-conosco.html"><img src="mini-banner-4.jpg" alt="Destaque 4"></a>
            </div>
        </section>

        <div class="header-title-area">
            <img src="https://cdn-icons-png.flaticon.com/512/1067/1067614.png" class="radio-icon">
            <h2 style="color: #0d47a1; margin: 0; font-size: 20px;">🎧 Escolha o Canal</h2>
            <img src="https://cdn-icons-png.flaticon.com/512/885/885063.png" class="radio-icon">
        </div>

        <div id="containerPlayer">
            <p id="nomeRadioTocando" style="font-weight:bold; color:#1565c0;"></p>
            <audio id="audioRadio" controls style="width: 100%;" autoplay></audio>
        </div>

        <div class="radio-category">📰 Notícias & Informação</div>
        <div class="radio-option" onclick="tocarRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/CBN_SPAAC.aac', 'CBN São Paulo')">📻 CBN São Paulo <span>▶️ Ouvir</span></div>

        <div class="radio-category">🎸 Hits 90s, 2000s & 2010s</div>
        <div class="radio-option" onclick="tocarRadio('https://icecast.omroep.nl/radio5-bb-mp3', 'Hits 90 / 2000 / 2010')">🎵 Hits 90 / 2000 / 2010 <span>▶️ Ouvir</span></div>

        <div class="radio-category">🌍 Pop & Internacional</div>
        <div class="radio-option" onclick="tocarRadio('https://icecast.omroep.nl/radio2-bb-mp3', 'Pop & Rock Global')">🎵 Pop & Rock Global <span>▶️ Ouvir</span></div>

        <div class="radio-category">⚡ Techno & Eletrônica</div>
        <div class="radio-option" onclick="tocarRadio('https://rautemusik-de-hz-fal-stream12.radiohost.de/tecclub', 'Techno / Club Beats')">🎧 Techno / Club Beats <span>▶️ Ouvir</span></div>

        <div class="radio-category">🌙 Relax & Para Dormir</div>
        <div class="radio-option" onclick="tocarRadio('https://live.hunter.fm/lofi_high', 'Lofi & Study Beats')">☕ Lofi & Study Beats <span>▶️ Ouvir</span></div>
    </div>

    <script>
        setInterval(() => {
            const left = document.querySelectorAll('.left-slide');
            const activeL = document.querySelector('.left-slide.active');
            activeL.classList.remove('active');
            let nextL = activeL.nextElementSibling || left[0];
            nextL.classList.add('active');

            const right = document.querySelectorAll('.right-slide');
            const activeR = document.querySelector('.right-slide.active');
            activeR.classList.remove('active');
            let nextR = activeR.nextElementSibling || right[0];
            nextR.classList.add('active');
        }, 3000);

        function tocarRadio(url, nome) {
            document.getElementById('containerPlayer').style.display = 'block';
            document.getElementById('nomeRadioTocando').innerText = "Tocando: " + nome;
            const audio = document.getElementById('audioRadio');
            audio.src = url;
            audio.play();
        }

        // Script para duplicar os itens automaticamente e ajustar o carrossel infinito
        const track = document.getElementById('carouselTrack');
        const items = Array.from(track.children);
        
        // Clona os itens e adiciona ao final para criar o loop contínuo
        items.forEach(item => {
            const clone = item.cloneNode(true);
            track.appendChild(clone);
        });

        // Calcula exatamente metade da largura total da pista para o deslocamento perfeito
        window.addEventListener('load', () => {
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
        });
    </script>
</body>
</html>

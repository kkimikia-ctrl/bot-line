<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha de Gastos - Ajuda JP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5c6b53;
            --primary-light: #eaf0e6;
            --bg-main: #f2eee3;
            --card-bg: #ffffff;
            --text-main: #2c2a29;
            --text-muted: #78746e;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* --- CARROSSEL INFINITO DINÂMICO --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            border-radius: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 16px;
            position: relative;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #dfdbce;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 30s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #eee;
            border: 1px solid #ddd;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        /* --- BOTÃO VOLTAR & TÍTULO --- */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn-back {
            background: #2b4c7e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: #1f375c;
        }

        .page-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* --- FORMULÁRIO DE LANÇAMENTO --- */
        .card {
            background: var(--card-bg);
            border: 1px solid #dfdbce;
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .card h3 {
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d6d0bf;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            background: #faf8f3;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .row-inputs {
            display: flex;
            gap: 10px;
        }

        .row-inputs .form-group {
            flex: 1;
        }

        .btn-add {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .btn-add:hover {
            background-color: #4b5843;
        }

        /* --- RESUMO & TABELA --- */
        .summary-box {
            background: var(--primary-light);
            border: 1px solid #d0e0c8;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .summary-total {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .expenses-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .expense-item {
            background: var(--card-bg);
            border: 1px solid #dfdbce;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .expense-info desc {
            font-weight: 600;
        }

        .expense-info small {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .expense-value {
            font-weight: 700;
            color: #b25a5a;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 16px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BOTÃO VOLTAR & TÍTULO -->
        <div class="top-nav">
            <a href="rotina.html" class="btn-back">← Voltar</a>
            <span class="page-title">Controle de Gastos</span>
            <div style="width: 60px;"></div>
        </div>

        <!-- CARROSSEL INFINITO -->
        <section class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <a href="fale-conosco.html"><img src="mini-banner-1.jpg" alt="Destaque 1"></a>
                <a href="fale-conosco.html"><img src="mini-banner-2.jpg" alt="Destaque 2"></a>
                <a href="fale-conosco.html"><img src="mini-banner-3.jpg" alt="Destaque 3"></a>
                <a href="fale-conosco.html"><img src="mini-banner-4.jpg" alt="Destaque 4"></a>
            </div>
        </section>

        <!-- NOVO LANÇAMENTO -->
        <div class="card">
            <h3>Adicionar Gasto</h3>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="desc" class="form-control" placeholder="Ex: Supermercado, Gasolina...">
            </div>
            <div class="row-inputs">
                <div class="form-group">
                    <label>Valor (¥ ou R$)</label>
                    <input type="number" id="valor" class="form-control" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoria" class="form-control">
                        <option value="Alimentação">Alimentação</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
            </div>
            <button class="btn-add" id="btn-save-expense">Salvar Lançamento</button>
        </div>

        <!-- RESUMO TOTAL -->
        <div class="summary-box">
            <span>Total do Mês:</span>
            <span class="summary-total" id="total-val">¥ 0</span>
        </div>

        <!-- LISTA DE GASTOS -->
        <div class="expenses-list" id="expense-list-container">
            <div class="empty-msg" id="empty-notice">Nenhum gasto registrado ainda.</div>
        </div>
    </div>

    <script>
        // Script do Carrossel Infinito
        const track = document.getElementById('carouselTrack');
        const items = Array.from(track.children);
        items.forEach(item => {
            const clone = item.cloneNode(true);
            track.appendChild(clone);
        });
        window.addEventListener('load', () => {
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
        });

        // Lógica simples da Planilha de Gastos
        const btnSave = document.getElementById('btn-save-expense');
        const descInput = document.getElementById('desc');
        const valorInput = document.getElementById('valor');
        const catInput = document.getElementById('categoria');
        const listContainer = document.getElementById('expense-list-container');
        const totalValDisplay = document.getElementById('total-val');
        const emptyNotice = document.getElementById('empty-notice');

        let expenses = JSON.parse(localStorage.getItem('ajuda_jp_gastos')) || [];

        function renderExpenses() {
            listContainer.innerHTML = '';
            if (expenses.length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">Nenhum gasto registrado ainda.</div>';
                totalValDisplay.textContent = '¥ 0';
                return;
            }

            let total = 0;
            expenses.forEach((item, index) => {
                total += parseFloat(item.valor);
                
                const div = document.createElement('div');
                div.className = 'expense-item';
                div.innerHTML = `
                    <div class="expense-info">
                        <strong>${item.desc}</strong>
                        <small>${item.categoria} • ${item.data}</small>
                    </div>
                    <div class="expense-value">- ¥ ${Number(item.valor).toLocaleString()}</div>
                `;
                listContainer.appendChild(div);
            });

            totalValDisplay.textContent = `¥ ${total.toLocaleString()}`;
        }

        btnSave.addEventListener('click', () => {
            const desc = descInput.value.trim();
            const valor = valorInput.value.trim();
            const categoria = catInput.value;

            if (!desc || !valor) {
                alert('Por favor, preencha a descrição e o valor.');
                return;
            }

            const dateOptions = { day: '2-digit', month: '2-digit' };
            const dataStr = new Date().toLocaleDateString('pt-BR', dateOptions);

            const newExpense = {
                desc,
                valor: parseFloat(valor),
                categoria,
                data: dataStr
            };

            expenses.unshift(newExpense);
            localStorage.setItem('ajuda_jp_gastos', JSON.stringify(expenses));

            descInput.value = '';
            valorInput.value = '';
            renderExpenses();
        });

        // Carregar ao iniciar
        renderExpenses();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotina & Finanças - Gastos</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --line-color: #e3dcd2;
            --margin-color: #f28b82;
            --text-color: #2c2c2c;
            --primary-color: #556b2f;
            --danger-color: #d9534f;
            --success-color: #4cae4c;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 4px 8px;
            background-image: 
                linear-gradient(90deg, transparent 39px, var(--margin-color) 39px, var(--margin-color) 41px, transparent 41px),
                linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 26px;
            overscroll-behavior-y: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-left: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .date-navigator {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        h1 {
            font-size: 1.1rem;
            font-family: 'Caveat', cursive;
            margin: 0;
            color: #1a1a1a;
            font-weight: 700;
            -webkit-text-stroke: 0.3px #1a1a1a;
            white-space: nowrap;
        }

        .icon-btn {
            background: rgba(255,255,255,0.9);
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        /* Seletor de Mês/Ano */
        .month-selector {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dcd6ce;
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .month-selector input {
            padding: 2px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.75rem;
            outline: none;
            background: #fff;
        }

        /* Cards de Resumo */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dcd6ce;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
        }

        .summary-title {
            font-size: 0.6rem;
            color: #666;
            margin-bottom: 1px;
            font-weight: bold;
        }

        .summary-value {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .text-ganhos { color: #2e7d32; }
        .text-gastos { color: #c62828; }
        .text-saldo { color: #1565c0; }

        /* Seções de Lançamento */
        .section-box {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dcd6ce;
            border-radius: 6px;
            padding: 6px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.72rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px dashed #e2d7c3;
            padding-bottom: 2px;
        }

        .form-row {
            display: flex;
            gap: 3px;
            margin-bottom: 4px;
        }

        .form-row input, .form-row select {
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.72rem;
            outline: none;
            background: #fff;
            box-sizing: border-box;
        }

        .input-descricao { flex: 1.8; }
        .input-valor { flex: 1.1; }
        .input-categoria { flex: 1.3; }
        .input-data { flex: 1.2; }

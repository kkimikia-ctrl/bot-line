<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotina & Finanças - Gastos</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --line-color: #e3dcd2;
            --margin-color: #f28b82;
            --text-color: #2c2c2c;
            --primary-color: #556b2f;
            --danger-color: #d9534f;
            --success-color: #4cae4c;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 6px 10px;
            background-image: 
                linear-gradient(90deg, transparent 39px, var(--margin-color) 39px, var(--margin-color) 41px, transparent 41px),
                linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 26px;
            overscroll-behavior-y: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .date-navigator {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        h1 {
            font-size: 1.15rem;
            font-family: 'Caveat', cursive;
            margin: 0;
            color: #1a1a1a;
            font-weight: 700;
            -webkit-text-stroke: 0.3px #1a1a1a;
            white-space: nowrap;
        }

        .icon-btn {
            background: rgba(255,255,255,0.9);
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        /* Seletor de Mês/Ano */
        .month-selector {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dcd6ce;
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .month-selector input {
            padding: 2px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.75rem;
            outline: none;
            background: #fff;
        }

        /* Cards de Resumo */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dcd6ce;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }

        .summary-title {
            font-size: 0.65rem;
            color: #666;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .summary-value {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .text-ganhos { color: #2e7d32; }
        .text-gastos { color: #c62828; }
        .text-saldo { color: #1565c0; }

        /* Seções de Lançamento */
        .section-box {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dcd6ce;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px dashed #e2d7c3;
            padding-bottom: 3px;
        }

        .form-row {
            display: flex;
            gap: 4px;
            margin-bottom: 5px;
        }

        .form-row input, .form-row select {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.75rem;
            outline: none;
            background: #fff;
        }

        .input-descricao { flex: 2; }
        .input-valor { flex: 1; }
        .input-categoria { flex: 1.2; }
        .input-data { flex: 1; }

        .btn-adicionar {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Filtro de Categoria */
        .filter-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 0.72rem;
            font-weight: bold;
            color: #555;
        }

        .filter-row select {
            padding: 3px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.72rem;
            background: #fff;
            outline: none;
        }

        /* Listas de Itens Lançados */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 130px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f8f5;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            border: 1px solid #eee;
        }

        .item-info {
            display: flex;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="date-navigator">
                <a href="rotina.html" class="icon-btn" style="width: 22px; height: 22px; font-size: 0.65rem; border-radius: 4px;" title="Voltar para Rotina">🏠</a>
                <h1 id="titulo-pagina">Controle de Gastos & Ganhos</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" title="Configurações">⚙️</button>
            </div>
        </header>

        <div class="month-selector">
            <span>Mês de Referência:</span>
            <input type="month" id="input-mes-ref" onchange="mudarMesReferencia()">
        </div>

        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-title">Ganhos</div>
                <div class="summary-value text-ganhos" id="total-ganhos">¥ 0</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Gastos</div>
                <div class="summary-value text-gastos" id="total-gastos">¥ 0</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Saldo</div>
                <div class="summary-value text-saldo" id="total-saldo">¥ 0</div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-header">💰 Ganhos (Receitas)</div>
            <div class="form-row">
                <input type="text" id="ganho-desc" class="input-descricao" placeholder="Ex: Salário, Extra...">
                <input type="number" id="ganho-valor" class="input-valor" placeholder="Valor (¥)">
                <input type="date" id="ganho-data" class="input-data">
            </div>
            <button class="btn-adicionar" onclick="adicionarGanho()">Adicionar Ganho</button>
            <div class="item-list" id="lista-ganhos" style="max-height: 80px;"></div>
        </div>

        <div class="section-box">
            <div class="section-header">💸 Gastos do Mês</div>
            
            <div class="form-row">
                <input type="text" id="gasto-desc" class="input-descricao" placeholder="Descrição (ex: Supermercado)">
                <select id="gasto-cat" class="input-categoria">
                    <option value="Fixos">1 - Fixos</option>
                    <option value="Compras">2 - Compras</option>
                    <option value="Outros">3 - Outros</option>
                    <option value="Transporte">4 - Transporte</option>
                </select>
                <input type="number" id="gasto-valor" class="input-valor" placeholder="Valor (¥)">
                <input type="date" id="gasto-data" class="input-data">
            </div>
            <button class="btn-adicionar" onclick="adicionarGasto()">Adicionar Gasto</button>

            <div class="filter-row" style="margin-top: 8px;">
                <span>Filtrar categoria:</span>
                <select id="filtro-cat" onchange="carregarDados()">
                    <option value="Todos">Todas as Categorias</option>
                    <option value="Fixos">1 - Fixos</option>
                    <option value="Compras">2 - Compras</option>
                    <option value="Outros">3 - Outros</option>
                    <option value="Transporte">4 - Transporte</option>
                </select>
            </div>

            <div class="item-list" id="lista-gastos"></div>
        </div>
    </div>

    <script>
        const dataHoje = new Date();
        const anoAtual = dataHoje.getFullYear();
        const mesAtualStr = String(dataHoje.getMonth() + 1).padStart(2, '0');
        const mesAnoAtual = `${anoAtual}-${mesAtualStr}`;
        
        // Data padrão de hoje no formato YYYY-MM-DD
        const diaHojeStr = dataHoje.toISOString().split('T')[0];

        document.getElementById('input-mes-ref').value = mesAnoAtual;
        document.getElementById('ganho-data').value = diaHojeStr;
        document.getElementById('gasto-data').value = diaHojeStr;

        function obterChaveGanhos() {
            const mesRef = document.getElementById('input-mes-ref').value;
            return 'ganhos_' + mesRef;
        }

        function obterChaveGastos() {
            const mesRef = document.getElementById('input-mes-ref').value;
            return 'gastos_' + mesRef;
        }

        function formatarMoeda(valor) {
            return '¥ ' + Number(valor).toLocaleString('ja-JP');
        }

        function formatarDataBR(dataStr) {
            if (!dataStr) return '';
            const partes = dataStr.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}`;
            }
            return dataStr;
        }

        function carregarDados() {
            const ganhosSalvos = JSON.parse(localStorage.getItem(obterChaveGanhos()) || '[]');
            const gastosSalvos = JSON.parse(localStorage.getItem(obterChaveGastos()) || '[]');

            const listaGanhosEl = document.getElementById('lista-ganhos');
            const listaGastosEl = document.getElementById('lista-gastos');
            const filtroCat = document.getElementById('filtro-cat').value;

            listaGanhosEl.innerHTML = '';
            listaGastosEl.innerHTML = '';

            let somaGanhos = 0;
            ganhosSalvos.forEach((item, index) => {
                somaGanhos += Number(item.valor);
                listaGanhosEl.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <span style="color:#666;">${formatarDataBR(item.data)}</span>
                            <span><strong>${item.desc}</strong></span>
                        </div>
                        <div>
                            <span style="color: #2e7d32; font-weight: bold; margin-right: 8px;">${formatarMoeda(item.valor)}</span>
                            <button class="item-delete" onclick="removerGanho(${index})">❌</button>
                        </div>
                    </div>
                `;
            });

            let somaGastos = 0;
            gastosSalvos.forEach((item, index) => {
                somaGastos += Number(item.valor);

                // Aplicar filtro de categoria se selecionado
                if (filtroCat !== 'Todos' && item.cat !== filtroCat) {
                    return; // Pula a exibição se não bater com o filtro
                }

                let nomeCatLabel = item.cat;
                if(item.cat === 'Fixos') nomeCatLabel = '1 - Fixos';
                if(item.cat === 'Compras') nomeCatLabel = '2 - Compras';
                if(item.cat === 'Outros') nomeCatLabel = '3 - Outros';
                if(item.cat === 'Transporte') nomeCatLabel = '4 - Transporte';

                listaGastosEl.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <span style="color:#666;">${formatarDataBR(item.data)}</span>
                            <span><strong>[${nomeCatLabel}]</strong> ${item.desc}</span>
                        </div>
                        <div>
                            <span style="color: #c62828; font-weight: bold; margin-right: 8px;">${formatarMoeda(item.valor)}</span>
                            <button class="item-delete" onclick="removerGasto(${index})">❌</button>
                        </div>
                    </div>
                `;
            });

            const saldo = somaGanhos - somaGastos;

            document.getElementById('total-ganhos').textContent = formatarMoeda(somaGanhos);
            document.getElementById('total-gastos').textContent = formatarMoeda(somaGastos);
            
            const saldoEl = document.getElementById('total-saldo');
            saldoEl.textContent = formatarMoeda(saldo);
            saldoEl.className = 'summary-value ' + (saldo >= 0 ? 'text-saldo' : 'text-gastos');
        }

        function adicionarGanho() {
            const desc = document.getElementById('ganho-desc').value.trim();
            const valor = document.getElementById('ganho-valor').value;
            const data = document.getElementById('ganho-data').value;

            if (!desc || !valor) {
                alert('Preencha a descrição e o valor do ganho!');
                return;
            }

            const ganhos = JSON.parse(localStorage.getItem(obterChaveGanhos()) || '[]');
            ganhos.push({ desc, valor: Number(valor), data });
            localStorage.setItem(obterChaveGanhos(), JSON.stringify(ganhos));

            document.getElementById('ganho-desc').value = '';
            document.getElementById('ganho-valor').value = '';
            carregarDados();
        }

        function removerGanho(index) {
            const ganhos = JSON.parse(localStorage.getItem(obterChaveGanhos()) || '[]');
            ganhos.splice(index, 1);
            localStorage.setItem(obterChaveGanhos(), JSON.stringify(ganhos));
            carregarDados();
        }

        function adicionarGasto() {
            const desc = document.getElementById('gasto-desc').value.trim();
            const cat = document.getElementById('gasto-cat').value;
            const valor = document.getElementById('gasto-valor').value;
            const data = document.getElementById('gasto-data').value;

            if (!desc || !valor) {
                alert('Preencha a descrição e o valor do gasto!');
                return;
            }

            const gastos = JSON.parse(localStorage.getItem(obterChaveGastos()) || '[]');
            gastos.push({ desc, cat, valor: Number(valor), data });
            localStorage.setItem(obterChaveGastos(), JSON.stringify(gastos));

            document.getElementById('gasto-desc').value = '';
            document.getElementById('gasto-valor').value = '';
            carregarDados();
        }

        function removerGasto(index) {
            const gastos = JSON.parse(localStorage.getItem(obterChaveGastos()) || '[]');
            gastos.splice(index, 1);
            localStorage.setItem(obterChaveGastos(), JSON.stringify(gastos));
            carregarDados();
        }

        function mudarMesReferencia() {
            carregarDados();
        }

        window.addEventListener('load', () => {
            carregarDados();
        });
    </script>
</body>
</html>

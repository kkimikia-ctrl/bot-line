<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .header-jogo {
            width: 100%;
            background-color: #1a365d;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .botoes-topo {
            display: flex;
            gap: 10px;
            margin: 10px;
            width: 95%;
            max-width: 400px;
            justify-content: space-between;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-voltar { background-color: #5c768d; }
        .btn-salvar { background-color: #2e8540; }
        
        .placar-box {
            background-color: #2e8540;
            color: white;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 95%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
        }
        
        /* Telas */
        .tela {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        .tela.ativa {
            display: flex;
        }

        /* Menu Principal */
        .menu-container {
            width: 95%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .card-jogo {
            background-color: white;
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            color: #1a365d;
        }

        /* Jogo Mini Craque */
        .campo-container {
            position: relative;
            width: 95%;
            max-width: 400px;
            height: 480px;
            background-color: #2e8540;
            border: 4px solid white;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
        }
        /* Gol mais abaixo e com tamanho adequado */
        .gol {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 80px;
            border: 3px solid white;
            border-bottom: none;
        }
        .jogador-campo {
            position: absolute;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
        }
        .bola {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
            z-index: 5;
        }
        .instrucao {
            color: white;
            font-weight: bold;
            text-align: center;
            position: absolute;
            bottom: 10px;
            width: 100%;
            font-size: 12px;
            text-shadow: 1px 1px 2px black;
        }
        .mensagem-gool {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 45px;
            font-weight: bold;
            color: yellow;
            text-shadow: 2px 2px 4px black;
            display: none;
            z-index: 10;
        }

        /* Jogo da Cobrinha */
        .snake-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background-color: #111;
            border: 4px solid #333;
            border-radius: 8px;
        }
        .controles-snake {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 5px;
            margin-top: 15px;
        }
        .btn-dir {
            padding: 15px;
            font-size: 20px;
            background-color: #1a365d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-jogo">
        <span>🎮 Central de Jogos</span>
    </div>

    <!-- Tela do Menu Principal -->
    <div id="telaMenu" class="tela ativa">
        <div class="menu-container">
            <div class="card-jogo" onclick="abrirJogo('futebol')">⚽ Mini Craque</div>
            <div class="card-jogo" onclick="abrirJogo('cobrinha')">🐍 Jogo da Cobrinha</div>
            <div class="card-jogo" onclick="abrirJogo('jogo3')">🎯 Jogo 3</div>
            <div class="card-jogo" onclick="abrirJogo('jogo4')">🧠 Jogo 4</div>
            <div class="card-jogo" onclick="abrirJogo('jogo5')">🏓 Jogo 5</div>
        </div>
    </div>

    <!-- Tela Mini Craque -->
    <div id="telaFutebol" class="tela">
        <div class="botoes-topo">
            <button class="btn btn-voltar" onclick="voltarMenu()">Voltar</button>
            <button class="btn btn-salvar" onclick="salvarPontuacaoFutebol()">Salvar Pontos</button>
        </div>

        <div class="placar-box">
            <span>⚽ Mini Craque</span>
            <span id="scoreCraqueText">Gols: 0 | Vidas: 3</span>
        </div>

        <div class="campo-container" id="gameAreaCraque">
            <div class="gol" id="gol">
                <div class="jogador-campo" id="goalkeeperCraque" style="top: 5px; left: 85px;">🤖</div>
                <!-- Zagueiros posicionados em linhas Y estritamente diferentes -->
                <div class="jogador-campo" id="defCraque1" style="top: 30px; left: 30px; display: none;">🛡️</div>
                <div class="jogador-campo" id="defCraque2" style="top: 55px; left: 120px; display: none;">🛡️</div>
                <div class="jogador-campo" id="defCraque3" style="top: 30px; left: 150px; display: none;">🛡️</div>
            </div>
            
            <svg style="position:absolute; width:100%; height:100%; pointer-events:none; z-index:2;">
                <line id="trajectoryCraque" x1="0" y1="0" x2="0" y2="0" stroke="yellow" stroke-dasharray="4" stroke-width="3"/>
            </svg>

            <div class="bola" id="ballCraque">⚽</div>
            <div class="mensagem-gool" id="msgGoalCraque">GOOL!</div>
            <div class="instrucao">Puxe a bola para trás (estilo estilingue) e solte para chutar!</div>
        </div>
    </div>

    <!-- Tela Jogo da Cobrinha -->
    <div id="telaCobrinha" class="tela">
        <div class="botoes-topo">
            <button class="btn btn-voltar" onclick="voltarMenu()">Voltar</button>
            <button class="btn btn-salvar" onclick="salvarPontuacaoSnake()">Salvar Pontos</button>
        </div>

        <div class="placar-box">
            <span>🐍 Cobrinha</span>
            <span id="snake-status">Nível 1 | Pontos: 0</span>
        </div>

        <div class="snake-container">
            <canvas id="snakeCanvas" width="320" height="320"></canvas>
            <div class="controles-snake">
                <div></div>
                <button class="btn-dir" onclick="mudarDirecao('UP')">⬆️</button>
                <div></div>
                <button class="btn-dir" onclick="mudarDirecao('LEFT')">⬅️</button>
                <button class="btn-dir" onclick="mudarDirecao('DOWN')">⬇️</button>
                <button class="btn-dir" onclick="mudarDirecao('RIGHT')">➡️</button>
            </div>
        </div>
    </div>

    <!-- Telas genéricas para os demais jogos -->
    <div id="telaJogo3" class="tela">
        <div class="botoes-topo"><button class="btn btn-voltar" onclick="voltarMenu()">Voltar</button></div>
        <div class="placar-box"><span>🎯 Jogo 3</span></div>
        <div style="padding: 40px; text-align: center; color: #333; font-weight: bold;">Jogo 3 Ativo</div>
    </div>

    <div id="telaJogo4" class="tela">
        <div class="botoes-topo"><button class="btn btn-voltar" onclick="voltarMenu()">Voltar</button></div>
        <div class="placar-box"><span>🧠 Jogo 4</span></div>
        <div style="padding: 40px; text-align: center; color: #333; font-weight: bold;">Jogo 4 Ativo</div>
    </div>

    <div id="telaJogo5" class="tela">
        <div class="botoes-topo"><button class="btn btn-voltar" onclick="voltarMenu()">Voltar</button></div>
        <div class="placar-box"><span>🏓 Jogo 5</span></div>
        <div style="padding: 40px; text-align: center; color: #333; font-weight: bold;">Jogo 5 Ativo</div>
    </div>

    <script>
        let jogoAtualAtivo = '';

        function abrirJogo(tipo) {
            document.getElementById('telaMenu').classList.remove('ativa');
            document.getElementById('telaFutebol').classList.remove('ativa');
            document.getElementById('telaCobrinha').classList.remove('ativa');
            document.getElementById('telaJogo3').classList.remove('ativa');
            document.getElementById('telaJogo4').classList.remove('ativa');
            document.getElementById('telaJogo5').classList.remove('ativa');

            jogoAtualAtivo = tipo;

            if (tipo === 'futebol') {
                document.getElementById('telaFutebol').classList.add('ativa');
                iniciarCraque();
            } else if (tipo === 'cobrinha') {
                document.getElementById('telaCobrinha').classList.add('ativa');
                iniciarCobrinha();
            } else if (tipo === 'jogo3') {
                document.getElementById('telaJogo3').classList.add('ativa');
            } else if (tipo === 'jogo4') {
                document.getElementById('telaJogo4').classList.add('ativa');
            } else if (tipo === 'jogo5') {
                document.getElementById('telaJogo5').classList.add('ativa');
            }
        }

        function voltarMenu() {
            pararCobrinha();
            jogoAtualAtivo = '';
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
            document.getElementById('telaMenu').classList.add('ativa');
        }

        function salvarPontuacaoGlobal(jogo, pontos) {
            alert(`Pontuação de ${pontos} salva no jogo ${jogo}!`);
        }

        /* --- MINI CRAQUE --- */
        let golsCraque = 0;
        let vidasCraque = 3;
        let defsCraqueActive = 0;
        let craqueSpeedMultiplier = 1;
        let craqueRunning = true;

        const defCraque1 = document.getElementById('defCraque1');
        const defCraque2 = document.getElementById('defCraque2');
        const defCraque3 = document.getElementById('defCraque3');
        const gameAreaCraque = document.getElementById('gameAreaCraque');
        const trajectoryCraque = document.getElementById('trajectoryCraque');
        const msgGoalCraque = document.getElementById('msgGoalCraque');
        const scoreCraqueText = document.getElementById('scoreCraqueText');
        const ballCraque = document.getElementById('ballCraque');
        const goalkeeperCraque = document.getElementById('goalkeeperCraque');

        let ballBaseX = 0;
        let ballBaseY = 30;
        let ballCraqueX = 0;
        let ballCraqueY = 30;
        let isDraggingCraque = false;
        let startCraqueX, startCraqueY;

        let gkCraqueX = 85, gkCraqueDir = 1;
        let def1CraqueX = 30, def1CraqueDir = 1;
        let def2CraqueX = 120, def2CraqueDir = -1;
        let def3CraqueX = 150, def3CraqueDir = 1;

        function iniciarCraque() {
            golsCraque = 0;
            vidasCraque = 3;
            defsCraqueActive = 0;
            craqueSpeedMultiplier = 1;
            craqueRunning = true;
            defCraque1.style.display = 'none';
            defCraque2.style.display = 'none';
            defCraque3.style.display = 'none';
            updateScoreCraque();
            resetBallCraque();
            if (!window.craqueLoopStarted) {
                window.craqueLoopStarted = true;
                requestAnimationFrame(craqueGameLoop);
            }
        }

        function resetBallCraque() {
            ballBaseX = gameAreaCraque.clientWidth / 2 - 20;
            ballCraqueX = ballBaseX;
            ballCraqueY = ballBaseY;
            ballCraque.style.bottom = ballCraqueY + 'px';
            ballCraque.style.left = ballCraqueX + 'px';
            trajectoryCraque.setAttribute('x1', 0);
            trajectoryCraque.setAttribute('y1', 0);
            trajectoryCraque.setAttribute('x2', 0);
            trajectoryCraque.setAttribute('y2', 0);
        }

        ballCraque.addEventListener('mousedown', startDragCraque);
        ballCraque.addEventListener('touchstart', startDragCraque);
        document.addEventListener('mousemove', dragCraque);
        document.addEventListener('touchmove', dragCraque, { passive: false });
        document.addEventListener('mouseup', endDragCraque);
        document.addEventListener('touchend', endDragCraque);

        function startDragCraque(e) {
            if (!craqueRunning || jogoAtualAtivo !== 'futebol') return;
            isDraggingCraque = true;
            startCraqueX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            startCraqueY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        }

        function dragCraque(e) {
            if (!isDraggingCraque || !craqueRunning || jogoAtualAtivo !== 'futebol') return;
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            let dx = clientX - startCraqueX;
            let dy = clientY - startCraqueY;

            if (dy > 0) dy = 0; // Puxar apenas para trás
            
            ballCraqueX = (gameAreaCraque.clientWidth / 2 - 20) + dx;
            ballCraqueY = ballBaseY - dy;

            ballCraque.style.left = ballCraqueX + 'px';
            ballCraque.style.bottom = ballCraqueY + 'px';

            let ballRect = ballCraque.getBoundingClientRect();
            let areaRect = gameAreaCraque.getBoundingClientRect();
            let currentX = ballRect.left - areaRect.left + 20;
            let currentY = areaRect.height - (ballRect.top - areaRect.top) - 20;
            
            let aimX = currentX - dx * 1.5;
            let aimY = currentY + dy * 1.5;

            trajectoryCraque.setAttribute('x1', currentX);
            trajectoryCraque.setAttribute('y1', areaRect.height - currentY);
            trajectoryCraque.setAttribute('x2', aimX);
            trajectoryCraque.setAttribute('y2', areaRect.height - aimY);
        }

        function endDragCraque(e) {
            if (!isDraggingCraque || !craqueRunning || jogoAtualAtivo !== 'futebol') return;
            isDraggingCraque = false;
            trajectoryCraque.setAttribute('x1', 0);
            trajectoryCraque.setAttribute('y1', 0);
            trajectoryCraque.setAttribute('x2', 0);
            trajectoryCraque.setAttribute('y2', 0);

            let targetX = ballCraqueX;
            animateShotCraque(targetX);
        }

        function animateShotCraque(targetX) {
            let currentBottom = parseInt(ballCraque.style.bottom);
            let currentLeft = parseInt(ballCraque.style.left);
            let stepY = 16;
            let stepX = (targetX - currentLeft) / 10;

            let flight = setInterval(() => {
                if (jogoAtualAtivo !== 'futebol') { clearInterval(flight); return; }
                currentBottom += stepY;
                currentLeft += stepX;
                ballCraque.style.bottom = currentBottom + 'px';
                ballCraque.style.left = currentLeft + 'px';

                let bRect = ballCraque.getBoundingClientRect();
                
                if (defsCraqueActive >= 3 && checkCollisionCraque(bRect, defCraque3.getBoundingClientRect())) {
                    clearInterval(flight);
                    handleMissCraque();
                    return;
                }
                if (defsCraqueActive >= 2 && checkCollisionCraque(bRect, defCraque2.getBoundingClientRect())) {
                    clearInterval(flight);
                    handleMissCraque();
                    return;
                }
                if (defsCraqueActive >= 1 && checkCollisionCraque(bRect, defCraque1.getBoundingClientRect())) {
                    clearInterval(flight);
                    handleMissCraque();
                    return;
                }
                if (checkCollisionCraque(bRect, goalkeeperCraque.getBoundingClientRect())) {
                    clearInterval(flight);
                    handleMissCraque();
                    return;
                }

                if (currentBottom >= gameAreaCraque.clientHeight - 70) {
                    clearInterval(flight);
                    handleGoalCraque();
                    return;
                }
            }, 20);
        }

        function checkCollisionCraque(r1, r2) {
            return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
        }

        function handleGoalCraque() {
            golsCraque++;
            updateScoreCraque();
            msgGoalCraque.style.display = 'block';
            
            if (golsCraque >= 2) { defsCraqueActive = 1; defCraque1.style.display = 'flex'; }
            if (golsCraque >= 4) { defsCraqueActive = 2; defCraque2.style.display = 'flex'; }
            if (golsCraque >= 6) { defsCraqueActive = 3; defCraque3.style.display = 'flex'; }
            
            craqueSpeedMultiplier += 0.2;

            setTimeout(() => {
                msgGoalCraque.style.display = 'none';
                resetBallCraque();
            }, 1000);
        }

        function handleMissCraque() {
            vidasCraque--;
            updateScoreCraque();
            if (vidasCraque <= 0) {
                alert("Fim de jogo! Suas vidas acabaram.");
                golsCraque = 0;
                vidasCraque = 3;
                defsCraqueActive = 0;
                defCraque1.style.display = 'none';
                defCraque2.style.display = 'none';
                defCraque3.style.display = 'none';
                craqueSpeedMultiplier = 1;
            }
            resetBallCraque();
        }

        function updateScoreCraque() {
            scoreCraqueText.innerText = `Gols: ${golsCraque} | Vidas: ${vidasCraque}`;
        }

        function craqueGameLoop() {
            if (jogoAtualAtivo === 'futebol') {
                let maxW = gameAreaCraque.clientWidth - 35;
                
                gkCraqueX += gkCraqueDir * (1.6 * craqueSpeedMultiplier);
                if (gkCraqueX <= 10 || gkCraqueX >= maxW - 10) gkCraqueDir *= -1;
                goalkeeperCraque.style.left = gkCraqueX + 'px';

                if (defsCraqueActive >= 1) {
                    def1CraqueX += def1CraqueDir * (1.3 * craqueSpeedMultiplier);
                    if (def1CraqueX <= 10 || def1CraqueX >= maxW - 10) def1CraqueDir *= -1;
                    defCraque1.style.left = def1CraqueX + 'px';
                }
                if (defsCraqueActive >= 2) {
                    def2CraqueX += def2CraqueDir * (1.5 * craqueSpeedMultiplier);
                    if (def2CraqueX <= 10 || def2CraqueX >= maxW - 10) def2CraqueDir *= -1;
                    defCraque2.style.left = def2CraqueX + 'px';
                }
                if (defsCraqueActive >= 3) {
                    def3CraqueX += def3CraqueDir * (1.7 * craqueSpeedMultiplier);
                    if (def3CraqueX <= 10 || def3CraqueX >= maxW - 10) def3CraqueDir *= -1;
                    defCraque3.style.left = def3CraqueX + 'px';
                }
            }
            requestAnimationFrame(craqueGameLoop);
        }

        function salvarPontuacaoFutebol() {
            salvarPontuacaoGlobal("Mini Craque", golsCraque * 50);
        }

        /* --- JOGO DA COBRINHA --- */
        let snakeInterval = null, snake = [], comida = {}, direcao = 'RIGHT', proximaDirecao = 'RIGHT', pontosSnake = 0, nivelSnake = 1;
        const gridTotal = 16;

        function iniciarCobrinha() {
            pararCobrinha(); 
            snake = [{x: 8, y: 8}]; 
            gerarComida();
            direcao = 'RIGHT'; 
            proximaDirecao = 'RIGHT'; 
            pontosSnake = 0; 
            nivelSnake = 1;
            atualizarStatusSnake(); 
            snakeInterval = setInterval(loopCobrinha, 150);
        }

        function pararCobrinha() { 
            if (snakeInterval) clearInterval(snakeInterval); 
        }

        function gerarComida() { 
            comida = { x: Math.floor(Math.random() * gridTotal), y: Math.floor(Math.random() * gridTotal) }; 
        }

        function mudarDirecao(novaDir) {
            if (novaDir === 'UP' && direcao !== 'DOWN') proximaDirecao = 'UP';
            if (novaDir === 'DOWN' && direcao !== 'UP') proximaDirecao = 'DOWN';
            if (novaDir === 'LEFT' && direcao !== 'RIGHT') proximaDirecao = 'LEFT';
            if (novaDir === 'RIGHT' && direcao !== 'LEFT') proximaDirecao = 'RIGHT';
        }

        function loopCobrinha() {
            if (jogoAtualAtivo !== 'cobrinha') return;
            direcao = proximaDirecao; 
            let cabeca = { ...snake[0] };
            if (direcao === 'UP') cabeca.y--; 
            if (direcao === 'DOWN') cabeca.y++; 
            if (direcao === 'LEFT') cabeca.x--; 
            if (direcao === 'RIGHT') cabeca.x++;

            if (cabeca.x < 0) cabeca.x = gridTotal - 1; 
            if (cabeca.x >= gridTotal) cabeca.x = 0;
            if (cabeca.y < 0) cabeca.y = gridTotal - 1; 
            if (cabeca.y >= gridTotal) cabeca.y = 0;

            if (snake.some(p => p.x === cabeca.x && p.y === cabeca.y)) { 
                pararCobrinha(); 
                alert(`💥 Fim de jogo na Cobrinha!`); 
                return; 
            }

            snake.unshift(cabeca);
            if (cabeca.x === comida.x && cabeca.y === comida.y) { 
                pontosSnake += 10; 
                nivelSnake = Math.floor(pontosSnake / 50) + 1; 
                gerarComida(); 
            } else { 
                snake.pop(); 
            }
            atualizarStatusSnake(); 
            desenharCobrinha();
        }

        function atualizarStatusSnake() { 
            const statusEl = document.getElementById('snake-status');
            if (statusEl) statusEl.innerText = `🐍 Nível ${nivelSnake} | Pontos: ${pontosSnake}`; 
        }

        function desenharCobrinha() {
            const canvas = document.getElementById('snakeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d'), tamanhoBloco = canvas.width / gridTotal;
            ctx.fillStyle = '#111'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ef4444'; 
            ctx.fillRect(comida.x * tamanhoBloco, comida.y * tamanhoBloco, tamanhoBloco - 1, tamanhoBloco - 1);
            snake.forEach((parte, index) => { 
                ctx.fillStyle = index === 0 ? '#059669' : '#10b981'; 
                ctx.fillRect(parte.x * tamanhoBloco, parte.y * tamanhoBloco, tamanhoBloco - 1, tamanhoBloco - 1); 
            });
        }

        function salvarPontuacaoSnake() { 
            salvarPontuacaoGlobal("Jogo da Cobrinha", pontosSnake); 
        }
    </script>
</body>
</html>

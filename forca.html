<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Jogos - Desafio Global</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
            text-align: center;
            padding-top: 135px; /* Espaço para o cabeçalho e carrossel fixos no topo */
        }
        
        /* --- CARROSSEL INFINITO DE BANNERS (Fixo no Topo) --- */
        .banner-carousel {
            position: fixed;
            top: 41px;
            left: 0;
            width: 100%;
            background: rgba(30, 64, 175, 0.95);
            backdrop-filter: blur(5px);
            padding: 8px 0;
            z-index: 3000;
            overflow-x: auto;
            display: flex;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
        }
        .banner-carousel::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            padding: 0 10px;
            animation: rolarInfinito 35s linear infinite;
        }
        .banner-carousel:hover .carousel-track,
        .banner-carousel:active .carousel-track {
            animation-play-state: paused;
        }
        .ad-banner-card {
            flex: 0 0 150px;
            height: 90px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 2px dashed #b0bec5;
            cursor: pointer;
        }
        .ad-banner-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .ad-placeholder-text {
            font-size: 11px;
            color: #555;
            font-weight: bold;
            z-index: 2;
            text-align: center;
            padding: 0 5px;
            background: rgba(255, 255, 255, 0.85);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        /* --- CABEÇALHO FIXO NO TOPO --- */
        .top-header {
            background-color: #1e40af;
            color: white;
            padding: 10px 12px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3001;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .top-header span {
            font-size: 15px;
            font-weight: bold;
            flex-grow: 1;
            text-align: center;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .container-menu {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: 15px auto;
            box-sizing: border-box;
        }
        .btn-largo {
            display: block;
            width: 100%;
            background: #1e40af;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-decoration: none;
            text-align: center;
        }
        .grid-jogos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-jogo {
            padding: 15px 10px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn-jogo.completo {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho Fixo -->
    <div class="top-header">
        <a href="entretenimento.html" class="back-btn">⬅ Voltar</a>
        <span>🎮 Central de Jogos</span>
        <div style="width: 50px;"></div>
    </div>

    <!-- Carrossel de Banners Fixo no Topo -->
    <div class="banner-carousel">
        <div class="carousel-track" id="carouselTrack">
            <div class="ad-banner-card" onclick="registrarCliqueBanner('banner-jogo-1', 'fale-conosco.html')">
                <div class="ad-placeholder-text"><span>🖼️ Anuncie Aqui</span><span style="font-size: 9px; color: #888; margin-top: 2px;">Jogo 1</span></div>
            </div>
            <div class="ad-banner-card" onclick="registrarCliqueBanner('banner-jogo-2', 'fale-conosco.html')">
                <div class="ad-placeholder-text"><span>🖼️ Anuncie Aqui</span><span style="font-size: 9px; color: #888; margin-top: 2px;">Jogo 2</span></div>
            </div>
            <div class="ad-banner-card" onclick="registrarCliqueBanner('banner-jogo-3', 'fale-conosco.html')">
                <div class="ad-placeholder-text"><span>🖼️ Anuncie Aqui</span><span style="font-size: 9px; color: #888; margin-top: 2px;">Jogo 3</span></div>
            </div>
            <div class="ad-banner-card" onclick="registrarCliqueBanner('banner-jogo-4', 'fale-conosco.html')">
                <div class="ad-placeholder-text"><span>🖼️ Anuncie Aqui</span><span style="font-size: 9px; color: #888; margin-top: 2px;">Jogo 4</span></div>
            </div>
        </div>
    </div>

    <div class="container-menu">
        <!-- Botão Retangular de Ranking -->
        <a href="ranking.html" class="btn-largo">🏆 Ver Ranking Global</a>

        <!-- Lista de Jogos -->
        <div class="grid-jogos">
            <a href="jogo-minicraque.html" class="btn-jogo" style="background: #15803d;">⚽ Mini Craque</a>
            <a href="jogo-velha.html" class="btn-jogo" style="background: #2563eb;">❌ Jogo da Velha</a>
            <a href="jogo-forca.html" class="btn-jogo" style="background: #0d9488;">🎯 Jogo da Forca</a>
            <a href="jogo-memoria.html" class="btn-jogo" style="background: #7e22ce;">🧠 Jogo da Memória</a>
            <a href="jokenpo.html" class="btn-jogo completo" style="background: #c2410c;">🇧🇷 Jokenpô Brasil</a>
            <a href="jogo-cobrinha.html" class="btn-jogo completo" style="background: #047857;">🐍 Jogo da Cobrinha</a>
        </div>
    </div>

    <!-- Script do Carrossel Infinito e Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
          authDomain: "ajuda-jp.firebaseapp.com",
          projectId: "ajuda-jp",
          storageBucket: "ajuda-jp.firebasestorage.app",
          messagingSenderId: "40121072206",
          appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function configurarCarrosselInfinito() {
            const track = document.getElementById('carouselTrack');
            if (!track || track.dataset.initialized === "true") return;
            
            const items = Array.from(track.children);
            items.forEach(item => {
                const clone = item.cloneNode(true);
                track.appendChild(clone);
            });
            
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
            track.dataset.initialized = "true";
        }

        window.addEventListener('load', () => {
            configurarCarrosselInfinito();
        });

        window.registrarCliqueBanner = async function(bannerId, urlDestino) {
            try {
                const bannerRef = doc(db, 'banners', bannerId);
                await updateDoc(bannerRef, {
                    cliques: increment(1)
                });
            } catch (error) {
                console.log("Erro ao contabilizar clique: ", error);
            } finally {
                window.location.href = urlDestino;
            }
        };
    </script>
</body>
</html>

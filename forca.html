<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos - Mini Craque</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .header-jogo {
            width: 100%;
            background-color: #1a365d;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .botoes-topo {
            display: flex;
            gap: 10px;
            margin: 10px;
            width: 95%;
            max-width: 400px;
            justify-content: space-between;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-voltar { background-color: #5c768d; }
        .btn-salvar { background-color: #2e8540; }
        
        .placar-box {
            background-color: #2e8540;
            color: white;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 95%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
        }
        .campo-container {
            position: relative;
            width: 95%;
            max-width: 400px;
            height: 450px;
            background-color: #2e8540;
            border: 4px solid white;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
        }
        /* Trave invertida corretamente para cima */
        .gol {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 120px;
            border: 4px solid white;
            border-bottom: none;
        }
        .jogador-campo {
            position: absolute;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            transition: transform 0.1s;
        }
        .bola {
            position: absolute;
            width: 42px;
            height: 42px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
            z-index: 5;
        }
        .instrucao {
            color: white;
            font-weight: bold;
            text-align: center;
            position: absolute;
            bottom: 12px;
            width: 100%;
            font-size: 13px;
            text-shadow: 1px 1px 2px black;
        }
        .mensagem-gool {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 45px;
            font-weight: bold;
            color: yellow;
            text-shadow: 2px 2px 4px black;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header-jogo">
        <span>🎮 Central de Jogos</span>
        <button class="btn" style="background: #333;" id="btnSom">Som: Ligado</button>
    </div>

    <div class="botoes-topo">
        <button class="btn btn-voltar" id="btnVoltar">Voltar</button>
        <button class="btn btn-salvar" id="btnSalvar">Salvar Pontos</button>
    </div>

    <div class="placar-box">
        <span>⚽ Mini Craque</span>
        <span id="scoreCraqueText">Gols: 0 | Vidas: 3</span>
    </div>

    <div class="campo-container" id="gameAreaCraque">
        <div class="gol" id="gol">
            <div class="jogador-campo" id="goalkeeperCraque" style="top: 10px; left: 100px;">🤖</div>
            <div class="jogador-campo" id="defCraque1" style="top: 60px; left: 80px; display: none;">🛡️</div>
            <div class="jogador-campo" id="defCraque2" style="top: 60px; left: 140px; display: none;">🛡️</div>
            <div class="jogador-campo" id="defCraque3" style="top: 60px; left: 20px; display: none;">🛡️</div>
        </div>
        
        <svg style="position:absolute; width:100%; height:100%; pointer-events:none; z-index:2;">
            <line id="trajectoryCraque" x1="0" y1="0" x2="0" y2="0" stroke="yellow" stroke-dasharray="4" stroke-width="3"/>
        </svg>

        <div class="bola" id="ballCraque">⚽</div>
        <div class="mensagem-gool" id="msgGoalCraque">GOOL!</div>
        <div class="instrucao" id="txtInstrucao">Arraste a bola para posicionar ou chutar!</div>
    </div>

    <script>
        let golsCraque = 0;
        let vidasCraque = 3;
        let defsCraqueActive = 0;
        let craqueSpeedMultiplier = 1;
        let craqueRunning = true;
        let jogoAtualAtivo = 'futebol';

        const ballCraque = document.getElementById('ballCraque');
        const goalkeeperCraque = document.getElementById('goalkeeperCraque');
        const defCraque1 = document.getElementById('defCraque1');
        const defCraque2 = document.getElementById('defCraque2');
        const defCraque3 = document.getElementById('defCraque3');
        const gameAreaCraque = document.getElementById('gameAreaCraque');
        const trajectoryCraque = document.getElementById('trajectoryCraque');
        const msgGoalCraque = document.getElementById('msgGoalCraque');
        const scoreCraqueText = document.getElementById('scoreCraqueText');
        const txtInstrucao = document.getElementById('txtInstrucao');

        let ballBaseX = 0;
        let ballBaseY = 30; // Posição inicial mais abaixo
        let ballCraqueX = 0;
        let ballCraqueY = 30;
        let isDraggingCraque = false;
        let startCraqueX, startCraqueY;

        let gkCraqueX = 100, gkCraqueDir = 1;
        let def1CraqueX = 80, def1CraqueDir = 1;
        let def2CraqueX = 140, def2CraqueDir = -1;
        let def3CraqueX = 20, def3CraqueDir = 1;

        function iniciarCraque() {
            golsCraque = 0;
            vidasCraque = 3;
            defsCraqueActive = 0;
            craqueSpeedMultiplier = 1;
            defCraque1.style.display = 'none';
            defCraque2.style.display = 'none';
            defCraque3.style.display = 'none';
            updateScoreCraque();
            resetBallCraque();
            requestAnimationFrame(craqueGameLoop);
        }

        function resetBallCraque() {
            ballBaseX = (gameAreaCraque.clientWidth / 2) - 21;
            ballCraqueX = ballBaseX;
            ballCraqueY = ballBaseY;
            ballCraque.style.bottom = ballCraqueY + 'px';
            ballCraque.style.left = ballCraqueX + 'px';
            trajectoryCraque.setAttribute('x1', 0);
            trajectoryCraque.setAttribute('y1', 0);
            trajectoryCraque.setAttribute('x2', 0);
            trajectoryCraque.setAttribute('y2', 0);
            txtInstrucao.innerText = "Arraste a bola para posicionar e solte para chutar!";
        }

        // Eventos de arrastar a bola
        ballCraque.addEventListener('mousedown', startDragCraque);
        ballCraque.addEventListener('touchstart', startDragCraque);
        document.addEventListener('mousemove', dragCraque);
        document.addEventListener('touchmove', dragCraque, { passive: false });
        document.addEventListener('mouseup', endDragCraque);
        document.addEventListener('touchend', endDragCraque);

        function startDragCraque(e) {
            if (!craqueRunning) return;
            isDraggingCraque = true;
            startCraqueX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            startCraqueY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        }

        function dragCraque(e) {
            if (!isDraggingCraque || !craqueRunning) return;
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            let dx = clientX - startCraqueX;
            let dy = clientY - startCraqueY;

            if (dy > 0) dy = 0; // Puxar para trás (para cima na tela)
            
            ballCraqueX = ballBaseX + dx;
            ballCraqueY = ballBaseY - dy;

            // Limites da área do jogo
            ballCraqueX = Math.max(10, Math.min(ballCraqueX, gameAreaCraque.clientWidth - 50));
            ballCraqueY = Math.max(20, Math.min(ballCraqueY, gameAreaCraque.clientHeight - 60));

            ballCraque.style.left = ballCraqueX + 'px';
            ballCraque.style.bottom = ballCraqueY + 'px';

            // Linha guia de trajetória
            let areaRect = gameAreaCraque.getBoundingClientRect();
            let currentX = ballCraqueX + 21;
            let currentY = ballCraqueY + 21;
            
            trajectoryCraque.setAttribute('x1', currentX);
            trajectoryCraque.setAttribute('y1', areaRect.height - currentY);
            trajectoryCraque.setAttribute('x2', currentX - (dx * 0.8));
            trajectoryCraque.setAttribute('y2', areaRect.height - (currentY + (dy * 0.8)));
        }

        function endDragCraque(e) {
            if (!isDraggingCraque || !craqueRunning) return;
            isDraggingCraque = false;
            trajectoryCraque.setAttribute('x1', 0);
            trajectoryCraque.setAttribute('y1', 0);
            trajectoryCraque.setAttribute('x2', 0);
            trajectoryCraque.setAttribute('y2', 0);

            // Se o usuário soltou na parte superior (direção ao gol), executa o chute. Caso contrário, a bola fica parada onde soltou.
            if (ballCraqueY > 180) {
                let targetX = ballCraqueX;
                animateShotCraque(targetX);
            } else {
                txtInstrucao.innerText = "Bola posicionada! Arraste mais para cima para chutar.";
                ballBaseX = ballCraqueX;
                ballBaseY = ballCraqueY;
            }
        }

        function animateShotCraque(targetX) {
            let currentBottom = parseInt(ballCraque.style.bottom);
            let currentLeft = parseInt(ballCraque.style.left);
            let stepY = 16;
            let stepX = (targetX - currentLeft) / 10;

            let flight = setInterval(() => {
                currentBottom += stepY;
                currentLeft += stepX;
                ballCraque.style.bottom = currentBottom + 'px';
                ballCraque.style.left = currentLeft + 'px';

                let bRect = ballCraque.getBoundingClientRect();
                
                if (defsCraqueActive >= 3 && checkCollisionCraque(bRect, defCraque3.getBoundingClientRect())) {
                    clearInterval(flight);
                    handleMissCraque("Defendido pela Defesa 3!");
                    return;
                }
                if (defsCraqueActive >= 2 && checkCollisionCraque(bRect, defCraque2.getBoundingClientRect())) {
                    clearInterval(flight);
                    handleMissCraque("Defendido pela Defesa 2!");
                    return;
                }
                if (defsCraqueActive >= 1 && checkCollisionCraque(bRect, defCraque1.getBoundingClientRect())) {
                    clearInterval(flight);
                    handleMissCraque("Defendido pela Defesa 1!");
                    return;
                }
                if (checkCollisionCraque(bRect, goalkeeperCraque.getBoundingClientRect())) {
                    clearInterval(flight);
                    handleMissCraque("O Goleiro defendeu!");
                    return;
                }

                if (currentBottom >= gameAreaCraque.clientHeight - 80) {
                    clearInterval(flight);
                    handleGoalCraque();
                    return;
                }
            }, 20);
        }

        function checkCollisionCraque(r1, r2) {
            return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
        }

        function handleGoalCraque() {
            golsCraque++;
            updateScoreCraque();
            msgGoalCraque.style.display = 'block';
            
            if (golsCraque >= 2) { defsCraqueActive = 1; defCraque1.style.display = 'flex'; }
            if (golsCraque >= 4) { defsCraqueActive = 2; defCraque2.style.display = 'flex'; }
            if (golsCraque >= 6) { defsCraqueActive = 3; defCraque3.style.display = 'flex'; }
            
            craqueSpeedMultiplier += 0.2;

            setTimeout(() => {
                msgGoalCraque.style.display = 'none';
                resetBallCraque();
            }, 1000);
        }

        function handleMissCraque(reason) {
            vidasCraque--;
            updateScoreCraque();
            txtInstrucao.innerText = reason;
            setTimeout(() => {
                if (vidasCraque <= 0) {
                    alert("Fim de jogo! Suas vidas acabaram.");
                    golsCraque = 0;
                    vidasCraque = 3;
                    defsCraqueActive = 0;
                    defCraque1.style.display = 'none';
                    defCraque2.style.display = 'none';
                    defCraque3.style.display = 'none';
                    craqueSpeedMultiplier = 1;
                }
                resetBallCraque();
            }, 1200);
        }

        function updateScoreCraque() {
            scoreCraqueText.innerText = `Gols: ${golsCraque} | Vidas: ${vidasCraque}`;
        }

        function craqueGameLoop() {
            if (jogoAtualAtivo === 'futebol') {
                let maxW = gameAreaCraque.clientWidth - 45;
                
                gkCraqueX += gkCraqueDir * (1.6 * craqueSpeedMultiplier);
                if (gkCraqueX <= 5 || gkCraqueX >= maxW) gkCraqueDir *= -1;
                goalkeeperCraque.style.left = gkCraqueX + 'px';

                if (defsCraqueActive >= 1) {
                    def1CraqueX += def1CraqueDir * (1.3 * craqueSpeedMultiplier);
                    if (def1CraqueX <= 5 || def1CraqueX >= maxW) def1CraqueDir *= -1;
                    defCraque1.style.left = def1CraqueX + 'px';
                }
                if (defsCraqueActive >= 2) {
                    def2CraqueX += def2CraqueDir * (1.5 * craqueSpeedMultiplier);
                    if (def2CraqueX <= 5 || def2CraqueX >= maxW) def2CraqueDir *= -1;
                    defCraque2.style.left = def2CraqueX + 'px';
                }
                if (defsCraqueActive >= 3) {
                    def3CraqueX += def3CraqueDir * (1.7 * craqueSpeedMultiplier);
                    if (def3CraqueX <= 5 || def3CraqueX >= maxW) def3CraqueDir *= -1;
                    defCraque3.style.left = def3CraqueX + 'px';
                }
            }
            requestAnimationFrame(craqueGameLoop);
        }

        // Funções dos Botões Voltar e Salvar
        document.getElementById('btnVoltar').addEventListener('click', () => {
            window.history.back();
        });

        document.getElementById('btnSalvar').addEventListener('click', () => {
            alert(`Pontuação de ${golsCraque} gols salva com sucesso!`);
        });

        // Inicializar o jogo ao carregar
        window.onload = iniciarCraque;
    </script>
</body>
</html>

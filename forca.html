<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Jogos - Desafio Global</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 8px;
            color: #333;
            padding-bottom: 25px;
            text-align: center;
            overscroll-behavior-y: none;
            touch-action: manipulation;
        }

        /* Banner Fixo no Topo */
        .carousel-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            max-width: 600px;
            margin: 0 auto 8px auto;
            overflow: hidden;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: #000;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-slide {
            min-width: 100%;
            box-sizing: border-box;
        }
        .carousel-slide img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 12px;
            z-index: 10;
        }
        .carousel-btn.prev { left: 6px; }
        .carousel-btn.next { right: 6px; }
        
        .carousel-dots {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 10;
        }
        .dot {
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }
        .dot.active { background: white; }

        /* Cabeçalho */
        .header {
            background-color: #0047ab;
            color: white;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        .header h1 { font-size: 13px; margin: 0; }
        .btn-audio-toggle {
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
            color: white;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        .action-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .action-btn:hover { background-color: #1d4ed8; }
        
        .buttons-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .top-action-btn {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 0;
        }
        .btn-blue { background-color: #2563eb; }
        .btn-orange { background-color: #d97706; }

        .card-game {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 10px;
        }
        .menu-jogos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Canvas do Mini Craque */
        canvas#gameCanvas {
            border: 4px solid #2e7d32;
            background-color: #2e7d32;
            cursor: pointer;
            border-radius: 8px;
            display: block;
            margin: 0 auto 8px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            touch-action: none;
        }

        .jokenpo-arena {
            background: linear-gradient(135deg, #009b3a 0%, #002776 100%);
            color: white;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .botoes-brasil {
            background: #fedf00;
            border: 2px solid #009b3a;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .btn-jogada-br {
            font-size: 22px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 2px solid #002776;
            background: white;
            cursor: pointer;
        }
        .control-btn {
            background: #e2e8f0;
            border: none;
            font-size: 18px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #0047ab;
            touch-action: manipulation;
        }
    </style>
</head>
<body onclick="ativarAudioGlobal()">

    <div class="carousel-container">
        <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x110/0047ab/ffffff?text=Banner+1" alt="Banner 1"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x110/00796b/ffffff?text=Banner+2" alt="Banner 2"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x110/7b1fa2/ffffff?text=Banner+3" alt="Banner 3"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x110/e65100/ffffff?text=Banner+4" alt="Banner 4"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x110/059669/ffffff?text=Banner+5" alt="Banner 5"></div>

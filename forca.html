<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Geral - Central de Jogos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
            padding-bottom: 80px;
            text-align: center;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            background-color: #d97706;
            color: white;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 15px;
            text-align: left;
        }
        .select-jogo {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #d97706;
            font-size: 14px;
            font-weight: bold;
            background: #fffbeb;
            color: #92400e;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        th { color: #d97706; font-weight: bold; }
        tr:nth-child(1) td { font-weight: bold; color: #b45309; }
        
        .btn-voltar {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            text-align: center;
        }

        /* Barra de Navegação Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 55px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 0.75rem;
            flex-grow: 1;
        }
        .nav-item.active { color: #0047ab; font-weight: bold; }
        .nav-item span.icon { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">🏆 Ranking Geral dos Jogadores</div>

        <!-- Alterado para apontar corretamente para a página de Lazer/Jogos -->
        <a href="entretenimento.html" class="btn-voltar">🎮 Voltar para a Central de Jogos</a>

        <div class="card">
            <label for="seletorRanking" style="font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 5px;">Selecione o Jogo:</label>
            <select id="seletorRanking" class="select-jogo" onchange="mudarRanking(this.value)">
                <option value="ranking_mini_craque">⚽ Mini Craque</option>
                <option value="ranking_jogo_da_velha">❌ Jogo da Velha</option>
                <option value="ranking_jogo_da_forca">🎯 Jogo da Forca</option>
                <option value="ranking_jogo_da_memoria">🧠 Jogo da Memória</option>
                <option value="ranking_jokenpo_brasil">🇧🇷 Jokenpô Brasil</option>
                <option value="ranking_jogo_da_cobrinha">🐍 Jogo da Cobrinha</option>
            </select>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">Pos</th>
                            <th>Jogador</th>
                            <th style="text-align: right;">Pontos</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaRankingCorpo">
                        <!-- Dados injetados via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
        <a href="servicos.html" class="nav-item"><span class="icon">📋</span><span>Serviços</span></a>
        <a href="entretenimento.html" class="nav-item active"><span class="icon">🎬</span><span>Lazer</span></a>
        <a href="perfil.html" class="nav-item"><span class="icon">👤</span><span>Perfil</span></a>
    </nav>

    <script>
        function mudarRanking(chaveStorage) {
            const corpoTabela = document.getElementById('tabelaRankingCorpo');
            corpoTabela.innerHTML = "";
            
            let ranking = JSON.parse(localStorage.getItem(chaveStorage) || "[]");
            
            // Ordena o ranking do maior para o menor ponto caso venha desordenado
            ranking.sort((a, b) => b.pontos - a.pontos);
            
            if (ranking.length === 0) {
                corpoTabela.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888; padding: 20px;">Nenhuma pontuação salva ainda neste jogo. Jogue e clique em 'Salvar Pontos'!</td></tr>`;
                return;
            }

            ranking.forEach((item, index) => {
                let iconePos = index === 0 ? "🥇 " : index === 1 ? "🥈 " : index === 2 ? "🥉 " : `${index + 1}º`;
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold;">${iconePos}</td>
                    <td>${item.nome}</td>
                    <td style="text-align: right; font-weight: bold; color: #d97706;">${item.pontos} pts</td>
                `;
                corpoTabela.appendChild(tr);
            });
        }

        // Carrega o ranking do Mini Craque por padrão ao abrir a página
        mudarRanking('ranking_mini_craque');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos - Desafio Global</title>
    <style>
        /* [SEU CSS ORIGINAL FOI MANTIDO] */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; padding-bottom: 80px; text-align: center; }
        .carousel-container { position: sticky; top: 0; z-index: 1000; max-width: 600px; margin: 0 auto 10px auto; overflow: hidden; border-radius: 0 0 12px 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); background: #000; }
        .carousel-track { display: flex; transition: transform 0.5s ease-in-out; }
        .carousel-slide { min-width: 100%; box-sizing: border-box; }
        .carousel-slide img { width: 100%; height: 140px; object-fit: cover; display: block; }
        .header { background-color: #0047ab; color: white; padding: 8px 15px; display: flex; align-items: center; justify-content: space-between; border-radius: 8px; margin-bottom: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .menu-jogos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-btn { color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #ffffff; display: flex; justify-content: space-around; align-items: center; height: 55px; box-shadow: 0 -2px 6px rgba(0,0,0,0.1); z-index: 999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #666; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- CARROSSEL -->
    <div class="carousel-container">
        <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x140/0047ab/ffffff?text=Banner+1" alt="Banner"></div>
            <!-- Adicione seus outros banners aqui -->
        </div>
    </div>

    <div class="header"><h1>🎮 Central de Jogos</h1></div>

    <div class="container">
        <div class="menu-jogos">
            <!-- BOTÕES COM LINKS REAIS (Substitua o # pelo link real de cada jogo) -->
            <button onclick="window.location.href='velha.html'" class="action-btn" style="background-color: #2563eb;">❌ Jogo da Velha</button>
            <button onclick="window.location.href='forca.html'" class="action-btn" style="background-color: #00796b;">🎯 Jogo da Forca</button>
            <button onclick="window.location.href='memoria.html'" class="action-btn" style="background-color: #7b1fa2;">🧠 Jogo da Memória</button>
            <button onclick="window.location.href='jokenpo.html'" class="action-btn" style="background-color: #e65100;">🇧🇷 Jokenpô Brasil</button>
            <button onclick="window.location.href='cobrinha.html'" class="action-btn" style="background-color: #059669;">🐍 Jogo da Cobrinha</button>
            
            <!-- SEU JOGO DE FUTEBOL -->
            <button onclick="window.location.href='futebol.html'" class="action-btn" style="background-color: #16a34a;">⚽ Jogo de Futebol</button>

            <button onclick="window.location.href='pong.html'" class="action-btn" style="background-color: #ea580c; grid-column: span 2;">🏓 Pong Clássico</button>
        </div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR FUNCIONAL -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'"><span>🏠</span><span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='servicos.html'"><span>📋</span><span>Serviços</span></div>
        <div class="nav-item" onclick="window.location.href='lazer.html'"><span>🎬</span><span>Lazer</span></div>
        <div class="nav-item" onclick="window.location.href='perfil.html'"><span>👤</span><span>Perfil</span></div>
    </nav>
    
</body>
</html>

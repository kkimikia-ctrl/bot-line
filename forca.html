<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Jogos - Desafio Global</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
            padding-bottom: 20px;
            text-align: center;
        }

        /* Banner Fixo no Topo */
        .carousel-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            max-width: 600px;
            margin: 0 auto 10px auto;
            overflow: hidden;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: #000;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-slide {
            min-width: 100%;
            box-sizing: border-box;
        }
        .carousel-slide img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 14px;
            z-index: 10;
        }
        .carousel-btn.prev { left: 8px; }
        .carousel-btn.next { right: 8px; }
        
        .carousel-dots {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }
        .dot.active { background: white; }

        /* Cabeçalho */
        .header {
            background-color: #0047ab;
            color: white;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .header h1 { font-size: 14px; margin: 0; }
        .btn-audio-toggle {
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        .action-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .action-btn:hover { background-color: #1d4ed8; }
        
        .buttons-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .top-action-btn {
            flex: 1;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 0;
        }
        .btn-blue { background-color: #2563eb; }
        .btn-orange { background-color: #d97706; }

        .card-game {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .menu-jogos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .jokenpo-arena {
            background: linear-gradient(135deg, #009b3a 0%, #002776 100%);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .botoes-brasil {
            background: #fedf00;
            border: 2px solid #009b3a;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn-jogada-br {
            font-size: 26px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #002776;
            background: white;
            cursor: pointer;
        }
        .control-btn {
            background: #e2e8f0;
            border: none;
            font-size: 20px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #0047ab;
        }

        /* Estilos atualizados do Mini Craque (Gol menor, defesas e bola mais abaixo) */
        .game-area-craque {
            position: relative;
            width: 100%;
            height: 440px;
            background: #2e8b57;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 15px;
            margin-top: 10px;
            touch-action: none;
        }
        /* Gol mais estreito e menor */
        .goal-box {
            position: absolute;
            top: 5px;
            width: 40%;
            height: 60px;
            border: 3px solid white;
            border-bottom: none;
        }
        /* Goleiro fixo na linha do gol */
        .goalkeeper-craque {
            position: absolute;
            top: 5px;
            width: 28px;
            height: 28px;
            background: #ff4500;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        /* Defesas Progressivas mais abaixo do gol */
        .defender-craque {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: none;
        }
        #defCraque1 { background-color: #10b981; top: 75px; } /* Verde */
        #defCraque2 { background-color: #f59e0b; top: 125px; } /* Amarelo */
        #defCraque3 { background-color: #ef4444; top: 175px; } /* Vermelho */

        .ball-craque {
            position: absolute;
            bottom: 35px; /* Bola bem mais abaixo, próxima da base */
            width: 38px;
            height: 38px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 10;
            font-size: 20px;
            user-select: none;
        }
        .msg-goal-craque {
            position: absolute;
            top: 42%;
            font-size: 38px;
            font-weight: bold;
            color: yellow;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: none;
            z-index: 20;
            animation: pulseGool 0.4s infinite alternate;
        }
        @keyframes pulseGool {
            from { transform: scale(1); }
            to { transform: scale(1.25); }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Craque</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-bottom: 60px;
        }
        .header-jogo {
            width: 100%;
            background-color: #1a365d;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .placar-box {
            background-color: #2e8540;
            color: white;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 5px;
            margin: 10px 0;
            width: 95%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
        }
        .campo-container {
            position: relative;
            width: 95%;
            max-width: 400px;
            height: 450px;
            background-color: #2e8540;
            border: 4px solid white;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
        }
        /* Gol redimensionado */
        .gol {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 110px;
            border: 4px solid white;
            border-top: none;
        }
        .goleiro {
            position: absolute;
            font-size: 30px;
            transition: left 0.3s ease;
        }
        .bola {
            position: absolute;
            width: 45px;
            height: 45px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            user-select: none;
        }
        .instrucao {
            color: white;
            font-weight: bold;
            text-align: center;
            position: absolute;
            bottom: 15px;
            width: 100%;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }
        .botoes-topo {
            display: flex;
            gap: 10px;
            margin: 10px;
            width: 95%;
            max-width: 400px;
            justify-content: space-between;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-voltar { background-color: #5c768d; }
        .btn-salvar { background-color: #2e8540; }
        
        .mensagem-gool {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 45px;
            font-weight: bold;
            color: yellow;
            text-shadow: 2px 2px 4px black;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header-jogo">
        <span>🎮 Central de Jogos</span>
        <button class="btn" style="background: #333;" id="btnSom">Som: Ligado</button>
    </div>

    <div class="botoes-topo">
        <button class="btn btn-voltar">Voltar</button>
        <button class="btn btn-salvar">Salvar Pontos</button>
    </div>

    <div class="placar-box">
        <span>⚽ Mini Craque</span>
        <span id="txtPlacar">Gols: 0 | Vidas: 3</span>
    </div>

    <div class="campo-container" id="campo">
        <div class="gol" id="gol"></div>
        <div class="goleiro" id="goleiro">🤖</div>
        <div class="bola" id="bola">⚽</div>
        <div class="mensagem-gool" id="msgGool">GOOL!</div>
        <div class="instrucao" id="txtInstrucao">Puxe a bola para trás e solte para chutá-la!</div>
    </div>

    <script>
        let gols = 0;
        let vidas = 3;
        
        const bola = document.getElementById('bola');
        const campo = document.getElementById('campo');
        const goleiro = document.getElementById('goleiro');
        const msgGool = document.getElementById('msgGool');
        const txtPlacar = document.getElementById('txtPlacar');
        const txtInstrucao = document.getElementById('txtInstrucao');

        // Posição inicial da bola (mais abaixo no campo)
        const posicaoInicialX = 177; // Centralizada horizontalmente (largura do campo 400 - 45 / 2)
        const posicaoInicialY = 370; // Posicionada bem embaixo

        function resetarBola() {
            bola.style.left = posicaoInicialX + 'px';
            bola.style.top = posicaoInicialY + 'px';
            txtInstrucao.innerText = "Puxe a bola, posicione onde quiser e solte para chutar!";
        }

        resetarBola();

        let isDragging = false;
        let startX, startY;

        function iniciarArrasto(e) {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const rect = bola.getBoundingClientRect();
            startX = clientX - rect.left;
            startY = clientY - rect.top;
        }

        function duranteArrasto(e) {
            if (!isDragging) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const campoRect = campo.getBoundingClientRect();
            
            let novoX = clientX - campoRect.left - startX;
            let novoY = clientY - campoRect.top - startY;

            // Limites do campo
            novoX = Math.max(0, Math.min(novoX, campo.clientWidth - bola.clientWidth));
            novoY = Math.max(0, Math.min(novoY, campo.clientHeight - bola.clientHeight));

            bola.style.left = novoX + 'px';
            bola.style.top = novoY + 'px';
        }

        function fimArrasto() {
            if (!isDragging) return;
            isDragging = false;

            // Coordenadas atuais da bola ao soltar
            let bolaX = parseInt(bola.style.left);
            let bolaY = parseInt(bola.style.top);

            // Verifica se a bola foi solta na metade superior (direção ao gol)
            // Se soltar ainda embaixo, ela apenas fica parada onde o usuário soltou, permitindo mirar depois.
            if (bolaY < 250) {
                executarChute(bolaX, bolaY);
            } else {
                txtInstrucao.innerText = "Bola posicionado! Arraste mais para cima para chutar ou mova novamente.";
            }
        }

        function executarChute(startXPos, startYPos) {
            txtInstrucao.innerText = "Chutando...";
            
            // Simulação de trajetória simples até a linha do gol
            let targetX = 170 + Math.random() * 50; 
            let targetY = 35; // Altura da linha do gol

            let startTime = null;
            const duration = 400; // milissegundos

            function animar(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / duration;
                
                if (progress < 1) {
                    let currentX = startXPos + (targetX - startXPos) * progress;
                    let currentY = startYPos + (targetY - startYPos) * progress;
                    bola.style.left = currentX + 'px';
                    bola.style.top = currentY + 'px';
                    requestAnimationFrame(animar);
                } else {
                    verificarGol(targetX, targetY);
                }
            }

            requestAnimationFrame(animar);
        }

        function verificarGol(finalX, finalY) {
            // Limites exatos do gol dentro do campo
            const golEsquerda = 90;
            const golDireita = 310;
            const golTopo = 20;
            const golFundo = 130;

            if (finalX >= golEsquerda && finalX <= golDireita && finalY >= golTopo && finalY <= golFundo) {
                gols++;
                msgGool.style.display = 'block';
                setTimeout(() => {
                    msgGool.style.display = 'none';
                    resetarBola();
                }, 1200);
            } else {
                vidas--;
                txtInstrucao.innerText = "Defesa do goleiro! Tente novamente.";
                setTimeout(() => {
                    if (vidas > 0) {
                        resetarBola();
                    } else {
                        alert("Fim de jogo! Suas vidas acabaram.");
                        gols = 0;
                        vidas = 3;
                        resetarBola();
                    }
                }, 1200);
            }
            txtPlacar.innerText = `Gols: ${gols} | Vidas: ${vidas}`;
        }

        // Eventos de Mouse
        bola.addEventListener('mousedown', iniciarArrasto);
        document.addEventListener('mousemove', duranteArrasto);
        document.addEventListener('mouseup', fimArrasto);

        // Eventos de Toque (Mobile)
        bola.addEventListener('touchstart', iniciarArrasto);
        document.addEventListener('touchmove', duranteArrasto, { passive: false });
        document.addEventListener('touchend', fimArrasto);
    </script>
</body>
</html>

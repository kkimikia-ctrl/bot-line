    <title>Entretenimento e Lazer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
            padding-bottom: 80px;
        }
        .header-top {
            background-color: #0047ab;
            color: white;
            padding: 12px 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .menu-card {
            background: white;
            padding: 18px 10px;
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            border: 1px solid #eaeaea;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .menu-card:active {
            transform: scale(0.97);
        }
        .menu-card .icon {
            font-size: 26px;
            margin-bottom: 8px;
        }
        .menu-card .title {
            font-weight: bold;
            color: #0047ab;
            font-size: 14px;
            margin-bottom: 3px;
        }
        .menu-card .subtitle {
            font-size: 11px;
            color: #666;
        }

        /* Barra de Navegação Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 55px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 0.75rem;
            flex-grow: 1;
            cursor: pointer;
        }
        .nav-item.active { color: #0047ab; font-weight: bold; }
        .nav-item span.icon-nav { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>

<!-- Copie este bloco para substituir a parte do Jogo da Memória e Jokenpô no seu código -->

            <!-- Jogo da Memória com Níveis (1 a 8) e Progressão (X/3) -->
            <div id="container-jogo-memoria" style="display: none;">
                <button onclick="voltarMenuJogos()" style="background: #ccc; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: left;">⬅ Voltar</button>
                <div style="clear: both;"></div>
                
                <!-- Destaque para Nível e Fase -->
                <div style="background: #0d47a1; color: white; padding: 10px; border-radius: 10px; margin-bottom: 15px;">
                    <h3 id="texto-nivel-fase" style="margin: 0; font-size: 18px;">Nível 1 ( 1 / 3 )</h3>
                </div>
                
                <div id="tabuleiro-memoria" style="display: grid; gap: 6px; justify-content: center; margin-bottom: 15px;"></div>
            </div>

            <!-- Jokenpô com Suspense e Interrogação -->
            <div id="container-jokenpo" style="display: none;">
                <button onclick="voltarMenuJogos()" style="background: #ccc; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: left;">⬅ Voltar</button>
                <div style="clear: both;"></div>
                <h3 style="color: #0d47a1; margin: 5px 0;">✌️ Jokenpô</h3>
                
                <!-- Ponto de interrogação inicial -->
                <div style="margin: 20px auto; width: 80px; height: 80px; line-height: 80px; font-size: 40px; background: #e8f0fe; border: 3px dashed #0d47a1; border-radius: 50%;">
                    <span id="computador-escolha">❓</span>
                </div>

                <p id="resultado-jokenpo" style="font-size: 16px; font-weight: bold; color: #333; margin: 15px 0;">Escolha sua jogada:</p>
                
                <div id="botoes-jokenpo" style="display: flex; justify-content: center; gap: 10px;">
                    <button onclick="jogarJokenpo('pedra')" id="btn-pedra" style="font-size: 30px; padding: 15px; border-radius: 12px; border: 2px solid #ddd; background: white; cursor: pointer;">✊</button>
                    <button onclick="jogarJokenpo('papel')" id="btn-papel" style="font-size: 30px; padding: 15px; border-radius: 12px; border: 2px solid #ddd; background: white; cursor: pointer;">✋</button>
                    <button onclick="jogarJokenpo('tesoura')" id="btn-tesoura" style="font-size: 30px; padding: 15px; border-radius: 12px; border: 2px solid #ddd; background: white; cursor: pointer;">✌️</button>
                </div>
                <button id="btn-proxima-rodada" onclick="reiniciarJokenpo()" class="action-btn" style="display: none; background-color: #00796b; padding: 10px; margin-top: 20px;">Jogar Novamente</button>
            </div>

<script>
    // Atualização do Nível/Fase no Jogo da Memória
    function atualizarInfoMemoria() {
        document.getElementById('texto-nivel-fase').innerText = `Nível ${nivelMemoria} ( ${faseNoNivel} / 3 )`;
    }

    // Jokenpô com delay real
    function jogarJokenpo(escolhaUsuario) {
        const opcoes = ['pedra', 'papel', 'tesoura'];
        const emojis = { pedra: '✊', papel: '✋', tesoura: '✌️' };

        // 1. Escurece imediatamente os botões não escolhidos
        opcoes.forEach(op => {
            let b = document.getElementById(`btn-${op}`);
            b.disabled = true;
            if (op !== escolhaUsuario) {
                b.style.opacity = "0.2"; 
            } else {
                b.style.borderColor = "#0d47a1";
                b.style.background = "#e8f0fe";
            }
        });

        document.getElementById('resultado-jokenpo').innerText = "Computador pensando...";
        
        // 2. Delay de 2 segundos para o suspense
        setTimeout(() => {
            const escolhaMaquina = opcoes[Math.floor(Math.random() * 3)];
            document.getElementById('computador-escolha').innerText = emojis[escolhaMaquina];

            if (escolhaUsuario === escolhaMaquina) {
                document.getElementById('resultado-jokenpo').innerText = "Empate! 😐";
            } else if (
                (escolhaUsuario === 'pedra' && escolhaMaquina === 'tesoura') ||
                (escolhaUsuario === 'papel' && escolhaMaquina === 'pedra') ||
                (escolhaUsuario === 'tesoura' && escolhaMaquina === 'papel')
            ) {
                document.getElementById('resultado-jokenpo').innerText = "🎉 YOU WIN!";
            } else {
                document.getElementById('resultado-jokenpo').innerText = "❌ YOU LOST!";
            }
            document.getElementById('btn-proxima-rodada').style.display = 'block';
        }, 2000);
    }
</script>

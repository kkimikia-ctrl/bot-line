<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Central de Jogos Completa</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; text-align: center; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 14px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-game { background: #2563eb; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #campo-futebol { background: #059669; width: 300px; height: 400px; margin: 0 auto; position: relative; border: 4px solid white; overflow: hidden; }
        .bola { width: 30px; height: 30px; background: white; border-radius: 50%; position: absolute; bottom: 20px; left: 135px; cursor: pointer; }
        .goleiro { width: 50px; height: 20px; background: #fbbf24; position: absolute; top: 50px; left: 125px; transition: left 0.5s linear; }
    </style>
</head>
<body>

    <div id="menu" class="card">
        <h1>🎮 Central de Jogos</h1>
        <div class="menu-grid">
            <button class="btn-game" onclick="abrirJogo('velha')">❌ Jogo da Velha</button>
            <button class="btn-game" onclick="abrirJogo('forca')">🎯 Jogo da Forca</button>
            <button class="btn-game" onclick="abrirJogo('memoria')">🧠 Jogo da Memória</button>
            <button class="btn-game" onclick="abrirJogo('jokenpo')">🇧🇷 Jokenpô</button>
            <button class="btn-game" onclick="abrirJogo('cobrinha')">🐍 Cobrinha</button>
            <button class="btn-game" onclick="abrirJogo('minicraque')" style="background: #059669;">⚽ Mini Craque</button>
        </div>
    </div>

    <!-- Container dos Jogos -->
    <div id="jogo-container" class="card" style="display: none;">
        <button onclick="voltar()">⬅ Voltar</button>
        <div id="area-jogo"></div>
    </div>

    <script>
        const area = document.getElementById('area-jogo');
        const menu = document.getElementById('menu');
        const container = document.getElementById('jogo-container');

        function abrirJogo(nome) {
            menu.style.display = 'none';
            container.style.display = 'block';
            area.innerHTML = ''; // Limpa antes de carregar

            if (nome === 'minicraque') {
                area.innerHTML = `
                    <h3>Mini Craque</h3>
                    <div id="campo-futebol">
                        <div id="goleiro-movel" class="goleiro"></div>
                        <div id="bola-futebol" class="bola" onclick="chutar()"></div>
                    </div>`;
                iniciarGoleiro();
            } else {
                area.innerHTML = `<h3>Jogo ${nome.toUpperCase()}</h3><p>Em breve no seu navegador!</p>`;
            }
        }

        function voltar() {
            menu.style.display = 'block';
            container.style.display = 'none';
        }

        function iniciarGoleiro() {
            setInterval(() => {
                const g = document.getElementById('goleiro-movel');
                if(g) g.style.left = (Math.random() * 250) + "px";
            }, 800);
        }

        function chutar() {
            const b = document.getElementById('bola-futebol');
            b.style.transition = "bottom 0.5s";
            b.style.bottom = "350px";
            setTimeout(() => { alert("GOL!!!"); b.style.bottom = "20px"; b.style.transition = "none"; }, 500);
        }
    </script>
</body>
</html>

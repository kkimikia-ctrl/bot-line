<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Central de Jogos</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .menu-container, .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            margin-bottom: 20px;
            color: #4CAF50;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #45a049;
        }
        canvas {
            border: 4px solid #4CAF50;
            background-color: #2e7d32;
            cursor: pointer;
        }
        .ui {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- MENU PRINCIPAL DA CENTRAL DE JOGOS -->
    <div id="mainMenu" class="menu-container">
        <h1>Central de Jogos</h1>
        <button class="btn" onclick="startMiniCraque()">Mini Craque</button>
        <button class="btn" onclick="alert('Outro jogo em breve!')">Outro Jogo</button>
    </div>

    <!-- TELA DO JOGO MINI CRAQUE -->
    <div id="miniCraqueGame" class="game-container hidden">
        <div class="ui">
            Pontuação: <span id="score">0</span> | Tentativas: <span id="attempts">3</span>
            <button class="btn" style="padding: 4px 10px; font-size: 14px; margin-left: 20px;" onclick="returnToMenu()">Menu</button>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        const mainMenu = document.getElementById('mainMenu');
        const miniCraqueGame = document.getElementById('miniCraqueGame');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameInterval = null;
        let score = 0;
        let attempts = 3;

        // Estado da Bola (Mini Craque)
        const ball = {
            x: 200,
            y: 520,
            radius: 12,
            startX: 200,
            startY: 520,
            vx: 0,
            vy: 0,
            isDragging: false,
            isMoving: false
        };

        // Goleiro
        const goalKeeper = {
            x: 170,
            y: 80,
            width: 60,
            height: 20,
            speed: 2,
            direction: 1
        };

        // Defesas móveis
        const defenders = [
            { x: 100, y: 250, width: 70, height: 15, speed: 2, direction: 1 },
            { x: 200, y: 380, width: 70, height: 15, speed: -2, direction: -1 }
        ];

        function startMiniCraque() {
            mainMenu.classList.add('hidden');
            miniCraqueGame.classList.remove('hidden');
            resetGame();
            if (!gameInterval) {
                gameInterval = requestAnimationFrame(loop);
            }
        }

        function returnToMenu() {
            miniCraqueGame.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            cancelAnimationFrame(gameInterval);
            gameInterval = null;
        }

        function resetGame() {
            score = 0;
            attempts = 3;
            document.getElementById('score').innerText = score;
            document.getElementById('attempts').innerText = attempts;
            resetBall();
        }

        // Controles de Mouse / Toque
        canvas.addEventListener('mousedown', (e) => {
            if (ball.isMoving) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const dist = Math.hypot(mouseX - ball.x, mouseY - ball.y);
            if (dist < ball.radius * 2) {
                ball.isDragging = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!ball.isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let pullX = mouseX;
            let pullY = mouseY;
            
            const maxPull = 80;
            const dist = Math.hypot(pullX - ball.startX, pullY - ball.startY);
            if (dist > maxPull) {
                pullX = ball.startX + (pullX - ball.startX) * (maxPull / dist);
                pullY = ball.startY + (pullY - ball.startY) * (maxPull / dist);
            }

            if (pullY < ball.startY) pullY = ball.startY;

            ball.x = pullX;
            ball.y = pullY;
        });

        canvas.addEventListener('mouseup', () => {
            if (!ball.isDragging) return;
            ball.isDragging = false;
            ball.isMoving = true;

            const forceMultiplier = 0.15;
            ball.vx = (ball.startX - ball.x) * forceMultiplier;
            ball.vy = (ball.startY - ball.y) * forceMultiplier;
        });

        function update() {
            if (ball.isMoving) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy *= 0.99;

                if (ball.x - ball.radius < 40 || ball.x + ball.radius > 360) {
                    ball.vx *= -1;
                }

                // GOL
                if (ball.y <= 60 && ball.x >= 130 && ball.x <= 270) {
                    score += 10;
                    document.getElementById('score').innerText = score;
                    resetBall();
                }

                // Defesa do Goleiro
                if (
                    ball.x > goalKeeper.x &&
                    ball.x < goalKeeper.x + goalKeeper.width &&
                    ball.y - ball.radius < goalKeeper.y + goalKeeper.height &&
                    ball.y + ball.radius > goalKeeper.y
                ) {
                    missShot();
                }

                // Defesas móveis
                defenders.forEach(def => {
                    if (
                        ball.x > def.x &&
                        ball.x < def.x + def.width &&
                        ball.y - ball.radius < def.y + def.height &&
                        ball.y + ball.radius > def.y
                    ) {
                        missShot();
                    }
                });

                if (ball.y < 0 || ball.y > 600 || ball.x < 0 || ball.x > 400) {
                    if (ball.y > 0) missShot();
                    else resetBall();
                }
            }

            goalKeeper.x += goalKeeper.speed * goalKeeper.direction;
            if (goalKeeper.x <= 130 || goalKeeper.x + goalKeeper.width >= 270) {
                goalKeeper.direction *= -1;
            }

            defenders.forEach(def => {
                def.x += def.speed * def.direction;
                if (def.x <= 50 || def.x + def.width >= 350) {
                    def.direction *= -1;
                }
            });
        }

        function missShot() {
            attempts--;
            document.getElementById('attempts').innerText = attempts;
            if (attempts <= 0) {
                alert('Fim de jogo! Sua pontuação final foi: ' + score);
                score = 0;
                attempts = 3;
                document.getElementById('score').innerText = score;
                document.getElementById('attempts').innerText = attempts;
            }
            resetBall();
        }

        function resetBall() {
            ball.isMoving = false;
            ball.isDragging = false;
            ball.x = ball.startX;
            ball.y = ball.startY;
            ball.vx = 0;
            ball.vy = 0;
        }

        function drawField() {
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(40, 40, 320, 520);
            ctx.strokeRect(130, 40, 140, 80);

            ctx.fillStyle = '#ff9800';
            ctx.fillRect(goalKeeper.x, goalKeeper.y, goalKeeper.width, goalKeeper.height);

            ctx.fillStyle = '#e91e63';
            defenders.forEach(def => {
                ctx.fillRect(def.x, def.y, def.width, def.height);
            });

            if (ball.isDragging) {
                ctx.beginPath();
                ctx.moveTo(ball.startX, ball.startY);
                ctx.lineTo(ball.x, ball.y);
                ctx.strokeStyle = '#ffeb3b';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000000';
            ctx.stroke();
            ctx.closePath();
        }

        function loop() {
            if (!miniCraqueGame.classList.contains('hidden')) {
                update();
                drawField();
                gameInterval = requestAnimationFrame(loop);
            }
        }
    </script>

</body>
</html>

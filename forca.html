<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca - Central de Jogos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
            padding-bottom: 80px;
            text-align: center;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            background-color: #d97706;
            color: white;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 15px;
        }
        .palavra {
            font-size: 32px;
            letter-spacing: 8px;
            font-weight: bold;
            margin: 20px 0;
            color: #1f2937;
        }
        .dica {
            font-size: 15px;
            color: #4b5563;
            margin-bottom: 20px;
            font-style: italic;
        }
        .teclado {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 15px;
        }
        .letra-btn {
            background-color: #e5e7eb;
            border: none;
            border-radius: 6px;
            width: 35px;
            height: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #1f2937;
            transition: background 0.2s;
        }
        .letra-btn:hover:not(:disabled) {
            background-color: #d97706;
            color: white;
        }
        .letra-btn:disabled {
            background-color: #9ca3af;
            color: #fff;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-acao {
            background-color: #059669;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-sizing: border-box;
        }
        .btn-voltar {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            text-align: center;
        }
        .stats {
            font-size: 15px;
            font-weight: bold;
            color: #d97706;
            margin-bottom: 10px;
        }

        /* Barra de Navegação Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 55px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 0.75rem;
            flex-grow: 1;
        }
        .nav-item.active { color: #0047ab; font-weight: bold; }
        .nav-item span.icon { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">🎯 Jogo da Forca</div>

        <a href="entretenimento.html" class="btn-voltar">🎮 Voltar para a Central de Jogos</a>

        <div class="card">
            <div class="stats">Pontos: <span id="pontos">0</span> | Erros: <span id="erros">0</span> / 6</div>
            <div class="dica" id="dica">Dica: Carregando...</div>
            <div class="palavra" id="palavraContainer">_ _ _ _ _</div>
            
            <div class="teclado" id="teclado">
                <!-- Gerado via JavaScript -->
            </div>

            <button class="btn-acao" id="btnSalvar" onclick="salvarPontos()" style="display:none;">💾 Salvar Pontos no Ranking</button>
            <button class="btn-acao" id="btnProxima" onclick="proximaPalavra()" style="display:none; background-color: #d97706;">🔄 Próxima Palavra</button>
        </div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
        <a href="servicos.html" class="nav-item"><span class="icon">📋</span><span>Serviços</span></a>
        <a href="entretenimento.html" class="nav-item active"><span class="icon">🎬</span><span>Lazer</span></a>
        <a href="perfil.html" class="nav-item"><span class="icon">👤</span><span>Perfil</span></a>
    </nav>

    <script>
        const palavras = [
            { palavra: "COMPUTADOR", dica: "Equipamento eletrônico" },
            { palavra: "FUTEBOL", dica: "Esporte popular no Brasil" },
            { palavra: "PROGRAMACAO", dica: "Criação de códigos e sistemas" },
            { palavra: "JAVASCRIPT", dica: "Linguagem de programação web" },
            { palavra: "BICICLETA", dica: "Meio de transporte de duas rodas" },
            { palavra: "TELEFONE", dica: "Aparelho de comunicação" },
            { palavra: "GATO", dica: "Animal de estimação felino" }
        ];

        let palavraAtual = {};
        let letrasDescobertas = [];
        let erros = 0;
        let pontos = 0;
        let jogoEncerrado = false;

        function iniciarJogo() {
            jogoEncerrado = false;
            erros = 0;
            document.getElementById('erros').innerText = erros;
            document.getElementById('btnSalvar').style.display = 'none';
            document.getElementById('btnProxima').style.display = 'none';

            // Sorteia uma palavra aleatória
            palavraAtual = palavras[Math.floor(Math.random() * palavras.length)];
            letrasDescobertas = Array(palavraAtual.palavra.length).fill('_');
            
            document.getElementById('dica').innerText = "Dica: " + palavraAtual.dica;
            atualizarTela();
            criarTeclado();
        }

        function criarTeclado() {
            const tecladoDiv = document.getElementById('teclado');
            tecladoDiv.innerHTML = '';
            const alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            for (let letra of alfabeto) {
                let btn = document.createElement('button');
                btn.innerText = letra;
                btn.className = 'letra-btn';
                btn.id = 'btn-' + letra;
                btn.onclick = () => escolherLetra(letra);
                tecladoDiv.appendChild(btn);
            }
        }

        function escolherLetra(letra) {
            if (jogoEncerrado) return;

            const btn = document.getElementById('btn-' + letra);
            btn.disabled = true;

            if (palavraAtual.palavra.includes(letra)) {
                for (let i = 0; i < palavraAtual.palavra.length; i++) {
                    if (palavraAtual.palavra[i] === letra) {
                        letrasDescobertas[i] = letra;
                    }
                }
                atualizarTela();

                if (!letrasDescobertas.includes('_')) {
                    pontos += 10;
                    document.getElementById('pontos').innerText = pontos;
                    fimDeJogo(true);
                }
            } else {
                erros++;
                document.getElementById('erros').innerText = erros;
                if (erros >= 6) {
                    fimDeJogo(false);
                }
            }
        }

        function atualizarTela() {
            document.getElementById('palavraContainer').innerText = letrasDescobertas.join(' ');
        }

        function fimDeJogo(vitoria) {
            jogoEncerrado = true;
            if (vitoria) {
                document.getElementById('dica').innerText = "🎉 Parabéns! Você acertou a palavra!";
            } else {
                document.getElementById('dica').innerText = `❌ Game Over! A palavra era: ${palavraAtual.palavra}`;
                letrasDescobertas = palavraAtual.palavra.split('');
                atualizarTela();
            }

            // Desativa todos os botões restantes do teclado
            const botoes = document.querySelectorAll('.letra-btn');
            botoes.forEach(b => b.disabled = true);

            document.getElementById('btnSalvar').style.display = 'block';
            document.getElementById('btnProxima').style.display = 'block';
        }

        function proximaPalavra() {
            iniciarJogo();
        }

        function salvarPontos() {
            let nomeJogador = prompt("Digite seu nome para o Ranking da Forca:", "Jogador");
            if (!nomeJogador) return;

            let ranking = JSON.parse(localStorage.getItem('ranking_jogo_da_forca') || "[]");
            ranking.push({ nome: nomeJogador, pontos: pontos });
            
            // Ordena e mantém os melhores
            ranking.sort((a, b) => b.pontos - a.pontos);
            localStorage.setItem('ranking_jogo_da_forca', JSON.stringify(ranking));

            alert("Pontos salvos com sucesso no Ranking!");
            document.getElementById('btnSalvar').style.display = 'none';
        }

        // Inicializa o jogo ao carregar a página
        iniciarJogo();
    </script>
</body>
</html>

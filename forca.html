<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Jogos</title>
    <style>
        :root { --cor-primaria: #2563eb; --cor-fundo: #f0f2f5; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--cor-fundo); margin: 0; padding: 15px; }
        .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-game { background: white; border: 1px solid #ccc; padding: 20px 10px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .btn-game:active { transform: scale(0.95); }
        
        #area-jogo { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; }
        .header-jogo { padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; }
        
        /* Estilos Mini Craque */
        #campo { width: 90%; height: 60vh; background: #065f46; margin: 20px auto; border-radius: 15px; position: relative; overflow: hidden; border: 4px solid #fff; }
        #goleiro { width: 20%; height: 12px; background: #fbbf24; position: absolute; top: 10%; left: 40%; transition: left 0.4s ease; }
        #bola { width: 40px; height: 40px; background: white; border-radius: 50%; position: absolute; bottom: 20px; left: calc(50% - 20px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; }
    </style>
</head>
<body>

    <div id="menu-principal" class="menu">
        <button class="btn-game" onclick="abrir('Velha')">❌<br>Velha</button>
        <button class="btn-game" onclick="abrir('Forca')">🎯<br>Forca</button>
        <button class="btn-game" onclick="abrir('Memória')">🧠<br>Memória</button>
        <button class="btn-game" onclick="abrir('Jokenpô')">✊<br>Jokenpô</button>
        <button class="btn-game" onclick="abrir('Cobrinha')">🐍<br>Cobrinha</button>
        <button class="btn-game" onclick="abrir('Mini Craque')" style="border-color: #059669;">⚽<br>Mini Craque</button>
    </div>

    <div id="area-jogo">
        <div class="header-jogo"><button onclick="fechar()">⬅ Voltar</button><h2 id="titulo-jogo"></h2></div>
        <div id="conteudo-jogo"></div>
    </div>

    <script>
        function abrir(nome) {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('area-jogo').style.display = 'block';
            document.getElementById('titulo-jogo').innerText = nome;
            const content = document.getElementById('conteudo-jogo');
            
            if (nome === 'Mini Craque') {
                content.innerHTML = `<div id="campo"><div id="goleiro"></div><div id="bola" onclick="chutar()"></div></div>`;
                moverGoleiro();
            } else {
                content.innerHTML = `<p style="text-align:center; margin-top:50px;">Carregando ${nome}...</p>`;
            }
        }

        function fechar() {
            document.getElementById('menu-principal').style.display = 'grid';
            document.getElementById('area-jogo').style.display = 'none';
        }

        function moverGoleiro() {
            const g = document.getElementById('goleiro');
            setInterval(() => { g.style.left = (Math.random() * 80) + "%"; }, 800);
        }

        function chutar() {
            const b = document.getElementById('bola');
            b.style.transition = "bottom 0.4s ease-out";
            b.style.bottom = "85%";
            setTimeout(() => { alert("GOL!"); b.style.bottom = "20px"; }, 400);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos - Mini Craque</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header-bar {
            background: #004aad;
            color: white;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1b4d3e;
            padding: 8px 12px;
            color: white;
        }
        .btn {
            background: #f8f9fa;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-voltar { background: #e2e8f0; color: #333; }
        .btn-salvar { background: #28a745; color: white; }
        
        .game-area {
            position: relative;
            width: 100%;
            height: 400px;
            background: #2e8b57;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
        }
        
        /* Elementos do Jogo */
        .goal {
            position: absolute;
            top: 20px;
            width: 80%;
            height: 120px;
            border: 4px solid white;
            border-bottom: none;
        }
        .goalkeeper {
            position: absolute;
            top: 40px;
            width: 40px;
            height: 40px;
            background: #ff4500;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .defender {
            position: absolute;
            width: 35px;
            height: 35px;
            background: #ffcc00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .ball {
            position: absolute;
            bottom: 40px;
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 10;
            font-size: 24px;
            user-select: none;
        }
        .trajectory-line {
            position: absolute;
            stroke: yellow;
            stroke-width: 4;
            stroke-dasharray: 5;
            pointer-events: none;
            z-index: 5;
        }
        .instruction {
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .msg-goal {
            position: absolute;
            top: 45%;
            font-size: 40px;
            font-weight: bold;
            color: yellow;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: none;
            z-index: 20;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <span>🎮 Central de Jogos</span>
        <button class="btn" id="soundToggle" onclick="toggleSound()">🔊 Som: Ligado</button>
    </div>

    <div class="game-controls">
        <button class="btn btn-voltar" onclick="voltarJogo()">Voltar</button>
        <span id="scoreInfo" style="font-size: 13px; font-weight: bold;">Mini Craque | Gols: 0 | Vidas: 3</span>
        <button class="btn btn-salvar" onclick="salvarJogo()">Salvar</button>
    </div>

    <div class="game-area" id="gameArea">
        <div class="goal"></div>
        <div class="goalkeeper" id="goalkeeper">🤖</div>
        
        <!-- Defesas Progressivas -->
        <div class="defender" id="def1" style="display:none; top: 100px;">🛡️1</div>
        <div class="defender" id="def2" style="display:none; top: 170px;">🛡️2</div>
        <div class="defender" id="def3" style="display:none; top: 230px;">🛡️3</div>

        <div class="msg-goal" id="msgGoal">GOOL!</div>
        <div class="instruction" id="instruction">Puxe a bola para trás (estilo arco e flecha) e solte!</div>
        
        <svg style="position:absolute; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:5;">
            <line id="trajectory" x1="0" y1="0" x2="0" y2="0" stroke="yellow" stroke-width="4" stroke-dasharray="5,5" />
        </svg>

        <div class="ball" id="ball">⚽</div>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="https://www.soundjay.com/buttons/sounds/button-10.mp3" type="audio/mpeg">
</audio>
<audio id="goalSound">
    <source src="https://www.soundjay.com/human/sounds/applause-01.mp3" type="audio/mpeg">
</audio>

<script>
    let soundOn = true;
    let gols = 0;
    let vidas = 3;
    let gameRunning = true;
    
    // Configurações de velocidade e posições
    let gkX = 150;
    let gkDir = 1.5;
    let gkSpeedMultiplier = 1;
    
    let defsActive = 0;
    let def1X = 50, def1Dir = 1.2;
    let def2X = 200, def2Dir = -1.5;
    let def3X = 100, def3Dir = 2.0;

    const ball = document.getElementById('ball');
    const goalkeeper = document.getElementById('goalkeeper');
    const def1 = document.getElementById('def1');
    const def2 = document.getElementById('def2');
    const def3 = document.getElementById('def3');
    const gameArea = document.getElementById('gameArea');
    const trajectory = document.getElementById('trajectory');
    const msgGoal = document.getElementById('msgGoal');
    const scoreInfo = document.getElementById('scoreInfo');

    let ballBaseX = gameArea.clientWidth / 2 - 22;
    let ballBaseY = 40; // Distância do fundo
    let ballX = ballBaseX;
    let ballY = ballBaseY;
    let isDragging = false;
    let startX, startY;

    // Posição inicial da bola
    resetBallPosition();

    function resetBallPosition() {
        ballX = gameArea.clientWidth / 2 - 22;
        ballY = ballBaseY;
        ball.style.bottom = ballY + 'px';
        ball.style.left = ballX + 'px';
        trajectory.setAttribute('x1', 0);
        trajectory.setAttribute('y1', 0);
        trajectory.setAttribute('x2', 0);
        trajectory.setAttribute('y2', 0);
    }

    // Eventos de toque e mouse para o arco e flecha
    ball.addEventListener('mousedown', startDrag);
    ball.addEventListener('touchstart', startDrag);

    document.addEventListener('mousemove', drag);
    document.addEventListener('touchmove', drag);

    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);

    function startDrag(e) {
        if (!gameRunning) return;
        isDragging = true;
        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;
        startX = clientX;
        startY = clientY;
    }

    function drag(e) {
        if (!isDragging || !gameRunning) return;
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        
        let dx = clientX - startX;
        let dy = clientY - startY;

        // Limita o puxão para trás (estilo estilingue/arco)
        if (dy > 0) dy = 0; // Só permite puxar para trás (para baixo na tela)
        
        ballX = (gameArea.clientWidth / 2 - 22) + dx;
        ballY = ballBaseY - dy;

        ball.style.left = ballX + 'px';
        ball.style.bottom = ballY + 'px';

        // Desenha a linha de mira oposta ao puxão
        let ballRect = ball.getBoundingClientRect();
        let areaRect = gameArea.getBoundingClientRect();
        let currentX = ballRect.left - areaRect.left + 22;
        let currentY = areaRect.height - (ballRect.top - areaRect.top) - 22;
        
        let aimX = currentX - dx * 1.5;
        let aimY = currentY + dy * 1.5;

        trajectory.setAttribute('x1', currentX);
        trajectory.setAttribute('y1', areaRect.height - currentY);
        trajectory.setAttribute('x2', aimX);
        trajectory.setAttribute('y2', areaRect.height - aimY);
    }

    function endDrag(e) {
        if (!isDragging || !gameRunning) return;
        isDragging = false;
        trajectory.setAttribute('x1', 0);
        trajectory.setAttribute('y1', 0);
        trajectory.setAttribute('x2', 0);
        trajectory.setAttribute('y2', 0);

        // Calcula força baseada no deslocamento
        let ballRect = ball.getBoundingClientRect();
        let targetX = ballX;
        let targetY = gameArea.clientHeight - 50; // Vai em direção ao gol

        animateShot(targetX, targetY);
    }

    function animateShot(targetX, targetY) {
        let currentBottom = parseInt(ball.style.bottom);
        let currentLeft = parseInt(ball.style.left);
        let stepY = 15;
        let stepX = (targetX - currentLeft) / 10;

        let flight = setInterval(() => {
            currentBottom += stepY;
            currentLeft += stepX;
            ball.style.bottom = currentBottom + 'px';
            ball.style.left = currentLeft + 'px';

            // Verifica colisão com Defesas e Goleiro
            let bRect = ball.getBoundingClientRect();
            
            // Checar Defesa 3
            if (defsActive >= 3 && checkCollision(bRect, def3.getBoundingClientRect())) {
                clearInterval(flight);
                handleMiss("Defendido pela Defesa 3!");
                return;
            }
            // Checar Defesa 2
            if (defsActive >= 2 && checkCollision(bRect, def2.getBoundingClientRect())) {
                clearInterval(flight);
                handleMiss("Defendido pela Defesa 2!");
                return;
            }
            // Checar Defesa 1
            if (defsActive >= 1 && checkCollision(bRect, def1.getBoundingClientRect())) {
                clearInterval(flight);
                handleMiss("Defendido pela Defesa 1!");
                return;
            }
            // Checar Goleiro
            if (checkCollision(bRect, goalkeeper.getBoundingClientRect())) {
                clearInterval(flight);
                handleMiss("O Goleiro defendeu!");
                return;
            }

            // Checar Gol
            if (currentBottom >= gameArea.clientHeight - 80) {
                clearInterval(flight);
                handleGoal();
                return;
            }
        }, 20);
    }

    function checkCollision(r1, r2) {
        return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
    }

    function handleGoal() {
        gols++;
        updateScore();
        if (soundOn) document.getElementById('goalSound').play();
        msgGoal.style.display = 'block';
        
        // Progressão de dificuldade e barreiras
        if (gols >= 2) { defsActive = 1; def1.style.display = 'flex'; }
        if (gols >= 4) { defsActive = 2; def2.style.display = 'flex'; }
        if (gols >= 6) { defsActive = 3; def3.style.display = 'flex'; }
        
        gkSpeedMultiplier += 0.2; // Aumenta a velocidade geral

        setTimeout(() => {
            msgGoal.style.display = 'none';
            resetBallPosition();
        }, 1000);
    }

    function handleMiss(reason) {
        vidas--;
        updateScore();
        if (vidas <= 0) {
            alert("Fim de jogo! Suas vidas acabaram.");
            gols = 0;
            vidas = 3;
            defsActive = 0;
            def1.style.display = 'none';
            def2.style.display = 'none';
            def3.style.display = 'none';
            gkSpeedMultiplier = 1;
        }
        resetBallPosition();
    }

    function updateScore() {
        scoreInfo.innerText = `Mini Craque | Gols: ${gols} | Vidas: ${vidas}`;
    }

    // Loop de animação do goleiro e das defesas
    function gameLoop() {
        let maxW = gameArea.clientWidth - 40;
        
        // Movimento do Goleiro
        gkX += gkDir * (1.5 * gkSpeedMultiplier);
        if (gkX <= 10 || gkX >= maxW - 10) gkDir *= -1;
        goalkeeper.style.left = gkX + 'px';

        // Movimento Defesa 1
        if (defsActive >= 1) {
            def1X += def1Dir * (1.2 * gkSpeedMultiplier);
            if (def1X <= 10 || def1X >= maxW - 10) def1Dir *= -1;
            def1.style.left = def1X + 'px';
        }
        // Movimento Defesa 2
        if (defsActive >= 2) {
            def2X += def2Dir * (1.4 * gkSpeedMultiplier);
            if (def2X <= 10 || def2X >= maxW - 10) def2Dir *= -1;
            def2.style.left = def2X + 'px';
        }
        // Movimento Defesa 3
        if (defsActive >= 3) {
            def3X += def3Dir * (1.6 * gkSpeedMultiplier);
            if (def3X <= 10 || def3X >= maxW - 10) def3Dir *= -1;
            def3.style.left = def3X + 'px';
        }

        requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    function toggleSound() {
        soundOn = !soundOn;
        const bgMusic = document.getElementById('bgMusic');
        if (soundOn) {
            document.getElementById('soundToggle').innerText = "🔊 Som: Ligado";
            bgMusic.play().catch(e => {});
        } else {
            document.getElementById('soundToggle').innerText = "🔇 Som: Desligado";
            bgMusic.pause();
        }
    }

    function voltarJogo() {
        alert("Voltando para o menu anterior...");
    }

    function salvarJogo() {
        alert("Progresso salvo com sucesso!");
    }
</script>

</body>
</html>

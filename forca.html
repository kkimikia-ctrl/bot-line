<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda JP - Início</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
            padding-bottom: 80px;
        }
        .header-app {
            background-color: #0047ab;
            color: white;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .header-app img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            padding: 2px;
        }
        .header-app h1 {
            font-size: 16px;
            margin: 0;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .card h2 {
            font-size: 15px;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #111;
        }
        .input-text {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 10px;
            resize: none;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .menu-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            border: 1px solid #eaeaea;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .menu-card:active {
            transform: scale(0.97);
        }
        .menu-card .icon {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .menu-card .title {
            font-weight: bold;
            color: #0047ab;
            font-size: 13px;
            margin-bottom: 2px;
        }
        .menu-card .subtitle {
            font-size: 11px;
            color: #666;
        }

        /* Barra de Navegação Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 55px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 0.75rem;
            flex-grow: 1;
            cursor: pointer;
        }
        .nav-item.active { color: #0047ab; font-weight: bold; }
        .nav-item span.icon-nav { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- CABEÇALHO DO APLICATIVO -->
    <div class="header-app">
        <img src="https://via.placeholder.com/32" alt="Logo">
        <h1>Ajuda JP - Início</h1>
    </div>

    <!-- CARD DE TRADUÇÃO -->
    <div class="card">
        <h2>📷 Tradução de Texto e Fotos</h2>
        <p style="font-size: 12px; color: #555; margin-bottom: 10px;">Digite o texto em japonês ou português para traduzir na hora:</p>
        <textarea class="input-text" rows="3" placeholder="Digite aqui..."></textarea>
        <button class="btn-primary" onclick="alert('Traduzindo...')">Traduzir Agora</button>
    </div>

    <!-- MENU DE NAVEGAÇÃO EM GRADE (4 OPÇÕES) -->
    <div class="grid-menu">
        <a href="tradutor.html" class="menu-card">
            <div class="icon">📞</div>
            <div class="title">Tradutor</div>
            <div class="subtitle">Prefeitura / Hospital</div>
        </a>
        <a href="carteira.html" class="menu-card">
            <div class="icon">💰</div>
            <div class="title">Carteira</div>
            <div class="subtitle">Saldo e Ganhos</div>
        </a>
        <a href="lazer.html" class="menu-card">
            <div class="icon">🎮</div>
            <div class="title">Entretenimento</div>
            <div class="subtitle">Lives, Aulas e Notícias</div>
        </a>
        <a href="servicos.html" class="menu-card">
            <div class="icon">📋</div>
            <div class="title">Serviços</div>
            <div class="subtitle">Lojas, Ar-condicionado, Mecânico</div>
        </a>
    </div>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="icon-nav">🏠</span>
            <span>Home</span>
        </a>
        <a href="servicos.html" class="nav-item">
            <span class="icon-nav">📋</span>
            <span>Serviços</span>
        </a>
        <a href="lazer.html" class="nav-item">
            <span class="icon-nav">🎬</span>
            <span>Lazer</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <span class="icon-nav">👤</span>
            <span>Perfil</span>
        </a>
    </nav>

</body>
</html>

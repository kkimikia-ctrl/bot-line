<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Arcade Central - Corrigido</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; text-align: center; }
        .game-container { background: white; padding: 20px; border-radius: 15px; margin: 10px auto; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-salvar { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .timer { font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>

    <div id="app" class="game-container">
        <h1>🎮 Arcade Central</h1>
        <div id="game-zone">
            <!-- Os jogos serão carregados aqui -->
        </div>
        <div id="ranking-zone"></div>
    </div>

    <script>
        // --- MOTOR DE ÁUDIO REVISADO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function tocarSom(frequencia, tipo = 'sine', duracao = 0.2) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = tipo;
            osc.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duracao);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duracao);
        }

        // --- SISTEMA DE PONTUAÇÃO E RANKING ---
        function salvarPontuacao(nomeJogo, pontos) {
            let nome = prompt("Nome para o ranking:");
            if (!nome) return;
            let ranking = JSON.parse(localStorage.getItem('ranking') || "[]");
            ranking.push({ nome: nome, jogo: nomeJogo, pontos: pontos });
            ranking.sort((a, b) => b.pontos - a.pontos);
            localStorage.setItem('ranking', JSON.stringify(ranking.slice(0, 30))); // Máximo 30
            alert("Pontos salvos!");
        }

        // --- LÓGICA JOKENPÔ (CORREÇÃO DA REGRA) ---
        function jogarJokenpo(escolha) {
            let cpu = ['pedra', 'papel', 'tesoura'][Math.floor(Math.random() * 3)];
            let pts = 0;
            
            // Vitória
            if((escolha === 'pedra' && cpu === 'tesoura') || (escolha === 'papel' && cpu === 'pedra') || (escolha === 'tesoura' && cpu === 'papel')) {
                pts = 100;
                tocarSom(500, 'sine');
            } else {
                // Perda: perde pontos mas NÃO volta para o começo, apenas segue (conforme pedido)
                pts = -20;
                tocarSom(100, 'sawtooth');
            }
            alert("Resultado: " + cpu + ". Pontos: " + pts);
            // Lógica de prosseguir fase aqui...
        }

        // --- RANKING COM TROFÉUS E CORES ---
        function exibirRanking() {
            let r = JSON.parse(localStorage.getItem('ranking') || "[]");
            let html = "<h3>🏆 Ranking Global</h3>";
            r.forEach((item, i) => {
                let cor = i < 10 ? "#e74c3c" : (i < 20 ? "#3498db" : "#2ecc71");
                let trofeu = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : i + 1 + "º"));
                html += `<div style="color:${cor}">${trofeu} ${item.nome} - ${item.pontos}</div>`;
            });
            document.getElementById('ranking-zone').innerHTML = html;
        }

        // Inicializa
        exibirRanking();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Jogos - Desafio Global</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
            text-align: center;
        }
        .container-menu {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: 20px auto;
        }
        .btn-largo {
            display: block;
            width: 100%;
            background: #1e40af;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-decoration: none;
            text-align: center;
        }
        .grid-jogos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-jogo {
            padding: 15px 10px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn-jogo.completo {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="container-menu">
        <!-- Cabeçalho com o botão voltar alinhado à esquerda dentro da barra de título -->
        <div style="background: #1e3a8a; color: white; padding: 10px 12px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;">
            <a href="entretenimento.html" style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; text-decoration: none; cursor: pointer;">⬅ Voltar</a>
            <span style="font-size: 15px; font-weight: bold; flex-grow: 1; text-align: center;">🎮 Central de Jogos</span>
            <div style="width: 50px;"></div> <!-- Espassador invisível para centralizar o título perfeitamente -->
        </div>

        <!-- Botão Retangular de Ranking -->
        <a href="ranking.html" class="btn-largo">🏆 Ver Ranking Global</a>

        <!-- Lista de Jogos -->
        <div class="grid-jogos">
            <a href="mini-craque.html" class="btn-jogo" style="background: #15803d;">⚽ Mini Craque</a>
            <a href="jogo-da-velha.html" class="btn-jogo" style="background: #2563eb;">❌ Jogo da Velha</a>
            <a href="forca.html" class="btn-jogo" style="background: #0d9488;">🎯 Jogo da Forca</a>
            <a href="memoria.html" class="btn-jogo" style="background: #7e22ce;">🧠 Jogo da Memória</a>
            <a href="jokenpo.html" class="btn-jogo completo" style="background: #c2410c;">🇧🇷 Jokenpô Brasil</a>
            <a href="cobrinha.html" class="btn-jogo completo" style="background: #047857;">🐍 Jogo da Cobrinha</a>
        </div>
    </div>

</body>
</html>

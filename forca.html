<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card-game {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Menu Principal de Seleção de Jogos -->
    <div id="menu-selecao-jogos" class="card-game">
        <h2>🎮 Central de Lazer</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Escolha um jogo para começar:</p>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <button onclick="abrirJogoForca()" style="padding: 10px; background: #2196F3; color: white; border: none; border-radius: 6px; font-weight: bold;">forca</button>
            <button onclick="abrirJogoMemoria()" style="padding: 10px; background: #7b1fa2; color: white; border: none; border-radius: 6px; font-weight: bold;">🧠 Jogo da Memória</button>
        </div>
    </div>

    <!-- Jogo da Forca -->
    <div id="container-jogo-forca" class="card-game" style="display: none;">
        <button onclick="voltarMenuJogos()" style="background: #ccc; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; float: left;">⬅ Voltar</button>
        <div style="clear: both;"></div>
        <h3 style="color: #2196F3; margin-top: 0;">🎯 Jogo da Forca</h3>
        <p id="palavra-forca" style="font-size: 24px; letter-spacing: 5px; font-weight: bold; margin: 20px 0;">_ _ _ _ _</p>
        <p>Erros: <span id="erros-forca">0</span> / 6</p>
        <div id="teclado-forca" style="display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;"></div>
    </div>

    <!-- Jogo da Memória -->
    <div id="container-jogo-memoria" class="card-game" style="display: none;">
        <button onclick="voltarMenuJogos()" style="background: #ccc; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: left;">⬅ Voltar</button>
        <div style="clear: both;"></div>
        
        <div style="background: #7b1fa2; color: white; padding: 8px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <h3 id="texto-nivel-memoria" style="margin: 0; font-size: 13px;">🧠 Nível 1</h3>
            <span>⏱️ <span id="tempo-memoria">0</span>s</span>
            <span>⭐ <span id="pontos-memoria">0</span></span>
        </div>

        <div id="tabuleiro-memoria" style="display: grid; gap: 6px; justify-content: center; margin-bottom: 15px;"></div>

        <!-- Área de Ranking da Memória -->
        <div style="margin-top: 15px; border-top: 2px solid #eee; padding-top: 10px;">
            <h4 style="color: #7b1fa2; margin: 0 0 8px 0; font-size: 13px;">🏆 Top 5 - Ranking da Memória</h4>
            <div id="ranking-memoria-lista" style="font-size: 12px; color: #555; background: #faf5ff; padding: 8px; border-radius: 6px;">
                <!-- Preenchido via Script -->
            </div>
        </div>
    </div>

    <script>
        function voltarMenuJogos() {
            if (intervaloTempoMemoria) clearInterval(intervaloTempoMemoria);
            document.getElementById('container-jogo-forca').style.display = 'none';
            document.getElementById('container-jogo-memoria').style.display = 'none';
            document.getElementById('menu-selecao-jogos').style.display = 'block';
        }

        /* --- Jogo da Forca --- */
        const palavrasForca = ["PROGRAMACAO", "JAVASCRIPT", "COMPUTADOR", "INTERNET", "DESENVOLVEDOR"];
        let palavraSecreta = "";
        let letrasDescobertas = [];
        let errosForca = 0;

        function abrirJogoForca() {
            document.getElementById('menu-selecao-jogos').style.display = 'none';
            document.getElementById('container-jogo-forca').style.display = 'block';
            iniciarForca();
        }

        function iniciarForca() {
            palavraSecreta = palavrasForca[Math.floor(Math.random() * palavrasForca.length)];
            letrasDescobertas = Array(palavraSecreta.length).fill("_");
            errosForca = 0;
            document.getElementById('erros-forca').innerText = errosForca;
            atualizarTelaForca();
            criarTecladoForca();
        }

        function atualizarTelaForca() {
            document.getElementById('palavra-forca').innerText = letrasDescobertas.join(" ");
        }

        function criarTecladoForca() {
            let tecladoDiv = document.getElementById('teclado-forca');
            tecladoDiv.innerHTML = "";
            let alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            
            for (let letra of alfabeto) {
                let btn = document.createElement('button');
                btn.innerText = letra;
                btn.style.cssText = "width: 30px; height: 30px; font-size: 12px; font-weight: bold; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;";
                btn.onclick = () => tentarLetraForca(letra, btn);
                tecladoDiv.appendChild(btn);
            }
        }

        function tentarLetraForca(letra, btn) {
            btn.disabled = true;
            btn.style.background = "#ccc";

            if (palavraSecreta.includes(letra)) {
                for (let i = 0; i < palavraSecreta.length; i++) {
                    if (palavraSecreta[i] === letra) {
                        letrasDescobertas[i] = letra;
                    }
                }
                atualizarTelaForca();
                if (!letrasDescobertas.includes("_")) {
                    setTimeout(() => { alert("🎉 Parabéns, você venceu!"); iniciarForca(); }, 200);
                }
            } else {
                errosForca++;
                document.getElementById('erros-forca').innerText = errosForca;
                if (errosForca >= 6) {
                    setTimeout(() => { alert(`❌ Game Over! A palavra era: ${palavraSecreta}`); iniciarForca(); }, 200);
                }
            }
        }

        /* --- Jogo da Memória com Pontuação, Ranking e Tempo --- */
        let nivelMemoria = 1;
        let cartasMemoria = [];
        let primeiraCarta = null, segundaCarta = null, travadoMemoria = false, paresRestantes = 0;
        let pontosMemoria = 0, errosMemoria = 0;
        let tempoMemoria = 0, intervaloTempoMemoria = null;
        const adversariosMemoria = ["🐰 Coelho", "🦊 Raposa", "🐼 Panda", "🦁 Leão", "🐯 Tigre", "🦅 Águia", "🦈 Tubarão", "🐉 Dragão", "🤖 Robô Mestre", "👑 Rei Supremo"];
        const emojisPool = ['🍎','🍌','🍇','🍉','🍓','🍒','🍍','🥝','🥑','🥥','🍋','🍊','🍐','🍑','🥕','🌽'];

        function abrirJogoMemoria() { 
            document.getElementById('menu-selecao-jogos').style.display = 'none'; 
            document.getElementById('container-jogo-memoria').style.display = 'block'; 
            nivelMemoria = 1;
            pontosMemoria = 0;
            tempoMemoria = 0;
            iniciarCronometroMemoria();
            iniciarMemoria();
            atualizarRankingMemoria();
        }

        function iniciarCronometroMemoria() {
            if (intervaloTempoMemoria) clearInterval(intervaloTempoMemoria);
            tempoMemoria = 0;
            document.getElementById('tempo-memoria').innerText = tempoMemoria;
            intervaloTempoMemoria = setInterval(() => {
                tempoMemoria++;
                document.getElementById('tempo-memoria').innerText = tempoMemoria;
            }, 1000);
        }

        function iniciarMemoria() {
            document.getElementById('texto-nivel-memoria').innerText = `🧠 Nível ${nivelMemoria} | ${adversariosMemoria[nivelMemoria - 1]}`;
            document.getElementById('pontos-memoria').innerText = pontosMemoria;
            
            let qtdPares = 1 + nivelMemoria; 
            let emojisSelecionados = emojisPool.slice(0, qtdPares);
            cartasMemoria = [...emojisSelecionados, ...emojisSelecionados];
            cartasMemoria.sort(() => Math.random() - 0.5);

            paresRestantes = qtdPares;
            primeiraCarta = null; segundaCarta = null; travadoMemoria = false; errosMemoria = 0;

            let cont = document.getElementById('tabuleiro-memoria');
            let colunas = nivelMemoria <= 3 ? 4 : (nivelMemoria <= 6 ? 5 : 6);
            cont.style.gridTemplateColumns = `repeat(${colunas}, 42px)`;
            cont.innerHTML = "";

            cartasMemoria.forEach(emoji => {
                let btn = document.createElement('button');
                btn.style.cssText = "width: 40px; height: 40px; font-size: 15px; background: #7b1fa2; color: white; border: none; border-radius: 6px; cursor: pointer;";
                btn.dataset.emoji = emoji;
                btn.onclick = () => virarCartaMemoria(btn);
                cont.appendChild(btn);
            });
        }

        function virarCartaMemoria(btn) {
            if (travadoMemoria || btn.innerText !== "" || btn === primeiraCarta) return;
            btn.innerText = btn.dataset.emoji;
            btn.style.background = "white";

            if (!primeiraCarta) { primeiraCarta = btn; return; }
            segundaCarta = btn; travadoMemoria = true;

            if (primeiraCarta.dataset.emoji === segundaCarta.dataset.emoji) {
                paresRestantes--;
                pontosMemoria += 20 * nivelMemoria; 
                document.getElementById('pontos-memoria').innerText = pontosMemoria;

                primeiraCarta = null; segundaCarta = null; travadoMemoria = false;
                
                if (paresRestantes === 0) {
                    setTimeout(() => {
                        if (nivelMemoria >= 10) {
                            clearInterval(intervaloTempoMemoria);
                            let bonusTempo = Math.max(0, 500 - (tempoMemoria * 2));
                            pontosMemoria += bonusTempo;
                            
                            salvarPontuacaoRankingMemoria();
                            alert(`🏆 Jogo Concluído!\nTempo: ${tempoMemoria}s\nBônus de Velocidade: +${bonusTempo} pts\nPontuação Final: ${pontosMemoria} pts`);
                            
                            nivelMemoria = 1;
                            pontosMemoria = 0;
                            iniciarCronometroMemoria();
                        } else {
                            nivelMemoria++;
                            alert(`🎉 Derrotou ${adversariosMemoria[nivelMemoria-2]}! Subindo para o Nível ${nivelMemoria}!`);
                        }
                        iniciarMemoria();
                    }, 300);
                }
            } else {
                errosMemoria++;
                pontosMemoria = Math.max(0, pontosMemoria - 5); 
                document.getElementById('pontos-memoria').innerText = pontosMemoria;

                setTimeout(() => {
                    primeiraCarta.innerText = ""; primeiraCarta.style.background = "#7b1fa2";
                    segundaCarta.innerText = ""; segundaCarta.style.background = "#7b1fa2";
                    primeiraCarta = null; segundaCarta = null; travadoMemoria = false;
                }, 700);
            }
        }

        function salvarPontuacaoRankingMemoria() {
            let nome = prompt("🏆 Parabéns! Digite seu nome para salvar no Ranking:") || "Jogador";
            let ranking = JSON.parse(localStorage.getItem('rankingMemoria') || "[]");
            
            ranking.push({ nome: nome, pontos: pontosMemoria, tempo: tempoMemoria });
            ranking.sort((a, b) => b.pontos - a.pontos); 
            ranking = ranking.slice(0, 5); 

            localStorage.setItem('rankingMemoria', JSON.stringify(ranking));
            atualizarRankingMemoria();
        }

        function atualizarRankingMemoria() {
            let ranking = JSON.parse(localStorage.getItem('rankingMemoria') || "[]");
            let listaDiv = document.getElementById('ranking-memoria-lista');
            
            if (ranking.length === 0) {
                listaDiv.innerHTML = "Nenhuma pontuação salva ainda. Jogue para entrar no ranking!";
                return;
            }

            let html = "";
            ranking.forEach((item, index) => {
                let medalha = index === 0 ? "🥇" : (index === 1 ? "🥈" : (index === 2 ? "🥉" : `${index + 1}º`));
                html += `<div style="display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #eee;">
                    <span>${medalha} <strong>${item.nome}</strong></span>
                    <span>⭐ ${item.pontos} pts (${item.tempo}s)</span>
                </div>`;
            });
            listaDiv.innerHTML = html;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Jogos - Desafio Global</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
            text-align: center;
        }

        .container-menu {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: 15px auto;
            box-sizing: border-box;
        }
        .btn-largo {
            display: block;
            width: 100%;
            background: #1e40af;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-decoration: none;
            text-align: center;
        }
        .grid-jogos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-jogo {
            padding: 15px 10px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn-jogo.completo {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="container-menu">
        <a href="ranking.html" class="btn-largo">🏆 Ver Ranking Global</a>

        <div class="grid-jogos">
            <a href="jogo-minicraque.html" class="btn-jogo" style="background: #15803d;">⚽ Mini Craque</a>
            <a href="jogo-velha.html" class="btn-jogo" style="background: #2563eb;">❌ Jogo da Velha</a>
            <a href="jogo-forca.html" class="btn-jogo" style="background: #0d9488;">🎯 Jogo da Forca</a>
            <a href="jogo-memoria.html" class="btn-jogo" style="background: #7e22ce;">🧠 Jogo da Memória</a>
            <a href="jokenpo.html" class="btn-jogo completo" style="background: #c2410c;">🇧🇷 Jokenpô Brasil</a>
            <a href="jogo-cobrinha.html" class="btn-jogo completo" style="background: #047857;">🐍 Jogo da Cobrinha</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
          authDomain: "ajuda-jp.firebaseapp.com",
          projectId: "ajuda-jp",
          storageBucket: "ajuda-jp.firebasestorage.app",
          messagingSenderId: "40121072206",
          appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.registrarCliqueBanner = async function(bannerId, urlDestino) {
            try {
                const bannerRef = doc(db, 'banners', bannerId);
                await updateDoc(bannerRef, {
                    cliques: increment(1)
                });
            } catch (error) {
                console.log("Erro ao contabilizar clique: ", error);
            } finally {
                window.location.href = urlDestino;
            }
        };
    </script>

    <script src="bannersjogo.js"></script>
    <script>
        // Injeta automaticamente o carrossel unificado, cabeçalho e título para esta página
        window.addEventListener('DOMContentLoaded', () => {
            carregarSistemaDeBanners("🎮 Central de Jogos", "entretenimento.html");
        });
    </script>
</body>
</html>

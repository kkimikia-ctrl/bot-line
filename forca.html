<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Jogos - Desafio Global</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            text-align: center;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            background-color: #0047ab;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .header h1 { font-size: 18px; margin: 0; }
        .card-game {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .menu-jogos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .action-btn {
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Central de Jogos</h1>
        </div>
        <div class="card-game">
            <div class="menu-jogos">
                <button onclick="abrirJogo('minicraque.html')" class="action-btn" style="background-color: #2e7d32;">⚽ Mini Craque</button>
                <button onclick="abrirJogo('jogo-velha.html')" class="action-btn" style="background-color: #2563eb;">❌ Jogo da Velha</button>
                <button onclick="abrirJogo('jogo-forca.html')" class="action-btn" style="background-color: #00796b;">🎯 Jogo da Forca</button>
                <button onclick="abrirJogo('jogo-memoria.html')" class="action-btn" style="background-color: #7b1fa2;">🧠 Jogo da Memória</button>
                <button onclick="abrirJogo('jokenpo.html')" class="action-btn" style="background-color: #e65100;">🇧🇷 Jokenpô Brasil</button>
                <button onclick="abrirJogo('jogo-cobrinha.html')" class="action-btn" style="background-color: #059669; grid-column: span 2;">🐍 Jogo da Cobrinha</button>
            </div>
        </div>
    </div>
    <script>
        function abrirJogo(arquivo) {
            window.location.href = `./${arquivo}`;
        }
    </script>
</body>
</html>

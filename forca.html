    <script>
        /* SISTEMA DE ÁUDIO AVANÇADO */
        let audioCtx = null;
        let musicaFundoLoop = null;

        function iniciarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Toca efeitos sonoros curtos (acerto/erro/vitória)
        function tocarSom(tipo) {
            iniciarAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (tipo === 'acerto') {
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (tipo === 'erro') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (tipo === 'vitoria') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            }
        }

        // Toca música instrumental de fundo suave
        function tocarMusicaFundo() {
            if (musicaFundoLoop) return; // Já está tocando
            iniciarAudio();
            
            function tocarNota(freq, tempo, duracao) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + tempo);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime + tempo);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + tempo + duracao);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + tempo);
                osc.stop(audioCtx.currentTime + tempo + duracao);
            }

            // Loop de melodia simples e emocional
            musicaFundoLoop = setInterval(() => {
                tocarNota(261.63, 0, 1); // Dó
                tocarNota(329.63, 0.5, 1); // Mi
                tocarNota(392.00, 1, 1); // Sol
                tocarNota(329.63, 1.5, 1); // Mi
            }, 2000);
        }

        function pararMusicaFundo() {
            clearInterval(musicaFundoLoop);
            musicaFundoLoop = null;
        }

        /* [RESTANTE DO SEU SCRIPT...] */
        /* Dica: Chame 'tocarMusicaFundo()' dentro das funções abrirJogoVelha(), abrirJogoForca(), etc */
        /* E chame 'pararMusicaFundo()' dentro da função voltarMenuJogos() */
        
        function abrirJogoVelha() { 
            iniciarAudio(); tocarMusicaFundo();
            document.getElementById('menu-selecao-jogos').style.display = 'none'; 
            document.getElementById('container-jogo-velha').style.display = 'block'; 
            // ... resto da função
        }

        function voltarMenuJogos() {
            pararMusicaFundo(); // Para a música ao sair do jogo
            // ... resto da função
        }
        
        // [Cole o restante das funções dos jogos aqui...]
    </script>

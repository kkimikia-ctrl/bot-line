<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Central - Definitivo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 1.5rem; margin-top: 5px; }
        .menu-jogos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .btn-jogo { background: #3498db; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-jogo:hover { background: #2980b9; }
        .btn-voltar { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .btn-acao { background: #2ecc71; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; }
        .btn-salvar-pts { background: #9b59b6; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%; }
        .painel-jogo { border: 2px dashed #ddd; padding: 15px; border-radius: 8px; margin-top: 10px; background: #fafafa; }
        .timer { font-size: 1.1rem; font-weight: bold; color: #e67e22; margin-bottom: 10px; }
        
        /* Jogo da Velha */
        .board-velha { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; justify-content: center; margin: 10px auto; }
        .cell-velha { width: 60px; height: 60px; background: #fff; border: 2px solid #34495e; font-size: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        
        /* Cobrinha */
        canvas { background: #222; display: block; margin: 10px auto; border-radius: 4px; }

        /* Ranking */
        .ranking-box { text-align: left; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
        .ranking-item { padding: 6px 10px; margin: 4px 0; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Arcade Central</h1>
        
        <!-- Menu Principal -->
        <div id="menu-principal">
            <div class="menu-jogos">
                <button class="btn-jogo" onclick="iniciarJogo('velha')">❌ Jogo da Velha</button>
                <button class="btn-jogo" onclick="iniciarJogo('jokenpo')">✊ Jokenpô</button>
                <button class="btn-jogo" onclick="iniciarJogo('memoria')">🧠 Jogo da Memória</button>
                <button class="btn-jogo" onclick="iniciarJogo('forca')">🔤 Jogo da Forca</button>
                <button class="btn-jogo" onclick="iniciarJogo('cobrinha')">🐍 Jogo da Cobrinha</button>
            </div>
            <div id="ranking-zone" class="ranking-box"></div>
        </div>

        <!-- Área Dinâmica dos Jogos -->
        <div id="area-jogo" style="display: none;">
            <button class="btn-voltar" onclick="voltarMenu()">⬅ Voltar ao Menu</button>
            <div id="conteudo-jogo" class="painel-jogo"></div>
        </div>
    </div>

    <script>
        // --- MOTOR DE ÁUDIO COM SONS DIFERENTES PARA CADA AÇÃO ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function tocarSomEspecifico(tipoSom) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                let freq = 440, dur = 0.1, wave = 'sine';

                if (tipoSom === 'clique') { freq = 300; wave = 'sine'; dur = 0.05; }
                else if (tipoSom === 'vitoria') { freq = 587.33; wave = 'triangle'; dur = 0.3; }
                else if (tipoSom === 'derrota') { freq = 150; wave = 'sawtooth'; dur = 0.3; }
                else if (tipoSom === 'ponto') { freq = 800; wave = 'square'; dur = 0.15; }
                else if (tipoSom === 'comer') { freq = 650; wave = 'sine'; dur = 0.08; }
                else if (tipoSom === 'gameover') { freq = 110; wave = 'sawtooth'; dur = 0.5; }

                osc.type = wave;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch(e) { console.log(e); }
        }

        // --- CRONÔMETRO ---
        let tempoSegundos = 0;
        let intervaloTimer = null;

        function iniciarTimer() {
            tempoSegundos = 0;
            clearInterval(intervaloTimer);
            intervaloTimer = setInterval(() => {
                tempoSegundos++;
                let el = document.getElementById('contador-tempo');
                if (el) el.innerText = tempoSegundos;
            }, 1000);
        }

        function pararTimer() {
            clearInterval(intervaloTimer);
            return tempoSegundos;
        }

        // --- SISTEMA DE PONTUAÇÃO E RANKING (5 jogos, máx 30, cores por bloco, troféus) ---
        function salvarPontuacao(nomeJogo, pontos) {
            let nome = prompt("Digite seu nome para o ranking global:");
            if (!nome) return;
            let ranking = JSON.parse(localStorage.getItem('arcade_ranking_v2') || "[]");
            ranking.push({ nome: nome, jogo: nomeJogo, pontos: pontos });
            ranking.sort((a, b) => b.pontos - a.pontos);
            localStorage.setItem('arcade_ranking_v2', JSON.stringify(ranking.slice(0, 30)));
            tocarSomEspecifico('vitoria');
            alert("Pontuação salva com sucesso!");
            exibirRanking();
            voltarMenu();
        }

        function exibirRanking() {
            let r = JSON.parse(localStorage.getItem('arcade_ranking_v2') || "[]");
            let html = "<h3>🏆 Ranking Global (Top 30)</h3>";
            if (r.length === 0) {
                html += "<p style='font-size:0.85rem; color:#666;'>Nenhuma pontuação registrada ainda.</p>";
            } else {
                r.forEach((item, i) => {
                    // Cores diferentes por blocos de 10 posições
                    let cor = i < 10 ? "#c0392b" : (i < 20 ? "#2980b9" : "#27ae60");
                    let trofeu = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : (i + 1) + "º"));
                    html += `<div class="ranking-item" style="background: ${cor}15; border-left: 4px solid ${cor}; color: #333;">
                        ${trofeu} <strong>${item.nome}</strong> (${item.jogo}) - <span>${item.pontos} pts</span>
                    </div>`;
                });
            }
            document.getElementById('ranking-zone').innerHTML = html;
        }

        // --- NAVEGAÇÃO DE TELAS ---
        function voltarMenu() {
            pararTimer();
            pararCobrinhaLoop();
            document.getElementById('area-jogo').style.display = 'none';
            document.getElementById('menu-principal').style.display = 'block';
            exibirRanking();
        }

        function iniciarJogo(tipo) {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('area-jogo').style.display = 'block';
            iniciarTimer();

            let container = document.getElementById('conteudo-jogo');
            
            if (tipo === 'velha') {
                container.innerHTML = `
                    <div class="timer">Tempo: <span id="contador-tempo">0</span>s</div>
                    <h3>❌ Jogo da Velha</h3>
                    <div class="board-velha" id="velha-board"></div>
                    <button class="btn-acao" onclick="resetVelha()">Reiniciar Partida</button>
                `;
                setupVelha();
            } else if (tipo === 'jokenpo') {
                container.innerHTML = `
                    <div class="timer">Tempo: <span id="contador-tempo">0</span>s</div>
                    <h3>✊ Jokenpô</h3>
                    <p id="status-jokenpo">Escolha sua jogada:</p>
                    <button class="btn-acao" onclick="jogarJokenpo('pedra')">✊ Pedra</button>
                    <button class="btn-acao" onclick="jogarJokenpo('papel')">✋ Papel</button>
                    <button class="btn-acao" onclick="jogarJokenpo('tesoura')">✌ Tesoura</button>
                    <div id="painel-salvar-jokenpo" style="display:none; margin-top:15px;"></div>
                `;
            } else if (tipo === 'memoria') {
                container.innerHTML = `
                    <div class="timer">Tempo: <span id="contador-tempo">0</span>s</div>
                    <h3>🧠 Jogo da Memória</h3>
                    <p>Encontre os pares rapidamente!</p>
                    <button class="btn-acao" onclick="tocarSomEspecifico('ponto')">Concluir Pares</button>
                    <button class="btn-salvar-pts" onclick="salvarPontuacao('Memória', Math.max(10, 500 - (tempoSegundos * 10)))">Salvar Pontuação</button>
                `;
            } else if (tipo === 'forca') {
                container.innerHTML = `
                    <div class="timer">Tempo: <span id="contador-tempo">0</span>s</div>
                    <h3>🔤 Jogo da Forca</h3>
                    <p>Palavra Secreta: J A S O N</p>
                    <button class="btn-acao" onclick="tocarSomEspecifico('ponto')">Acertou Letra</button>
                    <button class="btn-salvar-pts" onclick="salvarPontuacao('Forca', Math.max(10, 400 - (tempoSegundos * 8)))">Salvar Pontuação da Forca</button>
                `;
            } else if (tipo === 'cobrinha') {
                container.innerHTML = `
                    <div class="timer">Tempo: <span id="contador-tempo">0</span>s | Pontos: <span id="snake-score">0</span></div>
                    <h3>🐍 Jogo da Cobrinha</h3>
                    <canvas id="snakeCanvas" width="280" height="280"></canvas>
                    <div>
                        <button class="btn-acao" onclick="mudarDirecao('UP')">⬆️</button><br>
                        <button class="btn-acao" onclick="mudarDirecao('LEFT')">⬅️</button>
                        <button class="btn-acao" onclick="mudarDirecao('DOWN')">⬇️</button>
                        <button class="btn-acao" onclick="mudarDirecao('RIGHT')">➡️</button>
                    </div>
                    <div id="painel-salvar-snake" style="display:none; margin-top:10px;"></div>
                `;
                iniciarCobrinha();
            }
        }

        // --- LÓGICA: JOGO DA VELHA ---
        let velhaBoard = ['', '', '', '', '', '', '', '', ''];
        let velhaTurno = 'X';
        let velhaAtivo = true;

        function setupVelha() {
            velhaBoard = ['', '', '', '', '', '', '', '', ''];
            velhaTurno = 'X';
            velhaAtivo = true;
            let boardEl = document.getElementById('velha-board');
            if(!boardEl) return;
            boardEl.innerHTML = '';
            velhaBoard.forEach((val, idx) => {
                let cell = document.createElement('div');
                cell.className = 'cell-velha';
                cell.innerText = val;
                cell.onclick = () =>jogarVelha(idx);
                boardEl.appendChild(cell);
            });
        }

        function resetVelha() { setupVelha(); }

        function jogarVelha(idx) {
            if (!velhaAtivo || velhaBoard[idx] !== '') return;
            velhaBoard[idx] = velhaTurno;
            tocarSomEspecifico('clique');
            
            let cells = document.querySelectorAll('.cell-velha');
            cells[idx].innerText = velhaTurno;

            let vitorias = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            let ganhou = vitorias.some(c => velhaBoard[c[0]] && velhaBoard[c[0]] === velhaBoard[c[1]] && velhaBoard[c[0]] === velhaBoard[c[2]]);

            if (ganhou) {
                velhaAtivo = false;
                tocarSomEspecifico('vitoria');
                let tempoGasto = pararTimer();
                let pontos = Math.max(10, 400 - (tempoGasto * 6));
                setTimeout(() => salvarPontuacao('Jogo da Velha', pontos), 300);
                return;
            }
            velhaTurno = velhaTurno === 'X' ? 'O' : 'X';
        }

        // --- LÓGICA: JOKENPÔ (Com regra de reiniciar se perder + timer + salvar) ---
        function jogarJokenpo(escolha) {
            let cpu = ['pedra', 'papel', 'tesoura'][Math.floor(Math.random() * 3)];
            let statusEl = document.getElementById('status-jokenpo');
            let salvarPanel = document.getElementById('painel-salvar-jokenpo');

            if (
                (escolha === 'pedra' && cpu === 'tesoura') ||
                (escolha === 'papel' && cpu === 'pedra') ||
                (escolha === 'tesoura' && cpu === 'papel')
            ) {
                tocarSomEspecifico('vitoria');
                let tempoGasto = pararTimer();
                let pts = Math.max(20, 300 - (tempoGasto * 5));
                statusEl.innerHTML = `🎉 Você Venceu! (Escolha CPU: ${cpu}). Pontos obtidos: ${pts}`;
                salvarPanel.style.display = 'block';
                salvarPanel.innerHTML = `<button class="btn-salvar-pts" onclick="salvarPontuacao('Jokenpô', ${pts})">Salvar Pontuação de Jokenpô</button>`;
            } else if (escolha === cpu) {
                tocarSomEspecifico('clique');
                statusEl.innerHTML = `🤝 Empate! (Escolha CPU: ${cpu}). Tente novamente para avançar.`;
            } else {
                tocarSomEspecifico('derrota');
                statusEl.innerHTML = `❌ Você Perdeu! (Escolha CPU: ${cpu}). Voltando ao início do Jokenpô...`;
                setTimeout(() => {
                    iniciarJogo('jokenpo'); // Reinicia a partida do zero conforme pedido
                }, 1500);
            }
        }

        // --- LÓGICA: JOGO DA COBRINHA (Snake) ---
        let snakeInterval = null;
        let snake = [], food = {}, dx = 10, dy = 0, scoreSnake = 0;

        function iniciarCobrinha() {
            snake = [{x: 100, y: 100}, {x: 90, y: 100}, {x: 80, y: 100}];
            scoreSnake = 0;
            dx = 10; dy = 0;
            gerarComida();
            clearInterval(snakeInterval);
            snakeInterval = setInterval(executarLoopSnake, 120);
        }

        function pararCobrinhaLoop() {
            clearInterval(snakeInterval);
        }

        function mudarDirecao(dir) {
            tocarSomEspecifico('clique');
            if(dir === 'UP' && dy === 0) { dx = 0; dy = -10; }
            if(dir === 'DOWN' && dy === 0) { dx = 0; dy = 10; }
            if(dir === 'LEFT' && dx === 0) { dx = -10; dy = 0; }
            if(dir === 'RIGHT' && dx === 0) { dx = 10; dy = 0; }
        }

        function gerarComida() {
            food = {
                x: Math.floor(Math.random() * 27) * 10,
                y: Math.floor(Math.random() * 27) * 10
            };
        }

        function executarLoopSnake() {
            const canvas = document.getElementById('snakeCanvas');
            if(!canvas) { pararCobrinhaLoop(); return; }
            const ctx = canvas.getContext('2d');

            let head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Colisão paredes ou corpo
            if (head.x < 0 || head.x >= 280 || head.y < 0 || head.y >= 280 || snake.some(part => part.x === head.x && part.y === head.y)) {
                tocarSomEspecifico('gameover');
                pararCobrinhaLoop();
                pararTimer();
                let painel = document.getElementById('painel-salvar-snake');
                if(painel) {
                    painel.style.display = 'block';
                    painel.innerHTML = `<p style="color:red; font-weight:bold;">Game Over!</p><button class="btn-salvar-pts" onclick="salvarPontuacao('Cobrinha', ${scoreSnake * 15})">Salvar ${scoreSnake * 15} Pts</button>`;
                }
                return;
            }

            snake.unshift(head);

            // Comer comida
            if (head.x === food.x && head.y === food.y) {
                scoreSnake++;
                tocarSomEspecifico('comer');
                let scoreEl = document.getElementById('snake-score');
                if(scoreEl) scoreEl.innerText = scoreSnake;
                gerarComida();
            } else {
                snake.pop();
            }

            // Desenhar tela
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(food.x, food.y, 10, 10);

            ctx.fillStyle = '#2ecc71';
            snake.forEach(part => ctx.fillRect(part.x, part.y, 9, 9));
        }

        // Inicializa o ranking logo no carregamento
        exibirRanking();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca - Com Som</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
            text-align: center;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card-game {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Jogo da Forca com Cronômetro, Pontuação e Sons -->
        <div id="container-jogo-forca" class="card-game">
            <div style="background: #00796b; color: white; padding: 8px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <h3 id="forca-nivel-info" style="margin: 0; font-size: 13px;">🎯 Jogo da Forca</h3>
                <span>⏱️ <span id="forca-tempo">30</span>s</span>
            </div>
            
            <div id="status-forca" style="font-size: 13px; font-weight: bold; margin: 5px; color: #dc2626;">Erros: <span id="contador-erros">0</span> / 6 | Pontos: <span id="pontos-forca">0</span></div>
            <div id="palavra-secreta" style="font-size: 24px; letter-spacing: 6px; font-weight: bold; margin: 10px 0;">_ _ _ _ _</div>
            
            <!-- Botão de Dica Opcional -->
            <div style="margin-bottom: 10px;">
                <button onclick="mostrarDicaForca()" style="background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">💡 Mostrar Dica</button>
                <p id="dica-palavra" style="font-weight: bold; color: #0284c7; font-size: 13px; margin: 5px 0; display: none;"></p>
            </div>

            <div id="teclado-letras" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 350px; margin: 0 auto;"></div>
        </div>
    </div>

    <script>
        /* Gerador de Efeitos Sonoros via Web Audio API */
        function tocarSom(tipo) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (tipo === 'acerto') {
                    // Som agudo e curto de sucesso
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota Ré
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // Nota Lá
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (tipo === 'erro') {
                    // Som grave de erro
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (tipo === 'vitoria') {
                    // Sequência feliz de vitória
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // Dó
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // Mi
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // Sol
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch (e) {
                console.log("Áudio bloqueado ou não suportado temporariamente.");
            }
        }

        /* Jogo da Forca */
        const bancoPalavrasForca = [
            {p: "COMPUTADOR", d: "Máquina eletrônica para processar dados"},
            {p: "PROGRAMACAO", d: "Ato de criar códigos e softwares"},
            {p: "INTERNET", d: "Rede global de computadores"},
            {p: "BRASIL", d: "Nosso país tropical"},
            {p: "TELEFONE", d: "Aparelho de chamadas e mensagens"},
            {p: "ESCOLA", d: "Instituição de ensino e aprendizado"},
            {p: "CARRO", d: "Veículo automotor de quatro rodas"},
            {p: "AVIAO", d: "Meio de transporte que voa"},
            {p: "GATO", d: "Animal felino doméstico"},
            {p: "GIRAFA", d: "Animal de pescoço comprido"},
            {p: "ELEFANTE", d: "Maior animal terrestre"},
            {p: "FUTEBOL", d: "Esporte mais popular do mundo"},
            {p: "GUITARRA", d: "Instrumento musical de cordas"},
            {p: "PIANO", d: "Instrumento de teclas pretas e brancas"},
            {p: "CHOCOLATE", d: "Doce feito a partir do cacau"},
            {p: "BIBLIOTECA", d: "Lugar repleto de livros"},
            {p: "MONTANHA", d: "Grande elevação natural do terreno"},
            {p: "GELADEIRA", d: "Eletrodoméstico para conservar alimentos"}
        ];
        
        let listaForcaEmbaralhada = [];
        let indiceForcaAtual = 0;
        let letrasDescobertas = [], errosForca = 0, pontosForca = 0;
        let tempoRestanteForca = 30, intervaloTempoForca = null;

        function iniciarForca() {
            listaForcaEmbaralhada = [...bancoPalavrasForca].sort(() => Math.random() - 0.5);
            indiceForcaAtual = 0;
            pontosForca = 0;
            carregarProximaPalavraForca();
        }

        function iniciarCronometroForca() {
            if (intervaloTempoForca) clearInterval(intervaloTempoForca);
            tempoRestanteForca = 30;
            document.getElementById('forca-tempo').innerText = tempoRestanteForca;
            
            intervaloTempoForca = setInterval(() => {
                tempoRestanteForca--;
                document.getElementById('forca-tempo').innerText = tempoRestanteForca;
                if (tempoRestanteForca <= 0) {
                    clearInterval(intervaloTempoForca);
                    tocarSom('erro');
                    let atual = listaForcaEmbaralhada[indiceForcaAtual];
                    alert(`⏰ O tempo esgotou! A palavra era "${atual.p}". Vamos para a próxima.`);
                    indiceForcaAtual++;
                    carregarProximaPalavraForca();
                }
            }, 1000);
        }

        function carregarProximaPalavraForca() {
            if (indiceForcaAtual >= listaForcaEmbaralhada.length) {
                listaForcaEmbaralhada = [...bancoPalavrasForca].sort(() => Math.random() - 0.5);
                indiceForcaAtual = 0;
            }
            let atual = listaForcaEmbaralhada[indiceForcaAtual];
            letrasDescobertas = []; 
            errosForca = 0;
            
            document.getElementById('forca-nivel-info').innerText = `🎯 Palavra ${indiceForcaAtual + 1} de ${listaForcaEmbaralhada.length}`;
            document.getElementById('dica-palavra').innerText = `Dica: ${atual.d}`;
            document.getElementById('dica-palavra').style.display = 'none';
            document.getElementById('contador-erros').innerText = 0;
            document.getElementById('pontos-forca').innerText = pontosForca;
            
            iniciarCronometroForca();
            atualizarTelaForca(); 
            criarTecladoForca();
        }

        function mostrarDicaForca() {
            document.getElementById('dica-palavra').style.display = 'block';
        }

        function atualizarTelaForca() {
            let atual = listaForcaEmbaralhada[indiceForcaAtual];
            let ex = "", ganho = true;
            for (let i = 0; i < atual.p.length; i++) {
                let l = atual.p[i];
                if (letrasDescobertas.includes(l)) { ex += l + " "; } else { ex += "_ "; ganho = false; }
            }
            document.getElementById('palavra-secreta').innerText = ex.trim();
            
            if (ganho) {
                if (intervaloTempoForca) clearInterval(intervaloTempoForca);
                tocarSom('vitoria');
                pontosForca += (7 - errosForca) * 15 + (tempoRestanteForca * 2);
                document.getElementById('pontos-forca').innerText = pontosForca;
                setTimeout(() => {
                    alert(`🎉 Acertou a palavra "${atual.p}"! Ganhou pontos extras por velocidade.`);
                    indiceForcaAtual++;
                    carregarProximaPalavraForca();
                }, 200);
            } else if (errosForca >= 6) {
                if (intervaloTempoForca) clearInterval(intervaloTempoForca);
                tocarSom('erro');
                setTimeout(() => {
                    alert(`❌ Muitos erros! A palavra era "${atual.p}". Tentando nova palavra.`);
                    indiceForcaAtual++;
                    carregarProximaPalavraForca();
                }, 200);
            }
        }

        function escolherLetraForca(l) {
            let atual = listaForcaEmbaralhada[indiceForcaAtual];
            if (!letrasDescobertas.includes(l)) {
                letrasDescobertas.push(l);
                if (atual.p.includes(l)) {
                    tocarSom('acerto');
                } else { 
                    errosForca++; 
                    tocarSom('erro');
                    document.getElementById('contador-erros').innerText = errosForca; 
                }
            }
            let btn = document.getElementById(`btn-letra-${l}`);
            if (btn) { 
                btn.disabled = true; 
                btn.style.background = "#94a3b8"; 
                btn.style.color = "#f1f5f9";
            }
            atualizarTelaForca();
        }

        function criarTecladoForca() {
            let alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", cont = document.getElementById('teclado-letras');
            cont.innerHTML = "";
            for (let i = 0; i < alfabeto.length; i++) {
                let l = alfabeto[i], btn = document.createElement('button');
                btn.innerText = l; btn.id = `btn-letra-${l}`;
                btn.onclick = () => escolherLetraForca(l);
                btn.style.cssText = "padding: 8px 0; font-size: 12px; font-weight: bold; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;";
                cont.appendChild(btn);
            }
        }

        // Iniciar jogo automaticamente ao carregar a página
        window.onload = function() {
            iniciarForca();
        };
    </script>
</body>
</html>

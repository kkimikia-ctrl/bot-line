<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos - Mini Craque</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header-jogo { width: 100%; background-color: #1a365d; color: white; padding: 10px; text-align: center; }
        .campo-container { 
            position: relative; width: 95%; max-width: 400px; height: 500px; 
            background-color: #2e8540; border: 4px solid white; border-radius: 8px; 
            margin-top: 20px; overflow: hidden; touch-action: none; 
        }
        /* Gol posicionado no topo da tela para dar espaço abaixo */
        .gol { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            width: 200px; height: 80px; border: 3px solid white; border-bottom: none; 
        }
        .jogador-campo { position: absolute; font-size: 24px; width: 30px; height: 30px; }
        .bola { 
            position: absolute; width: 40px; height: 40px; background: white; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            cursor: grab; z-index: 10; bottom: 50px; left: 50%; transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="header-jogo">🎮 Mini Craque</div>
    <div class="campo-container" id="gameArea">
        <div class="gol" id="gol">
            <div class="jogador-campo" id="gk" style="top: 10px; left: 85px;">🤖</div>
        </div>
        <!-- Zagueiros em linhas Y diferentes -->
        <div class="jogador-campo" id="def1" style="top: 120px; left: 50px;">🛡️</div>
        <div class="jogador-campo" id="def2" style="top: 200px; left: 200px;">🛡️</div>
        <div class="jogador-campo" id="def3" style="top: 280px; left: 100px;">🛡️</div>
        
        <div class="bola" id="bola">⚽</div>
    </div>

    <script>
        const bola = document.getElementById('bola');
        let isDragging = false;

        // Lógica: A bola deve ficar parada e o usuário clica e arrasta para chutar
        bola.addEventListener('mousedown', (e) => { isDragging = true; });
        
        document.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                chutarBola();
            }
        });

        function chutarBola() {
            // Lógica de chute simplificada mantendo a bola parada inicialmente
            bola.style.transition = "bottom 0.5s ease-out";
            bola.style.bottom = "400px"; 
            
            setTimeout(() => {
                bola.style.transition = "none";
                bola.style.bottom = "50px";
                bola.style.left = "50%";
            }, 600);
        }
    </script>
</body>
</html>

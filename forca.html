<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Craque</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            position: relative;
        }
        canvas {
            background-color: #2e7d32;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            touch-action: none;
        }
        .info {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="info">Mini Craque | Gols: <span id="gols">0</span> | Vidas: <span id="vidas">3</span></div>
    <canvas id="gameCanvas" width="360" height="540"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gols = 0;
let vidas = 3;

// Configuração da Bola (reposicionada mais acima conforme pedido)
let ball = {
    x: canvas.width / 2,
    y: canvas.height - 120, // Mais para cima
    radius: 12,
    speedX: 0,
    speedY: 0,
    dragging: false,
    startX: 0,
    startY: 0
};

// Configuração do Goleiro (com movimento estendido para fora das traves)
let keeper = {
    x: canvas.width / 2 - 30,
    y: 60,
    width: 60,
    height: 25,
    speed: 2.5,
    direction: 1,
    minX: 60,  // Ultrapassa a trave esquerda (trave começa em ~90)
    maxX: canvas.width - 120 // Ultrapassa a trave direita
};

// Obstáculos (Jogadores / Barreiras)
let obstacles = [
    { x: 100, y: 240, width: 100, height: 16, speed: 2, direction: 1, minX: 40, maxX: canvas.width - 140 }
];

// Controles de toque e mouse para chutar a bola
canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', drag);
canvas.addEventListener('mouseup', endDrag);

canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
canvas.addEventListener('touchmove', (e) => drag(e.touches[0]));
canvas.addEventListener('touchend', endDrag);

function startDrag(e) {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // Permitir arrancar se clicar próximo à bola
    const dist = Math.hypot(mouseX - ball.x, mouseY - ball.y);
    if (dist < 30 && ball.speedY === 0) {
        ball.dragging = true;
        ball.startX = mouseX;
        ball.startY = mouseY;
    }
}

function drag(e) {
    if (!ball.dragging) return;
}

function endDrag(e) {
    if (!ball.dragging) return;
    ball.dragging = false;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX ? e.clientX - rect.left : ball.x;
    const mouseY = e.clientY ? e.clientY - rect.top : ball.y;

    // Calcular vetor do chute
    let forceX = (ball.startX - mouseX) * 0.15;
    let forceY = (ball.startY - mouseY) * 0.15;

    // Limitar velocidade máxima e garantir que vá para frente (para cima)
    ball.speedX = forceX;
    ball.speedY = Math.min(forceY, -5); 
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height - 120;
    ball.speedX = 0;
    ball.speedY = 0;
    ball.dragging = false;
}

function update() {
    // Movimento do Goleiro (Fluido, sem tremer, ultrapassando as traves)
    keeper.x += keeper.speed * keeper.direction;
    if (keeper.x <= keeper.minX || keeper.x + keeper.width >= keeper.maxX) {
        keeper.direction *= -1;
    }

    // Movimento dos Obstáculos
    obstacles.forEach(obs => {
        obs.x += obs.speed * obs.direction;
        if (obs.x <= obs.minX || obs.x + obs.width >= obs.maxX) {
            obs.direction *= -1;
        }
    });

    // Movimento da Bola
    if (ball.speedY !== 0) {
        ball.x += ball.speedX;
        ball.y += ball.speedY;

        // Colisão com as paredes laterais
        if (ball.x - ball.radius < 30 || ball.x + ball.radius > canvas.width - 30) {
            ball.speedX *= -1;
        }

        // Colisão com o Goleiro
        if (
            ball.x > keeper.x && ball.x < keeper.x + keeper.width &&
            ball.y - ball.radius < keeper.y + keeper.height && ball.y + ball.radius > keeper.y
        ) {
            vidas--;
            document.getElementById('vidas').innerText = vidas;
            resetBall();
            checkGameOver();
        }

        // Colisão com Obstáculos
        obstacles.forEach(obs => {
            if (
                ball.x > obs.x && ball.x < obs.x + obs.width &&
                ball.y - ball.radius < obs.y + obs.height && ball.y + ball.radius > obs.y
            ) {
                ball.speedY *= -1; // Rebate
            }
        });

        // Condição de Gol (Entrou na trave: X entre 90 e 270, Y < 50)
        if (ball.y <= 50) {
            if (ball.x > 90 && ball.x < 270) {
                gols++;
                document.getElementById('gols').innerText = gols;
            } else {
                vidas--;
                document.getElementById('vidas').innerText = vidas;
            }
            resetBall();
            checkGameOver();
        }

        // Bola saiu por baixo ou perdeu força
        if (ball.y > canvas.height) {
            resetBall();
        }
    }
}

function checkGameOver() {
    if (vidas <= 0) {
        alert('Fim de Jogo! Você perdeu todas as vidas.');
        gols = 0;
        vidas = 3;
        document.getElementById('gols').innerText = gols;
        document.getElementById('vidas').innerText = vidas;
        resetBall();
    }
}

function drawField() {
    // Gramado e marcações do campo
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Trave de Gol
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.strokeRect(90, 20, 180, 50);

    // Linhas do campo
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(30, 20);
    ctx.lineTo(30, canvas.height - 20);
    ctx.lineTo(canvas.width - 30, canvas.height - 20);
    ctx.lineTo(canvas.width - 30, 20);
    ctx.stroke();
}

function draw() {
    drawField();

    // Desenhar Goleiro (Estilo personalizado com visual limpo e nítido)
    ctx.fillStyle = '#ff5722';
    ctx.fillRect(keeper.x, keeper.y, keeper.width, keeper.height);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.fillText('🤖', keeper.x + 20, keeper.y + 17);

    // Desenhar Obstáculos
    obstacles.forEach(obs => {
        ctx.fillStyle = '#e91e63';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    });

    // Desenhar Bola
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000';
    ctx.stroke();
    ctx.closePath();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>

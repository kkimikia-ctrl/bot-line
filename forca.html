<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Craque - Jogo de Futebol</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 600px;
            background-color: #2e7d32;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }

        .btn {
            background: #555;
            color: white;
            border: 2px solid #fff;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-save { background: #4CAF50; }
        .btn-back { background: #f44336; }

        .hud {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 0;
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            font-weight: bold;
            z-index: 10;
        }

        .goal {
            width: 220px;
            height: 90px;
            border: 4px solid #fff;
            border-bottom: none;
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
        }

        .element {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        #ball {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #fff, #bbb);
            border: 2px solid #333;
            bottom: 40px;
            left: calc(50% - 20px);
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #goalkeeper {
            width: 45px;
            height: 45px;
            background: #ff5722;
            top: 100px;
            left: calc(50% - 22.5px);
            border: 2px solid #fff;
        }

        .defender {
            width: 35px;
            height: 35px;
            border: 2px solid #fff;
        }

        #def-blue { background: #2196F3; top: 220px; }
        #def-green { background: #4CAF50; top: 280px; }
        #def-yellow { background: #FFEB3B; top: 340px; color: #000; }

        #message {
            position: absolute;
            top: 175px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        #trajectory {
            position: absolute;
            border: 2px dashed rgba(255, 255, 255, 0.8);
            transform-origin: bottom center;
            pointer-events: none;
            display: none;
        }

        /* Janela (Modal) para inserir o nome e salvar no Game Over */
        #game-over-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-over-modal h2 {
            color: #ff5722;
            margin-bottom: 5px;
            font-size: 24px;
        }

        #game-over-modal p {
            font-size: 14px;
            margin: 5px 0 15px 0;
        }

        .input-name {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            border: 2px solid #fff;
            background: #222;
            color: #fff;
            width: 80%;
            max-width: 220px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .btn-modal {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 6px;
            border: 2px solid #fff;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Barra Superior -->
        <div class="top-bar">
            <button class="btn btn-back" onclick="voltarJogo()">Voltar</button>
            <span id="title-game">⚽ Mini Craque</span>
            <button class="btn btn-save" onclick="salvarJogoManual()">Salvar</button>
        </div>

        <div class="hud">
            <span id="score-text">Pts: 0</span>
            <span id="goal-text">Gols: 0</span>
            <span id="level-text">Lvl: 1</span>
            <span id="lives-text">Vidas: 3</span>
        </div>

        <div id="message">Arraste para trás e solte!</div>

        <div class="goal"></div>

        <!-- Elementos -->
        <div id="goalkeeper" class="element">🤖</div>
        <div id="def-blue" class="element defender" style="display: none;">🛡️</div>
        <div id="def-green" class="element defender" style="display: none;">🛡️</div>
        <div id="def-yellow" class="element defender" style="display: none;">🛡️</div>
        <div id="ball" class="element">⚽</div>
        
        <div id="trajectory"></div>

        <!-- Janela de Fim de Jogo para Salvar com o Nome -->
        <div id="game-over-modal">
            <h2>FIM DE JOGO! ❌</h2>
            <p id="final-stats">Pontuação: 0 | Gols: 0</p>
            <input type="text" id="player-name" class="input-name" placeholder="Digite seu nome..." maxlength="15">
            <div class="modal-btns">
                <button class="btn-modal btn-save" onclick="salvarComNome()">Salvar</button>
                <button class="btn-modal" style="background:#2196F3;" onclick="reiniciarJogoModal()">Jogar de Novo</button>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        let bgmInterval = null;
        function startBGM() {
            if (bgmInterval) return;
            bgmInterval = setInterval(() => {
                if (!audioCtx) return;
                let notes = [261.63, 329.63, 392.00, 523.25];
                let note = notes[Math.floor(Math.random() * notes.length)];
                playTone(note, 0.1, 'sine', 0.05);
            }, 1200);
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.1) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = frequency;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function soundKick() { initAudio(); playTone(150, 0.15, 'triangle', 0.3); }
        function soundSave() { 
            initAudio(); 
            playTone(100, 0.2, 'sawtooth', 0.2);
            setTimeout(() => playTone(80, 0.2, 'sawtooth', 0.2), 100);
        }
        function soundGoal() { 
            initAudio(); 
            playTone(400, 0.15, 'sine', 0.3);
            setTimeout(() => playTone(600, 0.15, 'sine', 0.3), 150);
            setTimeout(() => playTone(800, 0.3, 'sine', 0.4), 300);
        }

        const ball = document.getElementById('ball');
        const goalkeeper = document.getElementById('goalkeeper');
        const defBlue = document.getElementById('def-blue');
        const defGreen = document.getElementById('def-green');
        const defYellow = document.getElementById('def-yellow');
        const message = document.getElementById('message');
        const trajectory = document.getElementById('trajectory');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalStats = document.getElementById('final-stats');
        const playerNameInput = document.getElementById('player-name');
        
        const scoreText = document.getElementById('score-text');
        const goalText = document.getElementById('goal-text');
        const levelText = document.getElementById('level-text');
        const livesText = document.getElementById('lives-text');
        const container = document.getElementById('game-container');

        let score = 0;
        let goals = 0;
        let lives = 3;
        let level = 1;
        let gameOver = false;

        let ballX = container.clientWidth / 2 - 20;
        let ballY = container.clientHeight - 80;
        let ballVX = 0;
        let ballVY = 0;
        let isMoving = false;

        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;

        let gkX = container.clientWidth / 2 - 22.5;
        let gkDir = 2;
        let blueX = 50, blueDir = 2.5;
        let greenX = 150, greenDir = -2.5;
        let yellowX = 100, yellowDir = 3;
        let speedMultiplier = 1;

        function updatePositions() {
            ball.style.left = ballX + 'px';
            ball.style.bottom = (container.clientHeight - ballY - 40) + 'px';
            goalkeeper.style.left = gkX + 'px';
            defBlue.style.left = blueX + 'px';
            defGreen.style.left = greenX + 'px';
            defYellow.style.left = yellowX + 'px';
        }

        function startDrag(e) {
            if (isMoving || gameOver) return;
            initAudio();
            startBGM();
            isDragging = true;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startX = clientX;
            startY = clientY;
            currentX = clientX;
            currentY = clientY;
        }

        function onDrag(e) {
            if (!isDragging || gameOver) return;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            currentX = clientX;
            currentY = clientY;

            let pullX = startX - currentX;
            let pullY = startY - currentY;

            if (pullY < 0) {
                let dist = Math.sqrt(pullX * pullX + pullY * pullY);
                let angle = Math.atan2(pullX, -pullY);
                
                trajectory.style.display = 'block';
                trajectory.style.width = '6px';
                trajectory.style.height = Math.min(dist, 120) + 'px';
                trajectory.style.left = (ballX + 17) + 'px';
                trajectory.style.top = (ballY + 17) + 'px';
                trajectory.style.transform = `rotate(${angle * (180/Math.PI)}deg)`;
            } else {
                trajectory.style.display = 'none';
            }
        }

        function endDrag() {
            if (!isDragging || gameOver) return;
            isDragging = false;
            trajectory.style.display = 'none';

            let pullX = startX - currentX;
            let pullY = startY - currentY;

            if (pullY < -10) {
                ballVX = pullX * 0.12;
                ballVY = pullY * 0.12;
                isMoving = true;
                message.textContent = '';
                soundKick();
            }
        }

        ball.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', endDrag);
        ball.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', onDrag);
        window.addEventListener('touchend', endDrag);

        function gameLoop() {
            if (!gameOver) {
                if (isMoving) {
                    ballX += ballVX;
                    ballY += ballVY;

                    if (ballX < 0 || ballX > container.clientWidth - 40) {
                        ballVX *= -1;
                    }

                    let gkRect = goalkeeper.getBoundingClientRect();
                    let containerRect = container.getBoundingClientRect();
                    let relGkX = gkRect.left - containerRect.left;
                    let relGkY = gkRect.top - containerRect.top;

                    if (ballX + 40 > relGkX && ballX < relGkX + 45 &&
                        ballY + 40 > relGkY && ballY < relGkY + 45) {
                        defenderHit("Defendido pelo Goleiro!");
                    }

                    if (level >= 2 && checkCollision(defBlue)) defenderHit("Bloqueado pela Defesa Azul!");
                    if (level >= 3 && checkCollision(defGreen)) defenderHit("Bloqueado pela Defesa Verde!");
                    if (level >= 4 && checkCollision(defYellow)) defenderHit("Bloqueado pela Defesa Amarela!");

                    if (ballY <= 70) {
                        if (ballX >= container.clientWidth / 2 - 110 && ballX <= container.clientWidth / 2 + 90) {
                            score += 10 * level;
                            goals++;
                            successGoal();
                        } else {
                            defenderHit("Fora!");
                        }
                    }

                    if (ballY > container.clientHeight) {
                        resetBall();
                    }
                }

                let currentSpeed = speedMultiplier;
                gkX += gkDir * currentSpeed;
                if (gkX < 40 || gkX > container.clientWidth - 85) gkDir *= -1;

                if (level >= 2) {
                    blueX += blueDir * currentSpeed;
                    if (blueX < 10 || blueX > container.clientWidth - 45) blueDir *= -1;
                }
                if (level >= 3) {
                    greenX += greenDir * currentSpeed;
                    if (greenX < 10 || greenX > container.clientWidth - 45) greenDir *= -1;
                }
                if (level >= 4) {
                    yellowX += yellowDir * currentSpeed;
                    if (yellowX < 10 || yellowX > container.clientWidth - 45) yellowDir *= -1;
                }

                updatePositions();
            }
            requestAnimationFrame(gameLoop);
        }

        function checkCollision(defElement) {
            let defRect = defElement.getBoundingClientRect();
            let containerRect = container.getBoundingClientRect();
            let relDefX = defRect.left - containerRect.left;
            let relDefY = defRect.top - containerRect.top;

            return (ballX + 40 > relDefX && ballX < relDefX + 35 &&
                    ballY + 40 > relDefY && ballY < relDefY + 35);
        }

        function successGoal() {
            soundGoal();
            message.textContent = "GOOOOL! ⚽🔥";
            message.style.color = "#4CAF50";
            checkLevelProgression();
            resetBall();
        }

        function defenderHit(text) {
            soundSave();
            message.textContent = text;
            message.style.color = "#FF5722";
            lives--;
            
            if (lives <= 0) {
                triggerGameOver();
            } else {
                resetBall();
            }
        }

        function triggerGameOver() {
            gameOver = true;
            finalStats.textContent = `Pontuação: ${score} | Gols: ${goals}`;
            gameOverModal.style.display = 'flex';
        }

        function checkLevelProgression() {
            if (goals === 3) {
                level = 2;
                defBlue.style.display = 'flex';
                message.textContent = "LEVEL 2 - Defesa Azul!";
            } else if (goals === 6) {
                level = 3;
                defGreen.style.display = 'flex';
                message.textContent = "LEVEL 3 - Defesa Verde!";
            } else if (goals >= 9) {
                level = 4;
                defYellow.style.display = 'flex';
                message.textContent = `LEVEL ${level} - Dificuldade Máxima!`;
            }

            if (goals % 3 === 0) {
                speedMultiplier += 0.4;
            }

            updateHUD();
        }

        function updateHUD() {
            scoreText.textContent = "Pts: " + score;
            goalText.textContent = "Gols: " + goals;
            levelText.textContent = "Lvl: " + level;
            livesText.textContent = "Vidas: " + lives;
        }

        function resetBall() {
            isMoving = false;
            ballX = container.clientWidth / 2 - 20;
            ballY = container.clientHeight - 80;
            ballVX = 0;
            ballVY = 0;
            updateHUD();
        }

        function salvarJogoManual() {
            let name = prompt("Digite seu nome para salvar o jogo:", "Craque");
            if (name) {
                let saveData = { name, score, goals, level, lives, date: new Date().toLocaleString() };
                localStorage.setItem("miniCraqueSave", JSON.stringify(saveData));
                alert("Progresso salvo com sucesso! 💾");
            }
        }

        function salvarComNome() {
            let name = playerNameInput.value.trim();
            if (!name) {
                alert("Por favor, digite seu nome antes de salvar!");
                return;
            }
            let saveData = { name, score, goals, level, date: new Date().toLocaleString() };
            localStorage.setItem("miniCraqueSave", JSON.stringify(saveData));
            alert(`Parabéns ${name}! Sua pontuação foi salva com sucesso! 💾⚽`);
            window.history.back();
        }

        function reiniciarJogoModal() {
            gameOverModal.style.display = 'none';
            score = 0;
            goals = 0;
            lives = 3;
            level = 1;
            speedMultiplier = 1;
            gameOver = false;
            playerNameInput.value = '';
            defBlue.style.display = 'none';
            defGreen.style.display = 'none';
            defYellow.style.display = 'none';
            resetBall();
            message.textContent = "Arraste para trás e solte!";
        }

        function voltarJogo() {
            if(confirm("Deseja voltar para a Central de Jogos?")) {
                window.history.back();
            }
        }

        updateHUD();
        gameLoop();
    </script>
</body>
</html>

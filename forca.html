<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Jogos</title>
    <style>
        /* [MANTENHA TODO O SEU CSS ANTERIOR AQUI PARA NÃO MUDAR O VISUAL] */
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding-bottom: 80px; }
        .container { padding: 10px; }
        .action-btn { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        
        /* ESTILO PARA A TELA DO JOGO */
        #tela-jogo {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 2000;
        }
        #tela-jogo iframe { width: 100%; height: 100%; border: none; }
        .btn-fechar { position: absolute; top: 10px; right: 10px; z-index: 2001; padding: 10px; background: red; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- [MANTENHA SEU MENU AQUI] -->
    <div class="container">
        <div id="menu-selecao-jogos">
            <button onclick="carregarJogo('futebol.html')" class="action-btn" style="background-color: #16a34a;">⚽ Jogo de Futebol</button>
            <button onclick="carregarJogo('velha.html')" class="action-btn" style="background-color: #2563eb;">❌ Jogo da Velha</button>
            <!-- Adicione os outros jogos seguindo este padrão -->
        </div>
    </div>

    <!-- TELA DE SOBREPOSIÇÃO ONDE O JOGO VAI APARECER -->
    <div id="tela-jogo">
        <button class="btn-fechar" onclick="fecharJogo()">Fechar Jogo</button>
        <iframe id="iframe-jogo" src=""></iframe>
    </div>

    <script>
        function carregarJogo(url) {
            const tela = document.getElementById('tela-jogo');
            const iframe = document.getElementById('iframe-jogo');
            iframe.src = url; // Isso abre o arquivo do jogo dentro da tela
            tela.style.display = 'block';
        }

        function fecharJogo() {
            const tela = document.getElementById('tela-jogo');
            const iframe = document.getElementById('iframe-jogo');
            iframe.src = ""; // Para o carregamento
            tela.style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lives da Comunidade</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        .header { background-color: #0d47a1; color: white; padding: 15px; display: flex; align-items: center; }
        .btn-voltar { background: none; border: none; color: white; font-size: 16px; cursor: pointer; font-weight: bold; margin-right: 15px; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        /* Carrossel de Anúncios */
        .carousel { width: 100%; height: 120px; background: #e0e7ff; border-radius: 14px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px dashed #6366f1; color: #4338ca; font-weight: bold; }
        
        .section-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .live-card { background: white; border: 1px solid #ddd; padding: 16px; border-radius: 14px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .badge-aovivo { background-color: #ef4444; color: white; padding: 5px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-voltar" onclick="window.location.href='entretenimento.html'">⬅ Voltar</button>
        <span style="font-weight: bold; font-size: 18px;">🔴 Lives da Comunidade</span>
    </div>

    <div class="container">
        <!-- Banner Carrossel -->
        <div class="carousel">Espaço para Carrossel de Anúncios</div>

        <div class="section-title">Transmissões acontecendo agora:</div>
        
        <div class="live-card" onclick="window.location.href='sala-live.html?tema=Receitas%20de%20Bolos%20Japoneses'">
            <div><strong>🍰 Receitas de Bolos Japoneses</strong><br><small>Ana Silva • 45 assistindo</small></div>
            <div class="badge-aovivo">AO VIVO</div>
        </div>

        <div class="live-card" onclick="window.location.href='sala-live.html?tema=Truques%20de%20Mágica'">
            <div><strong>🎩 Truques de Mágica</strong><br><small>Mágico Hiro • 120 assistindo</small></div>
            <div class="badge-aovivo">AO VIVO</div>
        </div>
    </div>

</body>
</html>

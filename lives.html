<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lives da Comunidade</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            text-align: center;
            padding-top: 90px; /* Ajustado para dar espaço suficiente abaixo do cabeçalho fixo */
        }
        .header {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            text-align: left;
        }
        .card h3 {
            margin-top: 0;
            color: #d32f2f;
        }
        .back-btn {
            background-color: #555;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔴 Transmissões ao Vivo</h1>
    </div>

    <div class="container">
        <div class="card">
            <h3>Nenhuma live ativa no momento</h3>
            <p>Fique ligado! As transmissões dos criadores da comunidade aparecerão aqui assim que iniciarem.</p>
        </div>

        <button class="back-btn" onclick="window.location.href='entretenimento.html'">Voltar para Entretenimento</button>
    </div>

</body>
</html>

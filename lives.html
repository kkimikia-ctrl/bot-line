<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lives da Comunidade</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #1976d2;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .page-title {
            font-size: 18px;
            font-weight: bold;
            color: #d32f2f;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }
        .banner-box {
            border: 2px dashed #ab47bc;
            background: rgba(171, 71, 188, 0.05);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            color: #7b1fa2;
            font-weight: bold;
            font-size: 14px;
        }
        .section-subtitle {
            text-align: left;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .live-card {
            background: white;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }
        .live-info h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #222;
        }
        .live-info p {
            margin: 0;
            font-size: 12px;
            color: #666;
        }
        .live-badge {
            background-color: #f44336;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .start-live-btn {
            background: linear-gradient(135deg, #7c4dff, #512da8);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(124, 77, 255, 0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='entretenimento.html'">⬅ Voltar</button>
        <h1 class="page-title">🔴 Lives da Comunidade</h1>
    </div>

    <div class="banner-box">
        ✨ Espaço para Carrossel de Anúncios ✨
    </div>

    <div class="section-subtitle">Transmissões acontecendo agora:</div>

    <div class="live-card">
        <div class="live-info">
            <h4>🍰 Receitas de Bolos Japoneses</h4>
            <p>Ana Silva • 45 assistindo</p>
        </div>
        <div class="live-badge">Ao Vivo</div>
    </div>

    <div class="live-card">
        <div class="live-info">
            <h4>🎩 Truques de Mágica</h4>
            <p>Mágico Hiro • 120 assistindo</p>
        </div>
        <div class="live-badge">Ao Vivo</div>
    </div>

    <div class="live-card">
        <div class="live-info">
            <h4>🏠 Dicas de Moradia no Japão</h4>
            <p>Pedro Santos • 85 assistindo</p>
        </div>
        <div class="live-badge">Ao Vivo</div>
    </div>

    <button class="start-live-btn" onclick="alert('Tela de criação de live em breve!')">
        🎥 Iniciar Minha Própria Live
    </button>

</body>
</html>

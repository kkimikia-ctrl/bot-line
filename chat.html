<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat da Comunidade</title>
</head>
<body>
    <h1>Chat da Comunidade 💬</h1>
    
    <!-- Onde as mensagens vão aparecer -->
    <div id="mensagens-lista"></div>

    <!-- Campo de texto e botão para enviar -->
    <input type="text" id="mensagem-input" placeholder="Digite sua mensagem...">
    <button id="enviar-btn">Enviar</button>

    <!-- Script principal do chat -->
    <script type="module" src="chat.js"></script>
</body>
</html>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
          authDomain: "ajuda-jp.firebaseapp.com",
          projectId: "ajuda-jp",
          storageBucket: "ajuda-jp.firebasestorage.app",
          messagingSenderId: "40121072206",
          appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const listaSalas = document.getElementById('salas-lista');
        const botaoCriarSala = document.getElementById('btn-criar-sala');

        botaoCriarSala.addEventListener('click', async () => {
            const nomeSala = prompt("Digite o nome da nova sala de bate-papo:");
            if (nomeSala && nomeSala.trim() !== "") {
                try {
                    await addDoc(collection(db, "salas"), {
                        nome: nomeSala.trim(),
                        criadoEm: new Date().getTime()
                    });
                } catch (e) {
                    console.error("Erro ao criar sala: ", e);
                    alert("Erro ao criar sala.");
                }
            }
        });

        onSnapshot(collection(db, "salas"), (snapshot) => {
            listaSalas.innerHTML = "";
            if (snapshot.empty) {
                listaSalas.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Nenhuma sala criada ainda.</div>';
                return;
            }

            const salasArray = [];
            snapshot.forEach((doc) => {
                salasArray.push({ id: doc.id, ...doc.data() });
            });
            salasArray.sort((a, b) => b.criadoEm - a.criadoEm);

            salasArray.forEach((sala) => {
                const card = document.createElement('div');
                card.classList.add('sala-card');
                card.innerHTML = `
                    <div class="sala-info">
                        <h3># ${sala.nome}</h3>
                        <span>Toque para entrar na conversa</span>
                    </div>
                    <div class="sala-arrow">➔</div>
                `;
                
                // Usando caminho absoluto seguro para abrir a sala
                card.addEventListener('click', () => {
                    window.location.href = `sala.html?id=${sala.id}&nome=${encodeURIComponent(sala.nome)}`;
                });

                listaSalas.appendChild(card);
            });
        });
    </script>

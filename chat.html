<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat da Comunidade</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            padding-bottom: 80px;
        }
        h1 {
            font-size: 18px;
            color: #0d47a1;
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .mensagem-balao {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .mensagem-enviada {
            background-color: #06C755;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .mensagem-recebida {
            background-color: #e9ecef;
            color: #333333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 12px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        button {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Chat da Comunidade 💬</h1>
    
    <div id="mensagens-lista" class="chat-container">
        <div class="mensagem-balao mensagem-recebida">Olá! Sejam bem-vindos à comunidade do Ajuda JP.</div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="mensagem-input" placeholder="Digite sua mensagem...">
        <button id="enviar-btn">Enviar</button>
    </div>

    <script type="module" src="chat.js"></script>
</body>
</html>

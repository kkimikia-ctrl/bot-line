<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salas da Comunidade</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 15px; 
            padding-bottom: 80px; 
        }
        h1 { font-size: 20px; color: #0d47a1; text-align: center; margin-bottom: 5px; }
        p.sub { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }

        /* Botão Criar Sala Moderno */
        .btn-criar-container { text-align: center; margin-bottom: 20px; }
        .btn-criar { 
            background: linear-gradient(135deg, #0d47a1, #1976d2); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 25px; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(13, 71, 161, 0.3);
        }

        /* Lista de Salas em Cards */
        .salas-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sala-card {
            background: white;
            padding: 16px 20px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 5px solid #0d47a1;
        }
        .sala-card:active { transform: scale(0.98); }
        .sala-info h3 { margin: 0; font-size: 16px; color: #333; }
        .sala-info span { font-size: 12px; color: #888; }
        .sala-arrow { font-size: 18px; color: #0d47a1; font-weight: bold; }

        /* Barra de Navegação Inferior */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; 
            background: white; display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid #ddd; z-index: 1000;
        }
        .nav-link { text-decoration: none; color: #333; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Comunidade Ajuda JP 💬</h1>
    <p class="sub">Escolha uma sala abaixo ou crie um novo tópico</p>
    
    <div class="btn-criar-container">
        <button id="btn-criar-sala" class="btn-criar">+ Criar Nova Sala</button>
    </div>

    <div id="salas-lista" class="salas-grid">
        <div style="text-align: center; color: #888; padding: 20px;">Carregando salas...</div>
    </div>

    <nav class="bottom-nav">
        <a href="javascript:history.back()" class="nav-link">⬅️ Voltar</a>
        <a href="index.html" class="nav-link">🏠 Home</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
          authDomain: "ajuda-jp.firebaseapp.com",
          projectId: "ajuda-jp",
          storageBucket: "ajuda-jp.firebasestorage.app",
          messagingSenderId: "40121072206",
          appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const listaSalas = document.getElementById('salas-lista');
        const botaoCriarSala = document.getElementById('btn-criar-sala');

        // Criar nova sala
        botaoCriarSala.addEventListener('click', async () => {
            const nomeSala = prompt("Digite o nome da nova sala de bate-papo:");
            if (nomeSala && nomeSala.trim() !== "") {
                try {
                    await addDoc(collection(db, "salas"), {
                        nome: nomeSala.trim(),
                        criadoEm: new Date().getTime()
                    });
                } catch (e) {
                    console.error("Erro ao criar sala: ", e);
                    alert("Erro ao criar sala.");
                }
            }
        });

        // Listar salas em tempo real
        onSnapshot(collection(db, "salas"), (snapshot) => {
            listaSalas.innerHTML = "";
            if (snapshot.empty) {
                listaSalas.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Nenhuma sala criada ainda. Seja o primeiro!</div>';
                return;
            }

            const salasArray = [];
            snapshot.forEach((doc) => {
                salasArray.push({ id: doc.id, ...doc.data() });
            });
            salasArray.sort((a, b) => b.criadoEm - a.criadoEm); // Mais recentes primeiro

            salasArray.forEach((sala) => {
                const card = document.createElement('div');
                card.classList.add('sala-card');
                card.innerHTML = `
                    <div class="sala-info">
                        <h3># ${sala.nome}</h3>
                        <span>Toque para entrar na conversa</span>
                    </div>
                    <div class="sala-arrow">➔</div>
                `;
                
                // Ao clicar, redireciona para a página específica da sala passando o ID na URL
                card.addEventListener('click', () => {
                    window.location.href = `sala.html?id=${sala.id}&nome=${encodeURIComponent(sala.nome)}`;
                });

                listaSalas.appendChild(card);
            });
        });
    </script>
</body>
</html>

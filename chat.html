<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat da Comunidade</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; padding-bottom: 80px; }
        h1 { font-size: 18px; color: #0d47a1; text-align: center; margin-bottom: 10px; }
        
        .chat-container { display: flex; flex-direction: column; gap: 10px; padding: 10px; background: white; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); min-height: 300px; max-height: 400px; overflow-y: auto; margin-bottom: 80px; }
        
        .chat-input-area { display: flex; gap: 10px; position: fixed; bottom: 65px; left: 0; width: 100%; padding: 12px; background: white; box-shadow: 0 -2px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        
        input[type="text"] { flex-grow: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; outline: none; }
        button { background-color: #06C755; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        /* Modal e Botão de Criar */
        .modal { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 400px; text-align: center; }
        
        .btn-criar { background-color: #0d47a1; margin-bottom: 15px; width: auto; font-size: 13px; }
        
        /* Barra de Navegação */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #ddd; }
        .nav-link { text-decoration: none; color: #333; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Modal de Regras -->
    <div id="modalRegras" class="modal">
        <div class="modal-content">
            <h3>Regras da Comunidade</h3>
            <p style="font-size: 14px; color: #666;">1. Respeite todos os membros.<br>2. Não divulgue links proibidos.<br>3. Mantenha o foco em ajudar.</p>
            <button onclick="document.getElementById('modalRegras').style.display='none'">Eu Aceito</button>
        </div>
    </div>

    <h1>Chat da Comunidade 💬</h1>
    
    <div style="text-align: center;">
        <button id="btn-criar-sala" class="btn-criar">+ Criar Nova Sala</button>
    </div>

    <div id="mensagens-lista" class="chat-container">
        <div class="mensagem-balao" style="background:#e9ecef; align-self:center; font-size: 12px;">Bem-vindo!</div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="mensagem-input" placeholder="Digite sua mensagem...">
        <button id="enviar-btn">Enviar</button>
    </div>

    <nav class="bottom-nav">
        <a href="javascript:history.back()" class="nav-link">⬅️ Voltar</a>
        <a href="index.html" class="nav-link">🏠 Home</a>
    </nav>

    <script type="module" src="chat.js"></script>
</body>
</html>

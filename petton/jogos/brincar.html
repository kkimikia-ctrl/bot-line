<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Brincar com Petton 🎮</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

}

body {

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #eef9ff 0%,

            #f7fff3 50%,

            #fff8e8 100%

        );

    color: #333;

    overflow-x: hidden;

}

/* =========================================================

   APP

========================================================= */

.app {

    width: 100%;

    max-width: 520px;

    margin: 0 auto;

    padding-bottom: 35px;

}

/* =========================================================

   TOPO

========================================================= */

.topo {

    position: sticky;

    top: 0;

    z-index: 100;

    display: grid;

    grid-template-columns: 46px 1fr 46px;

    align-items: center;

    min-height: 58px;

    padding: 6px 10px;

    background: rgba(255,255,255,.96);

    border-bottom: 1px solid rgba(0,0,0,.07);

    backdrop-filter: blur(10px);

}

.btn-voltar {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #f3f6f2;

    font-size: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

}

.btn-voltar:active {

    transform: scale(.94);

}

.topo h1 {

    margin: 0;

    text-align: center;

    font-size: 20px;

    white-space: nowrap;

}

/* =========================================================

   CABEÇALHO

========================================================= */

.intro {

    margin: 14px 12px 8px;

    padding: 17px 15px;

    border-radius: 22px;

    background: white;

    text-align: center;

    box-shadow:

        0 4px 18px rgba(0,0,0,.07);

}

.intro-icone {

    font-size: 42px;

    line-height: 1;

}

.intro h2 {

    margin: 8px 0 4px;

    font-size: 19px;

}

.intro p {

    margin: 0;

    color: #777;

    font-size: 13px;

    line-height: 1.45;

}

/* =========================================================

   JOGOS

========================================================= */

.jogos-grid {

    display: grid;

    grid-template-columns:

        repeat(2, minmax(0, 1fr));

    gap: 10px;

    padding: 8px 12px;

}

.jogo {

    position: relative;

    min-height: 128px;

    border: none;

    border-radius: 20px;

    padding: 13px 8px 11px;

    background: white;

    box-shadow:

        0 3px 14px rgba(0,0,0,.07);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    cursor: pointer;

    overflow: hidden;

}

.jogo:active {

    transform: scale(.97);

}

.jogo-icone {

    font-size: 42px;

    line-height: 1;

    margin-bottom: 9px;

}

.jogo-nome {

    font-size: 14px;

    font-weight: 700;

    line-height: 1.2;

}

.jogo-numero {

    margin-top: 5px;

    font-size: 11px;

    color: #999;

}

/* =========================================================

   JOGO LIBERADO

========================================================= */

.jogo-liberado {

    border: 2px solid #8fd17f;

    background:

        linear-gradient(

            145deg,

            #ffffff,

            #f1ffed

        );

}

.jogo-liberado::before {

    content: "JOGAR";

    position: absolute;

    top: 8px;

    right: -25px;

    width: 90px;

    padding: 3px 0;

    transform: rotate(38deg);

    background: #70bd63;

    color: white;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: .5px;

}

/* =========================================================

   EM BREVE

========================================================= */

.jogo-bloqueado {

    opacity: .76;

}

.em-breve {

    position: absolute;

    top: 8px;

    right: 8px;

    padding: 3px 6px;

    border-radius: 8px;

    background: #f0f0f0;

    color: #888;

    font-size: 9px;

    font-weight: 700;

}

/* =========================================================

   MENSAGEM

========================================================= */

#mensagem {

    position: fixed;

    left: 50%;

    bottom: 24px;

    transform:

        translateX(-50%)

        translateY(20px);

    z-index: 1000;

    max-width: calc(100% - 30px);

    padding: 11px 18px;

    border-radius: 22px;

    background: rgba(0,0,0,.82);

    color: white;

    text-align: center;

    font-size: 13px;

    opacity: 0;

    pointer-events: none;

    transition:

        opacity .2s,

        transform .2s;

}

#mensagem.mostrar {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0);

}

/* =========================================================

   CELULARES PEQUENOS

========================================================= */

@media(max-width: 360px) {

    .jogos-grid {

        gap: 8px;

        padding-left: 9px;

        padding-right: 9px;

    }

    .jogo {

        min-height: 118px;

    }

    .jogo-icone {

        font-size: 37px;

    }

    .jogo-nome {

        font-size: 13px;

    }

}

</style>

</head>

<body>

<div class="app">

    <!-- =====================================================

         TOPO

    ====================================================== -->

    <header class="topo">

        <button

            type="button"

            class="btn-voltar"

            onclick="voltarPetton()"

            aria-label="Voltar"

        >

            ←

        </button>

        <h1>🎮 Brincar</h1>

        <div></div>

    </header>

    <!-- =====================================================

         INTRO

    ====================================================== -->

    <section class="intro">

        <div class="intro-icone">

            🐾🎮

        </div>

        <h2>Jogos do Petton</h2>

        <p>

            Escolha um jogo e divirta-se

            com seu Petton!

        </p>

    </section>

    <!-- =====================================================

         10 JOGOS

    ====================================================== -->

    <main class="jogos-grid">

        <!-- JOGO 1 -->

        <button

            type="button"

            class="jogo jogo-liberado"

            onclick="abrirJogo('pular-obstaculos.html')"

        >

            <div class="jogo-icone">

                🐾🪵

            </div>

            <div class="jogo-nome">

                Pular Obstáculos

            </div>

            <div class="jogo-numero">

                Jogo 1

            </div>

        </button>

        <!-- JOGO 2 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Desviar das Bolinhas')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                🔵💨

            </div>

            <div class="jogo-nome">

                Desviar das Bolinhas

            </div>

            <div class="jogo-numero">

                Jogo 2

            </div>

        </button>

        <!-- JOGO 3 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Pegar Comida')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                🍖🐾

            </div>

            <div class="jogo-nome">

                Pegar Comida

            </div>

            <div class="jogo-numero">

                Jogo 3

            </div>

        </button>

        <!-- JOGO 4 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Pegar Borboletas')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                🦋🐾

            </div>

            <div class="jogo-nome">

                Pegar Borboletas

            </div>

            <div class="jogo-numero">

                Jogo 4

            </div>

        </button>

        <!-- JOGO 5 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Estourar Balões')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                🎈💥

            </div>

            <div class="jogo-nome">

                Estourar Balões

            </div>

            <div class="jogo-numero">

                Jogo 5

            </div>

        </button>

        <!-- JOGO 6 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Pesca')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                🎣🐟

            </div>

            <div class="jogo-nome">

                Pesca

            </div>

            <div class="jogo-numero">

                Jogo 6

            </div>

        </button>

        <!-- JOGO 7 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Jogo da Memória')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                🧠🃏

            </div>

            <div class="jogo-nome">

                Jogo da Memória

            </div>

            <div class="jogo-numero">

                Jogo 7

            </div>

        </button>

        <!-- JOGO 8 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Pegar Estrelas')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                ⭐🐾

            </div>

            <div class="jogo-nome">

                Pegar Estrelas

            </div>

            <div class="jogo-numero">

                Jogo 8

            </div>

        </button>

        <!-- JOGO 9 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Corrida')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                🏁🐾

            </div>

            <div class="jogo-nome">

                Corrida

            </div>

            <div class="jogo-numero">

                Jogo 9

            </div>

        </button>

        <!-- JOGO 10 -->

        <button

            type="button"

            class="jogo jogo-bloqueado"

            onclick="emBreve('Acertar o Alvo')"

        >

            <span class="em-breve">

                EM BREVE

            </span>

            <div class="jogo-icone">

                🎯🐾

            </div>

            <div class="jogo-nome">

                Acertar o Alvo

            </div>

            <div class="jogo-numero">

                Jogo 10

            </div>

        </button>

    </main>

</div>

<div id="mensagem"></div>

<script>

/* =========================================================

   NAVEGAÇÃO

========================================================= */

function abrirJogo(arquivo) {

    try {

        const destino =

            new URL(

                arquivo,

                document.baseURI

            ).href;

        window.location.assign(

            destino

        );

    } catch (erro) {

        console.error(

            "Erro ao abrir jogo:",

            erro

        );

    }

}

/* =========================================================

   VOLTAR AO PETTON

   brincar.html está dentro de:

   petton/jogos/

   portanto ../index.html volta para:

   petton/index.html

========================================================= */

function voltarPetton() {

    try {

        window.location.assign(

            "../index.html"

        );

    } catch (erro) {

        console.error(

            "Erro ao voltar:",

            erro

        );

    }

}

/* =========================================================

   JOGOS AINDA NÃO LIBERADOS

========================================================= */

let timerMensagem = null;

function emBreve(nome) {

    const mensagem =

        document.getElementById(

            "mensagem"

        );

    if (!mensagem) {

        return;

    }

    mensagem.textContent =

        "🎮 " +

        nome +

        " — em breve!";

    mensagem.classList.add(

        "mostrar"

    );

    if (timerMensagem) {

        clearTimeout(

            timerMensagem

        );

    }

    timerMensagem =

        setTimeout(

            function() {

                mensagem.classList.remove(

                    "mostrar"

                );

            },

            1800

        );

}

</script>

</body>

</html>

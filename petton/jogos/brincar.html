<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Brincar com Petton 🎮</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

}

body {

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #eef9ff 0%,

            #f7fff3 50%,

            #fff8e8 100%

        );

    color: #333;

    overflow-x: hidden;

}

/* =========================================================

   APP

========================================================= */

.app {

    width: 100%;

    max-width: 520px;

    margin: 0 auto;

    padding-bottom: 35px;

}

/* =========================================================

   TOPO

========================================================= */

.topo {

    position: sticky;

    top: 0;

    z-index: 100;

    display: grid;

    grid-template-columns: 46px 1fr 46px;

    align-items: center;

    min-height: 58px;

    padding: 6px 10px;

    background: rgba(255,255,255,.96);

    border-bottom:

        1px solid rgba(0,0,0,.07);

    backdrop-filter: blur(10px);

}

.btn-voltar {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #f3f6f2;

    font-size: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

}

.btn-voltar:active {

    transform: scale(.94);

}

.topo h1 {

    margin: 0;

    text-align: center;

    font-size: 20px;

    white-space: nowrap;

}

/* =========================================================

   INTRO

========================================================= */

.intro {

    margin: 14px 12px 8px;

    padding: 17px 15px;

    border-radius: 22px;

    background: white;

    text-align: center;

    box-shadow:

        0 4px 18px rgba(0,0,0,.07);

}

.intro-icone {

    font-size: 42px;

    line-height: 1;

}

.intro h2 {

    margin: 8px 0 4px;

    font-size: 19px;

}

.intro p {

    margin: 0;

    color: #777;

    font-size: 13px;

    line-height: 1.45;

}

/* =========================================================

   GRID

========================================================= */

.jogos-grid {

    display: grid;

    grid-template-columns:

        repeat(2, minmax(0,1fr));

    gap: 10px;

    padding: 8px 12px;

}

/* =========================================================

   JOGO

========================================================= */

.jogo {

    position: relative;

    min-height: 128px;

    border:

        2px solid #8fd17f;

    border-radius: 20px;

    padding:

        13px 8px 11px;

    background:

        linear-gradient(

            145deg,

            #ffffff,

            #f1ffed

        );

    box-shadow:

        0 3px 14px rgba(0,0,0,.07);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    cursor: pointer;

    overflow: hidden;

    transition:

        transform .12s,

        box-shadow .12s;

}

.jogo:active {

    transform: scale(.96);

    box-shadow:

        0 2px 8px rgba(0,0,0,.08);

}

.jogo::before {

    content: "JOGAR";

    position: absolute;

    top: 8px;

    right: -25px;

    width: 90px;

    padding: 3px 0;

    transform: rotate(38deg);

    background: #70bd63;

    color: white;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: .5px;

}

.jogo-icone {

    font-size: 42px;

    line-height: 1;

    margin-bottom: 9px;

}

.jogo-nome {

    font-size: 14px;

    font-weight: 700;

    line-height: 1.2;

}

.jogo-numero {

    margin-top: 5px;

    font-size: 11px;

    color: #999;

}

/* =========================================================

   CELULARES PEQUENOS

========================================================= */

@media(max-width:360px) {

    .jogos-grid {

        gap: 8px;

        padding-left: 9px;

        padding-right: 9px;

    }

    .jogo {

        min-height: 118px;

    }

    .jogo-icone {

        font-size: 37px;

    }

    .jogo-nome {

        font-size: 13px;

    }

}

</style>

</head>

<body>

<div class="app">

<!-- =====================================================

     TOPO

====================================================== -->

<header class="topo">

    <button

        type="button"

        class="btn-voltar"

        onclick="voltarPetton()"

</main>

</div>

<script>

/* =========================================================

   ABRIR JOGO

   Não existe mais lista de jogos bloqueados.

   Cada botão abre diretamente seu arquivo.

   Portanto, quando criarmos um novo jogo,

   NÃO será necessário alterar brincar.html.

========================================================= */

function abrirJogo(arquivo) {

    try {

        const destino =

            new URL(

                arquivo,

                document.baseURI

            ).href;

        window.location.assign(

            destino

        );

    } catch (erro) {

        console.error(

            "Erro ao abrir jogo:",

            erro

        );

    }

}

/* =========================================================

   VOLTAR AO PETTON

========================================================= */

function voltarPetton() {

    try {

        const destino =

            new URL(

                "../index.html",

                document.baseURI

            ).href;

        window.location.assign(

            destino

        );

    } catch (erro) {

        console.error(

            "Erro ao voltar ao Petton:",

            erro

        );

    }

}

</script>

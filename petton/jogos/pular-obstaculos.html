<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Pular Obstáculos 🪵</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overscroll-behavior: none;

}

body {

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #dff5ff 0%,

            #f4fbff 45%,

            #e8f7d9 100%

        );

    color: #333;

    overflow: hidden;

    touch-action: manipulation;

}

/* =========================================================

   APP

========================================================= */

.app {

    width: 100%;

    max-width: 520px;

    height: 100%;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    position: relative;

}

/* =========================================================

   TOPO

========================================================= */

.topo {

    height: 58px;

    flex: 0 0 58px;

    display: grid;

    grid-template-columns: 46px 1fr 46px;

    align-items: center;

    padding: 6px 9px;

    background:

        rgba(255,255,255,.94);

    border-bottom:

        1px solid rgba(0,0,0,.07);

    z-index: 100;

}

.btn-voltar,

.btn-som {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #f2f6f0;

    font-size: 21px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

}

.btn-voltar:active,

.btn-som:active {

    transform: scale(.94);

}

.titulo {

    text-align: center;

}

.titulo strong {

    display: block;

    font-size: 16px;

    line-height: 1.1;

}

.titulo span {

    display: block;

    margin-top: 2px;

    color: #888;

    font-size: 10px;

}

/* =========================================================

   JOGO

========================================================= */

#jogo {

    position: relative;

    flex: 1;

    width: 100%;

    overflow: hidden;

    user-select: none;

    -webkit-user-select: none;

    touch-action: none;

    background:

        linear-gradient(

            180deg,

            #cceeff 0%,

            #eaf8ff 53%,

            #dff2c7 53%,

            #b9dd91 100%

        );

}

/* =========================================================

   PLACAR

========================================================= */

.placar {

    position: absolute;

    top: 12px;

    left: 10px;

    right: 10px;

    z-index: 20;

    display: grid;

    grid-template-columns:

        repeat(3, 1fr);

    gap: 7px;

    pointer-events: none;

}

.placar-item {

    padding: 7px 5px;

    background:

        rgba(255,255,255,.91);

    border-radius: 13px;

    text-align: center;

    box-shadow:

        0 2px 10px

        rgba(0,0,0,.07);

}

.placar-label {

    display: block;

    font-size: 9px;

    color: #888;

}

.placar-valor {

    display: block;

    margin-top: 1px;

    font-size: 17px;

    font-weight: 800;

}

/* =========================================================

   CENÁRIO

========================================================= */

.sol {

    position: absolute;

    width: 62px;

    height: 62px;

    top: 82px;

    right: 25px;

    border-radius: 50%;

    background: #ffe58a;

    box-shadow:

        0 0 30px

        rgba(255,220,80,.45);

    opacity: .9;

}

.nuvem {

    position: absolute;

    font-size: 48px;

    opacity: .75;

    pointer-events: none;

}

.nuvem1 {

    top: 125px;

    left: 8%;

    animation:

        nuvemMover

        18s linear infinite;

}

.nuvem2 {

    top: 180px;

    left: 65%;

    font-size: 35px;

    animation:

        nuvemMover2

        23s linear infinite;

}

@keyframes nuvemMover {

    from {

        transform:

            translateX(-90px);

    }

    to {

        transform:

            translateX(520px);

    }

}

@keyframes nuvemMover2 {

    from {

        transform:

            translateX(120px);

    }

    to {

        transform:

            translateX(-520px);

    }

}

/* =========================================================

   CHÃO

========================================================= */

#chao {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    height: 92px;

    background:

        linear-gradient(

            180deg,

            #80c55d 0px,

            #6bb44d 12px,

            #b98a57 13px,

            #9d7248 100%

        );

    border-top:

        3px solid #5ca940;

    z-index: 3;

}

#chao::after {

    content: "";

    position: absolute;

    inset: 18px 0 0;

    opacity: .22;

    background-image:

        radial-gradient(

            circle,

            #5d3e28 1px,

            transparent 1px

        );

    background-size:

        18px 18px;

}

/* =========================================================

   PETTON

========================================================= */

#petton {

    position: absolute;

    left: 50%;

    width: 92px;

    height: 92px;

    margin-left: -46px;

    z-index: 10;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    transform-origin:

        center bottom;

}

#petton img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: contain;

    opacity: 0;

    transition:

        opacity .15s;

}

#petton img.pronto {

    opacity: 1;

}

#petton.correndo img {

    animation:

        correrPetton

        .25s infinite

        alternate ease-in-out;

}

@keyframes correrPetton {

    from {

        transform:

            translateY(0)

            rotate(-1deg);

    }

    to {

        transform:

            translateY(-3px)

            rotate(1deg);

    }

}

/* =========================================================

   SOMBRA

========================================================= */

#sombraPetton {

    position: absolute;

    left: 50%;

    width: 68px;

    height: 12px;

    margin-left: -34px;

    border-radius: 50%;

    background:

        rgba(0,0,0,.16);

    z-index: 4;

    transform-origin: center;

}

/* =========================================================

   OBSTÁCULO

========================================================= */

.obstaculo {

    position: absolute;

    width: 52px;

    height: 64px;

    z-index: 8;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    font-size: 55px;

    line-height: 1;

    transform-origin:

        center bottom;

    will-change: transform;

}

/* =========================================================

   AVISO

========================================================= */

#avisoSequencia {

    position: absolute;

    top: 78px;

    left: 50%;

    transform:

        translateX(-50%)

        translateY(-8px);

    z-index: 25;

    padding: 7px 14px;

    border-radius: 20px;

    background:

        rgba(255,255,255,.92);

    font-size: 13px;

    font-weight: 800;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    transition:

        opacity .18s,

        transform .18s;

}

#avisoSequencia.mostrar {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0);

}

/* =========================================================

   INSTRUÇÃO

========================================================= */

#instrucao {

    position: absolute;

    left: 50%;

    bottom: 108px;

    transform:

        translateX(-50%);

    z-index: 15;

    padding:

        7px 14px;

    border-radius: 20px;

    background:

        rgba(255,255,255,.88);

    font-size: 12px;

    font-weight: 700;

    white-space: nowrap;

    pointer-events: none;

    opacity: 0;

    transition:

        opacity .3s;

}

#instrucao.mostrar {

    opacity: 1;

}

/* =========================================================

   INÍCIO

========================================================= */

#inicio {

    position: absolute;

    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:

        rgba(255,255,255,.18);

}

.inicio-box {

    width: 100%;

    max-width: 340px;

    padding: 23px 18px;

    border-radius: 24px;

    background:

        rgba(255,255,255,.96);

    text-align: center;

    box-shadow:

        0 8px 30px

        rgba(0,0,0,.13);

}

.inicio-icon {

    font-size: 52px;

}

.inicio-box h2 {

    margin:

        8px 0 6px;

    font-size: 22px;

}

.inicio-box p {

    margin:

        5px 0;

    color: #666;

    font-size: 14px;

    line-height: 1.45;

}

.dica-sequencia {

    margin-top: 10px !important;

    padding: 9px;

    border-radius: 13px;

    background: #f3f8ef;

    color: #53734b !important;

    font-size: 12px !important;

}

.btn-jogar {

    width: 100%;

    height: 50px;

    margin-top: 15px;

    border: none;

    border-radius: 15px;

    background: #6fbd61;

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:

        0 4px 12px

        rgba(75,150,60,.25);

}

.btn-jogar:active {

    transform: scale(.97);

}

/* =========================================================

   GAME OVER

========================================================= */

#gameOver {

    position: absolute;

    inset: 0;

    z-index: 60;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:

        rgba(0,0,0,.28);

}

.gameover-box {

    width: 100%;

    max-width: 330px;

    padding: 22px 18px;

    border-radius: 24px;

    background: white;

    text-align: center;

    box-shadow:

        0 10px 35px

        rgba(0,0,0,.2);

}

.gameover-icon {

    font-size: 50px;

}

.gameover-box h2 {

    margin:

        7px 0 4px;

    font-size: 23px;

}

.resultado {

    margin:

        12px 0;

    padding: 11px;

    border-radius: 15px;

    background: #f4f8f2;

    font-size: 15px;

}

.resultado strong {

    font-size: 23px;

}

.botoes-gameover {

    display: grid;

    grid-template-columns:

        1fr 1fr;

    gap: 8px;

    margin-top: 12px;

}

.btn-secundario,

.btn-reiniciar {

    height: 46px;

    border: none;

    border-radius: 13px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

}

.btn-secundario {

    background: #eee;

    color: #444;

}

.btn-reiniciar {

    background: #6fbd61;

    color: white;

}

/* =========================================================

   CELULAR PEQUENO

========================================================= */

@media(max-width: 370px) {

    #petton {

        width: 82px;

        height: 82px;

        margin-left: -41px;

    }

    #sombraPetton {

        width: 62px;

        margin-left: -31px;

    }

    .obstaculo {

        width: 47px;

        font-size: 50px;

    }

}

</style>

</head>

<body>

<div class="app">

<header class="topo">

    <button

        type="button"

        class="btn-voltar"

        onclick="voltarMenu()"

        aria-label="Voltar"

    >

        ←

    </button>

    <div class="titulo">

        <strong>

            🪵 Pular Obstáculos

        </strong>

        <span>

            Jogo 1

        </span>

    </div>

    <button

        type="button"

        class="btn-som"

        id="btnSom"

        onclick="alternarSom(event)"

        aria-label="Som"

    >

        🔊

    </button>

</header>

<main id="jogo">

    <div class="sol"></div>

    <div class="nuvem nuvem1">

        ☁️

    </div>

    <div class="nuvem nuvem2">

        ☁️

    </div>

    <div class="placar">

        <div class="placar-item">

            <span class="placar-label">

                ⭐ PONTOS

            </span>

            <span

                class="placar-valor"

                id="pontos"

            >

                0

            </span>

        </div>

        <div class="placar-item">

            <span class="placar-label">

                🏆 RECORDE

            </span>

            <span

                class="placar-valor"

                id="recorde"

            >

                0

            </span>

        </div>

        <div class="placar-item">

            <span class="placar-label">

                ⚡ NÍVEL

            </span>

            <span

                class="placar-valor"

                id="nivelVelocidade"

            >

                1

            </span>

        </div>

    </div>

    <div id="avisoSequencia"></div>

    <div id="sombraPetton"></div>

    <div id="petton">

        <img

            id="imagemPetton"

            alt="Petton"

        >

    </div>

    <div id="chao"></div>

    <div id="instrucao">

        👆 Toque para pular!

    </div>

    <div id="inicio">

        <div class="inicio-box">

            <div class="inicio-icon">

                🐾🪵

            </div>

            <h2>

                Pular Obstáculos

            </h2>

            <p>

                O Petton fica no centro.

            </p>

            <p>

                Cada sequência vem

                de um único lado.

            </p>

            <p class="dica-sequencia">

                🪵 Podem aparecer 1, 2

                ou 3 obstáculos seguidos.

            </p>

            <p>

                👆 Toque na tela para pular.

            </p>

            <button

                type="button"

                class="btn-jogar"

                onclick="iniciarJogo(event)"

            >

                ▶️ Começar

            </button>

        </div>

    </div>

    <div id="gameOver">

        <div class="gameover-box">

            <div class="gameover-icon">

                💥

            </div>

            <h2>

                Game Over

            </h2>

            <div class="resultado">

                Pontuação<br>

                <strong>

                    ⭐ <span id="pontosFinal">0</span>

                </strong>

            </div>

            <div

                id="novoRecorde"

                style="

                    display:none;

                    font-weight:800;

                    color:#d79500;

                    margin-bottom:5px;

                "

            >

                🏆 Novo recorde!

            </div>

            <div class="botoes-gameover">

                <button

                    type="button"

                    class="btn-secundario"

                    onclick="voltarMenu()"

                >

                    ← Jogos

                </button>

                <button

                    type="button"

                    class="btn-reiniciar"

                    onclick="reiniciarJogo(event)"

                >

                    🔄 De novo

                </button>

            </div>

        </div>

    </div>

</main>

</div>

<script src="../petton.js"></script>

<script>

/* =========================================================

   CONFIGURAÇÕES

========================================================= */

const CHAVE_RECORDE =

    "petton_jogo_pular_obstaculos_recorde_v1";

const ALTURA_CHAO = 92;

const GRAVIDADE = 2100;

const FORCA_PULO = 760;

const VELOCIDADE_INICIAL = 220;

const VELOCIDADE_MAXIMA = 390;

/*

   Distância mínima entre obstáculos

   de uma mesma sequência.

   Grande o bastante para:

   pular -> cair -> pular novamente.

*/

const ESPACO_BASE_SEQUENCIA = 410;

/*

   Depois que TODOS os obstáculos

   saírem da tela, esperamos antes

   de criar o próximo grupo.

*/

const PAUSA_MINIMA_GRUPOS = 650;

const PAUSA_MAXIMA_GRUPOS = 1050;

/* =========================================================

   ELEMENTOS

========================================================= */

const jogo =

    document.getElementById("jogo");

const petton =

    document.getElementById("petton");

const imagemPetton =

    document.getElementById(

        "imagemPetton"

    );

const sombraPetton =

    document.getElementById(

        "sombraPetton"

    );

const pontosElemento =

    document.getElementById(

        "pontos"

    );

const recordeElemento =

    document.getElementById(

        "recorde"

    );

const velocidadeElemento =

    document.getElementById(

        "nivelVelocidade"

    );

const inicio =

    document.getElementById(

        "inicio"

    );

const gameOver =

    document.getElementById(

        "gameOver"

    );

const pontosFinal =

    document.getElementById(

        "pontosFinal"

    );

const novoRecorde =

    document.getElementById(

        "novoRecorde"

    );

const instrucao =

    document.getElementById(

        "instrucao"

    );

const avisoSequencia =

    document.getElementById(

        "avisoSequencia"

    );

const btnSom =

    document.getElementById(

        "btnSom"

    );

/* =========================================================

   ESTADO

========================================================= */

let jogando = false;

let terminou = false;

let pontos = 0;

let recorde = 0;

let velocidade =

    VELOCIDADE_INICIAL;

let nivelVelocidade = 1;

let posicaoY = 0;

let velocidadeY = 0;

let noChao = true;

let ultimoTempo = 0;

let obstaculos = [];

let animationId = null;

let idSequencia = 0;

/*

   IMPORTANTE:

   sequenciaAtiva impede outro

   grupo de nascer enquanto ainda

   existe um obstáculo do grupo atual.

*/

let sequenciaAtiva = false;

/*

   Só começa a contar depois que

   a sequência anterior terminou.

*/

let pausaAteProxima = 0;

/* =========================================================

   SOM

========================================================= */

let audioContext = null;

let somLigado = true;

function prepararAudio() {

    if (!somLigado) {

        return;

    }

    try {

        if (!audioContext) {

            const AudioCtx =

                window.AudioContext ||

                window.webkitAudioContext;

            if (AudioCtx) {

                audioContext =

                    new AudioCtx();

            }

        }

        if (

            audioContext &&

            audioContext.state ===

                "suspended"

        ) {

            audioContext.resume();

        }

    } catch (erro) {

        console.warn(

            "Áudio indisponível.",

            erro

        );

    }

}

function tocarTom(

    frequencia,

    duracao,

    tipo = "sine",

    volume = .08,

    atraso = 0

) {

    if (

        !somLigado ||

        !audioContext

    ) {

        return;

    }

    try {

        const agora =

            audioContext.currentTime +

            atraso;

        const oscilador =

            audioContext.createOscillator();

        const ganho =

            audioContext.createGain();

        oscilador.type =

            tipo;

        oscilador.frequency

            .setValueAtTime(

                frequencia,

                agora

            );

        ganho.gain

            .setValueAtTime(

                .0001,

                agora

            );

        ganho.gain

            .exponentialRampToValueAtTime(

                volume,

                agora + .015

            );

        ganho.gain

            .exponentialRampToValueAtTime(

                .0001,

                agora + duracao

            );

        oscilador.connect(

            ganho

        );

        ganho.connect(

            audioContext.destination

        );

        oscilador.start(

            agora

        );

        oscilador.stop(

            agora +

            duracao +

            .03

        );

    } catch (erro) {

        console.warn(erro);

    }

}

function somInicio() {

    tocarTom(

        440,

        .10,

        "sine",

        .055

    );

    tocarTom(

        660,

        .14,

        "sine",

        .06,

        .09

    );

}

function somPulo() {

    if (

        !somLigado ||

        !audioContext

    ) {

        return;

    }

    try {

        const agora =

            audioContext.currentTime;

        const oscilador =

            audioContext.createOscillator();

        const ganho =

            audioContext.createGain();

        oscilador.type =

            "sine";

        oscilador.frequency

            .setValueAtTime(

                300,

                agora

            );

        oscilador.frequency

            .exponentialRampToValueAtTime(

                620,

                agora + .11

            );

        ganho.gain

            .setValueAtTime(

                .0001,

                agora

            );

        ganho.gain

            .exponentialRampToValueAtTime(

                .075,

                agora + .015

            );

        ganho.gain

            .exponentialRampToValueAtTime(

                .0001,

                agora + .14

            );

        oscilador.connect(

            ganho

        );

        ganho.connect(

            audioContext.destination

        );

        oscilador.start(

            agora

        );

        oscilador.stop(

            agora + .16

        );

    } catch (erro) {

        console.warn(erro);

    }

}

function somPonto() {

    tocarTom(

        760,

        .07,

        "sine",

        .045

    );

}

function somSequencia() {

    tocarTom(

        520,

        .07,

        "sine",

        .035

    );

    tocarTom(

        700,

        .08,

        "sine",

        .04,

        .07

    );

}

function somNivel() {

    tocarTom(

        520,

        .08,

        "sine",

        .045

    );

    tocarTom(

        680,

        .08,

        "sine",

        .05,

        .08

    );

    tocarTom(

        860,

        .12,

        "sine",

        .055,

        .16

    );

}

function somColisao() {

    if (

        !somLigado ||

        !audioContext

    ) {

        return;

    }

    try {

        const agora =

            audioContext.currentTime;

        const oscilador =

            audioContext.createOscillator();

        const ganho =

            audioContext.createGain();

        oscilador.type =

            "sawtooth";

        oscilador.frequency

            .setValueAtTime(

                150,

                agora

            );

        oscilador.frequency

            .exponentialRampToValueAtTime(

                55,

                agora + .30

            );

        ganho.gain

            .setValueAtTime(

                .11,

                agora

            );

        ganho.gain

            .exponentialRampToValueAtTime(

                .0001,

                agora + .32

            );

        oscilador.connect(

            ganho

        );

        ganho.connect(

            audioContext.destination

        );

        oscilador.start(

            agora

        );

        oscilador.stop(

            agora + .34

        );

    } catch (erro) {

        console.warn(erro);

    }

}

function alternarSom(evento) {

    if (evento) {

        evento.preventDefault();

        evento.stopPropagation();

    }

    somLigado =

        !somLigado;

    btnSom.textContent =

        somLigado

            ? "🔊"

            : "🔇";

    if (somLigado) {

        prepararAudio();

        somInicio();

    }

}

/* =========================================================

   RECORDE

========================================================= */

function carregarRecorde() {

    try {

        const salvo =

            Number(

                localStorage.getItem(

                    CHAVE_RECORDE

                )

            );

        recorde =

            isFinite(salvo)

                ? Math.max(

                    0,

                    salvo

                )

                : 0;

    } catch (erro) {

        recorde = 0;

    }

    recordeElemento.textContent =

        recorde;

}

function salvarRecorde() {

    try {

        localStorage.setItem(

            CHAVE_RECORDE,

            String(recorde)

        );

    } catch (erro) {

        console.warn(

            "Não foi possível salvar o recorde.",

            erro

        );

    }

}

/* =========================================================

   PETTON

========================================================= */

function obterDadosPetton() {

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.carregarPetton ===

                "function"

        ) {

            return Petton.carregarPetton();

        }

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.carregar ===

                "function"

        ) {

            return Petton.carregar();

        }

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

    }

    return null;

}

/* =========================================================

   FASE

========================================================= */

function obterFasePetton(dados) {

    if (!dados) {

        return "bebe";

    }

    if (!dados.dateNascimento) {

        return "ovo";

    }

    let idadeDias =

        Number(

            dados.idadeDias ??

            dados.diasDeVida

        );

    if (

        !isFinite(idadeDias) &&

        dados.dateNascimento

    ) {

        const nascimento =

            new Date(

                dados.dateNascimento

            );

        if (

            !isNaN(

                nascimento.getTime()

            )

        ) {

            idadeDias =

                Math.floor(

                    (

                        Date.now() -

                        nascimento.getTime()

                    ) /

                    86400000

                );

        }

    }

    if (isFinite(idadeDias)) {

        if (idadeDias < 8) {

            return "bebe";

        }

        if (idadeDias < 31) {

            return "filhote";

        }

        if (idadeDias < 91) {

            return "jovem";

        }

        return "adulto";

    }

    const fase =

        String(

            dados.faseAtual ||

            dados.fase ||

            "bebe"

        ).toLowerCase();

    if (

        fase.includes("adult")

    ) {

        return "adulto";

    }

    if (

        fase.includes("jovem") ||

        fase.includes("young")

    ) {

        return "jovem";

    }

    if (

        fase.includes("filh")

    ) {

        return "filhote";

    }

    return "bebe";

}

/* =========================================================

   ESPÉCIE

========================================================= */

function obterEspeciePetton(dados) {

    if (!dados) {

        return "gato";

    }

    const identidade =

        dados.identidadeVisual &&

        typeof dados.identidadeVisual ===

            "object"

            ? dados.identidadeVisual

            : null;

    let especie =

        identidade?.especie ||

        dados.especie ||

        "gato";

    especie =

        String(

            especie

        ).toLowerCase();

    if (

        especie.includes("cach") ||

        especie.includes("dog")

    ) {

        return "cachorro";

    }

    if (

        especie.includes("coelh") ||

        especie.includes("rabbit")

    ) {

        return "coelho";

    }

    return "gato";

}

/* =========================================================

   IMAGEM INDIVIDUAL

========================================================= */

function obterImagemIndividual(

    dados,

    fase

) {

    if (

        !dados ||

        !dados.identidadeVisual ||

        typeof dados.identidadeVisual !==

            "object"

    ) {

        return null;

    }

    const imagens =

        dados.identidadeVisual.imagens;

    if (

        !imagens ||

        typeof imagens !== "object"

    ) {

        return null;

    }

    const imagem =

        imagens[fase];

    if (

        typeof imagem === "string" &&

        imagem.trim() !== ""

    ) {

        return imagem.trim();

    }

    return null;

}

/* =========================================================

   IMAGEM PETTON

========================================================= */

function carregarImagemPetton() {

    const dados =

        obterDadosPetton();

    const especie =

        obterEspeciePetton(

            dados

        );

    const fase =

        obterFasePetton(

            dados

        );

    const imagemIndividual =

        obterImagemIndividual(

            dados,

            fase

        );

    const imagensFallback = {

        gato:

            "../petton-original.png",

        cachorro:

            "../FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

        coelho:

            "../39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

    };

    let imagemFinal =

        imagemIndividual ||

        imagensFallback[especie];

    if (

        imagemIndividual &&

        !imagemIndividual.startsWith(

            "http://"

        ) &&

        !imagemIndividual.startsWith(

            "https://"

        ) &&

        !imagemIndividual.startsWith(

            "/"

        ) &&

        !imagemIndividual.startsWith(

            "../"

        )

    ) {

        imagemFinal =

            "../" +

            imagemIndividual;

    }

    imagemPetton.onload =

        function() {

            imagemPetton.classList.add(

                "pronto"

            );

        };

    imagemPetton.onerror =

        function() {

            const fallback =

                imagensFallback[especie];

            if (

                imagemPetton.getAttribute(

                    "src"

                ) !== fallback

            ) {

                imagemPetton.src =

                    fallback;

                return;

            }

            console.warn(

                "Imagem do Petton não encontrada."

            );

        };

    imagemPetton.src =

        imagemFinal;

}

/* =========================================================

   POSIÇÃO

========================================================= */

function atualizarPosicaoPetton() {

    petton.style.bottom =

        (

            ALTURA_CHAO +

            posicaoY -

            3

        ) + "px";

    sombraPetton.style.bottom =

        (

            ALTURA_CHAO -

            2

        ) + "px";

    const escalaSombra =

        Math.max(

            .55,

            1 -

            posicaoY / 260

        );

    const opacidade =

        Math.max(

            .06,

            .16 -

            posicaoY / 1300

        );

    sombraPetton.style.transform =

        "scaleX(" +

        escalaSombra +

        ")";

    sombraPetton.style.background =

        "rgba(0,0,0," +

        opacidade +

        ")";

}

/* =========================================================

   PULO

========================================================= */

function pular() {

    if (

        !jogando ||

        terminou ||

        !noChao

    ) {

        return;

    }

    prepararAudio();

    noChao = false;

    velocidadeY =

        FORCA_PULO;

    petton.classList.remove(

        "correndo"

    );

    somPulo();

}

/* =========================================================

   QUANTIDADE

========================================================= */

function escolherQuantidadeSequencia() {

    const r =

        Math.random();

    if (

        nivelVelocidade <= 1

    ) {

        return r < .78

            ? 1

            : 2;

    }

    if (

        nivelVelocidade === 2

    ) {

        if (r < .55) {

            return 1;

        }

        if (r < .92) {

            return 2;

        }

        return 3;

    }

    if (

        nivelVelocidade === 3

    ) {

        if (r < .42) {

            return 1;

        }

        if (r < .82) {

            return 2;

        }

        return 3;

    }

    if (r < .30) {

        return 1;

    }

    if (r < .68) {

        return 2;

    }

    return 3;

}

/* =========================================================

   LADO

========================================================= */

function escolherLado() {

    return Math.random() < .5

        ? "esquerda"

        : "direita";

}

/* =========================================================

   CRIAR OBSTÁCULO

========================================================= */

function criarObstaculo(

    lado,

    atrasoDistancia,

    sequencia

) {

    if (

        !jogando ||

        terminou

    ) {

        return;

    }

    const obstaculo =

        document.createElement(

            "div"

        );

    obstaculo.className =

        "obstaculo";

    const tipos = [

        "🪵",

        "🪵",

        "🪵",

        "🪨"

    ];

    obstaculo.textContent =

        tipos[

            Math.floor(

                Math.random() *

                tipos.length

            )

        ];

    obstaculo.style.bottom =

        (

            ALTURA_CHAO -

            1

        ) + "px";

    jogo.appendChild(

        obstaculo

    );

    const larguraJogo =

        jogo.clientWidth;

    const largura = 52;

    let x;

    let direcao;

    if (

        lado === "direita"

    ) {

        x =

            larguraJogo +

            30 +

            atrasoDistancia;

        direcao = -1;

    } else {

        x =

            -largura -

            30 -

            atrasoDistancia;

        direcao = 1;

    }

    const item = {

        elemento:

            obstaculo,

        x: x,

        largura:

            largura,

        direcao:

            direcao,

        lado:

            lado,

        contado:

            false,

        sequencia:

            sequencia

    };

    obstaculos.push(

        item

    );

    obstaculo.style.transform =

        "translateX(" +

        item.x +

        "px)";

}

/* =========================================================

   AVISO

========================================================= */

let timerAviso = null;

function mostrarAvisoSequencia(

    quantidade

) {

    if (

        quantidade < 2

    ) {

        return;

    }

    if (timerAviso) {

        clearTimeout(

            timerAviso

        );

    }

    avisoSequencia.textContent =

        quantidade === 2

            ? "🪵🪵 DUPLA!"

            : "🪵🪵🪵 TRIPLA!";

    avisoSequencia.classList.add(

        "mostrar"

    );

    somSequencia();

    timerAviso =

        setTimeout(

            function() {

                avisoSequencia

                    .classList

                    .remove(

                        "mostrar"

                    );

            },

            800

        );

}

/* =========================================================

   CRIAR SEQUÊNCIA

   REGRA NOVA:

   - Uma sequência por vez.

   - Todos os obstáculos do grupo

     vêm do MESMO lado.

   - Nunca existe esquerda e direita

     simultaneamente.

========================================================= */

function criarSequencia() {

    if (

        !jogando ||

        terminou ||

        sequenciaAtiva ||

        obstaculos.length > 0

    ) {

        return;

    }

    sequenciaAtiva = true;

    idSequencia++;

    const quantidade =

        escolherQuantidadeSequencia();

    const lado =

        escolherLado();

    /*

       O espaço também aumenta um

       pouco conforme a velocidade.

       Isso é importante porque,

       quanto mais rápido o obstáculo

       anda, mais distância ele precisa

       para manter o mesmo intervalo

       de tempo entre um e outro.

    */

    const compensacaoVelocidade =

        Math.max(

            0,

            velocidade -

            VELOCIDADE_INICIAL

        ) * .65;

    const distanciaBase =

        ESPACO_BASE_SEQUENCIA +

        compensacaoVelocidade +

        Math.random() * 45;

    for (

        let i = 0;

        i < quantidade;

        i++

    ) {

        criarObstaculo(

            lado,

            i *

                distanciaBase,

            idSequencia

        );

    }

    mostrarAvisoSequencia(

        quantidade

    );

}

/* =========================================================

   PREPARAR PRÓXIMA SEQUÊNCIA

========================================================= */

function prepararProximaSequencia() {

    sequenciaAtiva = false;

    pausaAteProxima =

        PAUSA_MINIMA_GRUPOS +

        Math.random() *

        (

            PAUSA_MAXIMA_GRUPOS -

            PAUSA_MINIMA_GRUPOS

        );

}

/* =========================================================

   COLISÃO

========================================================= */

function verificarColisao(

    obstaculo

) {

    const petRect =

        petton.getBoundingClientRect();

    const obsRect =

        obstaculo.elemento

            .getBoundingClientRect();

    const margemPetX = 19;

    const margemPetTopo = 13;

    const margemObsX = 10;

    const margemObsTopo = 9;

    const petLeft =

        petRect.left +

        margemPetX;

    const petRight =

        petRect.right -

        margemPetX;

    const petTop =

        petRect.top +

        margemPetTopo;

    const petBottom =

        petRect.bottom -

        5;

    const obsLeft =

        obsRect.left +

        margemObsX;

    const obsRight =

        obsRect.right -

        margemObsX;

    const obsTop =

        obsRect.top +

        margemObsTopo;

    const obsBottom =

        obsRect.bottom;

    return (

        petRight > obsLeft &&

        petLeft < obsRight &&

        petBottom > obsTop &&

        petTop < obsBottom

    );

}

/* =========================================================

   PONTO

========================================================= */

function adicionarPonto() {

    pontos++;

    pontosElemento.textContent =

        pontos;

    somPonto();

    const novoNivel =

        1 +

        Math.floor(

            pontos / 6

        );

    if (

        novoNivel >

        nivelVelocidade

    ) {

        nivelVelocidade =

            novoNivel;

        velocidade =

            Math.min(

                VELOCIDADE_MAXIMA,

                VELOCIDADE_INICIAL +

                (

                    nivelVelocidade -

                    1

                ) * 18

            );

        velocidadeElemento.textContent =

            nivelVelocidade;

        somNivel();

    }

}

/* =========================================================

   REMOVER

========================================================= */

function removerObstaculo(

    item

) {

    try {

        if (

            item.elemento &&

            item.elemento.parentNode

        ) {

            item.elemento

                .parentNode

                .removeChild(

                    item.elemento

                );

        }

    } catch (erro) {

        console.error(

            erro

        );

    }

}

/* =========================================================

   LIMPAR

========================================================= */

function limparObstaculos() {

    obstaculos.forEach(

        removerObstaculo

    );

    obstaculos = [];

    sequenciaAtiva = false;

}

/* =========================================================

   LOOP

========================================================= */

function loop(

    tempoAtual

) {

    if (

        !jogando ||

        terminou

    ) {

        return;

    }

    if (!ultimoTempo) {

        ultimoTempo =

            tempoAtual;

    }

    let delta =

        (

            tempoAtual -

            ultimoTempo

        ) / 1000;

    delta =

        Math.min(

            delta,

            .035

        );

    ultimoTempo =

        tempoAtual;

    /* =====================================================

       PULO

    ===================================================== */

    if (!noChao) {

        velocidadeY -=

            GRAVIDADE *

            delta;

        posicaoY +=

            velocidadeY *

            delta;

        if (

            posicaoY <= 0

        ) {

            posicaoY = 0;

            velocidadeY = 0;

            noChao = true;

            petton.classList.add(

                "correndo"

            );

        }

    }

    atualizarPosicaoPetton();

    /* =====================================================

       NOVA SEQUÊNCIA

       Só começa se NÃO existir

       nenhum obstáculo ativo.

    ===================================================== */

    if (

        !sequenciaAtiva &&

        obstaculos.length === 0

    ) {

        pausaAteProxima -=

            delta * 1000;

        if (

            pausaAteProxima <= 0

        ) {

            criarSequencia();

        }

    }

    const petRect =

        petton.getBoundingClientRect();

    const centroPet =

        petRect.left +

        petRect.width / 2;

    /* =====================================================

       MOVIMENTAÇÃO

    ===================================================== */

    for (

        let i =

            obstaculos.length - 1;

        i >= 0;

        i--

    ) {

        const item =

            obstaculos[i];

        item.x +=

            velocidade *

            item.direcao *

            delta;

        item.elemento.style.transform =

            "translateX(" +

            item.x +

            "px)";

        /* COLISÃO */

        if (

            verificarColisao(

                item

            )

        ) {

            somColisao();

            finalizarJogo();

            return;

        }

        const obsRect =

            item.elemento

                .getBoundingClientRect();

        const centroObs =

            obsRect.left +

            obsRect.width / 2;

        /* PONTO */

        if (!item.contado) {

            let passou = false;

            if (

                item.direcao < 0 &&

                centroObs <

                    centroPet

            ) {

                passou = true;

            }

            if (

                item.direcao > 0 &&

                centroObs >

                    centroPet

            ) {

                passou = true;

            }

            if (passou) {

                item.contado = true;

                adicionarPonto();

            }

        }

        /* SAIU DA TELA */

        const saiuEsquerda =

            item.direcao < 0 &&

            obsRect.right < -40;

        const saiuDireita =

            item.direcao > 0 &&

            obsRect.left >

                jogo.clientWidth +

                40;

        if (

            saiuEsquerda ||

            saiuDireita

        ) {

            removerObstaculo(

                item

            );

            obstaculos.splice(

                i,

                1

            );

        }

    }

    /*

       IMPORTANTE:

       Somente quando TODOS os

       obstáculos do grupo sumirem

       começamos a pausa para

       a próxima sequência.

    */

    if (

        sequenciaAtiva &&

        obstaculos.length === 0

    ) {

        prepararProximaSequencia();

    }

    animationId =

        requestAnimationFrame(

            loop

        );

}

/* =========================================================

   COMEÇAR

========================================================= */

function iniciarJogo(

    evento

) {

    if (evento) {

        evento.preventDefault();

        evento.stopPropagation();

    }

    if (jogando) {

        return;

    }

    prepararAudio();

    limparObstaculos();

    pontos = 0;

    velocidade =

        VELOCIDADE_INICIAL;

    nivelVelocidade = 1;

    posicaoY = 0;

    velocidadeY = 0;

    noChao = true;

    terminou = false;

    ultimoTempo = 0;

    idSequencia = 0;

    sequenciaAtiva = false;

    /*

       Primeira sequência demora

       aproximadamente 1 segundo.

    */

    pausaAteProxima = 1000;

    pontosElemento.textContent =

        "0";

    velocidadeElemento.textContent =

        "1";

    novoRecorde.style.display =

        "none";

    avisoSequencia.classList.remove(

        "mostrar"

    );

    inicio.style.display =

        "none";

    gameOver.style.display =

        "none";

    jogando = true;

    petton.classList.add(

        "correndo"

    );

    atualizarPosicaoPetton();

    instrucao.classList.add(

        "mostrar"

    );

    setTimeout(

        function() {

            instrucao.classList.remove(

                "mostrar"

            );

        },

        2200

    );

    somInicio();

    animationId =

        requestAnimationFrame(

            loop

        );

}

/* =========================================================

   FINALIZAR

========================================================= */

function finalizarJogo() {

    if (terminou) {

        return;

    }

    terminou = true;

    jogando = false;

    petton.classList.remove(

        "correndo"

    );

    if (animationId) {

        cancelAnimationFrame(

            animationId

        );

        animationId = null;

    }

    pontosFinal.textContent =

        pontos;

    if (

        pontos > recorde

    ) {

        recorde =

            pontos;

        recordeElemento.textContent =

            recorde;

        salvarRecorde();

        novoRecorde.style.display =

            "block";

    } else {

        novoRecorde.style.display =

            "none";

    }

    setTimeout(

        function() {

            gameOver.style.display =

                "flex";

        },

        300

    );

}

/* =========================================================

   REINICIAR

========================================================= */

function reiniciarJogo(

    evento

) {

    if (evento) {

        evento.preventDefault();

        evento.stopPropagation();

    }

    jogando = false;

    terminou = false;

    limparObstaculos();

    gameOver.style.display =

        "none";

    iniciarJogo(

        evento

    );

}

/* =========================================================

   TOQUE

========================================================= */

function toqueJogo(

    evento

) {

    if (

        evento.target.closest(

            "button"

        )

    ) {

        return;

    }

    if (

        jogando &&

        !terminou

    ) {

        evento.preventDefault();

        pular();

    }

}

jogo.addEventListener(

    "pointerdown",

    toqueJogo,

    {

        passive: false

    }

);

/* =========================================================

   TECLADO

========================================================= */

document.addEventListener(

    "keydown",

    function(evento) {

        if (

            evento.code === "Space"

        ) {

            evento.preventDefault();

            pular();

        }

    }

);

/* =========================================================

   VOLTAR

========================================================= */

function voltarMenu() {

    try {

        const destino =

            new URL(

                "./brincar.html",

                document.baseURI

            ).href;

        window.location.assign(

            destino

        );

    } catch (erro) {

        console.error(

            "Erro ao voltar:",

            erro

        );

    }

}

/* =========================================================

   SEGUNDO PLANO

========================================================= */

document.addEventListener(

    "visibilitychange",

    function() {

        if (

            document.hidden &&

            jogando

        ) {

            ultimoTempo = 0;

        }

    }

);

/* =========================================================

   INICIALIZAÇÃO

========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        carregarRecorde();

        carregarImagemPetton();

        atualizarPosicaoPetton();

    }

);

</script>

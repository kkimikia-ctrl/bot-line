<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Estourar Balões 🎈</title>

<script src="../petton.js"></script>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    overflow: hidden;

}

body {

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #9edcff 0%,

            #dff5ff 60%,

            #a8dc7a 100%

        );

    color: #333;

    touch-action: none;

}

.app {

    position: relative;

    width: 100%;

    max-width: 520px;

    height: 100dvh;

    margin: 0 auto;

    overflow: hidden;

}

/* =========================================================

   CENÁRIO

========================================================= */

.cenario {

    position: absolute;

    inset: 0;

    background:

        radial-gradient(

            circle at 15% 20%,

            rgba(255,255,255,.8) 0 28px,

            transparent 30px

        ),

        radial-gradient(

            circle at 25% 19%,

            rgba(255,255,255,.7) 0 38px,

            transparent 40px

        ),

        radial-gradient(

            circle at 78% 28%,

            rgba(255,255,255,.65) 0 35px,

            transparent 37px

        ),

        linear-gradient(

            180deg,

            #a5dfff 0%,

            #e5f7ff 73%,

            #9dd474 73%,

            #75ba51 100%

        );

}

/* =========================================================

   TOPO

========================================================= */

.topo {

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    z-index: 100;

    min-height: 62px;

    display: grid;

    grid-template-columns:

        48px 1fr 48px;

    align-items: center;

    padding: 7px 9px;

    background:

        rgba(255,255,255,.90);

    border-bottom:

        1px solid rgba(0,0,0,.07);

    backdrop-filter:

        blur(9px);

}

.btn-topo {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background:

        rgba(255,255,255,.95);

    box-shadow:

        0 2px 8px rgba(0,0,0,.12);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 21px;

    cursor: pointer;

}

.btn-topo:active {

    transform: scale(.94);

}

.titulo {

    text-align: center;

}

.titulo strong {

    display: block;

    font-size: 16px;

}

.titulo span {

    display: block;

    margin-top: 2px;

    color: #777;

    font-size: 10px;

}

/* =========================================================

   HUD

========================================================= */

.hud {

    position: absolute;

    top: 73px;

    left: 10px;

    right: 10px;

    z-index: 80;

    display: grid;

    grid-template-columns:

        repeat(4,1fr);

    gap: 6px;

    pointer-events: none;

}

.hud-item {

    padding: 7px 3px;

    border-radius: 14px;

    background:

        rgba(255,255,255,.92);

    box-shadow:

        0 2px 8px rgba(0,0,0,.08);

    text-align: center;

}

.hud-label {

    display: block;

    color: #777;

    font-size: 8px;

    font-weight: 700;

}

.hud-valor {

    display: block;

    margin-top: 1px;

    font-size: 17px;

    font-weight: 800;

}

/* =========================================================

   ÁREA DO JOGO

========================================================= */

#areaJogo {

    position: absolute;

    top: 62px;

    left: 0;

    right: 0;

    bottom: 0;

    overflow: hidden;

    touch-action: none;

}

/* =========================================================

   LINHA DE PERIGO

========================================================= */

#linhaPerigo {

    position: absolute;

    top: 118px;

    left: 0;

    right: 0;

    z-index: 25;

    height: 4px;

    background:

        repeating-linear-gradient(

            90deg,

            #f44336 0,

            #f44336 15px,

            #ffffff 15px,

            #ffffff 25px

        );

    box-shadow:

        0 0 7px rgba(244,67,54,.8);

    pointer-events: none;

}

#linhaPerigo::before {

    content: "🚫 NÃO DEIXE PASSAR";

    position: absolute;

    top: -24px;

    left: 50%;

    transform:

        translateX(-50%);

    padding:

        3px 9px;

    border-radius: 10px;

    background:

        rgba(255,255,255,.93);

    color: #d52f25;

    font-size: 10px;

    font-weight: 900;

    white-space: nowrap;

    box-shadow:

        0 2px 5px rgba(0,0,0,.10);

}

/* =========================================================

   GRAMA

========================================================= */

.grama {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 65px;

    z-index: 2;

    font-size: 24px;

    line-height: 65px;

    white-space: nowrap;

    overflow: hidden;

    pointer-events: none;

}

/* =========================================================

   PETTON

========================================================= */

#petton {

    position: absolute;

    z-index: 15;

    width: 82px;

    height: 82px;

    left: 50%;

    bottom: 37px;

    transform:

        translateX(-50%);

    display: flex;

    align-items: flex-end;

    justify-content: center;

    pointer-events: none;

}

#petton img {

    display: block;

    max-width: 82px;

    max-height: 82px;

    object-fit: contain;

    filter:

        drop-shadow(

            0 5px 4px rgba(0,0,0,.18)

        );

    user-select: none;

    -webkit-user-drag: none;

}

/* =========================================================

   BALÕES

========================================================= */

.balao {

    position: absolute;

    z-index: 30;

    width: 58px;

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 50px;

    line-height: 1;

    cursor: pointer;

    user-select: none;

    touch-action: manipulation;

    filter:

        drop-shadow(

            0 4px 3px rgba(0,0,0,.18)

        );

    will-change:

        left,

        top;

}

.balao.bonus {

    width: 65px;

    height: 74px;

    font-size: 54px;

    filter:

        drop-shadow(

            0 0 9px rgba(255,205,0,.95)

        );

}

.estrela-bonus {

    position: absolute;

    top: 3px;

    right: 0;

    z-index: 2;

    font-size: 21px;

    animation:

        piscarBonus .45s infinite alternate;

}

@keyframes piscarBonus {

    from {

        transform:

            scale(.8)

            rotate(-8deg);

        opacity: .65;

    }

    to {

        transform:

            scale(1.18)

            rotate(8deg);

        opacity: 1;

    }

}

/* =========================================================

   ESTOURO

========================================================= */

.estouro {

    position: absolute;

    z-index: 60;

    width: 60px;

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    pointer-events: none;

    animation:

        animarEstouro .38s forwards;

}

@keyframes animarEstouro {

    0% {

        opacity: 1;

        transform:

            translate(-50%,-50%)

            scale(.45);

    }

    60% {

        opacity: 1;

        transform:

            translate(-50%,-50%)

            scale(1.35);

    }

    100% {

        opacity: 0;

        transform:

            translate(-50%,-50%)

            scale(1.7);

    }

}

/* =========================================================

   PONTO

========================================================= */

.ponto-flutuante {

    position: absolute;

    z-index: 70;

    color: #247c35;

    font-size: 22px;

    font-weight: 900;

    pointer-events: none;

    animation:

        subirPonto .7s forwards;

}

.ponto-flutuante.bonus {

    color: #d98b00;

    font-size: 27px;

}

@keyframes subirPonto {

    0% {

        opacity: 1;

        transform:

            translate(-50%,0)

            scale(.8);

    }

    100% {

        opacity: 0;

        transform:

            translate(-50%,-55px)

            scale(1.25);

    }

}

/* =========================================================

   ALERTA DA LINHA

========================================================= */

.alerta-linha {

    position: absolute;

    left: 50%;

    top: 40%;

    z-index: 170;

    transform:

        translate(-50%,-50%);

    padding:

        13px 20px;

    border-radius: 22px;

    background:

        rgba(255,255,255,.96);

    color: #d62d23;

    font-size: 20px;

    font-weight: 900;

    white-space: nowrap;

    pointer-events: none;

    animation:

        alertaLinha .75s forwards;

    box-shadow:

        0 5px 18px rgba(0,0,0,.15);

}

@keyframes alertaLinha {

    0% {

        opacity: 0;

        transform:

            translate(-50%,-50%)

            scale(.6);

    }

    25% {

        opacity: 1;

        transform:

            translate(-50%,-50%)

            scale(1.1);

    }

    75% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:

            translate(-50%,-65%)

            scale(.9);

    }

}

/* =========================================================

   NÍVEL

========================================================= */

#mensagemNivel {

    position: absolute;

    left: 50%;

    top: 45%;

    z-index: 150;

    transform:

        translate(-50%,-50%)

        scale(.7);

    padding:

        11px 20px;

    border-radius: 25px;

    background:

        rgba(255,255,255,.96);

    box-shadow:

        0 5px 18px rgba(0,0,0,.15);

    font-size: 19px;

    font-weight: 900;

    opacity: 0;

    pointer-events: none;

}

#mensagemNivel.mostrar {

    animation:

        nivelAnimacao .85s forwards;

}

@keyframes nivelAnimacao {

    0% {

        opacity: 0;

        transform:

            translate(-50%,-50%)

            scale(.6);

    }

    25% {

        opacity: 1;

        transform:

            translate(-50%,-50%)

            scale(1.08);

    }

    70% {

        opacity: 1;

        transform:

            translate(-50%,-50%)

            scale(1);

    }

    100% {

        opacity: 0;

        transform:

            translate(-50%,-70%)

            scale(.9);

    }

}

/* =========================================================

   OVERLAY

========================================================= */

.overlay {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 22px;

    background:

        rgba(31,74,104,.27);

    backdrop-filter:

        blur(3px);

}

.overlay.oculto {

    display: none;

}

.caixa {

    width: 100%;

    max-width: 340px;

    padding: 25px 20px;

    border-radius: 26px;

    background:

        rgba(255,255,255,.97);

    box-shadow:

        0 10px 35px rgba(0,0,0,.18);

    text-align: center;

}

.caixa-icone {

    font-size: 55px;

    line-height: 1;

}

.caixa h2 {

    margin:

        12px 0 7px;

    font-size: 23px;

}

.caixa p {

    margin:

        5px 0;

    color: #666;

    font-size: 13px;

    line-height: 1.45;

}

.regra-principal {

    margin:

        12px 0 !important;

    padding:

        9px 10px;

    border-radius: 13px;

    background:

        #fff0ef;

    color:

        #c93027 !important;

    font-weight: 900;

}

.resultado {

    margin:

        15px 0;

    padding: 12px;

    border-radius: 17px;

    background:

        #f2f8ff;

    font-size: 14px;

    line-height: 1.7;

}

.btn-jogar {

    width: 100%;

    min-height: 50px;

    margin-top: 10px;

    border: none;

    border-radius: 17px;

    background:

        linear-gradient(

            135deg,

            #58b9ef,

            #348ed6

        );

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:

        0 4px 12px rgba(52,142,214,.25);

}

.btn-jogar:active {

    transform:

        scale(.97);

}

.btn-menu {

    width: 100%;

    min-height: 46px;

    margin-top: 8px;

    border: none;

    border-radius: 17px;

    background:

        #f0f2f4;

    color: #555;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

}

/* =========================================================

   MOBILE PEQUENO

========================================================= */

        width: 74px;

        height: 74px;

    }

    #petton img {

        max-width: 74px;

        max-height: 74px;

    }

    .balao {

        font-size: 44px;

    }

    .hud-valor {

        font-size: 15px

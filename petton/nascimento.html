<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

      initial-scale=1.0,

      maximum-scale=1.0,

      user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background: linear-gradient(

        180deg,

        #fffaf5,

        #f6e9dc

    );

    font-family: Arial, sans-serif;

    color: #4b382d;

    text-align: center;

    overflow: hidden;

}

/* ==================================================

   TOPO

================================================== */

.topo {

    height: 60px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-shadow: 0 2px 10px rgba(0,0,0,.08);

    position: relative;

    z-index: 50;

}

.topo button {

    border: none;

    background: #333;

    color: white;

    border-radius: 9px;

    padding: 10px 13px;

    font-size: 14px;

    font-weight: bold;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

/* ==================================================

   PRINCIPAL

================================================== */

.principal {

    min-height: calc(100vh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 15px;

}

h1 {

    margin: 0 0 7px;

    font-size: 24px;

    color: #5b4030;

}

.subtitulo {

    margin: 0 0 10px;

    font-size: 15px;

    color: #8a7568;

}

/* ==================================================

   CENA

================================================== */

.cena {

    position: relative;

    width: 260px;

    height: 315px;

    margin: 0 auto;

}

/* ==================================================

   SOMBRA

================================================== */

.sombra {

    position: absolute;

    bottom: 8px;

    left: 50%;

    transform: translateX(-50%);

    width: 150px;

    height: 20px;

    border-radius: 50%;

    background: rgba(50,35,25,.14);

    filter: blur(5px);

    z-index: 1;

}

/* ==================================================

   PETTON

   FICA ESCONDIDO ATÉ O OVO ABRIR

================================================== */

.petton {

    position: absolute;

    left: 50%;

    bottom: 25px;

    width: 150px;

    height: 150px;

    transform:

        translateX(-50%)

        translateY(70px)

        scale(.35);

    opacity: 0;

    z-index: 4;

    transition:

        opacity .8s ease,

        transform 1.2s ease;

}

.petton img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: contain;

}

/* ==================================================

   OVO

================================================== */

.ovo {

    position: absolute;

    left: 50%;

    bottom: 20px;

    width: 145px;

    height: 205px;

    transform: translateX(-50%);

    z-index: 10;

    transition:

        opacity .5s ease;

}

/* ==================================================

   DUAS PARTES DO OVO

================================================== */

.ovo-parte {

    position: absolute;

    width: 145px;

    height: 105px;

    background: #fffdf7;

    border: 4px solid #d7c09e;

    box-shadow:

        0 8px 18px rgba(70,45,25,.12);

    transition:

        transform 1.2s ease,

        opacity .8s ease;

}

/* PARTE DE CIMA */

.ovo-cima {

    top: 0;

    border-radius:

        75px 75px 20px 20px;

    border-bottom: 2px solid #cdb68f;

}

/* PARTE DE BAIXO */

.ovo-baixo {

    bottom: 0;

    border-radius:

        20px 20px 75px 75px;

    border-top: 2px solid #cdb68f;

}

/* ==================================================

   BRILHO DO OVO

================================================== */

.ovo-cima::after {

    content: "";

    position: absolute;

    left: 27px;

    top: 22px;

    width: 15px;

    height: 35px;

    background:

        rgba(255,255,255,.85);

    border-radius: 50%;

    transform: rotate(-15deg);

}

/* ==================================================

   RACHADURAS

================================================== */

.rachaduras {

    position: absolute;

    left: 50%;

    bottom: 20px;

    width: 145px;

    height: 205px;

    transform: translateX(-50%);

    z-index: 20;

    opacity: 0;

    pointer-events: none;

    transition: opacity .3s ease;

}

.risco {

    position: absolute;

    height: 4px;

    background: #9f805d;

    border-radius: 5px;

    box-shadow:

        0 1px 2px rgba(0,0,0,.08);

}

/* rachadura central */

.risco1 {

    width: 55px;

    left: 42px;

    top: 98px;

    transform: rotate(8deg);

}

.risco2 {

    width: 32px;

    left: 74px;

    top: 82px;

    transform: rotate(-48deg);

}

.risco3 {

    width: 45px;

    left: 67px;

    top: 126px;

    transform: rotate(-18deg);

}

.risco4 {

    width: 34px;

    left: 42px;

    top: 151px;

    transform: rotate(22deg);

}

/* ==================================================

   FASE RACHANDO

================================================== */

.rachando .rachaduras {

    opacity: 1;

}

.rachando .ovo {

    animation: tremer .16s infinite;

}

/* ==================================================

   FASE ABRINDO

================================================== */

.abrindo .rachaduras {

    opacity: 1;

}

.abrindo .ovo-cima {

    transform:

        translateY(-42px)

        rotate(-8deg);

}

.abrindo .ovo-baixo {

    transform:

        translateY(42px)

        rotate(8deg);

}

/* ==================================================

   PETTON APARECENDO

================================================== */

.nascendo .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0)

        scale(.68);

    z-index: 5;

}

.nascendo .ovo-cima {

    transform:

        translateY(-55px)

        rotate(-10deg);

}

.nascendo .ovo-baixo {

    transform:

        translateY(55px)

        rotate(10deg);

}

/* ==================================================

   NASCIDO

================================================== */

.nascido .ovo {

    opacity: 0;

}

.nascido .ovo-cima {

    transform:

        translateY(-100px)

        rotate(-18deg);

    opacity: 0;

}

.nascido .ovo-baixo {

    transform:

        translateY(100px)

        rotate(18deg);

    opacity: 0;

}

.nascido .rachaduras {

    opacity: 0;

}

.nascido .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0)

        scale(1);

    z-index: 15;

}

/* ==================================================

   ANIMAÇÃO DO OVO

================================================== */

@keyframes tremer {

    0% {

        margin-left: -2px;

    }

    50% {

        margin-left: 2px;

    }

    100% {

        margin-left: -2px;

    }

}

/* ==================================================

   MENSAGENS

================================================== */

#mensagem {

    min-height: 25px;

    margin-top: 0;

    font-size: 17px;

    font-weight: bold;

    color: #754c38;

}

#submensagem {

    min-height: 22px;

    margin-top: 2px;

    font-size: 14px;

    color: #8b786d;

}

/* ==================================================

   BOTÃO

================================================== */

#botaoContinuar {

    display: none;

    margin-top: 15px;

    padding: 13px 24px;

    border: none;

    border-radius: 11px;

    background: #db2777;

    color: white;

    font-size: 16px;

    font-weight: bold;

    box-shadow:

        0 4px 10px rgba(219,39,119,.25);

}

.nascido #botaoContinuar {

    display: inline-block;

}

/* ==================================================

   CELULAR

================================================== */

@media (max-width: 420px) {

    .principal {

        padding-top: 8px;

    }

    h1 {

        font-size: 22px;

    }

    .subtitulo {

        font-size: 14px;

        margin-bottom: 5px;

    }

    .cena {

        width: 230px;

        height: 285px;

    }

    .ovo,

    .rachaduras {

        width: 135px;

        height: 195px;

    }

    .ovo-parte {

        width: 135px;

    }

    .petton {

        width: 135px;

        height: 135px;

    }

}

</style>

</head>

<body>

<!-- ==================================================

     TOPO

================================================== -->

<div class="topo">

    <button

        type="button"

        onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🥚 Nascimento

    </div>

    <div style="width:65px;"></div>

</div>

<!-- ==================================================

     PRINCIPAL

================================================== -->

<div class="principal">

    <h1>

        🐾 Seu Petton está chegando!

    </h1>

    <div class="subtitulo">

        Algo muito especial está prestes a acontecer...

    </div>

    <!-- ==================================================

         CENA

    ================================================== -->

    <div

        id="cena"

        class="cena">

        <!-- SOMBRA -->

        <div class="sombra"></div>

        <!-- ==================================================

             PETTON

        ================================================== -->

        <div class="petton">

            <img

                src="petton-original.png"

                alt="Petton">

        </div>

        <!-- ==================================================

             OVO

        ================================================== -->

        <div class="ovo">

            <div class="ovo-parte ovo-cima"></div>

            <div class="ovo-parte ovo-baixo"></div>

        </div>

        <!-- ==================================================

             RACHADURAS

        ================================================== -->

        <div class="rachaduras">

            <div class="risco risco1"></div>

            <div class="risco risco2"></div>

            <div class="risco risco3"></div>

            <div class="risco risco4"></div>

        </div>

    </div>

    <!-- ==================================================

         MENSAGENS

    ================================================== -->

    <div id="mensagem">

        🥚 Seu ovo está esperando...

    </div>

    <div id="submensagem">

        Espere um pouquinho...

    </div>

    <!-- ==================================================

         BOTÃO

    ================================================== -->

    <button

        id="botaoContinuar"

        type="button"

        onclick="continuar()">

        🐾 Conhecer meu Petton

    </button>

</div>

<!-- ==================================================

     PETTON.JS

================================================== -->

<script src="petton.js"></script>

<script>

/* ==================================================

   VOLTAR

================================================== */

function voltar() {

    window.location.href =

        "index.html";

}

/* ==================================================

   CONTINUAR

================================================== */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* ==================================================

   ELEMENTOS

================================================== */

const cena =

    document.getElementById("cena");

const mensagem =

    document.getElementById("mensagem");

const submensagem =

    document.getElementById("submensagem");

/* ==================================================

   ANIMAÇÃO DO NASCIMENTO

================================================== */

function iniciarNascimento() {

    /* ------------------------------------------------

       1 — OVO FECHADO

    ------------------------------------------------ */

    setTimeout(function() {

        mensagem.textContent =

            "🥚 Seu ovo começou a rachar...";

        submensagem.textContent =

            "Tem alguma coisa lá dentro!";

        cena.classList.add(

            "rachando"

        );

    }, 1500);

    /* ------------------------------------------------

       2 — OVO ABRINDO

    ------------------------------------------------ */

    setTimeout(function() {

        mensagem.textContent =

            "✨ O ovo está abrindo!";

        submensagem.textContent =

            "Está quase na hora...";

        cena.classList.remove(

            "rachando"

        );

        cena.classList.add(

            "abrindo"

        );

    }, 3600);

    /* ------------------------------------------------

       3 — PETTON NASCENDO

    ------------------------------------------------ */

    setTimeout(function() {

        mensagem.textContent =

            "🐾 Está nascendo!";

        submensagem.textContent =

            "Seu Petton está chegando!";

        cena.classList.remove(

            "abrindo"

        );

        cena.classList.add(

            "nascendo"

        );

    }, 4800);

    /* ------------------------------------------------

       4 — NASCIMENTO COMPLETO

    ------------------------------------------------ */

    setTimeout(function() {

        mensagem.textContent =

            "💗 Seu Petton nasceu!";

        submensagem.textContent =

            "Agora começa a aventura.";

        cena.classList.remove(

            "nascendo"

        );

        cena.classList.add(

            "nascido"

        );

        /* Registrar nascimento */

        try {

            if (

                window.Petton &&

                typeof Petton.nascer === "function"

            ) {

                Petton.nascer();

            }

        } catch (erro) {

            console.log(

                "Erro ao registrar nascimento:",

                erro

            );

        }

    }, 6500);

}

/* ==================================================

   CARREGAR PETTON

================================================== */

try {

    if (

        window.Petton &&

        typeof Petton.carregar === "function"

    ) {

        Petton.carregar();

    }

} catch (erro) {

    console.log(

        "Petton ainda não carregado."

    );

}

/* ==================================================

   INICIAR

================================================== */

iniciarNascimento();

</script>

</body>

</html>

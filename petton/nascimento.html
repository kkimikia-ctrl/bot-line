<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

      initial-scale=1.0,

      maximum-scale=1.0,

      user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background:

        linear-gradient(

            180deg,

            #fffaf5 0%,

            #f6e9dc 100%

        );

    font-family: Arial, sans-serif;

    color: #4b382d;

    text-align: center;

    overflow: hidden;

}

/* ==================================================

   TOPO

================================================== */

.topo {

    height: 60px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-shadow:

        0 2px 10px rgba(0,0,0,.08);

    position: relative;

    z-index: 100;

}

.topo button {

    border: none;

    background: #333;

    color: white;

    border-radius: 9px;

    padding: 10px 13px;

    font-size: 14px;

    font-weight: bold;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

/* ==================================================

   PRINCIPAL

================================================== */

.principal {

    min-height:

        calc(100vh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 10px 15px;

}

h1 {

    margin: 0 0 5px;

    font-size: 24px;

    color: #5b4030;

}

.subtitulo {

    margin: 0 0 5px;

    font-size: 14px;

    color: #8a7568;

}

/* ==================================================

   CENA

================================================== */

.cena {

    position: relative;

    width: 280px;

    height: 300px;

    margin: 0 auto;

}

/* ==================================================

   SOMBRA

================================================== */

.sombra {

    position: absolute;

    left: 50%;

    bottom: 15px;

    transform:

        translateX(-50%);

    width: 155px;

    height: 20px;

    border-radius: 50%;

    background:

        rgba(60,40,25,.14);

    filter: blur(6px);

    z-index: 1;

}

/* ==================================================

   PETTON

   ESCONDIDO NO COMEÇO

================================================== */

.petton {

    position: absolute;

    left: 50%;

    bottom: 25px;

    width: 170px;

    height: 170px;

    transform:

        translateX(-50%)

        translateY(80px)

        scale(.25);

    opacity: 0;

    z-index: 5;

    transition:

        opacity .8s ease,

        transform 1.2s ease;

}

.petton img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: contain;

}

/* ==================================================

   OVO SVG

================================================== */

.ovo {

    position: absolute;

    left: 50%;

    top: 30px;

    width: 170px;

    height: 225px;

    transform:

        translateX(-50%);

    z-index: 10;

    overflow: visible;

    transition:

        opacity .6s ease;

}

/* ==================================================

   PARTES DO OVO

================================================== */

.ovo-parte {

    position: absolute;

    width: 170px;

    height: 225px;

    left: 0;

    top: 0;

    transition:

        transform 1.3s cubic-bezier(.2,.8,.2,1),

        opacity .7s ease;

}

/* ==================================================

   DESENHO DO OVO

================================================== */

.ovo-parte svg {

    width: 100%;

    height: 100%;

    display: block;

}

/* ==================================================

   OVO FECHADO

================================================== */

.ovo-cima {

    transform:

        translateX(0);

}

.ovo-baixo {

    transform:

        translateX(0);

}

/* ==================================================

   RACHADURA

================================================== */

.rachadura {

    position: absolute;

    left: 50%;

    top: 88px;

    width: 5px;

    height: 100px;

    transform:

        translateX(-50%)

        rotate(7deg);

    z-index: 20;

    opacity: 0;

    transition:

        opacity .4s ease;

}

.rachadura::before,

.rachadura::after {

    content: "";

    position: absolute;

    width: 35px;

    height: 5px;

    background: #9d7c55;

    border-radius: 5px;

}

.rachadura::before {

    top: 20px;

    left: -28px;

    transform:

        rotate(-45deg);

}

.rachadura::after {

    top: 55px;

    left: -4px;

    transform:

        rotate(45deg);

}

/* ==================================================

   PEQUENAS RACHADURAS

================================================== */

.risco {

    position: absolute;

    width: 32px;

    height: 5px;

    background: #9d7c55;

    border-radius: 5px;

    opacity: 0;

    z-index: 20;

    transition:

        opacity .4s ease;

}

.risco1 {

    left: 55px;

    top: 120px;

    transform:

        rotate(28deg);

}

.risco2 {

    left: 91px;

    top: 145px;

    transform:

        rotate(-25deg);

}

.risco3 {

    left: 72px;

    top: 95px;

    transform:

        rotate(-25deg);

}

/* ==================================================

   FASE RACHANDO

================================================== */

.rachando .rachadura,

.rachando .risco {

    opacity: 1;

}

.rachando .ovo {

    animation:

        tremer .15s infinite;

}

/* ==================================================

   FASE ABRINDO

================================================== */

.abrindo .rachadura,

.abrindo .risco {

    opacity: 0;

}

.abrindo .ovo-cima {

    transform:

        translateX(-62px)

        rotate(-12deg);

}

.abrindo .ovo-baixo {

    transform:

        translateX(62px)

        rotate(12deg);

}

/* ==================================================

   PETTON COMEÇA A SAIR

================================================== */

.nascendo .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(5px)

        scale(.68);

}

.nascendo .ovo-cima {

    transform:

        translateX(-82px)

        translateY(-20px)

        rotate(-17deg);

}

.nascendo .ovo-baixo {

    transform:

        translateX(82px)

        translateY(20px)

        rotate(17deg);

}

/* ==================================================

   NASCIMENTO COMPLETO

================================================== */

.nascido .ovo {

    opacity: 0;

}

.nascido .ovo-cima {

    transform:

        translateX(-120px)

        translateY(-35px)

        rotate(-25deg);

    opacity: 0;

}

.nascido .ovo-baixo {

    transform:

        translateX(120px)

        translateY(35px)

        rotate(25deg);

    opacity: 0;

}

.nascido .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0)

        scale(1);

    z-index: 30;

}

/* ==================================================

   TREMER

================================================== */

@keyframes tremer {

    0% {

        transform:

            translateX(-50%)

            rotate(-1deg);

    }

    50% {

        transform:

            translateX(-50%)

            rotate(1deg);

    }

    100% {

        transform:

            translateX(-50%)

            rotate(-1deg);

    }

}

/* ==================================================

   MENSAGENS

================================================== */

#mensagem {

    min-height: 25px;

    margin-top: 0;

    font-size: 17px;

    font-weight: bold;

    color: #754c38;

}

#submensagem {

    min-height: 22px;

    margin-top: 2px;

    font-size: 14px;

    color: #8b786d;

}

/* ==================================================

   BOTÃO

================================================== */

#botaoContinuar {

    display: none;

    margin-top: 12px;

    padding: 13px 24px;

    border: none;

    border-radius: 11px;

    background: #db2777;

    color: white;

    font-size: 16px;

    font-weight: bold;

    box-shadow:

        0 4px 10px rgba(219,39,119,.25);

}

.nascido #botaoContinuar {

    display: inline-block;

}

/* ==================================================

   CELULAR

================================================== */

@media (max-width: 420px) {

    .principal {

        padding-top: 5px;

    }

    h1 {

        font-size: 21px;

    }

    .subtitulo {

        font-size: 13px;

    }

    .cena {

        width: 250px;

        height: 280px;

    }

    .ovo {

        width: 155px;

        height: 210px;

        top: 25px;

    }

    .ovo-parte {

        width: 155px;

        height: 210px;

    }

    .petton {

        width: 145px;

        height: 145px;

        bottom: 20px;

    }

}

</style>

</head>

<body>

<!-- ==================================================

     TOPO

================================================== -->

<div class="topo">

    <button

        type="button"

        onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🥚 Nascimento

    </div>

    <div style="width:65px;"></div>

</div>

<!-- ==================================================

     PRINCIPAL

================================================== -->

<div class="principal">

    <h1>

        🐾 Seu Petton está chegando!

    </h1>

    <div class="subtitulo">

        Algo muito especial está prestes a acontecer...

    </div>

    <!-- ==================================================

         CENA

    ================================================== -->

    <div

        id="cena"

        class="cena">

        <div class="sombra"></div>

        <!-- ==================================================

             PETTON

        ================================================== -->

        <div class="petton">

            <img

                src="petton-original.png"

                alt="Petton">

        </div>

        <!-- ==================================================

             OVO

        ================================================== -->

        <div class="ovo">

            <!-- PARTE DE CIMA -->

            <div class="ovo-parte ovo-cima">

                <svg

                    viewBox="0 0 170 225"

                    xmlns="http://www.w3.org/2000/svg">

                    <path

                        d="

                        M85 5

                        C35 5 12 60 15 112

                        C18 165 43 202 85 218

                        C127 202 152 165 155 112

                        C158 60 135 5 85 5

                        Z

                        "

                        fill="#fffdf7"

                        stroke="#d7c09e"

                        stroke-width="4"/>

                    <ellipse

                        cx="55"

                        cy="65"

                        rx="12"

                        ry="27"

                        fill="white"

                        opacity=".8"/>

                </svg>

            </div>

            <!-- PARTE DE BAIXO -->

            <div class="ovo-parte ovo-baixo">

                <svg

                    viewBox="0 0 170 225"

                    xmlns="http://www.w3.org/2000/svg">

                    <path

                        d="

                        M85 5

                        C35 5 12 60 15 112

                        C18 165 43 202 85 218

                        C127 202 152 165 155 112

                        C158 60 135 5 85 5

                        Z

                        "

                        fill="#fffdf7"

                        stroke="#d7c09e"

                        stroke-width="4"/>

                </svg>

            </div>

        </div>

        <!-- ==================================================

             RACHADURAS

        ================================================== -->

        <div class="rachadura"></div>

        <div class="risco risco1"></div>

        <div class="risco risco2"></div>

        <div class="risco risco3"></div>

    </div>

    <!-- ==================================================

         MENSAGENS

    ================================================== -->

    <div id="mensagem">

        🥚 Seu ovo está esperando...

    </div>

    <div id="submensagem">

        Espere um pouquinho...

    </div>

    <!-- ==================================================

         BOTÃO

    ================================================== -->

    <button

        id="botaoContinuar"

        type="button"

        onclick="continuar()">

        🐾 Conhecer meu Petton

    </button>

</div>

<!-- ==================================================

     PETTON.JS

================================================== -->

<script src="petton.js"></script>

<script>

/* ==================================================

   VOLTAR

================================================== */

function voltar() {

    window.location.href =

        "index.html";

}

/* ==================================================

   CONTINUAR

================================================== */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* ==================================================

   ELEMENTOS

================================================== */

const cena =

    document.getElementById("cena");

const mensagem =

    document.getElementById("mensagem");

const submensagem =

    document.getElementById("submensagem");

/* ==================================================

   ANIMAÇÃO

================================================== */

function iniciarNascimento() {

    /* ================================================

       COMEÇA COM O OVO FECHADO

    ================================================ */

    setTimeout(function() {

        mensagem.textContent =

            "🥚 Seu ovo começou a rachar...";

        submensagem.textContent =

            "Tem alguma coisa lá dentro!";

        cena.classList.add(

            "rachando"

        );

    }, 1500);

    /* ================================================

       OVO COMEÇA A ABRIR

    ================================================ */

    setTimeout(function() {

        mensagem.textContent =

            "✨ O ovo está abrindo!";

        submensagem.textContent =

            "Está quase na hora...";

        cena.classList.remove(

            "rachando"

        );

        cena.classList.add(

            "abrindo"

        );

    }, 3500);

    /* ================================================

       PETTON COMEÇA A APARECER

    ================================================ */

    setTimeout(function() {

        mensagem.textContent =

            "🐾 Está nascendo!";

        submensagem.textContent =

            "Seu Petton está chegando!";

        cena.classList.remove(

            "abrindo"

        );

        cena.classList.add(

            "nascendo"

        );

    }, 5000);

    /* ================================================

       NASCIMENTO COMPLETO

    ================================================ */

    setTimeout(function() {

        mensagem.textContent =

            "💗 Seu Petton nasceu!";

        submensagem.textContent =

            "Agora começa a aventura.";

        cena.classList.remove(

            "nascendo"

        );

        cena.classList.add(

            "nascido"

        );

        /* REGISTRAR NASCIMENTO */

        try {

            if (

                window.Petton &&

                typeof Petton.nascer === "function"

            ) {

                Petton.nascer();

            }

        } catch (erro) {

            console.log(

                "Erro ao registrar nascimento:",

                erro

            );

        }

    }, 7000);

}

/* ==================================================

   CARREGAR PETTON

================================================== */

try {

    if (

        window.Petton &&

        typeof Petton.carregar === "function"

    ) {

        Petton.carregar();

    }

} catch (erro) {

    console.log(

        "Petton ainda não carregado."

    );

}

/* ==================================================

   INICIAR

================================================== */

iniciarNascimento();

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

               initial-scale=1.0,

               maximum-scale=1.0,

               user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background:

        linear-gradient(

            to bottom,

            #dff3ff 0%,

            #f8fcff 55%,

            #eadcc9 55%,

            #d8c5aa 100%

        );

    font-family: Arial, sans-serif;

    text-align: center;

    color: #333;

    overflow: hidden;

}

/* =========================================

   TOPO

========================================= */

.topo {

    height: 60px;

    background: rgba(255,255,255,.92);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-shadow:

        0 2px 8px rgba(0,0,0,.12);

    position: relative;

    z-index: 20;

}

.topo button {

    border: none;

    background: #333;

    color: white;

    padding: 10px 13px;

    border-radius: 9px;

    font-size: 14px;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

/* =========================================

   ÁREA DO NASCIMENTO

========================================= */

.cena {

    position: relative;

    height: calc(100vh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}

/* =========================================

   TEXTO

========================================= */

#tituloNascimento {

    position: absolute;

    top: 35px;

    width: 100%;

    font-size: 25px;

    font-weight: bold;

    color: #555;

    transition: opacity .6s ease;

}

#subtitulo {

    position: absolute;

    top: 72px;

    width: 100%;

    font-size: 14px;

    color: #777;

    transition: opacity .6s ease;

}

/* =========================================

   OVO

========================================= */

#ovoArea {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:

        translate(-50%, -50%);

    width: 150px;

    height: 190px;

    display: flex;

    align-items: center;

    justify-content: center;

}

/*

   O ovo começa VISÍVEL.

   Não existe Petton atrás dele.

*/

.ovo {

    width: 125px;

    height: 160px;

    background:

        radial-gradient(

            circle at 35% 25%,

            #ffffff 0%,

            #fffdf5 18%,

            #f4e6c7 70%,

            #ddc49a 100%

        );

    border-radius:

        52% 48%

        47% 53%

        /

        58% 57%

        43% 42%;

    border: 3px solid #c9aa73;

    box-shadow:

        0 12px 20px rgba(0,0,0,.18);

    position: relative;

    transform-origin: center bottom;

    opacity: 1;

}

/* brilho do ovo */

.ovo::before {

    content: "";

    position: absolute;

    width: 30px;

    height: 48px;

    left: 25px;

    top: 25px;

    background: rgba(255,255,255,.7);

    border-radius: 50%;

    transform: rotate(-20deg);

}

/* rachaduras */

.rachadura {

    position: absolute;

    width: 3px;

    background: #9d8054;

    border-radius: 3px;

    opacity: 0;

}

/* rachadura 1 */

.r1 {

    height: 48px;

    left: 61px;

    top: 42px;

    transform:

        rotate(18deg);

}

/* rachadura 2 */

.r2 {

    height: 42px;

    left: 74px;

    top: 78px;

    transform:

        rotate(-24deg);

}

/* rachadura 3 */

.r3 {

    height: 38px;

    left: 57px;

    top: 107px;

    transform:

        rotate(16deg);

}

/* =========================================

   PETTON

========================================= */

#petton {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:

        translate(-50%, -34%)

        scale(.35);

    width: 150px;

    opacity: 0;

    display: none;

    z-index: 5;

    filter:

        drop-shadow(

            0 8px 7px

            rgba(0,0,0,.18)

        );

}

/* =========================================

   ANIMAÇÃO DO OVO

========================================= */

/*

   Primeiros segundos:

   ovo parado.

*/

.ovo.rachando {

    animation:

        tremer .16s

        linear infinite;

}

@keyframes tremer {

    0% {

        transform: rotate(0deg);

    }

    25% {

        transform: rotate(-3deg);

    }

    50% {

        transform: rotate(3deg);

    }

    75% {

        transform: rotate(-2deg);

    }

    100% {

        transform: rotate(0deg);

    }

}

/* rachaduras aparecem */

.ovo.rachando .r1 {

    opacity: 1;

}

.ovo.rachando .r2 {

    opacity: 1;

}

.ovo.rachando .r3 {

    opacity: 1;

}

/* =========================================

   OVO ABRINDO

========================================= */

#ovoArea.abrindo {

    animation:

        abrirArea .9s

        forwards;

}

@keyframes abrirArea {

    0% {

        transform:

            translate(-50%, -50%)

            scale(1);

    }

    60% {

        transform:

            translate(-50%, -50%)

            scale(1.08);

    }

    100% {

        transform:

            translate(-50%, -50%)

            scale(0);

    }

}

#ovoArea.abrindo .ovo {

    animation:

        ovoSumir .9s

        forwards;

}

@keyframes ovoSumir {

    0% {

        opacity: 1;

    }

    70% {

        opacity: 1;

    }

    100% {

        opacity: 0;

    }

}

/* =========================================

   NASCIMENTO DO PETTON

========================================= */

#petton.nascendo {

    display: block;

    animation:

        nascer 1.4s

        ease-out

        forwards;

}

@keyframes nascer {

    0% {

        opacity: 0;

        transform:

            translate(-50%, -25%)

            scale(.25);

    }

    55% {

        opacity: 1;

        transform:

            translate(-50%, -45%)

            scale(.48);

    }

    100% {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            scale(.58);

    }

}

/* =========================================

   FINAL

========================================= */

#petton.nascido {

    display: block;

    opacity: 1;

    transform:

        translate(-50%, -50%)

        scale(.58);

}

/* =========================================

   MENSAGEM FINAL

========================================= */

#mensagemFinal {

    position: absolute;

    bottom: 70px;

    width: 100%;

    font-size: 21px;

    font-weight: bold;

    color: #555;

    opacity: 0;

    transition:

        opacity .8s ease;

}

#mensagemFinal.mostrar {

    opacity: 1;

}

/* =========================================

   BOTÃO

========================================= */

#botaoContinuar {

    position: absolute;

    bottom: 20px;

    left: 50%;

    transform:

        translateX(-50%);

    border: none;

    background: #db2777;

    color: white;

    padding: 13px 24px;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    transition:

        opacity .6s ease;

}

#botaoContinuar.mostrar {

    opacity: 1;

    pointer-events: auto;

}

/* =========================================

   CELULAR PEQUENO

========================================= */

@media (max-width: 380px) {

    #tituloNascimento {

        font-size: 22px;

    }

    #subtitulo {

        font-size: 13px;

    }

    #petton {

        width: 135px;

    }

    .ovo {

        width: 115px;

        height: 150px;

    }

}

</style>

</head>

<body>

<div class="topo">

    <button

        type="button"

        onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🐾 Petton

    </div>

    <div style="width:65px;"></div>

</div>

<div class="cena">

    <div id="tituloNascimento">

        🥚 Um novo Petton está nascendo!

    </div>

    <div id="subtitulo">

        Espere um pouquinho...

    </div>

    <!-- =====================================

         OVO

    ====================================== -->

    <div id="ovoArea">

        <div

            id="ovo"

            class="ovo">

            <div class="rachadura r1"></div>

            <div class="rachadura r2"></div>

            <div class="rachadura r3"></div>

        </div>

    </div>

    <!-- =====================================

         PETTON

         FICA TOTALMENTE ESCONDIDO NO INÍCIO

    ====================================== -->

    <img

        id="petton"

        src="petton-original.png"

        alt="Petton recém-nascido">

    <div id="mensagemFinal">

        💕 Seu Petton nasceu!

    </div>

    <button

        id="botaoContinuar"

        type="button"

        onclick="continuar()">

        🐾 Conhecer meu Petton

    </button>

</div>

<script src="petton.js"></script>

<script>

/* =========================================

   ELEMENTOS

========================================= */

const ovoArea =

    document.getElementById("ovoArea");

const ovo =

    document.getElementById("ovo");

const petton =

    document.getElementById("petton");

const titulo =

    document.getElementById("tituloNascimento");

const subtitulo =

    document.getElementById("subtitulo");

const mensagemFinal =

    document.getElementById("mensagemFinal");

const botaoContinuar =

    document.getElementById("botaoContinuar");

/* =========================================

   GARANTIR QUE O PETTON NÃO APAREÇA

   ANTES DA HORA

========================================= */

petton.style.display = "none";

petton.style.opacity = "0";

/* =========================================

   COMEÇA O NASCIMENTO

========================================= */

function iniciarNascimento() {

    /*

       1º estágio:

       ovo parado durante 1,5 segundo

    */

    setTimeout(function() {

        ovo.classList.add("rachando");

        subtitulo.textContent =

            "Algo está acontecendo...";

    }, 1500);

    /*

       2º estágio:

       ovo começa a abrir

    */

    setTimeout(function() {

        ovoArea.classList.add("abrindo");

        subtitulo.textContent =

            "Está nascendo!";

    }, 3500);

    /*

       3º estágio:

       AGORA o Petton aparece.

    */

    setTimeout(function() {

        petton.style.display =

            "block";

        /*

           força o navegador a reconhecer

           o display antes da animação

        */

        void petton.offsetWidth;

        petton.classList.add("nascendo");

    }, 4300);

    /*

       4º estágio:

       nascimento concluído

    */

    setTimeout(function() {

        petton.classList.remove(

            "nascendo"

        );

        petton.classList.add(

            "nascido"

        );

        titulo.textContent =

            "🐾 Nasceu!";

        subtitulo.textContent =

            "Cuide muito bem do seu novo Petton.";

        mensagemFinal.classList.add(

            "mostrar"

        );

        botaoContinuar.classList.add(

            "mostrar"

        );

    }, 5800);

}

/* =========================================

   CONTINUAR

========================================= */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* =========================================

   VOLTAR

========================================= */

function voltar() {

    window.location.href =

        "index.html";

}

/* =========================================

   INICIAR

========================================= */

iniciarNascimento();

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<title>Nascimento do Petton</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    min-height:100vh;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #fff8ef 0%,

            #f7eadb 100%

        );

    color:#333;

    display:flex;

    justify-content:center;

}

.container{

    width:100%;

    max-width:600px;

    padding:18px;

}

/* =========================

   TOPO

========================= */

.topo{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;

}

.voltar{

    width:44px;

    height:44px;

    border:0;

    border-radius:14px;

    background:white;

    font-size:23px;

    box-shadow:

        0 3px 12px rgba(0,0,0,.08);

}

.titulo{

    flex:1;

}

.titulo h1{

    margin:0;

    font-size:23px;

}

.titulo p{

    margin:3px 0 0;

    font-size:12px;

    color:#888;

}

/* =========================

   TEXTO

========================= */

.mensagem{

    text-align:center;

    margin-top:12px;

    min-height:48px;

}

.mensagem h2{

    margin:0;

    font-size:21px;

}

.mensagem p{

    margin:6px 0;

    color:#777;

    font-size:13px;

}

/* =========================

   ÁREA DO NASCIMENTO

========================= */

.cena{

    position:relative;

    width:100%;

    height:430px;

    margin-top:10px;

    overflow:hidden;

    border-radius:28px;

    background:

        radial-gradient(

            circle at 50% 45%,

            #fffdf9 0%,

            #f8ead9 70%,

            #efd9c1 100%

        );

    box-shadow:

        0 8px 28px rgba(0,0,0,.10);

}

/* chão */

.chao{

    position:absolute;

    left:5%;

    bottom:35px;

    width:90%;

    height:30px;

    border-radius:50%;

    background:

        rgba(170,125,82,.16);

    filter:blur(1px);

}

/* =========================

   BRILHO

========================= */

.brilho{

    position:absolute;

    left:50%;

    top:48%;

    width:250px;

    height:250px;

    transform:

        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(

            circle,

            rgba(255,255,255,.9),

            rgba(255,255,255,0)

        );

    opacity:0;

    pointer-events:none;

}

/* =========================

   OVO

========================= */

.ovo-area{

    position:absolute;

    left:50%;

    bottom:62px;

    width:190px;

    height:245px;

    transform:

        translateX(-50%);

    z-index:5;

    display:flex;

    justify-content:center;

    align-items:flex-end;

}

/* ovo principal */

.ovo{

    position:absolute;

    left:50%;

    bottom:0;

    width:170px;

    height:220px;

    transform:

        translateX(-50%);

    border-radius:

        50% 50%

        48% 48%

        45% 45%;

    background:

        radial-gradient(

            circle at 35% 25%,

            #fffefa 0%,

            #fff6e9 38%,

            #ead7bd 100%

        );

    box-shadow:

        inset -12px -15px 25px rgba(130,90,50,.13),

        inset 10px 10px 20px rgba(255,255,255,.9),

        0 12px 20px rgba(80,50,25,.18);

    transition:

        transform .5s ease,

        opacity .5s ease;

}

/* brilho no ovo */

.ovo::before{

    content:"";

    position:absolute;

    top:35px;

    left:35px;

    width:35px;

    height:70px;

    border-radius:50%;

    background:

        rgba(255,255,255,.65);

    transform:rotate(-25deg);

}

/* =========================

   RACHADURAS

========================= */

.rachaduras{

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:0;

    transition:

        opacity .5s ease;

}

/* rachadura principal */

.r1{

    position:absolute;

    left:82px;

    top:60px;

    width:5px;

    height:95px;

    background:#b99b78;

    transform:

        rotate(17deg);

    border-radius:5px;

}

.r1::before{

    content:"";

    position:absolute;

    left:-17px;

    top:30px;

    width:42px;

    height:5px;

    background:#b99b78;

    transform:rotate(-28deg);

    border-radius:5px;

}

.r1::after{

    content:"";

    position:absolute;

    left:8px;

    top:52px;

    width:36px;

    height:5px;

    background:#b99b78;

    transform:rotate(30deg);

    border-radius:5px;

}

/* rachadura lateral */

.r2{

    position:absolute;

    right:48px;

    top:108px;

    width:5px;

    height:80px;

    background:#b99b78;

    transform:rotate(-25deg);

    border-radius:5px;

}

.r2::before{

    content:"";

    position:absolute;

    left:-20px;

    top:28px;

    width:42px;

    height:5px;

    background:#b99b78;

    transform:rotate(25deg);

    border-radius:5px;

}

/* rachadura inferior */

.r3{

    position:absolute;

    left:50px;

    bottom:42px;

    width:80px;

    height:5px;

    background:#b99b78;

    transform:rotate(-8deg);

    border-radius:5px;

}

.r3::after{

    content:"";

    position:absolute;

    right:18px;

    top:-20px;

    width:5px;

    height:38px;

    background:#b99b78;

    transform:rotate(28deg);

    border-radius:5px;

}

/* =========================

   PETTON NASCENDO

========================= */

.petton{

    position:absolute;

    left:50%;

    bottom:45px;

    width:115px;

    height:125px;

    transform:

        translateX(-50%)

        scale(.15);

    opacity:0;

    z-index:7;

    transition:

        transform 1.2s cubic-bezier(.2,.8,.2,1),

        opacity .8s ease,

        bottom 1.2s ease;

}

.petton img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

    filter:

        drop-shadow(

            0 8px 5px rgba(0,0,0,.20)

        );

}

/* =========================

   PEDACINHOS DO OVO

========================= */

.pedaco{

    position:absolute;

    width:38px;

    height:30px;

    border-radius:50%;

    background:

        linear-gradient(

            135deg,

            #fffaf1,

            #dfc8aa

        );

    opacity:0;

    z-index:8;

}

.pedaco1{

    left:18px;

    top:95px;

    transform:rotate(-35deg);

}

.pedaco2{

    right:15px;

    top:80px;

    transform:rotate(30deg);

}

.pedaco3{

    left:42px;

    bottom:25px;

    transform:rotate(20deg);

}

.pedaco4{

    right:35px;

    bottom:35px;

    transform:rotate(-25deg);

}

/* =========================

   ESTÁGIOS

========================= */

.cena.rachando .ovo{

    animation:

        tremer .18s infinite;

}

.cena.rachando .rachaduras{

    opacity:1;

}

.cena.abrindo .ovo{

    opacity:0;

    transform:

        translateX(-50%)

        scale(.82);

}

.cena.abrindo .pedaco{

    opacity:1;

}

.cena.nascendo .petton{

    opacity:1;

    bottom:92px;

    transform:

        translateX(-50%)

        scale(.72);

}

.cena.nascendo .brilho{

    opacity:1;

    animation:

        pulsar 1.5s infinite;

}

.cena.nascido .petton{

    opacity:1;

    bottom:78px;

    transform:

        translateX(-50%)

        scale(1);

}

.cena.nascido .brilho{

    opacity:.45;

}

@keyframes tremer{

    0%{

        transform:

            translateX(-50%)

            rotate(0deg);

    }

    25%{

        transform:

            translateX(-50%)

            rotate(-2deg);

    }

    50%{

        transform:

            translateX(-50%)

            rotate(2deg);

    }

    75%{

        transform:

            translateX(-50%)

            rotate(-1deg);

    }

    100%{

        transform:

            translateX(-50%)

            rotate(0deg);

    }

}

@keyframes pulsar{

    0%,100%{

        transform:

            translate(-50%,-50%)

            scale(.8);

        opacity:.2;

    }

    50%{

        transform:

            translate(-50%,-50%)

            scale(1.15);

        opacity:.8;

    }

}

/* =========================

   BOTÃO

========================= */

.botao{

    display:block;

    width:100%;

    max-width:320px;

    margin:18px auto 0;

    padding:14px 20px;

    border:0;

    border-radius:15px;

    background:#e88945;

    color:white;

    font-size:16px;

    font-weight:700;

    box-shadow:

        0 5px 15px rgba(200,110,50,.25);

    touch-action:manipulation;

}

.botao:active{

    transform:scale(.97);

}

.botao:disabled{

    opacity:.55;

}

/* =========================

   CELULAR

========================= */

@media(max-width:420px){

    .cena{

        height:390px;

    }

    .ovo-area{

        bottom:52px;

    }

    .ovo{

        width:150px;

        height:200px;

    }

    .petton{

        width:105px;

        height:115px;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- =========================

     TOPO

========================= -->

<div class="topo">

    <button

        class="voltar"

        onclick="voltar()"

    >

        ←

    </button>

    <div class="titulo">

        <h1>

            🥚 Nascimento

        </h1>

        <p>

            Um novo Petton está chegando...

        </p>

    </div>

</div>

<!-- =========================

     MENSAGEM

========================= -->

<div

    id="mensagem"

    class="mensagem"

>

    <h2>

        🥚 O seu Petton está dentro do ovo!

    </h2>

    <p>

        Espere um pouquinho...

    </p>

</div>

<!-- =========================

     CENA

========================= -->

<div

    id="cena"

    class="cena"

>

    <div class="brilho"></div>

    <div class="chao"></div>

    <div class="ovo-area">

        <div class="ovo">

            <div class="rachaduras">

                <div class="r1"></div>

                <div class="r2"></div>

                <div class="r3"></div>

            </div>

        </div>

        <!-- pedaços -->

        <div class="pedaco pedaco1"></div>

        <div class="pedaco pedaco2"></div>

        <div class="pedaco pedaco3"></div>

        <div class="pedaco pedaco4"></div>

    </div>

    <!-- PETTON -->

    <div

        id="petton"

        class="petton"

    >

        <img

            src="petton-original.png"

            alt="Seu Petton"

        >

    </div>

</div>

<!-- =========================

     BOTÃO

========================= -->

<button

    id="botao"

    class="botao"

    onclick="comecarNascimento()"

>

    🐣 Aguardar nascimento

</button>

</div>

<script src="petton.js"></script>

<script>

/* =================================================

   ELEMENTOS

================================================= */

const cena =

    document.getElementById("cena");

const mensagem =

    document.getElementById("mensagem");

const botao =

    document.getElementById("botao");

/* =================================================

   ESTADO

================================================= */

let nascimentoIniciado = false;

/* =================================================

   VOLTAR

================================================= */

function voltar(){

    window.location.href =

        "index.html";

}

/* =================================================

   NASCIMENTO

================================================= */

function comecarNascimento(){

    if(nascimentoIniciado){

        return;

    }

    nascimentoIniciado = true;

    botao.disabled = true;

    botao.textContent =

        "🥚 O ovo está mexendo...";

    mensagem.innerHTML = `

        <h2>

            🥚 O ovo está mexendo...

        </h2>

        <p>

            Tem alguma coisa lá dentro! 👀

        </p>

    `;

    /*

     * ETAPA 1

     * OVO TREME

     */

    setTimeout(function(){

        cena.classList.add(

            "rachando"

        );

        mensagem.innerHTML = `

            <h2>

                💥 O ovo está rachando!

            </h2>

            <p>

                Está quase chegando...

            </p>

        `;

        botao.textContent =

            "💥 O ovo está rachando...";

    },1000);

    /*

     * ETAPA 2

     * OVO ABRE

     */

    setTimeout(function(){

        cena.classList.remove(

            "rachando"

        );

        cena.classList.add(

            "abrindo"

        );

        mensagem.innerHTML = `

            <h2>

                ✨ O ovo abriu!

            </h2>

            <p>

                Olha! Tem alguém saindo! 🐣

            </p>

        `;

    },3500);

    /*

     * ETAPA 3

     * PETTON APARECE

     */

    setTimeout(function(){

        cena.classList.add(

            "nascendo"

        );

        mensagem.innerHTML = `

            <h2>

                🐣 Nasceu!

            </h2>

            <p>

                Seu pequeno Petton chegou ao mundo. ❤️

            </p>

        `;

    },4300);

    /*

     * ETAPA 4

     * PETTON FICA DE PÉ

     */

    setTimeout(function(){

        cena.classList.add(

            "nascido"

        );

        mensagem.innerHTML = `

            <h2>

                🐱 Bem-vindo, Petton! ❤️

            </h2>

            <p>

                Agora começa a sua história.

            </p>

        `;

        botao.disabled = false;

        botao.textContent =

            "🏠 Ir para o quarto";

        botao.onclick =

            function(){

                window.location.href =

                    "quarto.html";

            };

        /*

         * REGISTRA O NASCIMENTO

         */

        try{

            if(

                window.Petton &&

                typeof Petton.nascer ===

                "function"

            ){

                Petton.nascer();

            }

        }catch(e){

            console.log(

                "Petton.nascer:",

                e

            );

        }

    },6000);

}

/* =================================================

   VERIFICAR PETTON

================================================= */

try{

    if(

        window.Petton &&

        Petton.dados

    ){

        /*

         * Se já nasceu,

         * não precisa repetir automaticamente.

         */

        if(

            Petton.dados.dateNascimento

        ){

            mensagem.innerHTML = `

                <h2>

                    🐱 Seu Petton já nasceu!

                </h2>

                <p>

                    Ele está esperando você no quarto.

                </p>

            `;

            botao.textContent =

                "🏠 Ir para o quarto";

            botao.onclick =

                function(){

                    window.location.href =

                        "quarto.html";

                };

        }

    }

}catch(e){

    console.log(e);

}

</script>

</body>

</html>

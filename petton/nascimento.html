<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

               initial-scale=1.0,

               maximum-scale=1.0,

               user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background:

        linear-gradient(

            180deg,

            #fff8f0 0%,

            #f8eee4 100%

        );

    font-family:

        Arial,

        sans-serif;

    color: #333;

    text-align: center;

    overflow: hidden;

}

/* ==================================================

   TOPO

================================================== */

.topo {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    background: #ffffff;

    box-shadow:

        0 2px 10px

        rgba(0,0,0,.08);

    position: relative;

    z-index: 20;

}

.topo button {

    border: none;

    background: #333;

    color: white;

    border-radius: 9px;

    padding: 10px 13px;

    font-size: 14px;

    font-weight: bold;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

/* ==================================================

   ÁREA PRINCIPAL

================================================== */

.principal {

    min-height:

        calc(100vh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding:

        20px

        15px

        30px;

}

/* ==================================================

   TEXTO

================================================== */

h1 {

    margin:

        0

        0

        8px;

    font-size: 25px;

    color: #5b4030;

}

.subtitulo {

    margin:

        0

        20px;

    font-size: 15px;

    color: #777;

}

/* ==================================================

   ÁREA DO OVO

================================================== */

.ovo-area {

    width: 230px;

    height: 300px;

    position: relative;

    margin:

        5px

        auto

        15px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

}

/* ==================================================

   OVO

================================================== */

.ovo {

    position: absolute;

    left: 50%;

    bottom: 0;

    width: 150px;

    height: 215px;

    transform:

        translateX(-50%);

    /*

       Formato claramente ovalado.

       Parte de cima arredondada

       e parte de baixo mais estreita.

    */

    border-radius:

        50%

        50%

        46%

        46%

        /

        58%

        58%

        42%

        42%;

    background:

        #fffdf6;

    border:

        4px solid #d8c3a5;

    box-shadow:

        0 14px 25px

        rgba(80,50,25,.18),

        inset

        8px 0 12px

        rgba(255,255,255,.8),

        inset

        -8px 0 15px

        rgba(210,185,150,.12);

    overflow: hidden;

    z-index: 3;

    transition:

        transform .5s ease,

        opacity .5s ease;

}

/* ==================================================

   SOMBRA SUAVE NO CHÃO

================================================== */

.ovo-area::after {

    content: "";

    position: absolute;

    bottom: -4px;

    left: 50%;

    transform:

        translateX(-50%);

    width: 155px;

    height: 20px;

    border-radius: 50%;

    background:

        rgba(80,50,25,.12);

    filter: blur(5px);

    z-index: 1;

}

/* ==================================================

   PEQUENO BRILHO DO OVO

================================================== */

.brilho-ovo {

    position: absolute;

    left: 50%;

    top: 22px;

    transform:

        translateX(-50%);

    width: 24px;

    height: 55px;

    border-radius: 50%;

    background:

        rgba(255,255,255,.75);

    filter: blur(2px);

    z-index: 5;

    pointer-events: none;

}

/* ==================================================

   RACHADURAS

================================================== */

.rachaduras {

    position: absolute;

    inset: 0;

    z-index: 8;

    opacity: 0;

    pointer-events: none;

}

/*

   As rachaduras ficam somente

   na parte externa do ovo.

*/

.r1,

.r2,

.r3 {

    position: absolute;

    height: 3px;

    background: #b99b78;

    border-radius: 3px;

    box-shadow:

        0 0 1px rgba(0,0,0,.25);

    transform-origin: left center;

}

/* rachadura principal */

.r1 {

    width: 78px;

    left: 34px;

    top: 104px;

    transform:

        rotate(9deg);

}

.r1::after {

    content: "";

    position: absolute;

    width: 38px;

    height: 3px;

    background: #b99b78;

    border-radius: 3px;

    left: 29px;

    top: -18px;

    transform:

        rotate(-55deg);

}

/* rachadura lateral */

.r2 {

    width: 54px;

    left: 72px;

    top: 126px;

    transform:

        rotate(-28deg);

}

.r2::after {

    content: "";

    position: absolute;

    width: 28px;

    height: 3px;

    background: #b99b78;

    border-radius: 3px;

    left: 22px;

    top: 15px;

    transform:

        rotate(65deg);

}

/* rachadura inferior */

.r3 {

    width: 45px;

    left: 48px;

    top: 154px;

    transform:

        rotate(18deg);

}

/* ==================================================

   GATINHO

================================================== */

.petton {

    position: absolute;

    left: 50%;

    bottom: 18px;

    width: 135px;

    height: 135px;

    transform:

        translateX(-50%)

        scale(.15);

    opacity: 0;

    z-index: 6;

    transition:

        transform 1.2s

        cubic-bezier(.2,.8,.2,1),

        opacity .8s ease;

}

.petton img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: block;

}

/* ==================================================

   PEDAÇOS DO OVO

================================================== */

.pedaco {

    position: absolute;

    width: 42px;

    height: 42px;

    background:

        #fffdf6;

    border:

        3px solid #d8c3a5;

    opacity: 0;

    z-index: 10;

    pointer-events: none;

}

/* ==================================================

   ESTADO: RACHANDO

================================================== */

.rachando .rachaduras {

    opacity: 1;

    animation:

        aparecerRachaduras

        .8s

        ease

        forwards;

}

/* ==================================================

   ESTADO: ABRINDO

================================================== */

.abrindo .ovo {

    transform:

        translateX(-50%)

        scale(1.03);

    animation:

        tremer

        .18s

        linear

        infinite;

}

.abrindo .rachaduras {

    opacity: 1;

}

.abrindo .petton {

    opacity: .15;

    transform:

        translateX(-50%)

        scale(.28);

}

/* ==================================================

   ESTADO: NASCENDO

================================================== */

.nascendo .ovo {

    opacity: .15;

    transform:

        translateX(-50%)

        scale(1.05);

}

.nascendo .rachaduras {

    opacity: 0;

}

.nascendo .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        scale(.72);

}

/* ==================================================

   ESTADO: NASCIDO

================================================== */

.nascido .ovo {

    opacity: 0;

    transform:

        translateX(-50%)

        scale(1.15);

}

.nascido .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        scale(1);

}

/* ==================================================

   ANIMAÇÕES

================================================== */

@keyframes aparecerRachaduras {

    0% {

        opacity: 0;

    }

    100% {

        opacity: 1;

    }

}

@keyframes tremer {

    0% {

        margin-left: -2px;

    }

    50% {

        margin-left: 2px;

    }

    100% {

        margin-left: -2px;

    }

}

/* ==================================================

   TEXTO DE STATUS

================================================== */

#mensagem {

    min-height: 25px;

    margin-top: 5px;

    font-size: 17px;

    font-weight: bold;

    color: #7a5038;

}

#submensagem {

    min-height: 22px;

    margin-top: 3px;

    font-size: 14px;

    color: #888;

}

/* ==================================================

   BOTÃO

================================================== */

#botaoContinuar {

    display: none;

    margin-top: 18px;

    padding:

        13px

        25px;

    border: none;

    border-radius: 11px;

    background:

        #db2777;

    color: white;

    font-size: 16px;

    font-weight: bold;

    box-shadow:

        0 5px 12px

        rgba(219,39,119,.25);

}

.nascido #botaoContinuar {

    display: inline-block;

}

/* ==================================================

   CELULAR PEQUENO

================================================== */

@media (max-width: 420px) {

    .principal {

        padding-top: 12px;

    }

    h1 {

        font-size: 22px;

    }

    .subtitulo {

        font-size: 14px;

        margin-bottom: 10px;

    }

    .ovo-area {

        width: 210px;

        height: 275px;

    }

    .ovo {

        width: 140px;

        height: 200px;

    }

    .petton {

        width: 125px;

        height: 125px;

    }

}

/* ==================================================

   CELULAR MUITO PEQUENO

================================================== */

@media (max-height: 650px) {

    .principal {

        justify-content:

            flex-start;

        padding-top: 15px;

    }

    .ovo-area {

        height: 245px;

    }

    .subtitulo {

        margin-bottom: 5px;

    }

}

</style>

</head>

<body>

<!-- ==================================================

     TOPO

================================================== -->

<div class="topo">

    <button

        type="button"

        onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🥚 Nascimento

    </div>

    <div style="width:65px;"></div>

</div>

<!-- ==================================================

     PRINCIPAL

================================================== -->

<div class="principal">

    <h1>

        🐾 Seu Petton está chegando!

    </h1>

    <div class="subtitulo">

        Algo muito especial está prestes a acontecer...

    </div>

    <!-- ==================================================

         OVO

    ================================================== -->

    <div

        id="ovoArea"

        class="ovo-area">

        <!-- OVO -->

        <div class="ovo">

            <div class="brilho-ovo"></div>

        </div>

        <!-- RACHADURAS -->

        <div class="rachaduras">

            <div class="r1"></div>

            <div class="r2"></div>

            <div class="r3"></div>

        </div>

        <!-- PETTON -->

        <div class="petton">

            <img

                src="petton-original.png"

                alt="Petton">

        </div>

        <!-- PEDAÇOS -->

        <div

            class="pedaco"

            id="pedaco1">

        </div>

        <div

            class="pedaco"

            id="pedaco2">

        </div>

    </div>

    <!-- ==================================================

         MENSAGENS

    ================================================== -->

    <div id="mensagem">

        Seu ovo está esperando...

    </div>

    <div id="submensagem">

        Espere um pouquinho...

    </div>

    <!-- ==================================================

         BOTÃO

    ================================================== -->

    <button

        id="botaoContinuar"

        type="button"

        onclick="continuar()">

        🐾 Conhecer meu Petton

    </button>

</div>

<!-- ==================================================

     PETTON JS

================================================== -->

<script src="petton.js"></script>

<script>

/* ==================================================

   ELEMENTOS

================================================== */

const ovoArea =

    document.getElementById("ovoArea");

const mensagem =

    document.getElementById("mensagem");

const submensagem =

    document.getElementById("submensagem");

/* ==================================================

   VOLTAR

================================================== */

function voltar() {

    window.location.href =

        "index.html";

}

/* ==================================================

   CONTINUAR

================================================== */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* ==================================================

   NASCIMENTO

================================================== */

function iniciarNascimento() {

    /*

       Pequena pausa inicial

       para o usuário enxergar

       claramente o ovo.

    */

    setTimeout(function() {

        mensagem.textContent =

            "🥚 O ovo começou a rachar...";

        submensagem.textContent =

            "Tem alguma coisa lá dentro!";

        ovoArea.classList.add(

            "rachando"

        );

    }, 700);

    /*

       O ovo começa a abrir.

    */

    setTimeout(function() {

        mensagem.textContent =

            "✨ Está nascendo!";

        submensagem.textContent =

            "Seu Petton está chegando...";

        ovoArea.classList.remove(

            "rachando"

        );

        ovoArea.classList.add(

            "abrindo"

        );

    }, 3500);

    /*

       O Petton aparece.

    */

    setTimeout(function() {

        mensagem.textContent =

            "🐾 Nasceu!";

        submensagem.textContent =

            "Olha que fofinho!";

        ovoArea.classList.remove(

            "abrindo"

        );

        ovoArea.classList.add(

            "nascendo"

        );

    }, 4300);

    /*

       Nascimento concluído.

    */

    setTimeout(function() {

        mensagem.textContent =

            "💗 Seu Petton nasceu!";

        submensagem.textContent =

            "Agora começa a aventura.";

        ovoArea.classList.remove(

            "nascendo"

        );

        ovoArea.classList.add(

            "nascido"

        );

        /*

           Registra o nascimento

           no sistema central.

        */

        if (

            window.Petton &&

            typeof Petton.nascer === "function"

        ) {

            Petton.nascer();

        }

    }, 6000);

}

/* ==================================================

   GARANTIR QUE O PETTON

   EXISTE ANTES DO NASCIMENTO

================================================== */

try {

    if (

        window.Petton &&

        typeof Petton.carregar === "function"

    ) {

        Petton.carregar();

    }

} catch (erro) {

    console.log(

        "Petton ainda não carregado."

    );

}

/* ==================================================

   INICIAR

================================================== */

iniciarNascimento();

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

               initial-scale=1.0,

               maximum-scale=1.0,

               user-scalable=no">

<title>Nascimento do Petton</title>

<style>

/* ==================================================

   BASE

================================================== */

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background:

        linear-gradient(

            180deg,

            #fff8f1 0%,

            #f6e9dc 100%

        );

    font-family:

        Arial,

        sans-serif;

    color: #4b382d;

    text-align: center;

    overflow: hidden;

}

/* ==================================================

   TOPO

================================================== */

.topo {

    height: 60px;

    background: #ffffff;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-shadow:

        0 2px 10px

        rgba(0,0,0,.08);

    position: relative;

    z-index: 30;

}

.topo button {

    border: none;

    background: #333;

    color: white;

    border-radius: 9px;

    padding: 10px 13px;

    font-size: 14px;

    font-weight: bold;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

/* ==================================================

   PRINCIPAL

================================================== */

.principal {

    min-height:

        calc(100vh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 15px;

}

/* ==================================================

   TÍTULOS

================================================== */

h1 {

    margin:

        0 0 7px;

    font-size: 24px;

    color: #5a4030;

}

.subtitulo {

    margin:

        0 15px 15px;

    font-size: 15px;

    color: #8a7568;

}

/* ==================================================

   ÁREA DO OVO

================================================== */

.ovo-area {

    width: 230px;

    height: 300px;

    position: relative;

    margin: 0 auto 8px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

}

/* ==================================================

   SOMBRA NO CHÃO

================================================== */

.sombra {

    position: absolute;

    bottom: 2px;

    left: 50%;

    transform:

        translateX(-50%);

    width: 155px;

    height: 20px;

    border-radius: 50%;

    background:

        rgba(70,45,30,.14);

    filter: blur(5px);

    z-index: 1;

}

/* ==================================================

   OVO

   IMPORTANTE:

   É UMA FORMA PURA DE OVO.

   NÃO TEM IMAGEM DE GATO.

================================================== */

.ovo {

    position: absolute;

    left: 50%;

    bottom: 15px;

    width: 148px;

    height: 215px;

    transform:

        translateX(-50%);

    /*

       Formato de ovo:

       topo arredondado,

       parte inferior mais estreita.

    */

    border-radius:

        50%

        50%

        45%

        45%

        /

        58%

        58%

        42%

        42%;

    background:

        #fffdf7;

    border:

        4px solid #d9c2a2;

    box-shadow:

        0 12px 24px

        rgba(70,45,30,.16),

        inset

        10px 0 18px

        rgba(255,255,255,.8),

        inset

        -10px 0 18px

        rgba(210,185,150,.15);

    z-index: 5;

    transition:

        opacity .8s ease,

        transform .8s ease;

}

/* ==================================================

   BRILHO DO OVO

================================================== */

.brilho {

    position: absolute;

    left: 30px;

    top: 30px;

    width: 20px;

    height: 52px;

    border-radius: 50%;

    background:

        rgba(255,255,255,.8);

    transform:

        rotate(12deg);

    filter: blur(1px);

    pointer-events: none;

}

/* ==================================================

   RACHADURAS

   FICAM ESCONDIDAS NO COMEÇO.

================================================== */

.rachaduras {

    position: absolute;

    left: 50%;

    bottom: 15px;

    width: 148px;

    height: 215px;

    transform:

        translateX(-50%);

    z-index: 8;

    opacity: 0;

    pointer-events: none;

    transition:

        opacity .5s ease;

}

/* rachadura 1 */

.r1 {

    position: absolute;

    width: 65px;

    height: 4px;

    background: #b79b79;

    border-radius: 4px;

    left: 38px;

    top: 100px;

    transform:

        rotate(10deg);

}

.r1::after {

    content: "";

    position: absolute;

    width: 35px;

    height: 4px;

    background: #b79b79;

    border-radius: 4px;

    left: 26px;

    top: -16px;

    transform:

        rotate(-55deg);

}

/* rachadura 2 */

.r2 {

    position: absolute;

    width: 52px;

    height: 4px;

    background: #b79b79;

    border-radius: 4px;

    left: 63px;

    top: 125px;

    transform:

        rotate(-20deg);

}

/* rachadura 3 */

.r3 {

    position: absolute;

    width: 42px;

    height: 4px;

    background: #b79b79;

    border-radius: 4px;

    left: 43px;

    top: 150px;

    transform:

        rotate(18deg);

}

/* ==================================================

   PETTON

   TOTALMENTE INVISÍVEL NO INÍCIO.

================================================== */

.petton {

    position: absolute;

    left: 50%;

    bottom: 18px;

    width: 135px;

    height: 135px;

    transform:

        translateX(-50%)

        scale(.1);

    opacity: 0;

    z-index: 3;

    pointer-events: none;

    transition:

        opacity .8s ease,

        transform 1.2s

        cubic-bezier(.2,.8,.2,1);

}

/*

   IMPORTANTE:

   A imagem fica atrás do ovo.

   Portanto ela NÃO pode aparecer

   por cima do ovo antes da hora.

*/

.petton img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: block;

}

/* ==================================================

   ESTADO RACHANDO

================================================== */

.rachando .rachaduras {

    opacity: 1;

}

/* ==================================================

   ESTADO ABRINDO

================================================== */

.abrindo .ovo {

    animation:

        tremer

        .18s

        infinite;

    transform:

        translateX(-50%)

        scale(1.02);

}

.abrindo .rachaduras {

    opacity: 1;

}

.abrindo .petton {

    opacity: .35;

    transform:

        translateX(-50%)

        scale(.35);

    z-index: 4;

}

/* ==================================================

   ESTADO NASCENDO

================================================== */

.nascendo .ovo {

    opacity: .35;

    transform:

        translateX(-50%)

        scale(1.05);

}

.nascendo .rachaduras {

    opacity: 0;

}

.nascendo .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        scale(.72);

    z-index: 10;

}

/* ==================================================

   ESTADO NASCIDO

================================================== */

.nascido .ovo {

    opacity: 0;

    transform:

        translateX(-50%)

        scale(1.12);

}

.nascido .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        scale(1);

    z-index: 10;

}

/* ==================================================

   ANIMAÇÃO DO OVO

================================================== */

@keyframes tremer {

    0% {

        margin-left: -2px;

    }

    50% {

        margin-left: 2px;

    }

    100% {

        margin-left: -2px;

    }

}

/* ==================================================

   MENSAGENS

================================================== */

#mensagem {

    min-height: 25px;

    margin-top: 3px;

    font-size: 17px;

    font-weight: bold;

    color: #754c38;

}

#submensagem {

    min-height: 22px;

    margin-top: 2px;

    font-size: 14px;

    color: #8b786d;

}

/* ==================================================

   BOTÃO

================================================== */

#botaoContinuar {

    display: none;

    margin-top: 15px;

    padding:

        13px

        24px;

    border: none;

    border-radius: 11px;

    background: #db2777;

    color: white;

    font-size: 16px;

    font-weight: bold;

    box-shadow:

        0 5px 12px

        rgba(219,39,119,.25);

}

.nascido #botaoContinuar {

    display: inline-block;

}

/* ==================================================

   CELULAR

================================================== */

@media (max-width: 420px) {

    .principal {

        padding-top: 10px;

    }

    h1 {

        font-size: 22px;

    }

    .subtitulo {

        font-size: 14px;

        margin-bottom: 8px;

    }

    .ovo-area {

        width: 210px;

        height: 275px;

    }

    .ovo {

        width: 140px;

        height: 200px;

        bottom: 12px;

    }

    .rachaduras {

        width: 140px;

        height: 200px;

        bottom: 12px;

    }

    .petton {

        width: 125px;

        height: 125px;

    }

}

/* ==================================================

   TELAS BAIXAS

================================================== */

@media (max-height: 650px) {

    .principal {

        justify-content:

            flex-start;

        padding-top: 10px;

    }

    .ovo-area {

        height: 240px;

    }

}

</style>

</head>

<body>

<!-- ==================================================

     TOPO

================================================== -->

<div class="topo">

    <button

        type="button"

        onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🥚 Nascimento

    </div>

    <div style="width:65px;"></div>

</div>

<!-- ==================================================

     PRINCIPAL

================================================== -->

<div class="principal">

    <h1>

        🐾 Seu Petton está chegando!

    </h1>

    <div class="subtitulo">

        Algo muito especial está prestes a acontecer...

    </div>

    <!-- ==================================================

         OVO

    ================================================== -->

    <div

        id="ovoArea"

        class="ovo-area">

        <!-- SOMBRA -->

        <div class="sombra"></div>

        <!-- OVO PURO -->

        <div class="ovo">

            <div class="brilho"></div>

        </div>

        <!-- RACHADURAS -->

        <div class="rachaduras">

            <div class="r1"></div>

            <div class="r2"></div>

            <div class="r3"></div>

        </div>

        <!-- ==================================================

             PETTON

             ESCONDIDO ATRÁS DO OVO

        ================================================== -->

        <div class="petton">

            <img

                src="petton-original.png"

                alt="Petton">

        </div>

    </div>

    <!-- ==================================================

         MENSAGENS

    ================================================== -->

    <div id="mensagem">

        🥚 Seu ovo está esperando...

    </div>

    <div id="submensagem">

        Espere um pouquinho...

    </div>

    <!-- ==================================================

         CONTINUAR

    ================================================== -->

    <button

        id="botaoContinuar"

        type="button"

        onclick="continuar()">

        🐾 Conhecer meu Petton

    </button>

</div>

<!-- ==================================================

     PETTON.JS

================================================== -->

<script src="petton.js"></script>

<script>

/* ==================================================

   VOLTAR

================================================== */

function voltar() {

    window.location.href =

        "index.html";

}

/* ==================================================

   CONTINUAR

================================================== */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* ==================================================

   ELEMENTOS

================================================== */

const ovoArea =

    document.getElementById("ovoArea");

const mensagem =

    document.getElementById("mensagem");

const submensagem =

    document.getElementById("submensagem");

/* ==================================================

   NASCIMENTO

================================================== */

function iniciarNascimento() {

    /*

       PRIMEIRO MOMENTO

       O usuário vê SOMENTE o ovo.

    */

    setTimeout(function() {

        mensagem.textContent =

            "🥚 Seu ovo começou a rachar...";

        submensagem.textContent =

            "Tem alguma coisa lá dentro!";

        ovoArea.classList.add(

            "rachando"

        );

    }, 1000);

    /*

       SEGUNDO MOMENTO

       O ovo começa a tremer.

    */

    setTimeout(function() {

        mensagem.textContent =

            "✨ O ovo está abrindo!";

        submensagem.textContent =

            "Está quase na hora...";

        ovoArea.classList.remove(

            "rachando"

        );

        ovoArea.classList.add(

            "abrindo"

        );

    }, 3500);

    /*

       TERCEIRO MOMENTO

       O Petton começa a aparecer.

    */

    setTimeout(function() {

        mensagem.textContent =

            "🐾 Está nascendo!";

        submensagem.textContent =

            "Seu Petton está chegando!";

        ovoArea.classList.remove(

            "abrindo"

        );

        ovoArea.classList.add(

            "nascendo"

        );

    }, 4600);

    /*

       QUARTO MOMENTO

       Nascimento concluído.

    */

    setTimeout(function() {

        mensagem.textContent =

            "💗 Seu Petton nasceu!";

        submensagem.textContent =

            "Agora começa a aventura.";

        ovoArea.classList.remove(

            "nascendo"

        );

        ovoArea.classList.add(

            "nascido"

        );

        /*

           Salva o nascimento

           no sistema Petton.

        */

        try {

            if (

                window.Petton &&

                typeof Petton.nascer === "function"

            ) {

                Petton.nascer();

            }

        } catch (erro) {

            console.log(

                "Erro ao registrar nascimento:",

                erro

            );

        }

    }, 6500);

}

/* ==================================================

   CARREGAR PETTON

================================================== */

try {

    if (

        window.Petton &&

        typeof Petton.carregar === "function"

    ) {

        Petton.carregar();

    }

} catch (erro) {

    console.log(

        "Petton ainda não carregado."

    );

}

/* ==================================================

   INICIAR

================================================== */

iniciarNascimento();

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    background:

        radial-gradient(circle at 50% 20%, #fffdf7 0%, #f8eadc 45%, #ead6c5 100%);

    color: #3b2b25;

    overflow: hidden;

}

.topo {

    position: relative;

    z-index: 10;

    text-align: center;

    padding: 22px 15px 5px;

}

.topo h1 {

    margin: 0;

    font-size: 25px;

    font-weight: 800;

}

.topo p {

    margin: 7px 0 0;

    color: #765e54;

    font-size: 14px;

}

.area {

    position: relative;

    width: 100%;

    height: calc(100vh - 115px);

    min-height: 500px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}

.mensagem {

    position: absolute;

    top: 28px;

    width: calc(100% - 40px);

    max-width: 420px;

    text-align: center;

    font-size: 17px;

    font-weight: 700;

    line-height: 1.45;

    min-height: 52px;

}

.tempo {

    position: absolute;

    top: 92px;

    font-size: 13px;

    color: #856d61;

}

/* =========================

   OVO

========================= */

.ovo-area {

    position: relative;

    width: 260px;

    height: 310px;

    margin-top: 40px;

}

.ovo-sombra {

    position: absolute;

    width: 190px;

    height: 35px;

    left: 35px;

    bottom: 22px;

    background: rgba(75, 48, 35, .18);

    border-radius: 50%;

    filter: blur(8px);

    transition: transform .3s;

}

.ovo {

    position: absolute;

    width: 180px;

    height: 225px;

    left: 40px;

    top: 35px;

    border-radius: 52% 48% 48% 52% / 58% 58% 42% 42%;

    background:

        radial-gradient(circle at 35% 25%, #fffef8 0 7%, transparent 8%),

        linear-gradient(145deg, #fffdf4, #eee5d6);

    border: 3px solid #d7c8b5;

    box-shadow:

        inset -18px -18px 25px rgba(120, 91, 65, .10),

        inset 14px 12px 25px rgba(255,255,255,.9),

        0 18px 25px rgba(78,53,39,.12);

    transform-origin: 50% 90%;

    z-index: 3;

}

/* movimentos */

.ovo.respirando {

    animation: respirar 2.8s ease-in-out infinite;

}

.ovo.mexendo {

    animation: mexer 2s ease-in-out infinite;

}

.ovo.balancando {

    animation: balanco .75s ease-in-out infinite;

}

.ovo.forte {

    animation: forte .38s ease-in-out infinite;

}

.ovo.quebrando {

    animation: quebrando .18s linear infinite;

}

@keyframes respirar {

    0%,100% {

        transform: scale(1) rotate(0deg);

    }

    50% {

        transform: scale(1.015, .99) rotate(.5deg);

    }

}

@keyframes mexer {

    0%,100% {

        transform: rotate(0deg) translateX(0);

    }

    25% {

        transform: rotate(-2deg) translateX(-3px);

    }

    50% {

        transform: rotate(2deg) translateX(3px);

    }

    75% {

        transform: rotate(-1deg) translateX(-2px);

    }

}

@keyframes balanco {

    0%,100% {

        transform: rotate(-4deg) translateX(-5px);

    }

    50% {

        transform: rotate(4deg) translateX(5px);

    }

}

@keyframes forte {

    0%,100% {

        transform: rotate(-7deg) translateX(-8px);

    }

    50% {

        transform: rotate(7deg) translateX(8px);

    }

}

@keyframes quebrando {

    0%,100% {

        transform: translateX(-7px) rotate(-8deg);

    }

    50% {

        transform: translateX(7px) rotate(8deg);

    }

}

/* =========================

   BATIDINHAS INTERNAS

========================= */

.impacto {

    position: absolute;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background: rgba(255,255,255,.7);

    opacity: 0;

    z-index: 5;

    pointer-events: none;

}

.impacto.i1 {

    left: 105px;

    top: 65px;

}

.impacto.i2 {

    left: 155px;

    top: 100px;

}

.impacto.i3 {

    left: 83px;

    top: 125px;

}

.impacto.ativo {

    animation: batida .7s ease-out infinite;

}

@keyframes batida {

    0% {

        opacity: 0;

        transform: scale(.2);

    }

    35% {

        opacity: .8;

        transform: scale(1);

    }

    100% {

        opacity: 0;

        transform: scale(1.8);

    }

}

/* =========================

   RACHADURAS

========================= */

.rachadura {

    position: absolute;

    z-index: 7;

    opacity: 0;

    transition: opacity 1.5s ease, transform 1.5s ease;

}

.rachadura.visivel {

    opacity: 1;

}

.r1 {

    left: 87px;

    top: 78px;

    width: 3px;

    height: 55px;

    background: #8e7a68;

    transform: rotate(-12deg);

}

.r1::after {

    content: "";

    position: absolute;

    width: 3px;

    height: 28px;

    left: 14px;

    top: 24px;

    background: #8e7a68;

    transform: rotate(35deg);

}

.r2 {

    left: 125px;

    top: 45px;

    width: 3px;

    height: 48px;

    background: #8e7a68;

    transform: rotate(18deg);

}

.r2::after {

    content: "";

    position: absolute;

    width: 3px;

    height: 34px;

    left: -12px;

    top: 23px;

    background: #8e7a68;

    transform: rotate(-50deg);

}

.r3 {

    left: 147px;

    top: 94px;

    width: 3px;

    height: 72px;

    background: #8e7a68;

    transform: rotate(-20deg);

}

.r3::after {

    content: "";

    position: absolute;

    width: 3px;

    height: 38px;

    left: 13px;

    top: 31px;

    background: #8e7a68;

    transform: rotate(48deg);

}

.r4 {

    left: 69px;

    top: 138px;

    width: 3px;

    height: 50px;

    background: #8e7a68;

    transform: rotate(32deg);

}

.r4::after {

    content: "";

    position: absolute;

    width: 3px;

    height: 35px;

    left: 12px;

    top: 20px;

    background: #8e7a68;

    transform: rotate(-45deg);

}

.r5 {

    left: 125px;

    top: 156px;

    width: 3px;

    height: 52px;

    background: #8e7a68;

    transform: rotate(20deg);

}

.r5::after {

    content: "";

    position: absolute;

    width: 3px;

    height: 30px;

    left: -13px;

    top: 21px;

    background: #8e7a68;

    transform: rotate(-45deg);

}

/* =========================

   PATINHA

========================= */

.patinhas {

    position: absolute;

    z-index: 8;

    left: 96px;

    top: 103px;

    font-size: 29px;

    opacity: 0;

    transform: scale(.5);

    pointer-events: none;

}

.patinhas.aparecendo {

    animation: patinha 1.4s ease-in-out infinite;

}

@keyframes patinha {

    0%,100% {

        opacity: 0;

        transform: scale(.5) rotate(-15deg);

    }

    35% {

        opacity: 1;

        transform: scale(1) rotate(8deg);

    }

    70% {

        opacity: .8;

        transform: scale(.9) rotate(-5deg);

    }

}

/* =========================

   BRILHOS

========================= */

.brilho {

    position: absolute;

    font-size: 22px;

    opacity: 0;

    z-index: 20;

}

.b1 {

    left: 22px;

    top: 60px;

}

.b2 {

    right: 25px;

    top: 95px;

}

.b3 {

    right: 40px;

    bottom: 70px;

}

.brilho.ativo {

    animation: brilho 1.3s ease-out infinite;

}

@keyframes brilho {

    0% {

        opacity: 0;

        transform: scale(.4) rotate(0deg);

    }

    40% {

        opacity: 1;

        transform: scale(1.2) rotate(20deg);

    }

    100% {

        opacity: 0;

        transform: scale(.7) rotate(45deg);

    }

}

/* =========================

   NASCIMENTO

========================= */

.casquinha {

    position: absolute;

    z-index: 15;

    width: 95px;

    height: 80px;

    background: linear-gradient(145deg,#fffdf4,#e9dece);

    border: 3px solid #d4c4b0;

    opacity: 0;

}

.casquinha.esquerda {

    left: 40px;

    top: 85px;

    border-radius: 80% 20% 20% 50%;

    transform: rotate(-25deg);

}

.casquinha.direita {

    right: 40px;

    top: 85px;

    border-radius: 20% 80% 50% 20%;

    transform: rotate(25deg);

}

.nascido {

    position: absolute;

    left: 50%;

    top: 82px;

    transform: translateX(-50%) scale(0);

    z-index: 12;

    text-align: center;

    opacity: 0;

}

.nascido .animal {

    font-size: 105px;

    display: block;

    filter: drop-shadow(0 10px 8px rgba(0,0,0,.16));

}

.nascido .nome {

    margin-top: -3px;

    font-size: 19px;

    font-weight: 800;

}

.nascido.mostrar {

    animation: nascer .9s cubic-bezier(.2,1.4,.4,1) forwards;

}

@keyframes nascer {

    0% {

        opacity: 0;

        transform: translateX(-50%) translateY(45px) scale(.1);

    }

    70% {

        opacity: 1;

        transform: translateX(-50%) translateY(-8px) scale(1.1);

    }

    100% {

        opacity: 1;

        transform: translateX(-50%) translateY(0) scale(1);

    }

}

.ovo.nasceu {

    animation: ovoSumir .8s ease forwards;

}

@keyframes ovoSumir {

    to {

        opacity: 0;

        transform: scale(.5) rotate(20deg);

    }

}

.casquinha.mostrar {

    animation: casca .8s ease forwards;

}

@keyframes casca {

    0% {

        opacity: 1;

    }

    100% {

        opacity: 0;

    }

}

/* =========================

   BOTÃO

========================= */

.botao {

    position: absolute;

    bottom: 25px;

    border: 0;

    background: #6d4c41;

    color: white;

    padding: 13px 24px;

    border-radius: 30px;

    font-size: 15px;

    font-weight: 700;

    box-shadow: 0 7px 15px rgba(80,50,40,.2);

    cursor: pointer;

}

.botao:active {

    transform: scale(.96);

}

.oculto {

    display: none !important;

}

/* =========================

   RESPONSIVO

========================= */

@media (max-height: 650px) {

    .ovo-area {

        transform: scale(.85);

        margin-top: 15px;

    }

    .mensagem {

        top: 12px;

    }

    .tempo {

        top: 72px;

    }

    .botao {

        bottom: 12px;

    }

}

</style>

</head>

<body>

<div class="topo">

    <h1>🥚 O nascimento do Petton</h1>

    <p>Será que você consegue descobrir o que está lá dentro?</p>

</div>

<div class="area">

    <div class="mensagem" id="mensagem">

        Parece que tem alguma coisa se mexendo lá dentro...

    </div>

    <div class="tempo" id="tempo">

        O ovo está se preparando...

    </div>

    <div class="ovo-area" id="ovoArea">

        <div class="brilho b1">✨</div>

        <div class="brilho b2">✨</div>

        <div class="brilho b3">✨</div>

        <div class="ovo-sombra" id="sombra"></div>

        <div class="ovo respirando" id="ovo">

            <div class="impacto i1" id="impacto1"></div>

            <div class="impacto i2" id="impacto2"></div>

            <div class="impacto i3" id="impacto3"></div>

        </div>

        <div class="rachadura r1" id="r1"></div>

        <div class="rachadura r2" id="r2"></div>

        <div class="rachadura r3" id="r3"></div>

        <div class="rachadura r4" id="r4"></div>

        <div class="rachadura r5" id="r5"></div>

        <div class="patinhas" id="patinhas">🐾</div>

        <div class="casquinha esquerda" id="cascaEsq"></div>

        <div class="casquinha direita" id="cascaDir"></div>

        <div class="nascido" id="nascido">

            <span class="animal" id="animal">🐾</span>

            <div class="nome" id="nomePetton"></div>

        </div>

    </div>

    <button class="botao oculto" id="botaoEntrar" onclick="irParaPetton()">

        🐾 Conhecer meu Petton

    </button>

</div>

<script src="petton.js"></script>

<script>

const TEMPO_NASCIMENTO = 10 * 60 * 1000;

// ↑ 10 minutos para teste.

// Depois podemos mudar para várias horas ou 1 dia.

let ovo = document.getElementById("ovo");

let mensagem = document.getElementById("mensagem");

let tempo = document.getElementById("tempo");

let pettonAtual = Petton.dados;

let especie = escolherEspecie();

function escolherEspecie() {

    /*

     * A espécie é escolhida uma única vez.

     * Depois fica salva no Petton.

     */

    if (!pettonAtual.especie) {

        const especies = [

            "gato",

            "cachorro",

            "coelho"

        ];

        const sorteada =

            especies[Math.floor(Math.random() * especies.length)];

        pettonAtual.especie = sorteada;

        Petton.salvar();

    }

    return pettonAtual.especie;

}

function animalEmoji() {

    if (especie === "gato") return "🐱";

    if (especie === "cachorro") return "🐶";

    if (especie === "coelho") return "🐰";

    return "🐾";

}

function atualizarNascimento() {

    pettonAtual = Petton.dados;

    /*

     * Se já nasceu, não mostra o ovo novamente.

     */

    if (pettonAtual.fase !== "ovo") {

        mensagem.textContent =

            "Seu Petton já nasceu! ❤️";

        tempo.textContent =

            "Vamos conhecer seu Petton.";

        document.getElementById("ovoArea")

            .style.display = "none";

        document.getElementById("botaoEntrar")

            .classList.remove("oculto");

        return;

    }

    if (!pettonAtual.dataOvo) {

        pettonAtual.dataOvo = Date.now();

        Petton.salvar();

    }

    const passado =

        Date.now() - new Date(pettonAtual.dataOvo).getTime();

    let progresso =

        Math.max(0, Math.min(1, passado / TEMPO_NASCIMENTO));

    atualizarVisual(progresso);

    if (progresso >= 1) {

        realizarNascimento();

    }

}

function atualizarVisual(progresso) {

    const percentual = Math.floor(progresso * 100);

    /*

     * FASE 1

     * Ovo praticamente parado.

     */

    if (progresso < .15) {

        ovo.className = "ovo respirando";

        mensagem.textContent =

            "🥚 O ovo está quietinho...";

        tempo.textContent =

            "Talvez tenha alguém dormindo lá dentro.";

        esconderImpactos();

        return;

    }

    /*

     * FASE 2

     * Pequenos movimentos.

     */

    if (progresso < .35) {

        ovo.className = "ovo mexendo";

        mensagem.textContent =

            "👀 Espera... o ovo acabou de se mexer!";

        tempo.textContent =

            "Tem alguma coisa lá dentro.";

        mostrarImpacto("impacto1");

        return;

    }

    /*

     * FASE 3

     * Primeiras rachaduras.

     */

    if (progresso < .55) {

        ovo.className = "ovo mexendo";

        mostrarRachadura(1);

        mensagem.textContent =

            "😮 Apareceu uma rachadura!";

        tempo.textContent =

            "Será que ele está tentando sair?";

        alternarImpactos();

        return;

    }

    /*

     * FASE 4

     * Ovo balançando.

     */

    if (progresso < .72) {

        ovo.className = "ovo balancando";

        mostrarRachadura(1);

        mostrarRachadura(2);

        mensagem.textContent =

            "🐾 Tem alguém empurrando por dentro!";

        tempo.textContent =

            "O ovo está ficando cada vez mais agitado.";

        alternarImpactos();

        return;

    }

    /*

     * FASE 5

     * Forte movimento.

     */

    if (progresso < .88) {

        ovo.className = "ovo forte";

        mostrarRachadura(1);

        mostrarRachadura(2);

        mostrarRachadura(3);

        mostrarRachadura(4);

        document.getElementById("patinhas")

            .classList.add("aparecendo");

        mensagem.textContent =

            "😳 Ele quer muito sair!";

        tempo.textContent =

            "O nascimento está chegando...";

        alternarImpactos();

        return;

    }

    /*

     * FASE 6

     * Quase nascendo.

     */

    if (progresso < 1) {

        ovo.className = "ovo quebrando";

        mostrarRachadura(1);

        mostrarRachadura(2);

        mostrarRachadura(3);

        mostrarRachadura(4);

        mostrarRachadura(5);

        document.getElementById("patinhas")

            .classList.add("aparecendo");

        ativarBrilhos();

        mensagem.textContent =

            "💥 Ele está tentando sair!";

        tempo.textContent =

            "Está quase na hora de descobrir quem está aí...";

        alternarImpactos();

    }

}

function mostrarRachadura(numero) {

    const elemento =

        document.getElementById("r" + numero);

    if (elemento) {

        elemento.classList.add("visivel");

    }

}

function mostrarImpacto(id) {

    const elemento =

        document.getElementById(id);

    if (elemento) {

        elemento.classList.add("ativo");

    }

}

function esconderImpactos() {

    document.querySelectorAll(".impacto")

        .forEach(function(el) {

            el.classList.remove("ativo");

        });

}

function alternarImpactos() {

    document.getElementById("impacto1")

        .classList.add("ativo");

    setTimeout(function() {

        document.getElementById("impacto2")

            .classList.add("ativo");

    }, 250);

    setTimeout(function() {

        document.getElementById("impacto3")

            .classList.add("ativo");

    }, 500);

}

function ativarBrilhos() {

    document.querySelectorAll(".brilho")

        .forEach(function(el) {

            el.classList.add("ativo");

        });

}

function realizarNascimento() {

    if (Petton.dados.fase !== "ovo") return;

    /*

     * Agora o Petton finalmente nasce.

     */

    Petton.nascer();

    ovo.classList.add("nasceu");

    document.getElementById("cascaEsq")

        .classList.add("mostrar");

    document.getElementById("cascaDir")

        .classList.add("mostrar");

    document.getElementById("patinhas")

        .style.opacity = "0";

    const nascido =

        document.getElementById("nascido");

    document.getElementById("animal")

        .textContent = animalEmoji();

    document.getElementById("nomePetton")

        .textContent = Petton.dados.nome;

    mensagem.textContent =

        "🎉 NASCEU!";

    tempo.textContent =

        "Você finalmente descobriu seu Petton! ❤️";

    nascido.classList.add("mostrar");

    ativarBrilhos();

    setTimeout(function() {

        document.getElementById("botaoEntrar")

            .classList.remove("oculto");

    }, 1800);

}

function irParaPetton() {

    window.location.href = "index.html";

}

/*

 * Atualiza várias vezes por segundo

 * para deixar os movimentos naturais.

 */

setInterval(atualizarNascimento, 500);

atualizarNascimento();

</script>

</body>

</html>

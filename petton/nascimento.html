<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<title>Nascimento do Petton</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    min-height:100vh;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #fffaf3 0%,

            #f5e6d5 100%

        );

    color:#333;

}

.container{

    width:100%;

    max-width:600px;

    margin:auto;

    padding:18px;

}

/* =========================

   TOPO

========================= */

.topo{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;

}

.voltar{

    width:44px;

    height:44px;

    border:0;

    border-radius:14px;

    background:white;

    font-size:23px;

    box-shadow:

        0 3px 12px rgba(0,0,0,.08);

}

.titulo{

    flex:1;

}

.titulo h1{

    margin:0;

    font-size:23px;

}

.titulo p{

    margin:3px 0 0;

    font-size:12px;

    color:#888;

}

/* =========================

   MENSAGEM

========================= */

.mensagem{

    text-align:center;

    min-height:58px;

    margin:10px 0;

}

.mensagem h2{

    margin:0;

    font-size:21px;

}

.mensagem p{

    margin:6px 0;

    font-size:13px;

    color:#777;

}

/* =========================

   CENA

========================= */

.cena{

    position:relative;

    width:100%;

    height:430px;

    overflow:hidden;

    border-radius:28px;

    background:

        radial-gradient(

            circle at 50% 35%,

            #ffffff 0%,

            #fff6ec 45%,

            #f0ddc5 100%

        );

    box-shadow:

        0 8px 28px rgba(0,0,0,.10);

}

/* =========================

   CHÃO

========================= */

.chao{

    position:absolute;

    left:8%;

    bottom:35px;

    width:84%;

    height:28px;

    border-radius:50%;

    background:

        rgba(130,90,50,.16);

}

/* =========================

   BRILHO

========================= */

.brilho{

    position:absolute;

    left:50%;

    top:47%;

    width:260px;

    height:260px;

    transform:

        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(

            circle,

            rgba(255,255,255,.95),

            rgba(255,255,255,0)

        );

    opacity:0;

    pointer-events:none;

}

/* =================================================

   OVO

================================================= */

.ovo-area{

    position:absolute;

    left:50%;

    bottom:55px;

    width:210px;

    height:285px;

    transform:

        translateX(-50%);

    z-index:5;

}

/* OVO PRINCIPAL */

.ovo{

    position:absolute;

    left:50%;

    bottom:0;

    width:150px;

    height:215px;

    transform:

        translateX(-50%);

    /*

       FORMATO DE OVO:

       mais estreito em cima,

       mais largo embaixo.

    */

    border-radius:

        50% 50%

        46% 46%

        44% 44% / 

        58% 58%

        42% 42%;

    background:

        linear-gradient(

            145deg,

            #fffefa 0%,

            #fff8ec 48%,

            #e8d1b2 100%

        );

    box-shadow:

        inset

        10px 10px 18px

        rgba(255,255,255,.95),

        inset

        -14px -18px 25px

        rgba(120,80,40,.14),

        0 14px 25px

        rgba(80,50,25,.20);

}

/*

   BRILHO NATURAL DO OVO

*/

.ovo::before{

    content:"";

    position:absolute;

    left:28px;

    top:25px;

    width:25px;

    height:75px;

    border-radius:50%;

    background:

        rgba(255,255,255,.75);

    transform:

        rotate(-20deg);

}

/*

   PEQUENO BRILHO

*/

.ovo::after{

    content:"";

    position:absolute;

    left:51px;

    top:20px;

    width:9px;

    height:9px;

    border-radius:50%;

    background:white;

    opacity:.9;

}

/* =========================

   RACHADURAS

========================= */

.rachaduras{

    position:absolute;

    inset:0;

    opacity:0;

    pointer-events:none;

    transition:

        opacity .4s ease;

}

/*

   RACHADURA CENTRAL

*/

.r1{

    position:absolute;

    left:72px;

    top:48px;

    width:5px;

    height:105px;

    background:#a98b69;

    border-radius:5px;

    transform:rotate(12deg);

}

.r1::before{

    content:"";

    position:absolute;

    left:-20px;

    top:35px;

    width:45px;

    height:5px;

    background:#a98b69;

    border-radius:5px;

    transform:rotate(-27deg);

}

.r1::after{

    content:"";

    position:absolute;

    left:6px;

    top:62px;

    width:38px;

    height:5px;

    background:#a98b69;

    border-radius:5px;

    transform:rotate(32deg);

}

/*

   RACHADURA DIREITA

*/

.r2{

    position:absolute;

    right:48px;

    top:95px;

    width:5px;

    height:78px;

    background:#a98b69;

    border-radius:5px;

    transform:rotate(-20deg);

}

.r2::before{

    content:"";

    position:absolute;

    left:-19px;

    top:25px;

    width:40px;

    height:5px;

    background:#a98b69;

    border-radius:5px;

    transform:rotate(24deg);

}

/*

   RACHADURA INFERIOR

*/

.r3{

    position:absolute;

    left:48px;

    bottom:45px;

    width:70px;

    height:5px;

    background:#a98b69;

    border-radius:5px;

    transform:rotate(-8deg);

}

.r3::after{

    content:"";

    position:absolute;

    right:10px;

    top:-22px;

    width:5px;

    height:38px;

    background:#a98b69;

    border-radius:5px;

    transform:rotate(25deg);

}

/* =========================

   TREMER

========================= */

.cena.rachando .ovo{

    animation:

        tremer .16s infinite;

}

.cena.rachando .rachaduras{

    opacity:1;

}

/* =========================

   ABERTURA

========================= */

.cena.abrindo .ovo{

    animation:

        abrirOvo .9s forwards;

}

.cena.abrindo .rachaduras{

    opacity:1;

}

/* =========================

   PETTON

========================= */

.petton{

    position:absolute;

    left:50%;

    bottom:60px;

    width:115px;

    height:130px;

    transform:

        translateX(-50%)

        scale(.15);

    opacity:0;

    z-index:10;

    transition:

        opacity .6s ease,

        transform 1.1s cubic-bezier(.2,.8,.2,1),

        bottom 1.1s ease;

}

.petton img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

    filter:

        drop-shadow(

            0 8px 5px rgba(0,0,0,.20)

        );

}

/* PETTON SAINDO */

.cena.nascendo .petton{

    opacity:1;

    bottom:95px;

    transform:

        translateX(-50%)

        scale(.62);

}

.cena.nascendo .brilho{

    opacity:1;

    animation:

        pulsar 1.5s infinite;

}

/* PETTON NASCIDO */

.cena.nascido .petton{

    opacity:1;

    bottom:75px;

    transform:

        translateX(-50%)

        scale(1);

}

.cena.nascido .brilho{

    opacity:.4;

}

/* =========================

   PEDAÇOS DO OVO

========================= */

.pedaco{

    position:absolute;

    width:40px;

    height:32px;

    background:

        linear-gradient(

            135deg,

            #fffaf0,

            #dfc7a7

        );

    border-radius:

        55% 45%

        60% 40%;

    opacity:0;

    z-index:8;

}

.pedaco1{

    left:17px;

    top:110px;

    transform:rotate(-30deg);

}

.pedaco2{

    right:12px;

    top:92px;

    transform:rotate(28deg);

}

.pedaco3{

    left:35px;

    bottom:22px;

    transform:rotate(20deg);

}

.pedaco4{

    right:35px;

    bottom:32px;

    transform:rotate(-25deg);

}

.cena.abrindo .pedaco{

    opacity:1;

    animation:

        voarPedaco .8s forwards;

}

/* =========================

   ANIMAÇÕES

========================= */

@keyframes tremer{

    0%{

        transform:

            translateX(-50%)

            rotate(0deg);

    }

    25%{

        transform:

            translateX(-50%)

            rotate(-2deg);

    }

    50%{

        transform:

            translateX(-50%)

            rotate(2deg);

    }

    75%{

        transform:

            translateX(-50%)

            rotate(-1deg);

    }

    100%{

        transform:

            translateX(-50%)

            rotate(0deg);

    }

}

@keyframes abrirOvo{

    0%{

        transform:

            translateX(-50%)

            scale(1);

        opacity:1;

    }

    100%{

        transform:

            translateX(-50%)

            scale(.55)

            translateY(35px);

        opacity:0;

    }

}

@keyframes voarPedaco{

    0%{

        opacity:1;

        transform:

            translate(0,0)

            rotate(0deg);

    }

    100%{

        opacity:0;

        transform:

            translate(

                calc(var(--x, 25px)),

                -45px

            )

            rotate(35deg);

    }

}

@keyframes pulsar{

    0%,100%{

        transform:

            translate(-50%,-50%)

            scale(.8);

        opacity:.2;

    }

    50%{

        transform:

            translate(-50%,-50%)

            scale(1.15);

        opacity:.8;

    }

}

/* =========================

   BOTÃO

========================= */

.botao{

    display:block;

    width:100%;

    max-width:320px;

    margin:18px auto 0;

    padding:14px 20px;

    border:0;

    border-radius:15px;

    background:#e88945;

    color:white;

    font-size:16px;

    font-weight:700;

    box-shadow:

        0 5px 15px

        rgba(200,110,50,.25);

    touch-action:manipulation;

}

.botao:active{

    transform:scale(.97);

}

.botao:disabled{

    opacity:.55;

}

/* =========================

   CELULAR

========================= */

@media(max-width:420px){

    .cena{

        height:390px;

    }

    .ovo-area{

        bottom:45px;

    }

    .ovo{

        width:135px;

        height:195px;

    }

    .petton{

        width:105px;

        height:115px;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- =========================

     TOPO

========================= -->

<div class="topo">

    <button

        class="voltar"

        onclick="voltar()"

    >

        ←

    </button>

    <div class="titulo">

        <h1>

            🥚 Nascimento

        </h1>

        <p>

            Um novo Petton está chegando...

        </p>

    </div>

</div>

<!-- =========================

     MENSAGEM

========================= -->

<div

    id="mensagem"

    class="mensagem"

>

    <h2>

        🥚 Seu Petton está no ovo!

    </h2>

    <p>

        Prepare-se para conhecer seu novo amigo. ❤️

    </p>

</div>

<!-- =========================

     CENA

========================= -->

<div

    id="cena"

    class="cena"

>

    <div class="brilho"></div>

    <div class="chao"></div>

    <!-- OVO -->

    <div class="ovo-area">

        <div class="ovo">

            <div class="rachaduras">

                <div class="r1"></div>

                <div class="r2"></div>

                <div class="r3"></div>

            </div>

        </div>

        <!-- PEDAÇOS -->

        <div class="pedaco pedaco1"></div>

        <div class="pedaco pedaco2"></div>

        <div class="pedaco pedaco3"></div>

        <div class="pedaco pedaco4"></div>

    </div>

    <!-- PETTON -->

    <div

        id="petton"

        class="petton"

    >

        <img

            src="petton-original.png"

            alt="Petton"

        >

    </div>

</div>

<!-- =========================

     BOTÃO

========================= -->

<button

    id="botao"

    class="botao"

    onclick="comecarNascimento()"

>

    🐣 Começar nascimento

</button>

</div>

<script src="petton.js"></script>

<script>

/* =================================================

   ELEMENTOS

================================================= */

const cena =

    document.getElementById("cena");

const mensagem =

    document.getElementById("mensagem");

const botao =

    document.getElementById("botao");

let nascimentoIniciado =

    false;

/* =================================================

   VOLTAR

================================================= */

function voltar(){

    window.location.href =

        "index.html";

}

/* =================================================

   NASCIMENTO

================================================= */

function comecarNascimento(){

    if(nascimentoIniciado){

        return;

    }

    nascimentoIniciado = true;

    botao.disabled = true;

    botao.textContent =

        "🥚 O ovo está mexendo...";

    /* =========================

       1 — COMEÇA

    ========================= */

    setTimeout(function(){

        cena.classList.add(

            "rachando"

        );

        mensagem.innerHTML = `

            <h2>

                🥚 O ovo está mexendo...

            </h2>

            <p>

                Tem alguma coisa lá dentro! 👀

            </p>

        `;

    },500);

    /* =========================

       2 — RACHADURAS

    ========================= */

    setTimeout(function(){

        mensagem.innerHTML = `

            <h2>

                💥 O ovo está rachando!

            </h2>

            <p>

                Está quase na hora!

            </p>

        `;

        botao.textContent =

            "💥 Está rachando...";

    },1800);

    /* =========================

       3 — ABRE

    ========================= */

    setTimeout(function(){

        cena.classList.remove(

            "rachando"

        );

        cena.classList.add(

            "abrindo"

        );

        mensagem.innerHTML = `

            <h2>

                ✨ O ovo abriu!

            </h2>

            <p>

                O que será que tem dentro?

            </p>

        `;

    },3500);

    /* =========================

       4 — PETTON APARECE

    ========================= */

    setTimeout(function(){

        cena.classList.add(

            "nascendo"

        );

        mensagem.innerHTML = `

            <h2>

                🐣 Nasceu!

            </h2>

            <p>

                Seu pequeno Petton chegou!

            </p>

        `;

    },4300);

    /* =========================

       5 — PETTON FICA VISÍVEL

    ========================= */

    setTimeout(function(){

        cena.classList.add(

            "nascido"

        );

        mensagem.innerHTML = `

            <h2>

                🐱 Bem-vindo, Petton! ❤️

            </h2>

            <p>

                Hoje começa a história de vocês.

            </p>

        `;

        botao.disabled = false;

        botao.textContent =

            "🏠 Ir para o quarto";

        botao.onclick =

            function(){

                window.location.href =

                    "quarto.html";

            };

        /* =========================

           REGISTRAR NASCIMENTO

        ========================= */

        try{

            if(

                window.Petton &&

                typeof Petton.nascer ===

                "function"

            ){

                Petton.nascer();

            }

        }catch(e){

            console.log(

                "Erro ao registrar nascimento:",

                e

            );

        }

    },6000);

}

</script>

</body>

</html>

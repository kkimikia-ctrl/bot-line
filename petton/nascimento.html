<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

      initial-scale=1.0,

      maximum-scale=1.0,

      user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background:

        linear-gradient(

            180deg,

            #fffaf5,

            #f6e9dc

        );

    font-family: Arial, sans-serif;

    color: #4b382d;

    text-align: center;

    overflow: hidden;

}

/* ==================================================

   TOPO

================================================== */

.topo {

    height: 60px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-shadow:

        0 2px 10px rgba(0,0,0,.08);

    position: relative;

    z-index: 20;

}

.topo button {

    border: none;

    background: #333;

    color: white;

    border-radius: 9px;

    padding: 10px 13px;

    font-size: 14px;

    font-weight: bold;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

/* ==================================================

   PRINCIPAL

================================================== */

.principal {

    min-height:

        calc(100vh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 15px;

}

/* ==================================================

   TÍTULO

================================================== */

h1 {

    margin: 0 0 7px;

    font-size: 24px;

    color: #5b4030;

}

.subtitulo {

    margin: 0 0 15px;

    font-size: 15px;

    color: #8a7568;

}

/* ==================================================

   CENA

================================================== */

.cena {

    position: relative;

    width: 240px;

    height: 300px;

    margin: 0 auto;

}

/* ==================================================

   SOMBRA

================================================== */

.sombra {

    position: absolute;

    bottom: 10px;

    left: 50%;

    transform:

        translateX(-50%);

    width: 145px;

    height: 18px;

    border-radius: 50%;

    background:

        rgba(50,35,25,.13);

    filter: blur(5px);

    z-index: 1;

}

/* ==================================================

   OVO

   SOMENTE O OVO.

   NENHUMA IMAGEM DENTRO.

================================================== */

.ovo {

    position: absolute;

    left: 50%;

    bottom: 18px;

    transform:

        translateX(-50%);

    width: 145px;

    height: 205px;

    background: #fffdf7;

    border: 4px solid #d7c09e;

    border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;

    box-shadow:

        0 12px 22px rgba(70,45,25,.16);

    z-index: 5;

    transition:

        opacity .8s ease,

        transform .8s ease;

}

/* brilho simples */

.ovo::after {

    content: "";

    position: absolute;

    left: 25px;

    top: 28px;

    width: 16px;

    height: 42px;

    background:

        rgba(255,255,255,.8);

    border-radius: 50%;

    transform:

        rotate(-15deg);

}

/* ==================================================

   RACHADURAS

================================================== */

.rachaduras {

    position: absolute;

    left: 50%;

    bottom: 18px;

    width: 145px;

    height: 205px;

    transform:

        translateX(-50%);

    z-index: 7;

    opacity: 0;

    pointer-events: none;

}

.rachadura {

    position: absolute;

    height: 4px;

    background: #aa8c68;

    border-radius: 4px;

    transform-origin: left center;

}

/* rachadura principal */

.r1 {

    width: 62px;

    left: 39px;

    top: 99px;

    transform:

        rotate(8deg);

}

.r1b {

    position: absolute;

    width: 35px;

    height: 4px;

    left: 72px;

    top: 82px;

    background: #aa8c68;

    border-radius: 4px;

    transform:

        rotate(-48deg);

}

/* rachadura direita */

.r2 {

    width: 48px;

    left: 69px;

    top: 126px;

    transform:

        rotate(-20deg);

}

/* rachadura esquerda */

.r3 {

    width: 38px;

    left: 42px;

    top: 150px;

    transform:

        rotate(20deg);

}

/* ==================================================

   PETTON

   NÃO EXISTE VISUALMENTE

   ATÉ O NASCIMENTO.

================================================== */

.petton {

    position: absolute;

    left: 50%;

    bottom: 12px;

    width: 140px;

    height: 140px;

    transform:

        translateX(-50%)

        translateY(70px)

        scale(.3);

    opacity: 0;

    z-index: 3;

    pointer-events: none;

    transition:

        opacity .8s ease,

        transform 1.2s ease;

}

.petton img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: contain;

}

/* ==================================================

   RACHANDO

================================================== */

.rachando .rachaduras {

    opacity: 1;

}

/* ==================================================

   ABRINDO

================================================== */

.abrindo .ovo {

    animation:

        tremer

        .16s

        infinite;

}

.abrindo .rachaduras {

    opacity: 1;

}

/* ==================================================

   NASCENDO

================================================== */

.nascendo .ovo {

    opacity: .15;

    transform:

        translateX(-50%)

        scale(1.03);

}

.nascendo .rachaduras {

    opacity: 0;

}

.nascendo .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0)

        scale(.65);

    z-index: 10;

}

/* ==================================================

   NASCIDO

================================================== */

.nascido .ovo {

    opacity: 0;

    transform:

        translateX(-50%)

        scale(1.1);

}

.nascido .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0)

        scale(1);

    z-index: 10;

}

/* ==================================================

   ANIMAÇÃO

================================================== */

@keyframes tremer {

    0% {

        margin-left: -2px;

    }

    50% {

        margin-left: 2px;

    }

    100% {

        margin-left: -2px;

    }

}

/* ==================================================

   MENSAGENS

================================================== */

#mensagem {

    min-height: 25px;

    margin-top: 3px;

    font-size: 17px;

    font-weight: bold;

    color: #754c38;

}

#submensagem {

    min-height: 22px;

    margin-top: 2px;

    font-size: 14px;

    color: #8b786d;

}

/* ==================================================

   BOTÃO

================================================== */

#botaoContinuar {

    display: none;

    margin-top: 15px;

    padding: 13px 24px;

    border: none;

    border-radius: 11px;

    background: #db2777;

    color: white;

    font-size: 16px;

    font-weight: bold;

}

.nascido #botaoContinuar {

    display: inline-block;

}

/* ==================================================

   CELULAR

================================================== */

@media (max-width: 420px) {

    .principal {

        padding-top: 10px;

    }

    h1 {

        font-size: 22px;

    }

    .subtitulo {

        font-size: 14px;

        margin-bottom: 8px;

    }

    .cena {

        width: 215px;

        height: 275px;

    }

    .ovo,

    .rachaduras {

        width: 135px;

        height: 195px;

    }

    .petton {

        width: 130px;

        height: 130px;

    }

}

</style>

</head>

<body>

<!-- ==================================================

     TOPO

================================================== -->

<div class="topo">

    <button

        type="button"

        onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🥚 Nascimento

    </div>

    <div style="width:65px;"></div>

</div>

<!-- ==================================================

     PRINCIPAL

================================================== -->

<div class="principal">

    <h1>

        🐾 Seu Petton está chegando!

    </h1>

    <div class="subtitulo">

        Algo muito especial está prestes a acontecer...

    </div>

    <!-- ==================================================

         CENA

    ================================================== -->

    <div

        id="cena"

        class="cena">

        <!-- SOMBRA -->

        <div class="sombra"></div>

        <!-- ==================================================

             PETTON

             ATRÁS DE TUDO.

             INVISÍVEL NO INÍCIO.

        ================================================== -->

        <div class="petton">

            <img

                src="petton-original.png"

                alt="Petton">

        </div>

        <!-- ==================================================

             OVO

        ================================================== -->

        <div class="ovo"></div>

        <!-- ==================================================

             RACHADURAS

        ================================================== -->

        <div class="rachaduras">

            <div class="rachadura r1"></div>

            <div class="r1b"></div>

            <div class="rachadura r2"></div>

            <div class="rachadura r3"></div>

        </div>

    </div>

    <!-- ==================================================

         MENSAGEM

    ================================================== -->

    <div id="mensagem">

        🥚 Seu ovo está esperando...

    </div>

    <div id="submensagem">

        Espere um pouquinho...

    </div>

    <!-- ==================================================

         BOTÃO

    ================================================== -->

    <button

        id="botaoContinuar"

        type="button"

        onclick="continuar()">

        🐾 Conhecer meu Petton

    </button>

</div>

<!-- ==================================================

     PETTON.JS

================================================== -->

<script src="petton.js"></script>

<script>

/* ==================================================

   VOLTAR

================================================== */

function voltar() {

    window.location.href =

        "index.html";

}

/* ==================================================

   CONTINUAR

================================================== */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* ==================================================

   ELEMENTOS

================================================== */

const cena =

    document.getElementById("cena");

const mensagem =

    document.getElementById("mensagem");

const submensagem =

    document.getElementById("submensagem");

/* ==================================================

   ANIMAÇÃO DO NASCIMENTO

================================================== */

function iniciarNascimento() {

    /* -----------------------------------------------

       1 — OVO SOZINHO

    ------------------------------------------------ */

    setTimeout(function() {

        mensagem.textContent =

            "🥚 Seu ovo começou a rachar...";

        submensagem.textContent =

            "Tem alguma coisa lá dentro!";

        cena.classList.add(

            "rachando"

        );

    }, 1500);

    /* -----------------------------------------------

       2 — OVO ABRINDO

    ------------------------------------------------ */

    setTimeout(function() {

        mensagem.textContent =

            "✨ O ovo está abrindo!";

        submensagem.textContent =

            "Está quase na hora...";

        cena.classList.remove(

            "rachando"

        );

        cena.classList.add(

            "abrindo"

        );

    }, 3600);

    /* -----------------------------------------------

       3 — PETTON APARECE

    ------------------------------------------------ */

    setTimeout(function() {

        mensagem.textContent =

            "🐾 Está nascendo!";

        submensagem.textContent =

            "Seu Petton está chegando!";

        cena.classList.remove(

            "abrindo"

        );

        cena.classList.add(

            "nascendo"

        );

    }, 4800);

    /* -----------------------------------------------

       4 — NASCIMENTO COMPLETO

    ------------------------------------------------ */

    setTimeout(function() {

        mensagem.textContent =

            "💗 Seu Petton nasceu!";

        submensagem.textContent =

            "Agora começa a aventura.";

        cena.classList.remove(

            "nascendo"

        );

        cena.classList.add(

            "nascido"

        );

        /* Registrar nascimento */

        try {

            if (

                window.Petton &&

                typeof Petton.nascer === "function"

            ) {

                Petton.nascer();

            }

        } catch (erro) {

            console.log(

                "Erro ao registrar nascimento:",

                erro

            );

        }

    }, 6500);

}

/* ==================================================

   CARREGAR PETTON

================================================== */

try {

    if (

        window.Petton &&

        typeof Petton.carregar === "function"

    ) {

        Petton.carregar();

    }

} catch (erro) {

    console.log(

        "Petton ainda não carregado."

    );

}

/* ==================================================

   INICIAR

================================================== */

iniciarNascimento();

</script>

</body>

</html>

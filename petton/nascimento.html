<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

               initial-scale=1.0,

               maximum-scale=1.0,

               user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background:

        linear-gradient(

            180deg,

            #fffaf5 0%,

            #f7eadf 100%

        );

    font-family: Arial, sans-serif;

    color: #4b382d;

    text-align: center;

    overflow: hidden;

}

/* ==================================================

   TOPO

================================================== */

.topo {

    height: 60px;

    background: #fff;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-shadow:

        0 2px 10px rgba(0,0,0,.08);

    position: relative;

    z-index: 50;

}

.topo button {

    border: none;

    background: #333;

    color: white;

    border-radius: 9px;

    padding: 10px 13px;

    font-size: 14px;

    font-weight: bold;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

/* ==================================================

   PRINCIPAL

================================================== */

.principal {

    min-height:

        calc(100vh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 15px;

}

/* ==================================================

   TÍTULO

================================================== */

h1 {

    margin: 0 0 7px;

    font-size: 24px;

    color: #5b4030;

}

.subtitulo {

    margin: 0 0 15px;

    font-size: 15px;

    color: #8a7568;

}

/* ==================================================

   ÁREA DA ANIMAÇÃO

================================================== */

.cena {

    position: relative;

    width: 250px;

    height: 300px;

    margin: 0 auto;

}

/* ==================================================

   SOMBRA

================================================== */

.sombra {

    position: absolute;

    bottom: 8px;

    left: 50%;

    transform:

        translateX(-50%);

    width: 155px;

    height: 20px;

    border-radius: 50%;

    background:

        rgba(60,40,25,.15);

    filter: blur(6px);

    z-index: 1;

}

/* ==================================================

   PETTON

   FICA ATRÁS DO OVO.

   INVISÍVEL NO COMEÇO.

================================================== */

.petton {

    position: absolute;

    left: 50%;

    bottom: 15px;

    width: 150px;

    height: 150px;

    transform:

        translateX(-50%)

        translateY(30px)

        scale(.45);

    opacity: 0;

    z-index: 3;

    transition:

        opacity .8s ease,

        transform 1.2s

        cubic-bezier(.2,.8,.2,1);

    pointer-events: none;

}

.petton img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    display: block;

}

/* ==================================================

   OVO SVG

================================================== */

.ovo {

    position: absolute;

    left: 50%;

    bottom: 15px;

    width: 165px;

    height: 235px;

    transform:

        translateX(-50%);

    z-index: 10;

    transition:

        transform .8s ease,

        opacity .8s ease;

}

.ovo svg {

    width: 100%;

    height: 100%;

    display: block;

    overflow: visible;

}

/* ==================================================

   CASCA DO OVO

================================================== */

.ovo-corpo {

    fill: #fffdf7;

    stroke: #d5bea0;

    stroke-width: 4;

    stroke-linejoin: round;

}

/* ==================================================

   BRILHO

================================================== */

.ovo-brilho {

    fill: #ffffff;

    opacity: .65;

}

/* ==================================================

   RACHADURAS

================================================== */

.rachaduras {

    position: absolute;

    inset: 0;

    z-index: 12;

    opacity: 0;

    transition:

        opacity .4s ease;

    pointer-events: none;

}

.rachadura {

    fill: none;

    stroke: #a98b69;

    stroke-width: 4;

    stroke-linecap: round;

    stroke-linejoin: round;

}

/* ==================================================

   PARTE SUPERIOR DA CASCA

================================================== */

.casca-cima {

    position: absolute;

    left: 50%;

    top: 35px;

    width: 165px;

    height: 120px;

    transform:

        translateX(-50%);

    z-index: 20;

    opacity: 0;

    pointer-events: none;

    transition:

        transform 1s ease,

        opacity .7s ease;

}

.casca-cima svg {

    width: 100%;

    height: 100%;

}

/* ==================================================

   ESTADOS

================================================== */

/* RACHANDO */

.rachando .rachaduras {

    opacity: 1;

}

/* ABRINDO */

.abrindo .rachaduras {

    opacity: 1;

}

.abrindo .ovo {

    animation:

        tremer

        .15s

        infinite;

}

/* ==================================================

   QUANDO ABRE

================================================== */

.abrindo .casca-cima {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(-45px)

        rotate(-8deg);

}

/* ==================================================

   PETTON APARECENDO

================================================== */

.nascendo .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0)

        scale(.72);

    z-index: 15;

}

.nascendo .ovo {

    opacity: .35;

    transform:

        translateX(-50%)

        scale(1.02);

}

/* ==================================================

   NASCIDO

================================================== */

.nascido .petton {

    opacity: 1;

    transform:

        translateX(-50%)

        translateY(0)

        scale(1);

    z-index: 30;

}

.nascido .ovo {

    opacity: 0;

    transform:

        translateX(-50%)

        scale(1.08);

}

.nascido .casca-cima {

    opacity: 0;

}

/* ==================================================

   TREMER

================================================== */

@keyframes tremer {

    0% {

        transform:

            translateX(-50%)

            rotate(-1deg);

    }

    50% {

        transform:

            translateX(-50%)

            rotate(1deg);

    }

    100% {

        transform:

            translateX(-50%)

            rotate(-1deg);

    }

}

/* ==================================================

   MENSAGENS

================================================== */

#mensagem {

    min-height: 25px;

    margin-top: 3px;

    font-size: 17px;

    font-weight: bold;

    color: #754c38;

}

#submensagem {

    min-height: 22px;

    margin-top: 2px;

    font-size: 14px;

    color: #8b786d;

}

/* ==================================================

   BOTÃO

================================================== */

#botaoContinuar {

    display: none;

    margin-top: 15px;

    padding:

        13px 24px;

    border: none;

    border-radius: 11px;

    background: #db2777;

    color: white;

    font-size: 16px;

    font-weight: bold;

}

.nascido #botaoContinuar {

    display: inline-block;

}

/* ==================================================

   CELULAR

================================================== */

@media (max-width: 420px) {

    .principal {

        padding-top: 10px;

    }

    h1 {

        font-size: 22px;

    }

    .subtitulo {

        font-size: 14px;

        margin-bottom: 8px;

    }

    .cena {

        width: 220px;

        height: 275px;

    }

    .ovo {

        width: 150px;

        height: 215px;

    }

    .casca-cima {

        width: 150px;

    }

    .petton {

        width: 135px;

        height: 135px;

    }

}

</style>

</head>

<body>

<!-- ==================================================

     TOPO

================================================== -->

<div class="topo">

    <button

        type="button"

        onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🥚 Nascimento

    </div>

    <div style="width:65px;"></div>

</div>

<!-- ==================================================

     PRINCIPAL

================================================== -->

<div class="principal">

    <h1>

        🐾 Seu Petton está chegando!

    </h1>

    <div class="subtitulo">

        Algo muito especial está prestes a acontecer...

    </div>

    <!-- ==================================================

         CENA

    ================================================== -->

    <div

        id="cena"

        class="cena">

        <!-- SOMBRA -->

        <div class="sombra"></div>

        <!-- ==================================================

             PETTON

             ATRÁS DO OVO

        ================================================== -->

        <div class="petton">

            <img

                src="petton-original.png"

                alt="Petton">

        </div>

        <!-- ==================================================

             OVO

        ================================================== -->

        <div class="ovo">

            <svg

                viewBox="0 0 165 235"

                xmlns="http://www.w3.org/2000/svg">

                <!-- SILHUETA REAL DO OVO -->

                <path

                    class="ovo-corpo"

                    d="

                    M82.5 8

                    C48 8

                     21 48

                     16 92

                    C10 140

                     18 191

                     47 218

                    C57 227

                     69 232

                     82.5 232

                    C96 232

                     108 227

                     118 218

                    C147 191

                     155 140

                     149 92

                    C144 48

                     117 8

                     82.5 8

                    Z

                    "

                />

                <!-- BRILHO -->

                <ellipse

                    class="ovo-brilho"

                    cx="54"

                    cy="58"

                    rx="14"

                    ry="31"

                    transform="rotate(-18 54 58)"

                />

            </svg>

            <!-- ==================================================

                 RACHADURAS

            ================================================== -->

            <div class="rachaduras">

                <svg

                    viewBox="0 0 165 235"

                    xmlns="http://www.w3.org/2000/svg">

                    <path

                        class="rachadura"

                        d="

                        M35 111

                        L55 105

                        L48 91

                        L70 97

                        L64 78

                        L82 88

                        "

                    />

                    <path

                        class="rachadura"

                        d="

                        M82 88

                        L96 76

                        L92 94

                        L112 90

                        "

                    />

                    <path

                        class="rachadura"

                        d="

                        M64 130

                        L80 120

                        L76 139

                        L94 133

                        L103 149

                        "

                    />

                    <path

                        class="rachadura"

                        d="

                        M48 151

                        L61 160

                        L56 177

                        L76 168

                        "

                    />

                </svg>

            </div>

        </div>

        <!-- ==================================================

             PARTE DE CIMA DA CASCA

        ================================================== -->

        <div class="casca-cima">

            <svg

                viewBox="0 0 165 120"

                xmlns="http://www.w3.org/2000/svg">

                <path

                    d="

                    M82.5 8

                    C48 8

                     21 48

                     16 92

                    L35 87

                    L48 94

                    L64 84

                    L82 92

                    L98 80

                    L116 91

                    L131 83

                    L149 92

                    C144 48

                     117 8

                     82.5 8

                    Z

                    "

                    fill="#fffdf7"

                    stroke="#d5bea0"

                    stroke-width="4"

                    stroke-linejoin="round"

                />

            </svg>

        </div>

    </div>

    <!-- ==================================================

         MENSAGENS

    ================================================== -->

    <div id="mensagem">

        🥚 Seu ovo está esperando...

    </div>

    <div id="submensagem">

        Espere um pouquinho...

    </div>

    <!-- ==================================================

         BOTÃO

    ================================================== -->

    <button

        id="botaoContinuar"

        type="button"

        onclick="continuar()">

        🐾 Conhecer meu Petton

    </button>

</div>

<!-- ==================================================

     PETTON.JS

================================================== -->

<script src="petton.js"></script>

<script>

/* ==================================================

   VOLTAR

================================================== */

function voltar() {

    window.location.href =

        "index.html";

}

/* ==================================================

   CONTINUAR

================================================== */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* ==================================================

   ELEMENTOS

================================================== */

const cena =

    document.getElementById("cena");

const mensagem =

    document.getElementById("mensagem");

const submensagem =

    document.getElementById("submensagem");

/* ==================================================

   NASCIMENTO

================================================== */

function iniciarNascimento() {

    /*

       PRIMEIRO MOMENTO

       OVO COMPLETAMENTE SOZINHO.

    */

    setTimeout(function() {

        mensagem.textContent =

            "🥚 Seu ovo começou a rachar...";

        submensagem.textContent =

            "Tem alguma coisa lá dentro!";

        cena.classList.add(

            "rachando"

        );

    }, 1200);

    /*

       SEGUNDO MOMENTO

       OVO COMEÇA A TREMER.

    */

    setTimeout(function() {

        mensagem.textContent =

            "✨ O ovo está abrindo!";

        submensagem.textContent =

            "Está quase na hora...";

        cena.classList.remove(

            "rachando"

        );

        cena.classList.add(

            "abrindo"

        );

    }, 3500);

    /*

       TERCEIRO MOMENTO

       PETTON COMEÇA A SAIR.

    */

    setTimeout(function() {

        mensagem.textContent =

            "🐾 Está nascendo!";

        submensagem.textContent =

            "Seu Petton está chegando!";

        cena.classList.remove(

            "abrindo"

        );

        cena.classList.add(

            "nascendo"

        );

    }, 4700);

    /*

       QUARTO MOMENTO

       NASCIMENTO CONCLUÍDO.

    */

    setTimeout(function() {

        mensagem.textContent =

            "💗 Seu Petton nasceu!";

        submensagem.textContent =

            "Agora começa a aventura.";

        cena.classList.remove(

            "nascendo"

        );

        cena.classList.add(

            "nascido"

        );

        /*

           REGISTRA O NASCIMENTO.

        */

        try {

            if (

                window.Petton &&

                typeof Petton.nascer === "function"

            ) {

                Petton.nascer();

            }

        } catch (erro) {

            console.log(

                "Erro ao registrar nascimento:",

                erro

            );

        }

    }, 6500);

}

/* ==================================================

   CARREGAR PETTON

================================================== */

try {

    if (

        window.Petton &&

        typeof Petton.carregar === "function"

    ) {

        Petton.carregar();

    }

} catch (erro) {

    console.log(

        "Petton ainda não carregado."

    );

}

/* ==================================================

   INICIAR

================================================== */

iniciarNascimento();

</script>

</body>

</html>

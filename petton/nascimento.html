<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background:

        linear-gradient(

            to bottom,

            #dff3ff 0%,

            #f8fcff 55%,

            #eadcc9 55%,

            #d8c5aa 100%

        );

    font-family: Arial, sans-serif;

    text-align: center;

    color: #333;

}

.topo {

    height: 60px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-shadow: 0 2px 8px rgba(0,0,0,.15);

}

.topo button {

    background: #333;

    color: white;

    border: none;

    border-radius: 9px;

    padding: 10px 13px;

    font-size: 14px;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

.cena {

    height: calc(100vh - 60px);

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

}

#titulo {

    position: absolute;

    top: 35px;

    width: 100%;

    font-size: 24px;

    font-weight: bold;

}

#subtitulo {

    position: absolute;

    top: 75px;

    width: 100%;

    font-size: 14px;

    color: #777;

}

/* =====================================

   OVO

===================================== */

#ovo {

    width: 130px;

    height: 165px;

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    background:

        radial-gradient(

            circle at 35% 25%,

            #ffffff 0%,

            #fff8e8 30%,

            #f1dfb9 75%,

            #d6bd8d 100%

        );

    border: 4px solid #c3a36c;

    border-radius:

        50% 50% 48% 48%

        /

        55% 55% 45% 45%;

    box-shadow:

        0 12px 22px rgba(0,0,0,.20);

    z-index: 10;

}

/* brilho */

#ovo::before {

    content: "";

    position: absolute;

    width: 28px;

    height: 50px;

    left: 25px;

    top: 22px;

    background: rgba(255,255,255,.75);

    border-radius: 50%;

    transform: rotate(-20deg);

}

/* =====================================

   RACHADURAS

===================================== */

.risco {

    position: absolute;

    width: 4px;

    background: #8f754b;

    border-radius: 5px;

    opacity: 0;

}

.risco1 {

    height: 45px;

    left: 61px;

    top: 42px;

    transform: rotate(18deg);

}

.risco2 {

    height: 42px;

    left: 75px;

    top: 78px;

    transform: rotate(-20deg);

}

.risco3 {

    height: 38px;

    left: 55px;

    top: 108px;

    transform: rotate(17deg);

}

/* =====================================

   PETTON

===================================== */

#petton {

    display: none;

    position: absolute;

    width: 145px;

    left: 50%;

    top: 50%;

    transform:

        translate(-50%, -50%);

    z-index: 5;

    filter:

        drop-shadow(

            0 8px 7px

            rgba(0,0,0,.20)

        );

}

/* =====================================

   RACHANDO

===================================== */

body.rachando #ovo {

    animation:

        tremer .15s

        infinite;

}

body.rachando .risco {

    opacity: 1;

}

@keyframes tremer {

    0% {

        transform:

            translate(-50%, -50%)

            rotate(0deg);

    }

    25% {

        transform:

            translate(-50%, -50%)

            rotate(-3deg);

    }

    50% {

        transform:

            translate(-50%, -50%)

            rotate(3deg);

    }

    75% {

        transform:

            translate(-50%, -50%)

            rotate(-2deg);

    }

    100% {

        transform:

            translate(-50%, -50%)

            rotate(0deg);

    }

}

/* =====================================

   OVO ABRE

===================================== */

body.abrindo #ovo {

    animation:

        desaparecer 1s

        forwards;

}

@keyframes desaparecer {

    0% {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            scale(1);

    }

    60% {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            scale(1.08);

    }

    100% {

        opacity: 0;

        transform:

            translate(-50%, -50%)

            scale(.1);

    }

}

/* =====================================

   PETTON NASCE

===================================== */

body.nascido #ovo {

    display: none;

}

body.nascido #petton {

    display: block;

    animation:

        nascer 1.2s

        ease-out

        forwards;

}

@keyframes nascer {

    0% {

        opacity: 0;

        transform:

            translate(-50%, -50%)

            scale(.25);

    }

    100% {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            scale(.60);

    }

}

/* =====================================

   FINAL

===================================== */

#final {

    position: absolute;

    bottom: 80px;

    width: 100%;

    font-size: 21px;

    font-weight: bold;

    opacity: 0;

}

body.finalizado #final {

    opacity: 1;

}

#continuar {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform:

        translateX(-50%);

    background: #db2777;

    color: white;

    border: none;

    border-radius: 12px;

    padding: 13px 22px;

    font-size: 16px;

    font-weight: bold;

    opacity: 0;

}

body.finalizado #continuar {

    opacity: 1;

}

</style>

</head>

<body>

<div class="topo">

    <button onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🐾 Petton

    </div>

    <div style="width:65px;"></div>

</div>

<div class="cena">

<div id="titulo">

    🥚 Um novo Petton está nascendo!

</div>

<div id="subtitulo">

    O ovo está esperando...

</div>

<!-- OVO -->

<div id="ovo">

    <div class="risco risco1"></div>

    <div class="risco risco2"></div>

    <div class="risco risco3"></div>

</div>

<!-- PETTON -->

<img

id="petton"

src="petton-original.png"

alt="Petton">

<div id="final">

    💕 Seu Petton nasceu!

</div>

<button

id="continuar"

onclick="continuar()">

    🐾 Conhecer meu Petton

</button>

</div>

<script>

/*

=================================================

NASCIMENTO DO PETTON

=================================================

0 - 5 segundos:

SOMENTE O OVO

5 - 8 segundos:

OVO RACHANDO

8 - 9 segundos:

OVO DESAPARECE

9 segundos:

PETTON APARECE

=================================================

*/

/* -----------------------------------------

   5 SEGUNDOS

----------------------------------------- */

setTimeout(function() {

    document.body.classList.add(

        "rachando"

    );

    document.getElementById(

        "subtitulo"

    ).textContent =

        "O ovo começou a rachar...";

}, 5000);

/* -----------------------------------------

   8 SEGUNDOS

----------------------------------------- */

setTimeout(function() {

    document.body.classList.add(

        "abrindo"

    );

    document.getElementById(

        "subtitulo"

    ).textContent =

        "Está nascendo!";

}, 8000);

/* -----------------------------------------

   9 SEGUNDOS

----------------------------------------- */

setTimeout(function() {

    document.body.classList.add(

        "nascido"

    );

}, 9000);

/* -----------------------------------------

   11 SEGUNDOS

----------------------------------------- */

setTimeout(function() {

    document.body.classList.add(

        "finalizado"

    );

    document.getElementById(

        "titulo"

    ).textContent =

        "🐾 Nasceu!";

    document.getElementById(

        "subtitulo"

    ).textContent =

        "Cuide muito bem do seu Petton.";

}, 11000);

/* -----------------------------------------

   CONTINUAR

----------------------------------------- */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* -----------------------------------------

   VOLTAR

----------------------------------------- */

function voltar() {

    window.location.href =

        "index.html";

}

</script>

</body>

</html>

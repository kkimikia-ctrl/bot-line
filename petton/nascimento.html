<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nascimento do Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    background:

        linear-gradient(

            to bottom,

            #dff3ff 0%,

            #f8fcff 55%,

            #eadcc9 55%,

            #d8c5aa 100%

        );

    font-family: Arial, sans-serif;

    text-align: center;

    color: #333;

    overflow: hidden;

}

/* =========================================

   TOPO

========================================= */

.topo {

    height: 60px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    box-shadow:

        0 2px 8px rgba(0,0,0,.15);

    position: relative;

    z-index: 20;

}

.topo button {

    background: #333;

    color: white;

    border: none;

    border-radius: 9px;

    padding: 10px 13px;

    font-size: 14px;

}

.titulo {

    font-size: 18px;

    font-weight: bold;

}

/* =========================================

   CENA

========================================= */

.cena {

    height: calc(100vh - 60px);

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}

/* =========================================

   TEXTOS

========================================= */

#titulo {

    position: absolute;

    top: 35px;

    width: 100%;

    font-size: 24px;

    font-weight: bold;

    color: #555;

}

#subtitulo {

    position: absolute;

    top: 75px;

    width: 100%;

    font-size: 14px;

    color: #777;

}

/* =========================================

   OVO

========================================= */

#ovo {

    width: 130px;

    height: 165px;

    position: absolute;

    left: 50%;

    top: 50%;

    transform:

        translate(-50%, -50%);

    background:

        radial-gradient(

            circle at 35% 25%,

            #ffffff 0%,

            #fff8e8 30%,

            #f1dfb9 75%,

            #d6bd8d 100%

        );

    border: 4px solid #c3a36c;

    border-radius:

        50% 50% 48% 48%

        /

        55% 55% 45% 45%;

    box-shadow:

        0 12px 22px

        rgba(0,0,0,.20);

    z-index: 10;

}

/* brilho */

#ovo::before {

    content: "";

    position: absolute;

    width: 28px;

    height: 50px;

    left: 25px;

    top: 22px;

    background:

        rgba(255,255,255,.75);

    border-radius: 50%;

    transform:

        rotate(-20deg);

}

/* =========================================

   RACHADURAS

========================================= */

.risco {

    position: absolute;

    width: 4px;

    background: #8f754b;

    border-radius: 5px;

    opacity: 0;

}

.risco1 {

    height: 45px;

    left: 61px;

    top: 42px;

    transform:

        rotate(18deg);

}

.risco2 {

    height: 42px;

    left: 75px;

    top: 78px;

    transform:

        rotate(-20deg);

}

.risco3 {

    height: 38px;

    left: 55px;

    top: 108px;

    transform:

        rotate(17deg);

}

/* =========================================

   RACHANDO

========================================= */

body.rachando .risco {

    opacity: 1;

}

body.rachando #ovo {

    animation:

        tremer .15s infinite;

}

@keyframes tremer {

    0% {

        transform:

            translate(-50%, -50%)

            rotate(0deg);

    }

    25% {

        transform:

            translate(-50%, -50%)

            rotate(-3deg);

    }

    50% {

        transform:

            translate(-50%, -50%)

            rotate(3deg);

    }

    75% {

        transform:

            translate(-50%, -50%)

            rotate(-2deg);

    }

    100% {

        transform:

            translate(-50%, -50%)

            rotate(0deg);

    }

}

/* =========================================

   OVO ABRINDO

========================================= */

body.abrindo #ovo {

    animation:

        abrirOvo 1s

        forwards;

}

@keyframes abrirOvo {

    0% {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            scale(1);

    }

    50% {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            scale(1.08);

    }

    100% {

        opacity: 0;

        transform:

            translate(-50%, -50%)

            scale(.05);

    }

}

/* =========================================

   PETTON

========================================= */

#petton {

    display: none;

    position: absolute;

    width: 145px;

    left: 50%;

    top: 50%;

    transform:

        translate(-50%, -50%)

        scale(.2);

    opacity: 0;

    z-index: 5;

    filter:

        drop-shadow(

            0 8px 7px

            rgba(0,0,0,.20)

        );

}

/* =========================================

   PETTON NASCENDO

========================================= */

body.nascido #ovo {

    display: none;

}

body.nascido #petton {

    display: block;

    animation:

        nascer 1.3s

        ease-out

        forwards;

}

@keyframes nascer {

    0% {

        opacity: 0;

        transform:

            translate(-50%, -50%)

            scale(.20);

    }

    100% {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            scale(.60);

    }

}

/* =========================================

   FINAL

========================================= */

#final {

    position: absolute;

    bottom: 85px;

    width: 100%;

    font-size: 21px;

    font-weight: bold;

    color: #555;

    opacity: 0;

}

body.finalizado #final {

    opacity: 1;

}

/* =========================================

   BOTÃO

========================================= */

#continuar {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform:

        translateX(-50%);

    background: #db2777;

    color: white;

    border: none;

    border-radius: 12px;

    padding: 13px 22px;

    font-size: 16px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

}

body.finalizado #continuar {

    opacity: 1;

    pointer-events: auto;

}

/* =========================================

   CELULAR

========================================= */

@media (max-width: 380px) {

    #titulo {

        font-size: 22px;

    }

    #subtitulo {

        font-size: 13px;

    }

    #petton {

        width: 135px;

    }

    #ovo {

        width: 115px;

        height: 150px;

    }

}

</style>

</head>

<body>

<div class="topo">

    <button

        type="button"

        onclick="voltar()">

        ⬅ Voltar

    </button>

    <div class="titulo">

        🐾 Petton

    </div>

    <div style="width:65px;"></div>

</div>

<div class="cena">

<div id="titulo">

    🥚 Um novo Petton está nascendo!

</div>

<div id="subtitulo">

    O ovo está esperando...

</div>

<!-- =====================================

     OVO

===================================== -->

<div id="ovo">

    <div class="risco risco1"></div>

    <div class="risco risco2"></div>

    <div class="risco risco3"></div>

</div>

<!-- =====================================

     PETTON ORIGINAL

===================================== -->

<img

    id="petton"

    src="petton-original.png"

    alt="Petton recém-nascido">

<div id="final">

    💕 Seu Petton nasceu!

</div>

<button

    id="continuar"

    type="button"

    onclick="continuar()">

    🐾 Conhecer meu Petton

</button>

</div>

<!-- =====================================

     CARREGA O SISTEMA DO PETTON

===================================== -->

<script src="petton.js"></script>

<script>

/*

====================================================

NASCIMENTO REAL

====================================================

O ovo é apenas a parte visual.

Quando o Petton aparece:

1. Petton.nascer() é executado.

2. O nascimento é gravado no localStorage.

3. A fase deixa de ser "ovo".

4. bebe.html consegue reconhecer o Petton.

====================================================

*/

/* =========================================

   5 SEGUNDOS

   OVO COMEÇA A RACHAR

========================================= */

setTimeout(function() {

    document.body.classList.add(

        "rachando"

    );

    document.getElementById(

        "subtitulo"

    ).textContent =

        "O ovo começou a rachar...";

}, 5000);

/* =========================================

   8 SEGUNDOS

   OVO ABRE

========================================= */

setTimeout(function() {

    document.body.classList.add(

        "abrindo"

    );

    document.getElementById(

        "subtitulo"

    ).textContent =

        "Está nascendo!";

}, 8000);

/* =========================================

   9 SEGUNDOS

   PETTON APARECE

========================================= */

setTimeout(function() {

    document.body.classList.add(

        "nascido"

    );

    document.getElementById(

        "titulo"

    ).textContent =

        "🐾 Seu Petton nasceu!";

    document.getElementById(

        "subtitulo"

    ).textContent =

        "Bem-vindo ao mundo!";

}, 9000);

/* =========================================

   9,2 SEGUNDOS

   REGISTRA O NASCIMENTO

========================================= */

setTimeout(function() {

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.nascer === "function"

        ) {

            Petton.nascer();

            console.log(

                "🐾 NASCIMENTO REGISTRADO!"

            );

        } else {

            console.error(

                "Petton.nascer() não está disponível."

            );

        }

    } catch (erro) {

        console.error(

            "Erro ao registrar nascimento:",

            erro

        );

    }

}, 9200);

/* =========================================

   11 SEGUNDOS

   FINAL

========================================= */

setTimeout(function() {

    document.body.classList.add(

        "finalizado"

    );

    document.getElementById(

        "titulo"

    ).textContent =

        "🐾 Nasceu!";

    document.getElementById(

        "subtitulo"

    ).textContent =

        "Seu novo Petton está pronto.";

    document.getElementById(

        "final"

    ).textContent =

        "💕 Seu Petton nasceu!";

}, 11000);

/* =========================================

   CONHECER MEU PETTON

========================================= */

function continuar() {

    window.location.href =

        "bebe.html";

}

/* =========================================

   VOLTAR

========================================= */

function voltar() {

    window.location.href =

        "index.html";

}

</script>

</body>

</html>

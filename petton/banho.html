<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>Petton - Banho 🛁</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#eaf8ff 0%,#f7fcff 45%,#fff 100%);color:#34454d;overflow-x:hidden}
.app{width:100%;max-width:520px;margin:0 auto;padding:10px 12px 35px}
.top-bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:58px}
.top-bar h1{margin:0;text-align:center;font-size:21px;font-weight:900}
.top-btn{width:42px;height:42px;border:none;border-radius:50%;background:#fff;color:#1687e8;font-size:24px;font-weight:800;box-shadow:0 3px 12px rgba(0,0,0,.09);cursor:pointer}
.top-space{width:42px;height:42px}
.banho-intro{text-align:center;padding:10px 10px 16px}
.banho-intro h2{margin:0;font-size:25px;font-weight:900;color:#263944}
.banho-intro p{margin:5px 0 0;font-size:14px;font-weight:600;color:#778892}
.banho-card{background:#fff;border-radius:25px;padding:12px;box-shadow:0 8px 28px rgba(43,85,110,.12)}
.banho-cenario{position:relative;width:100%;aspect-ratio:1/1.08;max-height:590px;overflow:hidden;border-radius:23px;background:linear-gradient(to bottom,#dff5ff 0%,#eaf9ff 69%,#cbe9f2 69%,#c4e5ef 100%)}
#banhoFundo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none}

/* INTERIOR ATRÁS DO PET */
.banheira-interior{position:absolute;left:50%;bottom:25.5%;transform:translateX(-50%);width:82%;height:12%;z-index:3;border-radius:50%;background:radial-gradient(ellipse at center,#eafcff 0%,#c6f1ff 45%,#83d5ef 72%,#54b9da 100%);box-shadow:inset 0 5px 12px rgba(255,255,255,.85),inset 0 -6px 12px rgba(28,145,196,.18);pointer-events:none}

/* ESPUMA ATRÁS */
.espuma-tras{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);width:84%;height:18%;z-index:4;pointer-events:none}
.espuma-tras span,.espuma-frente span{position:absolute;display:block;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0%,#f9feff 52%,#dff4fb 100%);box-shadow:inset -3px -4px 8px rgba(90,177,211,.14)}
.espuma-tras span:nth-child(1){width:64px;height:48px;left:0;top:43%}
.espuma-tras span:nth-child(2){width:75px;height:56px;left:12%;top:26%}
.espuma-tras span:nth-child(3){width:67px;height:49px;left:28%;top:41%}
.espuma-tras span:nth-child(4){width:80px;height:57px;left:43%;top:27%}
.espuma-tras span:nth-child(5){width:66px;height:49px;left:61%;top:41%}
.espuma-tras span:nth-child(6){width:75px;height:55px;right:1%;top:27%}

/* PET DENTRO DA BANHEIRA */
#pettonBanho{position:absolute;left:50%;transform:translateX(-50%);object-fit:contain;z-index:6;pointer-events:none;transform-origin:center bottom;transition:transform .25s ease}
#pettonBanho.pet-gato{width:40%;top:47%;max-height:42%}
#pettonBanho.pet-cachorro{width:43%;top:46%;max-height:43%}
#pettonBanho.pet-coelho{width:40%;top:46%;max-height:43%}

/* CHUVEIRO */
.chuveiro-agua{position:absolute;left:50%;top:13%;transform:translateX(-50%);width:22%;height:36%;z-index:7;pointer-events:none;opacity:.28}
.banho-ativo .chuveiro-agua{opacity:1}
.gota{position:absolute;top:0;width:3px;height:28px;border-radius:10px;background:linear-gradient(to bottom,rgba(255,255,255,.1),rgba(82,197,245,.9));animation:cairAgua .75s linear infinite;opacity:.75}
.gota:nth-child(1){left:10%;animation-delay:0s}.gota:nth-child(2){left:27%;animation-delay:.12s}.gota:nth-child(3){left:43%;animation-delay:.25s}.gota:nth-child(4){left:59%;animation-delay:.06s}.gota:nth-child(5){left:75%;animation-delay:.34s}.gota:nth-child(6){left:90%;animation-delay:.18s}
@keyframes cairAgua{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(165px);opacity:0}}

/* FRENTE DA BANHEIRA */
.banheira-frente{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);width:92%;height:38%;z-index:8;pointer-events:none}
.banheira-corpo{position:absolute;left:4%;right:4%;bottom:5%;height:75%;border-radius:32px 32px 72px 72px;background:linear-gradient(180deg,#26c4f1 0%,#079fe0 35%,#087cc8 72%,#086ab7 100%);border:2px solid rgba(0,104,184,.28);box-shadow:inset 0 14px 20px rgba(255,255,255,.42),inset 0 -18px 25px rgba(0,68,139,.22),0 11px 24px rgba(40,119,160,.18)}
.banheira-corpo::before{content:"";position:absolute;left:7%;right:7%;top:13%;height:18%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));opacity:.65}
.banheira-borda{position:absolute;left:0;right:0;top:1%;height:24%;border-radius:50%;background:linear-gradient(180deg,#fff 0%,#f7fcff 45%,#d9f2fb 100%);border:1px solid rgba(107,188,220,.34);box-shadow:inset 0 -5px 11px rgba(88,177,210,.23),0 5px 9px rgba(42,126,165,.15)}
.pe-banheira{position:absolute;bottom:0;width:18%;height:16%;border-radius:50% 50% 60% 60%;background:linear-gradient(180deg,#ffd84e 0%,#f6b51d 65%,#e99a00 100%);box-shadow:inset 0 5px 7px rgba(255,255,255,.5),0 4px 7px rgba(165,111,0,.17);z-index:-1}
.pe-banheira.esquerdo{left:12%}.pe-banheira.direito{right:12%}

/* ESPUMA FRENTE */
.espuma-frente{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);width:87%;height:18%;z-index:10;pointer-events:none}
.espuma-frente span{box-shadow:0 3px 6px rgba(92,170,201,.14)}
.espuma-frente span:nth-child(1){width:60px;height:47px;left:0;top:24%}
.espuma-frente span:nth-child(2){width:73px;height:54px;left:11%;top:38%}
.espuma-frente span:nth-child(3){width:65px;height:49px;left:27%;top:24%}
.espuma-frente span:nth-child(4){width:79px;height:57px;left:42%;top:38%}
.espuma-frente span:nth-child(5){width:66px;height:49px;left:60%;top:24%}
.espuma-frente span:nth-child(6){width:72px;height:54px;right:9%;top:38%}
.espuma-frente span:nth-child(7){width:59px;height:46px;right:0;top:24%}
.espuma-pingo{position:absolute;z-index:11;width:18px;height:45px;border-radius:12px 12px 15px 15px;background:linear-gradient(180deg,#fff,#e9f9ff);pointer-events:none}
.espuma-pingo.p1{left:14%;bottom:17%}.espuma-pingo.p2{left:30%;bottom:16%;height:36px}.espuma-pingo.p3{right:30%;bottom:16%;height:41px}.espuma-pingo.p4{right:13%;bottom:17%;height:47px}

/* BOLHAS DECORATIVAS */
.bolha-decorativa{position:absolute;border-radius:50%;z-index:12;pointer-events:none;border:2px solid rgba(58,91,255,.55);background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.64) 8%,rgba(36,210,255,.78) 35%,rgba(58,128,255,.74) 54%,rgba(255,90,227,.58) 72%,rgba(255,223,67,.48) 88%,rgba(255,255,255,.22) 100%);box-shadow:inset 3px 3px 9px rgba(255,255,255,.65),0 3px 8px rgba(36,130,199,.2)}
.bd1{width:69px;height:69px;left:7%;bottom:25%}.bd2{width:48px;height:48px;left:22%;bottom:18%}.bd3{width:32px;height:32px;left:34%;bottom:24%}.bd4{width:66px;height:66px;right:7%;bottom:26%}.bd5{width:49px;height:49px;right:21%;bottom:18%}.bd6{width:29px;height:29px;right:34%;bottom:24%}.bd7{width:26px;height:26px;left:7%;bottom:18%}.bd8{width:26px;height:26px;right:7%;bottom:18%}

#bolhasArea{position:absolute;inset:0;z-index:13;pointer-events:none}
.bolha{position:absolute;bottom:20%;border-radius:50%;border:2px solid rgba(79,109,255,.65);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.96),rgba(72,214,255,.43) 35%,rgba(82,118,255,.39) 56%,rgba(255,98,220,.32) 73%,rgba(255,230,90,.22));box-shadow:inset 2px 2px 5px rgba(255,255,255,.68);animation:subirBolha 3.5s ease-out forwards}
@keyframes subirBolha{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.95}100%{transform:translateY(-280px) scale(1.15);opacity:0}}

/* ESPUMA CABEÇA */
#espumaCabeca{display:none;position:absolute;left:50%;top:42%;transform:translateX(-50%);width:74px;height:40px;z-index:14;pointer-events:none}
#espumaCabeca span{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#eefaff);box-shadow:0 2px 5px rgba(80,150,180,.13)}
#espumaCabeca span:nth-child(1){width:34px;height:27px;left:4px;top:10px}
#espumaCabeca span:nth-child(2){width:38px;height:31px;left:23px;top:0}
#espumaCabeca span:nth-child(3){width:31px;height:25px;right:0;top:11px}
.banho-ativo #espumaCabeca{display:block}

.banho-ativo #pettonBanho{animation:petBanho .55s ease-in-out infinite alternate}
@keyframes petBanho{from{transform:translateX(-50%) translateY(0) rotate(-1deg)}to{transform:translateX(-50%) translateY(-3px) rotate(1deg)}}

/* STATUS */
.status-box{margin-top:13px;padding:14px 15px;border-radius:18px;background:linear-gradient(180deg,#fbfeff,#f0f8fb);box-shadow:inset 0 0 0 1px rgba(203,227,236,.4)}
.status-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px;font-weight:800}
#higieneValor{color:#2095b8;font-size:17px}
.barra{width:100%;height:12px;overflow:hidden;border-radius:20px;background:#dcecf1}
#barraHigiene{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#58c7df,#58d3bd);transition:width .35s ease}
#btnBanho{width:100%;min-height:56px;margin-top:12px;border:none;border-radius:18px;background:linear-gradient(135deg,#5fc8e0,#38b6cf);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 17px rgba(49,165,193,.22)}
#btnBanho:disabled{opacity:.55;cursor:default}
#mensagemBanho{min-height:24px;margin-top:11px;text-align:center;font-size:14px;font-weight:700;color:#60757e}

@media(max-width:380px){
.app{padding-left:8px;padding-right:8px}
.banho-card{padding:8px}
#pettonBanho.pet-gato{width:41%}
#pettonBanho.pet-cachorro{width:44%}
#pettonBanho.pet-coelho{width:41%}
.bolha-decorativa{transform:scale(.88)}
}
</style>
</head>

<body>

<div class="app">

<div class="top-bar">
<button type="button" class="top-btn" onclick="voltarPetton()">←</button>
<h1>Banho 🛁</h1>
<div class="top-space"></div>
</div>

<div class="banho-intro">
<h2>Hora do banho!</h2>
<p>Deixe seu Petton limpinho ✨</p>
</div>

<div class="banho-card">

<div id="banhoCenario" class="banho-cenario">

<img id="banhoFundo" src="banho-fundo.png" alt="">

<!-- esta camada fica atrás do Petton -->
<div class="banheira-interior"></div>

<div class="espuma-tras">
<span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<!-- Petton agora fica entre o interior e a frente da banheira -->
<img id="pettonBanho" alt="Petton no banho">

<div class="chuveiro-agua">
<span class="gota"></span><span class="gota"></span><span class="gota"></span>
<span class="gota"></span><span class="gota"></span><span class="gota"></span>
</div>

<!-- esta parte cobre o corpo do Petton -->
<div class="banheira-frente">
<div class="pe-banheira esquerdo"></div>
<div class="pe-banheira direito"></div>
<div class="banheira-corpo"></div>
<div class="banheira-borda"></div>
</div>

<div class="espuma-frente">
<span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<div class="espuma-pingo p1"></div>
<div class="espuma-pingo p2"></div>
<div class="espuma-pingo p3"></div>
<div class="espuma-pingo p4"></div>

<div class="bolha-decorativa bd1"></div>
<div class="bolha-decorativa bd2"></div>
<div class="bolha-decorativa bd3"></div>
<div class="bolha-decorativa bd4"></div>
<div class="bolha-decorativa bd5"></div>
<div class="bolha-decorativa bd6"></div>
<div class="bolha-decorativa bd7"></div>
<div class="bolha-decorativa bd8"></div>

<div id="espumaCabeca">
<span></span><span></span><span></span>
</div>

<div id="bolhasArea"></div>

</div>

<div class="status-box">
<div class="status-top">
<span>🧼 Higiene</span>
<span id="higieneValor">0%</span>
</div>
<div class="barra"><div id="barraHigiene"></div></div>
</div>

<button type="button" id="btnBanho" onclick="darBanho()">🫧 Dar banho</button>
<div id="mensagemBanho"></div>

</div>
</div>

<script src="petton.js"></script>

<script>
const IMAGENS_PETTON={
gato:"petton-original.png",
cachorro:"FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",
coelho:"39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"
};

let banhoExecutando=false;
let intervaloBolhas=null;

function carregarDadosPetton(){
try{
if(typeof Petton!=="undefined"&&typeof Petton.carregar==="function"){
return Petton.carregar();
}
}catch(erro){
console.error("Erro carregar Petton:",erro);
}
return null;
}

function obterEspecie(dados){
let especie=String(
dados?.identidadeVisual?.especie||
dados?.especie||
dados?.tipo||
dados?.animal||
"gato"
).toLowerCase();

if(especie.includes("cach")||especie==="dog")return "cachorro";
if(especie.includes("coelh")||especie==="rabbit"||especie==="bunny")return "coelho";
return "gato";
}

function obterImagemPetton(dados){
const especie=obterEspecie(dados);
const fase=String(dados?.fase||"bebe");

try{
if(dados&&dados.identidadeVisual&&dados.identidadeVisual.imagens&&dados.identidadeVisual.imagens[fase]){
let imagem=dados.identidadeVisual.imagens[fase];

if(
imagem &&
!imagem.startsWith("http://") &&
!imagem.startsWith("https://") &&
!imagem.startsWith("/") &&
!imagem.startsWith("./") &&
!imagem.startsWith("../")
){
imagem="./"+imagem;
}
return imagem;
}
}catch(erro){console.error(erro)}

if(dados?.imagem)return dados.imagem;
return IMAGENS_PETTON[especie]||IMAGENS_PETTON.gato;
}

function aplicarClassePetton(especie){
const pet=document.getElementById("pettonBanho");
pet.classList.remove("pet-gato","pet-cachorro","pet-coelho");
pet.classList.add("pet-"+especie);
}

function obterHigiene(dados){
let valor=Number(dados?.higiene??dados?.status?.higiene??0);
if(!Number.isFinite(valor))valor=0;
return Math.max(0,Math.min(100,valor));
}

function atualizarTelaBanho(){
const dados=carregarDadosPetton();

if(!dados){
document.getElementById("mensagemBanho").textContent="Não foi possível carregar o Petton.";
return;
}

const especie=obterEspecie(dados);
const imagem=obterImagemPetton(dados);
const pet=document.getElementById("pettonBanho");

if(pet.getAttribute("src")!==imagem)pet.src=imagem;

aplicarClassePetton(especie);

const higiene=obterHigiene(dados);

document.getElementById("higieneValor").textContent=Math.round(higiene)+"%";
document.getElementById("barraHigiene").style.width=higiene+"%";

const botao=document.getElementById("btnBanho");
const mensagem=document.getElementById("mensagemBanho");

if(!banhoExecutando){
if(higiene>=95){
botao.disabled=true;
botao.textContent="🫧 Dar banho";
mensagem.textContent="✨ Seu Petton já está limpinho!";
}else{
botao.disabled=false;
botao.textContent="🫧 Dar banho";
mensagem.textContent="🫧 Seu Petton está pronto para o banho.";
}
}
}

function criarBolha(){
const area=document.getElementById("bolhasArea");
if(!area)return;

const bolha=document.createElement("div");
bolha.className="bolha";

const tamanho=13+Math.random()*28;
bolha.style.width=tamanho+"px";
bolha.style.height=tamanho+"px";
bolha.style.left=(8+Math.random()*84)+"%";
bolha.style.animationDuration=(2.4+Math.random()*2)+"s";

area.appendChild(bolha);

setTimeout(function(){
bolha.remove();
},4700);
}

function iniciarBolhas(){
pararBolhas();
criarBolha();criarBolha();criarBolha();criarBolha();

intervaloBolhas=setInterval(function(){
criarBolha();
},240);
}

function pararBolhas(){
if(intervaloBolhas){
clearInterval(intervaloBolhas);
intervaloBolhas=null;
}
}

function executarAcaoBanho(){
try{
if(typeof Petton==="undefined")return false;
if(typeof Petton.banho==="function")return Petton.banho();
if(typeof Petton.limpar==="function")return Petton.limpar();
}catch(erro){
console.error("Erro banho:",erro);
}
return false;
}

function darBanho(){
if(banhoExecutando)return;

const dados=carregarDadosPetton();
if(!dados)return;

const higiene=obterHigiene(dados);

if(higiene>=95){
mostrarMensagemBanho("✨ Seu Petton já está limpinho!");
return;
}

banhoExecutando=true;

const cenario=document.getElementById("banhoCenario");
const botao=document.getElementById("btnBanho");

cenario.classList.add("banho-ativo");

botao.disabled=true;
botao.textContent="🫧 Tomando banho...";

mostrarMensagemBanho("🫧 Hora do banho!");
iniciarBolhas();

setTimeout(function(){
executarAcaoBanho();
atualizarTelaBanho();
},2300);

setTimeout(function(){
pararBolhas();
cenario.classList.remove("banho-ativo");
banhoExecutando=false;
atualizarTelaBanho();
},5200);
}

function mostrarMensagemBanho(texto){
document.getElementById("mensagemBanho").textContent=texto;
}

function voltarPetton(){
window.location.href="./index.html";
}

window.addEventListener("petton-atualizado",function(){
atualizarTelaBanho();
});

document.addEventListener("DOMContentLoaded",function(){
atualizarTelaBanho();
});

window.addEventListener("beforeunload",function(){
pararBolhas();
});
</script>

</body>
</html>

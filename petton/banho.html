<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Petton - Banho 🛁</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

}

body {

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #eefaff 0%,

            #ffffff 100%

        );

    color: #34454d;

    overflow-x: hidden;

}

/* =========================================================

   APP

========================================================= */

.app {

    width: 100%;

    max-width: 520px;

    min-height: 100vh;

    margin: 0 auto;

    padding: 8px 10px 24px;

}

/* =========================================================

   TOPO

========================================================= */

.topo {

    display: grid;

    grid-template-columns: 44px 1fr 44px;

    align-items: center;

    min-height: 54px;

    margin-bottom: 6px;

}

.topo h1 {

    margin: 0;

    text-align: center;

    font-size: 20px;

}

.voltar {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #ffffff;

    font-size: 22px;

    cursor: pointer;

    box-shadow:

        0 3px 12px

        rgba(0,0,0,.08);

}

.espaco-topo {

    width: 42px;

}

/* =========================================================

   TÍTULO

========================================================= */

.titulo {

    text-align: center;

    margin: 5px 0 10px;

}

.titulo h2 {

    margin: 0;

    font-size: 22px;

}

.titulo p {

    margin: 4px 0 0;

    color: #71838c;

    font-size: 13px;

}

/* =========================================================

   PALCO

========================================================= */

.banho-palco {

    position: relative;

    width: min(94vw, 400px);

    aspect-ratio: 23 / 32;

    margin: 0 auto;

    border-radius: 27px;

    overflow: hidden;

    background: #dff3ff;

    box-shadow:

        0 15px 38px

        rgba(46,86,112,.20);

}

/* =========================================================

   FUNDO DA BANHEIRA

========================================================= */

#banhoFundo {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 1;

    pointer-events: none;

}

/* =========================================================

   ÁGUA DO CHUVEIRO

========================================================= */

#aguaBanho {

    position: absolute;

    left: 50%;

    top: 9%;

    width: 25%;

    height: 31%;

    transform:

        translateX(-50%);

    z-index: 2;

    overflow: hidden;

    pointer-events: none;

}

.gota-banho {

    position: absolute;

    top: -45px;

    width: 3px;

    height: 45px;

    border-radius: 12px;

    background:

        linear-gradient(

            to bottom,

            rgba(116,210,255,0),

            rgba(116,210,255,.82)

        );

    animation:

        gotaCaindo

        .82s

        linear

        infinite;

}

.gota-banho:nth-child(1) {

    left: 10%;

    animation-delay: 0s;

}

.gota-banho:nth-child(2) {

    left: 27%;

    animation-delay: .15s;

}

.gota-banho:nth-child(3) {

    left: 44%;

    animation-delay: .32s;

}

.gota-banho:nth-child(4) {

    left: 61%;

    animation-delay: .08s;

}

.gota-banho:nth-child(5) {

    left: 78%;

    animation-delay: .42s;

}

.gota-banho:nth-child(6) {

    left: 91%;

    animation-delay: .22s;

}

@keyframes gotaCaindo {

    0% {

        transform:

            translateY(0);

        opacity: 0;

    }

    15% {

        opacity: .9;

    }

    100% {

        transform:

            translateY(210px);

        opacity: 0;

    }

}

/* =========================================================

   ESPUMA ATRÁS

========================================================= */

#banhoEspuma {

    position: absolute;

    left: 13%;

    right: 13%;

    top: 45.2%;

    height: 3.7%;

    z-index: 2;

    overflow: hidden;

    border-radius:

        50% 50%

        45% 45%;

    background:

        rgba(255,255,255,.94);

    pointer-events: none;

}

.espuma {

    position: absolute;

    bottom: -5px;

    border-radius: 50%;

    background:

        rgba(255,255,255,.98);

    border:

        1px solid

        rgba(204,231,242,.65);

}

.e1 {

    width: 23px;

    height: 23px;

    left: 1%;

}

.e2 {

    width: 30px;

    height: 30px;

    left: 10%;

    bottom: -10px;

}

.e3 {

    width: 19px;

    height: 19px;

    left: 22%;

}

.e4 {

    width: 29px;

    height: 29px;

    left: 32%;

    bottom: -9px;

}

.e5 {

    width: 20px;

    height: 20px;

    left: 45%;

}

.e6 {

    width: 30px;

    height: 30px;

    left: 55%;

    bottom: -9px;

}

.e7 {

    width: 19px;

    height: 19px;

    left: 68%;

}

.e8 {

    width: 27px;

    height: 27px;

    left: 77%;

    bottom: -8px;

}

.e9 {

    width: 20px;

    height: 20px;

    right: 2%;

}

/* =========================================================

   PETTON

========================================================= */

#pettonBanho {

    position: absolute;

    left: 50%;

    top: 39.8%;

    transform:

        translate(-50%, -50%);

    width: auto;

    max-width: 46%;

    max-height: 32%;

    object-fit: contain;

    z-index: 3;

    filter:

        drop-shadow(

            0 4px 6px

            rgba(0,0,0,.10)

        );

    animation:

        pettonBalanco

        1.4s

        ease-in-out

        infinite

        alternate;

}

@keyframes pettonBalanco {

    from {

        transform:

            translate(-50%, -50%)

            translateY(0)

            rotate(-1deg);

    }

    to {

        transform:

            translate(-50%, -50%)

            translateY(-3px)

            rotate(1deg);

    }

}

/* =========================================================

   ESPUMA NA FRENTE

========================================================= */

#espumaFrente {

    position: absolute;

    left: 19%;

    right: 19%;

    top: 45.4%;

    height: 2.6%;

    z-index: 4;

    overflow: hidden;

    pointer-events: none;

}

.espuma-frente {

    position: absolute;

    bottom: -8px;

    border-radius: 50%;

    background:

        rgba(255,255,255,.98);

    border:

        1px solid

        rgba(210,234,244,.65);

}

.f1 {

    width: 24px;

    height: 24px;

    left: 0;

}

.f2 {

    width: 31px;

    height: 31px;

    left: 11%;

}

.f3 {

    width: 22px;

    height: 22px;

    left: 25%;

}

.f4 {

    width: 30px;

    height: 30px;

    left: 39%;

}

.f5 {

    width: 24px;

    height: 24px;

    left: 54%;

}

.f6 {

    width: 31px;

    height: 31px;

    left: 68%;

}

.f7 {

    width: 22px;

    height: 22px;

    left: 82%;

}

.f8 {

    width: 26px;

    height: 26px;

    right: 0;

}

/* =========================================================

   BOLHAS

========================================================= */

#bolhas {

    position: absolute;

    left: 17%;

    right: 17%;

    top: 35%;

    height: 14%;

    z-index: 5;

    overflow: hidden;

    pointer-events: none;

}

.bolha {

    position: absolute;

    bottom: 0;

    border-radius: 50%;

    border:

        2px solid

        rgba(130,210,250,.78);

    background:

        rgba(255,255,255,.20);

    opacity: 0;

    animation:

        bolhaSubir

        2.7s

        ease-in

        infinite;

}

@keyframes bolhaSubir {

    0% {

        transform:

            translateY(8px)

            scale(.7);

        opacity: 0;

    }

    18% {

        opacity: .9;

    }

    100% {

        transform:

            translateY(-75px)

            scale(1.15);

        opacity: 0;

    }

}

/* =========================================================

   STATUS

========================================================= */

.status {

    width: min(94vw, 400px);

    margin:

        10px auto 0;

    padding:

        12px 14px;

    background: white;

    border-radius: 18px;

    box-shadow:

        0 5px 18px

        rgba(0,0,0,.07);

}

.status-topo {

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 14px;

    font-weight: 700;

}

.barra {

    width: 100%;

    height: 10px;

    margin-top: 8px;

    border-radius: 20px;

    background: #e9eff1;

    overflow: hidden;

}

#barraHigiene {

    width: 0;

    height: 100%;

    border-radius: 20px;

    background:

        linear-gradient(

            90deg,

            #74c9ee,

            #76d7b1

        );

    transition:

        width .4s ease;

}

/* =========================================================

   BOTÃO

========================================================= */

#btnBanho {

    display: block;

    width: min(94vw, 400px);

    min-height: 50px;

    margin:

        10px auto 0;

    border: none;

    border-radius: 16px;

    background:

        linear-gradient(

            135deg,

            #70c9ef,

            #65b9e5

        );

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:

        0 6px 16px

        rgba(69,158,204,.25);

}

#btnBanho:disabled {

    opacity: .55;

}

/* =========================================================

   MENSAGEM

========================================================= */

#mensagem {

    min-height: 22px;

    margin-top: 10px;

    text-align: center;

    color: #607984;

    font-size: 14px;

}

</style>

</head>

<body>

<div class="app">

    <div class="topo">

        <button

            class="voltar"

            type="button"

            onclick="voltar()"

        >

            ←

        </button>

        <h1>

            Banho 🛁

        </h1>

        <div class="espaco-topo"></div>

    </div>

    <div class="titulo">

        <h2>

            Hora do banho!

        </h2>

        <p>

            Deixe seu Petton limpinho ✨

        </p>

    </div>

    <div class="banho-palco">

        <img

            id="banhoFundo"

            src="967F050B-F7FB-4B39-B665-A32CE466421E.png"

            alt=""

        >

        <div id="aguaBanho">

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

        </div>

        <div id="banhoEspuma">

            <span class="espuma e1"></span>

            <span class="espuma e2"></span>

            <span class="espuma e3"></span>

            <span class="espuma e4"></span>

            <span class="espuma e5"></span>

            <span class="espuma e6"></span>

            <span class="espuma e7"></span>

            <span class="espuma e8"></span>

            <span class="espuma e9"></span>

        </div>

        <img

            id="pettonBanho"

            alt="Petton tomando banho"

        >

        <div id="espumaFrente">

            <span class="espuma-frente f1"></span>

            <span class="espuma-frente f2"></span>

            <span class="espuma-frente f3"></span>

            <span class="espuma-frente f4"></span>

            <span class="espuma-frente f5"></span>

            <span class="espuma-frente f6"></span>

            <span class="espuma-frente f7"></span>

            <span class="espuma-frente f8"></span>

        </div>

        <div id="bolhas"></div>

    </div>

    <div class="status">

        <div class="status-topo">

            <span>

                🧼 Higiene

            </span>

            <span id="higieneValor">

                0%

            </span>

        </div>

        <div class="barra">

            <div id="barraHigiene"></div>

        </div>

    </div>

    <button

        id="btnBanho"

        type="button"

        onclick="darBanho()"

    >

        🫧 Dar banho

    </button>

    <div id="mensagem"></div>

</div>

<script src="petton.js"></script>

<script>

/* =========================================================

   IMAGENS DE SEGURANÇA

========================================================= */

const IMAGENS_PETTON = {

    gato:

        "petton-original.png",

    cachorro:

        "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

    coelho:

        "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

};

/* =========================================================

   PEGAR DADOS

========================================================= */

function pegarDados() {

    try {

        if (

            typeof Petton !==

            "undefined" &&

            typeof Petton.carregar ===

            "function"

        ) {

            return Petton.carregar();

        }

    } catch (erro) {

        console.error(erro);

    }

    return null;

}

/* =========================================================

   IMAGEM DO PETTON

========================================================= */

function pegarImagem(dados) {

    if (!dados) {

        return IMAGENS_PETTON.gato;

    }

    const fase =

        dados.fase ||

        "bebe";

    try {

        if (

            dados.identidadeVisual &&

            dados.identidadeVisual.imagens &&

            dados.identidadeVisual.imagens[fase]

        ) {

            return (

                dados.identidadeVisual.imagens[fase]

            );

        }

    } catch (erro) {

        console.error(erro);

    }

    let especie =

        String(

            dados.especie ||

            "gato"

        ).toLowerCase();

    if (

        especie.includes("cach")

    ) {

        especie =

            "cachorro";

    }

    if (

        especie.includes("coelh")

    ) {

        especie =

            "coelho";

    }

    return (

        IMAGENS_PETTON[especie] ||

        IMAGENS_PETTON.gato

    );

}

/* =========================================================

   ATUALIZAR TELA

========================================================= */

function atualizarTelaBanho() {

    const dados =

        pegarDados();

    if (!dados) {

        return;

    }

    const imagem =

        document.getElementById(

            "pettonBanho"

        );

    if (imagem) {

        const src =

            pegarImagem(dados);

        if (

            imagem.getAttribute("src") !==

            src

        ) {

            imagem.src =

                src;

        }

    }

    let higiene =

        Number(

            dados.higiene ||

            0

        );

    higiene =

        Math.max(

            0,

            Math.min(

                100,

                higiene

            )

        );

    document.getElementById(

        "higieneValor"

    ).textContent =

        Math.round(higiene) +

        "%";

    document.getElementById(

        "barraHigiene"

    ).style.width =

        higiene +

        "%";

    const mensagem =

        document.getElementById(

            "mensagem"

        );

    const botao =

        document.getElementById(

            "btnBanho"

        );

    if (higiene >= 90) {

        mensagem.textContent =

            "✨ Seu Petton já está limpinho!";

        botao.disabled =

            true;

    } else {

        mensagem.textContent =

            "🫧 Seu Petton está pronto para o banho.";

        botao.disabled =

            false;

    }

}

/* =========================================================

   BOLHAS

========================================================= */

function criarBolhas() {

    const area =

        document.getElementById(

            "bolhas"

        );

    if (!area) {

        return;

    }

    area.innerHTML =

        "";

    const bolhas = [

        [10,13,0],

        [22,18,.4],

        [34,12,.15],

        [46,21,.8],

        [58,14,.25],

        [70,18,1],

        [81,12,.55],

        [90,15,.3]

    ];

    bolhas.forEach(

        function(item) {

            const bolha =

                document.createElement(

                    "span"

                );

            bolha.className =

                "bolha";

            bolha.style.left =

                item[0] +

                "%";

            bolha.style.width =

                item[1] +

                "px";

            bolha.style.height =

                item[1] +

                "px";

            bolha.style.animationDelay =

                item[2] +

                "s";

            area.appendChild(

                bolha

            );

        }

    );

}

/* =========================================================

   DAR BANHO

========================================================= */

function darBanho() {

    const dados =

        pegarDados();

    if (!dados) {

        return;

    }

    if (

        Number(

            dados.higiene ||

            0

        ) >= 90

    ) {

        return;

    }

    const botao =

        document.getElementById(

            "btnBanho"

        );

    const mensagem =

        document.getElementById(

            "mensagem"

        );

    botao.disabled =

        true;

    mensagem.textContent =

        "🫧 Tomando banho...";

    criarBolhas();

    setTimeout(

        function() {

            let sucesso =

                false;

            try {

                if (

                    typeof Petton !==

                    "undefined" &&

                    typeof Petton.limpar ===

                    "function"

                ) {

                    sucesso =

                        Petton.limpar();

                }

            } catch (erro) {

                console.error(erro);

            }

            atualizarTelaBanho();

            if (sucesso) {

                mensagem.textContent =

                    "✨ Pronto! Seu Petton está limpinho!";

            } else {

                mensagem.textContent =

                    "✨ Banho terminado!";

            }

            setTimeout(

                function() {

                    window.location.href =

                        "./index.html";

                },

                1400

            );

        },

        3000

    );

}

/* =========================================================

   VOLTAR

========================================================= */

function voltar() {

    window.location.href =

        "./index.html";

}

/* =========================================================

   INICIAR

========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        atualizarTelaBanho();

        criarBolhas();

    }

);

</script>

</body>

</html>

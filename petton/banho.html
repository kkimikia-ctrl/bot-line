<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="google" content="notranslate">

<title>Petton - Banho 🛁</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

/* =========================================================
   GERAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #eaf8ff 0%,
            #ffffff 100%
        );

    color: #34454d;
    overflow-x: hidden;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding:
        10px
        12px
        35px;
}

/* =========================================================
   TOPO
========================================================= */

.top-bar {
    display: grid;
    grid-template-columns:
        44px
        1fr
        44px;

    align-items: center;

    min-height: 58px;
}

.top-bar h1 {
    margin: 0;
    text-align: center;
    font-size: 21px;
}

.top-btn {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: white;

    font-size: 21px;

    box-shadow:
        0
        3px
        12px
        rgba(0,0,0,.09);

    cursor: pointer;
}

.top-space {
    width: 42px;
    height: 42px;
}

/* =========================================================
   CARD
========================================================= */

.banho-card {
    background: white;

    border-radius: 24px;

    padding: 12px;

    box-shadow:
        0
        8px
        28px
        rgba(43,85,110,.12);
}

/* =========================================================
   CENÁRIO
========================================================= */

.banho-cenario {
    position: relative;

    width: 100%;

    aspect-ratio: 1 / 1.18;

    max-height: 590px;

    overflow: hidden;

    border-radius: 21px;

    background:
        linear-gradient(
            to bottom,
            #dff5ff 0%,
            #effaff 72%,
            #d5edf5 72%,
            #c8e5ed 100%
        );
}

/* =========================================================
   FUNDO
========================================================= */

#banhoFundo {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    pointer-events: none;
}

/* =========================================================
   PETTON
========================================================= */

#pettonBanho {
    position: absolute;

    left: 50%;

    top: 38%;

    transform:
        translateX(-50%);

    width: 42%;
    max-height: 44%;

    object-fit: contain;

    z-index: 5;

    pointer-events: none;

    transform-origin:
        center bottom;

    transition:
        transform .25s ease;
}

/* ajustes por espécie */

#pettonBanho.pet-gato {
    width: 40%;
    top: 38%;
}

#pettonBanho.pet-cachorro {
    width: 42%;
    top: 39%;
}

#pettonBanho.pet-coelho {
    width: 39%;
    top: 35%;
}

/* =========================================================
   ÁGUA DO CHUVEIRO
========================================================= */

.chuveiro-agua {
    position: absolute;

    left: 50%;
    top: 13%;

    transform:
        translateX(-50%);

    width: 21%;
    height: 31%;

    z-index: 4;

    pointer-events: none;

    opacity: 0;
}

.banho-ativo .chuveiro-agua {
    opacity: 1;
}

.gota {
    position: absolute;

    top: 0;

    width: 3px;
    height: 23px;

    border-radius: 10px;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.1),
            rgba(120,215,255,.9)
        );

    animation:
        cairAgua
        .7s
        linear
        infinite;

    opacity: .8;
}

.gota:nth-child(1) {
    left: 12%;
    animation-delay: 0s;
}

.gota:nth-child(2) {
    left: 28%;
    animation-delay: .12s;
}

.gota:nth-child(3) {
    left: 43%;
    animation-delay: .25s;
}

.gota:nth-child(4) {
    left: 58%;
    animation-delay: .06s;
}

.gota:nth-child(5) {
    left: 73%;
    animation-delay: .34s;
}

.gota:nth-child(6) {
    left: 88%;
    animation-delay: .18s;
}

@keyframes cairAgua {

    from {
        transform:
            translateY(0);

        opacity: 0;
    }

    20% {
        opacity: .9;
    }

    to {
        transform:
            translateY(130px);

        opacity: 0;
    }

}

/* =========================================================
   ESPUMA DE TRÁS
========================================================= */

.espuma-tras {
    position: absolute;

    left: 50%;
    bottom: 20%;

    transform:
        translateX(-50%);

    width: 79%;
    height: 25%;

    z-index: 3;

    pointer-events: none;
}

.espuma-tras span {
    position: absolute;

    display: block;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #f6fdff 64%,
            #dff4fb 100%
        );

    box-shadow:
        inset
        -2px
        -3px
        8px
        rgba(126,192,217,.16);
}

.espuma-tras span:nth-child(1) {
    width: 54px;
    height: 40px;
    left: 4%;
    top: 47%;
}

.espuma-tras span:nth-child(2) {
    width: 67px;
    height: 46px;
    left: 14%;
    top: 32%;
}

.espuma-tras span:nth-child(3) {
    width: 55px;
    height: 42px;
    left: 30%;
    top: 44%;
}

.espuma-tras span:nth-child(4) {
    width: 68px;
    height: 48px;
    left: 44%;
    top: 30%;
}

.espuma-tras span:nth-child(5) {
    width: 54px;
    height: 43px;
    left: 61%;
    top: 42%;
}

.espuma-tras span:nth-child(6) {
    width: 66px;
    height: 47px;
    right: 5%;
    top: 33%;
}

/* =========================================================
   FRENTE DA BANHEIRA
========================================================= */

.banheira-frente {
    position: absolute;

    left: 50%;
    bottom: 4.5%;

    transform:
        translateX(-50%);

    width: 84%;
    height: 31%;

    z-index: 7;

    pointer-events: none;
}

/* corpo azul */

.banheira-corpo {
    position: absolute;

    left: 5%;
    right: 5%;
    bottom: 6%;

    height: 74%;

    border-radius:
        25px
        25px
        48px
        48px;

    background:
        linear-gradient(
            180deg,
            #aee4f2 0%,
            #7dccdf 56%,
            #67bad1 100%
        );

    box-shadow:
        inset
        0
        8px
        14px
        rgba(255,255,255,.55),

        inset
        0
        -9px
        15px
        rgba(50,135,163,.18),

        0
        8px
        16px
        rgba(70,120,140,.17);
}

/* borda branca da banheira */

.banheira-borda {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 27%;

    border-radius: 50%;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #edfaff 100%
        );

    box-shadow:
        inset
        0
        -4px
        10px
        rgba(114,188,215,.2),

        0
        4px
        8px
        rgba(90,150,175,.15);
}

/* pés */

.pe-banheira {
    position: absolute;

    bottom: 0;

    width: 19%;
    height: 18%;

    border-radius:
        45%
        45%
        55%
        55%;

    background:
        linear-gradient(
            180deg,
            #ffd95f,
            #f4b83e
        );

    z-index: -1;
}

.pe-banheira.esquerdo {
    left: 13%;
}

.pe-banheira.direito {
    right: 13%;
}

/* =========================================================
   ESPUMA DA FRENTE
========================================================= */

.espuma-frente {
    position: absolute;

    left: 50%;
    bottom: 19%;

    transform:
        translateX(-50%);

    width: 78%;
    height: 20%;

    z-index: 9;

    pointer-events: none;
}

.espuma-frente span {
    position: absolute;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #effaff
        );

    box-shadow:
        0
        2px
        5px
        rgba(110,180,205,.13);
}

.espuma-frente span:nth-child(1) {
    width: 47px;
    height: 38px;
    left: 1%;
    top: 26%;
}

.espuma-frente span:nth-child(2) {
    width: 58px;
    height: 43px;
    left: 12%;
    top: 37%;
}

.espuma-frente span:nth-child(3) {
    width: 53px;
    height: 40px;
    left: 27%;
    top: 26%;
}

.espuma-frente span:nth-child(4) {
    width: 62px;
    height: 45px;
    left: 41%;
    top: 38%;
}

.espuma-frente span:nth-child(5) {
    width: 54px;
    height: 40px;
    left: 57%;
    top: 25%;
}

.espuma-frente span:nth-child(6) {
    width: 61px;
    height: 43px;
    right: 10%;
    top: 37%;
}

.espuma-frente span:nth-child(7) {
    width: 47px;
    height: 37px;
    right: 0;
    top: 25%;
}

/* =========================================================
   BOLHAS
========================================================= */

#bolhasArea {
    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

.bolha {
    position: absolute;

    bottom: 20%;

    border-radius: 50%;

    border:
        2px
        solid
        rgba(255,255,255,.78);

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.85),
            rgba(165,226,255,.25) 42%,
            rgba(214,181,255,.18) 70%,
            rgba(255,255,255,.1)
        );

    box-shadow:
        inset
        2px
        2px
        5px
        rgba(255,255,255,.5);

    animation:
        subirBolha
        3.5s
        ease-out
        forwards;
}

@keyframes subirBolha {

    0% {
        transform:
            translateY(0)
            scale(.6);

        opacity: 0;
    }

    15% {
        opacity: .9;
    }

    100% {
        transform:
            translateY(-260px)
            scale(1.15);

        opacity: 0;
    }

}

/* =========================================================
   ESPUMA NA CABEÇA
========================================================= */

#espumaCabeca {
    display: none;

    position: absolute;

    left: 50%;
    top: 34%;

    transform:
        translateX(-50%);

    width: 90px;
    height: 48px;

    z-index: 8;

    pointer-events: none;
}

#espumaCabeca span {
    position: absolute;

    border-radius: 50%;

    background:
        white;

    box-shadow:
        0
        2px
        5px
        rgba(80,150,180,.13);
}

#espumaCabeca span:nth-child(1) {
    width: 43px;
    height: 34px;

    left: 5px;
    top: 12px;
}

#espumaCabeca span:nth-child(2) {
    width: 48px;
    height: 40px;

    left: 28px;
    top: 0;
}

#espumaCabeca span:nth-child(3) {
    width: 38px;
    height: 31px;

    right: 0;
    top: 15px;
}

.banho-ativo #espumaCabeca {
    display: block;
}

/* =========================================================
   PET DURANTE O BANHO
========================================================= */

.banho-ativo #pettonBanho {
    animation:
        petBanho
        .55s
        ease-in-out
        infinite
        alternate;
}

@keyframes petBanho {

    from {
        transform:
            translateX(-50%)
            translateY(0)
            rotate(-1deg);
    }

    to {
        transform:
            translateX(-50%)
            translateY(-3px)
            rotate(1deg);
    }

}

/* =========================================================
   STATUS
========================================================= */

.status-box {
    margin-top: 13px;

    padding:
        13px
        14px;

    border-radius: 15px;

    background: #f3fbfd;
}

.status-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;
}

#higieneValor {
    color: #2391b2;
}

.barra {
    width: 100%;
    height: 12px;

    overflow: hidden;

    border-radius: 20px;

    background: #dcecf1;
}

#barraHigiene {
    height: 100%;

    width: 0%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #58c7df,
            #58d3bd
        );

    transition:
        width .35s ease;
}

/* =========================================================
   BOTÃO
========================================================= */

#btnBanho {
    width: 100%;

    min-height: 52px;

    margin-top: 12px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #5fc8e0,
            #38b6cf
        );

    color: white;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0
        7px
        15px
        rgba(49,165,193,.22);
}

#btnBanho:disabled {
    opacity: .55;
    cursor: default;
}

/* =========================================================
   MENSAGEM
========================================================= */

#mensagemBanho {
    min-height: 21px;

    margin-top: 10px;

    text-align: center;

    font-size: 13px;

    color: #60757e;
}

/* =========================================================
   MOBILE PEQUENO
========================================================= */

@media (
    max-width: 380px
) {

    .app {
        padding-left: 8px;
        padding-right: 8px;
    }

    .banho-card {
        padding: 8px;
    }

    #pettonBanho {
        width: 43%;
    }

}

</style>

</head>

<body>

<div class="app">

    <div class="top-bar">

        <button
            type="button"
            class="top-btn"
            onclick="voltarPetton()"
        >
            ←
        </button>

        <h1>
            Banho 🛁
        </h1>

        <div class="top-space"></div>

    </div>

    <div class="banho-card">

        <div
            id="banhoCenario"
            class="banho-cenario"
        >

            <!-- FUNDO -->

            <img
                id="banhoFundo"
                src="banho-fundo.png"
                alt=""
            >

            <!-- ESPUMA ATRÁS -->

            <div class="espuma-tras">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

            <!-- PETTON -->

            <img
                id="pettonBanho"
                alt="Petton no banho"
            >

            <!-- ÁGUA -->

            <div class="chuveiro-agua">

                <span class="gota"></span>
                <span class="gota"></span>
                <span class="gota"></span>
                <span class="gota"></span>
                <span class="gota"></span>
                <span class="gota"></span>

            </div>

            <!-- ESPUMA NA CABEÇA -->

            <div id="espumaCabeca">

                <span></span>
                <span></span>
                <span></span>

            </div>

            <!-- FRENTE DA BANHEIRA -->

            <div class="banheira-frente">

                <div
                    class="pe-banheira esquerdo"
                ></div>

                <div
                    class="pe-banheira direito"
                ></div>

                <div class="banheira-corpo"></div>

                <div class="banheira-borda"></div>

            </div>

            <!-- ESPUMA NA FRENTE -->

            <div class="espuma-frente">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

            <!-- BOLHAS -->

            <div id="bolhasArea"></div>

        </div>

        <div class="status-box">

            <div class="status-top">

                <span>
                    🧼 Higiene
                </span>

                <span id="higieneValor">
                    0%
                </span>

            </div>

            <div class="barra">

                <div id="barraHigiene"></div>

            </div>

        </div>

        <button
            type="button"
            id="btnBanho"
            onclick="darBanho()"
        >
            🛁 Dar banho
        </button>

        <div id="mensagemBanho"></div>

    </div>

</div>

<script src="petton.js"></script>

<script>

/* =========================================================
   IMAGENS PADRÃO
========================================================= */

const IMAGENS_PETTON = {

    gato:
        "petton-original.png",

    cachorro:
        "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

    coelho:
        "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

};

/* =========================================================
   VARIÁVEIS
========================================================= */

let banhoExecutando =
    false;

let intervaloBolhas =
    null;

/* =========================================================
   DADOS
========================================================= */

function carregarDadosPetton() {

    try {

        if (
            typeof Petton !==
            "undefined" &&
            typeof Petton.carregar ===
            "function"
        ) {

            return Petton.carregar();

        }

    } catch (
        erro
    ) {

        console.error(
            "Erro carregar Petton:",
            erro
        );

    }

    return null;

}

/* =========================================================
   ESPÉCIE
========================================================= */

function obterEspecie(
    dados
) {

    let especie =
        String(
            dados?.especie ||
            dados?.tipo ||
            dados?.animal ||
            "gato"
        ).toLowerCase();

    if (
        especie.includes(
            "cach"
        ) ||
        especie ===
        "dog"
    ) {

        return "cachorro";

    }

    if (
        especie.includes(
            "coelh"
        ) ||
        especie ===
        "rabbit" ||
        especie ===
        "bunny"
    ) {

        return "coelho";

    }

    return "gato";

}

/* =========================================================
   IMAGEM
========================================================= */

function obterImagemPetton(
    dados
) {

    const especie =
        obterEspecie(
            dados
        );

    const fase =
        String(
            dados?.fase ||
            "bebe"
        );

    try {

        if (
            dados &&
            dados.identidadeVisual &&
            dados.identidadeVisual.imagens &&
            dados.identidadeVisual.imagens[
                fase
            ]
        ) {

            return (
                dados
                    .identidadeVisual
                    .imagens[
                        fase
                    ]
            );

        }

    } catch (
        erro
    ) {

        console.error(
            erro
        );

    }

    if (
        dados?.imagem
    ) {

        return dados.imagem;

    }

    return (
        IMAGENS_PETTON[
            especie
        ] ||
        IMAGENS_PETTON.gato
    );

}

/* =========================================================
   POSIÇÃO POR ESPÉCIE
========================================================= */

function aplicarClassePetton(
    especie
) {

    const pet =
        document.getElementById(
            "pettonBanho"
        );

    pet.classList.remove(
        "pet-gato",
        "pet-cachorro",
        "pet-coelho"
    );

    pet.classList.add(
        "pet-" +
        especie
    );

}

/* =========================================================
   HIGIENE
========================================================= */

function obterHigiene(
    dados
) {

    let valor =
        Number(
            dados?.higiene ??
            dados?.status?.higiene ??
            0
        );

    if (
        !Number.isFinite(
            valor
        )
    ) {

        valor = 0;

    }

    return Math.max(
        0,
        Math.min(
            100,
            valor
        )
    );

}

/* =========================================================
   ATUALIZAR TELA
========================================================= */

function atualizarTelaBanho() {

    const dados =
        carregarDadosPetton();

    if (
        !dados
    ) {

        document.getElementById(
            "mensagemBanho"
        ).textContent =
            "Não foi possível carregar o Petton.";

        return;

    }

    const especie =
        obterEspecie(
            dados
        );

    const imagem =
        obterImagemPetton(
            dados
        );

    const pet =
        document.getElementById(
            "pettonBanho"
        );

    if (
        pet.getAttribute(
            "src"
        ) !==
        imagem
    ) {

        pet.src =
            imagem;

    }

    aplicarClassePetton(
        especie
    );

    const higiene =
        obterHigiene(
            dados
        );

    document.getElementById(
        "higieneValor"
    ).textContent =
        Math.round(
            higiene
        ) +
        "%";

    document.getElementById(
        "barraHigiene"
    ).style.width =
        higiene +
        "%";

    const botao =
        document.getElementById(
            "btnBanho"
        );

    if (
        !banhoExecutando
    ) {

        if (
            higiene >=
            95
        ) {

            botao.disabled =
                true;

            botao.textContent =
                "✨ Petton já está limpinho";

        } else {

            botao.disabled =
                false;

            botao.textContent =
                "🛁 Dar banho";

        }

    }

}

/* =========================================================
   BOLHAS
========================================================= */

function criarBolha() {

    const area =
        document.getElementById(
            "bolhasArea"
        );

    if (
        !area
    ) {

        return;

    }

    const bolha =
        document.createElement(
            "div"
        );

    bolha.className =
        "bolha";

    const tamanho =
        13 +
        Math.random() *
        25;

    bolha.style.width =
        tamanho +
        "px";

    bolha.style.height =
        tamanho +
        "px";

    bolha.style.left =
        (
            12 +
            Math.random() *
            76
        ) +
        "%";

    bolha.style.animationDuration =
        (
            2.4 +
            Math.random() *
            2
        ) +
        "s";

    area.appendChild(
        bolha
    );

    setTimeout(
        function() {

            bolha.remove();

        },
        4700
    );

}

/* =========================================================
   COMEÇAR BOLHAS
========================================================= */

function iniciarBolhas() {

    pararBolhas();

    criarBolha();
    criarBolha();
    criarBolha();

    intervaloBolhas =
        setInterval(
            function() {

                criarBolha();

            },
            270
        );

}

/* =========================================================
   PARAR BOLHAS
========================================================= */

function pararBolhas() {

    if (
        intervaloBolhas
    ) {

        clearInterval(
            intervaloBolhas
        );

        intervaloBolhas =
            null;

    }

}

/* =========================================================
   APLICAR BANHO NO PETTON
========================================================= */

function executarAcaoBanho() {

    try {

        if (
            typeof Petton ===
            "undefined"
        ) {

            return false;

        }

        /*
            Primeiro tenta a função própria de banho,
            caso ela exista no petton.js.
        */

        if (
            typeof Petton.banho ===
            "function"
        ) {

            return Petton.banho();

        }

        /*
            Compatibilidade com versão que usa limpar().
        */

        if (
            typeof Petton.limpar ===
            "function"
        ) {

            return Petton.limpar();

        }

    } catch (
        erro
    ) {

        console.error(
            "Erro banho:",
            erro
        );

    }

    return false;

}

/* =========================================================
   DAR BANHO
========================================================= */

function darBanho() {

    if (
        banhoExecutando
    ) {

        return;

    }

    const dados =
        carregarDadosPetton();

    if (
        !dados
    ) {

        return;

    }

    const higiene =
        obterHigiene(
            dados
        );

    if (
        higiene >=
        95
    ) {

        mostrarMensagemBanho(
            "✨ Seu Petton já está limpinho!"
        );

        return;

    }

    banhoExecutando =
        true;

    const cenario =
        document.getElementById(
            "banhoCenario"
        );

    const botao =
        document.getElementById(
            "btnBanho"
        );

    cenario.classList.add(
        "banho-ativo"
    );

    botao.disabled =
        true;

    botao.textContent =
        "🫧 Tomando banho...";

    mostrarMensagemBanho(
        "🫧 Hora do banho!"
    );

    iniciarBolhas();

    setTimeout(
        function() {

            executarAcaoBanho();

            atualizarTelaBanho();

        },
        2300
    );

    setTimeout(
        function() {

            pararBolhas();

            cenario.classList.remove(
                "banho-ativo"
            );

            banhoExecutando =
                false;

            atualizarTelaBanho();

            mostrarMensagemBanho(
                "✨ Petton está limpinho!"
            );

        },
        5200
    );

}

/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagemBanho(
    texto
) {

    const caixa =
        document.getElementById(
            "mensagemBanho"
        );

    caixa.textContent =
        texto;

}

/* =========================================================
   VOLTAR
========================================================= */

function voltarPetton() {

    window.location.href =
        "./index.html";

}

/* =========================================================
   EVENTO PETTON
========================================================= */

window.addEventListener(
    "petton-atualizado",
    function() {

        atualizarTelaBanho();

    }
);

/* =========================================================
   INICIAR
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        atualizarTelaBanho();

    }
);

/* =========================================================
   SAIR
========================================================= */

window.addEventListener(
    "beforeunload",
    function() {

        pararBolhas();

    }
);

</script>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Petton - Banho 🛁</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

}

body {

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #eefaff 0%,

            #ffffff 100%

        );

    color: #34454d;

    overflow-x: hidden;

}

/* =========================================================

   APP

========================================================= */

.app {

    width: 100%;

    max-width: 520px;

    min-height: 100vh;

    margin: 0 auto;

    padding: 8px 10px 24px;

}

/* =========================================================

   TOPO

========================================================= */

.topo {

    display: grid;

    grid-template-columns: 44px 1fr 44px;

    align-items: center;

    min-height: 54px;

    margin-bottom: 6px;

}

.topo h1 {

    margin: 0;

    text-align: center;

    font-size: 20px;

}

.voltar {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #ffffff;

    font-size: 22px;

    cursor: pointer;

    box-shadow:

        0 3px 12px

        rgba(0,0,0,.08);

}

.espaco-topo {

    width: 42px;

}

/* =========================================================

   TÍTULO

========================================================= */

.titulo {

    text-align: center;

    margin: 5px 0 10px;

}

.titulo h2 {

    margin: 0;

    font-size: 22px;

}

.titulo p {

    margin: 4px 0 0;

    color: #71838c;

    font-size: 13px;

}

/* =========================================================

   PALCO

========================================================= */

.banho-palco {

    position: relative;

    width: min(94vw, 400px);

    aspect-ratio: 23 / 32;

    margin: 0 auto;

    border-radius: 27px;

    overflow: hidden;

    background: #dff3ff;

    box-shadow:

        0 15px 38px

        rgba(46,86,112,.20);

}

/* =========================================================

   FUNDO

========================================================= */

#banhoFundo {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center;

    z-index: 1;

    pointer-events: none;

}

/* =========================================================

   ÁGUA DO CHUVEIRO

========================================================= */

#aguaBanho {

    position: absolute;

    left: 50%;

    top: 9%;

    width: 25%;

    height: 31%;

    transform:

        translateX(-50%);

    z-index: 2;

    overflow: hidden;

    pointer-events: none;

}

.gota-banho {

    position: absolute;

    top: -45px;

    width: 3px;

    height: 45px;

    border-radius: 12px;

    background:

        linear-gradient(

            to bottom,

            rgba(116,210,255,0),

            rgba(116,210,255,.82)

        );

    animation:

        gotaCaindo

        .82s

        linear

        infinite;

}

.gota-banho:nth-child(1) {

    left: 10%;

    animation-delay: 0s;

}

.gota-banho:nth-child(2) {

    left: 27%;

    animation-delay: .15s;

}

.gota-banho:nth-child(3) {

    left: 44%;

    animation-delay: .32s;

}

.gota-banho:nth-child(4) {

    left: 61%;

    animation-delay: .08s;

}

.gota-banho:nth-child(5) {

    left: 78%;

    animation-delay: .42s;

}

.gota-banho:nth-child(6) {

    left: 91%;

    animation-delay: .22s;

}

@keyframes gotaCaindo {

    0% {

        transform:

            translateY(0);

        opacity: 0;

    }

    15% {

        opacity: .9;

    }

    100% {

        transform:

            translateY(210px);

        opacity: 0;

    }

}

/* =========================================================

   ÁGUA DENTRO DA BANHEIRA

========================================================= */

#aguaBanheira {

    position: absolute;

    left: 13%;

    right: 13%;

    top: 44.2%;

    height: 6%;

    z-index: 2;

    border-radius: 50%;

    background:

        linear-gradient(

            180deg,

            rgba(190,240,255,.82),

            rgba(108,205,241,.76)

        );

    pointer-events: none;

}

/* =========================================================

   ESPUMA ATRÁS

========================================================= */

#banhoEspuma {

    position: absolute;

    left: 12%;

    right: 12%;

    top: 43.1%;

    height: 5%;

    z-index: 3;

    overflow: hidden;

    pointer-events: none;

}

.espuma {

    position: absolute;

    bottom: -7px;

    border-radius: 50%;

    background:

        rgba(255,255,255,.98);

    border:

        1px solid

        rgba(204,231,242,.70);

}

.e1 {

    width: 26px;

    height: 26px;

    left: 0%;

}

.e2 {

    width: 34px;

    height: 34px;

    left: 10%;

}

.e3 {

    width: 25px;

    height: 25px;

    left: 22%;

}

.e4 {

    width: 35px;

    height: 35px;

    left: 33%;

}

.e5 {

    width: 26px;

    height: 26px;

    left: 46%;

}

.e6 {

    width: 35px;

    height: 35px;

    left: 57%;

}

.e7 {

    width: 25px;

    height: 25px;

    left: 70%;

}

.e8 {

    width: 33px;

    height: 33px;

    left: 80%;

}

.e9 {

    width: 25px;

    height: 25px;

    right: 0%;

}

/* =========================================================

   PETTON

   FICA ENTRE A ESPUMA DE TRÁS

   E A ESPUMA DA FRENTE

========================================================= */

#pettonBanho {

    position: absolute;

    left: 50%;

    transform:

        translateX(-50%);

    width: auto;

    height: auto;

    object-fit: contain;

    transform-origin:

        center bottom;

    z-index: 4;

    filter:

        drop-shadow(

            0 3px 5px

            rgba(0,0,0,.09)

        );

    animation:

        pettonBalanco

        1.8s

        ease-in-out

        infinite

        alternate;

}

/* =========================================================

   COELHO

========================================================= */

#pettonBanho.pet-coelho {

    max-width: 47%;

    max-height: 29%;

    top: 34.7%;

}

/* =========================================================

   GATO

========================================================= */

#pettonBanho.pet-gato {

    max-width: 44%;

    max-height: 28%;

    top: 35.4%;

}

/* =========================================================

   CACHORRO

========================================================= */

#pettonBanho.pet-cachorro {

    max-width: 45%;

    max-height: 28%;

    top: 35.2%;

}

/* =========================================================

   URSO

========================================================= */

#pettonBanho.pet-urso {

    max-width: 45%;

    max-height: 28%;

    top: 35.2%;

}

@keyframes pettonBalanco {

    from {

        transform:

            translateX(-50%)

            rotate(-0.4deg);

    }

    to {

        transform:

            translateX(-50%)

            rotate(0.4deg);

    }

}

/* =========================================================

   FRENTE DA BANHEIRA

   IMPORTANTE:

   AGORA COMEÇA BEM MAIS EMBAIXO.

========================================================= */

#frenteBanheira {

    position: absolute;

    left: 8.5%;

    right: 8.5%;

    /*

       Antes estava muito alto.

       Agora começa abaixo do peito do Petton.

    */

    top: 53.2%;

    height: 11.5%;

    z-index: 5;

    border-radius:

        0 0

        45% 45% / 0 0

        40% 40%;

    background:

        linear-gradient(

            180deg,

            rgba(92,190,232,.95) 0%,

            rgba(71,171,218,.96) 100%

        );

    box-shadow:

        inset 0 8px 14px

        rgba(255,255,255,.14);

    pointer-events: none;

}

#frenteBanheira::after {

    content: "";

    position: absolute;

    left: 6%;

    right: 6%;

    top: 5%;

    height: 15%;

    border-radius: 50%;

    background:

        linear-gradient(

            180deg,

            rgba(255,255,255,.16),

            rgba(255,255,255,0)

        );

}

/* =========================================================

   BORDA DA FRENTE

   BEM MAIS FINA PARA NÃO ESCONDER O PETTON.

========================================================= */

#bordaFrente {

    position: absolute;

    left: 8%;

    right: 8%;

    top: 49.2%;

    height: 2.6%;

    z-index: 6;

    border-radius: 50%;

    background:

        linear-gradient(

            180deg,

            rgba(255,255,255,.98),

            rgba(232,247,253,.96)

        );

    box-shadow:

        0 2px 4px

        rgba(67,130,160,.10);

    pointer-events: none;

}

/* =========================================================

   ESPUMA DA FRENTE

   SUBIMOS A ESPUMA,

   MAS ELA NÃO É MAIS UMA FAIXA GIGANTE.

========================================================= */

#espumaFrente {

    position: absolute;

    left: 12%;

    right: 12%;

    top: 45.2%;

    height: 6.2%;

    z-index: 7;

    overflow: visible;

    pointer-events: none;

}

.espuma-frente {

    position: absolute;

    bottom: 0;

    border-radius: 50%;

    background:

        rgba(255,255,255,.98);

    border:

        1px solid

        rgba(202,232,244,.72);

    box-shadow:

        0 1px 4px

        rgba(90,170,200,.08);

}

.f1 {

    width: 27px;

    height: 27px;

    left: 0%;

}

.f2 {

    width: 35px;

    height: 35px;

    left: 10%;

    bottom: -3px;

}

.f3 {

    width: 25px;

    height: 25px;

    left: 23%;

}

.f4 {

    width: 36px;

    height: 36px;

    left: 35%;

    bottom: -4px;

}

.f5 {

    width: 27px;

    height: 27px;

    left: 49%;

}

.f6 {

    width: 36px;

    height: 36px;

    left: 62%;

    bottom: -3px;

}

.f7 {

    width: 25px;

    height: 25px;

    left: 76%;

}

.f8 {

    width: 31px;

    height: 31px;

    right: 0%;

    bottom: -2px;

}

/* =========================================================

   BOLHAS

========================================================= */

#bolhas {

    position: absolute;

    left: 17%;

    right: 17%;

    top: 32%;

    height: 19%;

    z-index: 8;

    overflow: hidden;

    pointer-events: none;

}

.bolha {

    position: absolute;

    bottom: 0;

    border-radius: 50%;

    border:

        2px solid

        rgba(130,210,250,.78);

    background:

        rgba(255,255,255,.20);

    opacity: 0;

    animation:

        bolhaSubir

        2.7s

        ease-in

        infinite;

}

@keyframes bolhaSubir {

    0% {

        transform:

            translateY(8px)

            scale(.7);

        opacity: 0;

    }

    18% {

        opacity: .9;

    }

    100% {

        transform:

            translateY(-80px)

            scale(1.15);

        opacity: 0;

    }

}

/* =========================================================

   STATUS

========================================================= */

.status {

    width: min(94vw, 400px);

    margin:

        10px auto 0;

    padding:

        12px 14px;

    background: white;

    border-radius: 18px;

    box-shadow:

        0 5px 18px

        rgba(0,0,0,.07);

}

.status-topo {

    display: flex;

    align-items: center;

    justify-content:

        space-between;

    font-size: 14px;

    font-weight: 700;

}

.barra {

    width: 100%;

    height: 10px;

    margin-top: 8px;

    border-radius: 20px;

    background: #e9eff1;

    overflow: hidden;

}

#barraHigiene {

    width: 0;

    height: 100%;

    border-radius: 20px;

    background:

        linear-gradient(

            90deg,

            #74c9ee,

            #76d7b1

        );

    transition:

        width .4s ease;

}

/* =========================================================

   BOTÃO

========================================================= */

#btnBanho {

    display: block;

    width: min(94vw, 400px);

    min-height: 50px;

    margin:

        10px auto 0;

    border: none;

    border-radius: 16px;

    background:

        linear-gradient(

            135deg,

            #70c9ef,

            #65b9e5

        );

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:

        0 6px 16px

        rgba(69,158,204,.25);

}

#btnBanho:disabled {

    opacity: .55;

}

/* =========================================================

   MENSAGEM

========================================================= */

#mensagem {

    min-height: 22px;

    margin-top: 10px;

    text-align: center;

    color: #607984;

    font-size: 14px;

}

</style>

</head>

<body>

<div class="app">

    <!-- TOPO -->

    <div class="topo">

        <button

            class="voltar"

            type="button"

            onclick="voltar()"

        >

            ←

        </button>

        <h1>

            Banho 🛁

        </h1>

        <div class="espaco-topo"></div>

    </div>

    <!-- TÍTULO -->

    <div class="titulo">

        <h2>

            Hora do banho!

        </h2>

        <p>

            Deixe seu Petton limpinho ✨

        </p>

    </div>

    <!-- =====================================================

         PALCO

    ====================================================== -->

    <div class="banho-palco">

        <!-- FUNDO -->

        <img

            id="banhoFundo"

            src="967F050B-F7FB-4B39-B665-A32CE466421E.png"

            alt=""

        >

        <!-- ÁGUA DO CHUVEIRO -->

        <div id="aguaBanho">

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

            <span class="gota-banho"></span>

        </div>

        <!-- ÁGUA -->

        <div id="aguaBanheira"></div>

        <!-- ESPUMA ATRÁS -->

        <div id="banhoEspuma">

            <span class="espuma e1"></span>

            <span class="espuma e2"></span>

            <span class="espuma e3"></span>

            <span class="espuma e4"></span>

            <span class="espuma e5"></span>

            <span class="espuma e6"></span>

            <span class="espuma e7"></span>

            <span class="espuma e8"></span>

            <span class="espuma e9"></span>

        </div>

        <!-- PETTON -->

        <img

            id="pettonBanho"

            class="pet-gato"

            alt="Petton tomando banho"

        >

        <!-- FRENTE DA BANHEIRA -->

        <div id="frenteBanheira"></div>

        <!-- BORDA -->

        <div id="bordaFrente"></div>

        <!-- ESPUMA DA FRENTE -->

        <div id="espumaFrente">

            <span class="espuma-frente f1"></span>

            <span class="espuma-frente f2"></span>

            <span class="espuma-frente f3"></span>

            <span class="espuma-frente f4"></span>

            <span class="espuma-frente f5"></span>

            <span class="espuma-frente f6"></span>

            <span class="espuma-frente f7"></span>

            <span class="espuma-frente f8"></span>

        </div>

        <!-- BOLHAS -->

        <div id="bolhas"></div>

    </div>

    <!-- =====================================================

         HIGIENE

    ====================================================== -->

    <div class="status">

        <div class="status-topo">

            <span>

                🧼 Higiene

            </span>

            <span id="higieneValor">

                0%

            </span>

        </div>

        <div class="barra">

            <div id="barraHigiene"></div>

        </div>

    </div>

    <!-- BOTÃO -->

    <button

        id="btnBanho"

        type="button"

        onclick="darBanho()"

    >

        🫧 Dar banho

    </button>

    <div id="mensagem"></div>

</div>

<script src="petton.js"></script>

<script>

/* =========================================================

   IMAGENS DE SEGURANÇA

========================================================= */

const IMAGENS_PETTON = {

    gato:

        "petton-original.png",

    cachorro:

        "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

    coelho:

        "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png",

    urso:

        "petton-original.png"

};

/* =========================================================

   PEGAR DADOS

========================================================= */

function pegarDados() {

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.carregar === "function"

        ) {

            return Petton.carregar();

        }

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

    }

    return null;

}

/* =========================================================

   ESPÉCIE

========================================================= */

function pegarEspecie(dados) {

    let especie =

        String(

            dados?.especie ||

            dados?.tipo ||

            dados?.animal ||

            "gato"

        )

        .toLowerCase()

        .trim();

    if (

        especie.includes("cach") ||

        especie === "dog" ||

        especie === "cao" ||

        especie === "cão"

    ) {

        return "cachorro";

    }

    if (

        especie.includes("coelh") ||

        especie === "rabbit" ||

        especie === "bunny"

    ) {

        return "coelho";

    }

    if (

        especie.includes("urso") ||

        especie === "bear"

    ) {

        return "urso";

    }

    return "gato";

}

/* =========================================================

   IMAGEM DO PETTON

========================================================= */

function pegarImagem(dados) {

    if (!dados) {

        return IMAGENS_PETTON.gato;

    }

    const fase =

        dados.fase ||

        "bebe";

    /*

       Primeiro tenta pegar a imagem EXATA

       daquele Petton.

       Assim continuam funcionando:

       - espécies

       - cores

       - fases

       - variações

    */

    try {

        if (

            dados.identidadeVisual &&

            dados.identidadeVisual.imagens &&

            dados.identidadeVisual.imagens[fase]

        ) {

            return (

                dados.identidadeVisual.imagens[fase]

            );

        }

    } catch (erro) {

        console.error(erro);

    }

    if (dados.imagem) {

        return dados.imagem;

    }

    if (dados.image) {

        return dados.image;

    }

    if (dados.img) {

        return dados.img;

    }

    if (dados.sprite) {

        return dados.sprite;

    }

    const especie =

        pegarEspecie(dados);

    return (

        IMAGENS_PETTON[especie] ||

        IMAGENS_PETTON.gato

    );

}

/* =========================================================

   AJUSTAR POSIÇÃO POR ESPÉCIE

========================================================= */

function ajustarPettonNaBanheira(dados) {

    const imagem =

        document.getElementById(

            "pettonBanho"

        );

    if (!imagem) {

        return;

    }

    const especie =

        pegarEspecie(dados);

    imagem.classList.remove(

        "pet-gato",

        "pet-cachorro",

        "pet-coelho",

        "pet-urso"

    );

    imagem.classList.add(

        "pet-" + especie

    );

}

/* =========================================================

   ATUALIZAR TELA

========================================================= */

function atualizarTelaBanho() {

    const dados =

        pegarDados();

    if (!dados) {

        return;

    }

    const imagem =

        document.getElementById(

            "pettonBanho"

        );

    /* PETTON */

    if (imagem) {

        const src =

            pegarImagem(dados);

        ajustarPettonNaBanheira(

            dados

        );

        if (

            imagem.getAttribute("src") !==

            src

        ) {

            imagem.src =

                src;

        }

    }

    /* HIGIENE */

    let higiene =

        Number(

            dados.higiene ??

            dados.status?.higiene ??

            0

        );

    if (

        Number.isNaN(higiene)

    ) {

        higiene = 0;

    }

    higiene =

        Math.max(

            0,

            Math.min(

                100,

                higiene

            )

        );

    document.getElementById(

        "higieneValor"

    ).textContent =

        Math.round(higiene) +

        "%";

    document.getElementById(

        "barraHigiene"

    ).style.width =

        higiene +

        "%";

    const mensagem =

        document.getElementById(

            "mensagem"

        );

    const botao =

        document.getElementById(

            "btnBanho"

        );

    if (higiene >= 90) {

        mensagem.textContent =

            "✨ Seu Petton já está limpinho!";

        botao.disabled =

            true;

    } else {

        mensagem.textContent =

            "🫧 Seu Petton está pronto para o banho.";

        botao.disabled =

            false;

    }

}

/* =========================================================

   BOLHAS

========================================================= */

function criarBolhas() {

    const area =

        document.getElementById(

            "bolhas"

        );

    if (!area) {

        return;

    }

    area.innerHTML =

        "";

    const bolhas = [

        [10,13,0],

        [22,18,.4],

        [34,12,.15],

        [46,21,.8],

        [58,14,.25],

        [70,18,1],

        [81,12,.55],

        [90,15,.3]

    ];

    bolhas.forEach(

        function(item) {

            const bolha =

                document.createElement(

                    "span"

                );

            bolha.className =

                "bolha";

            bolha.style.left =

                item[0] +

                "%";

            bolha.style.width =

                item[1] +

                "px";

            bolha.style.height =

                item[1] +

                "px";

            bolha.style.animationDelay =

                item[2] +

                "s";

            area.appendChild(

                bolha

            );

        }

    );

}

/* =========================================================

   DAR BANHO

========================================================= */

function darBanho() {

    const dados =

        pegarDados();

    if (!dados) {

        return;

    }

    let higiene =

        Number(

            dados.higiene ??

            dados.status?.higiene ??

            0

        );

    if (

        higiene >= 90

    ) {

        return;

    }

    const botao =

        document.getElementById(

            "btnBanho"

        );

    const mensagem =

        document.getElementById(

            "mensagem"

        );

    botao.disabled =

        true;

    mensagem.textContent =

        "🫧 Tomando banho...";

    criarBolhas();

    const pet =

        document.getElementById(

            "pettonBanho"

        );

    if (pet) {

        pet.animate(

            [

                {

                    transform:

                        "translateX(-50%) rotate(-2deg)"

                },

                {

                    transform:

                        "translateX(-50%) rotate(2deg)"

                },

                {

                    transform:

                        "translateX(-50%) rotate(-2deg)"

                },

                {

                    transform:

                        "translateX(-50%) rotate(2deg)"

                },

                {

                    transform:

                        "translateX(-50%) rotate(0deg)"

                }

            ],

            {

                duration: 900,

                iterations: 3

            }

        );

    }

    setTimeout(

        function() {

            let sucesso =

                false;

            try {

                if (

                    typeof Petton !== "undefined" &&

                    typeof Petton.limpar === "function"

                ) {

                    sucesso =

                        Petton.limpar();

                }

            } catch (erro) {

                console.error(

                    erro

                );

            }

            atualizarTelaBanho();

            if (sucesso) {

                mensagem.textContent =

                    "✨ Pronto! Seu Petton está limpinho!";

            } else {

                mensagem.textContent =

                    "✨ Banho terminado!";

            }

            setTimeout(

                function() {

                    window.location.href =

                        "./index.html";

                },

                1400

            );

        },

        3000

    );

}

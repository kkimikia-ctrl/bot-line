<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="google" content="notranslate">

<title>Petton - Banho 🛁</title>

<style>

/* =========================================================
   GERAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #eefaff 0%,
            #ffffff 100%
        );

    color: #34454d;

    overflow-x: hidden;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;

    margin: 0 auto;

    padding:
        8px
        10px
        24px;
}

/* =========================================================
   TOPO
========================================================= */

.topo {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;

    min-height: 54px;
    margin-bottom: 6px;
}

.topo h1 {
    margin: 0;
    text-align: center;
    font-size: 20px;
}

.voltar {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: #ffffff;
    color: #179fe5;

    font-size: 25px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);
}

.espaco-topo {
    width: 42px;
}

/* =========================================================
   TÍTULO
========================================================= */

.titulo {
    text-align: center;
    margin: 5px 0 10px;
}

.titulo h2 {
    margin: 0;
    font-size: 22px;
}

.titulo p {
    margin: 4px 0 0;

    color: #71838c;
    font-size: 13px;
}

/* =========================================================
   PALCO
========================================================= */

.banho-palco {
    position: relative;

    width: min(94vw, 400px);
    aspect-ratio: 1 / 1;

    margin: 0 auto;

    border-radius: 27px;

    overflow: hidden;

    background: #dff3ff;

    box-shadow:
        0 15px 38px
        rgba(46,86,112,.20);
}

/* =========================================================
   FUNDO DO BANHEIRO
========================================================= */

#banhoFundo {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    z-index: 1;

    pointer-events: none;
}

/* =========================================================
   ÁGUA INTERNA DA BANHEIRA
   FICA ATRÁS DO PETTON
========================================================= */

#aguaInterna {
    position: absolute;

    left: 50%;
    top: 57%;

    width: 76%;
    height: 19%;

    transform:
        translateX(-50%);

    z-index: 2;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(217,249,255,.98) 0%,
            rgba(142,226,250,.98) 48%,
            rgba(74,194,238,.98) 100%
        );

    box-shadow:
        inset 0 5px 12px
        rgba(255,255,255,.75),
        inset 0 -6px 12px
        rgba(31,146,211,.16);

    pointer-events: none;
}

/* brilho da água */

#aguaInterna::after {
    content: "";

    position: absolute;

    left: 12%;
    right: 12%;
    top: 20%;

    height: 18%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.30);

    filter:
        blur(3px);
}

/* =========================================================
   PETTON
   CENTRALIZADO NO MEIO DA BANHEIRA
========================================================= */

#pettonBanho {
    position: absolute;

    left: 50%;
    top: 42%;

    width: 34%;
    max-height: 39%;

    height: auto;

    object-fit: contain;

    z-index: 3;

    transform:
        translateX(-50%);

    transform-origin:
        center bottom;

    filter:
        drop-shadow(
            0 4px 5px
            rgba(0,0,0,.10)
        );

    pointer-events: none;

    animation:
        pettonRespira
        2.2s
        ease-in-out
        infinite
        alternate;
}

/* =========================================================
   AJUSTE POR ESPÉCIE
========================================================= */

#pettonBanho.pet-gato {
    width: 34%;
    top: 42%;
}

#pettonBanho.pet-cachorro {
    width: 34%;
    top: 42%;
}

#pettonBanho.pet-coelho {
    width: 34%;
    top: 42%;
}

/* =========================================================
   MOVIMENTO LEVE
========================================================= */

@keyframes pettonRespira {

    from {
        transform:
            translateX(-50%)
            translateY(0);
    }

    to {
        transform:
            translateX(-50%)
            translateY(-2px);
    }
}

/* =========================================================
   ESPUMA NA FRENTE DO CORPO
========================================================= */

#espumaFrente {
    position: absolute;

    left: 50%;
    top: 61%;

    width: 62%;
    height: 11%;

    transform:
        translateX(-50%);

    z-index: 4;

    pointer-events: none;
}

.espuma {
    position: absolute;

    bottom: 0;

    border-radius: 50%;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #eaf9ff
        );

    box-shadow:
        0 2px 5px
        rgba(47,158,201,.14);
}

.e1 {
    left: 0%;
    width: 38px;
    height: 25px;
}

.e2 {
    left: 12%;
    width: 46px;
    height: 31px;
}

.e3 {
    left: 27%;
    width: 41px;
    height: 27px;
}

.e4 {
    left: 40%;
    width: 48px;
    height: 31px;
}

.e5 {
    left: 55%;
    width: 43px;
    height: 27px;
}

.e6 {
    left: 69%;
    width: 47px;
    height: 30px;
}

.e7 {
    left: 84%;
    width: 37px;
    height: 24px;
}

/* =========================================================
   FRENTE DA BANHEIRA
========================================================= */

#banhoFrente {
    position: absolute;

    left: 50%;
    bottom: 2%;

    width: 96%;
    height: auto;

    transform:
        translateX(-50%);

    object-fit: contain;

    z-index: 5;

    pointer-events: none;
    user-select: none;
}

/* =========================================================
   ÁGUA DO CHUVEIRO
========================================================= */

#aguaChuveiro {
    position: absolute;

    left: 50%;
    top: 13%;

    width: 25%;
    height: 42%;

    transform:
        translateX(-50%);

    z-index: 6;

    overflow: hidden;

    pointer-events: none;
}

.gota {
    position: absolute;

    top: -50px;

    width: 3px;
    height: 50px;

    border-radius: 10px;

    background:
        linear-gradient(
            to bottom,
            rgba(117,211,255,0),
            rgba(117,211,255,.75)
        );

    animation:
        gotaCaindo
        .9s
        linear
        infinite;
}

.gota:nth-child(1) {
    left: 12%;
    animation-delay: 0s;
}

.gota:nth-child(2) {
    left: 30%;
    animation-delay: .2s;
}

.gota:nth-child(3) {
    left: 48%;
    animation-delay: .4s;
}

.gota:nth-child(4) {
    left: 65%;
    animation-delay: .1s;
}

.gota:nth-child(5) {
    left: 82%;
    animation-delay: .3s;
}

@keyframes gotaCaindo {

    0% {
        transform:
            translateY(0);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(190px);

        opacity: 0;
    }
}

/* =========================================================
   BOLHAS ANIMADAS
========================================================= */

#bolhas {
    position: absolute;

    left: 12%;
    right: 12%;

    top: 38%;

    height: 40%;

    z-index: 7;

    overflow: hidden;

    pointer-events: none;
}

.bolha {
    position: absolute;

    bottom: 0;

    border-radius: 50%;

    border:
        2px solid
        rgba(120,207,247,.72);

    background:
        rgba(255,255,255,.14);

    opacity: 0;

    animation:
        bolhaSubir
        3s
        ease-in
        infinite;
}

@keyframes bolhaSubir {

    0% {
        transform:
            translateY(5px)
            scale(.7);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(-100px)
            scale(1.1);

        opacity: 0;
    }
}

/* =========================================================
   STATUS
========================================================= */

.status {
    width: min(94vw, 400px);

    margin:
        12px
        auto
        0;

    padding:
        12px
        14px;

    background: #ffffff;

    border-radius: 18px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.07);
}

.status-topo {
    display: flex;

    align-items: center;
    justify-content: space-between;

    font-size: 14px;
    font-weight: 700;
}

.barra {
    width: 100%;
    height: 10px;

    margin-top: 8px;

    border-radius: 20px;

    background: #e9eff1;

    overflow: hidden;
}

#barraHigiene {
    width: 0;
    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #74c9ee,
            #76d7b1
        );

    transition:
        width
        .4s
        ease;
}

/* =========================================================
   BOTÃO
========================================================= */

#btnBanho {
    display: block;

    width: min(94vw, 400px);

    min-height: 52px;

    margin:
        12px
        auto
        0;

    border: none;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #70c9ef,
            #65b9e5
        );

    color: #ffffff;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 6px 16px
        rgba(69,158,204,.25);
}

#btnBanho:disabled {
    opacity: .55;
}

/* =========================================================
   MENSAGEM
========================================================= */

#mensagem {
    min-height: 22px;

    margin-top: 10px;

    text-align: center;

    color: #607984;

    font-size: 14px;
}

/* =========================================================
   CELULAR PEQUENO
========================================================= */

@media (max-width: 380px) {

    .titulo h2 {
        font-size: 20px;
    }

    .topo h1 {
        font-size: 19px;
    }
}

</style>

</head>

<body>

<div class="app">

    <div class="topo">

        <button
            class="voltar"
            type="button"
            onclick="voltar()"
        >
            ←
        </button>

        <h1>
            Banho 🛁
        </h1>

        <div class="espaco-topo"></div>

    </div>

    <div class="titulo">

        <h2>
            Hora do banho!
        </h2>

        <p>
            Deixe seu Petton limpinho ✨
        </p>

    </div>

    <div class="banho-palco">

        <!-- FUNDO -->

        <img
            id="banhoFundo"
            src="banho-fundo.png"
            alt="Banheiro do Petton"
        >

        <!-- ÁGUA ATRÁS DO PETTON -->

        <div id="aguaInterna"></div>

        <!-- PETTON NO CENTRO -->

        <img
            id="pettonBanho"
            class="pet-gato"
            alt="Petton tomando banho"
        >

        <!-- ESPUMA NA FRENTE DA PARTE BAIXA -->

        <div id="espumaFrente">

            <span class="espuma e1"></span>
            <span class="espuma e2"></span>
            <span class="espuma e3"></span>
            <span class="espuma e4"></span>
            <span class="espuma e5"></span>
            <span class="espuma e6"></span>
            <span class="espuma e7"></span>

        </div>

        <!-- FRENTE DA BANHEIRA -->

        <img
            id="banhoFrente"
            src="banho-frente-transparente.png"
            alt="Banheira"
        >

        <!-- CHUVEIRO -->

        <div id="aguaChuveiro">

            <span class="gota"></span>
            <span class="gota"></span>
            <span class="gota"></span>
            <span class="gota"></span>
            <span class="gota"></span>

        </div>

        <div id="bolhas"></div>

    </div>

    <div class="status">

        <div class="status-topo">

            <span>
                🧼 Higiene
            </span>

            <span id="higieneValor">
                0%
            </span>

        </div>

        <div class="barra">
            <div id="barraHigiene"></div>
        </div>

    </div>

    <button
        id="btnBanho"
        type="button"
        onclick="darBanho()"
    >
        🫧 Dar banho
    </button>

    <div id="mensagem"></div>

</div>

<script src="petton.js"></script>

<script>

/* =========================================================
   IMAGENS
========================================================= */

const IMAGENS_PETTON = {

    gato:
        "petton-original.png",

    cachorro:
        "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

    coelho:
        "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

};

/* =========================================================
   CARREGAR DADOS
========================================================= */

function pegarDados() {

    try {

        if (
            typeof Petton !== "undefined" &&
            typeof Petton.carregar === "function"
        ) {

            return Petton.carregar();
        }

    } catch (erro) {

        console.error(
            "Erro ao carregar Petton:",
            erro
        );
    }

    return null;
}

/* =========================================================
   ESPÉCIE
========================================================= */

function pegarEspecie(dados) {

    let especie =
        String(
            dados?.especie ||
            dados?.tipo ||
            dados?.animal ||
            "gato"
        )
        .toLowerCase()
        .trim();

    if (
        especie.includes("cach") ||
        especie === "dog" ||
        especie === "cao" ||
        especie === "cão"
    ) {

        return "cachorro";
    }

    if (
        especie.includes("coelh") ||
        especie === "rabbit" ||
        especie === "bunny"
    ) {

        return "coelho";
    }

    return "gato";
}

/* =========================================================
   IMAGEM DO PETTON
========================================================= */

function pegarImagem(dados) {

    if (!dados) {

        return IMAGENS_PETTON.gato;
    }

    const fase =
        String(
            dados.fase ||
            "bebe"
        );

    try {

        if (
            dados.identidadeVisual &&
            dados.identidadeVisual.imagens &&
            dados.identidadeVisual.imagens[fase]
        ) {

            return dados.identidadeVisual.imagens[fase];
        }

    } catch (erro) {

        console.error(erro);
    }

    if (dados.imagem) {
        return dados.imagem;
    }

    if (dados.image) {
        return dados.image;
    }

    if (dados.img) {
        return dados.img;
    }

    if (dados.sprite) {
        return dados.sprite;
    }

    const especie =
        pegarEspecie(dados);

    return (
        IMAGENS_PETTON[especie] ||
        IMAGENS_PETTON.gato
    );
}

/* =========================================================
   AJUSTAR ESPÉCIE
========================================================= */

function ajustarPetton(dados) {

    const imagem =
        document.getElementById(
            "pettonBanho"
        );

    if (!imagem) {
        return;
    }

    const especie =
        pegarEspecie(dados);

    imagem.classList.remove(
        "pet-gato",
        "pet-cachorro",
        "pet-coelho"
    );

    imagem.classList.add(
        "pet-" + especie
    );
}

/* =========================================================
   ATUALIZAR TELA
========================================================= */

function atualizarTelaBanho() {

    const dados =
        pegarDados();

    if (!dados) {

        console.warn(
            "Petton não encontrado."
        );

        return;
    }

    const imagem =
        document.getElementById(
            "pettonBanho"
        );

    if (imagem) {

        ajustarPetton(dados);

        const src =
            pegarImagem(dados);

        if (
            imagem.getAttribute("src") !== src
        ) {

            imagem.src = src;
        }
    }

    let higiene =
        Number(
            dados.higiene ??
            dados.status?.higiene ??
            0
        );

    if (
        Number.isNaN(higiene)
    ) {

        higiene = 0;
    }

    higiene =
        Math.max(
            0,
            Math.min(
                100,
                higiene
            )
        );

    const valor =
        document.getElementById(
            "higieneValor"
        );

    const barra =
        document.getElementById(
            "barraHigiene"
        );

    if (valor) {

        valor.textContent =
            Math.round(higiene) +
            "%";
    }

    if (barra) {

        barra.style.width =
            higiene +
            "%";
    }

    const mensagem =
        document.getElementById(
            "mensagem"
        );

    const botao =
        document.getElementById(
            "btnBanho"
        );

    if (
        higiene >= 90
    ) {

        mensagem.textContent =
            "✨ Seu Petton já está limpinho!";

        botao.disabled =
            true;

    } else {

        mensagem.textContent =
            "🫧 Seu Petton está pronto para o banho.";

        botao.disabled =
            false;
    }
}

/* =========================================================
   BOLHAS
========================================================= */

function criarBolhas() {

    const area =
        document.getElementById(
            "bolhas"
        );

    if (!area) {
        return;
    }

    area.innerHTML = "";

    const bolhas = [
        [7,10,0],
        [18,14,.5],
        [31,8,.2],
        [44,12,.8],
        [57,9,.3],
        [69,14,1],
        [82,8,.6],
        [92,11,.4]
    ];

    bolhas.forEach(

        function(item) {

            const bolha =
                document.createElement(
                    "span"
                );

            bolha.className =
                "bolha";

            bolha.style.left =
                item[0] +
                "%";

            bolha.style.width =
                item[1] +
                "px";

            bolha.style.height =
                item[1] +
                "px";

            bolha.style.animationDelay =
                item[2] +
                "s";

            area.appendChild(
                bolha
            );
        }
    );
}

/* =========================================================
   DAR BANHO
========================================================= */

function darBanho() {

    const dados =
        pegarDados();

    if (!dados) {
        return;
    }

    let higiene =
        Number(
            dados.higiene ??
            dados.status?.higiene ??
            0
        );

    if (
        Number.isNaN(higiene)
    ) {

        higiene = 0;
    }

    if (
        higiene >= 90
    ) {

        return;
    }

    const botao =
        document.getElementById(
            "btnBanho"
        );

    const mensagem =
        document.getElementById(
            "mensagem"
        );

    botao.disabled =
        true;

    mensagem.textContent =
        "🫧 Tomando banho...";

    criarBolhas();

    const pet =
        document.getElementById(
            "pettonBanho"
        );

    if (pet) {

        pet.animate(

            [
                {
                    transform:
                        "translateX(-50%) rotate(-2deg)"
                },

                {
                    transform:
                        "translateX(-50%) rotate(2deg)"
                },

                {
                    transform:
                        "translateX(-50%) rotate(-2deg)"
                },

                {
                    transform:
                        "translateX(-50%) rotate(2deg)"
                },

                {
                    transform:
                        "translateX(-50%) rotate(0deg)"
                }
            ],

            {
                duration: 900,
                iterations: 3
            }
        );
    }

    setTimeout(

        function() {

            let sucesso =
                false;

            try {

                if (
                    typeof Petton !== "undefined" &&
                    typeof Petton.limpar === "function"
                ) {

                    sucesso =
                        Petton.limpar();
                }

            } catch (erro) {

                console.error(erro);
            }

            atualizarTelaBanho();

            if (sucesso) {

                mensagem.textContent =
                    "✨ Pronto! Seu Petton está limpinho!";

            } else {

                mensagem.textContent =
                    "✨ Banho terminado!";
            }

            setTimeout(

                function() {

                    window.location.href =
                        "./index.html";
                },

                1400
            );

        },

        3000
    );
}

/* =========================================================
   VOLTAR
========================================================= */

function voltar() {

    window.location.href =
        "./index.html";
}

/* =========================================================
   INICIAR
========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        atualizarTelaBanho();

        criarBolhas();
    }
);

</script>

</body>

</html>

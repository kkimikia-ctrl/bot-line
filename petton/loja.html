<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<title>Loja do Petton 🛍️</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    min-height:100vh;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

    background:#f7efe5;

    color:#333;

}

.container{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:14px;

}

/* =========================

   TOPO

========================= */

.topo{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:12px;

}

.voltar{

    width:44px;

    height:44px;

    border:0;

    border-radius:14px;

    background:white;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    font-size:23px;

}

.titulo{

    flex:1;

}

.titulo h1{

    margin:0;

    font-size:23px;

}

.titulo p{

    margin:3px 0 0;

    color:#777;

    font-size:12px;

}

/* =========================

   MOEDAS

========================= */

.saldo-card{

    background:white;

    border-radius:22px;

    padding:16px;

    margin-bottom:12px;

    box-shadow:0 5px 18px rgba(0,0,0,.08);

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.saldo-info{

    display:flex;

    align-items:center;

    gap:10px;

}

.moeda-icon{

    width:48px;

    height:48px;

    border-radius:16px;

    background:#fff4c2;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

}

.saldo-label{

    font-size:12px;

    color:#777;

}

.saldo{

    font-size:22px;

    font-weight:800;

    color:#d18b00;

}

/* =========================

   CATEGORIAS

========================= */

.categorias{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:3px 2px 10px;

}

.categoria{

    flex:none;

    border:0;

    border-radius:14px;

    padding:9px 13px;

    background:white;

    color:#666;

    font-size:12px;

    font-weight:700;

    box-shadow:0 2px 8px rgba(0,0,0,.06);

}

.categoria.ativa{

    background:#16a34a;

    color:white;

}

/* =========================

   PRODUTOS

========================= */

.produtos{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:12px;

}

.produto{

    background:white;

    border-radius:22px;

    padding:14px;

    box-shadow:0 4px 16px rgba(0,0,0,.07);

    text-align:center;

    position:relative;

}

.produto-emoji{

    height:82px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:58px;

}

.produto-nome{

    font-size:14px;

    font-weight:800;

    margin-top:5px;

    min-height:36px;

    display:flex;

    align-items:center;

    justify-content:center;

}

.produto-preco{

    margin-top:7px;

    font-size:14px;

    font-weight:800;

    color:#d18b00;

}

.botao-comprar{

    width:100%;

    border:0;

    border-radius:13px;

    padding:10px 8px;

    margin-top:10px;

    background:#16a34a;

    color:white;

    font-size:13px;

    font-weight:800;

}

.botao-comprar:active{

    transform:scale(.96);

}

.botao-comprar:disabled{

    background:#ccc;

    color:#777;

}

.comprado{

    margin-top:10px;

    padding:9px 6px;

    border-radius:13px;

    background:#e9f8ed;

    color:#16a34a;

    font-size:12px;

    font-weight:800;

}

/* =========================

   MENSAGEM

========================= */

.mensagem{

    min-height:22px;

    text-align:center;

    margin:10px 0;

    font-size:13px;

    font-weight:800;

    color:#16a34a;

}

.mensagem.erro{

    color:#dc2626;

}

/* =========================

   INVENTÁRIO

========================= */

.card{

    margin-top:14px;

    background:white;

    border-radius:22px;

    padding:16px;

    box-shadow:0 4px 16px rgba(0,0,0,.07);

}

.card h2{

    margin:0 0 10px;

    font-size:18px;

}

.inventario{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:3px;

}

.item-inventario{

    flex:none;

    background:#f7f7f7;

    border-radius:15px;

    padding:9px 12px;

    font-size:12px;

    font-weight:700;

}

.sem-itens{

    color:#888;

    text-align:center;

    padding:10px;

    font-size:13px;

}

/* =========================

   MOBILE

========================= */

@media(max-width:420px){

    .produtos{

        gap:9px;

    }

    .produto{

        padding:11px;

    }

    .produto-emoji{

        height:72px;

        font-size:51px;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- =========================

     TOPO

========================= -->

<div class="topo">

    <button

        class="voltar"

        onclick="history.back()"

    >

        ←

    </button>

    <div class="titulo">

        <h1>

            🛍️ Loja do Petton

        </h1>

        <p>

            Deixe o cantinho do seu amigo ainda mais bonito

        </p>

    </div>

</div>

<!-- =========================

     SALDO

========================= -->

<div class="saldo-card">

    <div class="saldo-info">

        <div class="moeda-icon">

            🪙

        </div>

        <div>

            <div class="saldo-label">

                Suas moedas

            </div>

            <div

                id="saldo"

                class="saldo"

            >

                0

            </div>

        </div>

    </div>

    <div>

        🐾

    </div>

</div>

<!-- =========================

     CATEGORIAS

========================= -->

<div class="categorias">

    <button

        class="categoria ativa"

        onclick="selecionarCategoria('todos',this)"

    >

        Todos

    </button>

    <button

        class="categoria"

        onclick="selecionarCategoria('cama',this)"

    >

        🛏️ Camas

    </button>

    <button

        class="categoria"

        onclick="selecionarCategoria('brinquedo',this)"

    >

        🎾 Brinquedos

    </button>

    <button

        class="categoria"

        onclick="selecionarCategoria('pote',this)"

    >

        🥣 Comida

    </button>

    <button

        class="categoria"

        onclick="selecionarCategoria('planta',this)"

    >

        🌱 Plantas

    </button>

    <button

        class="categoria"

        onclick="selecionarCategoria('decoracao',this)"

    >

        ✨ Decoração

    </button>

</div>

<!-- =========================

     MENSAGEM

========================= -->

<div

    id="mensagem"

    class="mensagem"

></div>

<!-- =========================

     PRODUTOS

========================= -->

<div

    id="produtos"

    class="produtos"

></div>

<!-- =========================

     INVENTÁRIO

========================= -->

<div class="card">

    <h2>

        🎒 Meus itens

    </h2>

    <div

        id="inventario"

        class="inventario"

    ></div>

</div>

</div>

<!-- =================================================

     PETTON

================================================= -->

<script src="petton.js"></script>

<script>

/* =================================================

   CONFIGURAÇÃO

================================================= */

const CHAVE_LOJA = "petton_loja_v1";

let inventario = [];

let categoriaAtual = "todos";

/* =================================================

   PRODUTOS

================================================= */

const produtosLista = [

    {

        id:"cama_basica",

        nome:"Caminha simples",

        emoji:"🛏️",

        preco:100,

        tipo:"cama"

    },

    {

        id:"cama_rosa",

        nome:"Caminha fofa",

        emoji:"🛌",

        preco:180,

        tipo:"cama"

    },

    {

        id:"cama_casinha",

        nome:"Casinha",

        emoji:"🏠",

        preco:300,

        tipo:"cama"

    },

    {

        id:"bola",

        nome:"Bola",

        emoji:"⚽",

        preco:60,

        tipo:"brinquedo"

    },

    {

        id:"bolinha",

        nome:"Bolinha",

        emoji:"🔴",

        preco:80,

        tipo:"brinquedo"

    },

    {

        id:"ratinho",

        nome:"Ratinho",

        emoji:"🐭",

        preco:120,

        tipo:"brinquedo"

    },

    {

        id:"arranhador",

        nome:"Arranhador",

        emoji:"🪵",

        preco:220,

        tipo:"brinquedo"

    },

    {

        id:"pelucia",

        nome:"Bichinho de pelúcia",

        emoji:"🧸",

        preco:250,

        tipo:"brinquedo"

    },

    {

        id:"pote",

        nome:"Pote de comida",

        emoji:"🥣",

        preco:70,

        tipo:"pote"

    },

    {

        id:"pote_agua",

        nome:"Pote de água",

        emoji:"💧",

        preco:70,

        tipo:"pote"

    },

    {

        id:"planta",

        nome:"Plantinha",

        emoji:"🌱",

        preco:90,

        tipo:"planta"

    },

    {

        id:"flor",

        nome:"Vaso de flores",

        emoji:"🌷",

        preco:130,

        tipo:"planta"

    },

    {

        id:"tapete",

        nome:"Tapete",

        emoji:"🟫",

        preco:160,

        tipo:"decoracao"

    },

    {

        id:"abajur",

        nome:"Abajur",

        emoji:"💡",

        preco:200,

        tipo:"decoracao"

    },

    {

        id:"quadro",

        nome:"Quadro",

        emoji:"🖼️",

        preco:150,

        tipo:"decoracao"

    }

];

/* =================================================

   CARREGAR INVENTÁRIO

================================================= */

function carregarInventario(){

    try{

        const salvo =

            localStorage.getItem(

                CHAVE_LOJA

            );

        if(salvo){

            const dados =

                JSON.parse(salvo);

            if(Array.isArray(dados)){

                inventario = dados;

            }else{

                inventario = [];

            }

        }else{

            inventario = [];

        }

    }catch(erro){

        console.error(

            "Erro ao carregar inventário:",

            erro

        );

        inventario = [];

    }

}

/* =================================================

   SALVAR INVENTÁRIO

================================================= */

function salvarInventario(){

    try{

        localStorage.setItem(

            CHAVE_LOJA,

            JSON.stringify(inventario)

        );

    }catch(erro){

        console.error(

            "Erro ao salvar inventário:",

            erro

        );

    }

}

/* =================================================

   PEGAR DADOS DO PETTON

================================================= */

function obterPetton(){

    try{

        if(

            window.Petton &&

            typeof Petton.carregar === "function"

        ){

            return Petton.carregar();

        }

    }catch(erro){

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

    }

    return null;

}

/* =================================================

   PEGAR MOEDAS REAIS

================================================= */

function obterMoedas(){

    const dados =

        obterPetton();

    if(!dados){

        return 0;

    }

    let moedas =

        Number(dados.moedas);

    if(

        !Number.isFinite(moedas) ||

        moedas < 0

    ){

        moedas = 0;

        dados.moedas = 0;

        if(

            window.Petton &&

            typeof Petton.salvar === "function"

        ){

            Petton.salvar();

        }

    }

    return Math.floor(moedas);

}

/* =================================================

   ATUALIZAR SALDO

================================================= */

function atualizarSaldo(){

    const saldo =

        obterMoedas();

    document.getElementById(

        "saldo"

    ).textContent =

        saldo;

}

/* =================================================

   VERIFICAR POSSE

================================================= */

function possui(id){

    return inventario.includes(id);

}

/* =================================================

   MENSAGEM

================================================= */

function mostrarMensagem(

    texto,

    erro = false

){

    const elemento =

        document.getElementById(

            "mensagem"

        );

    elemento.textContent =

        texto;

    elemento.className =

        erro

            ? "mensagem erro"

            : "mensagem";

    setTimeout(

        function(){

            if(

                elemento.textContent ===

                texto

            ){

                elemento.textContent = "";

            }

        },

        2500

    );

}

/* =================================================

   COMPRAR

================================================= */

function comprar(id){

    const produto =

        produtosLista.find(

            item =>

                item.id === id

        );

    if(!produto){

        return;

    }

    /* =========================

       JÁ POSSUI

    ========================= */

    if(possui(id)){

        mostrarMensagem(

            "✓ Você já possui este item.",

            true

        );

        return;

    }

    /* =========================

       PETTON

    ========================= */

    const dados =

        obterPetton();

    if(!dados){

        mostrarMensagem(

            "⚠️ Não foi possível carregar o Petton.",

            true

        );

        return;

    }

    /* =========================

       MOEDAS

    ========================= */

    let moedas =

        Number(dados.moedas);

    if(

        !Number.isFinite(moedas)

    ){

        moedas = 0;

    }

    if(moedas < produto.preco){

        mostrarMensagem(

            "🪙 Você não tem moedas suficientes.",

            true

        );

        return;

    }

    /* =========================

       DESCONTAR

    ========================= */

    dados.moedas =

        moedas -

        produto.preco;

    /* =========================

       SALVAR PETTON

    ========================= */

    if(

        window.Petton &&

        typeof Petton.salvar === "function"

    ){

        Petton.salvar();

    }else{

        localStorage.setItem(

            "petton_dados_v3",

            JSON.stringify(dados)

        );

    }

    /* =========================

       ADICIONAR INVENTÁRIO

    ========================= */

    inventario.push(

        produto.id

    );

    salvarInventario();

    /* =========================

       ATUALIZAR

    ========================= */

    atualizarSaldo();

    renderizarProdutos();

    renderizarInventario();

    mostrarMensagem(

        "🎉 " +

        produto.nome +

        " comprado!"

    );

}

/* =================================================

   CATEGORIA

================================================= */

function selecionarCategoria(

    categoria,

    botao

){

    categoriaAtual =

        categoria;

    document

        .querySelectorAll(

            ".categoria"

        )

        .forEach(

            function(item){

                item.classList.remove(

                    "ativa"

                );

            }

        );

    if(botao){

        botao.classList.add(

            "ativa"

        );

    }

    renderizarProdutos();

}

/* =================================================

   RENDERIZAR PRODUTOS

================================================= */

function renderizarProdutos(){

    const area =

        document.getElementById(

            "produtos"

        );

    let lista =

        produtosLista;

    if(

        categoriaAtual !==

        "todos"

    ){

        lista =

            produtosLista.filter(

                function(produto){

                    return (

                        produto.tipo ===

                        categoriaAtual

                    );

                }

            );

    }

    area.innerHTML =

        lista.map(

            function(produto){

                const comprado =

                    possui(produto.id);

                const moedas =

                    obterMoedas();

                const suficiente =

                    moedas >=

                    produto.preco;

                if(comprado){

                    return `

                        <div class="produto">

                            <div class="produto-emoji">

                                ${produto.emoji}

                            </div>

                            <div class="produto-nome">

                                ${produto.nome}

                            </div>

                            <div class="produto-preco">

                                🪙 ${produto.preco}

                            </div>

                            <div class="comprado">

                                ✓ Já comprado

                            </div>

                        </div>

                    `;

                }

                return `

                    <div class="produto">

                        <div class="produto-emoji">

                            ${produto.emoji}

                        </div>

                        <div class="produto-nome">

                            ${produto.nome}

                        </div>

                        <div class="produto-preco">

                            🪙 ${produto.preco}

                        </div>

                        <button

                            class="botao-comprar"

                            onclick="comprar('${produto.id}')"

                            ${suficiente ? "" : "disabled"}

                        >

                            ${

                                suficiente

                                    ? "🛍️ Comprar"

                                    : "🪙 Moedas insuficientes"

                            }

                        </button>

                    </div>

                `;

            }

        ).join("");

}

/* =================================================

   INVENTÁRIO

================================================= */

function renderizarInventario(){

    const area =

        document.getElementById(

            "inventario"

        );

    if(

        !inventario ||

        inventario.length === 0

    ){

        area.innerHTML = `

            <div class="sem-itens">

                Você ainda não comprou

                nenhum objeto. 🐾

            </div>

        `;

        return;

    }

    const itens =

        inventario

            .map(

                function(id){

                    return produtosLista.find(

                        function(produto){

                            return produto.id === id;

                        }

                    );

                }

            )

            .filter(Boolean);

    area.innerHTML =

        itens.map(

            function(item){

                return `

                    <div

                        class="item-inventario"

                    >

                        ${item.emoji}

                        ${item.nome}

                    </div>

                `;

            }

        ).join("");

}

/* =================================================

   ATUALIZAÇÃO

================================================= */

function atualizarTudo(){

    carregarInventario();

    atualizarSaldo();

    renderizarProdutos();

    renderizarInventario();

}

/* =================================================

   INICIAR

================================================= */

atualizarTudo();

/* =================================================

   ATUALIZAR QUANDO O PETTON MUDAR

================================================= */

window.addEventListener(

    "petton-atualizado",

    function(){

        atualizarSaldo();

        renderizarProdutos();

    }

);

/* =================================================

   ATUALIZAÇÃO PERIÓDICA

================================================= */

setInterval(

    function(){

        atualizarSaldo();

    },

    3000

);

</script>

</body>

</html>

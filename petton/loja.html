<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Loja Petton 🛍️</title>

<script src="./petton.js"></script>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    background: linear-gradient(180deg, #fff8ed, #fff0d8);

    color: #4b3424;

    min-height: 100vh;

}

header {

    padding: 18px 16px 12px;

    text-align: center;

}

header h1 {

    margin: 0;

    font-size: 28px;

}

header p {

    margin: 6px 0 0;

    font-size: 14px;

    opacity: .75;

}

.saldo {

    margin: 12px 16px 18px;

    background: white;

    border-radius: 18px;

    padding: 15px;

    text-align: center;

    box-shadow: 0 4px 15px rgba(0,0,0,.08);

    font-size: 20px;

    font-weight: 800;

}

#saldoPontos {

    font-size: 26px;

}

.loja {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 14px;

    padding: 0 14px 30px;

}

.produto {

    background: white;

    border-radius: 20px;

    padding: 14px;

    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,.08);

    position: relative;

    overflow: hidden;

}

.produto .emoji {

    font-size: 52px;

    margin: 4px 0 8px;

}

.produto h3 {

    margin: 4px 0;

    font-size: 17px;

}

.produto p {

    margin: 4px 0 10px;

    font-size: 13px;

    opacity: .7;

    min-height: 32px;

}

.preco {

    font-weight: 800;

    margin-bottom: 9px;

}

button {

    width: 100%;

    border: 0;

    border-radius: 13px;

    padding: 11px 8px;

    background: #ff9f43;

    color: white;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

}

button:active {

    transform: scale(.97);

}

button.comprado {

    background: #8bc34a;

}

button:disabled {

    opacity: .6;

}

.voltar {

    display: block;

    margin: 0 16px 25px;

    text-align: center;

    text-decoration: none;

    background: #6d4c41;

    color: white;

    padding: 14px;

    border-radius: 15px;

    font-weight: 800;

}

.mensagem {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform: translateX(-50%);

    background: #4b3424;

    color: white;

    padding: 13px 20px;

    border-radius: 15px;

    font-weight: 700;

    display: none;

    z-index: 999;

    white-space: nowrap;

}

@media (max-width: 360px) {

    .loja {

        gap: 10px;

        padding: 0 10px 25px;

    }

    .produto {

        padding: 11px;

    }

    .produto .emoji {

        font-size: 45px;

    }

}

</style>

</head>

<body>

<header>

    <h1>🛍️ Loja Petton</h1>

    <p>Deixe o cantinho do seu Petton mais bonito!</p>

</header>

<div class="saldo">

    ⭐ Seus pontos<br>

    <span id="saldoPontos">0</span>

</div>

<div class="loja" id="listaProdutos"></div>

<a href="./quarto.html" class="voltar">

    🏠 Voltar para o quarto

</a>

<div class="mensagem" id="mensagem"></div>

<script>

const CHAVE_LOJA = "petton_loja_v1";

const CHAVE_PETTON = "petton_dados_v3";

/* =========================================================

   PRODUTOS

========================================================= */

const produtos = [

    {

        id: "cama_basica",

        nome: "Caminha",

        emoji: "🛏️",

        preco: 100,

        descricao: "Uma caminha confortável."

    },

    {

        id: "cama_rosa",

        nome: "Cama rosa",

        emoji: "🛌",

        preco: 180,

        descricao: "Uma caminha rosa bem fofa."

    },

    {

        id: "cama_casinha",

        nome: "Casinha",

        emoji: "🏠",

        preco: 300,

        descricao: "Uma casinha especial para o Petton."

    },

    {

        id: "bola",

        nome: "Bola",

        emoji: "⚽",

        preco: 60,

        descricao: "Uma bola para brincar."

    },

    {

        id: "bolinha",

        nome: "Bolinha",

        emoji: "🟠",

        preco: 80,

        descricao: "Uma bolinha divertida."

    },

    {

        id: "ratinho",

        nome: "Ratinho",

        emoji: "🐭",

        preco: 120,

        descricao: "Um brinquedo para perseguir."

    },

    {

        id: "arranhador",

        nome: "Arranhador",

        emoji: "🪵",

        preco: 220,

        descricao: "Perfeito para brincar e arranhar."

    },

    {

        id: "pelucia",

        nome: "Pelúcia",

        emoji: "🧸",

        preco: 250,

        descricao: "Uma pelúcia para companhia."

    },

    {

        id: "pote",

        nome: "Pote de comida",

        emoji: "🍚",

        preco: 70,

        descricao: "Um pote para a comida."

    },

    {

        id: "pote_agua",

        nome: "Pote de água",

        emoji: "💧",

        preco: 70,

        descricao: "Água fresquinha para o Petton."

    },

    {

        id: "planta",

        nome: "Planta",

        emoji: "🌱",

        preco: 90,

        descricao: "Uma plantinha para decorar."

    },

    {

        id: "flor",

        nome: "Flor",

        emoji: "🌸",

        preco: 130,

        descricao: "Uma flor bonita para o quarto."

    },

    {

        id: "tapete",

        nome: "Tapete",

        emoji: "🟫",

        preco: 160,

        descricao: "Um tapete confortável."

    },

    {

        id: "abajur",

        nome: "Abajur",

        emoji: "🛋️",

        preco: 200,

        descricao: "Uma luz aconchegante."

    },

    {

        id: "quadro",

        nome: "Quadro",

        emoji: "🖼️",

        preco: 150,

        descricao: "Um quadro para decorar."

    }

];

/* =========================================================

   INVENTÁRIO

========================================================= */

function carregarInventario() {

    try {

        const salvo = localStorage.getItem(CHAVE_LOJA);

        if (!salvo) {

            return [];

        }

        const inventario = JSON.parse(salvo);

        return Array.isArray(inventario) ? inventario : [];

    } catch (erro) {

        console.error("Erro ao carregar inventário:", erro);

        return [];

    }

}

function salvarInventario(inventario) {

    localStorage.setItem(

        CHAVE_LOJA,

        JSON.stringify(inventario)

    );

}

/* =========================================================

   CARREGAR PETTON

========================================================= */

function carregarDadosPetton() {

    try {

        const salvo = localStorage.getItem(CHAVE_PETTON);

        if (!salvo) {

            return null;

        }

        return JSON.parse(salvo);

    } catch (erro) {

        console.error("Erro ao carregar Petton:", erro);

        return null;

    }

}

/* =========================================================

   SALVAR PETTON

========================================================= */

function salvarDadosPetton(dados) {

    if (!dados) return false;

    localStorage.setItem(

        CHAVE_PETTON,

        JSON.stringify(dados)

    );

    return true;

}

/* =========================================================

   OBTER PONTOS

========================================================= */

function obterPontos() {

    const dados = carregarDadosPetton();

    if (!dados) {

        return 0;

    }

    let pontos = Number(dados.pontos);

    if (!Number.isFinite(pontos)) {

        pontos = 0;

    }

    return Math.max(0, pontos);

}

/* =========================================================

   ATUALIZAR SALDO

========================================================= */

function atualizarSaldo() {

    const saldo = obterPontos();

    document.getElementById("saldoPontos").textContent =

        Math.floor(saldo);

}

/* =========================================================

   MENSAGEM

========================================================= */

function mostrarMensagem(texto) {

    const elemento =

        document.getElementById("mensagem");

    elemento.textContent = texto;

    elemento.style.display = "block";

    clearTimeout(window.timerMensagem);

    window.timerMensagem = setTimeout(function() {

        elemento.style.display = "none";

    }, 2200);

}

/* =========================================================

   VERIFICAR SE COMPROU

========================================================= */

function produtoComprado(id) {

    const inventario = carregarInventario();

    return inventario.includes(id);

}

/* =========================================================

   DESENHAR LOJA

========================================================= */

function desenharLoja() {

    const container =

        document.getElementById("listaProdutos");

    container.innerHTML = "";

    const saldo = obterPontos();

    produtos.forEach(function(produto) {

        const comprado =

            produtoComprado(produto.id);

        const div =

            document.createElement("div");

        div.className = "produto";

        div.innerHTML = `

            <div class="emoji">${produto.emoji}</div>

            <h3>${produto.nome}</h3>

            <p>${produto.descricao}</p>

            <div class="preco">

                ⭐ ${produto.preco} pontos

            </div>

            <button

                ${comprado ? "disabled" : ""}

                class="${comprado ? "comprado" : ""}"

                onclick="comprar('${produto.id}')"

            >

                ${comprado ? "✓ Comprado" : "Comprar"}

            </button>

        `;

        container.appendChild(div);

    });

}

/* =========================================================

   COMPRAR

========================================================= */

function comprar(id) {

    const produto =

        produtos.find(function(item) {

            return item.id === id;

        });

    if (!produto) {

        mostrarMensagem("Produto não encontrado.");

        return;

    }

    /* ---------------------------------------------

       NÃO COMPRAR DUAS VEZES

    --------------------------------------------- */

    const inventario =

        carregarInventario();

    if (inventario.includes(produto.id)) {

        mostrarMensagem("Você já tem esse item!");

        return;

    }

    /* ---------------------------------------------

       CARREGAR PETTON

    --------------------------------------------- */

    const dados =

        carregarDadosPetton();

    if (!dados) {

        mostrarMensagem("Petton ainda não foi carregado.");

        return;

    }

    /* ---------------------------------------------

       USAR PONTOS

    --------------------------------------------- */

    let pontos =

        Number(dados.pontos);

    if (!Number.isFinite(pontos)) {

        pontos = 0;

    }

    /* ---------------------------------------------

       VERIFICAR SALDO

    --------------------------------------------- */

    if (pontos < produto.preco) {

        mostrarMensagem(

            "Você precisa de mais pontos!"

        );

        return;

    }

    /* ---------------------------------------------

       DESCONTAR

    --------------------------------------------- */

    pontos =

        pontos - produto.preco;

    dados.pontos = pontos;

    /* ---------------------------------------------

       SALVAR PETTON

    --------------------------------------------- */

    const salvou =

        salvarDadosPetton(dados);

    if (!salvou) {

        mostrarMensagem(

            "Erro ao salvar a compra."

        );

        return;

    }

    /* ---------------------------------------------

       ADICIONAR AO INVENTÁRIO

    --------------------------------------------- */

    inventario.push(produto.id);

    salvarInventario(inventario);

    /* ---------------------------------------------

       ATUALIZAR TELA

    --------------------------------------------- */

    atualizarSaldo();

    desenharLoja();

    mostrarMensagem(

        "🎉 " + produto.nome + " comprado!"

    );

}

/* =========================================================

   INICIALIZAÇÃO

========================================================= */

atualizarSaldo();

desenharLoja();

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Pular Obstáculos 🪵</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overscroll-behavior: none;

}

body {

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #dff5ff 0%,

            #f4fbff 45%,

            #e8f7d9 100%

        );

    color: #333;

    overflow: hidden;

    touch-action: manipulation;

}

/* =========================================================

   APP

========================================================= */

.app {

    width: 100%;

    max-width: 520px;

    height: 100%;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    position: relative;

}

/* =========================================================

   TOPO

========================================================= */

.topo {

    height: 58px;

    flex: 0 0 58px;

    display: grid;

    grid-template-columns: 46px 1fr 46px;

    align-items: center;

    padding: 6px 9px;

    background: rgba(255,255,255,.94);

    border-bottom:

        1px solid rgba(0,0,0,.07);

    z-index: 100;

}

.btn-voltar {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #f2f6f0;

    font-size: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

}

.btn-voltar:active {

    transform: scale(.94);

}

.titulo {

    text-align: center;

}

.titulo strong {

    display: block;

    font-size: 16px;

    line-height: 1.1;

}

.titulo span {

    display: block;

    margin-top: 2px;

    color: #888;

    font-size: 10px;

}

/* =========================================================

   PLACAR

========================================================= */

.placar {

    position: absolute;

    top: 70px;

    left: 10px;

    right: 10px;

    z-index: 20;

    display: grid;

    grid-template-columns:

        repeat(3, 1fr);

    gap: 7px;

    pointer-events: none;

}

.placar-item {

    padding: 7px 5px;

    background:

        rgba(255,255,255,.91);

    border-radius: 13px;

    text-align: center;

    box-shadow:

        0 2px 10px rgba(0,0,0,.07);

}

.placar-label {

    display: block;

    font-size: 9px;

    color: #888;

}

.placar-valor {

    display: block;

    margin-top: 1px;

    font-size: 17px;

    font-weight: 800;

}

/* =========================================================

   ÁREA DO JOGO

========================================================= */

#jogo {

    position: relative;

    flex: 1;

    width: 100%;

    overflow: hidden;

    user-select: none;

    -webkit-user-select: none;

    touch-action: none;

    background:

        linear-gradient(

            180deg,

            #cceeff 0%,

            #eaf8ff 53%,

            #dff2c7 53%,

            #b9dd91 100%

        );

}

/* =========================================================

   SOL

========================================================= */

.sol {

    position: absolute;

    width: 62px;

    height: 62px;

    top: 70px;

    right: 25px;

    border-radius: 50%;

    background: #ffe58a;

    box-shadow:

        0 0 30px

        rgba(255,220,80,.45);

    opacity: .9;

}

/* =========================================================

   NUVENS

========================================================= */

.nuvem {

    position: absolute;

    font-size: 48px;

    opacity: .75;

    pointer-events: none;

}

.nuvem1 {

    top: 105px;

    left: 8%;

    animation:

        nuvemMover 18s linear infinite;

}

.nuvem2 {

    top: 165px;

    left: 65%;

    font-size: 35px;

    animation:

        nuvemMover2 23s linear infinite;

}

@keyframes nuvemMover {

    from {

        transform:

            translateX(-90px);

    }

    to {

        transform:

            translateX(520px);

    }

}

@keyframes nuvemMover2 {

    from {

        transform:

            translateX(120px);

    }

    to {

        transform:

            translateX(-520px);

    }

}

/* =========================================================

   CHÃO

========================================================= */

#chao {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    height: 92px;

    background:

        linear-gradient(

            180deg,

            #80c55d 0px,

            #6bb44d 12px,

            #b98a57 13px,

            #9d7248 100%

        );

    border-top:

        3px solid #5ca940;

    z-index: 3;

}

#chao::after {

    content: "";

    position: absolute;

    inset: 18px 0 0;

    opacity: .22;

    background-image:

        radial-gradient(

            circle,

            #5d3e28 1px,

            transparent 1px

        );

    background-size:

        18px 18px;

}

/* =========================================================

   PETTON

========================================================= */

#petton {

    position: absolute;

    left: 35px;

    width: 92px;

    height: 92px;

    z-index: 10;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    transform-origin:

        center bottom;

}

#petton img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: contain;

    opacity: 0;

    transition:

        opacity .15s;

}

#petton img.pronto {

    opacity: 1;

}

#petton.correndo img {

    animation:

        correrPetton .25s

        infinite alternate ease-in-out;

}

@keyframes correrPetton {

    from {

        transform:

            translateY(0)

            rotate(-1deg);

    }

    to {

        transform:

            translateY(-3px)

            rotate(1deg);

    }

}

/* =========================================================

   SOMBRA DO PETTON

========================================================= */

#sombraPetton {

    position: absolute;

    width: 68px;

    height: 12px;

    left: 47px;

    border-radius: 50%;

    background:

        rgba(0,0,0,.16);

    z-index: 4;

    transform-origin: center;

}

/* =========================================================

   OBSTÁCULO

========================================================= */

.obstaculo {

    position: absolute;

    width: 52px;

    height: 64px;

    z-index: 8;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    font-size: 55px;

    line-height: 1;

    transform-origin:

        center bottom;

}

/* =========================================================

   INÍCIO

========================================================= */

#inicio {

    position: absolute;

    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:

        rgba(255,255,255,.18);

}

.inicio-box {

    width: 100%;

    max-width: 330px;

    padding: 23px 18px;

    border-radius: 24px;

    background:

        rgba(255,255,255,.96);

    text-align: center;

    box-shadow:

        0 8px 30px

        rgba(0,0,0,.13);

}

.inicio-icon {

    font-size: 52px;

}

.inicio-box h2 {

    margin:

        8px 0 6px;

    font-size: 22px;

}

.inicio-box p {

    margin:

        5px 0;

    color: #666;

    font-size: 14px;

    line-height: 1.45;

}

.btn-jogar {

    width: 100%;

    height: 50px;

    margin-top: 15px;

    border: none;

    border-radius: 15px;

    background: #6fbd61;

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:

        0 4px 12px

        rgba(75,150,60,.25);

}

.btn-jogar:active {

    transform: scale(.97);

}

/* =========================================================

   GAME OVER

========================================================= */

#gameOver {

    position: absolute;

    inset: 0;

    z-index: 60;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:

        rgba(0,0,0,.28);

}

.gameover-box {

    width: 100%;

    max-width: 330px;

    padding: 22px 18px;

    border-radius: 24px;

    background: white;

    text-align: center;

    box-shadow:

        0 10px 35px

        rgba(0,0,0,.2);

}

.gameover-icon {

    font-size: 50px;

}

.gameover-box h2 {

    margin:

        7px 0 4px;

    font-size: 23px;

}

.resultado {

    margin:

        12px 0;

    padding: 11px;

    border-radius: 15px;

    background: #f4f8f2;

    font-size: 15px;

}

.resultado strong {

    font-size: 23px;

}

.botoes-gameover {

    display: grid;

    grid-template-columns:

        1fr 1fr;

    gap: 8px;

    margin-top: 12px;

}

.btn-secundario,

.btn-reiniciar {

    height: 46px;

    border: none;

    border-radius: 13px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

}

.btn-secundario {

    background: #eee;

    color: #444;

}

.btn-reiniciar {

    background: #6fbd61;

    color: white;

}

/* =========================================================

   INSTRUÇÃO INFERIOR

========================================================= */

#instrucao {

    position: absolute;

    left: 50%;

    bottom: 108px;

    transform:

        translateX(-50%);

    z-index: 15;

    padding:

        7px 14px;

    border-radius: 20px;

    background:

        rgba(255,255,255,.86);

    font-size: 12px;

    font-weight: 700;

    white-space: nowrap;

    pointer-events: none;

    opacity: 0;

    transition:

        opacity .3s;

}

#instrucao.mostrar {

    opacity: 1;

}

/* =========================================================

   CELULAR PEQUENO

========================================================= */

@media(max-width: 370px) {

    #petton {

        width: 82px;

        height: 82px;

        left: 28px;

    }

    #sombraPetton {

        left: 38px;

        width: 62px;

    }

    .obstaculo {

        width: 47px;

        font-size: 50px;

    }

}

</style>

</head>

<body>

<div class="app">

    <!-- =====================================================

         TOPO

    ====================================================== -->

    <header class="topo">

        <button

            type="button"

            class="btn-voltar"

            onclick="voltarMenu()"

            aria-label="Voltar"

        >

        </button>

        <div class="titulo">

            <strong>

                🪵 Pular Obstáculos

            </strong>

            <span>

                Jogo 1

            </span>

        </div>

        <div></div>

    </header>

    <!-- =====================================================

         ÁREA DO JOGO

    ====================================================== -->

    <main id="jogo">

        <div class="sol"></div>

        <div class="nuvem nuvem1">

        </div>

        <div class="nuvem nuvem2">

            ☁️

        </div>

        <!-- PLACAR -->

        <div class="placar">

            <div class="placar-item">

                <span class="placar-label">

<!-- =========================================================

     PETTON.JS

     Estamos em petton/jogos/

     por isso usamos ../petton.js

========================================================= -->

<script src="../petton.js"></script>

<script>

/* =========================================================

   CONFIGURAÇÕES

========================================================= */

const CHAVE_RECORDE =

    "petton_jogo_pular_obstaculos_recorde_v1";

const ALTURA_CHAO = 92;

const GRAVIDADE = 2100;

const FORCA_PULO = 760;

const VELOCIDADE_INICIAL = 235;

const VELOCIDADE_MAXIMA = 520;

/* =========================================================

   ELEMENTOS

========================================================= */

const jogo =

    document.getElementById("jogo");

const petton =

    document.getElementById("petton");

const imagemPetton =

    document.getElementById("imagemPetton");

const sombraPetton =

    document.getElementById("sombraPetton");

const pontosElemento =

    document.getElementById("pontos");

const recordeElemento =

    document.getElementById("recorde");

const velocidadeElemento =

    document.getElementById(

        "nivelVelocidade"

    );

const inicio =

    document.getElementById("inicio");

const gameOver =

    document.getElementById("gameOver");

const pontosFinal =

    document.getElementById(

        "pontosFinal"

    );

const novoRecorde =

    document.getElementById(

        "novoRecorde"

    );

const instrucao =

    document.getElementById(

        "instrucao"

    );

/* =========================================================

   ESTADO DO JOGO

========================================================= */

let jogando = false;

let terminou = false;

let pontos = 0;

let recorde = 0;

let velocidade =

    VELOCIDADE_INICIAL;

let nivelVelocidade = 1;

let posicaoY = 0;

let velocidadeY = 0;

let noChao = true;

let ultimoTempo = 0;

let tempoProximoObstaculo = 0;

let obstaculos = [];

let animationId = null;

/* =========================================================

   RECORDES

========================================================= */

function carregarRecorde() {

    try {

        const salvo =

            Number(

                localStorage.getItem(

                    CHAVE_RECORDE

                )

            );

        recorde =

            isFinite(salvo)

                ? Math.max(0, salvo)

                : 0;

    } catch (erro) {

        recorde = 0;

    }

    recordeElemento.textContent =

        recorde;

}

function salvarRecorde() {

    try {

        localStorage.setItem(

            CHAVE_RECORDE,

            String(recorde)

        );

    } catch (erro) {

        console.warn(

            "Não foi possível salvar o recorde.",

            erro

        );

    }

}

/* =========================================================

   PETTON DO JOGADOR

========================================================= */

function obterDadosPetton() {

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.carregarPetton ===

                "function"

        ) {

            return Petton.carregarPetton();

        }

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

    }

    return null;

}

/* =========================================================

   FASE

========================================================= */

function obterFasePetton(dados) {

    if (!dados) {

        return "bebe";

    }

    if (!dados.dateNascimento) {

        return "ovo";

    }

    let idadeDias =

        Number(

            dados.idadeDias ??

            dados.diasDeVida

        );

    if (

        !isFinite(idadeDias) &&

        dados.dateNascimento

    ) {

        const nascimento =

            new Date(

                dados.dateNascimento

            );

        if (

            !isNaN(

                nascimento.getTime()

            )

        ) {

            idadeDias =

                Math.floor(

                    (

                        Date.now() -

                        nascimento.getTime()

                    ) /

                    86400000

                );

        }

    }

    if (isFinite(idadeDias)) {

        if (idadeDias < 8) {

            return "bebe";

        }

        if (idadeDias < 31) {

            return "filhote";

        }

        if (idadeDias < 91) {

            return "jovem";

        }

        return "adulto";

    }

    const fase =

        String(

            dados.faseAtual ||

            dados.fase ||

            "bebe"

        ).toLowerCase();

    if (

        fase.includes("adult")

    ) {

        return "adulto";

    }

    if (

        fase.includes("jovem") ||

        fase.includes("young")

    ) {

        return "jovem";

    }

    if (

        fase.includes("filh")

    ) {

        return "filhote";

    }

    return "bebe";

}

/* =========================================================

   ESPÉCIE

========================================================= */

function obterEspeciePetton(dados) {

    if (!dados) {

        return "gato";

    }

    const identidade =

        dados.identidadeVisual &&

        typeof dados.identidadeVisual ===

            "object"

            ? dados.identidadeVisual

            : null;

    let especie =

        identidade?.especie ||

        dados.especie ||

        "gato";

    especie =

        String(especie).toLowerCase();

    if (

        especie.includes("cach") ||

        especie.includes("dog")

    ) {

        return "cachorro";

    }

    if (

        especie.includes("coelh") ||

        especie.includes("rabbit")

    ) {

        return "coelho";

    }

    return "gato";

}

/* =========================================================

   IMAGEM INDIVIDUAL

========================================================= */

function obterImagemIndividual(

    dados,

    fase

) {

    if (

        !dados ||

        !dados.identidadeVisual ||

        typeof dados.identidadeVisual !==

            "object"

    ) {

        return null;

    }

    const imagens =

        dados.identidadeVisual.imagens;

    if (

        !imagens ||

        typeof imagens !== "object"

    ) {

        return null;

    }

    const imagem =

        imagens[fase];

    if (

        typeof imagem === "string" &&

        imagem.trim() !== ""

    ) {

        return imagem.trim();

    }

    return null;

}

/* =========================================================

   DEFINIR IMAGEM DO PETTON

========================================================= */

function carregarImagemPetton() {

    const dados =

        obterDadosPetton();

    const especie =

        obterEspeciePetton(

            dados

        );

    const fase =

        obterFasePetton(

            dados

        );

    const imagemIndividual =

        obterImagemIndividual(

            dados,

            fase

        );

    const imagensFallback = {

        gato:

            "../petton-original.png",

        cachorro:

            "../FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

        coelho:

            "../39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

    };

    let imagemFinal =

        imagemIndividual ||

        imagensFallback[especie];

    /*

       Se a imagem individual estiver salva

       como caminho relativo ao diretório

       petton/, precisamos subir uma pasta.

    */

    if (

        imagemIndividual &&

        !imagemIndividual.startsWith("http://") &&

        !imagemIndividual.startsWith("https://") &&

        !imagemIndividual.startsWith("/") &&

        !imagemIndividual.startsWith("../")

    ) {

        imagemFinal =

            "../" + imagemIndividual;

    }

    imagemPetton.onload =

        function() {

            imagemPetton.classList.add(

                "pronto"

            );

        };

    imagemPetton.onerror =

        function() {

            /*

               Se uma imagem individual falhar,

               usa a imagem padrão da espécie.

            */

            const fallback =

                imagensFallback[especie];

            if (

                imagemPetton.getAttribute(

                    "src"

                ) !== fallback

            ) {

                imagemPetton.src =

                    fallback;

                return;

            }

            console.warn(

                "Imagem do Petton não encontrada."

            );

        };

    imagemPetton.src =

        imagemFinal;

}

/* =========================================================

   POSICIONAMENTO

========================================================= */

function atualizarPosicaoPetton() {

    petton.style.bottom =

        (

            ALTURA_CHAO +

            posicaoY -

            3

        ) + "px";

    sombraPetton.style.bottom =

        (

            ALTURA_CHAO -

            2

        ) + "px";

    const escalaSombra =

        Math.max(

            .55,

            1 -

            posicaoY / 260

        );

    const opacidade =

        Math.max(

            .06,

            .16 -

            posicaoY / 1300

        );

    sombraPetton.style.transform =

        "scaleX(" +

        escalaSombra +

        ")";

    sombraPetton.style.background =

        "rgba(0,0,0," +

        opacidade +

        ")";

}

/* =========================================================

   PULAR

========================================================= */

function pular() {

    if (

        !jogando ||

        terminou

    ) {

        return;

    }

    if (!noChao) {

        return;

    }

    noChao = false;

    velocidadeY =

        FORCA_PULO;

    petton.classList.remove(

        "correndo"

    );

}

/* =========================================================

   CRIAR OBSTÁCULO

========================================================= */

function criarObstaculo() {

    if (

        !jogando ||

        terminou

    ) {

        return;

    }

    const obstaculo =

        document.createElement(

            "div"

        );

    obstaculo.className =

        "obstaculo";

    obstaculo.textContent =

        "🪵";

    obstaculo.style.bottom =

        (ALTURA_CHAO - 1) +

        "px";

    jogo.appendChild(

        obstaculo

    );

    const larguraJogo =

        jogo.clientWidth;

    const item = {

        elemento:

            obstaculo,

        x:

            larguraJogo + 40,

        largura:

            52,

        contado:

            false

    };

    obstaculos.push(

        item

    );

    obstaculo.style.transform =

        "translateX(" +

        item.x +

        "px)";

}

/* =========================================================

   PRÓXIMO OBSTÁCULO

========================================================= */

function agendarProximoObstaculo() {

    /*

       Distância varia para o jogo

       não ficar mecânico.

    */

    const minimo = 1200;

    const maximo = 2050;

    tempoProximoObstaculo =

        minimo +

        Math.random() *

        (maximo - minimo);

}

/* =========================================================

   COLISÃO

========================================================= */

function verificarColisao(

    obstaculo

) {

    const petRect =

        petton.getBoundingClientRect();

    const obsRect =

        obstaculo.elemento

            .getBoundingClientRect();

    /*

       Hitbox menor que a imagem,

       deixando o jogo mais justo.

    */

    const margemPetX = 18;

    const margemPetTopo = 12;

    const margemObsX = 9;

    const margemObsTopo = 8;

    const petLeft =

        petRect.left +

        margemPetX;

    const petRight =

        petRect.right -

        margemPetX;

    const petTop =

        petRect.top +

        margemPetTopo;

    const petBottom =

        petRect.bottom -

        5;

    const obsLeft =

        obsRect.left +

        margemObsX;

    const obsRight =

        obsRect.right -

        margemObsX;

    const obsTop =

        obsRect.top +

        margemObsTopo;

    const obsBottom =

        obsRect.bottom;

    return (

        petRight > obsLeft &&

        petLeft < obsRight &&

        petBottom > obsTop &&

        petTop < obsBottom

    );

}

/* =========================================================

   PONTO

========================================================= */

function adicionarPonto() {

    pontos++;

    pontosElemento.textContent =

        pontos;

    /*

       A cada 4 pontos aumenta

       um nível de velocidade.

    */

    const novoNivel =

        1 +

        Math.floor(

            pontos / 4

        );

    if (

        novoNivel >

        nivelVelocidade

    ) {

        nivelVelocidade =

            novoNivel;

        velocidade =

            Math.min(

                VELOCIDADE_MAXIMA,

                VELOCIDADE_INICIAL +

                (

                    nivelVelocidade -

                    1

                ) * 28

            );

        velocidadeElemento.textContent =

            nivelVelocidade;

    }

}

/* =========================================================

   REMOVER OBSTÁCULO

========================================================= */

function removerObstaculo(

    item

) {

    try {

        if (

            item.elemento &&

            item.elemento.parentNode

        ) {

            item.elemento.parentNode

                .removeChild(

                    item.elemento

                );

        }

    } catch (erro) {

        console.error(erro);

    }

}

/* =========================================================

   LIMPAR OBSTÁCULOS

========================================================= */

function limparObstaculos() {

    obstaculos.forEach(

        removerObstaculo

    );

    obstaculos = [];

}

/* =========================================================

   LOOP

========================================================= */

function loop(tempoAtual) {

    if (

        !jogando ||

        terminou

    ) {

        return;

    }

    if (!ultimoTempo) {

        ultimoTempo =

            tempoAtual;

    }

    let delta =

        (

            tempoAtual -

            ultimoTempo

        ) / 1000;

    /*

       Evita saltos gigantes se o LINE

       ficar alguns instantes em segundo plano.

    */

    delta =

        Math.min(

            delta,

            .035

        );

    ultimoTempo =

        tempoAtual;

    /* -----------------------------------------

       FÍSICA DO PULO

    ----------------------------------------- */

    if (!noChao) {

        velocidadeY -=

            GRAVIDADE *

            delta;

        posicaoY +=

            velocidadeY *

            delta;

        if (

            posicaoY <= 0

        ) {

            posicaoY = 0;

            velocidadeY = 0;

            noChao = true;

            petton.classList.add(

                "correndo"

            );

        }

    }

    atualizarPosicaoPetton();

    /* -----------------------------------------

       OBSTÁCULOS

    ----------------------------------------- */

    tempoProximoObstaculo -=

        delta * 1000;

    if (

        tempoProximoObstaculo <= 0

    ) {

        criarObstaculo();

        agendarProximoObstaculo();

    }

    const petRect =

        petton.getBoundingClientRect();

    for (

        let i =

            obstaculos.length - 1;

        i >= 0;

        i--

    ) {

        const item =

            obstaculos[i];

        item.x -=

            velocidade *

            delta;

        item.elemento.style.transform =

            "translateX(" +

            item.x +

            "px)";

        /* COLISÃO */

        if (

            verificarColisao(

                item

            )

        ) {

            finalizarJogo();

            return;

        }

        /* PONTO */

        const obsRect =

            item.elemento

                .getBoundingClientRect();

        if (

            !item.contado &&

            obsRect.right <

                petRect.left

        ) {

            item.contado =

                true;

            adicionarPonto();

        }

        /* SAIU DA TELA */

        if (

            obsRect.right <

            -20

        ) {

            removerObstaculo(

                item

            );

            obstaculos.splice(

                i,

                1

            );

        }

    }

    animationId =

        requestAnimationFrame(

            loop

        );

}

/* =========================================================

   COMEÇAR

========================================================= */

function iniciarJogo(evento) {

    if (evento) {

        evento.preventDefault();

        evento.stopPropagation();

    }

    if (jogando) {

        return;

    }

    limparObstaculos();

    pontos = 0;

    velocidade =

        VELOCIDADE_INICIAL;

    nivelVelocidade = 1;

    posicaoY = 0;

    velocidadeY = 0;

    noChao = true;

    terminou = false;

    ultimoTempo = 0;

    pontosElemento.textContent =

        "0";

    velocidadeElemento.textContent =

        "1";

    novoRecorde.style.display =

        "none";

    inicio.style.display =

        "none";

    gameOver.style.display =

        "none";

    jogando = true;

    petton.classList.add(

        "correndo"

    );

    atualizarPosicaoPetton();

    /*

       Primeiro obstáculo demora

       um pouco para chegar.

    */

    tempoProximoObstaculo =

        1100;

    instrucao.classList.add(

        "mostrar"

    );

    setTimeout(() => {

        instrucao.classList.remove(

            "mostrar"

        );

    }, 2200);

    animationId =

        requestAnimationFrame(

            loop

        );

}

/* =========================================================

   FINALIZAR

========================================================= */

function finalizarJogo() {

    if (terminou) {

        return;

    }

    terminou = true;

    jogando = false;

    petton.classList.remove(

        "correndo"

    );

    if (animationId) {

        cancelAnimationFrame(

            animationId

        );

        animationId = null;

    }

    pontosFinal.textContent =

        pontos;

    if (

        pontos > recorde

    ) {

        recorde =

            pontos;

        recordeElemento.textContent =

            recorde;

        salvarRecorde();

        novoRecorde.style.display =

            "block";

    } else {

        novoRecorde.style.display =

            "none";

    }

    setTimeout(() => {

        gameOver.style.display =

            "flex";

    }, 300);

}

/* =========================================================

   REINICIAR

========================================================= */

function reiniciarJogo(

    evento

) {

    if (evento) {

        evento.preventDefault();

        evento.stopPropagation();

    }

    jogando = false;

    terminou = false;

    limparObstaculos();

    gameOver.style.display =

        "none";

    iniciarJogo(

        evento

    );

}

/* =========================================================

   TOQUE / CLIQUE

========================================================= */

function toqueJogo(evento) {

    /*

       Não pula quando o toque

       foi em um botão.

    */

    if (

        evento.target.closest(

            "button"

        )

    ) {

        return;

    }

    if (

        jogando &&

        !terminou

    ) {

        evento.preventDefault();

        pular();

    }

}

/*

   Pointer Events funciona bem

   tanto com toque quanto mouse.

*/

jogo.addEventListener(

    "pointerdown",

    toqueJogo,

    {

        passive: false

    }

);

/*

   Também permite barra de espaço

   se abrir no computador.

*/

document.addEventListener(

    "keydown",

    function(evento) {

        if (

            evento.code === "Space"

        ) {

            evento.preventDefault();

            pular();

        }

    }

);

/* =========================================================

   VOLTAR

========================================================= */

function voltarMenu() {

    try {

        window.location.assign(

            "./brincar.html"

        );

    } catch (erro) {

        console.error(

            "Erro ao voltar:",

            erro

        );

    }

}

/* =========================================================

   PAUSAR SE SAIR DA TELA

========================================================= */

document.addEventListener(

    "visibilitychange",

    function() {

        if (

            document.hidden &&

            jogando

        ) {

            ultimoTempo = 0;

        }

    }

);

/* =========================================================

   INICIALIZAÇÃO

========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        carregarRecorde();

        carregarImagemPetton();

        atualizarPosicaoPetton();

    }

);

</script>

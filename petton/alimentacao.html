<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Alimentação do Petton</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

    background:linear-gradient(180deg,#fff7ed,#fdf2f8,#f5f3ff);

    color:#333;

    min-height:100vh;

}

.container{

    max-width:650px;

    margin:auto;

    padding:18px;

}

.topo{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:18px;

}

.voltar{

    width:42px;

    height:42px;

    border:0;

    border-radius:14px;

    background:white;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    font-size:22px;

}

.titulo{

    flex:1;

}

.titulo h1{

    margin:0;

    font-size:23px;

}

.titulo p{

    margin:3px 0 0;

    color:#777;

    font-size:13px;

}

.card{

    background:white;

    border-radius:24px;

    padding:20px;

    margin-bottom:16px;

    box-shadow:0 5px 20px rgba(0,0,0,.07);

}

.pet{

    text-align:center;

}

/* =====================================================

   OVO

   ===================================================== */

.ovo-titulo{

    font-size:20px;

    font-weight:800;

    color:#70452b;

    margin-bottom:8px;

}

.ovo-visual{

    width:150px;

    height:175px;

    margin:10px auto 10px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:120px;

    line-height:1;

}

.ovo-tempo{

    font-size:32px;

    font-weight:bold;

    color:#4e2e1d;

    letter-spacing:1px;

    margin:8px 0 15px;

    font-variant-numeric:tabular-nums;

}

.ovo-info{

    color:#76502e;

    font-size:14px;

    line-height:1.5;

    margin-top:10px;

}

.ovo-aviso{

    background:#fff7ed;

    border-radius:17px;

    padding:14px;

    color:#92400e;

    font-size:13px;

    line-height:1.5;

    margin-top:15px;

}

/* =====================================================

   PET NASCIDO

   ===================================================== */

.pet-emoji{

    font-size:78px;

    line-height:1;

    margin:5px 0 10px;

}

.pet-imagem{

    max-width:180px;

    max-height:190px;

    display:block;

    margin:5px auto 10px;

    object-fit:contain;

}

.nome{

    font-size:25px;

    font-weight:800;

}

.idade{

    color:#777;

    margin-top:5px;

    font-size:14px;

}

.estado{

    display:inline-block;

    margin-top:12px;

    padding:8px 15px;

    border-radius:20px;

    background:#fef3c7;

    color:#92400e;

    font-weight:700;

    font-size:13px;

}

.estado.ok{

    background:#dcfce7;

    color:#166534;

}

.estado.muita{

    background:#fee2e2;

    color:#b91c1c;

}

/* =====================================================

   FOME

   ===================================================== */

.fome-barra{

    height:16px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin-top:10px;

}

.fome-interna{

    height:100%;

    border-radius:20px;

    transition:width .5s;

}

.info-fome{

    display:flex;

    justify-content:space-between;

    margin-top:7px;

    font-size:13px;

    color:#777;

}

/* =====================================================

   COMIDA

   ===================================================== */

.comida{

    text-align:center;

}

.comida-emoji{

    font-size:70px;

    margin:5px 0 10px;

}

.tipo-comida{

    font-size:21px;

    font-weight:800;

}

.descricao{

    color:#777;

    font-size:14px;

    line-height:1.5;

    margin-top:6px;

}

.botao-comer{

    width:100%;

    border:0;

    border-radius:17px;

    padding:15px;

    margin-top:15px;

    background:#f59e0b;

    color:white;

    font-size:17px;

    font-weight:800;

    box-shadow:0 4px 10px rgba(245,158,11,.25);

}

.botao-comer:active{

    transform:scale(.98);

}

.botao-comer:disabled{

    opacity:.5;

}

.quantidade{

    margin-top:10px;

    font-size:12px;

    color:#999;

}

/* =====================================================

   LISTA

   ===================================================== */

.lista{

    display:grid;

    gap:10px;

}

.item{

    display:flex;

    align-items:center;

    gap:13px;

    padding:13px;

    background:#fafafa;

    border-radius:17px;

}

.item-emoji{

    font-size:34px;

    width:48px;

    text-align:center;

}

.item strong{

    display:block;

    font-size:14px;

}

.item span{

    display:block;

    color:#777;

    font-size:12px;

    margin-top:3px;

}

/* =====================================================

   HISTÓRICO

   ===================================================== */

.historico{

    text-align:center;

    color:#777;

    font-size:13px;

    line-height:1.6;

}

.numero{

    font-size:30px;

    font-weight:800;

    color:#f59e0b;

}

.mensagem{

    text-align:center;

    min-height:22px;

    margin-top:12px;

    font-weight:700;

    color:#16a34a;

    font-size:14px;

}

.aviso{

    background:#fff7ed;

    border-radius:17px;

    padding:14px;

    color:#92400e;

    font-size:13px;

    line-height:1.5;

}

.aviso-doente{

    background:#fee2e2;

    color:#991b1b;

}

.rodape{

    text-align:center;

    color:#999;

    font-size:12px;

    padding:5px 0 25px;

}

</style>

</head>

<body>

<div class="container">

    <div class="topo">

        <button

            class="voltar"

            onclick="history.back()">

            ←

        </button>

        <div class="titulo">

            <h1>🍖 Alimentação</h1>

            <p>

                Cuide da barriguinha do seu Petton

            </p>

        </div>

    </div>

    <div id="conteudo">

        <div class="card pet">

            <div class="pet-emoji">

                🐾

            </div>

            <p>

                Carregando...

            </p>

        </div>

    </div>

</div>

<script src="petton.js"></script>

<script>

/* =====================================================

   VARIÁVEIS

   ===================================================== */

let dados = null;

let assinaturaAnterior = "";

/* =====================================================

   TEMPO

   ===================================================== */

function formatarTempo(ms){

    ms = Math.max(

        0,

        ms

    );

    const totalSegundos =

        Math.ceil(

            ms / 1000

        );

    const horas =

        Math.floor(

            totalSegundos / 3600

        );

    const minutos =

        Math.floor(

            (totalSegundos % 3600) / 60

        );

    const segundos =

        totalSegundos % 60;

    return (

        String(horas).padStart(2,"0") +

        ":" +

        String(minutos).padStart(2,"0") +

        ":" +

        String(segundos).padStart(2,"0")

    );

}

/* =====================================================

   CARREGAR PETTON

   ===================================================== */

function carregarDados(){

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.carregar

        ){

            dados =

                Petton.carregar();

        }

    }catch(e){

        console.log(

            "Erro ao carregar Petton:",

            e

        );

        dados = null;

    }

}

/* =====================================================

   VERIFICAR OVO

   ===================================================== */

function estaNoOvo(){

    return (

        !dados ||

        !dados.dateNascimento

    );

}

/* =====================================================

   IDADE

   ===================================================== */

function idadeDias(){

    if(!dados){

        return 0;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.idadeDias

        ){

            return Petton.idadeDias();

        }

    }catch(e){}

    if(!dados.dateNascimento){

        return 0;

    }

    const nascimento =

        new Date(

            dados.dateNascimento

        );

    const agora =

        new Date();

    return Math.max(

        0,

        Math.floor(

            (

                agora -

                nascimento

            ) / 86400000

        )

    );

}

/* =====================================================

   ESPÉCIE

   ===================================================== */

function especieEmoji(){

    if(!dados){

        return "🥚";

    }

    if(

        dados.especie === "cachorro"

    ){

        return "🐶";

    }

    if(

        dados.especie === "coelho"

    ){

        return "🐰";

    }

    return "🐱";

}

/* =====================================================

   IMAGEM

   ===================================================== */

function especieImagem(){

    if(!dados){

        return null;

    }

    if(

        dados.especie === "cachorro"

    ){

        return "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png";

    }

    if(

        dados.especie === "coelho"

    ){

        return "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

    }

    if(

        dados.especie === "gato"

    ){

        return "petton-original.png";

    }

    return null;

}

/* =====================================================

   ALIMENTAÇÃO POR IDADE

   ===================================================== */

function obterAlimentacao(idade){

    if(idade <= 3){

        return {

            emoji:"🍼",

            nome:

                "Alimentação de recém-nascido",

            descricao:

                "Por ser muito pequeno, o Petton precisa de pequenas refeições com maior frequência.",

            intervalo:2,

            quantidade:

                "Pequenas porções"

        };

    }

    if(idade <= 7){

        return {

            emoji:"🥣",

            nome:

                "Comida para filhote pequeno",

            descricao:

                "Agora ele começa a experimentar uma alimentação própria para filhotes.",

            intervalo:4,

            quantidade:

                "Porção pequena"

        };

    }

    if(idade <= 14){

        return {

            emoji:"🍲",

            nome:

                "Comida de filhote",

            descricao:

                "O Petton está crescendo rápido e precisa de refeições adequadas para essa fase.",

            intervalo:5,

            quantidade:

                "Porção pequena/média"

        };

    }

    if(idade <= 30){

        return {

            emoji:"🍖",

            nome:

                "Alimentação de filhote",

            descricao:

                "O Petton já está maior e suas refeições começam a ficar mais completas.",

            intervalo:6,

            quantidade:

                "Porção média"

        };

    }

    if(idade <= 60){

        return {

            emoji:"🥩",

            nome:

                "Alimentação jovem",

            descricao:

                "Uma alimentação adequada acompanha o crescimento do Petton jovem.",

            intervalo:7,

            quantidade:

                "Porção média"

        };

    }

    return {

        emoji:"🍗",

        nome:

            "Alimentação adulta",

        descricao:

            "Seu Petton já está na fase adulta e segue uma rotina de alimentação normal.",

        intervalo:8,

        quantidade:

            "Porção normal"

    };

}

/* =====================================================

   FOME

   ===================================================== */

function calcularFome(){

    if(estaNoOvo()){

        return null;

    }

    if(

        typeof dados.fome === "number"

    ){

        return Math.max(

            0,

            Math.min(

                100,

                dados.fome

            )

        );

    }

    return 50;

}

/* =====================================================

   ESTADO DA FOME

   ===================================================== */

function estadoFome(fome){

    if(fome <= 15){

        return {

            texto:"🍽️ Muito faminto",

            classe:"muita"

        };

    }

    if(fome <= 40){

        return {

            texto:"😋 Com fome",

            classe:""

        };

    }

    if(fome <= 70){

        return {

            texto:"🙂 Satisfeito",

            classe:"ok"

        };

    }

    return {

        texto:"🥰 Barriguinha cheia",

        classe:"ok"

    };

}

/* =====================================================

   PODE ALIMENTAR

   ===================================================== */

function podeAlimentar(){

    if(estaNoOvo()){

        return false;

    }

    if(

        dados &&

        dados.doente

    ){

        return false;

    }

    if(

        dados &&

        dados.hospitalAte &&

        dados.hospitalAte > Date.now()

    ){

        return false;

    }

    const fome =

        calcularFome();

    return fome < 90;

}

/* =====================================================

   ALIMENTAR

   ===================================================== */

function alimentar(){

    carregarDados();

    if(estaNoOvo()){

        mostrarMensagem(

            "🥚 O Petton ainda está no ovo!"

        );

        return;

    }

    if(

        dados &&

        dados.doente

    ){

        mostrarMensagem(

            "🤒 Petton está doente. Primeiro leve ao hospital."

        );

        return;

    }

    if(

        dados &&

        dados.hospitalAte &&

        dados.hospitalAte > Date.now()

    ){

        mostrarMensagem(

            "🏥 Petton está recebendo tratamento."

        );

        return;

    }

    if(!podeAlimentar()){

        mostrarMensagem(

            "🥰 Seu Petton está de barriguinha cheia!"

        );

        return;

    }

    let resultado = false;

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.alimentar

        ){

            resultado =

                Petton.alimentar();

        }

    }catch(e){

        console.log(

            "Erro ao alimentar:",

            e

        );

    }

    if(resultado !== false){

        mostrarMensagem(

            "😋 " +

            (

                dados.nome ||

                "Seu Petton"

            ) +

            " comeu e ficou feliz!"

        );

    }else{

        carregarDados();

        if(

            dados &&

            dados.doente

        ){

            mostrarMensagem(

                "🤒 Petton está doente. Leve ao hospital."

            );

        }else{

            mostrarMensagem(

                "🍖 Não foi possível alimentar agora."

            );

        }

    }

    renderizarAgora();

}

/* =====================================================

   MENSAGEM

   ===================================================== */

function mostrarMensagem(texto){

    const elemento =

        document.getElementById(

            "mensagem"

        );

    if(elemento){

        elemento.textContent =

            texto;

        setTimeout(()=>{

            if(

                elemento.textContent ===

                texto

            ){

                elemento.textContent =

                    "";

            }

        },3000);

    }

}

/* =====================================================

   PRÓXIMA REFEIÇÃO

   ===================================================== */

function proximidadeProxima(){

    if(estaNoOvo()){

        return (

            "A alimentação ficará disponível depois que o Petton nascer."

        );

    }

    const fome =

        calcularFome();

    if(fome <= 20){

        return (

            "Seu Petton está com bastante fome."

        );

    }

    if(fome <= 40){

        return (

            "Já está chegando a hora de oferecer comida."

        );

    }

    if(fome >= 90){

        return (

            "Seu Petton está de barriguinha cheia."

        );

    }

    return (

        "O Petton está bem alimentado por enquanto."

    );

}

/* =====================================================

   MOSTRAR OVO

   ===================================================== */

function renderizarOvo(){

    let restante = 0;

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.incubacaoRestante

        ){

            restante =

                Petton.incubacaoRestante();

        }

    }catch(e){

        restante = 0;

    }

    const area =

        document.getElementById(

            "conteudo"

        );

    area.innerHTML = `

        <div class="card pet">

            <div class="ovo-titulo">

                🥚 Seu Petton está no ovo!

            </div>

            <div class="ovo-visual">

                🥚

            </div>

            <div

                id="contadorOvo"

                class="ovo-tempo"

            >

                ${formatarTempo(restante)}

            </div>

            <div class="ovo-info">

                ⏳ O Petton ainda não nasceu.

                <br>

                Quando a incubação terminar,

                ele poderá nascer e você poderá

                escolher o nome dele.

            </div>

        </div>

        <div class="card">

            <div class="ovo-aviso">

                💡 <strong>Alimentação bloqueada</strong>

                <br><br>

                O Petton ainda está no ovo,

                por isso ele não precisa de comida

                neste momento.

                <br><br>

                A alimentação aparecerá

                automaticamente depois que ele nascer.

            </div>

        </div>

        <div class="rodape">

            🥚 Primeiro o nascimento.

            Depois a barriguinha cheia. 🐾

        </div>

    `;

}

/* =====================================================

   ATUALIZAR CONTADOR DO OVO

   SEM RECRIAR A PÁGINA

   ===================================================== */

function atualizarContadorOvo(){

    if(!estaNoOvo()){

        return;

    }

    const contador =

        document.getElementById(

            "contadorOvo"

        );

    if(!contador){

        return;

    }

    let restante = 0;

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.incubacaoRestante

        ){

            restante =

                Petton.incubacaoRestante();

        }

    }catch(e){

        restante = 0;

    }

    contador.textContent =

        formatarTempo(restante);

}

/* =====================================================

   ASSINATURA DO ESTADO VISUAL

   ===================================================== */

function assinaturaTela(){

    const d =

        Petton.carregar();

    if(!d){

        return "";

    }

    let restanteOvo = "";

    if(!d.dateNascimento){

        try{

            if(

                typeof Petton !== "undefined" &&

                Petton.incubacaoRestante

            ){

                restanteOvo =

                    Math.floor(

                        Number(

                            Petton.incubacaoRestante()

                        ) / 1000

                    );

            }

        }catch(e){}

    }

    let idade = 0;

    if(d.dateNascimento){

        try{

            if(

                typeof Petton !== "undefined" &&

                Petton.idadeDias

            ){

                idade =

                    Petton.idadeDias();

            }

        }catch(e){

            idade = 0;

        }

    }

    return JSON.stringify({

        especie:

            d.especie,

        nome:

            d.nome,

        fase:

            d.fase,

        fome:

            d.fome,

        saude:

            d.saude,

        energia:

            d.energia,

        felicidade:

            d.felicidade,

        humor:

            d.humor,

        doente:

            d.doente,

        dateNascimento:

            d.dateNascimento,

        hospital:

            !!(

                d.hospitalAte &&

                d.hospitalAte > Date.now()

            ),

        idade:

            idade,

        restanteOvo:

            restanteOvo

    });

}

/* =====================================================

   RENDERIZAR PET NASCIDO

   ===================================================== */

function renderizar(){

    carregarDados();

    if(estaNoOvo()){

        renderizarOvo();

        return;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.verificarCrescimento

        ){

            Petton.verificarCrescimento();

            dados =

                Petton.carregar();

        }

    }catch(e){

        console.log(e);

    }

    if(estaNoOvo()){

        renderizarOvo();

        return;

    }

    const area =

        document.getElementById(

            "conteudo"

        );

    const idade =

        idadeDias();

    const fome =

        calcularFome();

    const estado =

        estadoFome(fome);

    const comida =

        obterAlimentacao(

            idade

        );

    let corFome =

        "#22c55e";

    if(fome <= 40){

        corFome =

            "#f59e0b";

    }

    if(fome <= 15){

        corFome =

            "#ef4444";

    }

    const imagem =

        especieImagem();

    let botaoBloqueado =

        false;

    let textoBotao =

        "🍽️ Dar comida";

    if(

        dados.doente

    ){

        botaoBloqueado =

            true;

        textoBotao =

            "🤒 Petton está doente";

    }

    else if(

        dados.hospitalAte &&

        dados.hospitalAte > Date.now()

    ){

        botaoBloqueado =

            true;

        textoBotao =

            "🏥 Em tratamento";

    }

    else if(

        fome >= 90

    ){

        botaoBloqueado =

            true;

        textoBotao =

            "🥰 Barriguinha cheia";

    }

    area.innerHTML = `

        <!-- PETTON -->

        <div class="card pet">

            ${

                imagem

                ?

                `

                <img

                    class="pet-imagem"

                    src="${imagem}"

                    alt="Petton">

                `

                :

                `

                <div class="pet-emoji">

                    ${especieEmoji()}

                </div>

                `

            }

            <div class="nome">

                ${dados.nome || "Meu Petton"}

            </div>

            <div class="idade">

                ${

                    idade === 0

                    ?

                    "Recém-nascido"

                    :

                    idade +

                    (

                        idade === 1

                        ?

                        " dia"

                        :

                        " dias"

                    ) +

                    " de vida"

                }

            </div>

            <div class="estado ${estado.classe}">

                ${estado.texto}

            </div>

        </div>

        <!-- FOME -->

        <div class="card">

            <h2 style="margin-top:0;">

                🍽️ Fome

            </h2>

            <div class="fome-barra">

                <div

                    class="fome-interna"

                    style="

                        width:${fome}%;

                        background:${corFome};

                    "

                ></div>

            </div>

            <div class="info-fome">

                <span>

                    Faminto

                </span>

                <strong>

                    ${Math.round(fome)}%

                </strong>

                <span>

                    Cheio

                </span>

            </div>

            <div

                class="descricao"

                style="text-align:center;margin-top:12px;"

            >

                ${proximidadeProxima()}

            </div>

        </div>

        ${

            dados.doente

            ?

            `

            <!-- DOENTE -->

            <div class="card">

                <div class="aviso aviso-doente">

                    🤒 <strong>Petton está doente.</strong>

                    <br><br>

                    A alimentação está bloqueada.

                    <br><br>

                    Primeiro leve o Petton ao hospital

                    para que ele possa melhorar.

                </div>

            </div>

            `

            :

            `

            <!-- COMIDA -->

            <div class="card comida">

                <div class="comida-emoji">

                    ${comida.emoji}

                </div>

                <div class="tipo-comida">

                    ${comida.nome}

                </div>

                <div class="descricao">

                    ${comida.descricao}

                </div>

                <div class="quantidade">

                    ${comida.quantidade}

                </div>

                <button

                    class="botao-comer"

                    onclick="alimentar()"

                    ${botaoBloqueado ? "disabled" : ""}

                >

                    ${textoBotao}

                </button>

                <div

                    id="mensagem"

                    class="mensagem"

                ></div>

            </div>

            `

        }

        <!-- ROTINA -->

        <div class="card">

            <h2 style="margin-top:0;">

                🕐 Rotina de alimentação

            </h2>

            <div class="lista">

                <div class="item">

                    <div class="item-emoji">

                        ${comida.emoji}

                    </div>

                    <div>

                        <strong>

                            Fase atual

                        </strong>

                        <span>

                            ${comida.nome}

                        </span>

                    </div>

                </div>

                <div class="item">

                    <div class="item-emoji">

                        ⏰

                    </div>

                    <div>

                        <strong>

                            Frequência

                        </strong>

                        <span>

                            Aproximadamente a cada

                            ${comida.intervalo} horas

                        </span>

                    </div>

                </div>

                <div class="item">

                    <div class="item-emoji">

                        🍴

                    </div>

                    <div>

                        <strong>

                            Estado atual

                        </strong>

                        <span>

                            ${

                                fome >= 90

                                ? "Barriguinha cheia"

                                : fome <= 20

                                ? "Está precisando comer"

                                : "Está bem alimentado"

                            }

                        </span>

                    </div>

                </div>

            </div>

        </div>

        <!-- DICA -->

        <div class="card">

            <div class="aviso">

                💡 <strong>Dica:</strong>

                <br><br>

                Quanto menor o Petton, mais

                importante é manter uma rotina

                frequente de alimentação.

                Conforme ele cresce, os intervalos

                entre as refeições aumentam.

            </div>

        </div>

        <div class="rodape">

            Uma barriguinha cheia é uma barriguinha feliz. 🐾

        </div>

    `;

}

/* =====================================================

   RENDERIZAR AGORA

   ===================================================== */

function renderizarAgora(){

    renderizar();

    try{

        assinaturaAnterior =

            assinaturaTela();

    }catch(e){

        assinaturaAnterior =

            "";

    }

}

/* =====================================================

   INÍCIO

   ===================================================== */

renderizarAgora();

/* =====================================================

   ATUALIZAÇÃO SEM PISCAR

   ===================================================== */

setInterval(

    function(){

        try{

            /* Enquanto estiver no ovo,

               atualiza SOMENTE o contador */

            if(estaNoOvo()){

                atualizarContadorOvo();

                const atual =

                    assinaturaTela();

                /*

                 * O tempo do ovo não provoca

                 * reconstrução da página.

                 *

                 * Só renderiza novamente quando

                 * o nascimento realmente acontecer.

                 */

                const atualSemTempo =

                    JSON.stringify(

                        Object.assign(

                            {},

                            JSON.parse(atual || "{}"),

                            {

                                restanteOvo:""

                            }

                        )

                    );

                const anteriorSemTempo =

                    JSON.stringify(

                        Object.assign(

                            {},

                            JSON.parse(

                                assinaturaAnterior || "{}"

                            ),

                            {

                                restanteOvo:""

                            }

                        )

                    );

                if(

                    atualSemTempo !==

                    anteriorSemTempo

                ){

                    renderizarAgora();

                }

                return;

            }

            /* Petton já nasceu */

            const atual =

                assinaturaTela();

            if(

                atual !==

                assinaturaAnterior

            ){

                renderizarAgora();

            }

        }catch(e){

            console.log(

                "Atualização Petton:",

                e

            );

        }

    },

    1000

);

</script>

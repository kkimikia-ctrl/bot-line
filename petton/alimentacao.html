<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Alimentação - Petton</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

    background:linear-gradient(135deg,#fff7ed,#fdf2f8,#f5f3ff);

    color:#333;

}

.container{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:16px;

}

.voltar{

    display:inline-block;

    text-decoration:none;

    color:#555;

    background:white;

    padding:9px 14px;

    border-radius:12px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);

    margin-bottom:15px;

    font-weight:600;

}

.card{

    background:rgba(255,255,255,.95);

    border-radius:22px;

    padding:20px;

    margin-bottom:16px;

    box-shadow:0 6px 20px rgba(0,0,0,.08);

}

h1{

    text-align:center;

    margin:4px 0 18px;

    font-size:27px;

}

h2{

    margin-top:0;

    font-size:20px;

}

.pet-area{

    text-align:center;

}

.pet-area img{

    display:block;

    margin:0 auto;

    max-width:180px;

    max-height:190px;

    object-fit:contain;

}

.nome-pet{

    font-size:21px;

    font-weight:700;

    margin-top:8px;

}

.ovo-area{

    text-align:center;

    padding:15px 5px;

}

.ovo{

    font-size:85px;

    line-height:1;

    margin-bottom:10px;

}

.contador{

    font-size:19px;

    font-weight:700;

    color:#7c3aed;

}

.info{

    text-align:center;

    color:#666;

    margin-top:8px;

}

.barra{

    width:100%;

    height:18px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin:12px 0;

}

.barra-interna{

    height:100%;

    width:0%;

    border-radius:20px;

    transition:width .3s;

    background:linear-gradient(90deg,#f59e0b,#fb7185);

}

.estado{

    text-align:center;

    font-size:18px;

    font-weight:700;

    margin:8px 0;

}

.estado.muita{

    color:#dc2626;

}

.estado.ok{

    color:#16a34a;

}

.botao{

    width:100%;

    border:0;

    border-radius:16px;

    padding:14px;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    background:linear-gradient(135deg,#f59e0b,#fb7185);

    color:white;

    box-shadow:0 4px 10px rgba(0,0,0,.12);

}

.botao:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.mensagem{

    text-align:center;

    margin-top:12px;

    min-height:24px;

    font-weight:600;

}

.lista{

    margin:0;

    padding-left:20px;

    line-height:1.8;

}

.aviso{

    background:#fff7ed;

    border-radius:14px;

    padding:13px;

    font-size:14px;

    color:#7c2d12;

}

.hidden{

    display:none;

}

</style>

</head>

<body>

<div class="container">

    <a href="index.html" class="voltar">← Voltar</a>

    <h1>🍎 Alimentação</h1>

    <div id="conteudo"></div>

</div>

<script>

let dados = null;

let assinaturaAnterior = "";

/* =========================

   FORMATA TEMPO

========================= */

function formatarTempo(ms){

    ms = Math.max(0, ms);

    const totalSegundos = Math.floor(ms / 1000);

    const horas = Math.floor(totalSegundos / 3600);

    const minutos = Math.floor((totalSegundos % 3600) / 60);

    const segundos = totalSegundos % 60;

    if(horas > 0){

        return `${horas}h ${String(minutos).padStart(2,"0")}min`;

    }

    return `${String(minutos).padStart(2,"0")}:${String(segundos).padStart(2,"0")}`;

}

/* =========================

   CARREGA DADOS

========================= */

function carregarDados(){

    try{

        dados = JSON.parse(localStorage.getItem("petton_dados_v3"));

    }catch(e){

        dados = null;

    }

}

/* =========================

   VERIFICA OVO

========================= */

function estaNoOvo(){

    return !dados || !dados.dateNascimento || dados.fase === "ovo";

}

/* =========================

   IDADE

========================= */

function idadeDias(){

    if(!dados || !dados.dateNascimento){

        return 0;

    }

    return Math.floor(

        (Date.now() - dados.dateNascimento) /

        (24 * 60 * 60 * 1000)

    );

}

/* =========================

   EMOJI DA ESPÉCIE

========================= */

function especieEmoji(){

    if(!dados || !dados.especie){

        return "🐣";

    }

    if(dados.especie === "cachorro"){

        return "🐶";

    }

    if(dados.especie === "coelho"){

        return "🐰";

    }

    return "🐱";

}

/* =========================

   IMAGEM DA ESPÉCIE

========================= */

function especieImagem(){

    if(!dados){

        return null;

    }

    if(dados.especie === "cachorro"){

        return "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png";

    }

    if(dados.especie === "coelho"){

        return "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

    }

    if(dados.especie === "gato"){

        return "petton-original.png";

    }

    return null;

}

/* =========================

   TIPO DE ALIMENTAÇÃO

========================= */

function obterAlimentacao(){

    const idade = idadeDias();

    if(idade < 8){

        return {

            nome:"Papinha especial",

            emoji:"🥣"

        };

    }

    if(idade < 31){

        return {

            nome:"Ração para filhotes",

            emoji:"🍖"

        };

    }

    return {

        nome:"Ração",

        emoji:"🍚"

    };

}

/* =========================

   CALCULA FOME

========================= */

function calcularFome(){

    if(estaNoOvo()){

        return null;

    }

    if(typeof dados.fome === "number"){

        return Math.max(

            0,

            Math.min(100, dados.fome)

        );

    }

    return 50;

}

/* =========================

   ESTADO DA FOME

========================= */

function estadoFome(fome){

    if(fome <= 20){

        return {

            texto:"🍽️ Muito faminto",

            classe:"muita"

        };

    }

    if(fome <= 40){

        return {

            texto:"😋 Com fome",

            classe:""

        };

    }

    if(fome < 80){

        return {

            texto:"🙂 Satisfeito",

            classe:"ok"

        };

    }

    return {

        texto:"🥰 Barriguinha cheia",

        classe:"ok"

    };

}

/* =========================

   PODE ALIMENTAR

========================= */

function podeAlimentar(){

    if(!dados){

        return false;

    }

    if(estaNoOvo()){

        return false;

    }

    if(dados.doente){

        return false;

    }

    if(dados.emHospital){

        return false;

    }

    const fome = calcularFome();

    if(fome >= 90){

        return false;

    }

    return true;

}

/* =========================

   ALIMENTAR

========================= */

function alimentar(){

    if(!podeAlimentar()){

        if(dados && dados.doente){

            mostrarMensagem(

                "🤒 Seu Petton está doente. Leve-o ao hospital."

            );

        }else if(dados && dados.emHospital){

            mostrarMensagem(

                "🏥 Seu Petton está no hospital."

            );

        }else{

            mostrarMensagem(

                "🥰 Seu Petton já está de barriguinha cheia."

            );

        }

        return;

    }

    if(window.Petton && typeof window.Petton.alimentar === "function"){

        const resultado = window.Petton.alimentar();

        if(resultado){

            carregarDados();

            mostrarMensagem(

                "😋 Nhac! Seu Petton adorou a comida!"

            );

            renderizarAgora();

            return;

        }

    }

    /* Fallback caso o Petton global não esteja disponível */

    dados.fome = Math.min(

        100,

        (dados.fome || 0) + 20

    );

    dados.saude = Math.min(

        100,

        (dados.saude || 100) + 2

    );

    dados.pontos = (dados.pontos || 0) + 5;

    dados.ultimaAlimentacaoEm = Date.now();

    dados.cocoAtivo = true;

    localStorage.setItem(

        "petton_dados_v3",

        JSON.stringify(dados)

    );

    mostrarMensagem(

        "😋 Nhac! Seu Petton adorou a comida!"

    );

    renderizarAgora();

}

/* =========================

   MENSAGEM

========================= */

function mostrarMensagem(texto){

    const elemento = document.getElementById("mensagem");

    if(!elemento){

        return;

    }

    elemento.textContent = texto;

    clearTimeout(window.pettonMensagemTimer);

    window.pettonMensagemTimer = setTimeout(() => {

        if(elemento){

            elemento.textContent = "";

        }

    },3000);

}

/* =========================

   PRÓXIMA REFEIÇÃO

========================= */

function proximidadeProxima(){

    const fome = calcularFome();

    if(fome === null){

        return "";

    }

    if(fome <= 20){

        return "Seu Petton está com bastante fome.";

    }

    if(fome <= 40){

        return "Já está chegando a hora de oferecer comida.";

    }

    if(fome >= 90){

        return "Seu Petton está de barriguinha cheia.";

    }

    return "O Petton está bem alimentado por enquanto.";

}

/* =========================

   RENDERIZA OVO

========================= */

function renderizarOvo(){

    const conteudo = document.getElementById("conteudo");

    if(!conteudo){

        return;

    }

    let restante = 0;

    if(window.Petton && typeof window.Petton.status === "function"){

        try{

            const status = window.Petton.status();

            if(status && typeof status.incubacaoRestanteMs === "number"){

                restante = status.incubacaoRestanteMs;

            }

        }catch(e){}

    }

    conteudo.innerHTML = `

        <div class="card ovo-area">

            <div class="ovo">🥚</div>

            <h2>Seu Petton ainda está no ovo</h2>

            <div class="info">

                Aguarde a incubação terminar.

            </div>

            <div

                id="contadorOvo"

                class="contador"

            >

                ${formatarTempo(restante)}

            </div>

            <div class="info">

                Você poderá alimentar seu Petton depois que ele nascer.

            </div>

        </div>

    `;

}

/* =========================

   ATUALIZA CONTADOR DO OVO

========================= */

function atualizarContadorOvo(){

    const contador = document.getElementById("contadorOvo");

    if(!contador){

        return;

    }

    let restante = 0;

    if(window.Petton && typeof window.Petton.status === "function"){

        try{

            const status = window.Petton.status();

            if(status && typeof status.incubacaoRestanteMs === "number"){

                restante = status.incubacaoRestanteMs;

            }

        }catch(e){}

    }

    contador.textContent = formatarTempo(restante);

}

/* =========================

   ASSINATURA DA TELA

========================= */

function assinaturaTela(){

    if(!dados){

        return "sem-dados";

    }

    const restanteOvo =

        estaNoOvo() &&

        window.Petton &&

        typeof window.Petton.status === "function"

        ? (() => {

            try{

                const status = window.Petton.status();

                return status &&

                    typeof status.incubacaoRestanteMs === "number"

                    ? status.incubacaoRestanteMs

                    : 0;

            }catch(e){

                return 0;

            }

        })()

        : 0;

    return JSON.stringify({

        fome: dados.fome,

        saude: dados.saude,

        energia: dados.energia,

        felicidade: dados.felicidade,

        humor: dados.humor,

        doente: dados.doente,

        dateNascimento: dados.dateNascimento,

        emHospital: dados.emHospital,

        idade: idadeDias(),

        restanteOvo: restanteOvo

    });

}

/* =========================

   RENDERIZA

========================= */

function renderizar(){

    carregarDados();

    if(!dados){

        document.getElementById("conteudo").innerHTML = `

            <div class="card">

                <h2>🥚 Nenhum Petton encontrado</h2>

                <div class="info">

                    Volte para a página inicial.

                </div>

            </div>

        `;

        assinaturaAnterior = "sem-dados";

        return;

    }

    if(estaNoOvo()){

        const assinaturaAtual = assinaturaTela();

        /*

         * Enquanto o Petton está no ovo,

         * não reconstruímos a tela a cada segundo.

         * Apenas o contador é atualizado.

         */

        if(

            assinaturaAnterior !== assinaturaAtual &&

            !document.getElementById("contadorOvo")

        ){

            renderizarOvo();

        }

        assinaturaAnterior = assinaturaAtual;

        atualizarContadorOvo();

        return;

    }

    const assinaturaAtual = assinaturaTela();

    if(

        assinaturaAtual === assinaturaAnterior &&

        document.getElementById("cardAlimentacao")

    ){

        return;

    }

    assinaturaAnterior = assinaturaAtual;

    const conteudo = document.getElementById("conteudo");

    const fome = calcularFome();

    const estado = estadoFome(fome);

    const alimentacao = obterAlimentacao();

    const imagem = especieImagem();

    const nome =

        dados.nome ||

        "Seu Petton";

    const doente =

        !!dados.doente;

    const hospital =

        !!dados.emHospital;

    let petHtml = "";

    if(imagem){

        petHtml = `

            <img

                src="${imagem}"

                alt="${especieEmoji()} ${nome}"

            >

        `;

    }

    let mensagemDoenca = "";

    if(doente){

        mensagemDoenca = `

            <div class="aviso">

                🤒 <strong>Seu Petton está doente.</strong><br>

                Ele não pode fazer atividades normais agora.

                Leve-o ao hospital pela tela de cuidados.

            </div>

        `;

    }

    conteudo.innerHTML = `

        <div class="card pet-area">

            ${petHtml}

            <div class="nome-pet">

                ${especieEmoji()} ${nome}

            </div>

        </div>

        <div

            id="cardAlimentacao"

            class="card"

        >

            <h2>🍎 Alimentação</h2>

            <div class="info">

                ${alimentacao.emoji}

                ${alimentacao.nome}

            </div>

            <div class="estado ${estado.classe}">

                ${estado.texto}

            </div>

            <div class="barra">

                <div

                    class="barra-interna"

                    style="width:${fome}%"

                ></div>

            </div>

            <div class="info">

                Fome: ${fome}%

            </div>

            <button

                class="botao"

                onclick="alimentar()"

                ${!podeAlimentar() ? "disabled" : ""}

            >

                ${alimentacao.emoji}

                Dar comida

            </button>

            <div

                id="mensagem"

                class="mensagem"

            ></div>

            <div class="info">

                ${proximidadeProxima()}

            </div>

        </div>

        ${mensagemDoenca}

        <div class="card">

            <h2>🍽️ Sobre a alimentação</h2>

            <ul class="lista">

                <li>Filhotes recebem alimentação especial.</li>

                <li>Alimentar aumenta a saciedade.</li>

                <li>Não é possível alimentar quando a barriguinha está cheia.</li>

                <li>Depois de comer, pode aparecer 💩.</li>

                <li>Após comer, também existe uma chance de aparecer 🦠 cárie.</li>

            </ul>

        </div>

        <div class="card">

            <div class="aviso">

                💡 <strong>Dica:</strong><br>

                Cuide regularmente do seu Petton para manter

                saúde, higiene e felicidade em bons níveis.

            </div>

        </div>

    `;

}

/* =========================

   RENDERIZA AGORA

========================= */

function renderizarAgora(){

    assinaturaAnterior = "";

    renderizar();

}

/* =========================

   INICIALIZA

========================= */

renderizar();

/* =========================

   ATUALIZA SEM PISCAR

========================= */

setInterval(() => {

    carregarDados();

    if(estaNoOvo()){

        atualizarContadorOvo();

        /*

         * Verifica se acabou a incubação.

         * Só nesse momento a tela inteira é reconstruída.

         */

        if(!estaNoOvo()){

            assinaturaAnterior = "";

            renderizar();

        }

        return;

    }

    const novaAssinatura = assinaturaTela();

    if(novaAssinatura !== assinaturaAnterior){

        renderizar();

    }

},1000);

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="google" content="notranslate">

<title>Alimentação - Petton</title>

<link rel="stylesheet" href="petton.css">

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #fff7ef 0%,
            #fff4f6 45%,
            #f7f4ff 100%
        );

    color: #2f2f2f;

    overflow-x: hidden;
}

button {
    font-family: inherit;
}

.app {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 10px 14px 40px;
}

/* =========================================================
   TOPO
========================================================= */

.topo {
    position: relative;
    min-height: 70px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-voltar {
    position: absolute;

    left: 4px;
    top: 7px;

    width: 54px;
    height: 54px;

    border: none;
    border-radius: 50%;

    background: white;

    font-size: 28px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.10);

    cursor: pointer;
}

.titulo {
    margin: 0;

    font-size: 28px;
    font-weight: 800;

    text-align: center;
}

/* =========================================================
   CARD PET
========================================================= */

.pet-card {
    background: rgba(255,255,255,.94);

    border-radius: 28px;

    padding: 18px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.08);

    margin-top: 5px;
}

.pet-area {
    position: relative;

    width: 100%;
    height: 300px;

    border-radius: 26px;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            180deg,
            #fffdf5 0%,
            #fff6df 100%
        );
}

#imagemPetton {
    width: auto;
    max-width: 88%;
    max-height: 275px;

    object-fit: contain;
}

.decoracao-prato {
    position: absolute;

    left: 22px;
    bottom: 23px;

    font-size: 42px;
}

.decoracao-planta {
    position: absolute;

    right: 23px;
    bottom: 22px;

    font-size: 42px;
}

#nomePetton {
    margin-top: 12px;

    font-size: 27px;
    font-weight: 800;

    text-align: center;
}

/* =========================================================
   FOME
========================================================= */

.status-card {
    margin-top: 18px;

    background: white;

    border-radius: 26px;

    padding: 20px 18px;

    box-shadow:
        0 7px 22px rgba(0,0,0,.07);
}

.status-linha {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
}

.status-titulo {
    font-size: 23px;
    font-weight: 800;
}

.status-numero {
    font-size: 23px;
    font-weight: 800;
}

.barra {
    width: 100%;
    height: 22px;

    margin-top: 15px;

    background: #eeeeee;

    border-radius: 20px;

    overflow: hidden;
}

#barraFome {
    width: 0%;
    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #ff9f0a,
            #ff6969
        );

    transition: width .35s ease;
}

#estadoFome {
    margin-top: 14px;

    text-align: center;

    font-size: 23px;
    font-weight: 800;
}

#textoFome {
    margin-top: 6px;

    text-align: center;

    font-size: 16px;
    color: #666;
}

/* =========================================================
   DOENTE
========================================================= */

#avisoDoente {
    display: none;

    margin-top: 18px;

    background: #fff7e9;

    border-radius: 22px;

    padding: 18px;

    box-shadow:
        0 6px 20px rgba(0,0,0,.06);

    color: #8b351d;
}

#avisoDoente strong {
    display: block;

    font-size: 18px;

    margin-bottom: 6px;
}

#avisoDoente p {
    margin: 0;

    font-size: 16px;
    line-height: 1.45;
}

/* =========================================================
   COMIDA
========================================================= */

.comida-card {
    margin-top: 18px;

    background: white;

    border-radius: 26px;

    padding: 20px 16px 24px;

    box-shadow:
        0 7px 22px rgba(0,0,0,.07);
}

.comida-titulo {
    margin: 0;

    font-size: 25px;
    font-weight: 800;
}

.comida-subtitulo {
    margin-top: 5px;

    font-size: 16px;
    color: #777;
}

.comida-grid {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 12px;

    margin-top: 20px;
}

.comida-btn {
    min-height: 145px;

    border: none;

    border-radius: 24px;

    background:
        linear-gradient(
            180deg,
            #fffdf8 0%,
            #fff9ed 100%
        );

    box-shadow:
        0 4px 14px rgba(0,0,0,.06);

    cursor: pointer;

    padding: 14px 8px;
}

.comida-btn:active {
    transform: scale(.97);
}

.comida-emoji {
    display: block;

    font-size: 58px;
}

.comida-nome {
    display: block;

    margin-top: 5px;

    font-size: 19px;
    font-weight: 800;
}

.comida-valor {
    display: block;

    margin-top: 3px;

    font-size: 13px;
    color: #777;
}

.comida-btn.bloqueado {
    opacity: .45;
}

/* =========================================================
   ANIMAÇÃO
========================================================= */

#animacaoComida {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 9990;

    pointer-events: none;
}

.comida-voando {
    position: absolute;

    left: 50%;
    top: 75%;

    font-size: 64px;

    transform:
        translate(-50%,0);

    animation:
        comidaSubir 1s ease-in-out forwards;
}

@keyframes comidaSubir {

    0% {
        opacity: 0;
        transform:
            translate(-50%,20px)
            scale(.7);
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-330px)
            scale(1.1);
    }
}

/* =========================================================
   MENSAGEM
========================================================= */

#mensagem {
    display: none;

    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    z-index: 10000;

    max-width: 90%;

    background: rgba(0,0,0,.86);

    color: white;

    padding: 11px 18px;

    border-radius: 24px;

    text-align: center;

    font-size: 14px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.18);
}

</style>

</head>

<body>

<div class="app">

    <div class="topo">

        <button
            class="btn-voltar"
            onclick="voltar()"
        >
            ←
        </button>

        <h1 class="titulo">
            Alimentação 🍎
        </h1>

    </div>

    <!-- PET -->

    <section class="pet-card">

        <div class="pet-area">

            <img
                id="imagemPetton"
                alt="Petton"
            >

            <div class="decoracao-prato">
                🍽️
            </div>

            <div class="decoracao-planta">
                🪴
            </div>

        </div>

        <div id="nomePetton">
            Petton
        </div>

    </section>

    <!-- FOME -->

    <section class="status-card">

        <div class="status-linha">

            <div class="status-titulo">
                🍖 Fome
            </div>

            <div
                id="numeroFome"
                class="status-numero"
            >
                0%
            </div>

        </div>

        <div class="barra">

            <div id="barraFome"></div>

        </div>

        <div id="estadoFome">
            Carregando...
        </div>

        <div id="textoFome"></div>

    </section>

    <!-- AVISO DOENTE -->

    <section id="avisoDoente">

        <strong>
            🤒 Seu Petton está doente.
        </strong>

        <p>
            Ele ainda pode comer, mas a comida recupera apenas metade do normal.
            Leve-o ao hospital pela tela principal para curá-lo.
        </p>

    </section>

    <!-- COMIDAS -->

    <section class="comida-card">

        <h2 class="comida-titulo">
            🍽️ Escolha a comida
        </h2>

        <div class="comida-subtitulo">
            Toque na comida que deseja dar ao seu Petton.
        </div>

        <div class="comida-grid">

            <button
                class="comida-btn"
                data-tipo="papinha"
                onclick="darComida('papinha')"
            >

                <span class="comida-emoji">
                    🥣
                </span>

                <span class="comida-nome">
                    Papinha
                </span>

                <span class="comida-valor">
                    +10 fome
                </span>

            </button>

            <button
                class="comida-btn"
                data-tipo="maca"
                onclick="darComida('maca')"
            >

                <span class="comida-emoji">
                    🍎
                </span>

                <span class="comida-nome">
                    Maçã
                </span>

                <span class="comida-valor">
                    +12 fome
                </span>

            </button>

            <button
                class="comida-btn"
                data-tipo="cenoura"
                onclick="darComida('cenoura')"
            >

                <span class="comida-emoji">
                    🥕
                </span>

                <span class="comida-nome">
                    Cenoura
                </span>

                <span class="comida-valor">
                    +15 fome
                </span>

            </button>

            <button
                class="comida-btn"
                data-tipo="frango"
                onclick="darComida('frango')"
            >

                <span class="comida-emoji">
                    🍗
                </span>

                <span class="comida-nome">
                    Frango
                </span>

                <span class="comida-valor">
                    +25 fome
                </span>

            </button>

            <button
                class="comida-btn"
                data-tipo="carne"
                onclick="darComida('carne')"
            >

                <span class="comida-emoji">
                    🥩
                </span>

                <span class="comida-nome">
                    Carne
                </span>

                <span class="comida-valor">
                    +35 fome
                </span>

            </button>

        </div>

    </section>

</div>

<div id="animacaoComida"></div>

<div id="mensagem"></div>

<script src="petton.js"></script>

<script>

/* =========================================================
   COMIDAS
========================================================= */

const COMIDAS = {

    papinha: {
        nome: "Papinha",
        emoji: "🥣",
        fome: 10
    },

    maca: {
        nome: "Maçã",
        emoji: "🍎",
        fome: 12
    },

    cenoura: {
        nome: "Cenoura",
        emoji: "🥕",
        fome: 15
    },

    frango: {
        nome: "Frango",
        emoji: "🍗",
        fome: 25
    },

    carne: {
        nome: "Carne",
        emoji: "🥩",
        fome: 35
    }

};

/* =========================================================
   IMAGENS
========================================================= */

const PETTON_IMAGENS = {

    gato:
        "petton-original.png",

    cachorro:
        "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

    coelho:
        "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

};

function obterImagemPetton(dados) {

    if (!dados) {

        return PETTON_IMAGENS.gato;

    }

    let especie =
        String(
            dados.especie ||
            "gato"
        ).toLowerCase();

    if (
        especie.includes(
            "cach"
        )
    ) {

        especie =
            "cachorro";

    }

    if (
        especie.includes(
            "coelh"
        )
    ) {

        especie =
            "coelho";

    }

    const fase =
        dados.fase ||
        "bebe";

    try {

        if (
            dados.identidadeVisual &&
            dados.identidadeVisual.imagens &&
            dados.identidadeVisual.imagens[fase]
        ) {

            return (
                dados.identidadeVisual
                    .imagens[fase]
            );

        }

    } catch (erro) {

        console.warn(
            erro
        );

    }

    return (
        PETTON_IMAGENS[especie] ||
        PETTON_IMAGENS.gato
    );

}

/* =========================================================
   CARREGAR DADOS
========================================================= */

function carregarDados() {

    try {

        if (
            typeof Petton !==
            "undefined"
        ) {

            if (
                typeof Petton.status ===
                "function"
            ) {

                return (
                    Petton.status()
                );

            }

            if (
                typeof Petton.carregar ===
                "function"
            ) {

                return (
                    Petton.carregar()
                );

            }

        }

    } catch (erro) {

        console.error(
            erro
        );

    }

    try {

        const salvo =
            localStorage.getItem(
                "petton_dados_v3"
            );

        if (salvo) {

            return (
                JSON.parse(
                    salvo
                )
            );

        }

    } catch (erro) {

        console.error(
            erro
        );

    }

    return null;

}

/* =========================================================
   SALVAR DADOS
========================================================= */

function salvarDados(
    dados
) {

    try {

        localStorage.setItem(
            "petton_dados_v3",
            JSON.stringify(
                dados
            )
        );

    } catch (erro) {

        console.error(
            erro
        );

    }

    window.dispatchEvent(

        new CustomEvent(
            "petton-atualizado"
        )

    );

}

/* =========================================================
   IDADE
========================================================= */

function obterIdadeDias(
    dados
) {

    if (!dados) {

        return 0;

    }

    if (
        typeof dados.idadeDias ===
        "number"
    ) {

        return (
            dados.idadeDias
        );

    }

    if (
        dados.dateNascimento
    ) {

        const nascimento =
            new Date(
                dados.dateNascimento
            );

        const agora =
            new Date();

        const diferenca =
            agora -
            nascimento;

        return Math.max(

            0,

            Math.floor(
                diferenca /
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            )

        );

    }

    return 0;

}

/* =========================================================
   ATUALIZAR TELA
========================================================= */

function atualizarTela() {

    const dados =
        carregarDados();

    if (!dados) {

        return;

    }

    const imagem =
        document.getElementById(
            "imagemPetton"
        );

    const nome =
        document.getElementById(
            "nomePetton"
        );

    if (imagem) {

        imagem.src =
            obterImagemPetton(
                dados
            );

    }

    if (nome) {

        const especie =
            String(
                dados.especie ||
                ""
            ).toLowerCase();

        let emoji =
            "🐾";

        if (
            especie.includes(
                "gato"
            )
        ) {

            emoji =
                "🐱";

        }

        if (
            especie.includes(
                "cach"
            )
        ) {

            emoji =
                "🐶";

        }

        if (
            especie.includes(
                "coelh"
            )
        ) {

            emoji =
                "🐰";

        }

        nome.textContent =
            emoji +
            " " +
            (
                dados.nome ||
                "Petton"
            );

    }

    const fome =
        Math.max(

            0,

            Math.min(

                100,

                Math.round(
                    Number(
                        dados.fome ||
                        0
                    )
                )

            )

        );

    document.getElementById(
        "numeroFome"
    ).textContent =
        fome +
        "%";

    document.getElementById(
        "barraFome"
    ).style.width =
        fome +
        "%";

    atualizarEstadoFome(
        fome
    );

    const aviso =
        document.getElementById(
            "avisoDoente"
        );

    if (aviso) {

        aviso.style.display =
            dados.doente === true
                ? "block"
                : "none";

    }

    atualizarComidasPorIdade(
        dados
    );

}

/* =========================================================
   ESTADO DA FOME
========================================================= */

function atualizarEstadoFome(
    fome
) {

    const estado =
        document.getElementById(
            "estadoFome"
        );

    const texto =
        document.getElementById(
            "textoFome"
        );

    if (
        fome <=
        20
    ) {

        estado.textContent =
            "😫 Muita fome";

        texto.textContent =
            "Seu Petton precisa comer.";

        return;

    }

    if (
        fome <=
        45
    ) {

        estado.textContent =
            "😋 Com fome";

        texto.textContent =
            "Já está chegando a hora de comer.";

        return;

    }

    if (
        fome <=
        70
    ) {

        estado.textContent =
            "🙂 Satisfeito";

        texto.textContent =
            "Ainda está bem alimentado.";

        return;

    }

    if (
        fome <=
        90
    ) {

        estado.textContent =
            "😊 Bem alimentado";

        texto.textContent =
            "Seu Petton está satisfeito.";

        return;

    }

    estado.textContent =
        "🥰 Barriguinha cheia";

    texto.textContent =
        "Seu Petton está muito bem alimentado.";

}

/* =========================================================
   COMIDAS POR IDADE
========================================================= */

function atualizarComidasPorIdade(
    dados
) {

    const idade =
        obterIdadeDias(
            dados
        );

    const botoes =
        document.querySelectorAll(
            ".comida-btn"
        );

    botoes.forEach(

        function(
            botao
        ) {

            const tipo =
                botao.getAttribute(
                    "data-tipo"
                );

            let permitido =
                true;

            if (
                idade <
                8
            ) {

                permitido =
                    (
                        tipo ===
                        "papinha" ||

                        tipo ===
                        "maca" ||

                        tipo ===
                        "cenoura"
                    );

            }

            botao.disabled =
                !permitido;

            botao.classList.toggle(
                "bloqueado",
                !permitido
            );

        }

    );

}

/* =========================================================
   DAR COMIDA
========================================================= */

function darComida(
    tipo
) {

    const comida =
        COMIDAS[tipo];

    if (!comida) {

        return;

    }

    const dados =
        carregarDados();

    if (!dados) {

        mostrarMensagem(
            "Não foi possível carregar o Petton."
        );

        return;

    }

    const idade =
        obterIdadeDias(
            dados
        );

    if (
        idade <
        8 &&
        (
            tipo ===
            "frango" ||
            tipo ===
            "carne"
        )
    ) {

        mostrarMensagem(
            "🐣 Esse alimento ainda é forte para o seu Petton."
        );

        return;

    }

    const fomeAtual =
        Number(
            dados.fome ||
            0
        );

    if (
        fomeAtual >=
        100
    ) {

        mostrarMensagem(
            "🥰 O Petton já está de barriga cheia."
        );

        return;

    }

    let recuperacao =
        comida.fome;

    if (
        dados.doente ===
        true
    ) {

        recuperacao =
            Math.max(

                1,

                Math.round(
                    recuperacao /
                    2
                )

            );

    }

    dados.fome =
        Math.min(

            100,

            fomeAtual +
            recuperacao

        );

    /* pequena recuperação de saúde
       apenas se NÃO estiver doente */

    if (
        dados.doente !==
        true
    ) {

        dados.saude =
            Math.min(

                100,

                Number(
                    dados.saude ||
                    0
                ) +
                1

            );

    }

    dados.ultimaAlimentacaoEm =
        Date.now();

    /* =====================================================
       CHANCE DE COCÔ
    ===================================================== */

    if (
        Math.random() <
        0.28
    ) {

        dados.cocoAtivo =
            true;

    }

    /* =====================================================
       CHANCE DE CÁRIE
       maior para maçã/papinha
    ===================================================== */

    let chanceCarie =
        0.04;

    if (
        tipo ===
        "maca"
    ) {

        chanceCarie =
            0.08;

    }

    if (
        tipo ===
        "papinha"
    ) {

        chanceCarie =
            0.06;

    }

    if (
        Math.random() <
        chanceCarie
    ) {

        dados.carieAtiva =
            true;

    }

    salvarDados(
        dados
    );

    animarComida(
        comida.emoji
    );

    if (
        dados.doente ===
        true
    ) {

        mostrarMensagem(

            comida.emoji +
            " " +
            comida.nome +
            ": +" +
            recuperacao +
            " de fome. 🤒 Como está doente, recuperou metade."

        );

    } else {

        mostrarMensagem(

            comida.emoji +
            " " +
            comida.nome +
            ": +" +
            recuperacao +
            " de fome."

        );

    }

    atualizarTela();

}

/* =========================================================
   ANIMAÇÃO
========================================================= */

function animarComida(
    emoji
) {

    const area =
        document.getElementById(
            "animacaoComida"
        );

    if (!area) {

        return;

    }

    area.innerHTML =
        "";

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "comida-voando";

    item.textContent =
        emoji;

    area.appendChild(
        item
    );

    area.style.display =
        "block";

    setTimeout(

        function() {

            area.style.display =
                "none";

            area.innerHTML =
                "";

        },

        1100

    );

}

/* =========================================================
   MENSAGEM
========================================================= */

let timerMensagem =
    null;

function mostrarMensagem(
    texto
) {

    const caixa =
        document.getElementById(
            "mensagem"
        );

    if (!caixa) {

        return;

    }

    clearTimeout(
        timerMensagem
    );

    caixa.textContent =
        texto;

    caixa.style.display =
        "block";

    timerMensagem =
        setTimeout(

            function() {

                caixa.style.display =
                    "none";

            },

            2700

        );

}

/* =========================================================
   VOLTAR
========================================================= */

function voltar() {

    window.location.href =
        "./index.html";

}

/* =========================================================
   LINE
========================================================= */

async function iniciarLine() {

    try {

        await liff.init({

            liffId:
                "2010902449-KWNNNsxn"

        });

    } catch (erro) {

        console.error(
            erro
        );

    }

}

/* =========================================================
   INICIAR
========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        atualizarTela();

        iniciarLine();

    }

);

window.addEventListener(

    "petton-atualizado",

    function() {

        atualizarTela();

    }

);

</script>

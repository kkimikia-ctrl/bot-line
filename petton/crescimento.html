<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Crescimento do Petton</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

    background:linear-gradient(180deg,#fdf2f8,#f5f3ff);

    color:#333;

    min-height:100vh;

}

.container{

    max-width:700px;

    margin:auto;

    padding:18px;

}

.topo{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:18px;

}

.voltar{

    width:42px;

    height:42px;

    border:0;

    border-radius:14px;

    background:white;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    font-size:22px;

    cursor:pointer;

}

.titulo{

    flex:1;

}

.titulo h1{

    margin:0;

    font-size:23px;

}

.titulo p{

    margin:3px 0 0;

    color:#777;

    font-size:13px;

}

.card{

    background:white;

    border-radius:24px;

    padding:20px;

    margin-bottom:16px;

    box-shadow:0 5px 20px rgba(0,0,0,.07);

}

.pet-resumo{

    text-align:center;

}

.pet-emoji{

    font-size:82px;

    line-height:1;

    margin:8px 0 12px;

}

.nome{

    font-size:25px;

    font-weight:800;

}

.idade{

    color:#777;

    margin-top:5px;

}

.fase{

    display:inline-block;

    margin-top:12px;

    padding:8px 15px;

    border-radius:20px;

    background:#fce7f3;

    color:#be185d;

    font-weight:700;

    font-size:14px;

}

.progresso-titulo{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;

    font-weight:700;

}

.barra{

    height:14px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

}

.barra-interna{

    height:100%;

    width:0%;

    border-radius:20px;

    background:linear-gradient(90deg,#ec4899,#8b5cf6);

    transition:width .5s;

}

.proxima{

    margin-top:12px;

    text-align:center;

    color:#666;

    font-size:14px;

}

.timeline{

    position:relative;

    margin-top:8px;

}

.timeline::before{

    content:"";

    position:absolute;

    left:20px;

    top:10px;

    bottom:10px;

    width:3px;

    background:#eadcf8;

}

.etapa{

    position:relative;

    display:flex;

    gap:14px;

    margin-bottom:18px;

}

.bola{

    position:relative;

    z-index:2;

    flex:none;

    width:43px;

    height:43px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#eee;

    font-size:20px;

    border:4px solid white;

    box-shadow:0 2px 8px rgba(0,0,0,.1);

}

.etapa.atual .bola{

    background:#f9a8d4;

}

.etapa.concluida .bola{

    background:#c4b5fd;

}

.info{

    flex:1;

    background:#fafafa;

    border-radius:17px;

    padding:13px 15px;

}

.etapa.atual .info{

    background:#fdf2f8;

    border:2px solid #f9a8d4;

}

.info h3{

    margin:0 0 4px;

    font-size:17px;

}

.info p{

    margin:0;

    color:#777;

    font-size:13px;

    line-height:1.45;

}

.status{

    margin-top:8px;

    font-size:12px;

    font-weight:700;

}

.caracteristicas{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.carac{

    background:#fafafa;

    border-radius:16px;

    padding:13px;

}

.carac strong{

    display:block;

    font-size:13px;

    margin-bottom:4px;

}

.carac span{

    font-size:13px;

    color:#777;

}

.bloqueado{

    opacity:.45;

}

.rodape{

    text-align:center;

    color:#999;

    font-size:12px;

    padding:5px 0 25px;

}

.sem-pet{

    text-align:center;

    padding:30px 10px;

}

.sem-pet .emoji{

    font-size:60px;

}

.botao{

    display:block;

    width:100%;

    border:0;

    border-radius:16px;

    padding:14px;

    margin-top:15px;

    background:#ec4899;

    color:white;

    font-size:16px;

    font-weight:700;

}

@media(max-width:400px){

    .caracteristicas{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="topo">

        <button class="voltar" onclick="history.back()">←</button>

        <div class="titulo">

            <h1>🌱 Crescimento</h1>

            <p>Acompanhe cada fase do seu Petton</p>

        </div>

    </div>

    <div id="conteudo">

        <div class="card sem-pet">

            <div class="emoji">🐾</div>

            <p>Carregando seu Petton...</p>

        </div>

    </div>

</div>

<script src="petton.js"></script>

<script>

let dados = null;

const etapas = [

    {

        inicio:0,

        fim:3,

        emoji:"🥚",

        titulo:"Nascimento",

        texto:"Seu Petton está começando sua vida. O ovo começa a mudar até chegar o momento de nascer."

    },

    {

        inicio:1,

        fim:3,

        emoji:"🐣",

        titulo:"Recém-nascido",

        texto:"Pequeno e delicado. As primeiras características começam a aparecer."

    },

    {

        inicio:4,

        fim:7,

        emoji:"🐾",

        titulo:"Primeiros passos",

        texto:"Ele começa a ficar mais ativo, explorar o ambiente e mostrar mais personalidade."

    },

    {

        inicio:8,

        fim:14,

        emoji:"🐱",

        titulo:"Filhote crescendo",

        texto:"O tamanho aumenta e as cores, olhos, patas e padrões ficam mais visíveis."

    },

    {

        inicio:15,

        fim:30,

        emoji:"🐈",

        titulo:"Filhote",

        texto:"Uma fase de crescimento rápido. O corpo começa a ganhar proporções de um verdadeiro filhote."

    },

    {

        inicio:31,

        fim:60,

        emoji:"🐈‍⬛",

        titulo:"Petton jovem",

        texto:"O Petton já está bem maior e sua aparência fica cada vez mais definida."

    },

    {

        inicio:61,

        fim:90,

        emoji:"🐾",

        titulo:"Jovem",

        texto:"O crescimento continua, mas começa a ficar mais lento."

    },

    {

        inicio:91,

        fim:119,

        emoji:"✨",

        titulo:"Adulto",

        texto:"O Petton chega à aparência adulta e mantém suas características individuais."

    },

    {

        inicio:120,

        fim:99999,

        emoji:"👑",

        titulo:"Adulto desenvolvido",

        texto:"Seu Petton chegou à fase adulta desenvolvida."

    }

];

function idadeDias(){

    if(typeof Petton !== "undefined" && Petton.idadeDias){

        return Petton.idadeDias();

    }

    if(!dados || !dados.dataNascimento){

        return 0;

    }

    const nascimento = new Date(dados.dataNascimento);

    const agora = new Date();

    return Math.max(

        0,

        Math.floor((agora - nascimento) / 86400000)

    );

}

function pegarEtapa(idade){

    for(let i=0;i<etapas.length;i++){

        if(

            idade >= etapas[i].inicio &&

            idade <= etapas[i].fim

        ){

            return i;

        }

    }

    return etapas.length - 1;

}

function nomeFase(idade){

    if(idade === 0) return "Antes do nascimento";

    if(idade <= 3) return "Recém-nascido";

    if(idade <= 7) return "Primeiros passos";

    if(idade <= 14) return "Filhote crescendo";

    if(idade <= 30) return "Filhote";

    if(idade <= 60) return "Petton jovem";

    if(idade <= 90) return "Jovem";

    return "Adulto";

}

function emojiPet(){

    if(!dados) return "🐾";

    const especie = dados.especie || "gato";

    if(especie === "cachorro") return "🐶";

    if(especie === "coelho") return "🐰";

    return "🐱";

}

function textoIdade(idade){

    if(idade === 0){

        return "Ainda não nasceu";

    }

    if(idade === 1){

        return "1 dia de vida";

    }

    return idade + " dias de vida";

}

function progressoEtapa(idade, etapa){

    const atual = etapas[etapa];

    if(idade >= atual.fim){

        return 100;

    }

    if(idade < atual.inicio){

        return 0;

    }

    const tamanho = Math.max(

        1,

        atual.fim - atual.inicio

    );

    return Math.min(

        100,

        Math.max(

            0,

            ((idade - atual.inicio) / tamanho) * 100

        )

    );

}

function tamanhoPercentual(idade){

    if(idade <= 3){

        return Math.round(35 + idade * 3);

    }

    if(idade <= 7){

        return Math.round(45 + (idade - 3) * 5);

    }

    if(idade <= 14){

        return Math.round(65 + (idade - 7) * 4);

    }

    if(idade <= 30){

        return Math.round(93 + (idade - 14) * 4);

    }

    if(idade <= 60){

        return Math.round(157 + (idade - 30) * 1.2);

    }

    if(idade <= 90){

        return Math.round(193 + (idade - 60) * .35);

    }

    return 204;

}

function caracteristicaTexto(chave){

    if(!dados) return "—";

    const visiveis =

        dados.caracteristicasVisiveis || {};

    const valor =

        dados.caracteristicas ||

        dados.tracos ||

        {};

    if(chave === "cor"){

        if(visiveis.cor === false){

            return "Ainda aparecendo...";

        }

        return valor.cor || "Descobrindo";

    }

    if(chave === "padrao"){

        if(visiveis.padrao === false){

            return "Ainda escondido";

        }

        return valor.padrao || "Descobrindo";

    }

    if(chave === "olhos"){

        if(visiveis.eyes === false){

            return "Ainda se formando";

        }

        return valor.olhos || valor.eyeColor || "Descobrindo";

    }

    if(chave === "orelhas"){

        if(visiveis.ears === false){

            return "Ainda se formando";

        }

        return valor.orelhas || valor.earType || "Definindo";

    }

    if(chave === "patas"){

        if(visiveis.paws === false){

            return "Ainda escondidas";

        }

        return valor.patas || valor.pawColor || "Descobrindo";

    }

    if(chave === "cauda"){

        if(visiveis.tail === false){

            return "Ainda escondida";

        }

        return valor.cauda || valor.tailType || "Descobrindo";

    }

    return "—";

}

function carregarDados(){

    try{

        if(typeof Petton !== "undefined"){

            if(Petton.carregar){

                Petton.carregar();

            }

            if(Petton.dados){

                dados = Petton.dados;

            }

        }

    }catch(e){

        console.log("Erro carregando Petton:",e);

    }

    if(!dados){

        try{

            const salvo =

                localStorage.getItem("petton_dados_v2") ||

                localStorage.getItem("petton_dados_v1");

            if(salvo){

                dados = JSON.parse(salvo);

            }

        }catch(e){

            console.log(e);

        }

    }

}

function renderizar(){

    carregarDados();

    const area =

        document.getElementById("conteudo");

    if(!dados){

        area.innerHTML = `

            <div class="card sem-pet">

                <div class="emoji">🥚</div>

                <h2>Nenhum Petton encontrado</h2>

                <p>Seu Petton aparecerá aqui depois que começar a vida.</p>

                <button class="botao" onclick="location.href='nascimento.html'">

                    🥚 Ver nascimento

                </button>

            </div>

        `;

        return;

    }

    const idade = idadeDias();

    const etapaAtual = pegarEtapa(idade);

    const etapa = etapas[etapaAtual];

    const progresso =

        progressoEtapa(idade,etapaAtual);

    const tamanho =

        tamanhoPercentual(idade);

    let proximaTexto =

        "Seu Petton está na última fase de crescimento.";

    if(etapaAtual < etapas.length - 1){

        const proxima = etapas[etapaAtual + 1];

        const faltam =

            Math.max(0,proxima.inicio - idade);

        if(faltam === 0){

            proximaTexto =

                "A próxima fase está começando!";

        }else if(faltam === 1){

            proximaTexto =

                "Falta aproximadamente 1 dia para a próxima fase.";

        }else{

            proximaTexto =

                "Faltam aproximadamente " +

                faltam +

                " dias para a próxima fase.";

        }

    }

    area.innerHTML = `

        <div class="card pet-resumo">

            <div class="pet-emoji">

                ${emojiPet()}

            </div>

            <div class="nome">

                ${dados.nome || "Meu Petton"}

            </div>

            <div class="idade">

                ${textoIdade(idade)}

            </div>

            <div class="fase">

                ${nomeFase(idade)}

            </div>

        </div>

        <div class="card">

            <div class="progresso-titulo">

                <span>🌱 Crescimento atual</span>

                <span>${tamanho}%</span>

            </div>

            <div class="barra">

                <div

                    class="barra-interna"

                    style="width:${Math.min(100,tamanho)}%"

                ></div>

            </div>

            <div class="proxima">

                ${proximaTexto}

            </div>

        </div>

        <div class="card">

            <h2 style="margin-top:0;">

                🧬 Características

            </h2>

            <div class="caracteristicas">

                <div class="carac">

                    <strong>🎨 Cor</strong>

                    <span>${caracteristicaTexto("cor")}</span>

                </div>

                <div class="carac">

                    <strong>✨ Padrão</strong>

                    <span>${caracteristicaTexto("padrao")}</span>

                </div>

                <div class="carac">

                    <strong>👀 Olhos</strong>

                    <span>${caracteristicaTexto("olhos")}</span>

                </div>

                <div class="carac">

                    <strong>👂 Orelhas</strong>

                    <span>${caracteristicaTexto("orelhas")}</span>

                </div>

                <div class="carac">

                    <strong>🐾 Patas</strong>

                    <span>${caracteristicaTexto("patas")}</span>

                </div>

                <div class="carac">

                    <strong>🌀 Cauda</strong>

                    <span>${caracteristicaTexto("cauda")}</span>

                </div>

            </div>

        </div>

        <div class="card">

            <h2 style="margin-top:0;">

                📅 Jornada do seu Petton

            </h2>

            <div class="timeline">

                ${etapas.map((item,index)=>{

                    let classe = "";

                    if(index < etapaAtual){

                        classe = "concluida";

                    }

                    if(index === etapaAtual){

                        classe = "atual";

                    }

                    let status = "";

                    if(index < etapaAtual){

                        status = "✓ Fase concluída";

                    }

                    if(index === etapaAtual){

                        status = "🌟 Você está aqui";

                    }

                    if(index > etapaAtual){

                        status = "🔒 Ainda não chegou";

                    }

                    return `

                        <div class="etapa ${classe}">

                            <div class="bola">

                                ${item.emoji}

                            </div>

                            <div class="info">

                                <h3>

                                    ${item.titulo}

                                </h3>

                                <p>

                                    ${item.texto}

                                </p>

                                <div class="status">

                                    ${status}

                                </div>

                            </div>

                        </div>

                    `;

                }).join("")}

            </div>

        </div>

        <div class="card">

            <h2 style="margin-top:0;">

                💖 Cada Petton é diferente

            </h2>

            <p style="color:#777;line-height:1.6;margin-bottom:0;">

                As características do seu Petton aparecem aos poucos.

                A cor, o padrão do pelo, os olhos, as patas, as orelhas

                e a cauda fazem parte da identidade dele.

            </p>

        </div>

        <div class="rodape">

            O crescimento acontece conforme o tempo real passa. 🐾

        </div>

    `;

}

renderizar();

setInterval(renderizar,10000);

</script>

</body>

</html>

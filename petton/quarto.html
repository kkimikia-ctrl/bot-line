<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

    >

    <title>Petton 🐾 - Quarto</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script src="petton.js"></script>

    <style>

        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }

        html,

        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

            font-family:

                -apple-system,

                BlinkMacSystemFont,

                "Segoe UI",

                Arial,

                sans-serif;

            background: #f7efe3;

            color: #49372d;

        }

        body {

            min-height: 100vh;

            overflow-x: hidden;

        }

        .pagina {

            width: 100%;

            min-height: 100vh;

            padding-bottom: 30px;

        }

        /* TOPO */

        .topo {

            height: 68px;

            background: linear-gradient(

                135deg,

                #ff9f43,

                #ff7b54

            );

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 15px;

            color: white;

            box-shadow:

                0 4px 15px rgba(0,0,0,.12);

            position: sticky;

            top: 0;

            z-index: 20;

        }

        .botao-voltar {

            border: none;

            background: rgba(255,255,255,.22);

            color: white;

            width: 44px;

            height: 44px;

            border-radius: 14px;

            font-size: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

        }

        .titulo-topo {

            font-size: 21px;

            font-weight: 800;

            text-shadow:

                0 2px 4px rgba(0,0,0,.12);

        }

        .botao-loja {

            border: none;

            background: rgba(255,255,255,.22);

            color: white;

            min-width: 44px;

            height: 44px;

            border-radius: 14px;

            font-size: 23px;

            cursor: pointer;

        }

        /* QUARTO */

        .quarto {

            position: relative;

            margin: 18px auto 0;

            width: calc(100% - 24px);

            max-width: 520px;

            height: 510px;

            border-radius: 28px;

            overflow: hidden;

            background:

                linear-gradient(

                    to bottom,

                    #dff5ff 0%,

                    #eaf8ff 54%,

                    #d7a66b 54%,

                    #c98d50 100%

                );

            box-shadow:

                0 12px 30px rgba(93,64,39,.20);

            border: 4px solid rgba(255,255,255,.75);

        }

        /* JANELA */

        .janela {

            position: absolute;

            top: 34px;

            left: 50%;

            transform: translateX(-50%);

            width: 155px;

            height: 130px;

            background:

                linear-gradient(

                    135deg,

                    #91d9ff,

                    #d7f5ff

                );

            border: 9px solid #fff7e9;

            border-radius: 18px;

            box-shadow:

                inset 0 0 0 4px #d7b58b,

                0 8px 15px rgba(0,0,0,.12);

        }

        .janela::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            width: 4px;

            height: 100%;

            background: #fff7e9;

            transform: translateX(-50%);

        }

        .janela::after {

            content: "";

            position: absolute;

            top: 50%;

            left: 0;

            width: 100%;

            height: 4px;

            background: #fff7e9;

            transform: translateY(-50%);

        }

        /* QUADROS */

        .quadro {

            position: absolute;

            width: 65px;

            height: 65px;

            border-radius: 12px;

            background: #fff;

            border: 5px solid #d7b58b;

            box-shadow:

                0 5px 10px rgba(0,0,0,.12);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

        }

        .quadro.um {

            left: 28px;

            top: 45px;

        }

        .quadro.dois {

            right: 28px;

            top: 45px;

        }

        /* TAPETE */

        .tapete {

            position: absolute;

            left: 50%;

            bottom: 30px;

            transform: translateX(-50%);

            width: 260px;

            height: 125px;

            border-radius: 50%;

            background:

                radial-gradient(

                    ellipse,

                    #f7d9a7 0%,

                    #edbd7a 65%,

                    #d69b59 100%

                );

            box-shadow:

                0 8px 15px rgba(95,61,31,.18);

            z-index: 2;

        }

        /* CAMA */

        .cama {

            position: absolute;

            left: 22px;

            bottom: 45px;

            width: 145px;

            height: 105px;

            background: #c98a58;

            border-radius: 28px 28px 18px 18px;

            box-shadow:

                0 8px 12px rgba(72,43,25,.20);

            z-index: 4;

        }

        .cama::before {

            content: "";

            position: absolute;

            top: -18px;

            left: 8px;

            right: 8px;

            height: 50px;

            border-radius: 25px 25px 15px 15px;

            background: #fff4dd;

            box-shadow:

                inset 0 -5px 0 rgba(217,171,116,.35);

        }

        .cama::after {

            content: "💤";

            position: absolute;

            right: 12px;

            top: 22px;

            font-size: 25px;

        }

        /* COMEDOURO */

        .comedouro {

            position: absolute;

            right: 22px;

            bottom: 55px;

            width: 85px;

            height: 65px;

            z-index: 5;

        }

        .tigela {

            width: 85px;

            height: 42px;

            background:

                linear-gradient(

                    to bottom,

                    #ff8b8b,

                    #e65d5d

                );

            border-radius:

                8px 8px 30px 30px;

            box-shadow:

                0 6px 8px rgba(70,35,35,.20);

        }

        .comida {

            position: absolute;

            top: -4px;

            left: 8px;

            width: 69px;

            height: 20px;

            border-radius: 50%;

            background: #8d572e;

            box-shadow:

                inset 0 3px 0 rgba(255,255,255,.20);

        }

        /* BRINQUEDO */

        .brinquedo {

            position: absolute;

            left: 50%;

            top: 350px;

            transform: translateX(-50%);

            font-size: 48px;

            z-index: 8;

            filter:

                drop-shadow(

                    0 5px 4px rgba(0,0,0,.16)

                );

        }

        /* PET */

        .pet-area {

            position: absolute;

            left: 50%;

            bottom: 70px;

            transform: translateX(-50%);

            width: 180px;

            height: 180px;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            z-index: 10;

            pointer-events: none;

        }

        .pet {

            max-width: 150px;

            max-height: 150px;

            object-fit: contain;

            filter:

                drop-shadow(

                    0 9px 7px rgba(0,0,0,.18)

                );

            transition:

                transform .25s ease;

        }

        .pet:hover {

            transform: scale(1.04);

        }

        /* STATUS */

        .painel-status {

            width: calc(100% - 24px);

            max-width: 520px;

            margin: 16px auto 0;

            background: rgba(255,255,255,.95);

            border-radius: 22px;

            padding: 15px 17px;

            box-shadow:

                0 8px 20px rgba(75,53,35,.10);

        }

        .nome {

            text-align: center;

            font-size: 22px;

            font-weight: 800;

            color: #553d2f;

            margin-bottom: 3px;

        }

        .idade {

            text-align: center;

            font-size: 14px;

            color: #8b7565;

            margin-bottom: 12px;

        }

        .status-linha {

            display: grid;

            grid-template-columns:

                repeat(4, 1fr);

            gap: 8px;

        }

        .status-item {

            background: #fff8ef;

            border-radius: 14px;

            padding: 9px 4px;

            text-align: center;

        }

        .status-emoji {

            font-size: 20px;

            display: block;

        }

        .status-valor {

            font-size: 12px;

            font-weight: 700;

            margin-top: 3px;

            color: #70594a;

        }

        /* BOTÕES */

        .acoes {

            width: calc(100% - 24px);

            max-width: 520px;

            margin: 15px auto 0;

            display: grid;

            grid-template-columns:

                1fr 1fr;

            gap: 10px;

        }

        .acao {

            border: none;

            min-height: 52px;

            border-radius: 17px;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:

                0 5px 10px rgba(0,0,0,.10);

            transition:

                transform .12s ease;

        }

        .acao:active {

            transform: scale(.96);

        }

        .acao-voltar {

            background: #fff;

            color: #765b49;

        }

        .acao-loja {

            background:

                linear-gradient(

                    135deg,

                    #ff9f43,

                    #ff7043

                );

            color: white;

        }

        /* BLOQUEIO */

        #bloqueioLine {

            display: none;

            min-height: 100vh;

            align-items: center;

            justify-content: center;

            padding: 25px;

            text-align: center;

        }

        .bloqueio-card {

            background: white;

            padding: 30px 22px;

            border-radius: 25px;

            box-shadow:

                0 10px 30px rgba(0,0,0,.12);

        }

        .bloqueio-card .emoji {

            font-size: 60px;

        }

        .bloqueio-card h2 {

            margin: 12px 0 8px;

        }

        .bloqueio-card p {

            color: #806e60;

        }

        /* RESPONSIVO */

        @media (max-width: 380px) {

            .quarto {

                height: 475px;

            }

            .cama {

                transform: scale(.9);

                transform-origin: bottom left;

            }

            .comedouro {

                transform: scale(.9);

                transform-origin: bottom right;

            }

            .pet {

                max-width: 130px;

                max-height: 130px;

            }

            .status-item {

                padding: 7px 2px;

            }

        }

    </style>

</head>

<body>

<div id="bloqueioLine">

    <div class="bloqueio-card">

        <div class="emoji">🐾</div>

        <h2>Petton</h2>

        <p>Abra o Petton pelo aplicativo LINE.</p>

    </div>

</div>

<div id="conteudoQuarto" class="pagina">

    <header class="topo">

        <button

            class="botao-voltar"

            onclick="voltarPetton()"

            aria-label="Voltar"

        >

            ←

        </button>

        <div class="titulo-topo">

            🏠 Quarto

        </div>

        <button

            class="botao-loja"

            onclick="abrirLoja()"

            aria-label="Loja"

        >

            🛍️

        </button>

    </header>

    <main>

        <section class="quarto">

            <div class="janela"></div>

            <div class="quadro um">

                🐾

            </div>

            <div class="quadro dois">

                ❤️

            </div>

            <div class="tapete"></div>

            <div class="cama"></div>

            <div class="comedouro">

                <div class="comida"></div>

                <div class="tigela"></div>

            </div>

            <div

                class="brinquedo"

                id="brinquedo"

            >

                🧸

            </div>

            <div class="pet-area">

                <img

                    id="petImagem"

                    class="pet"

                    src=""

                    alt="Seu Petton"

                >

            </div>

        </section>

        <section class="painel-status">

            <div

                id="petNome"

                class="nome"

            >

                Meu Petton

            </div>

            <div

                id="petIdade"

                class="idade"

            >

                Carregando...

            </div>

            <div class="status-linha">

                <div class="status-item">

                    <span class="status-emoji">❤️</span>

                    <span

                        id="statusVida"

                        class="status-valor"

                    >

                        100

                    </span>

                </div>

                <div class="status-item">

                    <span class="status-emoji">🍖</span>

                    <span

                        id="statusFome"

                        class="status-valor"

                    >

                        100

                    </span>

                </div>

                <div class="status-item">

                    <span class="status-emoji">😊</span>

                    <span

                        id="statusFelicidade"

                        class="status-valor"

                    >

                        100

                    </span>

                </div>

                <div class="status-item">

                    <span class="status-emoji">✨</span>

                    <span

                        id="statusHigiene"

                        class="status-valor"

                    >

                        100

                    </span>

                </div>

            </div>

        </section>

        <section class="acoes">

            <button

                class="acao acao-voltar"

                onclick="voltarPetton()"

            >

                🏠 Voltar

            </button>

            <button

                class="acao acao-loja"

                onclick="abrirLoja()"

            >

                🛍️ Loja

            </button>

        </section>

    </main>

</div>

<script>

const LIFF_ID = "2010902449-KWNNNsxn";

const imagensFallback = {

    gato: "petton-original.png",

    cachorro: "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

    coelho: "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

};

/* -------------------------------------------------

   LER PET

------------------------------------------------- */

function carregarDadosPetton() {

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.carregar === "function"

        ) {

            return Petton.carregar();

        }

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

    }

    return null;

}

/* -------------------------------------------------

   DESCOBRIR IMAGEM

------------------------------------------------- */

function obterImagemPet(dados) {

    if (!dados) {

        return null;

    }

    let fase =

        dados.fase ||

        "bebe";

    /*

     * Primeiro tenta a imagem gerada/salva

     * pelo próprio Petton.

     */

    try {

        if (

            dados.identidadeVisual &&

            dados.identidadeVisual.imagens &&

            dados.identidadeVisual.imagens[fase]

        ) {

            return dados

                .identidadeVisual

                .imagens[fase];

        }

    } catch (erro) {

        console.warn(

            "Não foi possível obter imagem da identidade:",

            erro

        );

    }

    /*

     * Depois tenta imagem direta.

     */

    if (

        dados.imagens &&

        dados.imagens[fase]

    ) {

        return dados.imagens[fase];

    }

    /*

     * Por último usa a espécie.

     */

    let especie =

        dados.especie ||

        (

            dados.identidadeVisual &&

            dados.identidadeVisual.especie

        ) ||

        "gato";

    especie =

        String(especie)

            .toLowerCase();

    if (

        especie.includes("cachorro") ||

        especie.includes("cao") ||

        especie.includes("cão") ||

        especie.includes("dog")

    ) {

        return imagensFallback.cachorro;

    }

    if (

        especie.includes("coelho") ||

        especie.includes("rabbit")

    ) {

        return imagensFallback.coelho;

    }

    return imagensFallback.gato;

}

/* -------------------------------------------------

   ATUALIZAR PET

------------------------------------------------- */

function atualizarPetton() {

    const dados =

        carregarDadosPetton();

    if (!dados) {

        console.warn(

            "Petton ainda não possui dados."

        );

        return;

    }

    /*

     * NOME

     */

    const nome =

        dados.nome ||

        "Meu Petton";

    const elementoNome =

        document.getElementById(

            "petNome"

        );

    if (elementoNome) {

        elementoNome.textContent =

            nome;

    }

    /*

     * IDADE

     */

    let idadeTexto =

        "";

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.idadeTexto === "function"

        ) {

            idadeTexto =

                Petton.idadeTexto();

        }

    } catch (erro) {

        console.warn(

            "Erro idade:",

            erro

        );

    }

    if (!idadeTexto) {

        if (

            typeof dados.idadeDias === "number"

        ) {

            idadeTexto =

                dados.idadeDias +

                (

                    dados.idadeDias === 1

                        ? " dia"

                        : " dias"

                );

        } else {

            idadeTexto =

                dados.fase ||

                "";

        }

    }

    const elementoIdade =

        document.getElementById(

            "petIdade"

        );

    if (elementoIdade) {

        elementoIdade.textContent =

            idadeTexto;

    }

    /*

     * IMAGEM

     */

    const imagem =

        document.getElementById(

            "petImagem"

        );

    const caminhoImagem =

        obterImagemPet(

            dados

        );

    if (

        imagem &&

        caminhoImagem

    ) {

        imagem.src =

            caminhoImagem;

    }

    /*

     * STATUS

     */

    atualizarStatus(

        dados

    );

    /*

     * BRINQUEDO

     */

    atualizarBrinquedo(

        dados

    );

}

/* -------------------------------------------------

   STATUS

------------------------------------------------- */

function atualizarStatus(dados) {

    const vida =

        obterValor(

            dados,

            [

                "vida",

                "saude",

                "saúde",

                "energia"

            ],

            100

        );

    const fome =

        obterValor(

            dados,

            [

                "fome",

                "alimentacao",

                "alimentação"

            ],

            100

        );

    const felicidade =

        obterValor(

            dados,

            [

                "felicidade",

                "diversao",

                "diversão"

            ],

            100

        );

    const higiene =

        obterValor(

            dados,

            [

                "higiene",

                "limpeza"

            ],

            100

        );

    colocarValor(

        "statusVida",

        vida

    );

    colocarValor(

        "statusFome",

        fome

    );

    colocarValor(

        "statusFelicidade",

        felicidade

    );

    colocarValor(

        "statusHigiene",

        higiene

    );

}

function obterValor(

    objeto,

    nomes,

    padrao

) {

    for (

        const nome of nomes

    ) {

        if (

            objeto &&

            objeto[nome] !== undefined &&

            objeto[nome] !== null

        ) {

            return objeto[nome];

        }

    }

    return padrao;

}

function colocarValor(

    id,

    valor

) {

    const elemento =

        document.getElementById(id);

    if (!elemento) {

        return;

    }

    if (

        typeof valor === "number"

    ) {

        valor =

            Math.round(

                valor

            );

    }

    elemento.textContent =

        valor;

}

/* -------------------------------------------------

   BRINQUEDO DA LOJA

------------------------------------------------- */

function atualizarBrinquedo(dados) {

    const brinquedo =

        document.getElementById(

            "brinquedo"

        );

    if (!brinquedo) {

        return;

    }

    /*

     * Tenta encontrar compras

     * feitas na loja.

     */

    let temBola =

        false;

    try {

        if (

            dados &&

            dados.itens

        ) {

            if (

                dados.itens.bola ||

                dados.itens.bolinha

            ) {

                temBola = true;

            }

        }

        if (

            dados &&

            dados.inventario

        ) {

            if (

                dados.inventario.bola ||

                dados.inventario.bolinha

            ) {

                temBola = true;

            }

        }

        /*

         * Alguns sistemas salvam

         * compras em "loja".

         */

        if (

            dados &&

            dados.loja

        ) {

            if (

                dados.loja.bola ||

                dados.loja.bolinha

            ) {

                temBola = true;

            }

        }

    } catch (erro) {

        console.warn(

            "Erro ao verificar brinquedos:",

            erro

        );

    }

    if (temBola) {

        brinquedo.textContent =

            "⚽";

    } else {

        brinquedo.textContent =

            "🧸";

    }

}

/* -------------------------------------------------

   VOLTAR

------------------------------------------------- */

function voltarPetton() {

    try {

        if (

            window.history.length > 1

        ) {

            window.history.back();

            return;

        }

    } catch (erro) {

        console.warn(

            "Não foi possível voltar:",

            erro

        );

    }

    window.location.href =

        "./index.html";

}

/* -------------------------------------------------

   LOJA

------------------------------------------------- */

function abrirLoja() {

    window.location.href =

        "./loja.html";

}

/* -------------------------------------------------

   INICIALIZAÇÃO

------------------------------------------------- */

async function iniciarQuarto() {

    /*

     * IMPORTANTE:

     *

     * NÃO usamos liff.isInClient()

     * para bloquear esta página.

     *

     * O index.html já controla a entrada

     * principal do Petton pelo LINE.

     *

     * Quando o Quarto é aberto dentro

     * do LINE, esta página precisa

     * simplesmente funcionar.

     */

    try {

        if (

            typeof liff !== "undefined"

        ) {

            try {

                await liff.init({

                    liffId: LIFF_ID

                });

                console.log(

                    "Petton Quarto: LIFF inicializado."

                );

            } catch (erroLiff) {

                console.warn(

                    "LIFF não inicializou no Quarto:",

                    erroLiff

                );

            }

        }

    } catch (erro) {

        console.warn(

            "Erro no LIFF do Quarto:",

            erro

        );

    }

    /*

     * Mostra o quarto

     * independentemente do resultado

     * do isInClient().

     */

    const bloqueio =

        document.getElementById(

            "bloqueioLine"

        );

    const conteudo =

        document.getElementById(

            "conteudoQuarto"

        );

    if (bloqueio) {

        bloqueio.style.display =

            "none";

    }

    if (conteudo) {

        conteudo.style.display =

            "block";

    }

    atualizarPetton();

}

/* -------------------------------------------------

   INICIAR

------------------------------------------------- */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        iniciarQuarto();

    }

);

</script>

</body>

</html>

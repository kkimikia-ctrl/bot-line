<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="google" content="notranslate">

<title>Quarto do Petton 🏠</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    padding: 0;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    background: #f4f8f3;

    color: #333;

}

#bloqueioLine {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 99999;

    background: #f4f8f3;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;

}

.bloqueio-box {

    background: white;

    border-radius: 20px;

    padding: 28px 20px;

    max-width: 340px;

    box-shadow: 0 5px 25px rgba(0,0,0,.12);

}

.bloqueio-icon {

    font-size: 55px;

    margin-bottom: 10px;

}

.bloqueio-box h2 {

    margin: 5px 0 10px;

    font-size: 21px;

}

.bloqueio-box p {

    margin: 0;

    font-size: 14px;

    color: #666;

    line-height: 1.5;

}

#conteudoQuarto {

    display: none;

    width: 100%;

    max-width: 600px;

    margin: 0 auto;

    padding-bottom: 30px;

}

.topo {

    min-height: 55px;

    display: grid;

    grid-template-columns: 45px 1fr 45px;

    align-items: center;

    padding: 6px 8px;

}

.topo button {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: white;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);

    font-size: 21px;

    cursor: pointer;

}

.topo h1 {

    margin: 0;

    text-align: center;

    font-size: 20px;

}

.quarto-card {

    margin: 5px 10px 10px;

    background: white;

    border-radius: 22px;

    padding: 12px;

    box-shadow: 0 3px 15px rgba(0,0,0,.08);

}

.quarto-cena {

    position: relative;

    width: 100%;

    height: 430px;

    overflow: hidden;

    border-radius: 18px;

    background:

        linear-gradient(

            to bottom,

            #dff3ff 0%,

            #effaff 58%,

            #d9efc9 58%,

            #c5e5b4 100%

        );

}

.sol {

    position: absolute;

    top: 25px;

    right: 30px;

    font-size: 48px;

}

.nuvem {

    position: absolute;

    font-size: 38px;

    opacity: .8;

}

.nuvem1 {

    top: 45px;

    left: 30px;

}

.nuvem2 {

    top: 90px;

    left: 180px;

}

.chao {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 42%;

    background:

        repeating-linear-gradient(

            90deg,

            rgba(255,255,255,.12) 0,

            rgba(255,255,255,.12) 2px,

            transparent 2px,

            transparent 25px

        ),

        #c8e6b7;

}

.tapete {

    position: absolute;

    bottom: 35px;

    left: 50%;

    transform: translateX(-50%);

    width: 240px;

    height: 75px;

    border-radius: 50%;

    background: #eadcc7;

    box-shadow: 0 5px 12px rgba(0,0,0,.12);

}

.cama {

    position: absolute;

    left: 20px;

    bottom: 75px;

    width: 125px;

    height: 85px;

    border-radius: 18px;

    background: #f4d6df;

    box-shadow: 0 5px 10px rgba(0,0,0,.12);

}

.cama::before {

    content: "";

    position: absolute;

    left: 12px;

    top: 10px;

    width: 101px;

    height: 45px;

    border-radius: 15px;

    background: #fff;

}

.pote {

    position: absolute;

    right: 25px;

    bottom: 82px;

    font-size: 48px;

}

.planta {

    position: absolute;

    right: 18px;

    top: 155px;

    font-size: 58px;

}

.brinquedo {

    position: absolute;

    left: 45px;

    bottom: 30px;

    font-size: 42px;

}

#imagemPetton {

    position: absolute;

    left: 50%;

    bottom: 82px;

    transform: translateX(-50%);

    width: auto;

    max-width: 210px;

    max-height: 220px;

    object-fit: contain;

    z-index: 10;

    transition: opacity .3s ease, transform .3s ease;

}

#mensagemPetton {

    min-height: 22px;

    margin: 10px 5px 0;

    text-align: center;

    font-size: 14px;

    color: #666;

}

.informacao {

    margin-top: 10px;

    padding: 10px;

    border-radius: 12px;

    background: #f5f8f4;

    text-align: center;

    font-size: 13px;

}

.botoes {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-top: 10px;

}

.botao {

    height: 46px;

    border: none;

    border-radius: 12px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

}

.botao-loja {

    background: #fff1c9;

}

.botao-voltar {

    background: #eef6ec;

}

.itens {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 8px;

    margin-top: 12px;

}

.item {

    min-height: 75px;

    border-radius: 12px;

    background: #f7faf6;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-size: 12px;

    text-align: center;

}

.item-emoji {

    font-size: 30px;

    margin-bottom: 3px;

}

@media(max-width:380px) {

    .quarto-cena {

        height: 390px;

    }

    #imagemPetton {

        max-width: 180px;

        max-height: 200px;

    }

}

</style>

</head>

<body>

<div id="bloqueioLine">

    <div class="bloqueio-box">

        <div class="bloqueio-icon">🐾</div>

        <h2>Petton</h2>

        <p>Este jogo funciona dentro do LINE.</p>

    </div>

</div>

<div id="conteudoQuarto">

    <div class="topo">

        <button

            type="button"

            onclick="voltarInicio()"

            aria-label="Voltar">

            ←

        </button>

        <h1>🏠 Quarto</h1>

        <button

            type="button"

            onclick="abrirLoja()"

            aria-label="Loja">

            🛒

        </button>

    </div>

    <main class="quarto-card">

        <div class="quarto-cena">

            <div class="sol">☀️</div>

            <div class="nuvem nuvem1">☁️</div>

            <div class="nuvem nuvem2">☁️</div>

            <div class="chao"></div>

            <div class="planta">🪴</div>

            <div class="cama"></div>

            <div class="pote">🥣</div>

            <div class="tapete"></div>

            <div class="brinquedo">⚽</div>

            <img

                id="imagemPetton"

                src="petton-original.png"

                alt="Petton">

        </div>

        <div

            id="mensagemPetton">

            Carregando seu Petton...

        </div>

        <div

            class="informacao"

            id="informacaoPetton">

            🐾 Seu Petton está no quarto.

        </div>

        <div class="itens" id="itensQuarto">

        </div>

        <div class="botoes">

            <button

                type="button"

                class="botao botao-loja"

                onclick="abrirLoja()">

                🛒 Ir para a loja

            </button>

            <button

                type="button"

                class="botao botao-voltar"

                onclick="voltarInicio()">

                ← Voltar

            </button>

        </div>

    </main>

</div>

<script src="./petton.js"></script>

<script>

const LIFF_ID = "2010902449-KWNNNsxn";

const CHAVE_LOJA = "petton_loja_v1";

const PRODUTOS = {

    cama_basica: {

        nome: "Cama básica",

        emoji: "🛏️"

    },

    cama_rosa: {

        nome: "Cama rosa",

        emoji: "🛏️"

    },

    cama_casinha: {

        nome: "Casinha",

        emoji: "🏠"

    },

    bola: {

        nome: "Bola",

        emoji: "⚽"

    },

    bolinha: {

        nome: "Bolinha",

        emoji: "🔴"

    },

    ratinho: {

        nome: "Ratinho",

        emoji: "🐭"

    },

    arranhador: {

        nome: "Arranhador",

        emoji: "🪵"

    },

    pelucia: {

        nome: "Pelúcia",

        emoji: "🧸"

    },

    pote: {

        nome: "Pote",

        emoji: "🥣"

    },

    pote_agua: {

        nome: "Pote de água",

        emoji: "💧"

    },

    planta: {

        nome: "Planta",

        emoji: "🪴"

    },

    flor: {

        nome: "Flor",

        emoji: "🌸"

    },

    tapete: {

        nome: "Tapete",

        emoji: "🟤"

    },

    abajur: {

        nome: "Abajur",

        emoji: "💡"

    },

    quadro: {

        nome: "Quadro",

        emoji: "🖼️"

    }

};

/* =========================================================

   ESPÉCIE

========================================================= */

function obterEspeciePet(dados) {

    if (!dados) return "gato";

    let especie =

        dados.identidadeVisual?.especie ||

        dados.especie ||

        "gato";

    especie =

        String(especie).toLowerCase();

    if (

        especie.includes("cach") ||

        especie.includes("dog")

    ) {

        return "cachorro";

    }

    if (

        especie.includes("coelh") ||

        especie.includes("rabbit")

    ) {

        return "coelho";

    }

    return "gato";

}

/* =========================================================

   FASE

========================================================= */

function obterFasePet(dados) {

    if (!dados) return "bebe";

    const fase =

        String(

            dados.fase ||

            dados.faseVida ||

            ""

        ).toLowerCase();

    if (fase.includes("adult")) {

        return "adulto";

    }

    if (fase.includes("jovem")) {

        return "jovem";

    }

    if (fase.includes("filh")) {

        return "filhote";

    }

    if (fase.includes("beb")) {

        return "bebe";

    }

    let dias =

        Number(

            dados.idadeDias ?? 0

        );

    if (!Number.isFinite(dias)) {

        dias = 0;

    }

    if (dias < 7) return "bebe";

    if (dias < 30) return "filhote";

    if (dias < 90) return "jovem";

    return "adulto";

}

/* =========================================================

   IMAGEM DO MESMO PETTON DO INÍCIO

========================================================= */

function obterImagemPetton(dados) {

    const especie =

        obterEspeciePet(dados);

    const fase =

        obterFasePet(dados);

    const imagens =

        dados?.identidadeVisual?.imagens;

    /*

       PRIMEIRO:

       usa a imagem específica daquela fase,

       se existir.

    */

    if (

        imagens &&

        typeof imagens === "object"

    ) {

        const imagemFase =

            imagens[fase];

        if (

            typeof imagemFase === "string" &&

            imagemFase.trim() !== ""

        ) {

            return imagemFase.trim();

        }

    }

    /*

       MESMAS IMAGENS FALLBACK DO INÍCIO

    */

    const fallback = {

        gato:

            "petton-original.png",

        cachorro:

            "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

        coelho:

            "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

    };

    return (

        fallback[especie] ||

        fallback.gato

    );

}

/* =========================================================

   ATUALIZAR PETTON

========================================================= */

function atualizarPetton() {

    try {

        if (

            typeof Petton === "undefined" ||

            typeof Petton.carregarPetton !== "function"

        ) {

            return;

        }

        const dados =

            Petton.carregarPetton();

        if (!dados) return;

        const imagem =

            document.getElementById(

                "imagemPetton"

            );

        const mensagem =

            document.getElementById(

                "mensagemPetton"

            );

        const informacao =

            document.getElementById(

                "informacaoPetton"

            );

        const especie =

            obterEspeciePet(dados);

        const fase =

            obterFasePet(dados);

        const imagemFinal =

            obterImagemPetton(dados);

        if (imagem) {

            const urlFinal =

                new URL(

                    imagemFinal,

                    document.baseURI

                ).href;

            if (

                imagem.src !== urlFinal

            ) {

                imagem.style.opacity = "0";

                setTimeout(() => {

                    imagem.src =

                        imagemFinal;

                    imagem.onload = () => {

                        imagem.style.opacity = "1";

                    };

                    imagem.onerror = () => {

                        imagem.style.opacity = "1";

                    };

                }, 80);

            }

            imagem.alt =

                "Petton " +

                especie +

                " " +

                fase;

        }

        if (mensagem) {

            if (dados.nome) {

                mensagem.textContent =

                    dados.nome +

                    " está no quarto 🐾";

            } else {

                mensagem.textContent =

                    "Seu Petton está no quarto 🐾";

            }

        }

        if (informacao) {

            let texto =

                "🐾 " +

                especie +

                " • " +

                fase;

            if (

                Number.isFinite(

                    Number(dados.idadeDias)

                )

            ) {

                texto +=

                    " • " +

                    Math.floor(

                        Number(dados.idadeDias)

                    ) +

                    " dias";

            }

            informacao.textContent =

                texto;

        }

        atualizarItens();

    } catch (erro) {

        console.error(

            "Erro ao atualizar quarto:",

            erro

        );

    }

}

/* =========================================================

   ITENS COMPRADOS

========================================================= */

function obterInventario() {

    try {

        const salvo =

            localStorage.getItem(

                CHAVE_LOJA

            );

        if (!salvo) return [];

        const dados =

            JSON.parse(salvo);

        /*

           Aceita tanto array direto

           quanto objeto com inventario.

        */

        if (Array.isArray(dados)) {

            return dados;

        }

        if (

            dados &&

            Array.isArray(dados.inventario)

        ) {

            return dados.inventario;

        }

        return [];

    } catch (erro) {

        console.error(

            "Erro no inventário:",

            erro

        );

        return [];

    }

}

/* =========================================================

   MOSTRAR ITENS

========================================================= */

function atualizarItens() {

    const area =

        document.getElementById(

            "itensQuarto"

        );

    if (!area) return;

    const inventario =

        obterInventario();

    area.innerHTML = "";

    if (!inventario.length) {

        area.innerHTML = `

            <div class="item">

                <div class="item-emoji">🛏️</div>

                <div>Quarto básico</div>

            </div>

        `;

        return;

    }

    const contagem = {};

    inventario.forEach(id => {

        contagem[id] =

            (contagem[id] || 0) + 1;

    });

    Object.keys(contagem).forEach(id => {

        const produto =

            PRODUTOS[id];

        if (!produto) return;

        const item =

            document.createElement("div");

        item.className =

            "item";

        item.innerHTML = `

            <div class="item-emoji">

                ${produto.emoji}

            </div>

            <div>

                ${produto.nome}

            </div>

        `;

        area.appendChild(item);

    });

}

/* =========================================================

   NAVEGAÇÃO

========================================================= */

function abrirLoja() {

    const destino =

        new URL(

            "./loja.html",

            document.baseURI

        ).href;

    try {

        if (

            typeof liff !== "undefined" &&

            typeof liff.openWindow === "function" &&

            liff.isInClient()

        ) {

            liff.openWindow({

                url: destino,

                external: false

            });

            return;

        }

    } catch (erro) {

        console.error(

            "Erro LIFF ao abrir loja:",

            erro

        );

    }

    window.location.assign(destino);

}

function voltarInicio() {

    const destino =

        new URL(

            "./index.html",

            document.baseURI

        ).href;

    try {

        if (

            typeof liff !== "undefined" &&

            typeof liff.openWindow === "function" &&

            liff.isInClient()

        ) {

            liff.openWindow({

                url: destino,

                external: false

            });

            return;

        }

    } catch (erro) {

        console.error(

            "Erro LIFF ao voltar:",

            erro

        );

    }

    window.location.assign(destino);

}

/* =========================================================

   LIFF

========================================================= */

async function iniciarQuarto() {

    const bloqueio =

        document.getElementById(

            "bloqueioLine"

        );

    const conteudo =

        document.getElementById(

            "conteudoQuarto"

        );

    try {

        if (

            typeof liff === "undefined"

        ) {

            throw new Error(

                "LIFF não carregou."

            );

        }

        /*

           IMPORTANTE:

           Inicializa o mesmo LIFF usado

           pelo index.html.

        */

        await liff.init({

            liffId: LIFF_ID

        });

        /*

           O Quarto foi aberto pelo LINE.

           Mostra o jogo.

        */

        if (liff.isInClient()) {

            if (bloqueio) {

                bloqueio.style.display = "none";

            }

            if (conteudo) {

                conteudo.style.display = "block";

            }

            atualizarPetton();

            return;

        }

        /*

           Fora do LINE.

        */

        if (bloqueio) {

            bloqueio.style.display = "flex";

        }

        if (conteudo) {

            conteudo.style.display = "none";

        }

    } catch (erro) {

        console.error(

            "Erro ao inicializar Quarto:",

            erro

        );

        /*

           Se o Quarto foi aberto por

           navegação interna do LINE e o

           isInClient falhar, tentamos

           manter a página funcionando.

        */

        try {

            if (

                typeof liff !== "undefined" &&

                typeof liff.isInClient === "function" &&

                liff.isInClient()

            ) {

                if (bloqueio) {

                    bloqueio.style.display = "none";

                }

                if (conteudo) {

                    conteudo.style.display = "block";

                }

                atualizarPetton();

                return;

            }

        } catch (erro2) {

            console.error(

                "Segunda tentativa LIFF:",

                erro2

            );

        }

        if (bloqueio) {

            bloqueio.style.display = "flex";

        }

        if (conteudo) {

            conteudo.style.display = "none";

        }

    }

}

/* =========================================================

   INICIALIZAÇÃO

========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        iniciarQuarto();

        setTimeout(

            atualizarPetton,

            800

        );

        setInterval(

            atualizarPetton,

            1000

        );

    }

);

</script>

</body>

</html>

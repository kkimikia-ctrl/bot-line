* {

}

body {

}

header {

    padding: 18px 16px 12px;

}

header h1 {

    margin: 0;

    font-size: 28px;

}

header p {

    margin: 6px 0 0;

    font-size: 14px;

    opacity: .75;

}

.saldo {

    margin: 12px 16px 18px;

    background: white;

    border-radius: 18px;

    padding: 15px;

    text-align: center;

    box-shadow: 0 4px 15px rgba(0,0,0,.08);

    font-size: 20px;

    font-weight: 800;

}

#saldoPontos {

}

.secao-titulo {

    font-size: 21px;

}

.loja {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 14px;

    padding: 0 14px 30px;

}

.produto {

    background: white;

    border-radius: 20px;

    padding: 14px;

    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,.08);

    position: relative;

    overflow: hidden;

}

/* =========================================================

   IMAGENS DOS NOVOS ACESSÓRIOS

========================================================= */

.imagem-acessorio {

    height: 115px;

    margin-bottom: 6px;

}

.imagem-acessorio img {

    width: 105px;

    height: 105px;

    object-fit: contain;

    display: block;

}

/* =========================================================

========================================================= */

}

.produto h3 {

}

.produto p {

    margin: 4px 0 10px;

    font-size: 13px;

    opacity: .7;

    min-height: 32px;

}

.preco {

    font-weight: 800;

    margin-bottom: 9px;

}

button {

    width: 100%;

    border: 0;

    border-radius: 13px;

    padding: 11px 8px;

    background: #ff9f43;

    color: white;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

}

button:active {

    transform: scale(.97);

}

button.comprado {

    background: #8bc34a;

}

button.equipado {

    background: #42a5f5;

}

button.desequipar {

    background: #ef5350;

}

button:disabled {

    opacity: .8;

}

.voltar {

    display: block;

    margin: 0 16px 25px;

    text-align: center;

    text-decoration: none;

    background: #6d4c41;

    color: white;

    padding: 14px;

    border-radius: 15px;

    font-weight: 800;

}

.mensagem {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform: translateX(-50%);

    background: #4b3424;

    color: white;

    padding: 13px 20px;

    border-radius: 15px;

    font-weight: 700;

    display: none;

    z-index: 999;

    white-space: nowrap;

    max-width: calc(100% - 30px);

}

@media (max-width: 360px) {

    .loja {

        gap: 10px;

        padding: 0 10px 25px;

    }

    .produto {

    }

    .produto .emoji {

    }

    .imagem-acessorio {

    }

    .imagem-acessorio img {

        height: 92px;

    }

}

/* =========================================================

   INVENTÁRIO

========================================================= */

function carregarInventario() {

    try {

        const salvo = localStorage.getItem(CHAVE_LOJA);

        if (!salvo) {

            return [];

        }

        const inventario = JSON.parse(salvo);

        return Array.isArray(inventario)

            ? inventario

            : [];

    } catch (erro) {

        console.error(

            "Erro ao carregar inventário:",

            erro

        );

        return [];

    }

}

function salvarInventario(inventario) {

    localStorage.setItem(

        CHAVE_LOJA,

        JSON.stringify(inventario)

    );

}

/* =========================================================

   PETTON

========================================================= */

function carregarDadosPetton() {

    try {

        const salvo =

            localStorage.getItem(CHAVE_PETTON);

        if (!salvo) {

            return null;

        }

        return JSON.parse(salvo);

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

        return null;

    }

}

function salvarDadosPetton(dados) {

    if (!dados) {

        return false;

    }

    localStorage.setItem(

        CHAVE_PETTON,

        JSON.stringify(dados)

    );

    return true;

}

/* =========================================================

   GARANTIR ESPAÇOS DE ACESSÓRIOS

========================================================= */

function garantirAcessorios(dados) {

    if (!dados.acessorios) {

        dados.acessorios = {};

    }

    const tipos = [

        "chapeu",

        "oculos",

        "lacinho",

        "coroa",

        "lenco",

        "corpo"

    ];

    tipos.forEach(function(tipo) {

        if (!(tipo in dados.acessorios)) {

            dados.acessorios[tipo] = null;

        }

    });

    return dados;

}

/* =========================================================

   PONTOS

========================================================= */

function obterPontos() {

    const dados =

        carregarDadosPetton();

    if (!dados) {

        return 0;

    }

    let pontos =

        Number(dados.pontos);

    if (!Number.isFinite(pontos)) {

        pontos = 0;

    }

    return Math.max(0, pontos);

}

function atualizarSaldo() {

    document.getElementById(

        "saldoPontos"

    ).textContent =

        Math.floor(obterPontos());

}

/* =========================================================

   MENSAGEM

========================================================= */

function mostrarMensagem(texto) {

    const elemento =

        document.getElementById(

            "mensagem"

        );

    elemento.textContent =

        texto;

    elemento.style.display =

        "block";

    clearTimeout(

        window.timerMensagem

    );

    window.timerMensagem =

        setTimeout(function() {

            elemento.style.display =

                "none";

        }, 2200);

}

/* =========================================================

   COMPRA

========================================================= */

function produtoComprado(id) {

    return carregarInventario()

        .includes(id);

}

/* =========================================================

   EQUIPADO

========================================================= */

function acessorioEquipado(tipo, id) {

    const dados =

        carregarDadosPetton();

    if (

        !dados ||

        !dados.acessorios

    ) {

        return false;

    }

    return dados.acessorios[tipo] === id;

}

/* =========================================================

   EQUIPAR

========================================================= */

function equiparAcessorio(tipo, id) {

    let dados =

        carregarDadosPetton();

    if (!dados) {

        mostrarMensagem(

            "Petton ainda não foi carregado."

        );

        return;

    }

    dados =

        garantirAcessorios(dados);

    dados.acessorios[tipo] =

        id;

    salvarDadosPetton(dados);

    desenharLoja();

    mostrarMensagem(

        "✨ Acessório equipado!"

    );

}

/* =========================================================

   RETIRAR

========================================================= */

function desequiparAcessorio(tipo) {

    let dados =

        carregarDadosPetton();

    if (!dados) {

        return;

    }

    dados =

        garantirAcessorios(dados);

    dados.acessorios[tipo] =

        null;

    salvarDadosPetton(dados);

    desenharLoja();

    mostrarMensagem(

        "Acessório retirado."

    );

}

/* =========================================================

   DESENHAR ACESSÓRIOS

========================================================= */

function desenharAcessorios() {

    const container =

        document.getElementById(

            "listaAcessorios"

        );

    container.innerHTML = "";

    acessorios.forEach(

        function(produto) {

            const comprado =

                produtoComprado(

                    produto.id

                );

            const equipado =

                acessorioEquipado(

                    produto.tipo,

                    produto.id

                );

            const div =

                document.createElement(

                    "div"

                );

            div.className =

                "produto";

            let botao = "";

            if (!comprado) {

                botao = `

                    <button

                        onclick="comprar('${produto.id}')"

                    >

                        Comprar

                    </button>

                `;

            } else if (equipado) {

                botao = `

                    <button

                        class="desequipar"

                        onclick="desequiparAcessorio('${produto.tipo}')"

                    >

                        ✓ Equipado — Retirar

                    </button>

                `;

            } else {

                botao = `

                    <button

                        class="equipado"

                        onclick="equiparAcessorio('${produto.tipo}', '${produto.id}')"

                    >

                        Equipar

                    </button>

                `;

            }

            div.innerHTML = `

                <div class="imagem-acessorio">

                    <img

                        src="${PASTA_ACESSORIOS}${produto.imagem}"

                        alt="${produto.nome}"

                        loading="lazy"

                    >

                </div>

                <h3>

                    ${produto.nome}

                </h3>

                <p>

                    ${produto.descricao}

                </p>

                <div class="preco">

                    ⭐ ${produto.preco} pontos

                </div>

                ${botao}

            `;

            container.appendChild(div);

        }

    );

}

   DESENHAR ITENS DO QUARTO

========================================================= */

function desenharQuartoItens() {

        );

                );

                );

                "produto";

            div.innerHTML = `

                <div class="emoji">

                    ${produto.emoji}

                </div>

                <h3>

                    ${produto.nome}

                </h3>

                <p>

                    ${produto.descricao}

                </p>

                <div class="preco">

                    ⭐ ${produto.preco} pontos

                </div>

                <button

                    ${comprado ? "disabled" : ""}

                    class="${comprado ? "comprado" : ""}"

                    onclick="comprar('${produto.id}')"

                >

                    ${

                        comprado

                            ? "✓ Comprado"

                            : "Comprar"

                    }

                </button>

            `;

            container.appendChild(div);

        }

    );

}

/* =========================================================

   DESENHAR LOJA

========================================================= */

function desenharLoja() {

    atualizarSaldo();

    desenharAcessorios();

    desenharQuartoItens();

}

/* =========================================================

   COMPRAR

========================================================= */

function comprar(id) {

    let produto =

        acessorios.find(

            function(item) {

                return item.id === id;

            }

        );

    if (!produto) {

        produto =

            produtos.find(

                function(item) {

                    return item.id === id;

                }

            );

    }

    if (!produto) {

        mostrarMensagem(

            "Produto não encontrado."

        );

        return;

    }

    const inventario =

        carregarInventario();

    if (

        inventario.includes(

            produto.id

        )

    ) {

        mostrarMensagem(

            "Você já tem esse item!"

        );

        return;

    }

    let dados =

        carregarDadosPetton();

    if (!dados) {

        mostrarMensagem(

            "Petton ainda não foi carregado."

        );

        return;

    }

    let pontos =

        Number(dados.pontos);

    if (!Number.isFinite(pontos)) {

        pontos = 0;

    }

    if (

        pontos <

        produto.preco

    ) {

        mostrarMensagem(

            "Você precisa de mais pontos!"

        );

        return;

    }

    dados.pontos =

        pontos -

        produto.preco;

    if (

        !salvarDadosPetton(

            dados

        )

    ) {

        mostrarMensagem(

            "Erro ao salvar a compra."

        );

        return;

    }

    inventario.push(

        produto.id

    );

    salvarInventario(

        inventario

    );

    desenharLoja();

    mostrarMensagem(

        "🎉 " +

        produto.nome +

        " comprado!"

    );

}

/* =========================================================

========================================================= */

    }

========================================================= */

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Petton 🐾</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family: Arial, sans-serif;

    background: #f5f5f5;

}

body {

    overflow-x: hidden;

}

header {

    position: sticky;

    top: 0;

    z-index: 1000;

    height: 58px;

    background: #ffffff;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 14px;

}

header h1 {

    margin: 0;

    font-size: 20px;

    color: #333;

}

.btn-voltar {

    border: none;

    background: #f0f0f0;

    border-radius: 12px;

    padding: 9px 13px;

    font-size: 14px;

    cursor: pointer;

}

main {

    width: 100%;

    max-width: 700px;

    margin: auto;

    padding-bottom: 160px;

}

/* =========================

   QUARTO

========================= */

#quarto {

    position: relative;

    width: 100%;

    height: 430px;

    overflow: hidden;

    background:

        linear-gradient(

            to bottom,

            #dff5ff 0%,

            #dff5ff 68%,

            #e8c99d 68%,

            #e8c99d 100%

        );

    border-bottom: 2px solid #d3b384;

}

/* janela decorativa */

.janela {

    position: absolute;

    top: 30px;

    left: 20px;

    width: 105px;

    height: 90px;

    background: #bfe9ff;

    border: 8px solid #fff;

    border-radius: 10px;

    box-shadow: 0 2px 8px rgba(0,0,0,.12);

    pointer-events: none;

}

.janela::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 0;

    bottom: 0;

    width: 4px;

    background: #fff;

    transform: translateX(-50%);

}

.janela::after {

    content: "";

    position: absolute;

    top: 50%;

    left: 0;

    right: 0;

    height: 4px;

    background: #fff;

    transform: translateY(-50%);

}

/* =========================

   PET

========================= */

#pet-container {

    position: absolute;

    left: 50%;

    bottom: 92px;

    transform: translateX(-50%);

    width: 220px;

    height: 240px;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;

}

#pet {

    position: relative;

    width: 180px;

    max-width: 180px;

    max-height: 210px;

    object-fit: contain;

    display: block;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;

}

/* =========================

   ACESSÓRIOS

========================= */

.acessorio {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:

        translate(-50%, -50%)

        translate(

            var(--x, 0px),

            var(--y, 0px)

        )

        rotate(var(--rot, 0deg))

        scale(var(--scale, 1));

    transform-origin: center center;

    z-index: 20;

    pointer-events: none;

    user-select: none;

    white-space: nowrap;

    font-size: 58px;

    line-height: 1;

}

.acessorio img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    pointer-events: none;

}

.acessorio.chapeu {

    font-size: 58px;

}

.acessorio.oculos {

    font-size: 50px;

}

.acessorio.lacinho {

    font-size: 48px;

}

.acessorio.coroa {

    font-size: 52px;

}

.acessorio.lenco {

    font-size: 48px;

}

.acessorio.corpo {

    font-size: 48px;

}

/* =========================

   OBJETOS DO QUARTO

========================= */

.objeto-quarto {

    position: absolute;

    z-index: 5;

    pointer-events: none;

    user-select: none;

    font-size: 55px;

    line-height: 1;

}

.cama {

    left: 12px;

    bottom: 22px;

}

.bola {

    right: 30px;

    bottom: 70px;

}

.planta {

    right: 15px;

    top: 30px;

}

.pote {

    left: 35px;

    bottom: 45px;

}

.tapete {

    left: 50%;

    bottom: 8px;

    transform: translateX(-50%);

    font-size: 100px;

}

/* =========================

   INFO

========================= */

.info {

    background: #fff;

    margin: 12px;

    padding: 14px;

    border-radius: 16px;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);

}

.info h2 {

    margin: 0 0 5px;

    font-size: 19px;

}

.info p {

    margin: 4px 0;

    color: #666;

    font-size: 14px;

}

/* =========================

   PAINEL DE AJUSTE

========================= */

#painel-ajuste {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 2000;

    background: #ffffff;

    border-top: 1px solid #ddd;

    box-shadow: 0 -4px 15px rgba(0,0,0,.12);

    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));

}

.ajuste-titulo {

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 7px;

}

#seletor-acessorio {

    width: 100%;

    height: 42px;

    border: 1px solid #ccc;

    border-radius: 10px;

    background: #fff;

    padding: 0 10px;

    font-size: 15px;

    margin-bottom: 8px;

}

.controles {

    display: grid;

    grid-template-columns: repeat(5, 1fr);

    gap: 6px;

}

.controles button {

    border: none;

    border-radius: 9px;

    background: #f0f0f0;

    min-height: 38px;

    font-size: 17px;

    cursor: pointer;

}

.controles button:active {

    transform: scale(.96);

}

.btn-salvar {

    width: 100%;

    margin-top: 8px;

    height: 42px;

    border: none;

    border-radius: 10px;

    background: #222;

    color: #fff;

    font-size: 15px;

    font-weight: bold;

}

.status-ajuste {

    text-align: center;

    font-size: 12px;

    color: #777;

    min-height: 16px;

    margin-top: 5px;

}

</style>

</head>

<body>

<header>

    <button class="btn-voltar" onclick="voltar()">← Voltar</button>

    <h1>🏠 Quarto</h1>

    <div style="width:72px;"></div>

</header>

<main>

    <div id="quarto">

        <div class="janela"></div>

        <div id="objetos-quarto"></div>

        <div id="pet-container">

            <img id="pet" src="" alt="Petton">

            <div id="acessorio-camada"></div>

        </div>

    </div>

    <div class="info">

        <h2 id="nome-pet">Petton</h2>

        <p id="fase-pet">Carregando...</p>

        <p id="especie-pet"></p>

</main>

<!-- =========================

     PAINEL

========================= -->

<div id="painel-ajuste">

    <div class="ajuste-titulo">

    </div>

    <select id="seletor-acessorio">

        <optgroup label="🎩 Cabeça">

            <option value="chapeu_vermelho">

                🎩 Chapéu vermelho

            </option>

            <option value="chapeu_palha">

                👒 Chapéu de palha

            </option>

            <option value="coroa_dourada">

                👑 Coroa dourada

            </option>

            <option value="bone">

                🧢 Boné

            </option>

            <option value="formatura">

            </option>

            <option value="cowboy">

                🤠 Cowboy

            </option>

            <option value="festa">

                🥳 Festa

            </option>

            <option value="tiara">

                👑 Tiara

            </option>

            <option value="flores">

                🌸 Flores

            </option>

            <option value="orelhas_gato">

                🐱 Orelhas de gato

            </option>

            <option value="orelhas_coelho">

                🐰 Orelhas de coelho

            </option>

        </optgroup>

        <optgroup label="👓 Rosto">

            <option value="oculos_redondo">

                👓 Óculos redondo

            </option>

            <option value="oculos_sol">

                🕶️ Óculos de sol

            </option>

            <option value="oculos_estrela">

                ⭐ Óculos estrela

            </option>

            <option value="oculos_engracado">

                🤪 Óculos engraçado

            </option>

        </optgroup>

        <optgroup label="🎀 Lacinho">

            <option value="lacinho_rosa">

                🎀 Lacinho rosa

            </option>

            <option value="lacinho_azul">

                🎀 Lacinho azul

            </option>

        </optgroup>

        <optgroup label="🧣 Pescoço">

            <option value="lenco_azul">

                🧣 Lenço azul

            </option>

            <option value="lenco_vermelho">

                🧣 Lenço vermelho

            </option>

            <option value="gravata">

                👔 Gravata

            </option>

        </optgroup>

        <optgroup label="🪽 Corpo">

            <option value="asas_borboleta">

                🦋 Asas de borboleta

            </option>

            <option value="mochila">

            </option>

            <option value="asinhas">

                🪽 Asinhas

            </option>

        </optgroup>

    </select>

    <div class="controles">

        <button onclick="mover(-5,0)">←</button>

        <button onclick="mover(5,0)">→</button>

        <button onclick="mover(0,-5)">↑</button>

        <button onclick="mover(0,5)">↓</button>

        <button onclick="aumentar()">＋</button>

    </div>

    <div class="controles" style="margin-top:6px;">

        <button onclick="diminuir()">－</button>

        <button onclick="girar(-5)">↶</button>

        <button onclick="girar(5)">↷</button>

        <button onclick="centralizar()">🎯</button>

        <button onclick="salvarAjuste()">💾</button>

    </div>

    <button class="btn-salvar" onclick="salvarAjuste()">

        💾 Salvar posição

    </button>

    <div id="status-ajuste" class="status-ajuste"></div>

</div>

<script src="petton.js"></script>

<script>

/* =========================================================

   CHAVES

========================================================= */

const CHAVE_AJUSTES_V2 =

    "petton_acessorios_posicoes_v2";

const CHAVE_AJUSTES_V3 =

    "petton_acessorios_posicoes_v3";

const CHAVE_MIGRACAO =

    "petton_acessorios_migrado_v2_v3";

/* =========================================================

   CATÁLOGO

========================================================= */

const ACESSORIOS = {

    chapeu_vermelho: {

        tipo: "chapeu",

        nome: "Chapéu vermelho",

        emoji: "🎩"

    },

    chapeu_palha: {

        tipo: "chapeu",

        nome: "Chapéu de palha",

        emoji: "👒"

    },

    oculos_redondo: {

        tipo: "oculos",

        nome: "Óculos redondo",

        emoji: "👓"

    },

    oculos_sol: {

        tipo: "oculos",

        nome: "Óculos de sol",

        emoji: "🕶️"

    },

    lacinho_rosa: {

        tipo: "lacinho",

        nome: "Lacinho rosa",

        emoji: "🎀"

    },

    lacinho_azul: {

        tipo: "lacinho",

        nome: "Lacinho azul",

        emoji: "🎀"

    },

    coroa_dourada: {

        tipo: "coroa",

        nome: "Coroa dourada",

        emoji: "👑"

    },

    lenco_azul: {

        tipo: "lenco",

        nome: "Lenço azul",

        emoji: "🧣"

    },

    lenco_vermelho: {

        tipo: "lenco",

        nome: "Lenço vermelho",

        emoji: "🧣"

    },

    bone: {

        tipo: "chapeu",

        nome: "Boné",

        emoji: "🧢"

    },

    formatura: {

        tipo: "chapeu",

        nome: "Formatura",

        emoji: "🎓"

    },

    cowboy: {

        tipo: "chapeu",

        nome: "Cowboy",

        emoji: "🤠"

    },

    festa: {

        tipo: "chapeu",

        nome: "Festa",

        emoji: "🥳"

    },

    tiara: {

        tipo: "coroa",

        nome: "Tiara",

        emoji: "👑"

    },

    flores: {

        tipo: "coroa",

        nome: "Flores",

        emoji: "🌸"

    },

    oculos_estrela: {

        tipo: "oculos",

        nome: "Óculos estrela",

        emoji: "⭐"

    },

    oculos_engracado: {

        tipo: "oculos",

        nome: "Óculos engraçado",

        emoji: "🤪"

    },

    orelhas_gato: {

        tipo: "chapeu",

        nome: "Orelhas de gato",

        emoji: "🐱"

    },

    orelhas_coelho: {

        tipo: "chapeu",

        nome: "Orelhas de coelho",

        emoji: "🐰"

    },

    asas_borboleta: {

        tipo: "corpo",

        nome: "Asas de borboleta",

        emoji: "🦋"

    },

    gravata: {

        tipo: "lenco",

        nome: "Gravata",

        emoji: "👔"

    },

    mochila: {

        tipo: "corpo",

        nome: "Mochila",

        emoji: "🎒"

    },

    asinhas: {

        tipo: "corpo",

        nome: "Asinhas",

        emoji: "🪽"

    }

};

/* =========================================================

   GRUPOS DE MIGRAÇÃO

========================================================= */

const TIPOS_MIGRACAO = {

    chapeu: [

        "chapeu_vermelho",

        "chapeu_palha",

        "bone",

        "formatura",

        "cowboy",

        "festa",

        "orelhas_gato",

        "orelhas_coelho"

    ],

    oculos: [

        "oculos_redondo",

        "oculos_sol",

        "oculos_estrela",

        "oculos_engracado"

    ],

    lacinho: [

        "lacinho_rosa",

        "lacinho_azul"

    ],

    coroa: [

        "coroa_dourada",

        "tiara",

        "flores"

    ],

    lenco: [

        "lenco_azul",

        "lenco_vermelho",

        "gravata"

    ],

    corpo: [

        "asas_borboleta",

        "mochila",

        "asinhas"

    ]

};

/* =========================================================

   DADOS DO PET

========================================================= */

let dados = null;

let especie = "gato";

let fase = "bebe";

/* =========================================================

   NORMALIZA ESPÉCIE

========================================================= */

function normalizarEspecie(valor) {

    if (!valor) {

        return "gato";

    }

    valor = String(valor).toLowerCase();

    if (

        valor.includes("coelho") ||

        valor.includes("rabbit")

    ) {

        return "coelho";

    }

    if (

        valor.includes("cachorro") ||

        valor.includes("cão") ||

        valor.includes("cao") ||

        valor.includes("dog")

    ) {

        return "cachorro";

    }

    return "gato";

}

/* =========================================================

   OBTÉM DADOS

========================================================= */

function carregarDados() {

    try {

        if (

            window.Petton &&

            typeof Petton.carregar === "function"

        ) {

            dados = Petton.carregar();

        } else {

            const salvo =

                localStorage.getItem("petton_dados_v3");

            dados = salvo

                ? JSON.parse(salvo)

                : null;

        }

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

        dados = null;

    }

    if (!dados) {

        dados = {

            nome: "Petton",

            especie: "gato",

            fase: "bebe",

            acessorios: {}

        };

    }

    especie =

        normalizarEspecie(

            dados.especie ||

            dados.identidadeVisual?.especie

        );

    fase =

        dados.fase ||

        "bebe";

    if (

        window.Petton &&

        typeof Petton.descobrirFase === "function" &&

        dados.dataNascimento

    ) {

        try {

            const nascimento =

                new Date(dados.dataNascimento);

            const agora = new Date();

            const dias =

                Math.max(

                    0,

                    (agora - nascimento) /

                    86400000

                );

            fase =

                Petton.descobrirFase(dias) ||

                fase;

        } catch (e) {}

    }

}

/* =========================================================

   MIGRAÇÃO V2 → V3

========================================================= */

function migrarAjustesAntigos() {

    try {

        const jaMigrado =

            localStorage.getItem(

                CHAVE_MIGRACAO

            );

        const antigoTexto =

            localStorage.getItem(

                CHAVE_AJUSTES_V2

            );

        if (!antigoTexto) {

            localStorage.setItem(

                CHAVE_MIGRACAO,

                "1"

            );

            return;

        }

        let antigo;

        try {

            antigo =

                JSON.parse(antigoTexto);

        } catch (erro) {

            console.error(

                "Não foi possível ler ajustes v2:",

                erro

            );

            return;

        }

        if (

            !antigo ||

            typeof antigo !== "object"

        ) {

            return;

        }

        let novo = {};

        const novoTexto =

            localStorage.getItem(

                CHAVE_AJUSTES_V3

            );

        if (novoTexto) {

            try {

                novo =

                    JSON.parse(novoTexto) || {};

            } catch (erro) {

                novo = {};

            }

        }

        /*

         * O V2 salvava assim:

         *

         * gato_bebe_chapeu

         * gato_bebe_oculos

         *

         * O V3 salva pelo ID:

         *

         * gato_bebe_chapeu_vermelho

         * gato_bebe_chapeu_palha

         *

         * Como o V2 não sabia qual acessório específico

         * estava sendo usado, copiamos a posição antiga

         * para todos os acessórios daquele mesmo tipo.

         */

        Object.keys(antigo).forEach(

            chaveAntiga => {

                const partes =

                    chaveAntiga.split("_");

                if (partes.length < 3) {

                    return;

                }

                const tipo =

                    partes[partes.length - 1];

                if (

                    !TIPOS_MIGRACAO[tipo]

                ) {

                    return;

                }

                const especieAntiga =

                    partes[0];

                const faseAntiga =

                    partes.slice(

                        1,

                        -1

                    ).join("_");

                const ajuste =

                    antigo[chaveAntiga];

                if (

                    !ajuste ||

                    typeof ajuste !== "object"

                ) {

                    return;

                }

                TIPOS_MIGRACAO[tipo].forEach(

                    acessorioId => {

                        const chaveNova =

                            especieAntiga +

                            "_" +

                            faseAntiga +

                            "_" +

                            acessorioId;

                        /*

                         * Não sobrescreve aquilo que

                         * já foi configurado no V3.

                         */

                        if (

                            novo[chaveNova] === undefined

                        ) {

                            novo[chaveNova] = {

                                x: Number(

                                    ajuste.x ?? 0

                                ),

                                y: Number(

                                    ajuste.y ?? 0

                                ),

                                scale: Number(

                                    ajuste.scale ?? 1

                                ),

                                rot: Number(

                                    ajuste.rot ?? 0

                                )

                            };

                        }

                    }

                );

            }

        );

        localStorage.setItem(

            CHAVE_AJUSTES_V3,

            JSON.stringify(novo)

        );

        /*

         * Marca somente depois de concluir.

         * O V2 continua intacto.

         */

        localStorage.setItem(

            CHAVE_MIGRACAO,

            "1"

        );

        console.log(

            "Petton: ajustes antigos V2 migrados para V3."

        );

    } catch (erro) {

        console.error(

            "Erro na migração V2 → V3:",

            erro

        );

    }

}

/* =========================================================

   CHAVE V3

========================================================= */

function criarChaveV3(

    especieAtual,

    faseAtual,

    acessorioId

) {

    return (

        especieAtual +

        "_" +

        faseAtual +

        "_" +

        acessorioId

    );

}

/* =========================================================

   POSIÇÕES PADRÃO

========================================================= */

function obterPadrao(

    acessorioId

) {

    const produto =

        ACESSORIOS[acessorioId];

    if (!produto) {

        return {

            x: 0,

            y: 0,

            scale: 1,

            rot: 0

        };

    }

    switch (produto.tipo) {

        case "chapeu":

            return {

                x: 0,

                y: -82,

                scale: 1,

                rot: 0

            };

        case "oculos":

            return {

                x: 0,

                y: -25,

                scale: .82,

                rot: 0

            };

        case "lacinho":

            return {

                x: 72,

                y: -65,

                scale: .72,

                rot: 0

            };

        case "coroa":

            return {

                x: 0,

                y: -88,

                scale: .82,

                rot: 0

            };

        case "lenco":

            return {

                x: 0,

                y: 48,

                scale: .72,

                rot: 0

            };

        case "corpo":

            return {

                x: 0,

                y: 40,

                scale: .8,

                rot: 0

            };

        default:

            return {

                x: 0,

                y: 0,

                scale: 1,

                rot: 0

            };

    }

}

/* =========================================================

   AJUSTE ESPECÍFICO

========================================================= */

function obterAjuste(

    acessorioId

) {

    const chave =

        criarChaveV3(

            especie,

            fase,

            acessorioId

        );

    let dadosAjustes = {};

    try {

        dadosAjustes =

            JSON.parse(

                localStorage.getItem(

                    CHAVE_AJUSTES_V3

                ) || "{}"

            );

    } catch (erro) {

        dadosAjustes = {};

    }

    if (

        dadosAjustes[chave]

    ) {

        return {

            ...obterPadrao(acessorioId),

            ...dadosAjustes[chave]

        };

    }

    return obterPadrao(

        acessorioId

    );

}

/* =========================================================

   IMAGEM DO PET

========================================================= */

function obterImagemPet() {

    /*

     * Primeiro tenta usar a imagem definida

     * pelo próprio Petton.

     */

    if (

        window.Petton &&

        typeof Petton.obterImagemFase === "function"

    ) {

        try {

            const imagem =

                Petton.obterImagemFase(fase);

            if (imagem) {

                return imagem;

            }

        } catch (e) {}

    }

    /*

     * Depois usa a identidade visual.

     */

    if (

        dados &&

        dados.imagens &&

        dados.imagens[fase]

    ) {

        return dados.imagens[fase];

    }

    if (

        dados &&

        dados.imagemFases &&

        dados.imagemFases[fase]

    ) {

        return dados.imagemFases[fase];

    }

    /*

     * Fallback pela espécie.

     */

    if (especie === "cachorro") {

        return "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png";

    }

    if (especie === "coelho") {

        return "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

    }

    return "petton-original.png";

}

/* =========================================================

   MOSTRAR PET

========================================================= */

function mostrarPet() {

    const img =

        document.getElementById(

            "pet"

        );

    img.src =

        obterImagemPet();

    img.alt =

        dados.nome ||

        "Petton";

    document.getElementById(

        "nome-pet"

    ).textContent =

        dados.nome ||

        "Petton";

    document.getElementById(

        "fase-pet"

    ).textContent =

        "Fase: " +

        fase;

    document.getElementById(

        "especie-pet"

    ).textContent =

        "Espécie: " +

        especie;

}

/* =========================================================

   ACESSÓRIO EQUIPADO

========================================================= */

function obterEquipados() {

    if (

        !dados ||

        !dados.acessorios

    ) {

        return [];

    }

    const resultado = [];

    Object.keys(

        dados.acessorios

    ).forEach(

        tipo => {

            const id =

                dados.acessorios[tipo];

            if (

                id &&

                ACESSORIOS[id]

            ) {

                resultado.push(id);

            }

        }

    );

    return resultado;

}

/* =========================================================

   DESENHAR ACESSÓRIOS

========================================================= */

function desenharAcessorios() {

    const camada =

        document.getElementById(

            "acessorio-camada"

        );

    camada.innerHTML = "";

    const equipados =

        obterEquipados();

    equipados.forEach(

        id => {

            const produto =

                ACESSORIOS[id];

            if (!produto) {

                return;

            }

            const elemento =

                document.createElement(

                    "div"

                );

            elemento.className =

                "acessorio " +

                produto.tipo;

            elemento.dataset.id =

                id;

            elemento.textContent =

                produto.emoji;

            const ajuste =

                obterAjuste(id);

            elemento.style.setProperty(

                "--x",

                ajuste.x + "px"

            );

            elemento.style.setProperty(

                "--y",

                ajuste.y + "px"

            );

            elemento.style.setProperty(

                "--scale",

                ajuste.scale

            );

            elemento.style.setProperty(

                "--rot",

                ajuste.rot + "deg"

            );

            /*

             * Pequenos ajustes especiais

             * para encaixar melhor cada tipo.

             */

            if (

                produto.tipo === "oculos"

            ) {

                elemento.style.zIndex = "30";

            } else if (

                produto.tipo === "chapeu" ||

                produto.tipo === "coroa" ||

                produto.tipo === "lacinho"

            ) {

                elemento.style.zIndex = "40";

            } else {

                elemento.style.zIndex = "20";

            }

            camada.appendChild(

                elemento

            );

        }

    );

}

/* =========================================================

   OBJETOS DO QUARTO

========================================================= */

function desenharObjetos() {

    const container =

        document.getElementById(

            "objetos-quarto"

        );

    container.innerHTML = "";

    let inventario = {};

    try {

        inventario =

            JSON.parse(

                localStorage.getItem(

                    "petton_loja_v1"

                ) || "{}"

            );

    } catch (e) {

        inventario = {};

    }

    /*

     * Os objetos ficam decorativos.

     * O jogador não arrasta nem altera posição.

     */

    const itens =

        inventario.itens ||

        inventario.inventario ||

        [];

    if (

        Array.isArray(itens)

    ) {

        itens.forEach(

            item => {

                const id =

                    typeof item === "string"

                        ? item

                        : item.id;

                if (!id) {

                    return;

                }

                let emoji = "";

                switch (id) {

                    case "cama_basica":

                        emoji = "🛏️";

                        break;

                    case "cama_rosa":

                        emoji = "🛏️";

                        break;

                    case "cama_casinha":

                        emoji = "🏠";

                        break;

                    case "bola":

                        emoji = "⚽";

                        break;

                    case "bolinha":

                        emoji = "🔴";

                        break;

                    case "ratinho":

                        emoji = "🐭";

                        break;

                    case "arranhador":

                        emoji = "🪵";

                        break;

                    case "pelucia":

                        emoji = "🧸";

                        break;

                    case "pote":

                        emoji = "🥣";

                        break;

                    case "pote_agua":

                        emoji = "💧";

                        break;

                    case "planta":

                        emoji = "🪴";

                        break;

                    case "flor":

                        emoji = "🌸";

                        break;

                    case "tapete":

                        emoji = "🟫";

                        break;

                    case "abajur":

                        emoji = "💡";

                        break;

                    case "quadro":

                        emoji = "🖼️";

                        break;

                }

                if (!emoji) {

                    return;

                }

                const elemento =

                    document.createElement(

                        "div"

                    );

                elemento.className =

                    "objeto-quarto";

                elemento.textContent =

                    emoji;

                if (

                    id.includes("cama")

                ) {

                    elemento.classList.add(

                        "cama"

                    );

                } else if (

                    id.includes("bola") ||

                    id === "bolinha"

                ) {

                    elemento.classList.add(

                        "bola"

                    );

                } else if (

                    id === "planta"

                ) {

                    elemento.classList.add(

                        "planta"

                    );

                } else if (

                    id === "pote" ||

                    id === "pote_agua"

                ) {

                    elemento.classList.add(

                        "pote"

                    );

                } else if (

                    id === "tapete"

                ) {

                    elemento.classList.add(

                        "tapete"

                    );

                }

                container.appendChild(

                    elemento

                );

            }

        );

    }

}

/* =========================================================

   ACESSÓRIO SELECIONADO

========================================================= */

function obterSelecionado() {

    return document.getElementById(

        "seletor-acessorio"

    ).value;

}

/* =========================================================

   ELEMENTO SELECIONADO

========================================================= */

function obterElementoSelecionado() {

    const id =

        obterSelecionado();

    return document.querySelector(

        '[data-id="' +

        id +

        '"]'

    );

}

/* =========================================================

   ALTERAR POSIÇÃO

========================================================= */

function alterarAjuste(

    id,

    mudancas

) {

    let ajustes = {};

    try {

        ajustes =

            JSON.parse(

                localStorage.getItem(

                    CHAVE_AJUSTES_V3

                ) || "{}"

            );

    } catch (e) {

        ajustes = {};

    }

    const chave =

        criarChaveV3(

            especie,

            fase,

            id

        );

    ajustes[chave] = {

        ...obterAjuste(id),

        ...mudancas

    };

    localStorage.setItem(

        CHAVE_AJUSTES_V3,

        JSON.stringify(ajustes)

    );

}

/* =========================================================

   MOVER

========================================================= */

function mover(

    dx,

    dy

) {

    const id =

        obterSelecionado();

    const ajuste =

        obterAjuste(id);

    ajuste.x += dx;

    ajuste.y += dy;

    alterarAjuste(

        id,

        ajuste

    );

    desenharAcessorios();

    mostrarStatus(

        "Posição alterada"

    );

}

/* =========================================================

   AUMENTAR

========================================================= */

function aumentar() {

    const id =

        obterSelecionado();

    const ajuste =

        obterAjuste(id);

    ajuste.scale =

        Math.min(

            3,

            ajuste.scale + .05

        );

    alterarAjuste(

        id,

        ajuste

    );

    desenharAcessorios();

    mostrarStatus(

        "Tamanho aumentado"

    );

}

/* =========================================================

   DIMINUIR

========================================================= */

function diminuir() {

    const id =

        obterSelecionado();

    const ajuste =

        obterAjuste(id);

    ajuste.scale =

        Math.max(

            .2,

            ajuste.scale - .05

        );

    alterarAjuste(

        id,

        ajuste

    );

    desenharAcessorios();

    mostrarStatus(

        "Tamanho diminuído"

    );

}

/* =========================================================

   GIRAR

========================================================= */

function girar(

    graus

) {

    const id =

        obterSelecionado();

    const ajuste =

        obterAjuste(id);

    ajuste.rot += graus;

    alterarAjuste(

        id,

        ajuste

    );

    desenharAcessorios();

    mostrarStatus(

        "Rotação alterada"

    );

}

/* =========================================================

   CENTRALIZAR

========================================================= */

function centralizar() {

    const id =

        obterSelecionado();

    const ajuste =

        obterAjuste(id);

    const padrao =

        obterPadrao(id);

    ajuste.x =

        padrao.x;

    ajuste.y =

        padrao.y;

    ajuste.scale =

        padrao.scale;

    ajuste.rot =

        padrao.rot;

    alterarAjuste(

        id,

        ajuste

    );

    desenharAcessorios();

    mostrarStatus(

        "Voltou para a posição padrão"

    );

}

/* =========================================================

   SALVAR

========================================================= */

function salvarAjuste() {

    const id =

        obterSelecionado();

    const ajuste =

        obterAjuste(id);

    alterarAjuste(

        id,

        ajuste

    );

    mostrarStatus(

        "✅ Posição salva"

    );

}

/* =========================================================

   STATUS

========================================================= */

let statusTimer = null;

function mostrarStatus(

    texto

) {

    const el =

        document.getElementById(

            "status-ajuste"

        );

    el.textContent =

        texto;

    clearTimeout(

        statusTimer

    );

    statusTimer =

        setTimeout(

            () => {

                el.textContent =

                    "";

            },

            1500

        );

}

/* =========================================================

   TROCA DE ACESSÓRIO

========================================================= */

document

    .getElementById(

        "seletor-acessorio"

    )

    .addEventListener(

        "change",

        function() {

            desenharAcessorios();

        }

    );

/* =========================================================

   VOLTAR

========================================================= */

function voltar() {

    if (

        window.history.length > 1

    ) {

        window.history.back();

        return;

    }

    window.location.href =

        "index.html";

}

/* =========================================================

   INICIALIZAÇÃO

========================================================= */

function iniciarQuarto() {

    /*

     * Primeiro carrega os dados do Petton.

     */

    carregarDados();

    /*

     * Depois importa automaticamente

     * os ajustes antigos.

     */

    migrarAjustesAntigos();

    /*

     * Só então desenha o quarto.

     */

    mostrarPet();

    desenharObjetos();

    desenharAcessorios();

    /*

     * Deixa o primeiro acessório

     * disponível no seletor.

     */

    document.getElementById(

        "seletor-acessorio"

    ).selectedIndex = 0;

}

/* =========================================================

   START

========================================================= */

if (

    document.readyState === "loading"

) {

    document.addEventListener(

        "DOMContentLoaded",

        iniciarQuarto

    );

} else {

    iniciarQuarto();

}

</script>

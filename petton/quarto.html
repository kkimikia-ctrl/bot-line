<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Petton 🏠</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="./petton.js"></script>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family: Arial, sans-serif;

    background: #f4eadf;

    color: #4a3428;

}

body {

    overflow-x: hidden;

}

/* =========================================================

   CABEÇALHO

========================================================= */

.header {

    width: 100%;

    background: #ffffff;

    padding: 14px 16px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);

    position: relative;

    z-index: 20;

}

.header-title {

    font-size: 21px;

    font-weight: bold;

}

.header-buttons {

    display: flex;

    gap: 6px;

}

.header-button {

    border: none;

    background: #f2e3d5;

    border-radius: 12px;

    padding: 9px 11px;

    font-size: 13px;

    font-weight: bold;

    color: #543a2c;

}

/* =========================================================

   QUARTO

========================================================= */

.quarto {

    position: relative;

    width: 100%;

    height: calc(100vh - 67px);

    min-height: 560px;

    overflow: hidden;

    background:

        linear-gradient(

            to bottom,

            #fff7ee 0%,

            #fff7ee 64%,

            #d8b28d 64%,

            #c99d75 100%

        );

}

/* =========================================================

   PAREDE

========================================================= */

.parede {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 64%;

    background:

        linear-gradient(

            90deg,

            rgba(255,255,255,.35),

            rgba(255,255,255,0)

        );

}

/* =========================================================

   CHÃO

========================================================= */

.chao {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    height: 36%;

    background:

        repeating-linear-gradient(

            90deg,

            rgba(120,80,50,.08) 0,

            rgba(120,80,50,.08) 2px,

            transparent 2px,

            transparent 80px

        ),

        linear-gradient(

            #d8b28d,

            #c5966d

        );

}

/* =========================================================

   ÁREA DO PET

========================================================= */

.pet-area {

    position: absolute;

    left: 50%;

    bottom: 105px;

    transform: translateX(-50%);

    width: 190px;

    height: 230px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    z-index: 8;

}

/* =========================================================

   IMAGEM DO PET

========================================================= */

.pet-image {

    max-width: 175px;

    max-height: 210px;

    width: auto;

    height: auto;

    object-fit: contain;

    display: block;

    filter:

        drop-shadow(0 7px 5px rgba(0,0,0,.15));

    position: relative;

    z-index: 8;

}

/* =========================================================

   CAMADA DOS ACESSÓRIOS

========================================================= */

.acessorios-pet {

    position: absolute;

    left: 50%;

    bottom: 0;

    width: 175px;

    height: 210px;

    transform: translateX(-50%);

    pointer-events: none;

    z-index: 10;

}

/* =========================================================

   ACESSÓRIO

========================================================= */

.acessorio {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;

    user-select: none;

    filter:

        drop-shadow(0 3px 2px rgba(0,0,0,.18));

    z-index: 20;

    transform-origin: center center;

}

/* =========================================================

   POSIÇÕES PADRÃO

========================================================= */

.acessorio.chapeu {

    top: 2px;

    left: 50%;

    transform:

        translateX(-50%)

        translate(var(--ajuste-x, 0px), var(--ajuste-y, 0px))

        rotate(var(--ajuste-rotacao, 0deg))

        scale(var(--ajuste-escala, 1));

    font-size: 48px;

    width: 75px;

    height: 55px;

}

.acessorio.coroa {

    top: 0;

    left: 50%;

    transform:

        translateX(-50%)

        translate(var(--ajuste-x, 0px), var(--ajuste-y, 0px))

        rotate(var(--ajuste-rotacao, 0deg))

        scale(var(--ajuste-escala, 1));

    font-size: 43px;

    width: 70px;

    height: 50px;

}

.acessorio.lacinho {

    top: 45px;

    right: 22px;

    transform:

        translate(var(--ajuste-x, 0px), var(--ajuste-y, 0px))

        rotate(-8deg)

        rotate(var(--ajuste-rotacao, 0deg))

        scale(var(--ajuste-escala, 1));

    font-size: 36px;

    width: 43px;

    height: 43px;

}

.acessorio.oculos {

    top: 92px;

    left: 50%;

    transform:

        translateX(-50%)

        translate(var(--ajuste-x, 0px), var(--ajuste-y, 0px))

        rotate(var(--ajuste-rotacao, 0deg))

        scale(var(--ajuste-escala, 1));

    width: 82px;

    height: 42px;

    font-size: 42px;

}

.acessorio.lenco {

    bottom: 25px;

    left: 50%;

    transform:

        translateX(-50%)

        translate(var(--ajuste-x, 0px), var(--ajuste-y, 0px))

        rotate(var(--ajuste-rotacao, 0deg))

        scale(var(--ajuste-escala, 1));

    width: 70px;

    height: 45px;

    font-size: 37px;

}

/* =========================================================

   SOMBRA

========================================================= */

.pet-shadow {

    position: absolute;

    bottom: 0;

    left: 50%;

    transform: translateX(-50%);

    width: 120px;

    height: 20px;

    border-radius: 50%;

    background: rgba(0,0,0,.13);

    z-index: -1;

}

/* =========================================================

   OBJETOS

========================================================= */

.objeto {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    user-select: none;

    z-index: 6;

    filter:

        drop-shadow(0 4px 3px rgba(0,0,0,.15));

}

.cama-basica {

    left: 15px;

    bottom: 90px;

    width: 120px;

    height: 70px;

    border-radius: 25px;

    background: #e8d5c2;

    border: 4px solid #c6aa91;

    font-size: 48px;

}

.cama {

    left: 16px;

    bottom: 92px;

    width: 115px;

    height: 75px;

    border-radius: 25px;

    background: #f1c8d5;

    border: 4px solid #d99aae;

    font-size: 48px;

}

.casinha {

    left: 15px;

    bottom: 90px;

    width: 125px;

    height: 105px;

    font-size: 75px;

}

.bola {

    right: 35px;

    bottom: 92px;

    width: 60px;

    height: 60px;

    font-size: 50px;

}

.bolinha {

    right: 105px;

    bottom: 82px;

    width: 45px;

    height: 45px;

    font-size: 38px;

}

.ratinho {

    left: 35px;

    bottom: 170px;

    width: 55px;

    height: 55px;

    font-size: 45px;

}

.arranhador {

    right: 20px;

    bottom: 85px;

    width: 75px;

    height: 105px;

    font-size: 68px;

}

.pelucia {

    left: 145px;

    bottom: 90px;

    width: 55px;

    height: 55px;

    font-size: 48px;

}

.pote {

    left: 25px;

    bottom: 48px;

    width: 55px;

    height: 45px;

    font-size: 40px;

}

.pote-agua {

    left: 90px;

    bottom: 48px;

    width: 55px;

    height: 45px;

    font-size: 40px;

}

.planta {

    right: 25px;

    bottom: 165px;

    width: 70px;

    height: 80px;

    font-size: 62px;

}

.flor {

    right: 110px;

    bottom: 55px;

    width: 50px;

    height: 50px;

    font-size: 42px;

}

.tapete {

    left: 50%;

    bottom: 55px;

    transform: translateX(-50%);

    width: 245px;

    height: 80px;

    border-radius: 50%;

    background:

        radial-gradient(

            ellipse,

            #d9b6d8 0%,

            #c79ac8 65%,

            #b47fb5 100%

        );

    border: 5px solid rgba(120,70,120,.2);

    z-index: 2;

}

.abajur {

    right: 18px;

    bottom: 255px;

    width: 75px;

    height: 90px;

    font-size: 60px;

}

.quadro {

    position: absolute;

    top: 45px;

    right: 25px;

    width: 82px;

    height: 82px;

    border-radius: 10px;

    background: #fff;

    border: 7px solid #8d6749;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 45px;

    box-shadow:

        0 4px 8px rgba(0,0,0,.15);

    z-index: 4;

}

/* =========================================================

   NOME

========================================================= */

.pet-name {

    position: absolute;

    left: 50%;

    bottom: 78px;

    transform: translateX(-50%);

    background: rgba(255,255,255,.9);

    padding: 6px 13px;

    border-radius: 14px;

    font-weight: bold;

    font-size: 14px;

    z-index: 12;

    box-shadow:

        0 2px 6px rgba(0,0,0,.1);

}

/* =========================================================

   QUARTO VAZIO

========================================================= */

.quarto-vazio {

    position: absolute;

    left: 50%;

    top: 48%;

    transform: translate(-50%, -50%);

    width: 250px;

    text-align: center;

    color: rgba(90,65,50,.65);

    font-size: 14px;

    z-index: 1;

}

/* =========================================================

   MODO AJUSTE

========================================================= */

.ajuste-painel {

    position: fixed;

    left: 50%;

    bottom: 12px;

    transform: translateX(-50%);

    width: calc(100% - 20px);

    max-width: 420px;

    background: rgba(255,255,255,.97);

    border-radius: 20px;

    padding: 14px;

    box-shadow:

        0 8px 30px rgba(0,0,0,.25);

    z-index: 100;

    display: none;

}

.ajuste-painel.ativo {

    display: block;

}

.ajuste-titulo {

    text-align: center;

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 10px;

}

.ajuste-info {

    text-align: center;

    font-size: 12px;

    color: #755d4d;

    margin-bottom: 10px;

}

.ajuste-select {

    width: 100%;

    border: 1px solid #d8c5b5;

    background: #fffaf5;

    border-radius: 12px;

    padding: 10px;

    font-size: 15px;

    color: #4a3428;

    margin-bottom: 10px;

}

.ajuste-botoes {

    display: grid;

    grid-template-columns:

        repeat(4, 1fr);

    gap: 7px;

    margin-bottom: 8px;

}

.ajuste-btn {

    border: none;

    border-radius: 12px;

    background: #f1e1d2;

    color: #4a3428;

    padding: 10px 5px;

    font-size: 17px;

    font-weight: bold;

}

.ajuste-btn:active {

    transform: scale(.95);

}

.ajuste-acoes {

    display: grid;

    grid-template-columns:

        1fr 1fr;

    gap: 8px;

}

.ajuste-salvar {

    border: none;

    border-radius: 12px;

    padding: 11px;

    background: #6e9b68;

    color: white;

    font-size: 14px;

    font-weight: bold;

}

.ajuste-fechar {

    border: none;

    border-radius: 12px;

    padding: 11px;

    background: #d8c0ae;

    color: #4a3428;

    font-size: 14px;

    font-weight: bold;

}

/* =========================================================

   MARCA VISUAL DO ACESSÓRIO EM AJUSTE

========================================================= */

.modo-ajuste .acessorio-selecionado {

    outline: 2px dashed #7b5b43;

    outline-offset: 4px;

    pointer-events: auto;

    cursor: move;

}

/* =========================================================

   RESPONSIVO

========================================================= */

@media (max-width: 380px) {

    .pet-area {

        bottom: 105px;

        width: 165px;

    }

    .pet-image {

        max-width: 155px;

        max-height: 190px;

    }

    .acessorios-pet {

        width: 155px;

        height: 190px;

    }

    .acessorio.lacinho {

        top: 42px;

        right: 17px;

        font-size: 34px;

    }

    .acessorio.oculos {

        top: 84px;

        font-size: 39px;

    }

    .tapete {

        width: 210px;

    }

    .cama,

    .cama-basica {

        left: 8px;

    }

    .bola {

        right: 20px;

    }

    .quadro {

        right: 15px;

    }

}

/* =========================================================

   MENSAGEM

========================================================= */

.mensagem {

    display: none;

}

</style>

</head>

<body>

<header class="header">

    <div class="header-title">

        🏠 Quarto

    </div>

    <div class="header-buttons">

        <button

            class="header-button"

            onclick="abrirLoja()">

            🛒 Loja

        </button>

        <button

            class="header-button"

            onclick="abrirModoAjuste()">

            ⚙️ Ajustar

        </button>

        <button

            class="header-button"

            onclick="voltar()">

            ← Voltar

        </button>

    </div>

</header>

<main class="quarto">

    <div class="parede"></div>

    <div class="chao"></div>

    <div

        class="mensagem"

        id="mensagem">

        Seu quarto 🐾

    </div>

    <div id="objetosComprados"></div>

    <div class="pet-area">

        <div class="pet-shadow"></div>

        <img

            id="petImagem"

            class="pet-image"

            src="./39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

            alt="Petton">

        <div

            id="acessoriosPet"

            class="acessorios-pet">

        </div>

    </div>

    <div

        id="petNome"

        class="pet-name">

        Petton

    </div>

    <div

        id="quartoVazio"

        class="quarto-vazio">

    </div>

</main>

<!-- =======================================================

     PAINEL DE AJUSTE

======================================================= -->

<div

    id="ajustePainel"

    class="ajuste-painel">

    <div class="ajuste-titulo">

        ⚙️ Ajustar acessórios

    </div>

    <div

        id="ajusteInfo"

        class="ajuste-info">

        Selecione um acessório

    </div>

    <select

        id="ajusteAcessorio"

        class="ajuste-select"

        onchange="selecionarAcessorio()">

        <option value="chapeu">

            🎩 Chapéu

        </option>

        <option value="coroa">

            👑 Coroa

        </option>

        <option value="lacinho">

            🎀 Lacinho

        </option>

        <option value="oculos">

            🕶️ Óculos

        </option>

        <option value="lenco">

            🧣 Lenço

        </option>

    </select>

    <div class="ajuste-botoes">

        <button

            class="ajuste-btn"

            onclick="moverAcessorio(0,-5)">

            ⬆️

        </button>

        <button

            class="ajuste-btn"

            onclick="moverAcessorio(-5,0)">

            ⬅️

        </button>

        <button

            class="ajuste-btn"

            onclick="moverAcessorio(5,0)">

            ➡️

        </button>

        <button

            class="ajuste-btn"

            onclick="moverAcessorio(0,5)">

            ⬇️

        </button>

    </div>

    <div class="ajuste-botoes">

        <button

            class="ajuste-btn"

            onclick="alterarTamanho(-0.05)">

            ➖

        </button>

        <button

            class="ajuste-btn"

            onclick="alterarTamanho(0.05)">

            ➕

        </button>

        <button

            class="ajuste-btn"

            onclick="girarAcessorio(-5)">

            ↶

        </button>

        <button

            class="ajuste-btn"

            onclick="girarAcessorio(5)">

            ↷

        </button>

    </div>

    <div class="ajuste-acoes">

        <button

            class="ajuste-salvar"

            onclick="salvarAjuste()">

            💾 Salvar posição

        </button>

        <button

            class="ajuste-fechar"

            onclick="fecharModoAjuste()">

            ✓ Fechar

        </button>

    </div>

</div>

<script>

/* =========================================================

   CONFIGURAÇÃO

========================================================= */

const CHAVE_LOJA =

    "petton_loja_v1";

const CHAVE_PETTON =

    "petton_dados_v3";

const CHAVE_AJUSTES =

    "petton_acessorios_posicoes_v1";

let modoAjuste = false;

let acessorioSelecionado =

    "chapeu";

let ajusteAtual = {

    x: 0,

    y: 0,

    escala: 1,

    rotacao: 0

};

/* =========================================================

   LIFF

========================================================= */

async function iniciarLIFF() {

    try {

        if (

            typeof liff !== "undefined" &&

            typeof liff.init === "function"

        ) {

            await liff.init({

                liffId:

                    "2010902449-KWNNNsxn"

            });

            console.log(

                "Petton Quarto: LIFF iniciado."

            );

        }

    } catch (erro) {

        console.error(

            "Erro ao iniciar LIFF:",

            erro

        );

    }

}

/* =========================================================

   INVENTÁRIO

========================================================= */

function obterInventario() {

    try {

        const salvo =

            localStorage.getItem(

                CHAVE_LOJA

            );

        if (!salvo) {

            return [];

        }

        const inventario =

            JSON.parse(salvo);

        if (

            !Array.isArray(inventario)

        ) {

            return [];

        }

        return inventario;

    } catch (erro) {

        console.error(

            "Erro ao ler inventário:",

            erro

        );

        return [];

    }

}

/* =========================================================

   DADOS DO PET

========================================================= */

function obterDadosPetton() {

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.carregar === "function"

        ) {

            return Petton.carregar();

        }

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

    }

    try {

        const salvo =

            localStorage.getItem(

                CHAVE_PETTON

            );

        if (!salvo) {

            return null;

        }

        return JSON.parse(salvo);

    } catch (erro) {

        console.error(

            "Erro ao ler dados do Petton:",

            erro

        );

        return null;

    }

}

/* =========================================================

   IDENTIDADE DA ESPÉCIE

========================================================= */

function obterEspecie(dados) {

    if (!dados) {

        return "coelho";

    }

    if (dados.especie) {

        return String(

            dados.especie

        ).toLowerCase();

    }

    if (

        dados.identidadeVisual &&

        dados.identidadeVisual.especie

    ) {

        return String(

            dados.identidadeVisual.especie

        ).toLowerCase();

    }

    return "coelho";

}

/* =========================================================

   FASE

========================================================= */

function obterFase(dados) {

    if (

        dados &&

        dados.fase

    ) {

        return String(

            dados.fase

        ).toLowerCase();

    }

    return "bebe";

}

/* =========================================================

   CHAVE DO AJUSTE

========================================================= */

function obterChaveAjuste() {

    const dados =

        obterDadosPetton();

    const especie =

        obterEspecie(dados);

    const fase =

        obterFase(dados);

    return (

        especie +

        "_" +

        fase +

        "_" +

        acessorioSelecionado

    );

}

/* =========================================================

   LER AJUSTES

========================================================= */

function obterTodosAjustes() {

    try {

        const salvo =

            localStorage.getItem(

                CHAVE_AJUSTES

            );

        if (!salvo) {

            return {};

        }

        const dados =

            JSON.parse(salvo);

        if (

            typeof dados !== "object" ||

            dados === null

        ) {

            return {};

        }

        return dados;

    } catch (erro) {

        console.error(

            "Erro ao ler ajustes:",

            erro

        );

        return {};

    }

}

/* =========================================================

   SALVAR TODOS AJUSTES

========================================================= */

function salvarTodosAjustes(dados) {

    try {

        localStorage.setItem(

            CHAVE_AJUSTES,

            JSON.stringify(dados)

        );

        return true;

    } catch (erro) {

        console.error(

            "Erro ao salvar ajustes:",

            erro

        );

        return false;

    }

}

/* =========================================================

   CARREGAR AJUSTE ATUAL

========================================================= */

function carregarAjusteAtual() {

    const todos =

        obterTodosAjustes();

    const chave =

        obterChaveAjuste();

    if (

        todos[chave]

    ) {

        ajusteAtual = {

            x:

                Number(

                    todos[chave].x

                ) || 0,

            y:

                Number(

                    todos[chave].y

                ) || 0,

            escala:

                Number(

                    todos[chave].escala

                ) || 1,

            rotacao:

                Number(

                    todos[chave].rotacao

                ) || 0

        };

    } else {

        ajusteAtual = {

            x: 0,

            y: 0,

            escala: 1,

            rotacao: 0

        };

    }

}

/* =========================================================

   APLICAR AJUSTE

========================================================= */

function aplicarAjuste() {

    const elementos =

        document.querySelectorAll(

            ".acessorio." +

            acessorioSelecionado

        );

    elementos.forEach(

        function(elemento) {

            elemento.style.setProperty(

                "--ajuste-x",

                ajusteAtual.x + "px"

            );

            elemento.style.setProperty(

                "--ajuste-y",

                ajusteAtual.y + "px"

            );

            elemento.style.setProperty(

                "--ajuste-escala",

                ajusteAtual.escala

            );

            elemento.style.setProperty(

                "--ajuste-rotacao",

                ajusteAtual.rotacao + "deg"

            );

        }

    );

}

/* =========================================================

   MODO AJUSTE

========================================================= */

function abrirModoAjuste() {

    modoAjuste = true;

    document.body.classList.add(

        "modo-ajuste"

    );

    const painel =

        document.getElementById(

            "ajustePainel"

        );

    painel.classList.add(

        "ativo"

    );

    selecionarAcessorio();

}

function fecharModoAjuste() {

    modoAjuste = false;

    document.body.classList.remove(

        "modo-ajuste"

    );

    const painel =

        document.getElementById(

            "ajustePainel"

        );

    painel.classList.remove(

        "ativo"

    );

    document

        .querySelectorAll(

            ".acessorio"

        )

        .forEach(

            function(elemento) {

                elemento.classList.remove(

                    "acessorio-selecionado"

                );

            }

        );

}

/* =========================================================

   SELECIONAR ACESSÓRIO

========================================================= */

function selecionarAcessorio() {

    const select =

        document.getElementById(

            "ajusteAcessorio"

        );

    if (!select) {

        return;

    }

    acessorioSelecionado =

        select.value;

    carregarAjusteAtual();

    document

        .querySelectorAll(

            ".acessorio"

        )

        .forEach(

            function(elemento) {

                elemento.classList.remove(

                    "acessorio-selecionado"

                );

            }

        );

    const selecionado =

        document.querySelector(

            ".acessorio." +

            acessorioSelecionado

        );

    if (selecionado) {

        selecionado.classList.add(

            "acessorio-selecionado"

        );

    }

    aplicarAjuste();

    atualizarTextoAjuste();

}

/* =========================================================

   TEXTO DO PAINEL

========================================================= */

function atualizarTextoAjuste() {

    const info =

        document.getElementById(

            "ajusteInfo"

        );

    if (!info) {

        return;

    }

    const dados =

        obterDadosPetton();

    const especie =

        obterEspecie(dados);

    const fase =

        obterFase(dados);

    info.textContent =

        "Pet: " +

        especie +

        " • Fase: " +

        fase;

}

/* =========================================================

   MOVER

========================================================= */

function moverAcessorio(

    x,

    y

) {

    if (!modoAjuste) {

        return;

    }

    ajusteAtual.x += x;

    ajusteAtual.y += y;

    aplicarAjuste();

}

/* =========================================================

   TAMANHO

========================================================= */

function alterarTamanho(

    valor

) {

    if (!modoAjuste) {

        return;

    }

    ajusteAtual.escala +=

        valor;

    if (

        ajusteAtual.escala < 0.4

    ) {

        ajusteAtual.escala =

            0.4;

    }

    if (

        ajusteAtual.escala > 2

    ) {

        ajusteAtual.escala =

            2;

    }

    aplicarAjuste();

}

/* =========================================================

   GIRAR

========================================================= */

function girarAcessorio(

    valor

) {

    if (!modoAjuste) {

        return;

    }

    ajusteAtual.rotacao +=

        valor;

    aplicarAjuste();

}

/* =========================================================

   SALVAR AJUSTE

========================================================= */

function salvarAjuste() {

    const todos =

        obterTodosAjustes();

    const chave =

        obterChaveAjuste();

    todos[chave] = {

        x:

            ajusteAtual.x,

        y:

            ajusteAtual.y,

        escala:

            ajusteAtual.escala,

        rotacao:

            ajusteAtual.rotacao

    };

    if (

        salvarTodosAjustes(

            todos

        )

    ) {

        const info =

            document.getElementById(

                "ajusteInfo"

            );

        if (info) {

            info.textContent =

                "✅ Posição salva para " +

                obterEspecie(

                    obterDadosPetton()

                ) +

                " • " +

                obterFase(

                    obterDadosPetton()

                ) +

                " • " +

                acessorioSelecionado;

        }

    }

}

/* =========================================================

   IMAGEM DO PET

========================================================= */

function obterImagemPet(

    dados

) {

    try {

        if (

            dados &&

            dados.identidadeVisual &&

            dados.identidadeVisual.imagens

        ) {

            const fase =

                dados.fase || "bebe";

            const imagem =

                dados

                    .identidadeVisual

                    .imagens[fase];

            if (imagem) {

                return imagem;

            }

        }

    } catch (erro) {

        console.error(

            "Erro ao obter imagem:",

            erro

        );

    }

    return "./39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

}

/* =========================================================

   ATUALIZAR PET

========================================================= */

function atualizarPet() {

    const dados =

        obterDadosPetton();

    const imagem =

        document.getElementById(

            "petImagem"

        );

    const nome =

        document.getElementById(

            "petNome"

        );

    if (!dados) {

        nome.textContent =

            "Petton";

        imagem.src =

            "./39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

        mostrarAcessorios(

            null

        );

        return;

    }

    if (dados.nome) {

        nome.textContent =

            dados.nome;

    } else {

        nome.textContent =

            "Petton";

    }

    const imagemPet =

        obterImagemPet(

            dados

        );

    if (imagemPet) {

        imagem.src =

            imagemPet;

    }

    mostrarAcessorios(

        dados

    );

}

/* =========================================================

   ACESSÓRIOS

========================================================= */

function mostrarAcessorios(

    dados

) {

    const area =

        document.getElementById(

            "acessoriosPet"

        );

    if (!area) {

        return;

    }

    area.innerHTML = "";

    if (

        !dados ||

        !dados.acessorios

    ) {

        return;

    }

    const acessorios =

        dados.acessorios;

    if (

        acessorios.chapeu

    ) {

        adicionarAcessorio(

            "chapeu",

            acessorios.chapeu

        );

    }

    if (

        acessorios.oculos

    ) {

        adicionarAcessorio(

            "oculos",

            acessorios.oculos

        );

    }

    if (

        acessorios.lacinho

    ) {

        adicionarAcessorio(

            "lacinho",

            acessorios.lacinho

        );

    }

    if (

        acessorios.coroa

    ) {

        adicionarAcessorio(

            "coroa",

            acessorios.coroa

        );

    }

    if (

        acessorios.lenco

    ) {

        adicionarAcessorio(

            "lenco",

            acessorios.lenco

        );

    }

    if (modoAjuste) {

        setTimeout(

            function() {

                selecionarAcessorio();

            },

            0

        );

    }

}

/* =========================================================

   ADICIONAR ACESSÓRIO

========================================================= */

function adicionarAcessorio(

    tipo,

    id

) {

    const area =

        document.getElementById(

            "acessoriosPet"

        );

    if (!area) {

        return;

    }

    const elemento =

        document.createElement(

            "div"

        );

    elemento.className =

        "acessorio " +

        tipo;

    let simbolo = "";

    /* CHAPÉU */

    if (

        tipo === "chapeu"

    ) {

        if (

            id === "chapeu_palha"

        ) {

            simbolo =

                "👒";

        } else {

            simbolo =

                "🎩";

        }

    }

    /* ÓCULOS */

    if (

        tipo === "oculos"

    ) {

        if (

            id === "oculos_sol"

        ) {

            simbolo =

                "🕶️";

        } else {

            simbolo =

                "👓";

        }

    }

    /* LACINHO */

    if (

        tipo === "lacinho"

    ) {

        simbolo =

            "🎀";

    }

    /* COROA */

    if (

        tipo === "coroa"

    ) {

        simbolo =

            "👑";

    }

    /* LENÇO */

    if (

        tipo === "lenco"

    ) {

        simbolo =

            "🧣";

    }

    elemento.textContent =

        simbolo;

    elemento.dataset.id =

        id;

    area.appendChild(

        elemento

    );

}

/* =========================================================

   CRIAR OBJETO

========================================================= */

function criarObjeto(

    classe,

    conteudo,

    id

) {

    const elemento =

        document.createElement(

            "div"

        );

    elemento.className =

        "objeto " +

        classe;

    elemento.textContent =

        conteudo;

    elemento.id =

        id;

    return elemento;

}

function voltar() {

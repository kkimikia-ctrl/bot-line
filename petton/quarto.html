<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Petton 🐾</title>

<script src="petton.js"></script>

<style>

* {

    box-sizing: border-box;

}

html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family: Arial, sans-serif;

    background: #f5ead7;

    color: #4a3528;

}

body {

    padding-bottom: 30px;

}

/* =========================

   CABEÇALHO

========================= */

.header {

    position: sticky;

    top: 0;

    z-index: 1000;

    background: #fffaf2;

    padding: 12px 10px;

    border-bottom: 1px solid #eadbc5;

    display: flex;

    align-items: center;

    justify-content: space-between;

}

.header h1 {

    margin: 0;

    font-size: 21px;

}

.header-buttons {

    display: flex;

    gap: 6px;

}

.header button {

    border: 0;

    border-radius: 10px;

    padding: 9px 11px;

    background: #ead0a7;

    color: #4a3528;

    font-weight: bold;

}

/* =========================

   MODO AJUSTE

========================= */

#painelAjuste {

    position: sticky;

    top: 58px;

    z-index: 900;

    width: 100%;

    background: rgba(255,250,242,0.98);

    border-bottom: 2px solid #dfc7a5;

    padding: 8px 8px 10px;

    box-shadow: 0 3px 10px rgba(0,0,0,0.12);

}

#painelAjuste.oculto {

    display: none;

}

.ajuste-titulo {

    text-align: center;

    font-weight: bold;

    font-size: 15px;

    margin-bottom: 6px;

}

#tipoAcessorio {

    display: block;

    width: 100%;

    max-width: 300px;

    margin: 0 auto 7px;

    padding: 8px;

    border-radius: 9px;

    border: 1px solid #d8c2a2;

    background: white;

    font-size: 14px;

}

/* SETAS NO TOPO */

.controles-setas {

    width: 100%;

    max-width: 230px;

    margin: 0 auto;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 5px;

}

.controles-setas button {

    height: 38px;

    border: 0;

    border-radius: 9px;

    background: #e7c99e;

    color: #493324;

    font-size: 19px;

    font-weight: bold;

}

.controles-setas button:active {

    transform: scale(0.94);

    background: #d9b983;

}

.controles-setas .vazio {

    visibility: hidden;

}

/* CONTROLES EXTRAS */

.controles-extras {

    max-width: 330px;

    margin: 7px auto 0;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 5px;

}

.controles-extras button {

    border: 0;

    border-radius: 8px;

    padding: 8px 4px;

    background: #eadbc5;

    color: #493324;

    font-size: 12px;

    font-weight: bold;

}

.controles-extras button:active {

    transform: scale(0.96);

}

.ajuste-acoes {

    max-width: 330px;

    margin: 7px auto 0;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 6px;

}

.ajuste-acoes button {

    border: 0;

    border-radius: 9px;

    padding: 9px;

    font-weight: bold;

}

.btn-salvar {

    background: #91c788;

    color: #21451d;

}

.btn-fechar {

    background: #e3aaa0;

    color: #55251f;

}

/* =========================

   QUARTO

========================= */

.quarto {

    width: 100%;

    max-width: 500px;

    margin: 0 auto;

    padding: 14px 10px 25px;

}

/* =========================

   PAREDE

========================= */

.room {

    position: relative;

    width: 100%;

    min-height: 520px;

    overflow: hidden;

    border-radius: 18px;

    background:

        linear-gradient(

            to bottom,

            #fff5e6 0%,

            #fff5e6 68%,

            #d7b58b 68%,

            #c69c6d 100%

        );

    border: 2px solid #ddc4a3;

}

/* =========================

   PET

========================= */

.pet-area {

    position: absolute;

    left: 50%;

    bottom: 95px;

    transform: translateX(-50%);

    width: 190px;

    height: 260px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

}

.pet-shadow {

    position: absolute;

    bottom: 5px;

    left: 50%;

    transform: translateX(-50%);

    width: 120px;

    height: 25px;

    background: rgba(80,50,30,0.20);

    border-radius: 50%;

}

/* IMAGEM DO PET */

.pet-image {

    position: relative;

    z-index: 2;

    max-width: 180px;

    max-height: 225px;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

}

/* =========================

   CAMADA DOS ACESSÓRIOS

========================= */

.acessorios-pet {

    position: absolute;

    left: 50%;

    top: 0;

    transform: translateX(-50%);

    width: 180px;

    height: 225px;

    z-index: 10;

    pointer-events: none;

}

.acessorio {

    position: absolute;

    width: 55px;

    height: 55px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    line-height: 1;

    transform:

        translate(-50%, -50%)

        translate(

            calc(var(--ajuste-x, 0px)),

            calc(var(--ajuste-y, 0px))

        )

        scale(var(--ajuste-escala, 1))

        rotate(var(--ajuste-rotacao, 0deg));

    transform-origin: center center;

    user-select: none;

}

.acessorio.selecionado {

    outline: 2px dashed rgba(120,80,40,0.65);

    border-radius: 50%;

}

/* POSIÇÕES PADRÃO */

.acessorio.chapeu {

    left: 50%;

    top: 18px;

}

.acessorio.coroa {

    left: 50%;

    top: 18px;

}

.acessorio.lacinho {

    left: 78%;

    top: 67px;

}

.acessorio.oculos {

    left: 50%;

    top: 95px;

}

.acessorio.lenco {

    left: 50%;

    top: 165px;

}

/* =========================

   OBJETOS DO QUARTO

========================= */

.objeto {

    position: absolute;

    z-index: 4;

    font-size: 42px;

    user-select: none;

}

.objeto.cama {

    bottom: 20px;

    left: 20px;

}

.objeto.bola {

    bottom: 32px;

    right: 35px;

}

.objeto.ratinho {

    bottom: 35px;

    left: 42%;

}

.objeto.arranhador {

    bottom: 25px;

    right: 12px;

}

.objeto.pote {

    bottom: 25px;

    left: 18px;

}

.objeto.pote_agua {

    bottom: 25px;

    left: 80px;

}

.objeto.planta {

    top: 30px;

    right: 20px;

}

.objeto.flor {

    top: 55px;

    left: 20px;

}

.objeto.tapete {

    bottom: 8px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 80px;

}

.objeto.abajur {

    top: 20px;

    right: 90px;

}

.objeto.quadro {

    top: 25px;

    left: 50%;

    transform: translateX(-50%);

}

/* =========================

   INFORMAÇÕES

========================= */

.info-pet {

    margin-top: 12px;

    background: #fffaf2;

    border-radius: 14px;

    padding: 12px;

    text-align: center;

    border: 1px solid #eadbc5;

}

.info-pet strong {

    font-size: 18px;

}

.fase {

    margin-top: 4px;

    color: #80664e;

    font-size: 13px;

}

/* =========================

   BOTÃO AJUSTAR

========================= */

.btn-ajustar-principal {

    display: block;

    width: 100%;

    max-width: 330px;

    margin: 12px auto;

    padding: 12px;

    border: 0;

    border-radius: 12px;

    background: #d8b47c;

    color: #432d1e;

    font-size: 15px;

    font-weight: bold;

}

/* =========================

   RESPONSIVO

========================= */

@media (max-width: 380px) {

    .header h1 {

        font-size: 18px;

    }

    .header button {

        padding: 8px;

        font-size: 11px;

    }

    .room {

        min-height: 490px;

    }

    .controles-setas {

        max-width: 210px;

    }

    .controles-setas button {

        height: 35px;

    }

}

</style>

</head>

<body>

<header class="header">

    <h1>🏠 Quarto</h1>

    <div class="header-buttons">

        <button onclick="abrirLoja()">🛒 Loja</button>

        <button onclick="voltar()">← Voltar</button>

    </div>

</header>

<!-- =========================

     PAINEL DE AJUSTE

========================= -->

<div id="painelAjuste" class="oculto">

    <div class="ajuste-titulo">

        🛠️ Ajustar acessório

    </div>

    <select id="tipoAcessorio" onchange="selecionarAcessorio()">

        <option value="chapeu">🎩 Chapéu</option>

        <option value="oculos">👓 Óculos</option>

        <option value="lacinho">🎀 Lacinho</option>

        <option value="coroa">👑 Coroa</option>

        <option value="lenco">🧣 Lenço</option>

    </select>

    <div class="controles-setas">

        <button class="vazio"></button>

        <button onclick="moverAcessorio(0,-3)">⬆️</button>

        <button class="vazio"></button>

        <button onclick="moverAcessorio(-3,0)">⬅️</button>

        <button onclick="moverAcessorio(0,3)">⬇️</button>

        <button onclick="moverAcessorio(3,0)">➡️</button>

    </div>

    <div class="controles-extras">

        <button onclick="alterarEscala(-0.05)">➖ Tamanho</button>

        <button onclick="alterarEscala(0.05)">➕ Tamanho</button>

        <button onclick="girarAcessorio(-5)">↶ Girar</button>

        <button onclick="girarAcessorio(5)">↷ Girar</button>

        <button onclick="resetarAcessorio()">🔄 Reset</button>

        <button onclick="centralizarAcessorio()">🎯 Centro</button>

    </div>

    <div class="ajuste-acoes">

        <button class="btn-salvar" onclick="salvarAjuste()">

            💾 Salvar

        </button>

        <button class="btn-fechar" onclick="fecharModoAjuste()">

            ✅ Fechar

        </button>

    </div>

</div>

<main class="quarto">

    <button

        id="btnAbrirAjuste"

        class="btn-ajustar-principal"

        onclick="abrirModoAjuste()"

    >

        🛠️ Ajustar acessórios

    </button>

    <div class="room">

        <div class="pet-area">

            <div class="pet-shadow"></div>

            <img

                id="petImage"

                class="pet-image"

                src=""

                alt="Petton"

            >

            <div

                id="acessoriosPet"

                class="acessorios-pet"

            ></div>

        </div>

        <div id="objetosQuarto"></div>

    </div>

    <div class="info-pet">

        <strong id="nomePet">Petton</strong>

        <div

            id="fasePet"

            class="fase"

        >

            🥚 Ovo

        </div>

    </div>

</main>

<script>

/* =====================================================

   CONFIGURAÇÃO

===================================================== */

const CHAVE_AJUSTES =

    "petton_acessorios_posicoes_v2";

let modoAjuste = false;

let acessorioSelecionado = "chapeu";

/* =====================================================

   DADOS

===================================================== */

function obterDadosPetton() {

    try {

        if (

            window.Petton &&

            typeof Petton.carregar === "function"

        ) {

            return Petton.carregar();

        }

    } catch(e) {

        console.log(e);

    }

    try {

        return JSON.parse(

            localStorage.getItem("petton_dados_v3")

        ) || {};

    } catch(e) {

        return {};

    }

}

/* =====================================================

   ESPÉCIE

===================================================== */

function obterEspecie(dados) {

    return (

        dados?.especie ||

        dados?.identidadeVisual?.especie ||

        "pet"

    );

}

/* =====================================================

   FASE

===================================================== */

function obterFase(dados) {

    return (

        dados?.fase ||

        dados?.identidadeVisual?.fase ||

        "adulto"

    );

}

/* =====================================================

   CHAVE DO AJUSTE

===================================================== */

function obterChaveAjuste(

    especie,

    fase,

    tipo

) {

    return (

        especie +

        "_" +

        fase +

        "_" +

        tipo

    );

}

/* =====================================================

   CARREGAR TODOS OS AJUSTES

===================================================== */

function obterAjustes() {

    try {

        return JSON.parse(

            localStorage.getItem(CHAVE_AJUSTES)

        ) || {};

    } catch(e) {

        return {};

    }

}

/* =====================================================

   SALVAR TODOS OS AJUSTES

===================================================== */

function salvarTodosAjustes(ajustes) {

    localStorage.setItem(

        CHAVE_AJUSTES,

        JSON.stringify(ajustes)

    );

}

/* =====================================================

   POSIÇÃO SALVA

===================================================== */

function obterAjuste(

    dados,

    tipo

) {

    const especie = obterEspecie(dados);

    const fase = obterFase(dados);

    const ajustes = obterAjustes();

    const chave = obterChaveAjuste(

        especie,

        fase,

        tipo

    );

    return ajustes[chave] || null;

}

/* =====================================================

   APLICAR AJUSTE AO ELEMENTO

===================================================== */

function aplicarAjusteElemento(

    elemento,

    tipo,

    dados

) {

    const ajuste = obterAjuste(

        dados,

        tipo

    );

    if (!ajuste) {

        elemento.style.setProperty(

            "--ajuste-x",

            "0px"

        );

        elemento.style.setProperty(

            "--ajuste-y",

            "0px"

        );

        elemento.style.setProperty(

            "--ajuste-escala",

            "1"

        );

        elemento.style.setProperty(

            "--ajuste-rotacao",

            "0deg"

        );

        return;

    }

    elemento.style.setProperty(

        "--ajuste-x",

        (ajuste.x || 0) + "px"

    );

    elemento.style.setProperty(

        "--ajuste-y",

        (ajuste.y || 0) + "px"

    );

    elemento.style.setProperty(

        "--ajuste-escala",

        ajuste.escala || 1

    );

    elemento.style.setProperty(

        "--ajuste-rotacao",

        (ajuste.rotacao || 0) + "deg"

    );

}

/* =====================================================

   ADICIONAR ACESSÓRIO

===================================================== */

function adicionarAcessorio(

    tipo,

    id,

    dados,

    selecionado = false

) {

    const camada =

        document.getElementById(

            "acessoriosPet"

        );

    if (!camada) return;

    const el =

        document.createElement("div");

    el.className =

        "acessorio " +

        tipo +

        (selecionado ? " selecionado" : "");

    el.dataset.tipo = tipo;

    el.textContent = id || obterEmoji(tipo);

    camada.appendChild(el);

    /*

     * IMPORTANTE:

     * sempre aplica a posição salva,

     * inclusive fora do modo de ajuste.

     */

    aplicarAjusteElemento(

        el,

        tipo,

        dados

    );

    return el;

}

/* =====================================================

   EMOJIS

===================================================== */

function obterEmoji(tipo) {

    const mapa = {

        chapeu: "🎩",

        oculos: "👓",

        lacinho: "🎀",

        coroa: "👑",

        lenco: "🧣"

    };

    return mapa[tipo] || "✨";

}

/* =====================================================

   ACESSÓRIOS EQUIPADOS

===================================================== */

function obterAcessoriosEquipados(dados) {

    return dados?.acessorios || {};

}

/* =====================================================

   MOSTRAR ACESSÓRIOS

===================================================== */

function mostrarAcessorios(dados) {

    const camada =

        document.getElementById(

            "acessoriosPet"

        );

    if (!camada) return;

    camada.innerHTML = "";

    const equipados =

        obterAcessoriosEquipados(dados);

    const tipos = [

        "chapeu",

        "oculos",

        "lacinho",

        "coroa",

        "lenco"

    ];

    tipos.forEach(tipo => {

        const id =

            equipados[tipo];

        if (id) {

            adicionarAcessorio(

                tipo,

                id,

                dados,

                modoAjuste &&

                tipo === acessorioSelecionado

            );

        }

    });

    /*

     * Durante o ajuste:

     * se o acessório ainda não estiver equipado,

     * mostramos uma prévia para poder posicioná-lo.

     */

    if (modoAjuste) {

        const jaEquipado =

            !!equipados[

                acessorioSelecionado

            ];

        if (!jaEquipado) {

            adicionarAcessorio(

                acessorioSelecionado,

                obterEmoji(

                    acessorioSelecionado

                ),

                dados,

                true

            );

        }

    }

}

/* =====================================================

   ABRIR AJUSTE

===================================================== */

function abrirModoAjuste() {

    modoAjuste = true;

    document

        .getElementById("painelAjuste")

        .classList.remove("oculto");

    document

        .getElementById("btnAbrirAjuste")

        .style.display = "none";

    mostrarAcessorios(

        obterDadosPetton()

    );

    carregarAjusteAtual();

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}

/* =====================================================

   FECHAR AJUSTE

===================================================== */

function fecharModoAjuste() {

    salvarAjusteSilencioso();

    modoAjuste = false;

    document

        .getElementById("painelAjuste")

        .classList.add("oculto");

    document

        .getElementById("btnAbrirAjuste")

        .style.display = "block";

    /*

     * Recria os acessórios.

     * Como mostrarAcessorios()

     * agora carrega os ajustes salvos,

     * eles NÃO voltam para a posição antiga.

     */

    atualizarPet();

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}

/* =====================================================

   SELECIONAR ACESSÓRIO

===================================================== */

function selecionarAcessorio() {

    const select =

        document.getElementById(

            "tipoAcessorio"

        );

    acessorioSelecionado =

        select.value;

    mostrarAcessorios(

        obterDadosPetton()

    );

    carregarAjusteAtual();

}

/* =====================================================

   ELEMENTO SELECIONADO

===================================================== */

function obterElementoSelecionado() {

    return document.querySelector(

        ".acessorio." +

        acessorioSelecionado

    );

}

/* =====================================================

   CARREGAR AJUSTE ATUAL

===================================================== */

function carregarAjusteAtual() {

    const dados =

        obterDadosPetton();

    const elemento =

        obterElementoSelecionado();

    if (!elemento) return;

    aplicarAjusteElemento(

        elemento,

        acessorioSelecionado,

        dados

    );

}

/* =====================================================

   MOVER

===================================================== */

function moverAcessorio(

    dx,

    dy

) {

    const elemento =

        obterElementoSelecionado();

    if (!elemento) return;

    const x =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-x"

            )

        ) || 0;

    const y =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-y"

            )

        ) || 0;

    elemento.style.setProperty(

        "--ajuste-x",

        (x + dx) + "px"

    );

    elemento.style.setProperty(

        "--ajuste-y",

        (y + dy) + "px"

    );

}

/* =====================================================

   ESCALA

===================================================== */

function alterarEscala(valor) {

    const elemento =

        obterElementoSelecionado();

    if (!elemento) return;

    let escala =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-escala"

            )

        ) || 1;

    escala += valor;

    if (escala < 0.4)

        escala = 0.4;

    if (escala > 2)

        escala = 2;

    elemento.style.setProperty(

        "--ajuste-escala",

        escala

    );

}

/* =====================================================

   ROTAÇÃO

===================================================== */

function girarAcessorio(

    valor

) {

    const elemento =

        obterElementoSelecionado();

    if (!elemento) return;

    let rotacao =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-rotacao"

            )

        ) || 0;

    rotacao += valor;

    elemento.style.setProperty(

        "--ajuste-rotacao",

        rotacao + "deg"

    );

}

/* =====================================================

   RESET

===================================================== */

function resetarAcessorio() {

    const elemento =

        obterElementoSelecionado();

    if (!elemento) return;

    elemento.style.setProperty(

        "--ajuste-x",

        "0px"

    );

    elemento.style.setProperty(

        "--ajuste-y",

        "0px"

    );

    elemento.style.setProperty(

        "--ajuste-escala",

        "1"

    );

    elemento.style.setProperty(

        "--ajuste-rotacao",

        "0deg"

    );

}

/* =====================================================

   CENTRALIZAR

===================================================== */

function centralizarAcessorio() {

    const elemento =

        obterElementoSelecionado();

    if (!elemento) return;

    elemento.style.setProperty(

        "--ajuste-x",

        "0px"

    );

    elemento.style.setProperty(

        "--ajuste-y",

        "0px"

    );

    elemento.style.setProperty(

        "--ajuste-rotacao",

        "0deg"

    );

}

/* =====================================================

   SALVAR AJUSTE

===================================================== */

function salvarAjuste() {

    const elemento =

        obterElementoSelecionado();

    if (!elemento) return;

    const dados =

        obterDadosPetton();

    const especie =

        obterEspecie(dados);

    const fase =

        obterFase(dados);

    const ajustes =

        obterAjustes();

    const chave =

        obterChaveAjuste(

            especie,

            fase,

            acessorioSelecionado

        );

    const x =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-x"

            )

        ) || 0;

    const y =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-y"

            )

        ) || 0;

    const escala =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-escala"

            )

        ) || 1;

    const rotacao =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-rotacao"

            )

        ) || 0;

    ajustes[chave] = {

        x: x,

        y: y,

        escala: escala,

        rotacao: rotacao

    };

    salvarTodosAjustes(

        ajustes

    );

    elemento.style.outline =

        "3px solid #75a96b";

    setTimeout(() => {

        if (elemento) {

            elemento.style.outline = "";

        }

    }, 700);

}

/* =====================================================

   SALVAR SILENCIOSO

===================================================== */

function salvarAjusteSilencioso() {

    const elemento =

        obterElementoSelecionado();

    if (!elemento) return;

    const dados =

        obterDadosPetton();

    const especie =

        obterEspecie(dados);

    const fase =

        obterFase(dados);

    const ajustes =

        obterAjustes();

    const chave =

        obterChaveAjuste(

            especie,

            fase,

            acessorioSelecionado

        );

    const x =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-x"

            )

        ) || 0;

    const y =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-y"

            )

        ) || 0;

    const escala =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-escala"

            )

        ) || 1;

    const rotacao =

        parseFloat(

            getComputedStyle(

                elemento

            ).getPropertyValue(

                "--ajuste-rotacao"

            )

        ) || 0;

    ajustes[chave] = {

        x,

        y,

        escala,

        rotacao

    };

    salvarTodosAjustes(

        ajustes

    );

}

/* =====================================================

   IMAGEM DO PET

===================================================== */

function obterImagemPet(dados) {

    /*

     * Primeiro tenta usar a imagem definida

     * pelo próprio Petton.

     */

    try {

        if (

            window.Petton &&

            typeof Petton.obterImagemFase ===

            "function"

        ) {

            const imagem =

                Petton.obterImagemFase(

                    obterFase(dados)

                );

            if (imagem)

                return imagem;

        }

    } catch(e) {}

    /*

     * Fallback por espécie.

     */

    const especie =

        obterEspecie(dados);

    if (especie === "cachorro")

        return "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png";

    if (especie === "coelho")

        return "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

    return "petton-original.png";

}

/* =====================================================

   OBJETOS

===================================================== */

function mostrarObjetosComprados() {

    const container =

        document.getElementById(

            "objetosQuarto"

        );

    if (!container) return;

    container.innerHTML = "";

    let inventario = [];

    try {

        inventario =

            JSON.parse(

                localStorage.getItem(

                    "petton_loja_v1"

                )

            ) || [];

    } catch(e) {

        inventario = [];

    }

    const mapa = {

        cama_basica: ["🛏️","cama"],

        cama_rosa: ["🛏️","cama"],

        cama_casinha: ["🏠","cama"],

        bola: ["⚽","bola"],

        bolinha: ["🔴","bola"],

        ratinho: ["🐭","ratinho"],

        arranhador: ["🪵","arranhador"],

        pelucia: ["🧸","ratinho"],

        pote: ["🥣","pote"],

        pote_agua: ["💧","pote_agua"],

        planta: ["🪴","planta"],

        flor: ["🌸","flor"],

        tapete: ["🟫","tapete"],

        abajur: ["💡","abajur"],

        quadro: ["🖼️","quadro"]

    };

    inventario.forEach(id => {

        if (!mapa[id]) return;

        const [emoji, classe] =

            mapa[id];

        const el =

            document.createElement("div");

        el.className =

            "objeto " + classe;

        el.textContent =

            emoji;

        container.appendChild(el);

    });

}

/* =====================================================

   ATUALIZAR PET

===================================================== */

function atualizarPet() {

    const dados =

        obterDadosPetton();

    const imagem =

        document.getElementById(

            "petImage"

        );

    const nome =

        document.getElementById(

            "nomePet"

        );

    const fase =

        document.getElementById(

            "fasePet"

        );

    if (imagem) {

        imagem.src =

            obterImagemPet(dados);

    }

    if (nome) {

        nome.textContent =

            dados?.nome ||

            "Petton";

    }

    if (fase) {

        const f =

            obterFase(dados);

        const nomes = {

            ovo: "🥚 Ovo",

            bebe: "🐣 Bebê",

            filhote: "🐾 Filhote",

            jovem: "🐕 Jovem",

            adulto: "🐾 Adulto"

        };

        fase.textContent =

            nomes[f] ||

            "🐾 " + f;

    }

    mostrarAcessorios(

        dados

    );

    mostrarObjetosComprados();

}

   LOJA

===================================================== */

function abrirLoja() {

    window.location.href =

        "./loja.html";

}

/* =====================================================

   VOLTAR

function voltar() {

        "./index.html"

    );

}

   INICIALIZAÇÃO

===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        atualizarPet();

    }

);

window.addEventListener(

    "pageshow",

    function() {

        atualizarPet();

    }

);

window.addEventListener(

    "storage",

    function(event) {

        if (

            event.key ===

            "petton_dados_v3"

        ) {

            atualizarPet();

        }

    }

);

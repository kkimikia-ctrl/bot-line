<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<title>Quarto do Petton</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    min-height:100vh;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

    background:#f7efe5;

    color:#333;

}

.container{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:14px;

}

/* =========================

   TOPO

========================= */

.topo{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:12px;

}

.voltar{

    width:44px;

    height:44px;

    border:0;

    border-radius:14px;

    background:white;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    font-size:23px;

}

.titulo{

    flex:1;

}

.titulo h1{

    margin:0;

    font-size:23px;

}

.titulo p{

    margin:3px 0 0;

    color:#777;

    font-size:12px;

}

/* =========================

   QUARTO

========================= */

.quarto{

    position:relative;

    width:100%;

    height:470px;

    overflow:hidden;

    border-radius:28px;

    background:#ead8c2;

    box-shadow:

        0 8px 25px rgba(0,0,0,.14),

        inset 0 0 0 3px rgba(255,255,255,.45);

}

.parede{

    position:absolute;

    left:0;

    top:0;

    width:100%;

    height:67%;

    background:

        repeating-linear-gradient(

            90deg,

            #f4e5d2 0px,

            #f4e5d2 78px,

            #efdcc5 79px,

            #efdcc5 80px

        );

}

.piso{

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    height:35%;

    background:

        repeating-linear-gradient(

            0deg,

            #cda982 0px,

            #cda982 38px,

            #c29b75 39px,

            #c29b75 40px

        );

}

.linha-parede{

    position:absolute;

    top:65%;

    left:0;

    width:100%;

    height:8px;

    background:#b98e68;

}

/* =========================

   JANELA

========================= */

.janela{

    position:absolute;

    top:48px;

    left:50%;

    transform:translateX(-50%);

    width:150px;

    height:105px;

    border:9px solid #9b704e;

    border-radius:10px;

    background:

        linear-gradient(

            135deg,

            #a9ddff,

            #e7f8ff

        );

    box-shadow:

        0 4px 10px rgba(0,0,0,.18);

}

.janela:before{

    content:"";

    position:absolute;

    left:50%;

    top:0;

    height:100%;

    width:5px;

    background:#9b704e;

    transform:translateX(-50%);

}

.janela:after{

    content:"";

    position:absolute;

    top:50%;

    left:0;

    width:100%;

    height:5px;

    background:#9b704e;

    transform:translateY(-50%);

}

/* =========================

   PETTON ORIGINAL

========================= */

.petton{

    position:absolute;

    left:50%;

    bottom:88px;

    transform:translateX(-50%);

    width:145px;

    height:175px;

    z-index:20;

    display:flex;

    justify-content:center;

    align-items:flex-end;

    transition:

        transform .3s ease,

        bottom .3s ease;

}

.petton img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

    filter:

        drop-shadow(

            0 8px 5px rgba(0,0,0,.20)

        );

    animation:

        respirar 3s ease-in-out infinite;

}

.petton:hover{

    transform:

        translateX(-50%)

        scale(1.04);

}

@keyframes respirar{

    0%,100%{

        transform:translateY(0);

    }

    50%{

        transform:translateY(-3px);

    }

}

/* =========================

   OBJETOS

========================= */

.objeto{

    position:absolute;

    z-index:10;

    text-align:center;

    user-select:none;

    animation:

        aparecer .35s ease;

}

.objeto span{

    display:block;

    filter:

        drop-shadow(

            0 4px 3px rgba(0,0,0,.16)

        );

}

.objeto small{

    display:block;

    margin-top:2px;

    font-size:10px;

    color:#694b35;

    font-weight:700;

}

.cama{

    left:25px;

    bottom:45px;

}

.cama span{

    font-size:78px;

}

.pote{

    right:30px;

    bottom:72px;

}

.pote span{

    font-size:50px;

}

.brinquedo{

    left:70px;

    bottom:80px;

}

.brinquedo span{

    font-size:48px;

}

.planta{

    right:25px;

    top:180px;

}

.planta span{

    font-size:62px;

}

.tapete{

    left:50%;

    bottom:18px;

    transform:

        translateX(-50%);

    z-index:4;

}

.tapete span{

    font-size:130px;

    opacity:.9;

}

.abajur{

    left:18px;

    top:185px;

}

.abajur span{

    font-size:55px;

}

.quadro{

    right:25px;

    top:42px;

}

.quadro span{

    font-size:50px;

}

/* =========================

   MENSAGEM

========================= */

.mensagem{

    text-align:center;

    min-height:22px;

    margin:8px 0;

    color:#16a34a;

    font-size:13px;

    font-weight:700;

}

/* =========================

   INVENTÁRIO

========================= */

.card{

    margin-top:14px;

    background:white;

    border-radius:22px;

    padding:16px;

    box-shadow:

        0 4px 16px rgba(0,0,0,.07);

}

.card h2{

    margin:

        0 0 10px;

    font-size:18px;

}

.lista-itens{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:4px;

}

.botao-item{

    flex:none;

    border:0;

    border-radius:15px;

    background:#f7f7f7;

    padding:10px 12px;

    font-size:13px;

    font-weight:700;

}

.botao-item:active{

    transform:scale(.95);

}

.sem-itens{

    color:#888;

    text-align:center;

    padding:12px;

    font-size:13px;

}

/* =========================

   ANIMAÇÃO OBJETOS

========================= */

@keyframes aparecer{

    from{

        opacity:0;

        transform:scale(.7);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}

/* =========================

   CELULAR

========================= */

@media(max-width:420px){

    .quarto{

        height:430px;

    }

    .petton{

        width:125px;

        height:155px;

        bottom:82px;

    }

    .cama span{

        font-size:65px;

    }

    .planta span{

        font-size:53px;

    }

    .quadro span{

        font-size:42px;

    }

    .janela{

        width:125px;

        height:90px;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- =========================

     TOPO

========================= -->

<div class="topo">

    <button

        class="voltar"

        onclick="history.back()"

    >

        ←

    </button>

    <div class="titulo">

        <h1>

            🏠 Quarto do Petton

        </h1>

        <p>

            O cantinho especial do seu amigo

        </p>

    </div>

</div>

<!-- =========================

     QUARTO

========================= -->

<div class="quarto">

    <div class="parede"></div>

    <div class="piso"></div>

    <div class="linha-parede"></div>

    <div class="janela"></div>

    <!-- OBJETOS -->

    <div id="objetos"></div>

    <!-- PETTON ORIGINAL -->

    <div

        id="pettonVisual"

        class="petton"

    >

        <img

            src="petton-original.png"

            alt="Petton"

        >

    </div>

</div>

<div

    id="mensagem"

    class="mensagem"

></div>

<!-- =========================

     ITENS

========================= -->

<div class="card">

    <h2>

        🎒 Seus itens

    </h2>

    <div

        id="listaItens"

        class="lista-itens"

    ></div>

</div>

<!-- =========================

     INFORMAÇÃO

========================= -->

<div class="card">

    <h2>

        ✨ Seu quarto

    </h2>

    <div

        style="

        font-size:13px;

        color:#777;

        line-height:1.5;

        "

    >

        Os objetos comprados na loja

        aparecem automaticamente no quarto.

        <br><br>

        Em breve você poderá escolher

        exatamente onde colocar cada objeto.

    </div>

</div>

</div>

<script src="petton.js"></script>

<script>

/* =================================================

   LOJA

================================================= */

const CHAVE_LOJA =

    "petton_loja_v1";

let inventario = [];

/* =================================================

   PRODUTOS

================================================= */

const produtos = [

    {

        id:"cama_basica",

        nome:"Caminha simples",

        emoji:"🛏️",

        tipo:"cama"

    },

    {

        id:"cama_rosa",

        nome:"Caminha fofa",

        emoji:"🛌",

        tipo:"cama"

    },

    {

        id:"cama_casinha",

        nome:"Casinha",

        emoji:"🏠",

        tipo:"cama"

    },

    {

        id:"bola",

        nome:"Bola",

        emoji:"⚽",

        tipo:"brinquedo"

    },

    {

        id:"bolinha",

        nome:"Bolinha",

        emoji:"🔴",

        tipo:"brinquedo"

    },

    {

        id:"ratinho",

        nome:"Ratinho",

        emoji:"🐭",

        tipo:"brinquedo"

    },

    {

        id:"arranhador",

        nome:"Arranhador",

        emoji:"🪵",

        tipo:"brinquedo"

    },

    {

        id:"pote",

        nome:"Pote de comida",

        emoji:"🥣",

        tipo:"pote"

    },

    {

        id:"pote_agua",

        nome:"Pote de água",

        emoji:"💧",

        tipo:"pote"

    },

    {

        id:"planta",

        nome:"Plantinha",

        emoji:"🌱",

        tipo:"planta"

    },

    {

        id:"flor",

        nome:"Vaso de flores",

        emoji:"🌷",

        tipo:"planta"

    },

    {

        id:"tapete",

        nome:"Tapete",

        emoji:"🟫",

        tipo:"tapete"

    },

    {

        id:"abajur",

        nome:"Abajur",

        emoji:"💡",

        tipo:"abajur"

    },

    {

        id:"quadro",

        nome:"Quadro",

        emoji:"🖼️",

        tipo:"quadro"

    },

    {

        id:"pelucia",

        nome:"Bichinho de pelúcia",

        emoji:"🧸",

        tipo:"brinquedo"

    }

];

/* =================================================

   CARREGAR INVENTÁRIO

================================================= */

function carregarInventario(){

    try{

        const dados =

            localStorage.getItem(

                CHAVE_LOJA

            );

        if(dados){

            inventario =

                JSON.parse(dados);

        }

    }catch(e){

        inventario = [];

    }

}

/* =================================================

   DESENHAR OBJETOS

================================================= */

function desenharObjetos(){

    const area =

        document.getElementById(

            "objetos"

        );

    area.innerHTML = "";

    const itens =

        inventario

            .map(

                id =>

                    produtos.find(

                        produto =>

                            produto.id === id

                    )

            )

            .filter(Boolean);

    const cama =

        itens.find(

            item =>

                item.tipo === "cama"

        );

    if(cama){

        criarObjeto(

            cama,

            "cama"

        );

    }

    const pote =

        itens.find(

            item =>

                item.tipo === "pote"

        );

    if(pote){

        criarObjeto(

            pote,

            "pote"

        );

    }

    const brinquedo =

        itens.find(

            item =>

                item.tipo === "brinquedo"

        );

    if(brinquedo){

        criarObjeto(

            brinquedo,

            "brinquedo"

        );

    }

    const planta =

        itens.find(

            item =>

                item.tipo === "planta"

        );

    if(planta){

        criarObjeto(

            planta,

            "planta"

        );

    }

    const tapete =

        itens.find(

            item =>

                item.tipo === "tapete"

        );

    if(tapete){

        criarObjeto(

            tapete,

            "tapete"

        );

    }

    const abajur =

        itens.find(

            item =>

                item.tipo === "abajur"

        );

    if(abajur){

        criarObjeto(

            abajur,

            "abajur"

        );

    }

    const quadro =

        itens.find(

            item =>

                item.tipo === "quadro"

        );

    if(quadro){

        criarObjeto(

            quadro,

            "quadro"

        );

    }

}

/* =================================================

   CRIAR OBJETO

================================================= */

function criarObjeto(

    produto,

    classe

){

    const elemento =

        document.createElement(

            "div"

        );

    elemento.className =

        "objeto " +

        classe;

    elemento.innerHTML = `

        <span>

            ${produto.emoji}

        </span>

        <small>

            ${produto.nome}

        </small>

    `;

    document

        .getElementById(

            "objetos"

        )

        .appendChild(

            elemento

        );

}

/* =================================================

   INVENTÁRIO

================================================= */

function mostrarInventario(){

    const area =

        document.getElementById(

            "listaItens"

        );

    if(

        !inventario ||

        inventario.length === 0

    ){

        area.innerHTML = `

            <div class="sem-itens">

                Você ainda não comprou

                nenhum objeto. 🛍️

            </div>

        `;

        return;

    }

    const itens =

        inventario

            .map(

                id =>

                    produtos.find(

                        produto =>

                            produto.id === id

                    )

            )

            .filter(Boolean);

    area.innerHTML =

        itens.map(

            item => `

                <button

                    class="botao-item"

                    onclick="

                        mostrarMensagem(

                            '✨ ${item.nome} está no quarto!'

                        )

                    "

                >

                    ${item.emoji}

                    ${item.nome}

                </button>

            `

        ).join("");

}

/* =================================================

   MENSAGEM

================================================= */

function mostrarMensagem(texto){

    const elemento =

        document.getElementById(

            "mensagem"

        );

    elemento.textContent =

        texto;

    setTimeout(

        function(){

            if(

                elemento.textContent ===

                texto

            ){

                elemento.textContent =

                    "";

            }

        },

        2500

    );

}

/* =================================================

   INICIAR

================================================= */

carregarInventario();

mostrarInventario();

desenharObjetos();

</script>

</body>

</html>

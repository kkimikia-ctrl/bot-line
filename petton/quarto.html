/* =========================

   JANELA

========================= */

.janela {

    position: absolute;

    top: 34px;

}

.janela::before {

    left: 50%;

    top: 0;

    width: 4px;

    height: 100%;

    background: #fff7e9;

    transform:

}

.janela::after {

    content: "";

    top: 50%;

    left: 0;

    width: 100%;

    height: 4px;

    background: #fff7e9;

    transform:

.objeto-loja {

<script>

const LIFF_ID =

    "2010902449-KWNNNsxn";

const CHAVE_LOJA =

    "petton_loja_v1";

const CHAVE_PETTON =

    "petton_dados_v3";

/* =========================================================

   IMAGENS

========================================================= */

const imagensFallback = {

    gato:

        "petton-original.png",

    cachorro:

        "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png",

    coelho:

        "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

};

/* =========================================================

   CARREGAR PETTON

========================================================= */

function carregarDadosPetton() {

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.carregar === "function"

        ) {

            return Petton.carregar();

        }

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

    }

    try {

        const salvo =

            localStorage.getItem(

                CHAVE_PETTON

            );

        if (!salvo) {

            return null;

        }

        return JSON.parse(salvo);

    } catch (erro) {

        console.error(

            "Erro localStorage Petton:",

            erro

        );

        return null;

    }

}

/* =========================================================

   CARREGAR INVENTÁRIO DA LOJA

========================================================= */

function carregarInventarioLoja() {

    try {

        const salvo =

            localStorage.getItem(

                CHAVE_LOJA

            );

        if (!salvo) {

            return [];

        }

        const inventario =

            JSON.parse(salvo);

        if (

            !Array.isArray(inventario)

        ) {

            return [];

        }

        return inventario;

    } catch (erro) {

        console.error(

            "Erro ao carregar inventário:",

            erro

        );

        return [];

    }

}

/* =========================================================

   VERIFICAR ITEM

========================================================= */

function temItem(id) {

    const inventario =

        carregarInventarioLoja();

    return inventario.includes(id);

}

/* =========================================================

   MOSTRAR OBJETOS COMPRADOS

========================================================= */

function atualizarObjetosQuarto() {

    /*

     * Cada item da Loja tem um ID.

     *

     * Aqui usamos exatamente os mesmos IDs

     * usados no loja.html.

     */

    const mapa = {

        bola:

            "objetoBola",

        bolinha:

            "objetoBolinha",

        ratinho:

            "objetoRatinho",

        arranhador:

            "objetoArranhador",

        pelucia:

            "objetoPelucia",

        planta:

            "objetoPlanta",

        flor:

            "objetoFlor",

        pote:

            "objetoPote",

        pote_agua:

            "objetoAgua",

        abajur:

            "objetoAbajur",

        quadro:

            "objetoQuadro",

        cama_rosa:

            "objetoCamaRosa",

        cama_casinha:

            "objetoCasinha"

    };

    Object.keys(mapa).forEach(

        function(id) {

            const elemento =

                document.getElementById(

                    mapa[id]

                );

            if (!elemento) {

                return;

            }

            if (temItem(id)) {

                elemento.classList.add(

                    "visivel"

                );

            } else {

                elemento.classList.remove(

                    "visivel"

                );

            }

        }

    );

    /*

     * O tapete comprado ganha uma

     * representação própria.

     */

    const tapete =

        document.getElementById(

            "tapeteComprado"

        );

    if (tapete) {

        if (

            temItem("tapete")

        ) {

            tapete.classList.add(

                "visivel"

            );

        } else {

            tapete.classList.remove(

                "visivel"

            );

        }

    }

}

/* =========================================================

   OBTER IMAGEM DO PET

========================================================= */

function obterImagemPet(dados) {

    if (!dados) {

        return null;

    }

    const fase =

        dados.fase ||

        "bebe";

    try {

        if (

            dados.identidadeVisual &&

            dados.identidadeVisual.imagens &&

            dados.identidadeVisual.imagens[fase]

        ) {

            return

                dados.identidadeVisual.imagens[fase];

        }

    } catch (erro) {

        console.warn(

            "Erro identidade visual:",

            erro

        );

    }

    if (

        dados.imagens &&

        dados.imagens[fase]

    ) {

        return dados.imagens[fase];

    }

    let especie =

        dados.especie ||

        (

            dados.identidadeVisual &&

            dados.identidadeVisual.especie

        ) ||

        "gato";

    especie =

        String(especie)

            .toLowerCase();

    if (

        especie.includes("cachorro") ||

        especie.includes("cao") ||

        especie.includes("cão") ||

        especie.includes("dog")

    ) {

        return imagensFallback.cachorro;

    }

    if (

        especie.includes("coelho") ||

        especie.includes("rabbit")

    ) {

        return imagensFallback.coelho;

    }

    return imagensFallback.gato;

}

/* =========================================================

   ATUALIZAR PET

========================================================= */

function atualizarPetton() {

    const dados =

        carregarDadosPetton();

    if (!dados) {

        console.warn(

            "Petton não encontrado."

        );

        return;

    }

    /* NOME */

    const elementoNome =

        document.getElementById(

            "petNome"

        );

    if (elementoNome) {

        elementoNome.textContent =

            dados.nome ||

            "Meu Petton";

    }

    /* IDADE */

    let idade =

        "";

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.idadeTexto === "function"

        ) {

            idade =

                Petton.idadeTexto();

        }

    } catch (erro) {

        console.warn(

            "Erro idade:",

            erro

        );

    }

    if (!idade) {

        if (

            typeof dados.idadeDias ===

            "number"

        ) {

            idade =

                dados.idadeDias +

                (

                    dados.idadeDias === 1

                        ? " dia"

                        : " dias"

                );

        } else {

            idade =

                dados.fase ||

                "";

        }

    }

    const elementoIdade =

        document.getElementById(

            "petIdade"

        );

    if (elementoIdade) {

        elementoIdade.textContent =

            idade;

    }

    /* IMAGEM */

    const imagem =

        document.getElementById(

            "petImagem"

        );

    const caminho =

        obterImagemPet(

            dados

        );

    if (

        imagem &&

        caminho

    ) {

        imagem.src =

            caminho;

    }

    /* STATUS */

    atualizarStatus(

        dados

    );

    /* OBJETOS */

    atualizarObjetosQuarto();

}

/* =========================================================

   STATUS

========================================================= */

function atualizarStatus(dados) {

    const vida =

        obterValor(

            dados,

            [

                "vida",

                "saude",

                "saúde",

                "energia"

            ],

            100

        );

    const fome =

        obterValor(

            dados,

            [

                "fome",

                "alimentacao",

                "alimentação"

            ],

            100

        );

    const felicidade =

        obterValor(

            dados,

            [

                "felicidade",

                "diversao",

                "diversão"

            ],

            100

        );

    const higiene =

        obterValor(

            dados,

            [

                "higiene",

                "limpeza"

            ],

            100

        );

    colocarValor(

        "statusVida",

        vida

    );

    colocarValor(

        "statusFome",

        fome

    );

    colocarValor(

        "statusFelicidade",

        felicidade

    );

    colocarValor(

        "statusHigiene",

        higiene

    );

}

function obterValor(

    objeto,

    nomes,

    padrao

) {

    for (

        const nome of nomes

    ) {

        if (

            objeto &&

            objeto[nome] !== undefined &&

            objeto[nome] !== null

        ) {

            return objeto[nome];

        }

    }

    return padrao;

}

function colocarValor(

    id,

    valor

) {

    const elemento =

        document.getElementById(id);

    if (!elemento) {

        return;

    }

    if (

        typeof valor === "number"

    ) {

        valor =

            Math.round(

                valor

            );

    }

    elemento.textContent =

        valor;

}

/* =========================================================

   VOLTAR

========================================================= */

function voltarPetton() {

    try {

        if (

            window.history.length > 1

        ) {

            window.history.back();

            return;

        }

    } catch (erro) {

        console.warn(

            "Erro ao voltar:",

            erro

        );

    }

    window.location.href =

        "./index.html";

}

/* =========================================================

   LOJA

========================================================= */

function abrirLoja() {

    window.location.href =

        "./loja.html";

}

/* =========================================================

   INICIAR

========================================================= */

async function iniciarQuarto() {

    /*

     * Não usamos isInClient()

     * para bloquear esta página.

     */

    try {

        if (

            typeof liff !== "undefined"

        ) {

            try {

                await liff.init({

                    liffId:

                        LIFF_ID

                });

                console.log(

                    "Quarto: LIFF inicializado."

                );

            } catch (erroLiff) {

                console.warn(

                    "LIFF não inicializou:",

                    erroLiff

                );

            }

        }

    } catch (erro) {

        console.warn(

            "Erro LIFF:",

            erro

        );

    }

    const bloqueio =

        document.getElementById(

            "bloqueioLine"

        );

    const conteudo =

        document.getElementById(

            "conteudoQuarto"

        );

    if (bloqueio) {

        bloqueio.style.display =

            "none";

    }

    if (conteudo) {

        conteudo.style.display =

            "block";

    }

    atualizarPetton();

}

/* =========================================================

   INICIAR

========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        iniciarQuarto();

    }

);

</script>

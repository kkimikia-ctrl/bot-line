<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Petton 🏠</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="./petton.js"></script>

<style>

*{

    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

}

html,body{

    margin:0;

    padding:0;

    width:100%;

    height:100%;

    font-family:Arial,sans-serif;

    background:#f4eadf;

    color:#4a3428;

}

body{

    overflow:hidden;

}

/* =========================

   CABEÇALHO

========================= */

.header{

    height:64px;

    background:#fff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:10px 12px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);

    position:relative;

    z-index:50;

}

.header-title{

    font-size:20px;

    font-weight:bold;

}

.header-buttons{

    display:flex;

    gap:5px;

}

.header-button{

    border:0;

    background:#f2e3d5;

    color:#543a2c;

    border-radius:11px;

    padding:9px 10px;

    font-size:12px;

    font-weight:bold;

}

/* =========================

   QUARTO

========================= */

.quarto{

    position:relative;

    width:100%;

    height:calc(100vh - 64px);

    min-height:500px;

    overflow:hidden;

    background:

        linear-gradient(

            to bottom,

            #fff7ee 0%,

            #fff7ee 64%,

            #d8b28d 64%,

            #c5966d 100%

        );

}

.parede{

    position:absolute;

    inset:0 0 36% 0;

}

.chao{

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    height:36%;

    background:

        repeating-linear-gradient(

            90deg,

            rgba(120,80,50,.07) 0,

            rgba(120,80,50,.07) 2px,

            transparent 2px,

            transparent 80px

        ),

        linear-gradient(#d8b28d,#c5966d);

}

/* =========================

   PET

========================= */

.pet-area{

    position:absolute;

    left:50%;

    bottom:105px;

    transform:translateX(-50%);

    width:190px;

    height:240px;

    display:flex;

    justify-content:center;

    align-items:flex-end;

    z-index:10;

}

.pet-shadow{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:125px;

    height:21px;

    border-radius:50%;

    background:rgba(0,0,0,.13);

}

.pet-image{

    position:absolute;

    left:50%;

    bottom:0;

    transform:translateX(-50%);

    width:auto;

    height:auto;

    max-width:180px;

    max-height:220px;

    object-fit:contain;

    z-index:10;

    filter:drop-shadow(0 7px 5px rgba(0,0,0,.15));

}

/* =========================

   ACESSÓRIOS

========================= */

.acessorios-pet{

    position:absolute;

    left:50%;

    bottom:0;

    transform:translateX(-50%);

    width:180px;

    height:220px;

    z-index:20;

    pointer-events:none;

}

.acessorio{

    position:absolute;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:none;

    user-select:none;

    z-index:30;

    filter:drop-shadow(0 3px 2px rgba(0,0,0,.18));

    transition:none;

}

/* Chapéu */

.acessorio.chapeu{

    left:50%;

    top:0;

    width:75px;

    height:55px;

    font-size:48px;

    transform:

        translateX(-50%)

        translate(var(--ajuste-x,0px),var(--ajuste-y,0px))

        rotate(var(--ajuste-rotacao,0deg))

        scale(var(--ajuste-escala,1));

}

/* Coroa */

.acessorio.coroa{

    left:50%;

    top:0;

    width:70px;

    height:55px;

    font-size:43px;

    transform:

        translateX(-50%)

        translate(var(--ajuste-x,0px),var(--ajuste-y,0px))

        rotate(var(--ajuste-rotacao,0deg))

        scale(var(--ajuste-escala,1));

}

/* Lacinho */

.acessorio.lacinho{

    right:22px;

    top:45px;

    width:45px;

    height:45px;

    font-size:36px;

    transform:

        translate(var(--ajuste-x,0px),var(--ajuste-y,0px))

        rotate(var(--ajuste-rotacao,0deg))

        scale(var(--ajuste-escala,1));

}

/* Óculos */

.acessorio.oculos{

    left:50%;

    top:90px;

    width:85px;

    height:42px;

    font-size:42px;

    transform:

        translateX(-50%)

        translate(var(--ajuste-x,0px),var(--ajuste-y,0px))

        rotate(var(--ajuste-rotacao,0deg))

        scale(var(--ajuste-escala,1));

}

/* Lenço */

.acessorio.lenco{

    left:50%;

    bottom:25px;

    width:75px;

    height:45px;

    font-size:38px;

    transform:

        translateX(-50%)

        translate(var(--ajuste-x,0px),var(--ajuste-y,0px))

        rotate(var(--ajuste-rotacao,0deg))

        scale(var(--ajuste-escala,1));

}

/* acessório selecionado */

.acessorio-selecionado{

    outline:2px dashed #8b5e3c;

    outline-offset:5px;

}

/* =========================

   OBJETOS

========================= */

.objeto{

    position:absolute;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:5;

    filter:drop-shadow(0 4px 3px rgba(0,0,0,.15));

}

.cama-basica{

    left:15px;

    bottom:90px;

    width:120px;

    height:70px;

    border-radius:25px;

    background:#e8d5c2;

    border:4px solid #c6aa91;

    font-size:48px;

}

.cama{

    left:15px;

    bottom:90px;

    width:120px;

    height:75px;

    border-radius:25px;

    background:#f1c8d5;

    border:4px solid #d99aae;

    font-size:48px;

}

.casinha{

    left:15px;

    bottom:90px;

    font-size:75px;

}

.bola{

    right:35px;

    bottom:92px;

    font-size:50px;

}

.bolinha{

    right:105px;

    bottom:82px;

    font-size:38px;

}

.ratinho{

    left:35px;

    bottom:170px;

    font-size:45px;

}

.arranhador{

    right:20px;

    bottom:85px;

    font-size:68px;

}

.pelucia{

    left:145px;

    bottom:90px;

    font-size:48px;

}

.pote{

    left:25px;

    bottom:48px;

    font-size:40px;

}

.pote-agua{

    left:90px;

    bottom:48px;

    font-size:40px;

}

.planta{

    right:25px;

    bottom:165px;

    font-size:62px;

}

.flor{

    right:110px;

    bottom:55px;

    font-size:42px;

}

.tapete{

    left:50%;

    bottom:55px;

    transform:translateX(-50%);

    width:245px;

    height:80px;

    border-radius:50%;

    background:#c79ac8;

    border:5px solid rgba(120,70,120,.2);

    z-index:2;

}

.abajur{

    right:18px;

    bottom:255px;

    font-size:60px;

}

.quadro{

    position:absolute;

    top:45px;

    right:25px;

    width:82px;

    height:82px;

    border-radius:10px;

    background:white;

    border:7px solid #8d6749;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:45px;

    z-index:4;

}

/* =========================

   NOME

========================= */

.pet-name{

    position:absolute;

    left:50%;

    bottom:78px;

    transform:translateX(-50%);

    background:rgba(255,255,255,.92);

    padding:6px 13px;

    border-radius:14px;

    font-size:14px;

    font-weight:bold;

    z-index:35;

}

/* =========================

   PAINEL DE AJUSTE

========================= */

.ajuste-painel{

    position:fixed;

    left:50%;

    bottom:10px;

    transform:translateX(-50%);

    width:calc(100% - 18px);

    max-width:430px;

    background:rgba(255,255,255,.98);

    border-radius:20px;

    padding:12px;

    box-shadow:0 8px 30px rgba(0,0,0,.28);

    z-index:200;

    display:none;

}

.ajuste-painel.ativo{

    display:block;

}

.ajuste-titulo{

    text-align:center;

    font-size:17px;

    font-weight:bold;

    margin-bottom:3px;

}

.ajuste-info{

    text-align:center;

    font-size:12px;

    color:#755d4d;

    margin-bottom:8px;

}

.ajuste-select{

    width:100%;

    border:1px solid #d8c5b5;

    background:#fffaf5;

    border-radius:12px;

    padding:10px;

    font-size:15px;

    color:#4a3428;

    margin-bottom:8px;

}

.ajuste-botoes{

    display:grid;

    grid-template-columns:

        repeat(4,1fr);

    gap:6px;

    margin-bottom:6px;

}

.ajuste-btn{

    border:0;

    border-radius:12px;

    background:#f1e1d2;

    color:#4a3428;

    padding:9px 4px;

    font-size:18px;

    font-weight:bold;

}

.ajuste-btn:active{

    transform:scale(.94);

}

.ajuste-acoes{

    display:grid;

    grid-template-columns:

        1fr 1fr;

    gap:7px;

}

.ajuste-salvar,

.ajuste-fechar{

    border:0;

    border-radius:12px;

    padding:10px;

    font-size:14px;

    font-weight:bold;

}

.ajuste-salvar{

    background:#6e9b68;

    color:white;

}

.ajuste-fechar{

    background:#d8c0ae;

    color:#4a3428;

}

/* =========================

   RESPONSIVO

========================= */

@media(max-width:380px){

    .pet-area{

        width:165px;

        height:215px;

    }

    .pet-image{

        max-width:155px;

        max-height:200px;

    }

    .acessorios-pet{

        width:155px;

        height:200px;

    }

    .acessorio.lacinho{

        right:17px;

        top:42px;

    }

    .acessorio.oculos{

        top:84px;

    }

    .tapete{

        width:210px;

    }

    .quadro{

        right:15px;

    }

}

</style>

</head>

<body>

<header class="header">

    <div class="header-title">

        🏠 Quarto

    </div>

    <div class="header-buttons">

        <button

            class="header-button"

            onclick="abrirLoja()">

            🛒 Loja

        </button>

        <button

            class="header-button"

            onclick="abrirModoAjuste()">

            ⚙️ Ajustar

        </button>

        <button

            class="header-button"

            onclick="voltar()">

            ← Voltar

        </button>

    </div>

</header>

<main class="quarto">

    <div class="parede"></div>

    <div class="chao"></div>

    <div id="objetosComprados"></div>

    <div class="pet-area">

        <div class="pet-shadow"></div>

        <img

            id="petImagem"

            class="pet-image"

            src="./petton-original.png"

            alt="Petton">

        <div

            id="acessoriosPet"

            class="acessorios-pet">

        </div>

    </div>

    <div

        id="petNome"

        class="pet-name">

        Petton

    </div>

</main>

<!-- =====================================================

     PAINEL DE AJUSTE

===================================================== -->

<div

    id="ajustePainel"

    class="ajuste-painel">

    <div class="ajuste-titulo">

        ⚙️ TESTAR ACESSÓRIO

    </div>

    <div

        id="ajusteInfo"

        class="ajuste-info">

        O acessório aparece no Petton para você ajustar.

    </div>

    <select

        id="ajusteAcessorio"

        class="ajuste-select"

        onchange="selecionarAcessorio()">

        <option value="chapeu">

            🎩 Chapéu

        </option>

        <option value="coroa">

            👑 Coroa

        </option>

        <option value="lacinho">

            🎀 Lacinho

        </option>

        <option value="oculos">

            🕶️ Óculos

        </option>

        <option value="lenco">

            🧣 Lenço

        </option>

    </select>

    <!-- MOVIMENTO -->

    <div class="ajuste-botoes">

        <button

            class="ajuste-btn"

            onclick="moverAcessorio(0,-5)">

            ⬆️

        </button>

        <button

            class="ajuste-btn"

            onclick="moverAcessorio(-5,0)">

            ⬅️

        </button>

        <button

            class="ajuste-btn"

            onclick="moverAcessorio(5,0)">

            ➡️

        </button>

        <button

            class="ajuste-btn"

            onclick="moverAcessorio(0,5)">

            ⬇️

        </button>

    </div>

    <!-- TAMANHO / ROTAÇÃO -->

    <div class="ajuste-botoes">

        <button

            class="ajuste-btn"

            onclick="alterarTamanho(-0.05)">

            ➖

        </button>

        <button

            class="ajuste-btn"

            onclick="alterarTamanho(0.05)">

            ➕

        </button>

        <button

            class="ajuste-btn"

            onclick="girarAcessorio(-5)">

            ↶

        </button>

        <button

            class="ajuste-btn"

            onclick="girarAcessorio(5)">

            ↷

        </button>

    </div>

    <div class="ajuste-acoes">

        <button

            class="ajuste-salvar"

            onclick="salvarAjuste()">

            💾 Salvar

        </button>

        <button

            class="ajuste-fechar"

            onclick="fecharModoAjuste()">

            ✓ Fechar

        </button>

    </div>

</div>

<script>

const CHAVE_LOJA =

    "petton_loja_v1";

const CHAVE_PETTON =

    "petton_dados_v3";

const CHAVE_AJUSTES =

    "petton_acessorios_posicoes_v2";

let modoAjuste =

    false;

let acessorioSelecionado =

    "chapeu";

let ajusteAtual = {

    x:0,

    y:0,

    escala:1,

    rotacao:0

};

/* =========================================

   LIFF

========================================= */

async function iniciarLIFF(){

    try{

        if(

            typeof liff !== "undefined" &&

            liff.init

        ){

            await liff.init({

                liffId:

                "2010902449-KWNNNsxn"

            });

        }

    }catch(e){

        console.log(

            "LIFF:",

            e

        );

    }

}

/* =========================================

   PET

========================================= */

function obterDadosPetton(){

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.carregar

        ){

            return Petton.carregar();

        }

    }catch(e){}

    try{

        const salvo =

            localStorage.getItem(

                CHAVE_PETTON

            );

        return salvo

            ? JSON.parse(salvo)

            : null;

    }catch(e){

        return null;

    }

}

/* =========================================

   IMAGEM

========================================= */

function obterImagemPet(

    dados

){

    try{

        if(

            dados &&

            dados.identidadeVisual &&

            dados.identidadeVisual.imagens

        ){

            const fase =

                dados.fase || "bebe";

            if(

                dados

                .identidadeVisual

                .imagens[fase]

            ){

                return dados

                    .identidadeVisual

                    .imagens[fase];

            }

        }

    }catch(e){}

    /*

       Mantém a imagem existente do Petton

       caso não exista imagem de fase.

    */

    return "./petton-original.png";

}

/* =========================================

   ATUALIZAR PET

========================================= */

function atualizarPet(){

    const dados =

        obterDadosPetton();

    const imagem =

        document.getElementById(

            "petImagem"

        );

    const nome =

        document.getElementById(

            "petNome"

        );

    if(dados){

        nome.textContent =

            dados.nome || "Petton";

        imagem.src =

            obterImagemPet(

                dados

            );

    }

    mostrarAcessorios(

        dados

    );

}

/* =========================================

   INVENTÁRIO

========================================= */

function obterInventario(){

    try{

        const salvo =

            localStorage.getItem(

                CHAVE_LOJA

            );

        if(!salvo)

            return [];

        const lista =

            JSON.parse(

                salvo

            );

        return Array.isArray(lista)

            ? lista

            : [];

    }catch(e){

        return [];

    }

}

/* =========================================

   OBJETOS

========================================= */

function criarObjeto(

    classe,

    emoji

){

    const el =

        document.createElement(

            "div"

        );

    el.className =

        "objeto " +

        classe;

    el.textContent =

        emoji;

    return el;

}

function mostrarObjetosComprados(){

    const area =

        document.getElementById(

            "objetosComprados"

        );

    area.innerHTML =

        "";

    const inv =

        obterInventario();

    if(inv.includes("cama_basica"))

        area.appendChild(

            criarObjeto(

                "cama-basica",

                "🛏️"

            )

        );

    if(inv.includes("cama_rosa"))

        area.appendChild(

            criarObjeto(

                "cama",

                "🛌"

            )

        );

    if(inv.includes("cama_casinha"))

        area.appendChild(

            criarObjeto(

                "casinha",

                "🏠"

            )

        );

    if(inv.includes("bola"))

        area.appendChild(

            criarObjeto(

                "bola",

                "⚽"

            )

        );

    if(inv.includes("bolinha"))

        area.appendChild(

            criarObjeto(

                "bolinha",

                "🟠"

            )

        );

    if(inv.includes("ratinho"))

        area.appendChild(

            criarObjeto(

                "ratinho",

                "🐭"

            )

        );

    if(inv.includes("arranhador"))

        area.appendChild(

            criarObjeto(

                "arranhador",

                "🪵"

            )

        );

    if(inv.includes("pelucia"))

        area.appendChild(

            criarObjeto(

                "pelucia",

                "🧸"

            )

        );

    if(inv.includes("pote"))

        area.appendChild(

            criarObjeto(

                "pote",

                "🍚"

            )

        );

    if(inv.includes("pote_agua"))

        area.appendChild(

            criarObjeto(

                "pote-agua",

                "💧"

            )

        );

    if(inv.includes("planta"))

        area.appendChild(

            criarObjeto(

                "planta",

                "🌱"

            )

        );

    if(inv.includes("flor"))

        area.appendChild(

            criarObjeto(

                "flor",

                "🌸"

            )

        );

    if(inv.includes("tapete"))

        area.appendChild(

            criarObjeto(

                "tapete",

                ""

            )

        );

    if(inv.includes("abajur"))

        area.appendChild(

            criarObjeto(

                "abajur",

                "🛋️"

            )

        );

    if(inv.includes("quadro"))

        area.appendChild(

            criarObjeto(

                "quadro",

                "🖼️"

            )

        );

}

/* =========================================

   ACESSÓRIOS

========================================= */

function mostrarAcessorios(

    dados

){

    const area =

        document.getElementById(

            "acessoriosPet"

        );

    area.innerHTML =

        "";

    /*

       Fora do modo ajuste:

       mostra somente os acessórios equipados.

    */

    if(

        !modoAjuste &&

        dados &&

        dados.acessorios

    ){

        if(dados.acessorios.chapeu)

            adicionarAcessorio(

                "chapeu",

                dados.acessorios.chapeu

            );

        if(dados.acessorios.oculos)

            adicionarAcessorio(

                "oculos",

                dados.acessorios.oculos

            );

        if(dados.acessorios.lacinho)

            adicionarAcessorio(

                "lacinho",

                dados.acessorios.lacinho

            );

        if(dados.acessorios.coroa)

            adicionarAcessorio(

                "coroa",

                dados.acessorios.coroa

            );

        if(dados.acessorios.lenco)

            adicionarAcessorio(

                "lenco",

                dados.acessorios.lenco

            );

    }

    /*

       NO MODO AJUSTE:

       sempre cria o acessório escolhido,

       mesmo sem estar comprado.

    */

    if(modoAjuste){

        adicionarAcessorio(

            acessorioSelecionado,

            "preview_" +

            acessorioSelecionado,

            true

        );

        carregarAjusteAtual();

        aplicarAjuste();

    }

}

/* =========================================

   CRIAR ACESSÓRIO

========================================= */

function adicionarAcessorio(

    tipo,

    id,

    preview=false

){

    const area =

        document.getElementById(

            "acessoriosPet"

        );

    const el =

        document.createElement(

            "div"

        );

    el.className =

        "acessorio " +

        tipo;

    el.dataset.id =

        id;

    if(preview){

        el.classList.add(

            "acessorio-selecionado"

        );

    }

    if(tipo === "chapeu")

        el.textContent =

            "🎩";

    if(tipo === "coroa")

        el.textContent =

            "👑";

    if(tipo === "lacinho")

        el.textContent =

            "🎀";

    if(tipo === "oculos")

        el.textContent =

            "🕶️";

    if(tipo === "lenco")

        el.textContent =

            "🧣";

    area.appendChild(

        el

    );

}

/* =========================================

   AJUSTE

========================================= */

function abrirModoAjuste(){

    modoAjuste =

        true;

    document

        .getElementById(

            "ajustePainel"

        )

        .classList.add(

            "ativo"

        );

    document.body.classList.add(

        "modo-ajuste"

    );

    selecionarAcessorio();

}

function fecharModoAjuste(){

    modoAjuste =

        false;

    document

        .getElementById(

            "ajustePainel"

        )

        .classList.remove(

            "ativo"

        );

    document.body.classList.remove(

        "modo-ajuste"

    );

    atualizarPet();

}

/* =========================================

   SELECIONAR

========================================= */

function selecionarAcessorio(){

    acessorioSelecionado =

        document.getElementById(

            "ajusteAcessorio"

        ).value;

    /*

       Cria imediatamente o acessório

       sobre o Petton.

    */

    mostrarAcessorios(

        obterDadosPetton()

    );

    const dados =

        obterDadosPetton();

    const info =

        document.getElementById(

            "ajusteInfo"

        );

    info.textContent =

        "Veja o acessório sobre o Petton e ajuste a posição.";

}

/* =========================================

   POSIÇÃO

========================================= */

function obterChaveAjuste(){

    const dados =

        obterDadosPetton();

    const especie =

        dados &&

        dados.especie

        ? dados.especie

        : "pet";

    const fase =

        dados &&

        dados.fase

        ? dados.fase

        : "bebe";

    return (

        especie +

        "_" +

        fase +

        "_" +

        acessorioSelecionado

    );

}

function carregarAjusteAtual(){

    try{

        const salvo =

            localStorage.getItem(

                CHAVE_AJUSTES

            );

        const todos =

            salvo

            ? JSON.parse(salvo)

            : {};

        const chave =

            obterChaveAjuste();

        if(todos[chave]){

            ajusteAtual = {

                x:

                    Number(

                        todos[chave].x

                    ) || 0,

                y:

                    Number(

                        todos[chave].y

                    ) || 0,

                escala:

                    Number(

                        todos[chave].escala

                    ) || 1,

                rotacao:

                    Number(

                        todos[chave].rotacao

                    ) || 0

            };

        }else{

            ajusteAtual = {

                x:0,

                y:0,

                escala:1,

                rotacao:0

            };

        }

    }catch(e){

        ajusteAtual = {

            x:0,

            y:0,

            escala:1,

            rotacao:0

        };

    }

}

function aplicarAjuste(){

    const el =

        document.querySelector(

            ".acessorio." +

            acessorioSelecionado

        );

    if(!el)

        return;

    el.style.setProperty(

        "--ajuste-x",

        ajusteAtual.x +

        "px"

    );

    el.style.setProperty(

        "--ajuste-y",

        ajusteAtual.y +

        "px"

    );

    el.style.setProperty(

        "--ajuste-escala",

        ajusteAtual.escala

    );

    el.style.setProperty(

        "--ajuste-rotacao",

        ajusteAtual.rotacao +

        "deg"

    );

}

function moverAcessorio(

    x,

    y

){

    ajusteAtual.x += x;

    ajusteAtual.y += y;

    aplicarAjuste();

}

function alterarTamanho(

    valor

){

    ajusteAtual.escala +=

        valor;

    if(

        ajusteAtual.escala <

        0.4

    )

        ajusteAtual.escala =

            0.4;

    if(

        ajusteAtual.escala >

        2

    )

        ajusteAtual.escala =

            2;

    aplicarAjuste();

}

function girarAcessorio(

    valor

){

    ajusteAtual.rotacao +=

        valor;

    aplicarAjuste();

}

/* =========================================

   SALVAR

========================================= */

function salvarAjuste(){

    try{

        const salvo =

            localStorage.getItem(

                CHAVE_AJUSTES

            );

        const todos =

            salvo

            ? JSON.parse(salvo)

            : {};

        todos[

            obterChaveAjuste()

        ] = {

            x:

                ajusteAtual.x,

            y:

                ajusteAtual.y,

            escala:

                ajusteAtual.escala,

            rotacao:

                ajusteAtual.rotacao

        };

        localStorage.setItem(

            CHAVE_AJUSTES,

            JSON.stringify(

                todos

            )

        );

        document

            .getElementById(

                "ajusteInfo"

            )

            .textContent =

            "✅ Posição salva!";

    }catch(e){

        alert(

            "Não foi possível salvar."

        );

    }

}

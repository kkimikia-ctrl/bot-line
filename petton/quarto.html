<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Petton 🏠</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="./petton.js"></script>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family: Arial, sans-serif;

    background: #f4eadf;

    color: #4a3428;

}

body {

    overflow-x: hidden;

}

/* =========================================================

   CABEÇALHO

========================================================= */

.header {

    width: 100%;

    background: #ffffff;

    padding: 14px 16px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);

    position: relative;

    z-index: 20;

}

.header-title {

    font-size: 21px;

    font-weight: bold;

}

.header-buttons {

    display: flex;

    gap: 8px;

}

.header-button {

    border: none;

    background: #f2e3d5;

    border-radius: 12px;

    padding: 9px 13px;

    font-size: 14px;

    font-weight: bold;

    color: #543a2c;

}

/* =========================================================

   QUARTO

========================================================= */

.quarto {

    position: relative;

    width: 100%;

    height: calc(100vh - 67px);

    min-height: 560px;

    overflow: hidden;

    background:

        linear-gradient(

            to bottom,

            #fff7ee 0%,

            #fff7ee 64%,

            #d8b28d 64%,

            #c99d75 100%

        );

}

/* =========================================================

   PAREDE

========================================================= */

.parede {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 64%;

    background:

        linear-gradient(

            90deg,

            rgba(255,255,255,.35),

            rgba(255,255,255,0)

        );

}

/* =========================================================

   CHÃO

========================================================= */

.chao {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    height: 36%;

    background:

        repeating-linear-gradient(

            90deg,

            rgba(120,80,50,.08) 0,

            rgba(120,80,50,.08) 2px,

            transparent 2px,

            transparent 80px

        ),

        linear-gradient(

            #d8b28d,

            #c5966d

        );

}

/* =========================================================

   ÁREA DO PET

========================================================= */

.pet-area {

    position: absolute;

    left: 50%;

    bottom: 105px;

    transform: translateX(-50%);

    width: 190px;

    height: 230px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    z-index: 8;

}

/* =========================================================

   IMAGEM DO PET

========================================================= */

.pet-image {

    max-width: 175px;

    max-height: 210px;

    width: auto;

    height: auto;

    object-fit: contain;

    display: block;

    filter:

        drop-shadow(0 7px 5px rgba(0,0,0,.15));

    position: relative;

    z-index: 8;

}

/* =========================================================

   CAMADA DOS ACESSÓRIOS

   Agora ela acompanha a área REAL da imagem.

========================================================= */

.acessorios-pet {

    position: absolute;

    left: 50%;

    bottom: 0;

    width: 175px;

    height: 210px;

    transform: translateX(-50%);

    pointer-events: none;

    z-index: 10;

}

/* =========================================================

   ACESSÓRIO BASE

========================================================= */

.acessorio {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;

    user-select: none;

    filter:

        drop-shadow(0 3px 2px rgba(0,0,0,.18));

    z-index: 20;

}

/* =========================================================

   CHAPÉU

========================================================= */

.acessorio.chapeu {

    top: 2px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 48px;

    width: 75px;

    height: 55px;

}

/* =========================================================

   COROA

========================================================= */

.acessorio.coroa {

    top: 0;

    left: 50%;

    transform: translateX(-50%);

    font-size: 43px;

    width: 70px;

    height: 50px;

}

/* =========================================================

   LACINHO

   CORRIGIDO:

   antes ficava flutuando acima da cabeça.

   Agora fica na altura da cabeça/orelha.

========================================================= */

.acessorio.lacinho {

    top: 88px;

    right: 1px;

    width: 43px;

    height: 43px;

    font-size: 36px;

    transform: rotate(-2deg);

}

/* =========================================================

   ÓCULOS

   Ficam sobre a região dos olhos.

========================================================= */

.acessorio.oculos {

    top: 92px;

    left: 50%;

    transform: translateX(-50%);

    width: 82px;

    height: 42px;

    font-size: 42px;

}

/* =========================================================

   LENÇO

========================================================= */

.acessorio.lenco {

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    width: 70px;

    height: 45px;

    font-size: 37px;

}

/* =========================================================

   SOMBRA

========================================================= */

.pet-shadow {

    position: absolute;

    bottom: 0;

    left: 50%;

    transform: translateX(-50%);

    width: 120px;

    height: 20px;

    border-radius: 50%;

    background: rgba(0,0,0,.13);

    z-index: -1;

}

/* =========================================================

   OBJETOS

========================================================= */

.objeto {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    user-select: none;

    z-index: 6;

    filter:

        drop-shadow(0 4px 3px rgba(0,0,0,.15));

}

/* =========================================================

   CAMA BÁSICA

========================================================= */

.cama-basica {

    left: 15px;

    bottom: 90px;

    width: 120px;

    height: 70px;

    border-radius: 25px;

    background: #e8d5c2;

    border: 4px solid #c6aa91;

    font-size: 48px;

}

/* =========================================================

   CAMA ROSA

========================================================= */

.cama {

    left: 16px;

    bottom: 92px;

    width: 115px;

    height: 75px;

    border-radius: 25px;

    background: #f1c8d5;

    border: 4px solid #d99aae;

    font-size: 48px;

}

/* =========================================================

   CASINHA

========================================================= */

.casinha {

    left: 15px;

    bottom: 90px;

    width: 125px;

    height: 105px;

    font-size: 75px;

}

/* =========================================================

   BOLA

========================================================= */

.bola {

    right: 35px;

    bottom: 92px;

    width: 60px;

    height: 60px;

    font-size: 50px;

}

/* =========================================================

   BOLINHA

========================================================= */

.bolinha {

    right: 105px;

    bottom: 82px;

    width: 45px;

    height: 45px;

    font-size: 38px;

}

/* =========================================================

   RATINHO

========================================================= */

.ratinho {

    left: 35px;

    bottom: 170px;

    width: 55px;

    height: 55px;

    font-size: 45px;

}

/* =========================================================

   ARRANHADOR

========================================================= */

.arranhador {

    right: 20px;

    bottom: 85px;

    width: 75px;

    height: 105px;

    font-size: 68px;

}

/* =========================================================

   PELÚCIA

========================================================= */

.pelucia {

    left: 145px;

    bottom: 90px;

    width: 55px;

    height: 55px;

    font-size: 48px;

}

/* =========================================================

   POTE

========================================================= */

.pote {

    left: 25px;

    bottom: 48px;

    width: 55px;

    height: 45px;

    font-size: 40px;

}

/* =========================================================

   ÁGUA

========================================================= */

.pote-agua {

    left: 90px;

    bottom: 48px;

    width: 55px;

    height: 45px;

    font-size: 40px;

}

/* =========================================================

   PLANTA

========================================================= */

.planta {

    right: 25px;

    bottom: 165px;

    width: 70px;

    height: 80px;

    font-size: 62px;

}

/* =========================================================

   FLOR

========================================================= */

.flor {

    right: 110px;

    bottom: 55px;

    width: 50px;

    height: 50px;

    font-size: 42px;

}

/* =========================================================

   TAPETE

========================================================= */

.tapete {

    left: 50%;

    bottom: 55px;

    transform: translateX(-50%);

    width: 245px;

    height: 80px;

    border-radius: 50%;

    background:

        radial-gradient(

            ellipse,

            #d9b6d8 0%,

            #c79ac8 65%,

            #b47fb5 100%

        );

    border: 5px solid rgba(120,70,120,.2);

    z-index: 2;

}

/* =========================================================

   ABAJUR

========================================================= */

.abajur {

    right: 18px;

    bottom: 255px;

    width: 75px;

    height: 90px;

    font-size: 60px;

}

/* =========================================================

   QUADRO

========================================================= */

.quadro {

    position: absolute;

    top: 45px;

    right: 25px;

    width: 82px;

    height: 82px;

    border-radius: 10px;

    background: #fff;

    border: 7px solid #8d6749;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 45px;

    box-shadow:

        0 4px 8px rgba(0,0,0,.15);

    z-index: 4;

}

/* =========================================================

   NOME

========================================================= */

.pet-name {

    position: absolute;

    left: 50%;

    bottom: 78px;

    transform: translateX(-50%);

    background: rgba(255,255,255,.9);

    padding: 6px 13px;

    border-radius: 14px;

    font-weight: bold;

    font-size: 14px;

    z-index: 12;

    box-shadow:

        0 2px 6px rgba(0,0,0,.1);

}

/* =========================================================

   QUARTO VAZIO

========================================================= */

.quarto-vazio {

    position: absolute;

    left: 50%;

    top: 48%;

    transform: translate(-50%, -50%);

    width: 250px;

    text-align: center;

    color: rgba(90,65,50,.65);

    font-size: 14px;

    z-index: 1;

}

/* =========================================================

   RESPONSIVO

========================================================= */

@media (max-width: 380px) {

    .pet-area {

        bottom: 105px;

        width: 165px;

    }

    .pet-image {

        max-width: 155px;

        max-height: 190px;

    }

    .acessorios-pet {

        width: 155px;

        height: 190px;

    }

    /* LACINHO NO CELULAR PEQUENO */

    .acessorio.lacinho {

        top: 80px;

        right: 0;

        font-size: 34px;

    }

    /* ÓCULOS */

    .acessorio.oculos {

        top: 84px;

        font-size: 39px;

    }

    .tapete {

        width: 210px;

    }

    .cama,

    .cama-basica {

        left: 8px;

    }

    .bola {

        right: 20px;

    }

    .quadro {

        right: 15px;

    }

}

/* =========================================================

   MENSAGEM

========================================================= */

.mensagem {

    display: none;

}

</style>

</head>

<body>

<header class="header">

    <div class="header-title">

        🏠 Quarto

    </div>

    <div class="header-buttons">

        <button

            class="header-button"

            onclick="abrirLoja()">

            🛒 Loja

        </button>

        <button

            class="header-button"

            onclick="voltar()">

            ← Voltar

        </button>

    </div>

</header>

<main class="quarto">

    <div class="parede"></div>

    <div class="chao"></div>

    <div

        class="mensagem"

        id="mensagem">

        Seu quarto 🐾

    </div>

    <!-- OBJETOS COMPRADOS -->

    <div id="objetosComprados"></div>

    <!-- PET -->

    <div class="pet-area">

        <div class="pet-shadow"></div>

        <img

            id="petImagem"

            class="pet-image"

            src="./39CE7A33-D105-4E83-BF3B-DDE48E046D60.png"

            alt="Petton">

        <!-- ACESSÓRIOS -->

        <div

            id="acessoriosPet"

            class="acessorios-pet">

        </div>

    </div>

    <div

        id="petNome"

        class="pet-name">

        Petton

    </div>

    <div

        id="quartoVazio"

        class="quarto-vazio">

    </div>

</main>

<script>

/* =========================================================

   CONFIGURAÇÃO

========================================================= */

const CHAVE_LOJA =

    "petton_loja_v1";

const CHAVE_PETTON =

    "petton_dados_v3";

/* =========================================================

   LIFF

========================================================= */

async function iniciarLIFF() {

    try {

        if (

            typeof liff !== "undefined" &&

            typeof liff.init === "function"

        ) {

            await liff.init({

                liffId:

                    "2010902449-KWNNNsxn"

            });

            console.log(

                "Petton Quarto: LIFF iniciado."

            );

        }

    } catch (erro) {

        console.error(

            "Erro ao iniciar LIFF:",

            erro

        );

    }

}

/* =========================================================

   INVENTÁRIO

========================================================= */

function obterInventario() {

    try {

        const salvo =

            localStorage.getItem(

                CHAVE_LOJA

            );

        if (!salvo) {

            return [];

        }

        const inventario =

            JSON.parse(salvo);

        if (

            !Array.isArray(inventario)

        ) {

            return [];

        }

        return inventario;

    } catch (erro) {

        console.error(

            "Erro ao ler inventário:",

            erro

        );

        return [];

    }

}

/* =========================================================

   DADOS DO PET

========================================================= */

function obterDadosPetton() {

    try {

        if (

            typeof Petton !== "undefined" &&

            typeof Petton.carregar === "function"

        ) {

            return Petton.carregar();

        }

    } catch (erro) {

        console.error(

            "Erro ao carregar Petton:",

            erro

        );

    }

    try {

        const salvo =

            localStorage.getItem(

                CHAVE_PETTON

            );

        if (!salvo) {

            return null;

        }

        return JSON.parse(salvo);

    } catch (erro) {

        console.error(

            "Erro ao ler dados do Petton:",

            erro

        );

        return null;

    }

}

/* =========================================================

   IMAGEM DO PET

========================================================= */

function obterImagemPet(dados) {

    try {

        if (

            dados &&

            dados.identidadeVisual &&

            dados.identidadeVisual.imagens

        ) {

            const fase =

                dados.fase || "bebe";

            const imagem =

                dados.identidadeVisual.imagens[fase];

            if (imagem) {

                return imagem;

            }

        }

    } catch (erro) {

        console.error(

            "Erro ao obter imagem:",

            erro

        );

    }

    return "./39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

}

/* =========================================================

   ATUALIZAR PET

========================================================= */

function atualizarPet() {

    const dados =

        obterDadosPetton();

    const imagem =

        document.getElementById(

            "petImagem"

        );

    const nome =

        document.getElementById(

            "petNome"

        );

    if (!dados) {

        nome.textContent =

            "Petton";

        imagem.src =

            "./39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

        mostrarAcessorios(null);

        return;

    }

    if (dados.nome) {

        nome.textContent =

            dados.nome;

    } else {

        nome.textContent =

            "Petton";

    }

    const imagemPet =

        obterImagemPet(dados);

    if (imagemPet) {

        imagem.src =

            imagemPet;

    }

    mostrarAcessorios(dados);

}

/* =========================================================

   ACESSÓRIOS

========================================================= */

function mostrarAcessorios(dados) {

    const area =

        document.getElementById(

            "acessoriosPet"

        );

    if (!area) {

        return;

    }

    area.innerHTML = "";

    if (

        !dados ||

        !dados.acessorios

    ) {

        return;

    }

    const acessorios =

        dados.acessorios;

    if (acessorios.chapeu) {

        adicionarAcessorio(

            "chapeu",

            acessorios.chapeu

        );

    }

    if (acessorios.oculos) {

        adicionarAcessorio(

            "oculos",

            acessorios.oculos

        );

    }

    if (acessorios.lacinho) {

        adicionarAcessorio(

            "lacinho",

            acessorios.lacinho

        );

    }

    if (acessorios.coroa) {

        adicionarAcessorio(

            "coroa",

            acessorios.coroa

        );

    }

    if (acessorios.lenco) {

        adicionarAcessorio(

            "lenco",

            acessorios.lenco

        );

    }

}

/* =========================================================

   ADICIONAR ACESSÓRIO

========================================================= */

function adicionarAcessorio(

    tipo,

    id

) {

    const area =

        document.getElementById(

            "acessoriosPet"

        );

    if (!area) {

        return;

    }

    const elemento =

        document.createElement(

            "div"

        );

    elemento.className =

        "acessorio " +

        tipo;

    let simbolo = "";

    /* CHAPÉU */

    if (tipo === "chapeu") {

        if (

            id === "chapeu_palha"

        ) {

            simbolo = "👒";

        } else {

            simbolo = "🎩";

        }

    }

    /* ÓCULOS */

    if (tipo === "oculos") {

        if (

            id === "oculos_sol"

        ) {

            simbolo = "🕶️";

        } else {

            simbolo = "👓";

        }

    }

    /* LACINHO */

    if (tipo === "lacinho") {

        simbolo = "🎀";

    }

    /* COROA */

    if (tipo === "coroa") {

        simbolo = "👑";

    }

    /* LENÇO */

    if (tipo === "lenco") {

        simbolo = "🧣";

    }

    elemento.textContent =

        simbolo;

    elemento.dataset.id =

        id;

    area.appendChild(

        elemento

    );

}

/* =========================================================

   CRIAR OBJETO

========================================================= */

function criarObjeto(

    classe,

    conteudo,

    id

) {

    const elemento =

        document.createElement(

            "div"

        );

    elemento.className =

        "objeto " + classe;

    elemento.textContent =

        conteudo;

    elemento.id =

        id;

    return elemento;

}

/* =========================================================

   OBJETOS COMPRADOS

========================================================= */

function mostrarObjetosComprados() {

    const area =

        document.getElementById(

            "objetosComprados"

        );

    area.innerHTML = "";

    const inventario =

        obterInventario();

    /* CAMA BÁSICA */

    if (

        inventario.includes(

            "cama_basica"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "cama-basica",

                "🛏️",

                "objetoCamaBasica"

            )

        );

    }

    /* CAMA ROSA */

    if (

        inventario.includes(

            "cama_rosa"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "cama",

                "🛌",

                "objetoCamaRosa"

            )

        );

    }

    /* CASINHA */

    if (

        inventario.includes(

            "cama_casinha"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "casinha",

                "🏠",

                "objetoCasinha"

            )

        );

    }

    /* BOLA */

    if (

        inventario.includes(

            "bola"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "bola",

                "⚽",

                "objetoBola"

            )

        );

    }

    /* BOLINHA */

    if (

        inventario.includes(

            "bolinha"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "bolinha",

                "🟠",

                "objetoBolinha"

            )

        );

    }

    /* RATINHO */

    if (

        inventario.includes(

            "ratinho"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "ratinho",

                "🐭",

                "objetoRatinho"

            )

        );

    }

    /* ARRANHADOR */

    if (

        inventario.includes(

            "arranhador"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "arranhador",

                "🪵",

                "objetoArranhador"

            )

        );

    }

    /* PELÚCIA */

    if (

        inventario.includes(

            "pelucia"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "pelucia",

                "🧸",

                "objetoPelucia"

            )

        );

    }

    /* POTE */

    if (

        inventario.includes(

            "pote"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "pote",

                "🍚",

                "objetoPote"

            )

        );

    }

    /* ÁGUA */

    if (

        inventario.includes(

            "pote_agua"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "pote-agua",

                "💧",

                "objetoAgua"

            )

        );

    }

    /* PLANTA */

    if (

        inventario.includes(

            "planta"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "planta",

                "🌱",

                "objetoPlanta"

            )

        );

    }

    /* FLOR */

    if (

        inventario.includes(

            "flor"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "flor",

                "🌸",

                "objetoFlor"

            )

        );

    }

    /* TAPETE */

    if (

        inventario.includes(

            "tapete"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "tapete",

                "",

                "objetoTapete"

            )

        );

    }

    /* ABAJUR */

    if (

        inventario.includes(

            "abajur"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "abajur",

                "🛋️",

                "objetoAbajur"

            )

        );

    }

    /* QUADRO */

    if (

        inventario.includes(

            "quadro"

        )

    ) {

        area.appendChild(

            criarObjeto(

                "quadro",

                "🖼️",

                "objetoQuadro"

            )

        );

    }

    /* QUARTO VAZIO */

    const vazio =

        document.getElementById(

            "quartoVazio"

        );

    if (

        inventario.length === 0

    ) {

        vazio.textContent =

            "Seu quarto ainda está vazio.\n🛒 Compre objetos na loja para decorar.";

        vazio.style.whiteSpace =

            "pre-line";

    } else {

        vazio.textContent =

            "";

    }

}

/* =========================================================

   LOJA

========================================================= */

function abrirLoja() {

    try {

        window.location.href =

            "./loja.html";

    } catch (erro) {

        console.error(

            "Erro ao abrir loja:",

            erro

        );

    }

}

/* =========================================================

   VOLTAR

========================================================= */

function voltar() {

    try {

        if (

            window.history.length > 1

        ) {

            window.history.back();

            return;

        }

    } catch (erro) {

        console.error(

            "Erro ao voltar:",

            erro

        );

    }

    try {

        window.location.href =

            "./index.html";

    } catch (erro2) {

        console.error(

            "Erro final ao voltar:",

            erro2

        );

    }

}

/* =========================================================

   ATUALIZAR QUARTO

========================================================= */

function atualizarQuarto() {

    atualizarPet();

    mostrarObjetosComprados();

}

/* =========================================================

   INICIAR

========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    async function() {

        await iniciarLIFF();

        atualizarQuarto();

    }

);

/* =========================================================

   AO VOLTAR PARA A PÁGINA

========================================================= */

window.addEventListener(

    "pageshow",

    function() {

        atualizarQuarto();

    }

);

/* =========================================================

   QUANDO O INVENTÁRIO/PET MUDAR

========================================================= */

window.addEventListener(

    "storage",

    function(evento) {

        if (

            evento.key === CHAVE_LOJA ||

            evento.key === CHAVE_PETTON

        ) {

            atualizarQuarto();

        }

    }

);

/* =========================================================

   ATUALIZAÇÃO AUTOMÁTICA

========================================================= */

setInterval(

    function() {

        atualizarQuarto();

    },

    3000

);

</script>

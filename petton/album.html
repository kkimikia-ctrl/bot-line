<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Álbum do Petton</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

    background:linear-gradient(180deg,#fff7ed,#fdf2f8,#f5f3ff);

    color:#333;

    min-height:100vh;

}

.container{

    max-width:700px;

    margin:auto;

    padding:18px;

}

.topo{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:18px;

}

.voltar{

    width:42px;

    height:42px;

    border:0;

    border-radius:14px;

    background:white;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    font-size:22px;

}

.titulo{

    flex:1;

}

.titulo h1{

    margin:0;

    font-size:23px;

}

.titulo p{

    margin:3px 0 0;

    color:#777;

    font-size:13px;

}

.card{

    background:white;

    border-radius:24px;

    padding:20px;

    margin-bottom:16px;

    box-shadow:0 5px 20px rgba(0,0,0,.07);

}

.resumo{

    text-align:center;

}

.pet-visual{

    width:120px;

    height:120px;

    margin:5px auto 12px;

    display:flex;

    align-items:center;

    justify-content:center;

}

.pet-visual img{

    max-width:110px;

    max-height:110px;

    object-fit:contain;

}

.pet-emoji{

    font-size:78px;

    line-height:1;

}

.nome{

    font-size:25px;

    font-weight:800;

}

.sub{

    color:#777;

    font-size:14px;

    margin-top:5px;

}

.contador{

    display:inline-block;

    margin-top:12px;

    padding:8px 15px;

    border-radius:20px;

    background:#fce7f3;

    color:#be185d;

    font-weight:700;

    font-size:13px;

}

.album{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:13px;

}

.momento{

    border-radius:20px;

    background:#fafafa;

    padding:12px;

    border:2px solid #eee;

    position:relative;

    overflow:hidden;

}

.momento.liberado{

    border-color:#ddd6fe;

    background:#faf9ff;

}

.momento.atual{

    border-color:#f9a8d4;

    background:#fff7fb;

}

.momento.bloqueado{

    opacity:.55;

}

.momento-topo{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:5px;

}

.dia{

    font-size:17px;

    font-weight:800;

}

.status{

    font-size:18px;

}

.foto{

    height:145px;

    margin-top:10px;

    border-radius:16px;

    background:linear-gradient(180deg,#f8fafc,#f1f5f9);

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:hidden;

}

.foto img.foto-usuario{

    width:100%;

    height:100%;

    object-fit:cover;

}

.pet-foto{

    width:110px;

    height:110px;

    display:flex;

    align-items:center;

    justify-content:center;

}

.pet-foto img{

    max-width:100px;

    max-height:100px;

    object-fit:contain;

}

.pet-foto-emoji{

    font-size:72px;

    line-height:1;

}

.bloqueio{

    font-size:38px;

}

.data{

    margin-top:9px;

    font-size:12px;

    color:#888;

}

.descricao{

    margin-top:5px;

    font-size:13px;

    font-weight:600;

}

.detalhe{

    margin-top:3px;

    font-size:11px;

    color:#888;

    line-height:1.4;

}

.info{

    line-height:1.6;

    color:#666;

    font-size:14px;

}

.botao{

    display:block;

    width:100%;

    border:0;

    border-radius:16px;

    padding:14px;

    background:#ec4899;

    color:white;

    font-size:16px;

    font-weight:700;

    margin-top:15px;

}

.botao-foto{

    display:block;

    width:100%;

    border:0;

    border-radius:14px;

    padding:11px;

    background:#f472b6;

    color:white;

    font-size:14px;

    font-weight:700;

    margin-top:11px;

}

.botao-foto:active{

    transform:scale(.98);

}

.rodape{

    text-align:center;

    color:#999;

    font-size:12px;

    padding:5px 0 25px;

}

@media(max-width:390px){

    .album{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="topo">

        <button

            class="voltar"

            onclick="history.back()">

            ←

        </button>

        <div class="titulo">

            <h1>📖 Álbum do Petton</h1>

            <p>

            </p>

        </div>

    </div>

    <div id="conteudo">

        <div class="card resumo">

            <div class="pet-visual">

                <div class="pet-emoji">

                    🐾

                </div>

            </div>

            <p>

                Carregando...

            </p>

        </div>

    </div>

</div>

<script src="petton.js"></script>

<script>

let dados = null;

let assinaturaAnterior = "";

/* =========================================================

   MOMENTOS

========================================================= */

const momentos = [

    {

        dia:0,

        emoji:"🥚",

        titulo:"O começo",

        descricao:"O ovo",

        detalhe:"Tudo começa aqui."

    },

    {

    },

    {

        dia:7,

    },

    {

        dia:15,

        emoji:"🐱",

        titulo:"15 dias",

        descricao:"Crescendo rápido",

        detalhe:"O corpo e as características começam a mudar bastante."

    },

    {

        dia:30,

        emoji:"🐈",

        titulo:"1 mês",

        descricao:"Grande mudança",

        detalhe:"Já parece muito mais com um verdadeiro filhote."

    },

    {

        dia:60,

        emoji:"🐈‍⬛",

        titulo:"2 meses",

        descricao:"Petton jovem",

        detalhe:"A aparência está cada vez mais definida."

    },

    {

        dia:90,

        emoji:"✨",

        titulo:"3 meses",

        descricao:"Jovem",

        detalhe:"Uma nova fase começa."

    },

    {

        dia:120,

        emoji:"👑",

        titulo:"120 dias",

        descricao:"Adulto desenvolvido",

        detalhe:"Uma grande etapa da vida do Petton."

    }

];

/* =========================================================

   FOTOS SALVAS

========================================================= */

const CHAVE_FOTOS = "petton_album_fotos_v1";

function carregarFotos(){

    try{

        const salvo =

            localStorage.getItem(CHAVE_FOTOS);

        if(!salvo){

            return {};

        }

        const fotos = JSON.parse(salvo);

        if(

            fotos &&

            typeof fotos === "object"

        ){

            return fotos;

        }

    }catch(e){

        console.log(

            "Erro ao carregar fotos:",

            e

        );

    }

    return {};

}

function salvarFotos(fotos){

    try{

        localStorage.setItem(

            CHAVE_FOTOS,

            JSON.stringify(fotos)

        );

        return true;

    }catch(e){

        console.log(

            "Erro ao salvar foto:",

            e

        );

        return false;

    }

}

function obterFotoMomento(dia){

    const fotos =

        carregarFotos();

    return fotos[String(dia)] || null;

}

/* =========================================================

   CAPTURAR O PETTON

========================================================= */

async function tirarFoto(dia){

    try{

        const momento =

            document.querySelector(

                `.momento[data-dia="${dia}"]`

            );

        if(!momento){

            alert(

                "Não foi possível encontrar o Petton."

            );

            return;

        }

        const areaFoto =

            momento.querySelector(".foto");

        if(!areaFoto){

            alert(

                "Não foi possível capturar o Petton."

            );

            return;

        }

        /*

         * Usa SVG + foreignObject para transformar

         * o conteúdo visual do Petton em uma imagem.

         */

        const rect =

            areaFoto.getBoundingClientRect();

        const largura =

            Math.max(

                1,

                Math.round(rect.width)

            );

        const altura =

            Math.max(

                1,

                Math.round(rect.height)

            );

        const clone =

            areaFoto.cloneNode(true);

        clone.style.width =

            largura + "px";

        clone.style.height =

            altura + "px";

        clone.style.margin =

            "0";

        clone.style.borderRadius =

            "16px";

        clone.style.background =

            "linear-gradient(180deg,#f8fafc,#f1f5f9)";

        /*

         * Remove a foto antiga do clone para

         * capturar o Petton atual.

         */

        const fotoUsuario =

            clone.querySelector(

                ".foto-usuario"

            );

        if(fotoUsuario){

            fotoUsuario.remove();

        }

        /*

         * Cria um SVG com o visual atual.

         */

        const serializer =

            new XMLSerializer();

        const html =

            serializer.serializeToString(

                clone

            );

        const svg =

            `

            <svg

                xmlns="http://www.w3.org/2000/svg"

                xmlns:xlink="http://www.w3.org/1999/xlink"

                width="${largura}"

                height="${altura}"

            >

                <foreignObject

                    width="100%"

                    height="100%"

                >

                    <div

                        xmlns="http://www.w3.org/1999/xhtml"

                        style="

                            width:${largura}px;

                            height:${altura}px;

                            display:flex;

                            align-items:center;

                            justify-content:center;

                            overflow:hidden;

                            border-radius:16px;

                            background:linear-gradient(180deg,#f8fafc,#f1f5f9);

                        "

                    >

                        ${html}

                    </div>

                </foreignObject>

            </svg>

            `;

        const blob =

            new Blob(

                [svg],

                {

                    type:"image/svg+xml;charset=utf-8"

                }

            );

        const url =

            URL.createObjectURL(blob);

        const imagem =

            new Image();

        imagem.onload =

            function(){

                try{

                    const canvas =

                        document.createElement(

                            "canvas"

                        );

                    canvas.width =

                        largura * 2;

                    canvas.height =

                        altura * 2;

                    const ctx =

                        canvas.getContext(

                            "2d"

                        );

                    ctx.scale(2,2);

                    ctx.drawImage(

                        imagem,

                        0,

                        0,

                        largura,

                        altura

                    );

                    URL.revokeObjectURL(

                        url

                    );

                    const resultado =

                        canvas.toDataURL(

                            "image/png"

                        );

                    const fotos =

                        carregarFotos();

                    fotos[String(dia)] =

                        resultado;

                    if(

                        !salvarFotos(fotos)

                    ){

                        alert(

                            "Não foi possível salvar a foto. O armazenamento do aparelho pode estar cheio."

                        );

                        return;

                    }

                    renderizarAgora();

                }catch(e){

                    URL.revokeObjectURL(

                        url

                    );

                    console.log(

                        "Erro ao gerar captura:",

                        e

                    );

                    capturarFallback(

                        dia

                    );

                }

            };

        imagem.onerror =

            function(){

                URL.revokeObjectURL(

                    url

                );

                capturarFallback(

                    dia

                );

            };

        imagem.src =

            url;

    }catch(e){

        console.log(

            "Erro ao capturar Petton:",

            e

        );

        capturarFallback(

            dia

        );

    }

}

/* =========================================================

   FALLBACK

========================================================= */

function capturarFallback(dia){

    /*

     * Caso o navegador do LINE não permita

     * a captura do HTML, salva a imagem

     * original do Petton como lembrança.

     */

    try{

        const imagem =

            imagemPetton();

        if(!imagem){

            alert(

                "Não foi possível capturar o Petton."

            );

            return;

        }

        const img =

            new Image();

        img.crossOrigin =

            "anonymous";

        img.onload =

            function(){

                try{

                    const canvas =

                        document.createElement(

                            "canvas"

                        );

                    canvas.width =

                        img.naturalWidth || 400;

                    canvas.height =

                        img.naturalHeight || 400;

                    const ctx =

                        canvas.getContext(

                            "2d"

                        );

                    ctx.fillStyle =

                        "#f8fafc";

                    ctx.fillRect(

                        0,

                        0,

                        canvas.width,

                        canvas.height

                    );

                    ctx.drawImage(

                        img,

                        0,

                        0,

                        canvas.width,

                        canvas.height

                    );

                    const fotos =

                        carregarFotos();

                    fotos[String(dia)] =

                        canvas.toDataURL(

                            "image/png"

                        );

                    if(

                        salvarFotos(fotos)

                    ){

                        renderizarAgora();

                    }else{

                        alert(

                            "Não foi possível salvar a foto."

                        );

                    }

                }catch(e){

                    console.log(e);

                    alert(

                        "Não foi possível registrar este momento."

                    );

                }

            };

        img.onerror =

            function(){

                alert(

                    "Não foi possível registrar este momento."

                );

            };

        img.src =

            imagem;

    }catch(e){

        console.log(e);

        alert(

            "Não foi possível registrar este momento."

        );

    }

}

/* =========================================================

   CARREGAR PETTON

========================================================= */

function carregar(){

    try{

        if(

            typeof Petton !== "undefined" &&

            typeof Petton.carregar === "function"

        ){

            dados =

                Petton.carregar();

        }

    }catch(e){

        console.log(

            "Erro ao carregar Petton:",

            e

        );

        dados = null;

    }

}

/* =========================================================

   OVO

========================================================= */

function estaNoOvo(){

    if(!dados){

        return false;

    }

    return !dados.dateNascimento;

}

/* =========================================================

   IDADE

========================================================= */

function idadeAtual(){

    if(!dados){

        return 0;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            typeof Petton.idadeDias === "function"

        ){

            return Petton.idadeDias();

        }

    }catch(e){

        console.log(e);

    }

    if(!dados.dateNascimento){

        return 0;

    }

    const nascimento =

        new Date(

            dados.dateNascimento

        );

    const agora =

        new Date();

    return Math.max(

        0,

        Math.floor(

            (

                agora -

                nascimento

            ) / 86400000

        )

    );

}

/* =========================================================

   IMAGEM DO PETTON

========================================================= */

function imagemPetton(){

    if(!dados){

        return null;

    }

    const especie =

        String(

            dados.especie || ""

        ).toLowerCase();

    if(

        especie === "cachorro" ||

        especie === "cao" ||

        especie === "dog"

    ){

        return "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png";

    }

    if(

        especie === "coelho" ||

        especie === "rabbit"

    ){

        return "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

    }

    if(

        especie === "gato" ||

        especie === "cat"

    ){

        return "petton-original.png";

    }

    return null;

}

/* =========================================================

   EMOJI

========================================================= */

function especieEmoji(){

    if(!dados){

        return "🐾";

    }

    const especie =

        String(

            dados.especie || "gato"

        ).toLowerCase();

    if(

        especie === "cachorro" ||

        especie === "cao" ||

        especie === "dog"

    ){

        return "🐶";

    }

    if(

        especie === "coelho" ||

        especie === "rabbit"

    ){

        return "🐰";

    }

    return "🐱";

}

/* =========================================================

   VISUAL PRINCIPAL

========================================================= */

function criarVisualPetton(){

    if(estaNoOvo()){

        return `

            <div class="pet-emoji">

                🥚

            </div>

        `;

    }

    const imagem =

        imagemPetton();

    if(imagem){

        return `

            <img

                src="${imagem}"

                alt="Petton"

                onerror="

                    this.style.display='none';

                    this.nextElementSibling.style.display='flex';

                "

            >

            <div

                class="pet-emoji"

                style="display:none;"

            >

                ${especieEmoji()}

            </div>

        `;

    }

    return `

        <div class="pet-emoji">

            ${especieEmoji()}

        </div>

    `;

}

/* =========================================================

   VISUAL DO MOMENTO

========================================================= */

function criarVisualMomento(momento){

    const foto =

        obterFotoMomento(

            momento.dia

        );

    if(foto){

        return `

            <img

                class="foto-usuario"

                src="${foto}"

                alt="Foto do momento"

            >

        `;

    }

    if(momento.dia === 0){

        return `

            <div

                class="pet-foto-emoji"

                style="font-size:58px;"

            >

                🥚

            </div>

        `;

    }

    const imagem =

        imagemPetton();

    if(imagem){

        return `

            <div class="pet-foto">

                <img

                    src="${imagem}"

                    alt="Petton"

                    onerror="

                        this.style.display='none';

                        this.nextElementSibling.style.display='flex';

                    "

                >

                <div

                    class="pet-foto-emoji"

                    style="display:none;"

                >

                    ${especieEmoji()}

                </div>

            </div>

        `;

    }

    return `

        <div class="pet-foto-emoji">

            ${especieEmoji()}

        </div>

    `;

}

/* =========================================================

   DATA

========================================================= */

function formatarData(dia){

    if(

        !dados ||

        !dados.dateNascimento

    ){

        return "Aguardando nascimento";

    }

    const nascimento =

        new Date(

            dados.dateNascimento

        );

    const data =

        new Date(

            nascimento

        );

    data.setDate(

        data.getDate() + dia

    );

    return data.toLocaleDateString(

        "pt-BR",

        {

            day:"2-digit",

            month:"2-digit",

            year:"numeric"

        }

    );

}

/* =========================================================

   ASSINATURA

========================================================= */

function assinaturaTela(){

    if(

        typeof Petton === "undefined" ||

        typeof Petton.carregar !== "function"

    ){

        return "";

    }

    const d =

        Petton.carregar();

    if(!d){

        return "";

    }

    let restante = "";

    try{

        if(

            typeof Petton.incubacaoRestante === "function" &&

            !d.dateNascimento

        ){

            restante =

                Petton.incubacaoRestante();

        }

    }catch(e){}

    let idade = 0;

    if(d.dateNascimento){

        try{

            if(

                typeof Petton.idadeDias === "function"

            ){

                idade =

                    Petton.idadeDias();

            }

        }catch(e){

            idade = 0;

        }

    }

    return JSON.stringify({

        especie:d.especie,

        nome:d.nome,

        fase:d.fase,

        nascimento:d.dateNascimento,

        idade:idade,

        restanteOvo:

            d.dateNascimento

            ? ""

            : Math.floor(

                Number(restante) / 1000

            )

    });

}

/* =========================================================

   RENDERIZAR

========================================================= */

function renderizar(){

    carregar();

    const area =

        document.getElementById(

            "conteudo"

        );

    /* =====================================================

       SEM PETTON

    ===================================================== */

    if(!dados){

        area.innerHTML = `

            <div class="card resumo">

                <div class="pet-visual">

                    <div class="pet-emoji">

                        🥚

                    </div>

                </div>

                <h2>

                    Nenhum Petton encontrado

                </h2>

                <p class="info">

                    Quando seu Petton começar sua jornada,

                    os momentos importantes aparecerão

                    automaticamente neste álbum.

                </p>

                <button

                    class="botao"

                    onclick="location.href='nascimento.html'"

                >

                    🥚 Ir para o nascimento

                </button>

            </div>

        `;

        return;

    }

    /* =====================================================

       OVO

    ===================================================== */

    if(estaNoOvo()){

        let restante = null;

        try{

            if(

                typeof Petton !== "undefined" &&

                typeof Petton.incubacaoRestante === "function"

            ){

                restante =

                    Petton.incubacaoRestante();

            }

        }catch(e){

            console.log(e);

        }

        let contador =

            "⏳ Aguardando nascimento";

        if(

            typeof restante === "number" &&

            restante > 0

        ){

            const horas =

                Math.floor(

                    restante / 3600000

                );

            const minutos =

                Math.floor(

                    (restante % 3600000) / 60000

                );

            const segundos =

                Math.floor(

                    (restante % 60000) / 1000

                );

            contador =

                `🥚 ${String(horas).padStart(2,"0")}:` +

                `${String(minutos).padStart(2,"0")}:` +

                `${String(segundos).padStart(2,"0")}`;

        }

        const fotoOvo =

            obterFotoMomento(0);

        area.innerHTML = `

            <div class="card resumo">

                <div class="pet-visual">

                    <div class="pet-emoji">

                        🥚

                    </div>

                </div>

                <div class="nome">

                    🥚 Ovo do Petton

                </div>

                <div class="sub">

                    Seu Petton ainda está se preparando

                    para nascer.

                </div>

                <div class="contador">

                    ${contador}

                </div>

            </div>

            <div class="card">

                <h2 style="margin-top:0;">

                    📖 Álbum

                </h2>

                <p class="info">

                    O álbum começa no momento em que

                    o ovo aparece. Depois do nascimento,

                    novos momentos serão desbloqueados

                    conforme o Petton cresce.

                </p>

                <div class="album">

                    <div

                        class="momento liberado atual"

                        data-dia="0"

                    >

                        <div class="momento-topo">

                            <div class="dia">

                                Dia 0

                            </div>

                            <div class="status">

                                📸

                            </div>

                        </div>

                        <div class="foto">

                            ${

                                fotoOvo

                                ?

                                `

                                <img

                                    class="foto-usuario"

                                    src="${fotoOvo}"

                                    alt="Foto do momento"

                                >

                                `

                                :

                                `

                                <div

                                    class="pet-foto-emoji"

                                    style="font-size:58px;"

                                >

                                    🥚

                                </div>

                                `

                            }

                        </div>

                        <div class="data">

                            Hoje

                        </div>

                        <div class="descricao">

                            O começo

                        </div>

                        <div class="detalhe">

                            Tudo começa aqui.

                        </div>

                        <button

                            class="botao-foto"

                            onclick="tirarFoto(0)"

                        >

                            📸 ${

                                fotoOvo

                                ? "Tirar outra foto"

                                : "Registrar momento"

                            }

                        </button>

                    </div>

                    ${

                        momentos

                        .filter(

                            m => m.dia !== 0

                        )

                        .map(

                            momento => `

                            <div class="momento bloqueado">

                                <div class="momento-topo">

                                    <div class="dia">

                                        Dia ${momento.dia}

                                    </div>

                                    <div class="status">

                                        🔒

                                    </div>

                                </div>

                                <div class="foto">

                                    <div class="bloqueio">

                                        🔒

                                    </div>

                                </div>

                                <div class="data">

                                    Ainda não desbloqueado

                                </div>

                                <div class="descricao">

                                    Momento futuro

                                </div>

                                <div class="detalhe">

                                    Continue esperando o nascimento.

                                </div>

                            </div>

                        `

                        )

                        .join("")

                    }

                </div>

            </div>

            <div class="rodape">

                Cada fase é uma lembrança. 🐾

            </div>

        `;

        return;

    }

    /* =====================================================

       PETTON NASCEU

    ===================================================== */

    const idade =

        idadeAtual();

    const nome =

        dados.nome || "Meu Petton";

    const liberados =

        momentos.filter(

            momento =>

                idade >= momento.dia

        ).length;

    const ultimoLiberado =

        momentos

        .filter(

            m => m.dia <= idade

        )

        .slice(-1)[0];

    area.innerHTML = `

        <div class="card resumo">

            <div class="pet-visual">

                ${criarVisualPetton()}

            </div>

            <div class="nome">

                ${nome}

            </div>

            <div class="sub">

                ${

                    idade === 1

                    ? "1 dia de vida"

                    : idade + " dias de vida"

                }

            </div>

            <div class="contador">

                📸 ${liberados}

                de ${momentos.length}

                momentos desbloqueados

            </div>

        </div>

        <div class="card">

            <h2 style="margin-top:0;">

                📸 Momentos especiais

            </h2>

            <p class="info">

                Conforme o tempo passa, novos momentos

                do seu Petton ficam disponíveis.

            </p>

            <div class="album">

                ${

                    momentos.map(

                        momento => {

                            const liberado =

                                idade >= momento.dia;

                            const atual =

                                liberado &&

                                ultimoLiberado &&

                                momento.dia ===

                                ultimoLiberado.dia;

                            let classe =

                                liberado

                                ? "liberado"

                                : "bloqueado";

                            if(atual){

                                classe += " atual";

                            }

                            const foto =

                                obterFotoMomento(

                                    momento.dia

                                );

                            return `

                                <div

                                    class="momento ${classe}"

                                    data-dia="${momento.dia}"

                                >

                                    <div class="momento-topo">

                                        <div class="dia">

                                            ${

                                                momento.dia === 0

                                                ? "Dia 0"

                                                : "Dia " + momento.dia

                                            }

                                        </div>

                                        <div class="status">

                                            ${

                                                liberado

                                                ? "📸"

                                                : "🔒"

                                            }

                                        </div>

                                    </div>

                                    <div class="foto">

                                        ${

                                            liberado

                                            ?

                                            criarVisualMomento(

                                                momento

                                            )

                                            :

                                            `

                                            <div class="bloqueio">

                                                🔒

                                            </div>

                                            `

                                        }

                                    </div>

                                    <div class="data">

                                        ${

                                            liberado

                                            ?

                                            formatarData(

                                                momento.dia

                                            )

                                            :

                                            "Ainda não desbloqueado"

                                        }

                                    </div>

                                    <div class="descricao">

                                        ${

                                            liberado

                                            ?

                                            momento.titulo

                                            :

                                            "Momento futuro"

                                        }

                                    </div>

                                    <div class="detalhe">

                                        ${

                                            liberado

                                            ?

                                            momento.detalhe

                                            :

                                            "Continue cuidando do seu Petton."

                                        }

                                    </div>

                                    ${

                                        atual

                                        ?

                                        `

                                        <button

                                            class="botao-foto"

                                            onclick="tirarFoto(${momento.dia})"

                                        >

                                            📸 ${

                                                foto

                                                ? "Tirar outra foto"

                                                : "Registrar momento"

                                            }

                                        </button>

                                        `

                                        :

                                        ""

                                    }

                                </div>

                            `;

                        }

                    ).join("")

                }

            </div>

        </div>

        <div class="card">

            <h2 style="margin-top:0;">

                💖 O álbum cresce com ele

            </h2>

            <p class="info">

                Os momentos são desbloqueados conforme

                os dias passam. A ideia é que, daqui a

                alguns meses, você consiga olhar para trás

                e acompanhar toda a história do seu Petton.

            </p>

        </div>

        <div class="rodape">

            Cada fase é uma lembrança. 🐾

        </div>

    `;

}

/* =========================================================

   RENDERIZAR AGORA

========================================================= */

function renderizarAgora(){

    renderizar();

    try{

        assinaturaAnterior =

            assinaturaTela();

    }catch(e){

        assinaturaAnterior =

            "";

    }

}

/* =========================================================

   INÍCIO

========================================================= */

renderizarAgora();

/* =========================================================

   ATUALIZAÇÃO

========================================================= */

setInterval(

    function(){

        try{

            const atual =

                assinaturaTela();

            if(

                atual !==

                assinaturaAnterior

            ){

                renderizarAgora();

            }

        }catch(e){

            console.log(

                "Atualização do álbum:",

                e

            );

        }

    },

    1000

);

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Meu Petton</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.topo {
    height: 60px;
    background: #222;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 8px 10px;
}

.topo button {
    background: #333;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
}

.topo button:first-child {
    justify-self: start;
}

.titulo {
    font-size: 18px;
    font-weight: bold;
}

.petton-area {
    padding-top: 18px;
}

#idade {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 4px;
}

#fase {
    color: #bbb;
    font-size: 14px;
    margin-bottom: 15px;
}

.petton-box {
    width: 280px;
    height: 300px;
    max-width: 90vw;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

#pettonImagem {
    width: 260px;
    max-width: 88vw;
    max-height: 290px;
    object-fit: contain;
    transition: transform 0.5s ease;
}

#pettonImagem:hover {
    transform: scale(1.03);
}

.mensagem {
    width: 90%;
    max-width: 400px;
    margin: 8px auto 15px;
    min-height: 25px;
    color: #ffd54a;
    font-weight: bold;
}

.acoes {
    width: 94%;
    max-width: 430px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.acao {
    border: none;
    border-radius: 12px;
    padding: 14px 8px;
    background: #333;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.acao:active {
    transform: scale(0.96);
    background: #555;
}

.info {
    width: 94%;
    max-width: 430px;
    margin: 18px auto 30px;
    background: #1c1c1c;
    border-radius: 12px;
    padding: 15px;
    text-align: left;
}

.info h3 {
    text-align: center;
    margin-top: 0;
}

.info p {
    margin: 8px 0;
    font-size: 14px;
}

@media (max-width: 380px) {
    .petton-box {
        height: 270px;
    }

    #pettonImagem {
        width: 235px;
        max-height: 260px;
    }

    .acao {
        font-size: 14px;
    }
}
</style>

</head>

<body>

<div class="topo">

```
<button type="button" onclick="voltar()">
    ⬅ Voltar
</button>

<div class="titulo">
    🐾 Meu Petton
</div>

<div></div>
```

</div>

<div class="petton-area">

```
<div id="idade">
    Carregando...
</div>

<div id="fase">
    Carregando...
</div>

<div class="petton-box">

    <img
        id="pettonImagem"
        src="petton-original.png"
        alt="Meu Petton"
    >

</div>

<div id="mensagem" class="mensagem"></div>

<div class="acoes">

    <button
        class="acao"
        type="button"
        onclick="irPara('alimentacao.html')">
        🍖 Alimentação
    </button>

    <button
        class="acao"
        type="button"
        onclick="irPara('cuidados.html')">
        ❤️ Cuidados
    </button>

    <button
        class="acao"
        type="button"
        onclick="irPara('quarto.html')">
        🏠 Quarto
    </button>

    <button
        class="acao"
        type="button"
        onclick="irPara('crescimento.html')">
        📈 Crescimento
    </button>

    <button
        class="acao"
        type="button"
        onclick="irPara('album.html')">
        📖 Álbum
    </button>

    <button
        class="acao"
        type="button"
        onclick="irPara('loja.html')">
        🛒 Loja
    </button>

</div>

<div class="info">

    <h3>🐾 Sobre seu Petton</h3>

    <p id="especie">
        Espécie: carregando...
    </p>

    <p id="caracteristicas">
        Características: carregando...
    </p>

</div>
```

</div>

<script src="petton.js"></script>

<script>

const imagem = document.getElementById("pettonImagem");
const idadeTexto = document.getElementById("idade");
const faseTexto = document.getElementById("fase");
const especieTexto = document.getElementById("especie");
const caracteristicasTexto = document.getElementById("caracteristicas");
const mensagem = document.getElementById("mensagem");


function mostrarPetton() {

    try {

        const dados = Petton.carregar();

        if (!dados) {

            idadeTexto.textContent =
                "🥚 Seu Petton ainda está no ovo.";

            faseTexto.textContent =
                "Volte para o nascimento.";

            imagem.style.display = "none";

            mensagem.innerHTML =
                '<button class="acao" onclick="window.location.href=\'nascimento.html\'">🥚 Ver nascimento</button>';

            return;
        }


        // ==========================================
        // ESPÉCIE
        // ==========================================

        const especie =
            dados.especie || "gato";


        especieTexto.textContent =
            "Espécie: " + especie;


        // ==========================================
        // ESCOLHER IMAGEM
        // ==========================================

        if (especie === "cachorro") {

            imagem.src =
                "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png";

            imagem.alt =
                "Petton cachorro";

        } else {

            imagem.src =
                "petton-original.png";

            imagem.alt =
                "Petton gato";
        }


        // ==========================================
        // IDADE
        // ==========================================

        let idade = 0;

        if (
            typeof Petton.idadeDias === "function"
        ) {

            idade =
                Petton.idadeDias();

        } else if (dados.dataNascimento) {

            const nascimento =
                new Date(dados.dataNascimento);

            idade =
                Math.floor(
                    (
                        Date.now() -
                        nascimento.getTime()
                    ) /
                    86400000
                );
        }


        if (idade < 0) {
            idade = 0;
        }


        idadeTexto.textContent =
            idade === 0
                ? "🐣 Primeiro dia de vida"
                : "🐾 " + idade + " dias de vida";


        // ==========================================
        // FASE
        // ==========================================

        let fase =
            dados.fase || "bebe";


        const nomesFase = {

            bebe:
                "🐣 Bebê",

            filhote:
                "🐾 Filhote",

            jovem:
                "🌱 Jovem",

            adulto:
                "✨ Adulto"
        };


        faseTexto.textContent =
            nomesFase[fase] || "🐾 " + fase;


        // ==========================================
        // CARACTERÍSTICAS
        // ==========================================

        const partes = [];


        if (dados.caracteristicas) {

            const c =
                dados.caracteristicas;


            if (c.cor) {
                partes.push(c.cor);
            }

            if (c.padrao) {
                partes.push(c.padrao);
            }

            if (c.olhos) {
                partes.push(c.olhos);
            }

            if (c.orelhas) {
                partes.push(c.orelhas);
            }

            if (c.cauda) {
                partes.push(c.cauda);
            }
        }


        caracteristicasTexto.textContent =
            partes.length > 0
                ? "Características: " + partes.join(" • ")
                : "Características: aparecendo conforme ele cresce";


        mensagem.textContent =
            "❤️ Cuide bem do seu Petton!";


    } catch (erro) {

        console.error(
            "Erro ao carregar Petton:",
            erro
        );

        idadeTexto.textContent =
            "🐾 Meu Petton";

        faseTexto.textContent =
            "Não foi possível carregar os dados.";

    }

}


function irPara(pagina) {

    window.location.href =
        pagina;
}


function voltar() {

    window.location.href =
        "index.html";
}


// Atualiza a idade e a aparência
// periodicamente.

mostrarPetton();

setInterval(
    mostrarPetton,
    10000
);

</script>

</body>
</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Meu Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    background: linear-gradient(#fffaf4, #ead9c9);

    color: #3d2c25;

}

.topo {

    text-align: center;

    padding: 20px 15px 8px;

}

.topo h1 {

    margin: 0;

    font-size: 26px;

}

.topo p {

    margin: 6px 0 0;

    color: #80685d;

    font-size: 14px;

}

.quarto {

    position: relative;

    width: calc(100% - 30px);

    max-width: 500px;

    height: 500px;

    margin: 15px auto;

    overflow: hidden;

    border-radius: 28px;

    background:

        linear-gradient(

            to bottom,

            #f5e9dc 0%,

            #f5e9dc 72%,

            #d6a979 72%,

            #c99665 100%

        );

    box-shadow: 0 12px 30px rgba(70,45,30,.15);

}

/* =========================

   QUARTO

========================= */

.janela {

    position: absolute;

    width: 105px;

    height: 125px;

    right: 25px;

    top: 30px;

    border: 9px solid white;

    background: linear-gradient(#bde6ff,#eaf8ff);

    border-radius: 12px;

    box-shadow: 0 5px 12px rgba(50,50,50,.12);

}

.janela::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 0;

    bottom: 0;

    width: 4px;

    background: white;

}

.janela::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    top: 50%;

    height: 4px;

    background: white;

}

.tapete {

    position: absolute;

    left: 50%;

    bottom: 40px;

    transform: translateX(-50%);

    width: 300px;

    height: 110px;

    border-radius: 50%;

    background: #ead6bf;

}

.cama {

    position: absolute;

    left: 18px;

    bottom: 55px;

    width: 105px;

    height: 70px;

    background: white;

    border-radius: 25px;

    box-shadow: 0 7px 12px rgba(60,40,30,.12);

}

.cama::after {

    content: "💤";

    position: absolute;

    font-size: 25px;

    left: 38px;

    top: 20px;

}

.brinquedo {

    position: absolute;

    right: 25px;

    bottom: 65px;

    font-size: 42px;

}

/* =========================

   PETTON

========================= */

.petton-area {

    position: absolute;

    left: 50%;

    bottom: 70px;

    transform: translateX(-50%);

    width: 230px;

    height: 240px;

}

.sombra {

    position: absolute;

    width: 145px;

    height: 27px;

    left: 42px;

    bottom: 5px;

    background: rgba(60,40,30,.18);

    border-radius: 50%;

    filter: blur(7px);

}

.petton {

    position: absolute;

    left: 55px;

    bottom: 25px;

    width: 120px;

    height: 115px;

    border-radius: 48% 48% 43% 43%;

    animation: respirar 3s ease-in-out infinite;

    transition: all .6s ease;

}

/* =========================

   CABEÇA

========================= */

.cabeca {

    position: absolute;

    width: 125px;

    height: 112px;

    left: -3px;

    top: -58px;

    border-radius: 48% 48% 50% 50%;

    transition: all .6s ease;

}

/* =========================

   ORELHAS

========================= */

.orelha {

    position: absolute;

    background: inherit;

    z-index: -1;

    transition: all .6s ease;

}

.orelha.esquerda {

    left: 2px;

}

.orelha.direita {

    right: 2px;

}

/* GATO */

.petton.gato .orelha {

    width: 48px;

    height: 58px;

    top: -32px;

    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);

}

.petton.gato .orelha.esquerda {

    transform: rotate(-18deg);

}

.petton.gato .orelha.direita {

    transform: rotate(18deg);

}

/* CACHORRO */

.petton.cachorro .orelha {

    width: 48px;

    height: 68px;

    top: -23px;

    border-radius: 15px 15px 45px 45px;

}

.petton.cachorro .orelha.esquerda {

    transform: rotate(16deg);

}

.petton.cachorro .orelha.direita {

    transform: rotate(-16deg);

}

/* COELHO */

.petton.coelho .orelha {

    width: 40px;

    height: 105px;

    top: -72px;

    border-radius: 55% 55% 35% 35%;

}

.petton.coelho .orelha.esquerda {

    transform: rotate(-8deg);

}

.petton.coelho .orelha.direita {

    transform: rotate(8deg);

}

.petton.coelho .orelha::after {

    content: "";

    position: absolute;

    inset: 8px;

    background: #f2bebe;

    border-radius: inherit;

}

/* =========================

   OLHOS

========================= */

.olho {

    position: absolute;

    width: 15px;

    height: 18px;

    top: 42px;

    border-radius: 50%;

    transition: background .5s;

}

.olho::after {

    content: "";

    position: absolute;

    width: 5px;

    height: 7px;

    background: white;

    border-radius: 50%;

    left: 3px;

    top: 3px;

}

.olho.esquerdo {

    left: 28px;

}

.olho.direito {

    right: 28px;

}

/* =========================

   FOCINHO

========================= */

.focinho {

    position: absolute;

    left: 50%;

    top: 60px;

    transform: translateX(-50%);

    width: 48px;

    height: 30px;

}

.nariz {

    position: absolute;

    left: 50%;

    top: 0;

    transform: translateX(-50%);

    width: 15px;

    height: 11px;

    border-radius: 50%;

}

.boca {

    position: absolute;

    left: 50%;

    top: 10px;

    width: 6px;

    height: 13px;

    border-left: 2px solid #60483f;

    border-bottom: 2px solid #60483f;

    transform: translateX(-50%) rotate(-45deg);

}

/* =========================

   PATAS

========================= */

.pata {

    position: absolute;

    width: 31px;

    height: 47px;

    bottom: -15px;

    border-radius: 45%;

}

.pata.esquerda {

    left: 14px;

}

.pata.direita {

    right: 14px;

}

/* =========================

   RABO

========================= */

.rabo {

    position: absolute;

    right: -34px;

    bottom: 34px;

    width: 52px;

    height: 65px;

    border: 15px solid currentColor;

    border-left: 0;

    border-bottom: 0;

    border-radius: 0 55px 0 0;

    transform: rotate(12deg);

    transition: all .6s ease;

}

/* =========================

   CORES

========================= */

.cor-branco {

    background: #f7f3ea;

}

.cor-preto {

    background: #272522;

}

.cor-cinza {

    background: #929292;

}

.cor-cinza_claro {

    background: #c4c4c4;

}

.cor-cinza_escuro {

    background: #555;

}

.cor-laranja {

    background: #d8893e;

}

.cor-marrom {

    background: #8a5a3b;

}

.cor-creme {

    background: #e8d0a5;

}

.cor-caramelo {

    background: #c98952;

}

.cor-dourado {

    background: #d9ad55;

}

.cor-preto_branco {

    background: linear-gradient(135deg,#262626 0 48%,#f5f2ea 49%);

}

.cor-laranja_branco {

    background: linear-gradient(135deg,#d8893e 0 48%,#f5f2ea 49%);

}

.cor-marrom_branco {

    background: linear-gradient(135deg,#8a5a3b 0 48%,#f5f2ea 49%);

}

.cor-car amelo_branco {

    background: linear-gradient(135deg,#c98952 0 48%,#f5f2ea 49%);

}

/* =========================

   OLHOS POR COR

========================= */

.olhos-azuis {

    background: #5e8fd1;

}

.olhos-azul_claro {

    background: #8dc7ed;

}

.olhos-verdes {

    background: #62a56b;

}

.olhos-amarelos {

    background: #d7c34e;

}

.olhos-dourados {

    background: #d4a53c;

}

.olhos-castanhos {

    background: #75462c;

}

.olhos-mel {

    background: #b78648;

}

.olhos-pretos {

    background: #151515;

}

.olhos-cinza {

    background: #8d969d;

}

.olhos-vermelhos {

    background: #d55b62;

}

/* =========================

   NARIZ

========================= */

.nariz-rosa {

    background: #ef9999;

}

.nariz-preto {

    background: #252525;

}

.nariz-marrom {

    background: #75442f;

}

.nariz-cinza {

    background: #737373;

}

/* =========================

   PADRÕES

========================= */

.padrao-tabby .cabeca::after,

.padrao-listrado .cabeca::after,

.padrao-tigrado .cabeca::after {

    content: "";

    position: absolute;

    width: 13px;

    height: 65px;

    left: 56px;

    top: 15px;

    background: rgba(80,45,25,.30);

    transform: rotate(10deg);

    border-radius: 50%;

}

.padrao-manchas .cabeca::after,

.padrao-pintinhas .cabeca::after {

    content: "";

    position: absolute;

    width: 22px;

    height: 19px;

    right: 18px;

    top: 17px;

    background: rgba(75,45,30,.35);

    border-radius: 50%;

}

.padrao-peito_branco::after {

    content: "";

    position: absolute;

    width: 55px;

    height: 60px;

    left: 33px;

    bottom: -3px;

    background: #f8f4eb;

    border-radius: 50%;

}

.padrao-patas_brancas .pata {

    background: #f8f4eb !important;

}

.padrao-rosto_bicolor .cabeca::after {

    content: "";

    position: absolute;

    width: 50%;

    height: 100%;

    right: 0;

    top: 0;

    background: rgba(255,255,255,.55);

    border-radius: 0 55px 55px 0;

}

.padrao-mancha_no_olho .cabeca::after {

    content: "";

    position: absolute;

    width: 35px;

    height: 32px;

    left: 17px;

    top: 31px;

    background: rgba(65,40,30,.45);

    border-radius: 50%;

}

.padrao-mancha_no_nariz .cabeca::after {

    content: "";

    position: absolute;

    width: 35px;

    height: 25px;

    left: 45px;

    top: 57px;

    background: rgba(80,50,40,.3);

    border-radius: 50%;

}

/* =========================

   RABO

========================= */

.rabo-curto {

    width: 35px;

    height: 38px;

}

.rabo-longo {

    width: 62px;

    height: 80px;

}

.rabo-fofinho {

    width: 58px;

    height: 58px;

    border-width: 18px;

}

.rabo-curvado {

    transform: rotate(35deg);

}

.rabo-levantado {

    transform: rotate(-20deg);

}

.rabo-ponta_branca::after {

    content: "";

    position: absolute;

    width: 17px;

    height: 17px;

    background: white;

    border-radius: 50%;

    right: -8px;

    top: -10px;

}

/* coelho */

.petton.coelho .rabo {

    width: 42px;

    height: 42px;

    border: 0;

    border-radius: 50%;

    background: currentColor;

    right: -22px;

    bottom: 45px;

}

/* =========================

   ANIMAÇÃO

========================= */

@keyframes respirar {

    0%,100% {

        transform: scale(1) translateY(0);

    }

    50% {

        transform: scale(1.025) translateY(-2px);

    }

}

/* =========================

   IDENTIDADE

========================= */

.info {

    width: calc(100% - 30px);

    max-width: 500px;

    margin: 15px auto;

    padding: 18px;

    background: rgba(255,255,255,.88);

    border-radius: 22px;

    box-shadow: 0 7px 20px rgba(60,40,30,.10);

}

.nome {

    text-align: center;

    font-size: 24px;

    font-weight: 800;

}

.especie {

    text-align: center;

    margin-top: 5px;

    font-size: 16px;

    font-weight: 700;

}

.raridade {

    text-align: center;

    margin-top: 5px;

    font-size: 13px;

    color: #876d60;

}

.caracteristicas {

    display: grid;

    grid-template-columns: repeat(2,1fr);

    gap: 8px;

    margin-top: 15px;

}

.caracteristica {

    background: #faf5ef;

    border-radius: 13px;

    padding: 9px;

    font-size: 12px;

}

.caracteristica strong {

    display: block;

    font-size: 13px;

    margin-top: 2px;

}

/* =========================

   STATUS

========================= */

.status {

    margin-top: 18px;

}

.linha {

    margin-bottom: 11px;

}

.linha-topo {

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    margin-bottom: 5px;

}

.barra {

    width: 100%;

    height: 9px;

    background: #eadfd5;

    border-radius: 10px;

    overflow: hidden;

}

.preenchimento {

    height: 100%;

    width: 80%;

    background: #78b77b;

    border-radius: inherit;

}

/* =========================

   BOTÕES

========================= */

.botoes {

    display: grid;

    grid-template-columns: repeat(2,1fr);

    gap: 10px;

    width: calc(100% - 30px);

    max-width: 500px;

    margin: 15px auto 30px;

}

button {

    border: 0;

    padding: 14px 10px;

    border-radius: 17px;

    background: white;

    box-shadow: 0 5px 14px rgba(50,40,30,.10);

    font-size: 14px;

    font-weight: 700;

    color: #4c382f;

}

button:active {

    transform: scale(.97);

}

@media(max-height:650px) {

    .quarto {

        height: 430px;

    }

    .petton-area {

        transform: translateX(-50%) scale(.85);

        bottom: 48px;

    }

}

</style>

</head>

<body>

<div class="topo">

    <h1>🐾 Meu Petton</h1>

    <p>

        Seu pequeno companheiro está crescendo ❤️

    </p>

</div>

<div class="quarto">

    <div class="janela"></div>

    <div class="cama"></div>

    <div class="brinquedo">🧸</div>

    <div class="tapete"></div>

    <div class="petton-area">

        <div class="sombra"></div>

        <div

            class="petton"

            id="pettonVisual"

        >

            <div class="cabeca">

                <div class="orelha esquerda"></div>

                <div class="orelha direita"></div>

                <div

                    class="olho esquerdo"

                    id="olhoEsquerdo"

                ></div>

                <div

                    class="olho direito"

                    id="olhoDireito"

                ></div>

                <div class="focinho">

                    <div

                        class="nariz"

                        id="nariz"

                    ></div>

                    <div class="boca"></div>

                </div>

            </div>

            <div class="pata esquerda"></div>

            <div class="pata direita"></div>

            <div

                class="rabo"

                id="rabo"

            ></div>

        </div>

    </div>

</div>

<div class="info">

    <div

        class="nome"

        id="nome"

    >

        Mimi

    </div>

    <div

        class="especie"

        id="especie"

    >

        🐾 Petton

    </div>

    <div

        class="raridade"

        id="raridade"

    >

        Características especiais

    </div>

    <div class="caracteristicas">

        <div class="caracteristica">

            🎨 Cor

            <strong id="cor">---</strong>

        </div>

        <div class="caracteristica">

            👀 Olhos

            <strong id="olhos">---</strong>

        </div>

        <div class="caracteristica">

            🐯 Padrão

            <strong id="padrao">---</strong>

        </div>

        <div class="caracteristica">

            👂 Orelhas

            <strong id="orelhas">---</strong>

        </div>

        <div class="caracteristica">

            🐾 Patas

            <strong id="patas">---</strong>

        </div>

        <div class="caracteristica">

            🦊 Rabo

            <strong id="raboTexto">---</strong>

        </div>

    </div>

    <div class="status">

        <div class="linha">

            <div class="linha-topo">

                <span>🍖 Fome</span>

                <span id="fomeValor">70%</span>

            </div>

            <div class="barra">

                <div

                    class="preenchimento"

                    id="fomeBarra"

                ></div>

            </div>

        </div>

        <div class="linha">

            <div class="linha-topo">

                <span>❤️ Felicidade</span>

                <span id="felicidadeValor">100%</span>

            </div>

            <div class="barra">

                <div

                    class="preenchimento"

                    id="felicidadeBarra"

                ></div>

            </div>

        </div>

        <div class="linha">

            <div class="linha-topo">

                <span>⚡ Energia</span>

                <span id="energiaValor">100%</span>

            </div>

            <div class="barra">

                <div

                    class="preenchimento"

                    id="energiaBarra"

                ></div>

            </div>

        </div>

        <div class="linha">

            <div class="linha-topo">

                <span>🧼 Higiene</span>

                <span id="higieneValor">100%</span>

            </div>

            <div class="barra">

                <div

                    class="preenchimento"

                    id="higieneBarra"

                ></div>

            </div>

        </div>

    </div>

</div>

<div class="botoes">

    <button onclick="alimentar()">

        🍖 Alimentar

    </button>

    <button onclick="brincar()">

        🧸 Brincar

    </button>

    <button onclick="carinho()">

        ❤️ Carinho

    </button>

    <button onclick="dormir()">

        😴 Dormir

    </button>

</div>

<script src="petton.js"></script>

<script>

/* =========================================================

   NOMES BONITOS

========================================================= */

function nomeBonito(valor) {

    if (!valor) return "Ainda não apareceu";

    const nomes = {

        branco: "Branco",

        preto: "Preto",

        cinza: "Cinza",

        cinza_claro: "Cinza claro",

        cinza_escuro: "Cinza escuro",

        laranja: "Laranja",

        marrom: "Marrom",

        creme: "Creme",

        caramelo: "Caramelo",

        dourado: "Dourado",

        preto_branco: "Preto e branco",

        laranja_branco: "Laranja e branco",

        marrom_branco: "Marrom e branco",

        azuis: "Azuis",

        azul_claro: "Azul claro",

        verdes: "Verdes",

        amarelos: "Amarelos",

        dourados: "Dourados",

        castanhos: "Castanhos",

        mel: "Mel",

        pretos: "Pretos",

        cinza: "Cinza",

        vermelhos: "Vermelhos",

        sem_manchas: "Sem manchas",

        tabby: "Tabby",

        listrado: "Listrado",

        manchas: "Manchado",

        peito_branco: "Peito branco",

        patas_brancas: "Patas brancas",

        rosto_bicolor: "Rosto bicolor",

        mancha_no_nariz: "Mancha no nariz",

        mancha_no_olho: "Mancha no olho",

        pintinhas: "Pintinhas",

        tigrado: "Tigrado",

        pequenas: "Pequenas",

        medias: "Médias",

        grandes: "Grandes",

        pontudas: "Pontudas",

        arredondadas: "Arredondadas",

        caidas: "Caídas",

        semi_caidas: "Semi-caídas",

        levantadas: "Levantadas",

        muito_longas: "Muito longas",

        curtas: "Curtas",

        longas: "Longas",

        curto: "Curto",

        medio: "Médio",

        longo: "Longo",

        fofinho: "Fofinho",

        curvado: "Curvado",

        levantado: "Levantado",

        ponta_branca: "Ponta branca",

        pequeno: "Pequeno",

        redondo: "Redondo",

        normais: "Normais",

        escuras: "Escuras",

        manchadas: "Manchadas",

        peludas: "Peludas"

    };

    return nomes[valor] || valor;

}

/* =========================================================

   ÍCONE DA ESPÉCIE

========================================================= */

function iconeEspecie(especie) {

    if (especie === "gato") {

        return "🐱 Gato";

    }

    if (especie === "cachorro") {

        return "🐶 Cachorro";

    }

    if (especie === "coelho") {

        return "🐰 Coelho";

    }

    return "🐾 Petton";

}

/* =========================================================

   RARIDADE

========================================================= */

function mostrarRaridade(raridade) {

    if (raridade === "especial") {

        return "✨ Petton Especial";

    }

    if (raridade === "raro") {

        return "💎 Petton Raro";

    }

    if (raridade === "incomum") {

        return "⭐ Petton Incomum";

    }

    return "🌱 Petton Comum";

}

/* =========================================================

   APLICA VISUAL

========================================================= */

function aplicarVisual() {

    const dados =

        Petton.dados;

    const caracteristicas =

        dados.caracteristicas || {};

    const visiveis =

        dados.caracteristicasVisiveis || {};

    const visual =

        document.getElementById(

            "pettonVisual"

        );

    /*

     * ESPÉCIE

     */

    visual.classList.add(

        dados.especie || "gato"

    );

    /*

     * COR

     */

    if (visiveis.cor !== false) {

        visual.classList.add(

            "cor-" +

            caracteristicas.cor

        );

    } else {

        visual.classList.add(

            "cor-creme"

        );

    }

    /*

     * PADRÃO

     */

    if (visiveis.padrao) {

        visual.classList.add(

            "padrao-" +

            caracteristicas.padrao

        );

    }

    /*

     * OLHOS

     */

    const olhos =

        document.querySelectorAll(

            ".olho"

        );

    if (visiveis.olhos) {

        olhos.forEach(

            function(olho) {

                olho.classList.add(

                    "olhos-" +

                    caracteristicas.olhos

                );

            }

        );

    } else {

        olhos.forEach(

            function(olho) {

                olho.classList.add(

                    "olhos-azuis"

                );

            }

        );

    }

    /*

     * NARIZ

     */

    if (visiveis.nariz) {

        document

            .getElementById("nariz")

            .classList.add(

                "nariz-" +

                caracteristicas.nariz

            );

    } else {

        document

            .getElementById("nariz")

            .classList.add(

                "nariz-rosa"

            );

    }

    /*

     * RABO

     */

    if (visiveis.rabo) {

        const rabo =

            document.getElementById(

                "rabo"

            );

        rabo.classList.add(

            "rabo-" +

            caracteristicas.rabo

        );

        rabo.style.color =

            obterCorRabo(

                caracteristicas.cor

            );

    }

    /*

     * ORELHAS

     */

    if (visiveis.orelhas) {

        aplicarOrelhas(

            dados.especie,

            caracteristicas.orelhas

        );

    }

    /*

     * PATAS

     */

    if (visiveis.patas) {

        aplicarPatas(

            caracteristicas

        );

    }

}

/* =========================================================

   COR DO RABO

========================================================= */

function obterCorRabo(cor) {

    const mapa = {

        branco: "#f7f3ea",

        preto: "#272522",

        cinza: "#929292",

        cinza_claro: "#c4c4c4",

        cinza_escuro: "#555",

        laranja: "#d8893e",

        marrom: "#8a5a3b",

        creme: "#e8d0a5",

        caramelo: "#c98952",

        dourado: "#d9ad55",

        preto_branco: "#272522",

        laranja_branco: "#d8893e",

        marrom_branco: "#8a5a3b"

    };

    return mapa[cor] || "#d8c8b8";

}

/* =========================================================

   ORELHAS

========================================================= */

function aplicarOrelhas(

    especie,

    formato

) {

    const orelhas =

        document.querySelectorAll(

            ".orelha"

        );

    if (especie === "coelho") {

        if (

            formato ===

            "muito_longas"

        ) {

            orelhas.forEach(

                o => {

                    o.style.height =

                        "125px";

                    o.style.top =

                        "-92px";

                }

            );

        }

        return;

    }

    if (

        formato === "grandes"

    ) {

        orelhas.forEach(

            o => {

                o.style.width =

                    "58px";

                o.style.height =

                    "70px";

            }

        );

    }

    if (

        formato === "pequenas"

    ) {

        orelhas.forEach(

            o => {

                o.style.width =

                    "38px";

                o.style.height =

                    "45px";

            }

        );

    }

    if (

        formato === "arredondadas"

    ) {

        orelhas.forEach(

            o => {

                o.style.clipPath =

                    "none";

                o.style.borderRadius =

                    "50%";

            }

        );

    }

}

/* =========================================================

   PATAS

========================================================= */

function aplicarPatas(

    caracteristicas

) {

    const patas =

        document.querySelectorAll(

            ".pata"

        );

    if (

        caracteristicas.patas ===

        "brancas"

    ) {

        patas.forEach(

            pata => {

                pata.style.background =

                    "#fffaf0";

            }

        );

    }

    if (

        caracteristicas.patas ===

        "escuras"

    ) {

        patas.forEach(

            pata => {

                pata.style.filter =

                    "brightness(.65)";

            }

        );

    }

    if (

        caracteristicas.patas ===

        "peludas"

    ) {

        patas.forEach(

            pata => {

                pata.style.borderRadius =

                    "40% 40% 55% 55%";

                pata.style.transform =

                    "scale(1.08)";

            }

        );

    }

}

/* =========================================================

   INFORMAÇÕES

========================================================= */

function atualizarInformacoes() {

    const dados =

        Petton.dados;

    const c =

        dados.caracteristicas || {};

    const v =

        dados.caracteristicasVisiveis || {};

    document.getElementById(

        "nome"

    ).textContent =

        dados.nome;

    document.getElementById(

        "especie"

    ).textContent =

        iconeEspecie(

            dados.especie

        );

    document.getElementById(

        "raridade"

    ).textContent =

        mostrarRaridade(

            c.raridade

        );

    document.getElementById(

        "cor"

    ).textContent =

        v.cor

        ? nomeBonito(c.cor)

        : "Ainda aparecendo...";

    document.getElementById(

        "olhos"

    ).textContent =

        v.olhos

        ? nomeBonito(c.olhos)

        : "Ainda aparecendo...";

    document.getElementById(

        "padrao"

    ).textContent =

        v.padrao

        ? nomeBonito(c.padrao)

        : "Ainda aparecendo...";

    document.getElementById(

        "orelhas"

    ).textContent =

        v.orelhas

        ? nomeBonito(c.orelhas)

        : "Ainda aparecendo...";

    document.getElementById(

        "patas"

    ).textContent =

        v.patas

        ? nomeBonito(c.patas)

        : "Ainda aparecendo...";

    document.getElementById(

        "raboTexto"

    ).textContent =

        v.rabo

        ? nomeBonito(c.rabo)

        : "Ainda aparecendo...";

}

/* =========================================================

   STATUS

========================================================= */

function atualizarStatus() {

    const s =

        Petton.status();

    atualizarBarra(

        "fome",

        s.fome

    );

    atualizarBarra(

        "felicidade",

        s.felicidade

    );

    atualizarBarra(

        "energia",

        s.energia

    );

    atualizarBarra(

        "higiene",

        s.higiene

    );

}

function atualizarBarra(

    nome,

    valor

) {

    document.getElementById(

        nome + "Valor"

    ).textContent =

        Math.round(valor) + "%";

    document.getElementById(

        nome + "Barra"

    ).style.width =

        Math.round(valor) + "%";

}

/* =========================================================

   AÇÕES

========================================================= */

function alimentar() {

    if (

        Petton.alimentar(15)

    ) {

        atualizarStatus();

        alert(

            "🍖 " +

            Petton.dados.nome +

            " comeu!"

        );

    }

}

function brincar() {

    if (

        Petton.brincar(8)

    ) {

        atualizarStatus();

        alert(

            "🧸 " +

            Petton.dados.nome +

            " adorou brincar!"

        );

    }

}

function carinho() {

    if (

        Petton.dados.fase ===

        "ovo"

    ) {

        return;

    }

    Petton.dados.felicidade =

        Math.min(

            100,

            Petton.dados.felicidade + 5

        );

    Petton.salvar();

    atualizarStatus();

    alert(

        "❤️ " +

        Petton.dados.nome +

        " recebeu carinho!"

    );

}

function dormir() {

    if (

        Petton.dormir()

    ) {

        atualizarStatus();

        alert(

            "😴 " +

            Petton.dados.nome +

            " dormiu!"

        );

    }

}

/* =========================================================

   INICIAR

========================================================= */

function iniciar() {

    if (

        Petton.dados.fase ===

        "ovo"

    ) {

        document.querySelector(

            ".quarto"

        ).innerHTML =

            "<div style='text-align:center;padding:180px 25px;font-size:20px;'>🥚<br><br>Seu Petton ainda está no ovo.<br><br><button onclick=\"location.href='nascimento.html'\">Ver nascimento</button></div>";

        return;

    }

    aplicarVisual();

    atualizarInformacoes();

    atualizarStatus();

}

iniciar();

setInterval(

    function() {

        Petton.carregar();

        aplicarVisual();

        atualizarInformacoes();

        atualizarStatus();

    },

    5000

);

</script>

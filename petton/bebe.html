<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

               initial-scale=1.0,

               maximum-scale=1.0,

               user-scalable=no">

<title>Meu Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        sans-serif;

    background:

        linear-gradient(

            #fffaf4,

            #ead9c9

        );

    color: #3d2c25;

}

/* =====================================================

   TOPO

===================================================== */

.topo {

    text-align: center;

    padding:

        20px

        15px

        8px;

}

.topo h1 {

    margin: 0;

    font-size: 26px;

}

.topo p {

    margin:

        6px

        0

        0;

    color: #80685d;

    font-size: 14px;

}

/* =====================================================

   QUARTO

===================================================== */

.quarto {

    position: relative;

    width:

        calc(100% - 30px);

    max-width: 500px;

    height: 500px;

    margin:

        15px

        auto;

    overflow: hidden;

    border-radius: 28px;

    background:

        linear-gradient(

            to bottom,

            #f5e9dc 0%,

            #f5e9dc 72%,

            #d6a979 72%,

            #c99665 100%

        );

    box-shadow:

        0 12px 30px

        rgba(70,45,30,.15);

}

/* =====================================================

   JANELA

===================================================== */

.janela {

    position: absolute;

    width: 105px;

    height: 125px;

    right: 25px;

    top: 30px;

    border:

        9px solid white;

    background:

        linear-gradient(

            #bde6ff,

            #eaf8ff

        );

    border-radius: 12px;

    box-shadow:

        0 5px 12px

        rgba(50,50,50,.12);

}

.janela::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 0;

    bottom: 0;

    width: 4px;

    background: white;

}

.janela::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    top: 50%;

    height: 4px;

    background: white;

}

/* =====================================================

   CAMA

===================================================== */

.cama {

    position: absolute;

    left: 18px;

    bottom: 55px;

    width: 105px;

    height: 70px;

    background: white;

    border-radius: 25px;

    box-shadow:

        0 7px 12px

        rgba(60,40,30,.12);

}

.cama::after {

    content: "💤";

    position: absolute;

    font-size: 25px;

    left: 38px;

    top: 20px;

}

/* =====================================================

   BRINQUEDO

===================================================== */

.brinquedo {

    position: absolute;

    right: 25px;

    bottom: 65px;

    font-size: 42px;

}

/* =====================================================

   TAPETE

===================================================== */

.tapete {

    position: absolute;

    left: 50%;

    bottom: 40px;

    transform:

        translateX(-50%);

    width: 300px;

    height: 110px;

    border-radius: 50%;

    background:

        #ead6bf;

}

/* =====================================================

   ÁREA DO PETTON

===================================================== */

.petton-area {

    position: absolute;

    left: 50%;

    bottom: 70px;

    transform:

        translateX(-50%);

    width: 280px;

    height: 270px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

}

/* =====================================================

   SOMBRA

===================================================== */

.sombra {

    position: absolute;

    bottom: 8px;

    left: 50%;

    transform:

        translateX(-50%);

    width: 145px;

    height: 27px;

    background:

        rgba(60,40,30,.18);

    border-radius: 50%;

    filter: blur(7px);

    transition:

        width .8s ease,

        height .8s ease;

}

/* =====================================================

   PETTON

===================================================== */

.petton {

    position: absolute;

    left: 50%;

    bottom: 20px;

    transform:

        translateX(-50%)

        scale(1);

    transform-origin:

        center bottom;

    width: 120px;

    height: 115px;

    border-radius:

        48%

        48%

        43%

        43%;

    transition:

        transform .8s ease,

        width .8s ease,

        height .8s ease;

}

/* =====================================================

   TAMANHOS POR IDADE

===================================================== */

/*

   0–3 dias

   Recém-nascido

*/

.petton.idade-0 {

    transform:

        translateX(-50%)

        scale(.48);

}

/*

   4–7 dias

   Bebê

*/

.petton.idade-1 {

    transform:

        translateX(-50%)

        scale(.62);

}

/*

   8–14 dias

*/

.petton.idade-2 {

    transform:

        translateX(-50%)

        scale(.78);

}

/*

   15–30 dias

*/

.petton.idade-3 {

    transform:

        translateX(-50%)

        scale(.98);

}

/*

   31–60 dias

*/

.petton.idade-4 {

    transform:

        translateX(-50%)

        scale(1.20);

}

/*

   61–90 dias

*/

.petton.idade-5 {

    transform:

        translateX(-50%)

        scale(1.42);

}

/*

   91+ dias

   Adulto

*/

.petton.idade-6 {

    transform:

        translateX(-50%)

        scale(1.62);

}

/* =====================================================

   CABEÇA

===================================================== */

.cabeca {

    position: absolute;

    width: 125px;

    height: 112px;

    left: -3px;

    top: -58px;

    border-radius:

        48%

        48%

        50%

        50%;

    transition:

        all .8s ease;

}

/* =====================================================

   ORELHAS

===================================================== */

.orelha {

    position: absolute;

    background: inherit;

    z-index: -1;

    transition:

        all .8s ease;

}

.orelha.esquerda {

    left: 2px;

}

.orelha.direita {

    right: 2px;

}

/* =====================================================

   GATO

===================================================== */

.petton.gato

.orelha {

    width: 48px;

    height: 58px;

    top: -32px;

    clip-path:

        polygon(

            50% 0%,

            100% 100%,

            0% 100%

        );

}

.petton.gato

.orelha.esquerda {

    transform:

        rotate(-18deg);

}

.petton.gato

.orelha.direita {

    transform:

        rotate(18deg);

}

/* =====================================================

   CACHORRO

===================================================== */

.petton.cachorro

.orelha {

    width: 48px;

    height: 68px;

    top: -23px;

    border-radius:

        15px

        15px

        45px

        45px;

}

.petton.cachorro

.orelha.esquerda {

    transform:

        rotate(16deg);

}

.petton.cachorro

.orelha.direita {

    transform:

        rotate(-16deg);

}

/* =====================================================

   COELHO

===================================================== */

.petton.coelho

.orelha {

    width: 40px;

    height: 105px;

    top: -72px;

    border-radius:

        55%

        55%

        35%

        35%;

}

.petton.coelho

.orelha.esquerda {

    transform:

        rotate(-8deg);

}

.petton.coelho

.orelha.direita {

    transform:

        rotate(8deg);

}

.petton.coelho

.orelha::after {

    content: "";

    position: absolute;

    inset: 8px;

    background:

        #f2bebe;

    border-radius:

        inherit;

}

/* =====================================================

   OLHOS

===================================================== */

.olho {

    position: absolute;

    width: 15px;

    height: 18px;

    top: 42px;

    border-radius: 50%;

    transition:

        all .6s ease;

}

.olho::after {

    content: "";

    position: absolute;

    width: 5px;

    height: 7px;

    background: white;

    border-radius: 50%;

    left: 3px;

    top: 3px;

}

.olho.esquerdo {

    left: 28px;

}

.olho.direito {

    right: 28px;

}

/* =====================================================

   FOCINHO

===================================================== */

.focinho {

    position: absolute;

    left: 50%;

    top: 60px;

    transform:

        translateX(-50%);

    width: 48px;

    height: 30px;

}

.nariz {

    position: absolute;

    left: 50%;

    top: 0;

    transform:

        translateX(-50%);

    width: 15px;

    height: 11px;

    border-radius: 50%;

}

.boca {

    position: absolute;

    left: 50%;

    top: 10px;

    width: 6px;

    height: 13px;

    border-left:

        2px solid #60483f;

    border-bottom:

        2px solid #60483f;

    transform:

        translateX(-50%)

        rotate(-45deg);

}

/* =====================================================

   PATAS

===================================================== */

.pata {

    position: absolute;

    width: 31px;

    height: 47px;

    bottom: -15px;

    border-radius: 45%;

    transition:

        all .7s ease;

}

.pata.esquerda {

    left: 14px;

}

.pata.direita {

    right: 14px;

}

/* =====================================================

   RABO

===================================================== */

.rabo {

    position: absolute;

    right: -34px;

    bottom: 34px;

    width: 52px;

    height: 65px;

    border:

        15px solid currentColor;

    border-left: 0;

    border-bottom: 0;

    border-radius:

        0

        55px

        0

        0;

    transform:

        rotate(12deg);

    transition:

        all .7s ease;

}

/* =====================================================

   COELHO - RABO

===================================================== */

.petton.coelho

.rabo {

    width: 42px;

    height: 42px;

    border: 0;

    border-radius: 50%;

    background:

        currentColor;

    right: -22px;

    bottom: 45px;

}

/* =====================================================

   CORES

===================================================== */

.cor-branco {

    background: #f7f3ea;

}

.cor-preto {

    background: #272522;

}

.cor-cinza {

    background: #929292;

}

.cor-cinza_claro {

    background: #c4c4c4;

}

.cor-cinza_escuro {

    background: #555;

}

.cor-laranja {

    background: #d8893e;

}

.cor-marrom {

    background: #8a5a3b;

}

.cor-creme {

    background: #e8d0a5;

}

.cor-caramelo {

    background: #c98952;

}

.cor-dourado {

    background: #d9ad55;

}

.cor-preto_branco {

    background:

        linear-gradient(

            135deg,

            #262626 0 48%,

            #f5f2ea 49%

        );

}

.cor-laranja_branco {

    background:

        linear-gradient(

            135deg,

            #d8893e 0 48%,

            #f5f2ea 49%

        );

}

.cor-marrom_branco {

    background:

        linear-gradient(

            135deg,

            #8a5a3b 0 48%,

            #f5f2ea 49%

        );

}

.cor-caramelo_branco {

    background:

        linear-gradient(

            135deg,

            #c98952 0 48%,

            #f5f2ea 49%

        );

}

/* =====================================================

   OLHOS

===================================================== */

.olhos-azuis {

    background: #5e8fd1;

}

.olhos-azul_claro {

    background: #8dc7ed;

}

.olhos-verdes {

    background: #62a56b;

}

.olhos-amarelos {

    background: #d7c34e;

}

.olhos-dourados {

    background: #d4a53c;

}

.olhos-castanhos {

    background: #75462c;

}

.olhos-mel {

    background: #b78648;

}

.olhos-pretos {

    background: #151515;

}

.olhos-cinza {

    background: #8d969d;

}

.olhos-vermelhos {

    background: #d55b62;

}

/* =====================================================

   NARIZ

===================================================== */

.nariz-rosa {

    background: #ef9999;

}

.nariz-preto {

    background: #252525;

}

.nariz-marrom {

    background: #75442f;

}

.nariz-cinza {

    background: #737373;

}

/* =====================================================

   PADRÕES

===================================================== */

.padrao-tabby

.cabeca::after,

.padrao-listrado

.cabeca::after,

.padrao-tigrado

.cabeca::after {

    content: "";

    position: absolute;

    width: 13px;

    height: 65px;

    left: 56px;

    top: 15px;

    background:

        rgba(

            80,

            45,

            25,

            .30

        );

    transform:

        rotate(10deg);

    border-radius: 50%;

}

.padrao-manchas

.cabeca::after,

.padrao-pintinhas

.cabeca::after {

    content: "";

    position: absolute;

    width: 22px;

    height: 19px;

    right: 18px;

    top: 17px;

    background:

        rgba(

            75,

            45,

            30,

            .35

        );

    border-radius: 50%;

}

.padrao-peito_branco::after {

    content: "";

    position: absolute;

    width: 55px;

    height: 60px;

    left: 33px;

    bottom: -3px;

    background:

        #f8f4eb;

    border-radius: 50%;

}

.padrao-patas_brancas

.pata {

    background:

        #f8f4eb !important;

}

.padrao-rosto_bicolor

.cabeca::after {

    content: "";

    position: absolute;

    width: 50%;

    height: 100%;

    right: 0;

    top: 0;

    background:

        rgba(

            255,

            255,

            255,

            .55

        );

    border-radius:

        0

        55px

        55px

        0;

}

.padrao-mancha_no_olho

.cabeca::after {

    content: "";

    position: absolute;

    width: 35px;

    height: 32px;

    left: 17px;

    top: 31px;

    background:

        rgba(

            65,

            40,

            30,

            .45

        );

    border-radius: 50%;

}

.padrao-mancha_no_nariz

.cabeca::after {

    content: "";

    position: absolute;

    width: 35px;

    height: 25px;

    left: 45px;

    top: 57px;

    background:

        rgba(

            80,

            50,

            40,

            .3

        );

    border-radius: 50%;

}

/* =====================================================

   RABO

===================================================== */

.rabo-curto {

    width: 35px;

    height: 38px;

}

.rabo-longo {

    width: 62px;

    height: 80px;

}

.rabo-fofinho {

    width: 58px;

    height: 58px;

    border-width: 18px;

}

.rabo-curvado {

    transform:

        rotate(35deg);

}

.rabo-levantado {

    transform:

        rotate(-20deg);

}

.rabo-ponta_branca::after {

    content: "";

    position: absolute;

    width: 17px;

    height: 17px;

    background: white;

    border-radius: 50%;

    right: -8px;

    top: -10px;

}

/* =====================================================

   INFORMAÇÕES

===================================================== */

.info {

    width:

        calc(100% - 30px);

    max-width: 500px;

    margin:

        15px

        auto;

    padding: 18px;

    background:

        rgba(

            255,

            255,

            255,

            .88

        );

    border-radius: 22px;

    box-shadow:

        0 7px 20px

        rgba(60,40,30,.10);

}

.nome {

    text-align: center;

    font-size: 24px;

    font-weight: 800;

}

.especie {

    text-align: center;

    margin-top: 5px;

    font-size: 16px;

    font-weight: 700;

}

.idade {

    text-align: center;

    margin-top: 5px;

    color: #80685d;

    font-size: 14px;

}

.raridade {

    text-align: center;

    margin-top: 5px;

    font-size: 13px;

    color: #876d60;

}

/* =====================================================

   CARACTERÍSTICAS

===================================================== */

.caracteristicas {

    display: grid;

    grid-template-columns:

        repeat(2,1fr);

    gap: 8px;

    margin-top: 15px;

}

.caracteristica {

    background:

        #faf5ef;

    border-radius: 13px;

    padding: 9px;

    font-size: 12px;

}

.caracteristica strong {

    display: block;

    font-size: 13px;

    margin-top: 2px;

}

/* =====================================================

   STATUS

===================================================== */

.status {

    margin-top: 18px;

}

.linha {

    margin-bottom: 11px;

}

.linha-topo {

    display: flex;

    justify-content:

        space-between;

    font-size: 13px;

    margin-bottom: 5px;

}

.barra {

    width: 100%;

    height: 9px;

    background:

        #eadfd5;

    border-radius: 10px;

    overflow: hidden;

}

.preenchimento {

    height: 100%;

    width: 80%;

    background:

        #78b77b;

    border-radius: inherit;

    transition:

        width .5s ease;

}

/* =====================================================

   BOTÕES

===================================================== */

.botoes {

    display: grid;

    grid-template-columns:

        repeat(2,1fr);

    gap: 10px;

    width:

        calc(100% - 30px);

    max-width: 500px;

    margin:

        15px

        auto

        30px;

}

button {

    border: 0;

    padding: 14px 10px;

    border-radius: 17px;

    background: white;

    box-shadow:

        0 5px 14px

        rgba(50,40,30,.10);

    font-size: 14px;

    font-weight: 700;

    color: #4c382f;

}

button:active {

    transform:

        scale(.97);

}

/* =====================================================

   ANIMAÇÃO

===================================================== */

@keyframes respirar {

    0%,100% {

        transform:

            translateX(-50%)

            scale(var(--escala));

    }

    50% {

        transform:

            translateX(-50%)

            translateY(-3px)

            scale(var(--escala));

    }

}

/* =====================================================

   RESPONSIVO

===================================================== */

@media(max-height:650px) {

    .quarto {

        height: 430px;

    }

    .petton-area {

        bottom: 48px;

    }

}

</style>

</head>

<script>

/* =====================================================

   NOMES

===================================================== */

function nomeBonito(valor) {

    if (!valor) {

        return "Ainda não apareceu";

    }

    const nomes = {

        branco: "Branco",

/* =====================================================

   ESPÉCIE

===================================================== */

function nomeEspecie(especie) {

    if (especie === "gato") {

        return "🐱 Gato";

    }

    if (especie === "cachorro") {

        return "🐶 Cachorro";

    }

    if (especie === "coelho") {

        return "🐰 Coelho";

    }

    return "🐾 Petton";

}

/* =====================================================

   RARIDADE

===================================================== */

function nomeRaridade(raridade) {

    if (raridade === "especial") {

        return "✨ Petton Especial";

    }

    if (raridade === "raro") {

        return "💎 Petton Raro";

    }

    if (raridade === "incomum") {

        return "⭐ Petton Incomum";

    }

    return "🌱 Petton Comum";

}

/* =====================================================

   IDADE

===================================================== */

function calcularIdade() {

    if (

        !Petton.dados ||

        !Petton.dados.dateNascimento

    ) {

        return 0;

    }

    const nascimento =

        new Date(

            Petton.dados.dateNascimento

        );

    const agora =

        new Date();

    return Math.max(

        0,

        (

            agora.getTime() -

            nascimento.getTime()

        ) / 86400000

    );

}

/* =====================================================

   CLASSE DE CRESCIMENTO

===================================================== */

function classeCrescimento(dias) {

    if (dias < 4) {

        return "idade-0";

    }

    if (dias < 8) {

        return "idade-1";

    }

    if (dias < 15) {

        return "idade-2";

    }

    if (dias < 31) {

        return "idade-3";

    }

    if (dias < 61) {

        return "idade-4";

    }

    if (dias < 91) {

        return "idade-5";

    }

    return "idade-6";

}

/* =====================================================

   TEXTO DA IDADE

===================================================== */

function textoIdade(dias) {

    const inteiro =

        Math.floor(dias);

    if (inteiro === 0) {

        return "Nasceu hoje ❤️";

    }

    if (inteiro === 1) {

        return "1 dia de vida";

    }

    return inteiro +

        " dias de vida";

}

/* =====================================================

   APLICA CRESCIMENTO

===================================================== */

function aplicarCrescimento() {

    const visual =

        document.getElementById(

            "pettonVisual"

        );

    const sombra =

        document.getElementById(

            "sombra"

        );

    if (

        !Petton.dados ||

        !Petton.dados.dateNascimento

    ) {

        visual.className =

            "petton";

        sombra.style.width =

            "90px";

        return;

    }

    const dias =

        calcularIdade();

    visual.classList.remove(

        "idade-0",

        "idade-1",

        "idade-2",

        "idade-3",

        "idade-4",

        "idade-5",

        "idade-6"

    );

    visual.classList.add(

        classeCrescimento(

            dias

        )

    );

    /*

     * A sombra também aumenta

     * junto com o Petton.

     */

    let largura;

    if (dias < 4) {

        largura = 70;

    } else if (dias < 8) {

        largura = 85;

    } else if (dias < 15) {

        largura = 100;

    } else if (dias < 31) {

        largura = 120;

    } else if (dias < 61) {

        largura = 145;

    } else if (dias < 91) {

        largura = 165;

    } else {

        largura = 185;

    }

    sombra.style.width =

        largura + "px";

}

/* =====================================================

   VISUAL

===================================================== */

function aplicarVisual() {

    const dados =

        Petton.dados;

    if (!dados) {

        return;

    }

    const c =

        dados.caracteristicas || {};

    const v =

        dados.caracteristicasVisiveis || {};

    const visual =

        document.getElementById(

            "pettonVisual"

        );

    /*

     * ESPÉCIE

     */

    visual.classList.add(

        dados.especie ||

        "gato"

    );

    /*

     * COR

     */

    if (v.cor) {

        visual.classList.add(

            "cor-" +

            c.cor

        );

    } else {

        visual.classList.add(

            "cor-creme"

        );

    }

    /*

     * PADRÃO

     */

    if (v.padrao) {

        visual.classList.add(

            "padrao-" +

            c.padrao

        );

    }

    /*

     * OLHOS

     */

    const olhos =

        document.querySelectorAll(

            ".olho"

        );

    olhos.forEach(

        olho => {

            olho.className =

                "olho " +

                (

                    olho.classList

                        .contains(

                            "esquerdo"

                        )

                    ? "esquerdo "

                    : "direito "

                ) +

                (

                    v.olhos

                    ? "olhos-" +

                      c.olhos

                    : "olhos-azuis"

                );

        }

    );

    /*

     * NARIZ

     */

    const nariz =

        document.getElementById(

            "nariz"

        );

    nariz.className =

        "nariz " +

        (

            v.nariz

            ? "nariz-" + c.nariz

            : "nariz-rosa"

        );

    /*

     * RABO

     */

    const rabo =

        document.getElementById(

            "rabo"

        );

    if (v.rabo) {

        rabo.className =

            "rabo rabo-" +

            c.rabo;

        rabo.style.color =

            corRabo(

                c.cor

            );

    } else {

        rabo.className =

            "rabo";

        rabo.style.color =

            corRabo(

                c.cor

            );

    }

    /*

     * PATAS

     */

    const patas =

        document.querySelectorAll(

            ".pata"

        );

    patas.forEach(

        pata => {

            pata.style.background =

                "";

            pata.style.filter =

                "";

        }

    );

    if (v.patas) {

        if (

            c.patas ===

            "brancas"

        ) {

            patas.forEach(

                pata => {

                    pata.style.background =

                        "#fffaf0";

                }

            );

        }

        if (

            c.patas ===

            "escuras"

        ) {

            patas.forEach(

                pata => {

                    pata.style.filter =

                        "brightness(.65)";

                }

            );

        }

        if (

            c.patas ===

            "peludas"

        ) {

            patas.forEach(

                pata => {

                    pata.style.borderRadius =

                        "40% 40% 55% 55%";

                    pata.style.transform =

                        "scale(1.08)";

                }

            );

        }

    }

}

/* =====================================================

   COR DO RABO

===================================================== */

function corRabo(cor) {

    const cores = {

        branco: "#f7f3ea",

        preto: "#272522",

        cinza: "#929292",

        cinza_claro: "#c4c4c4",

        cinza_escuro: "#555",

        laranja: "#d8893e",

        marrom: "#8a5a3b",

        creme: "#e8d0a5",

        caramelo: "#c98952",

        dourado: "#d9ad55",

        preto_branco: "#272522",

        laranja_branco: "#d8893e",

        marrom_branco: "#8a5a3b",

        caramelo_branco: "#c98952"

    };

    return cores[cor] ||

        "#d8c8b8";

}

/* =====================================================

   INFORMAÇÕES

===================================================== */

function atualizarInformacoes() {

    const dados =

        Petton.dados;

    if (!dados) {

        return;

    }

    const c =

        dados.caracteristicas || {};

    const v =

        dados.caracteristicasVisiveis || {};

    const dias =

        calcularIdade();

    document.getElementById(

        "nome"

    ).textContent =

        dados.nome ||

        "Petton";

    document.getElementById(

        "especie"

    ).textContent =

        nomeEspecie(

            dados.especie

        );

    document.getElementById(

        "idade"

    ).textContent =

        dados.dateNascimento

        ? textoIdade(dias)

        : "Ainda está no ovo";

    document.getElementById(

        "raridade"

    ).textContent =

        nomeRaridade(

            c.raridade

        );

    document.getElementById(

        "cor"

    ).textContent =

        v.cor

        ? nomeBonito(c.cor)

        : "Ainda aparecendo...";

    document.getElementById(

        "olhos"

    ).textContent =

        v.olhos

        ? nomeBonito(c.olhos)

        : "Ainda aparecendo...";

    document.getElementById(

        "padrao"

    ).textContent =

        v.padrao

        ? nomeBonito(c.padrao)

        : "Ainda aparecendo...";

    document.getElementById(

        "orelhas"

    ).textContent =

        v.orelhas

        ? nomeBonito(c.orelhas)

        : "Ainda aparecendo...";

    document.getElementById(

        "patas"

    ).textContent =

        v.patas

        ? nomeBonito(c.patas)

        : "Ainda aparecendo...";

    document.getElementById(

        "raboTexto"

    ).textContent =

        v.rabo

        ? nomeBonito(c.rabo)

        : "Ainda aparecendo...";

}

/* =====================================================

   STATUS

===================================================== */

function atualizarStatus() {

    if (

        !Petton ||

        !Petton.dados

    ) {

        return;

    }

    const s =

        Petton.status();

    if (!s) {

        return;

    }

    atualizarBarra(

        "fome",

        s.fome

    );

    atualizarBarra(

        "felicidade",

        s.felicidade

    );

    atualizarBarra(

        "energia",

        s.energia

    );

    atualizarBarra(

        "higiene",

        s.higiene

    );

}

function atualizarBarra(

    nome,

    valor

) {

    const numero =

        Math.round(

            Number(valor) || 0

        );

    document.getElementById(

        nome + "Valor"

    ).textContent =

        numero + "%";

    document.getElementById(

        nome + "Barra"

    ).style.width =

        numero + "%";

}

   AÇÕES

===================================================== */

function alimentar() {

    if (

        Petton.alimentar(15)

    ) {

        atualizarStatus();

        alert(

            "🍖 " +

            Petton.dados.nome +

            " comeu!"

        );

    }

}

function brincar() {

    if (

        Petton.brincar(8)

    ) {

        atualizarStatus();

        alert(

            "🧸 " +

            " adorou brincar!"

        );

    } else {

        alert(

            "😴 " +

            Petton.dados.nome +

        );

}

function carinho() {

    if (

        Petton.carinho()

    ) {

        atualizarStatus();

        alert(

            Petton.dados.nome +

            " recebeu carinho!"

        );

    }

}

function dormir() {

    if (

        Petton.dormir()

    ) {

        atualizarStatus();

        alert(

            "😴 " +

            Petton.dados.nome +

            " descansou!"

        );

    }

}

/* =====================================================

   INICIAR

===================================================== */

function iniciar() {

    /*

     * Atualiza os dados antes

     * de mostrar o Petton.

     */

    Petton.carregar();

    /*

     * Se ainda estiver no ovo,

     * manda para nascimento.

     */

    if (

        Petton.dados.fase ===

        "ovo"

    ) {

        document.querySelector(

            ".petton-area"

        ).innerHTML =

            "<div style='text-align:center;padding-top:100px;font-size:22px;'>🥚<br><br>Seu Petton ainda está no ovo.<br><br><button onclick=\"location.href='nascimento.html'\">🥚 Ver nascimento</button></div>";

        return;

    }

    aplicarVisual();

    aplicarCrescimento();

    atualizarInformacoes();

    atualizarStatus();

}

iniciar();

   ATUALIZA A CADA 10 SEGUNDOS

===================================================== */

setInterval(

    function() {

        Petton.carregar();

        aplicarVisual();

        aplicarCrescimento();

        atualizarInformacoes();

        atualizarStatus();

    },

    10000

);

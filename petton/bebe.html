<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Meu Petton</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    background: linear-gradient(#fffaf4, #ead9c9);

    color: #3d2c25;

}

.topo {

    text-align: center;

    padding: 22px 15px 10px;

}

.topo h1 {

    margin: 0;

    font-size: 26px;

}

.topo p {

    margin: 6px 0 0;

    color: #80685d;

    font-size: 14px;

}

.quarto {

    position: relative;

    width: calc(100% - 30px);

    max-width: 500px;

    height: 520px;

    margin: 15px auto;

    overflow: hidden;

    border-radius: 28px;

    background:

        linear-gradient(

            to bottom,

            #f5e9dc 0%,

            #f5e9dc 72%,

            #d6a979 72%,

            #c99665 100%

        );

    box-shadow: 0 12px 30px rgba(70,45,30,.15);

}

/* janela */

.janela {

    position: absolute;

    width: 105px;

    height: 125px;

    right: 25px;

    top: 30px;

    border: 9px solid #fff;

    background: linear-gradient(#bde6ff,#eaf8ff);

    border-radius: 12px;

    box-shadow: 0 5px 12px rgba(50,50,50,.12);

}

.janela::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 0;

    bottom: 0;

    width: 4px;

    background: #fff;

}

.janela::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    top: 50%;

    height: 4px;

    background: #fff;

}

/* tapete */

.tapete {

    position: absolute;

    left: 50%;

    bottom: 48px;

    transform: translateX(-50%);

    width: 290px;

    height: 105px;

    border-radius: 50%;

    background: #ead6bf;

    box-shadow: inset 0 -8px 0 rgba(120,80,50,.08);

}

/* cama */

.cama {

    position: absolute;

    left: 18px;

    bottom: 62px;

    width: 105px;

    height: 70px;

    background: #fff;

    border-radius: 25px;

    box-shadow: 0 7px 12px rgba(60,40,30,.12);

}

.cama::after {

    content: "💤";

    position: absolute;

    font-size: 25px;

    left: 38px;

    top: 20px;

}

/* brinquedo */

.brinquedo {

    position: absolute;

    right: 25px;

    bottom: 70px;

    font-size: 42px;

}

/* =========================

   BEBÊ PETTON

========================= */

.petton-area {

    position: absolute;

    left: 50%;

    bottom: 80px;

    transform: translateX(-50%);

    width: 190px;

    height: 190px;

}

/* sombra */

.sombra {

    position: absolute;

    width: 125px;

    height: 25px;

    left: 32px;

    bottom: 8px;

    background: rgba(60,40,30,.18);

    border-radius: 50%;

    filter: blur(6px);

}

/* corpo */

.petton {

    position: absolute;

    left: 45px;

    bottom: 22px;

    width: 105px;

    height: 105px;

    background: #f5f1e9;

    border-radius: 48% 48% 42% 42%;

    box-shadow:

        inset -10px -12px 18px rgba(100,70,50,.10),

        0 8px 12px rgba(50,35,25,.12);

    animation: respirar 3s ease-in-out infinite;

}

/* cabeça */

.cabeca {

    position: absolute;

    width: 108px;

    height: 100px;

    left: -2px;

    top: -50px;

    background: #f5f1e9;

    border-radius: 48% 48% 50% 50%;

    box-shadow: inset -7px -8px 13px rgba(100,70,50,.08);

}

/* orelhas */

.orelha {

    position: absolute;

    width: 42px;

    height: 52px;

    background: #f5f1e9;

    z-index: -1;

}

.orelha.esquerda {

    left: 0;

    top: -28px;

    border-radius: 75% 25% 40% 30%;

    transform: rotate(-25deg);

}

.orelha.direita {

    right: 0;

    top: -28px;

    border-radius: 25% 75% 30% 40%;

    transform: rotate(25deg);

}

/* interior das orelhas */

.orelha::after {

    content: "";

    position: absolute;

    inset: 9px;

    background: #f1caca;

    border-radius: inherit;

}

/* olhos */

.olho {

    position: absolute;

    width: 13px;

    height: 16px;

    top: 35px;

    background: #4d72a5;

    border-radius: 50%;

}

.olho::after {

    content: "";

    position: absolute;

    width: 4px;

    height: 6px;

    background: #111;

    border-radius: 50%;

    left: 4px;

    top: 4px;

}

.olho.esquerdo {

    left: 25px;

}

.olho.direito {

    right: 25px;

}

/* nariz */

.nariz {

    position: absolute;

    left: 47px;

    top: 57px;

    width: 14px;

    height: 10px;

    background: #ee9b9b;

    border-radius: 50%;

}

/* boca */

.boca {

    position: absolute;

    left: 51px;

    top: 65px;

    width: 5px;

    height: 10px;

    border-left: 2px solid #60483f;

    border-bottom: 2px solid #60483f;

    transform: rotate(-45deg);

}

/* patas */

.pata {

    position: absolute;

    width: 28px;

    height: 45px;

    bottom: -13px;

    background: #f5f1e9;

    border-radius: 45%;

}

.pata.esquerda {

    left: 14px;

}

.pata.direita {

    right: 14px;

}

/* rabo */

.rabo {

    position: absolute;

    right: -23px;

    bottom: 28px;

    width: 45px;

    height: 55px;

    border: 14px solid #f5f1e9;

    border-left: 0;

    border-bottom: 0;

    border-radius: 0 50px 0 0;

    transform: rotate(15deg);

}

/* =========================

   ANIMAÇÕES

========================= */

@keyframes respirar {

    0%,100% {

        transform: scale(1) translateY(0);

    }

    50% {

        transform: scale(1.025) translateY(-2px);

    }

}

.petton:hover {

    animation: carinho .7s ease-in-out;

}

@keyframes carinho {

    0%,100% {

        transform: rotate(0);

    }

    30% {

        transform: rotate(-5deg);

    }

    70% {

        transform: rotate(5deg);

    }

}

/* =========================

   INFORMAÇÕES

========================= */

.info {

    width: calc(100% - 30px);

    max-width: 500px;

    margin: 15px auto;

    padding: 18px;

    background: rgba(255,255,255,.82);

    border-radius: 22px;

    box-shadow: 0 7px 20px rgba(60,40,30,.10);

}

.nome {

    text-align: center;

    font-size: 23px;

    font-weight: 800;

}

.fase {

    text-align: center;

    margin-top: 5px;

    color: #80685d;

}

.idade {

    text-align: center;

    margin-top: 4px;

    font-size: 13px;

}

.status {

    margin-top: 18px;

}

.linha {

    margin-bottom: 11px;

}

.linha-topo {

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    margin-bottom: 5px;

}

.barra {

    width: 100%;

    height: 9px;

    background: #eadfd5;

    border-radius: 10px;

    overflow: hidden;

}

.preenchimento {

    height: 100%;

    width: 80%;

    background: #78b77b;

    border-radius: inherit;

    transition: width .5s;

}

/* botões */

.botoes {

    display: grid;

    grid-template-columns: repeat(2,1fr);

    gap: 10px;

    width: calc(100% - 30px);

    max-width: 500px;

    margin: 15px auto 30px;

}

button {

    border: 0;

    padding: 14px 10px;

    border-radius: 17px;

    background: white;

    box-shadow: 0 5px 14px rgba(50,40,30,.10);

    font-size: 14px;

    font-weight: 700;

    color: #4c382f;

}

button:active {

    transform: scale(.97);

}

</style>

</head>

<body>

<div class="topo">

    <h1>🐾 Meu Petton</h1>

    <p>Meu pequeno companheiro</p>

</div>

<div class="quarto">

    <div class="janela"></div>

    <div class="cama"></div>

    <div class="brinquedo">🧸</div>

    <div class="tapete"></div>

    <div class="petton-area">

        <div class="sombra"></div>

        <div class="petton">

            <div class="cabeca">

                <div class="orelha esquerda"></div>

                <div class="orelha direita"></div>

                <div class="olho esquerdo"></div>

                <div class="olho direito"></div>

                <div class="nariz"></div>

                <div class="boca"></div>

            </div>

            <div class="pata esquerda"></div>

            <div class="pata direita"></div>

            <div class="rabo"></div>

        </div>

    </div>

</div>

<div class="info">

    <div class="nome" id="nome">

        Mimi

    </div>

    <div class="fase">

        🍼 Bebê Petton

    </div>

    <div class="idade" id="idade">

        Nasceu hoje

    </div>

    <div class="status">

        <div class="linha">

            <div class="linha-topo">

                <span>🍖 Fome</span>

                <span id="fomeValor">70%</span>

            </div>

            <div class="barra">

                <div class="preenchimento" id="fomeBarra"></div>

            </div>

        </div>

        <div class="linha">

            <div class="linha-topo">

                <span>❤️ Felicidade</span>

                <span id="felicidadeValor">100%</span>

            </div>

            <div class="barra">

                <div class="preenchimento" id="felicidadeBarra"></div>

            </div>

        </div>

        <div class="linha">

            <div class="linha-topo">

                <span>⚡ Energia</span>

                <span id="energiaValor">100%</span>

            </div>

            <div class="barra">

                <div class="preenchimento" id="energiaBarra"></div>

            </div>

        </div>

        <div class="linha">

            <div class="linha-topo">

                <span>🧼 Higiene</span>

                <span id="higieneValor">100%</span>

            </div>

            <div class="barra">

                <div class="preenchimento" id="higieneBarra"></div>

            </div>

        </div>

    </div>

</div>

<div class="botoes">

    <button onclick="alimentar()">

        🍖 Alimentar

    </button>

    <button onclick="brincar()">

        🧸 Brincar

    </button>

    <button onclick="carinho()">

        ❤️ Carinho

    </button>

    <button onclick="dormir()">

        😴 Dormir

    </button>

</div>

<script src="petton.js"></script>

<script>

function atualizarTela() {

    const status = Petton.status();

    document.getElementById("nome").textContent =

        status.nome;

    document.getElementById("idade").textContent =

        status.idade;

    atualizarBarra(

        "fome",

        status.fome

    );

    atualizarBarra(

        "felicidade",

        status.felicidade

    );

    atualizarBarra(

        "energia",

        status.energia

    );

    atualizarBarra(

        "higiene",

        status.higiene

    );

}

function atualizarBarra(nome, valor) {

    const numero =

        Math.round(valor);

    document.getElementById(

        nome + "Valor"

    ).textContent = numero + "%";

    document.getElementById(

        nome + "Barra"

    ).style.width = numero + "%";

}

function alimentar() {

    if (Petton.alimentar(15)) {

        alert("🍖 O pequeno Petton comeu!");

        atualizarTela();

    }

}

function brincar() {

    if (Petton.brincar(8)) {

        alert("🧸 O Petton adorou brincar!");

        atualizarTela();

    }

}

function carinho() {

    if (Petton.dados.fase === "ovo") return;

    Petton.dados.felicidade =

        Math.min(

            100,

            Petton.dados.felicidade + 5

        );

    Petton.salvar();

    alert("❤️ O Petton recebeu carinho!");

    atualizarTela();

}

function dormir() {

    if (Petton.dormir()) {

        alert("😴 O Petton dormiu e recuperou energia!");

        atualizarTela();

    }

}

atualizarTela();

setInterval(atualizarTela, 3000);

</script>

</body>

</html>

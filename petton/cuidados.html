<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Cuidados do Petton</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

    background:linear-gradient(180deg,#eff6ff,#fdf2f8,#f5f3ff);

    color:#333;

    min-height:100vh;

}

.container{

    max-width:650px;

    margin:auto;

    padding:18px;

}

.topo{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:18px;

}

.voltar{

    width:42px;

    height:42px;

    border:0;

    border-radius:14px;

    background:white;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    font-size:22px;

}

.titulo{

    flex:1;

}

.titulo h1{

    margin:0;

    font-size:23px;

}

.titulo p{

    margin:3px 0 0;

    color:#777;

    font-size:13px;

}

.card{

    background:white;

    border-radius:24px;

    padding:20px;

    margin-bottom:16px;

    box-shadow:0 5px 20px rgba(0,0,0,.07);

}

.pet{

    text-align:center;

}

.pet-emoji{

    font-size:78px;

    line-height:1;

    margin:5px 0 10px;

}

.pet-imagem{

    max-width:180px;

    max-height:190px;

    display:block;

    margin:5px auto 10px;

    object-fit:contain;

}

.nome{

    font-size:25px;

    font-weight:800;

}

.idade{

    color:#777;

    margin-top:5px;

    font-size:14px;

}

.estado{

    display:inline-block;

    margin-top:12px;

    padding:8px 15px;

    border-radius:20px;

    background:#dcfce7;

    color:#166534;

    font-weight:700;

    font-size:13px;

}

.estado.atencao{

    background:#fef3c7;

    color:#92400e;

}

.estado.urgente{

    background:#fee2e2;

    color:#b91c1c;

}

/* OVO */

.ovo-titulo{

    font-size:20px;

    font-weight:800;

    color:#70452b;

    margin-bottom:8px;

}

.ovo-visual{

    width:150px;

    height:175px;

    margin:10px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:120px;

    line-height:1;

}

.ovo-tempo{

    font-size:32px;

    font-weight:bold;

    color:#4e2e1d;

    letter-spacing:1px;

    margin:8px 0 15px;

    font-variant-numeric:tabular-nums;

}

.ovo-info{

    color:#76502e;

    font-size:14px;

    line-height:1.5;

    margin-top:10px;

}

.ovo-aviso{

    background:#fff7ed;

    border-radius:17px;

    padding:14px;

    color:#92400e;

    font-size:13px;

    line-height:1.5;

}

/* BARRAS */

.barra-area{

    margin-top:14px;

}

.barra-topo{

    display:flex;

    justify-content:space-between;

    font-size:13px;

    margin-bottom:7px;

}

.barra{

    height:13px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

}

.barra-interna{

    height:100%;

    width:0%;

    border-radius:20px;

    transition:width .4s;

}

/* AÇÕES */

.acoes{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

}

.acao{

    border:0;

    border-radius:19px;

    background:#fafafa;

    padding:16px 10px;

    min-height:125px;

    box-shadow:0 2px 8px rgba(0,0,0,.05);

}

.acao:active{

    transform:scale(.97);

}

.acao .emoji{

    font-size:38px;

    line-height:1;

}

.acao strong{

    display:block;

    margin-top:9px;

    font-size:15px;

}

.acao span{

    display:block;

    margin-top:4px;

    color:#888;

    font-size:12px;

    line-height:1.35;

}

.acao:disabled{

    opacity:.45;

}

/* MENSAGEM */

.mensagem{

    text-align:center;

    min-height:23px;

    margin-top:14px;

    font-weight:700;

    color:#16a34a;

    font-size:14px;

}

/* LISTA */

.lista{

    display:grid;

    gap:10px;

}

.item{

    display:flex;

    align-items:center;

    gap:12px;

    padding:13px;

    border-radius:17px;

    background:#fafafa;

}

.item-emoji{

    width:43px;

    height:43px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    background:white;

    font-size:25px;

}

.item-texto{

    flex:1;

}

.item-texto strong{

    display:block;

    font-size:14px;

}

.item-texto span{

    display:block;

    color:#888;

    font-size:12px;

    margin-top:3px;

}

.ponto{

    width:10px;

    height:10px;

    border-radius:50%;

    background:#22c55e;

}

.ponto.amarelo{

    background:#f59e0b;

}

.ponto.vermelho{

    background:#ef4444;

}

/* AVISOS */

.aviso{

    background:#eff6ff;

    color:#1e40af;

    border-radius:17px;

    padding:14px;

    font-size:13px;

    line-height:1.55;

}

.aviso-doente{

    background:#fee2e2;

    color:#991b1b;

}

.rodape{

    text-align:center;

    color:#999;

    font-size:12px;

    padding:5px 0 25px;

}

/* ANIMAÇÕES */

.animacao-acao{

    animation:pular .6s ease;

}

@keyframes pular{

    0%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.06);

    }

    100%{

        transform:scale(1);

    }

}

@media(max-width:390px){

    .acoes{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="topo">

        <button

            class="voltar"

            onclick="history.back()">

            ←

        </button>

        <div class="titulo">

            <h1>🛁 Cuidados</h1>

            <p>

                Seu Petton precisa de você

            </p>

        </div>

    </div>

    <div id="conteudo">

        <div class="card pet">

            <div class="pet-emoji">

                🐾

            </div>

            <p>

                Carregando...

            </p>

        </div>

    </div>

</div>

<script src="petton.js"></script>

<script>

/* =====================================================

   DADOS

   ===================================================== */

let dados = null;

/* =====================================================

   CARREGAR PETTON

   ===================================================== */

function carregarDados(){

    dados = null;

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.carregar

        ){

            dados = Petton.carregar();

        }

    }catch(e){

        console.log(

            "Erro ao carregar Petton:",

            e

        );

    }

}

/* =====================================================

   OVO

   ===================================================== */

function estaNoOvo(){

    return (

        !dados ||

        !dados.dateNascimento

    );

}

/* =====================================================

   IDADE

   ===================================================== */

function idadeDias(){

    if(!dados){

        return 0;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.idadeDias

        ){

            return Petton.idadeDias();

        }

    }catch(e){}

    if(!dados.dateNascimento){

        return 0;

    }

    const nascimento =

        new Date(

            dados.dateNascimento

        );

    return Math.max(

        0,

        Math.floor(

            (

                Date.now() -

                nascimento.getTime()

            ) / 86400000

        )

    );

}

/* =====================================================

   ESPÉCIE

   ===================================================== */

function especieEmoji(){

    if(!dados){

        return "🥚";

    }

    if(

        dados.especie === "cachorro"

    ){

        return "🐶";

    }

    if(

        dados.especie === "coelho"

    ){

        return "🐰";

    }

    return "🐱";

}

/* =====================================================

   IMAGEM

   ===================================================== */

function especieImagem(){

    if(!dados){

        return null;

    }

    if(

        dados.especie === "cachorro"

    ){

        return "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png";

    }

    if(

        dados.especie === "coelho"

    ){

        return "39CE7A33-D105-4E83-BF3B-DDE48E046D60.png";

    }

    if(

        dados.especie === "gato"

    ){

        return "petton-original.png";

    }

    return null;

}

/* =====================================================

   VALOR SEGURO

   ===================================================== */

function valor(

    numero,

    padrao = 0

){

    const n =

        Number(numero);

    if(!Number.isFinite(n)){

        return padrao;

    }

    return Math.max(

        0,

        Math.min(

            100,

            n

        )

    );

}

/* =====================================================

   ESTADO GERAL

   ===================================================== */

function estadoGeral(){

    if(

        dados &&

        dados.doente

    ){

        return {

            texto:"🤒 Está doente",

            classe:"urgente"

        };

    }

    const saude =

        valor(

            dados.saude,

            100

        );

    const higiene =

        valor(

            dados.higiene,

            100

        );

    if(saude < 40){

        return {

            texto:"🥺 Precisa de atenção",

            classe:"urgente"

        };

    }

    if(higiene < 40){

        return {

            texto:"🧼 Precisa de cuidados",

            classe:"atencao"

        };

    }

    return {

        texto:"🥰 Muito bem cuidado",

        classe:""

    };

}

/* =====================================================

   BARRA

   ===================================================== */

function barraHTML(

    nome,

    valorBarra

){

    const v =

        valor(

            valorBarra,

            100

        );

    let cor =

        "#22c55e";

    if(v < 40){

        cor =

            "#ef4444";

    }

    else if(v < 70){

        cor =

            "#f59e0b";

    }

    return `

        <div class="barra-area">

            <div class="barra-topo">

                <span>

                    ${nome}

                </span>

                <strong>

                    ${Math.round(v)}%

                </strong>

            </div>

            <div class="barra">

                <div

                    class="barra-interna"

                    style="

                        width:${v}%;

                        background:${cor};

                    "

                ></div>

            </div>

        </div>

    `;

}

/* =====================================================

   TEM COCO

   ===================================================== */

function temCoco(){

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.temCoco

        ){

            return Petton.temCoco();

        }

    }catch(e){}

    return !!(

        dados &&

        dados.cocoAtivo

    );

}

/* =====================================================

   TEM CÁRIE

   ===================================================== */

function temCarie(){

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.temCarie

        ){

            return Petton.temCarie();

        }

    }catch(e){}

    return !!(

        dados &&

        dados.carieAtiva

    );

}

/* =====================================================

   ESTÁ PASSEANDO

   ===================================================== */

function estaPasseando(){

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.estaPasseando

        ){

            return Petton.estaPasseando();

        }

    }catch(e){}

    return !!(

        dados &&

        dados.passeandoAte

    );

}

/* =====================================================

   ESTÁ NO HOSPITAL

   ===================================================== */

function estaNoHospital(){

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.estaNoHospital

        ){

            return Petton.estaNoHospital();

        }

    }catch(e){}

    return !!(

        dados &&

        dados.hospitalAte

    );

}

/* =====================================================

   MENSAGEM

   ===================================================== */

function mostrarMensagem(texto){

    const elemento =

        document.getElementById(

            "mensagem"

        );

    if(!elemento){

        return;

    }

    elemento.textContent =

        texto;

    setTimeout(()=>{

        if(

            elemento.textContent ===

            texto

        ){

            elemento.textContent =

                "";

        }

    },3000);

}

/* =====================================================

   BANHO

   ===================================================== */

function banho(){

    carregarDados();

    if(estaNoOvo()){

        mostrarMensagem(

            "🥚 O Petton ainda está no ovo!"

        );

        return;

    }

    if(dados.doente){

        mostrarMensagem(

            "🤒 Petton está doente. Leve ao hospital."

        );

        return;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.limpar

        ){

            Petton.limpar();

            mostrarMensagem(

                "🛁 Petton tomou banho!"

            );

            renderizarAgora();

            return;

        }

    }catch(e){

        console.log(e);

    }

    mostrarMensagem(

        "🛁 Banho realizado!"

    );

}

/* =====================================================

   LIMPAR COCO

   ===================================================== */

function limparCoco(){

    carregarDados();

    if(estaNoOvo()){

        mostrarMensagem(

            "🥚 O Petton ainda está no ovo!"

        );

        return;

    }

    if(!temCoco()){

        mostrarMensagem(

            "✨ Não há cocô para limpar."

        );

        return;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.limparCoco

        ){

            Petton.limparCoco();

            mostrarMensagem(

                "🧹 Cocô limpo! Muito bem!"

            );

            renderizarAgora();

            return;

        }

    }catch(e){

        console.log(e);

    }

}

/* =====================================================

   ESCOVAR DENTES

   ===================================================== */

function escovarDentes(){

    carregarDados();

    if(estaNoOvo()){

        mostrarMensagem(

            "🥚 O Petton ainda está no ovo!"

        );

        return;

    }

    if(dados.doente){

        mostrarMensagem(

            "🤒 Petton está doente. Leve ao hospital."

        );

        return;

    }

    if(!temCarie()){

        mostrarMensagem(

            "🦷 Os dentes estão saudáveis!"

        );

        return;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.escovarDentes

        ){

            Petton.escovarDentes();

            mostrarMensagem(

                "🪥 Escovando os dentes..."

            );

            renderizarAgora();

            return;

        }

    }catch(e){

        console.log(e);

    }

}

/* =====================================================

   PASSEAR

   ===================================================== */

function passear(){

    carregarDados();

    if(estaNoOvo()){

        mostrarMensagem(

            "🥚 O Petton ainda está no ovo!"

        );

        return;

    }

    if(dados.doente){

        mostrarMensagem(

            "🤒 Petton está doente. Primeiro leve ao hospital."

        );

        return;

    }

    if(estaPasseando()){

        mostrarMensagem(

            "🚶 Petton já está passeando!"

        );

        return;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.passear

        ){

            Petton.passear();

            mostrarMensagem(

                "🚶 Petton saiu para passear!"

            );

            renderizarAgora();

            return;

        }

    }catch(e){

        console.log(e);

    }

}

/* =====================================================

   HOSPITAL

   ===================================================== */

function hospital(){

    carregarDados();

    if(estaNoOvo()){

        mostrarMensagem(

            "🥚 O Petton ainda está no ovo!"

        );

        return;

    }

    if(!dados.doente){

        mostrarMensagem(

            "❤️ O Petton não precisa do hospital agora."

        );

        return;

    }

    if(estaNoHospital()){

        mostrarMensagem(

            "🏥 Petton já está em tratamento."

        );

        return;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.levarHospital

        ){

            Petton.levarHospital();

            mostrarMensagem(

                "🏥 Petton está recebendo tratamento..."

            );

            renderizarAgora();

            return;

        }

    }catch(e){

        console.log(e);

    }

}

/* =====================================================

   FORMATAR TEMPO

   ===================================================== */

function formatarTempo(ms){

    ms =

        Math.max(

            0,

            ms

        );

    const totalSegundos =

        Math.ceil(

            ms / 1000

        );

    const horas =

        Math.floor(

            totalSegundos / 3600

        );

    const minutos =

        Math.floor(

            (totalSegundos % 3600) / 60

        );

    const segundos =

        totalSegundos % 60;

    return (

        String(horas).padStart(2,"0") +

        ":" +

        String(minutos).padStart(2,"0") +

        ":" +

        String(segundos).padStart(2,"0")

    );

}

/* =====================================================

   RENDERIZAR OVO

   ===================================================== */

function renderizarOvo(){

    let restante =

        0;

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.incubacaoRestante

        ){

            restante =

                Petton.incubacaoRestante();

        }

    }catch(e){

        restante = 0;

    }

    const area =

        document.getElementById(

            "conteudo"

        );

    area.innerHTML = `

        <div class="card pet">

            <div class="ovo-titulo">

                🥚 Seu Petton está no ovo!

            </div>

            <div class="ovo-visual">

                🥚

            </div>

            <div

                id="contadorOvo"

                class="ovo-tempo">

                ${formatarTempo(restante)}

            </div>

            <div class="ovo-info">

                ⏳ O Petton ainda não nasceu.

                <br><br>

                Quando a incubação terminar,

                ele poderá nascer.

            </div>

        </div>

        <div class="card">

            <div class="ovo-aviso">

                💡 <strong>Cuidados bloqueados</strong>

                <br><br>

                Enquanto o Petton estiver no ovo,

                ele não precisa de banho,

                passeio, comida ou outros cuidados.

                <br><br>

                Primeiro ele precisa nascer. 🐣

            </div>

        </div>

        <div class="rodape">

            🥚 Primeiro o nascimento.

            Depois começam os cuidados. 🐾

        </div>

    `;

}

/* =====================================================

   RENDERIZAR PET

   ===================================================== */

function renderizar(){

    carregarDados();

    if(estaNoOvo()){

        renderizarOvo();

        return;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            Petton.verificarCrescimento

        ){

            Petton.verificarCrescimento();

            dados =

                Petton.carregar();

        }

    }catch(e){}

    if(estaNoOvo()){

        renderizarOvo();

        return;

    }

    const area =

        document.getElementById(

            "conteudo"

        );

    const idade =

        idadeDias();

    const estado =

        estadoGeral();

    const imagem =

        especieImagem();

    const coco =

        temCoco();

    const carie =

        temCarie();

    const doente =

        !!dados.doente;

    const hospitalEmAndamento =

        estaNoHospital();

    const passeandoAgora =

        estaPasseando();

    const saude =

        valor(

            dados.saude,

            100

        );

    const higiene =

        valor(

            dados.higiene,

            100

        );

    const energia =

        valor(

            dados.energia,

            100

        );

    const felicidade =

        valor(

            dados.felicidade,

            dados.humor !== undefined

            ? dados.humor

            : 100

        );

    /* AÇÕES NORMAIS */

    let acoesNormais = "";

    if(

        !doente &&

        !hospitalEmAndamento

    ){

        acoesNormais = `

            <button

                class="acao"

                onclick="banho()">

                <div class="emoji">

                    🛁

                </div>

                <strong>

                    Dar banho

                </strong>

                <span>

                    Deixa o Petton limpinho.

                </span>

            </button>

            <button

                class="acao"

                onclick="passear()">

                <div class="emoji">

                    🚶

                </div>

                <strong>

                    Passear

                </strong>

                <span>

                    Leve o Petton para passear.

                </span>

            </button>

        `;

    }

    /* COCO */

    let acaoCoco = "";

    if(

        coco &&

        !doente &&

        !hospitalEmAndamento

    ){

        acaoCoco = `

            <button

                class="acao"

                onclick="limparCoco()">

                <div class="emoji">

                    🧹

                </div>

                <strong>

                    Limpar cocô

                </strong>

                <span>

                    O Petton fez cocô.

                </span>

            </button>

        `;

    }

    /* CÁRIE */

    let acaoCarie = "";

    if(

        carie &&

        !doente &&

        !hospitalEmAndamento

    ){

        acaoCarie = `

            <button

                class="acao"

                onclick="escovarDentes()">

                <div class="emoji">

                    🪥

                </div>

                <strong>

                    Escovar dentes

                </strong>

                <span>

                    O Petton está com cárie.

                </span>

            </button>

        `;

    }

    /* HOSPITAL */

    let acaoHospital = "";

    if(doente){

        acaoHospital = `

            <button

                class="acao"

                onclick="hospital()"

                ${hospitalEmAndamento ? "disabled" : ""}>

                <div class="emoji">

                    🏥

                </div>

                <strong>

                    ${

                        hospitalEmAndamento

                        ? "Em tratamento"

                        : "Ir ao hospital"

                    }

                </strong>

                <span>

                    ${

                        hospitalEmAndamento

                        ? "O veterinário está cuidando dele."

                        : "Leve o Petton para se recuperar."

                    }

                </span>

            </button>

        `;

    }

    /* PASSEIO */

    if(passeandoAgora){

        acaoHospital += `

            <div class="acao">

                <div class="emoji">

                    🚶

                </div>

                <strong>

                    Passeando...

                </strong>

                <span>

                    O Petton está dando uma voltinha.

                </span>

            </div>

        `;

    }

    /* NECESSIDADES */

    let textoCoco =

        "Nenhum cocô para limpar.";

    let pontoCoco =

        "";

    if(coco){

        textoCoco =

            "Há cocô para limpar.";

        pontoCoco =

            "amarelo";

    }

    let textoCarie =

        "Dentes saudáveis.";

    let pontoCarie =

        "";

    if(carie){

        textoCarie =

            "Precisa escovar os dentes.";

        pontoCarie =

            "amarelo";

    }

    area.innerHTML = `

        <div class="card pet">

            ${

                imagem

                ?

                `

                <img

                    class="pet-imagem"

                    src="${imagem}"

                    alt="Petton">

                `

                :

                `

                <div class="pet-emoji">

                    ${especieEmoji()}

                </div>

                `

            }

            <div class="nome">

                ${dados.nome || "Meu Petton"}

            </div>

            <div class="idade">

                ${

                    idade === 0

                    ?

                    "Recém-nascido"

                    :

                    idade +

                    (

                        idade === 1

                        ? " dia"

                        : " dias"

                    ) +

                    " de vida"

                }

            </div>

            <div class="estado ${estado.classe}">

                ${estado.texto}

            </div>

        </div>

        <div class="card">

            <h2 style="margin-top:0;">

                ❤️ Estado do Petton

            </h2>

            ${barraHTML(

                "❤️ Saúde",

                saude

            )}

            ${barraHTML(

                "🛁 Higiene",

                higiene

            )}

            ${barraHTML(

                "⚡ Energia",

                energia

            )}

            ${barraHTML(

                "😊 Felicidade",

                felicidade

            )}

        </div>

        ${

            doente

            ?

            `

            <div class="card">

                <div class="aviso aviso-doente">

                    🤒 <strong>Petton está doente.</strong>

                    <br><br>

                    Os cuidados normais estão

                    bloqueados enquanto ele estiver

                    doente.

                    <br><br>

                    🏥 Leve-o ao hospital para

                    iniciar o tratamento.

                </div>

            </div>

            `

            :

            ""

        }

        <div class="card">

            <h2 style="margin-top:0;">

                🐾 Cuide dele

            </h2>

            <div class="acoes">

                ${acaoHospital}

                ${acaoCoco}

                ${acaoCarie}

                ${acoesNormais}

            </div>

            <div

                id="mensagem"

                class="mensagem">

            </div>

        </div>

        <div class="card">

            <h2 style="margin-top:0;">

                🐾 Necessidades

            </h2>

            <div class="lista">

                <div class="item">

                    <div class="item-emoji">

                        💩

                    </div>

                    <div class="item-texto">

                        <strong>

                            Cocô

                        </strong>

                        <span>

                            ${textoCoco}

                        </span>

                    </div>

                    <div

                        class="ponto ${pontoCoco}">

                    </div>

                </div>

                <div class="item">

                    <div class="item-emoji">

                        🦷

                    </div>

                    <div class="item-texto">

                        <strong>

                            Dentes

                        </strong>

                        <span>

                            ${textoCarie}

                        </span>

                    </div>

                    <div

                        class="ponto ${pontoCarie}">

                    </div>

                </div>

                <div class="item">

                    <div class="item-emoji">

                        🧼

                    </div>

                    <div class="item-texto">

                        <strong>

                            Higiene

                        </strong>

                        <span>

                            ${

                                higiene >= 70

                                ? "Muito boa"

                                : higiene >= 40

                                ? "Precisa de atenção"

                                : "Precisa de cuidados"

                            }

                        </span>

                    </div>

                    <div

                        class="ponto ${

                            higiene < 40

                            ? "vermelho"

                            : higiene < 70

                            ? "amarelo"

                            : ""

                        }">

                    </div>

                </div>

            </div>

        </div>

        <div class="card">

            <div class="aviso">

                💡 <strong>Cuide do seu Petton:</strong>

                <br><br>

                Mantenha a higiene, cuide dos

                dentes, limpe o cocô e leve-o

                para passear quando estiver saudável.

                <br><br>

                Se ele ficar doente, os outros

                cuidados ficam bloqueados até

                o tratamento no hospital. ❤️

            </div>

        </div>

        <div class="rodape">

            Cuidar todos os dias faz seu Petton

            confiar ainda mais em você. 🐾

        </div>

    `;

}

/* =====================================================

   ASSINATURA DO ESTADO VISUAL

   ===================================================== */

let assinaturaAnterior = "";

function assinaturaTela(){

    if(

        typeof Petton === "undefined" ||

        typeof Petton.carregar !== "function"

    ){

        return "";

    }

    const d =

        Petton.carregar();

    if(!d){

        return "";

    }

    let restanteOvo = "";

    if(

        !d.dateNascimento &&

        typeof Petton.incubacaoRestante === "function"

    ){

        try{

            restanteOvo =

                Math.floor(

                    Number(

                        Petton.incubacaoRestante()

                    ) / 1000

                );

        }catch(e){

            restanteOvo = "";

        }

    }

    let idade = 0;

    if(d.dateNascimento){

        try{

            if(

                typeof Petton.idadeDias === "function"

            ){

                idade =

                    Petton.idadeDias();

            }

        }catch(e){

            idade = 0;

        }

    }

    return JSON.stringify({

        especie:d.especie,

        nome:d.nome,

        fase:d.fase,

        nascimento:d.dateNascimento,

        idade:idade,

        saude:d.saude,

        higiene:d.higiene,

        energia:d.energia,

        felicidade:d.felicidade,

        humor:d.humor,

        doente:d.doente,

        cocoAtivo:d.cocoAtivo,

        cocoDesde:d.cocoDesde,

        carieAtiva:d.carieAtiva,

        carieDesde:d.carieDesde,

        hospitalAte:d.hospitalAte,

        passeandoAte:d.passeandoAte,

        escovandoAte:d.escovandoAte,

        restanteOvo:restanteOvo

    });

}

/* =====================================================

   RENDERIZAÇÃO CONTROLADA

   ===================================================== */

function renderizarAgora(){

    renderizar();

    try{

        assinaturaAnterior =

            assinaturaTela();

    }catch(e){

        assinaturaAnterior = "";

    }

}

/* =====================================================

   ATUALIZAÇÃO DO CONTADOR DO OVO

   SEM RECONSTRUIR A PÁGINA

   ===================================================== */

function atualizarContadorOvo(){

    const contador =

        document.getElementById(

            "contadorOvo"

        );

    if(!contador){

        return;

    }

    try{

        if(

            typeof Petton !== "undefined" &&

            typeof Petton.incubacaoRestante === "function"

        ){

            const restante =

                Petton.incubacaoRestante();

            contador.textContent =

                formatarTempo(restante);

        }

    }catch(e){}

}

/* =====================================================

   INÍCIO

   ===================================================== */

renderizarAgora();

/* =====================================================

   VERIFICA ESTADO A CADA 1 SEGUNDO

   MAS SÓ RECONSTRÓI SE MUDOU

   ===================================================== */

setInterval(function(){

    try{

        atualizarContadorOvo();

        const atual =

            assinaturaTela();

        if(atual !== assinaturaAnterior){

            renderizarAgora();

        }

    }catch(e){

        console.log(

            "Atualização do Petton:",

            e

        );

    }

},1000);

</script>

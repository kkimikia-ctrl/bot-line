<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petton - Gatinho Kawaii</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.96);
            padding: 22px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            box-sizing: border-box;
            position: relative;
        }
        h2 {
            margin-top: 0;
            color: #ff5295;
            font-size: 20px;
        }
        .scenery {
            width: 100%;
            height: 160px;
            border-radius: 20px;
            background: #fff0f5;
            border: 2px dashed #ffb6c1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 12px 0;
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
        }
        .scenery.outdoor {
            background: linear-gradient(180deg, #bbf2f6 0%, #d4edbc 100%);
            border: 2px solid #82e0aa;
        }
        
        /* GATO DESENHADO EM CSS (KAWAII) */
        .cat-container {
            position: relative;
            width: 110px;
            height: 100px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        .cat-head {
            position: absolute;
            bottom: 5px;
            left: 10px;
            width: 90px;
            height: 75px;
            background-color: #ffb347;
            border-radius: 45px 45px 38px 38px;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.08);
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03) translateY(-2px); }
        }
        /* Orelhas */
        .cat-ear {
            position: absolute;
            top: -14px;
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 30px solid #ffb347;
        }
        .cat-ear.left { left: 4px; transform: rotate(-15deg); }
        .cat-ear.right { right: 4px; transform: rotate(15deg); }
        
        .cat-ear::after {
            content: '';
            position: absolute;
            top: 8px;
            left: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #ffcccc;
        }
        /* Olhos */
        .cat-eye {
            position: absolute;
            top: 28px;
            width: 10px;
            height: 12px;
            background-color: #333;
            border-radius: 50%;
            animation: blink 4s infinite;
        }
        .cat-eye.left { left: 24px; }
        .cat-eye.right { right: 24px; }
        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        /* Focinho e Boca */
        .cat-nose {
            position: absolute;
            top: 42px;
            left: 41px;
            width: 8px;
            height: 6px;
            background-color: #ff69b4;
            border-radius: 50%;
        }
        .cat-mouth {
            position: absolute;
            top: 47px;
            left: 37px;
            width: 16px;
            height: 8px;
            border-bottom: 2px solid #333;
            border-radius: 0 0 10px 10px;
        }
        /* Bochechas fofas */
        .cat-blush {
            position: absolute;
            top: 40px;
            width: 14px;
            height: 8px;
            background-color: rgba(255, 105, 180, 0.4);
            border-radius: 50%;
        }
        .cat-blush.left { left: 12px; }
        .cat-blush.right { right: 12px; }

        /* Estados do Gato (Dormindo, Adulto, etc) */
        .cat-container.sleeping .cat-eye {
            height: 2px;
            background: none;
            border-top: 2px solid #333;
            top: 32px;
        }
        .cat-container.adult .cat-head {
            background-color: #e08250; /* Tom mais alaranjado adulto */
        }
        .cat-container.adult .cat-ear {
            border-bottom-color: #e08250;
        }

        /* Animações de Ação */
        .floating { animation: float 2.5s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .walking { animation: walk 0.6s infinite alternate ease-in-out; }
        @keyframes walk {
            0% { transform: translateX(-10px) rotate(-3deg); }
            100% { transform: translateX(10px) rotate(3deg); }
        }

        .status-box {
            text-align: left;
            margin: 8px 0;
            background: #fff5f8;
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid #ffe0ec;
        }
        .status-label {
            font-size: 12px;
            font-weight: bold;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        .bar-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 7px;
            width: 100%;
            overflow: hidden;
            margin-top: 3px;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff758c, #ff7eb3);
            transition: width 0.4s ease;
            border-radius: 10px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        button {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.3);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-passeio {
            grid-column: span 2;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 4px 10px rgba(67, 233, 123, 0.3);
            color: #2c3e50;
        }
        .btn-voltar-menu {
            display: block;
            width: 100%;
            margin-top: 8px;
            background: #6b7280;
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-reset {
            background: #e57373;
            font-size: 10px;
            padding: 5px;
            margin-top: 6px;
            width: 100%;
            border-radius: 8px;
            box-shadow: none;
        }
        #user-greeting { font-size: 10px; color: #888; margin-bottom: 3px; }
        #texto-status { font-size: 11px; color: #555; margin: 6px 0; min-height: 24px; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div id="user-greeting">Cantinho do Pet 🐾</div>
        <h2 id="pet-name">Ovo Misterioso 🥚</h2>
        
        <div class="scenery" id="cenario-fundo">
            <!-- Gatinho renderizado graficamente em CSS -->
            <div class="cat-container floating" id="cat-box" onclick="tocarPet()">
                <div class="cat-head" id="cat-head-bg">
                    <div class="cat-ear left"></div>
                    <div class="cat-ear right"></div>
                    <div class="cat-eye left"></div>
                    <div class="cat-eye right"></div>
                    <div class="cat-blush left"></div>
                    <div class="cat-blush right"></div>
                    <div class="cat-nose"></div>
                    <div class="cat-mouth"></div>
                </div>
            </div>
        </div>

        <div id="texto-status">Um ovo misterioso quentinho. Clique nele 12 vezes para chocar!</div>
        
        <div id="painel-status" class="oculto">
            <div class="status-box">
                <div class="status-label"><span>🍗 Fome</span> <span id="txt-fome">80%</span></div>
                <div class="bar-container"><div id="bar-fome" class="bar-fill" style="width: 80%;"></div></div>
            </div>
            <div class="status-box">
                <div class="status-label"><span>💖 Felicidade</span> <span id="txt-felicidade">90%</span></div>
                <div class="bar-container"><div id="bar-felicidade" class="bar-fill" style="width: 90%;"></div></div>
            </div>
            <div class="status-box">
                <div class="status-label"><span>⚡ Energia</span> <span id="txt-energia">100%</span></div>
                <div class="bar-container"><div id="bar-energia" class="bar-fill" style="width: 100%;"></div></div>
            </div>
        </div>

        <div id="painel-botoes" class="btn-grid oculto">
            <button onclick="alimentar()">🍽️ Alimentar</button>
            <button onclick="brincar()">🎮 Brincar</button>
            <button onclick="dormir()">💤 Dormir</button>
            <button onclick="darBanho()">🛁 Banho</button>
            <button class="btn-passeio" id="btn-acao-passeio" onclick="alternarPasseio()">🌳 Ir Passear</button>
        </div>

        <button class="btn-reset" onclick="reiniciarJogo()">🔄 Reiniciar Jogo</button>
        <a href="forca.html" class="btn-voltar-menu">⬅️ Voltar para a Central</a>
    </div>

    <script>
        let pet = {
            fase: "ovo",
            cliquesOvo: 0,
            pontosCrescimento: 0,
            nome: "Mimi",
            fome: 80,
            felicidade: 90,
            energia: 100,
            emPasseio: false,
            dormindo: false
        };

        function carregarJogo() {
            const salvo = localStorage.getItem('petton_css_v1');
            if (salvo) {
                pet = JSON.parse(salvo);
                aplicarEstadoAtual();
            }
        }

        function salvarJogo() {
            localStorage.setItem('petton_css_v1', JSON.stringify(pet));
        }

        function reiniciarJogo() {
            if (confirm("Deseja reiniciar o jogo e voltar a ser um ovo?")) {
                localStorage.removeItem('petton_css_v1');
                pet = { fase: "ovo", cliquesOvo: 0, pontosCrescimento: 0, nome: "Mimi", fome: 80, felicidade: 90, energia: 100, emPasseio: false, dormindo: false };
                aplicarEstadoAtual();
                document.getElementById('texto-status').innerText = "Um ovo misterioso quentinho. Clique nele 12 vezes para chocar!";
            }
        }

        function aplicarEstadoAtual() {
            const catBox = document.getElementById('cat-box');
            if (pet.fase === "ovo") {
                document.getElementById('pet-name').innerText = "Ovo Misterioso 🥚";
                catBox.innerHTML = '<div style="font-size:75px; line-height:160px;" class="floating">🥚</div>';
                document.getElementById('painel-status').classList.add('oculto');
                document.getElementById('painel-botoes').classList.add('oculto');
            } else {
                restaurarTemplateGato();
                document.getElementById('pet-name').innerText = pet.nome + (pet.fase === "filhote" ? " 🐱 (Filhote)" : " 🐈 (Adulto)");
                document.getElementById('painel-status').classList.remove('oculto');
                document.getElementById('painel-botoes').classList.remove('oculto');
                configurarVisualFase();
            }
            atualizarTela();
        }

        function restaurarTemplateGato() {
            document.getElementById('cat-box').innerHTML = `
                <div class="cat-head" id="cat-head-bg">
                    <div class="cat-ear left"></div>
                    <div class="cat-ear right"></div>
                    <div class="cat-eye left"></div>
                    <div class="cat-eye right"></div>
                    <div class="cat-blush left"></div>
                    <div class="cat-blush right"></div>
                    <div class="cat-nose"></div>
                    <div class="cat-mouth"></div>
                </div>`;
        }

        function configurarVisualFase() {
            const catBox = document.getElementById('cat-box');
            catBox.className = "cat-container";
            
            if (pet.fase === "adulto") {
                catBox.classList.add('adult');
            }

            if (pet.dormindo) {
                catBox.classList.add('sleeping', 'floating');
                document.getElementById('cenario-fundo').classList.remove('outdoor');
                return;
            }

            if (pet.emPasseio) {
                document.getElementById('cenario-fundo').classList.add('outdoor');
                catBox.classList.add('walking');
                document.getElementById('btn-acao-passeio').innerText = "🏠 Voltar para Casa";
            } else {
                document.getElementById('cenario-fundo').classList.remove('outdoor');
                catBox.classList.add('floating');
                document.getElementById('btn-acao-passeio').innerText = "🌳 Ir Passear";
            }
        }

        function atualizarTela() {
            if (pet.fase !== "ovo") {
                document.getElementById('bar-fome').style.width = pet.fome + '%';
                document.getElementById('txt-fome').innerText = pet.fome + '%';
                document.getElementById('bar-felicidade').style.width = pet.felicidade + '%';
                document.getElementById('txt-felicidade').innerText = pet.felicidade + '%';
                document.getElementById('bar-energia').style.width = pet.energia + '%';
                document.getElementById('txt-energia').innerText = pet.energia + '%';
            }
            salvarJogo();
        }

        function tocarPet() {
            if (pet.fase === "ovo") {
                pet.cliquesOvo++;
                let restam = 12 - pet.cliquesOvo;
                if (restam > 0) {
                    document.getElementById('texto-status').innerText = `O ovo balançou! Faltam ${restam} cliques para nascer! 🥚✨`;
                } else {
                    pet.fase = "filhote";
                    document.getElementById('texto-status').innerText = `Uhuuul! Nasceu o filhote ${pet.nome}! 🎉🍼`;
                    aplicarEstadoAtual();
                }
            } else {
                if (pet.dormindo) return;
                document.getElementById('texto-status').innerText = `${pet.nome} ronronou feliz com seu carinho! 💖🐾`;
                animarEfeito();
            }
            salvarJogo();
        }

        function verificarEvolucao() {
            pet.pontosCrescimento++;
            if (pet.fase === "filhote" && pet.pontosCrescimento >= 12) {
                pet.fase = "adulto";
                document.getElementById('texto-status').innerText = `Incrível! ${pet.nome} cresceu e virou um belo gato adulto! 🌟🐈`;
                aplicarEstadoAtual();
            }
        }

        function alimentar() {
            if (pet.fase === "ovo" || pet.emPasseio || pet.dormindo) return;
            pet.fome = Math.min(100, pet.fome + 25);
            document.getElementById('texto-status').innerText = `${pet.nome} comeu a ração com muita vontade! 🐟😋`;
            animarEfeito();
            verificarEvolucao();
            atualizarTela();
        }

        function brincar() {
            if (pet.fase === "ovo" || pet.emPasseio || pet.dormindo) return;
            if (pet.energia < 15) {
                alert("Seu gatinho está cansado e precisa dormir um pouco 💤");
                return;
            }
            pet.felicidade = Math.min(100, pet.felicidade + 15);
            pet.energia = Math.max(0, pet.energia - 15);
            pet.fome = Math.max(0, pet.fome - 5);
            document.getElementById('texto-status').innerText = `Você brincou de caçar o laser com ${pet.nome}! 🧶✨`;
            animarEfeito();
            verificarEvolucao();
            atualizarTela();
        }

        function dormir() {
            if (pet.fase === "ovo" || pet.emPasseio) return;
            pet.dormindo = true;
            pet.energia = 100;
            document.getElementById('texto-status').innerText = `${pet.nome} fechou os olhinhos e pegou no sono... zZz 💤`;
            configurarVisualFase();

            setTimeout(() => {
                pet.dormindo = false;
                document.getElementById('texto-status').innerText = `${pet.nome} acordou revigorado e cheio de energia! ☀️`;
                configurarVisualFase();
                atualizarTela();
            }, 3500);
            atualizarTela();
        }

        function darBanho() {
            if (pet.fase === "ovo" || pet.emPasseio || pet.dormindo) return;
            pet.felicidade = Math.min(100, pet.felicidade + 10);
            document.getElementById('texto-status').innerText = `${pet.nome} tomou banho de gato e está limpinho! 🛁✨`;
            animarEfeito();
            verificarEvolucao();
            atualizarTela();
        }

        function alternarPasseio() {
            if (pet.fase === "ovo" || pet.dormindo) return;
            const btnPasseio = document.getElementById('btn-acao-passeio');

            if (!pet.emPasseio) {
                if (pet.energia < 20) {
                    alert("Pet sem energia para passear. Coloque-o para dormir 💤");
                    return;
                }
                pet.emPasseio = true;
                btnPasseio.innerText = "🏠 Voltar para Casa";
                document.getElementById('texto-status').innerText = `${pet.nome} está caçando borboletas no parque! 🌳🦋`;
                pet.energia = Math.max(0, pet.energia - 20);
                pet.felicidade = Math.min(100, pet.felicidade + 20);
            } else {
                pet.emPasseio = false;
                btnPasseio.innerText = "🌳 Ir Passear";
                document.getElementById('texto-status').innerText = `${pet.nome} voltou seguro para casa. 🏡`;
            }
            configurarVisualFase();
            atualizarTela();
        }

        function animarEfeito() {
            const el = document.getElementById('cat-box');
            el.style.transform = "scale(1.15) rotate(5deg)";
            setTimeout(() => { el.style.transform = "scale(1) rotate(0deg)"; }, 300);
        }

        carregarJogo();
    </script>
</body>
</html>

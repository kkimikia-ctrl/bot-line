<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Petton - Banho 🛁</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="petton.js"></script>

<style>

/* =========================================================

   CONFIGURAÇÃO GERAL

========================================================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    overflow-x: hidden;

}

body {

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:

        linear-gradient(

            180deg,

            #dff5ff 0%,

            #eefaff 45%,

            #d7f1fb 100%

        );

    color: #39434a;

}

/* =========================================================

   APP

========================================================= */

.app {

    width: 100%;

    max-width: 520px;

    min-height: 100vh;

    margin: 0 auto;

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(

            180deg,

            #def5ff 0%,

            #f5fcff 60%,

            #e3f5fb 100%

        );

}

/* =========================================================

   TOPO

========================================================= */

.topo {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    padding: 0 15px;

    background: rgba(255,255,255,0.92);

    border-bottom: 1px solid rgba(90,150,180,0.18);

    z-index: 50;

}

.topo h1 {

    margin: 0;

    font-size: 21px;

    font-weight: 800;

    color: #3f6f86;

}

.btn-voltar {

    position: absolute;

    left: 13px;

    top: 50%;

    transform: translateY(-50%);

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #ffffff;

    box-shadow:

        0 3px 10px rgba(0,0,0,0.12);

    font-size: 23px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

}

/* =========================================================

   TEXTO

========================================================= */

.area-titulo {

    text-align: center;

    padding:

        18px

        16px

        8px;

}

.area-titulo h2 {

    margin:

        0

        0

        6px;

    color: #437a93;

    font-size: 22px;

}

.area-titulo p {

    margin: 0;

    color: #71858e;

    font-size: 14px;

}

/* =========================================================

   BANHEIRO

========================================================= */

.banheiro {

    width: calc(100% - 24px);

    height: 440px;

    margin:

        10px

        auto

        18px;

    position: relative;

    overflow: hidden;

    border-radius: 28px;

    background:

        linear-gradient(

            90deg,

            rgba(255,255,255,0.30) 1px,

            transparent 1px

        ),

        linear-gradient(

            rgba(255,255,255,0.30) 1px,

            transparent 1px

        ),

        linear-gradient(

            180deg,

            #bcecff 0%,

            #dff7ff 67%,

            #c0e8f5 67%,

            #aadcea 100%

        );

    background-size:

        52px 52px,

        52px 52px,

        100% 100%;

    box-shadow:

        0 8px 25px rgba(51,125,156,0.18);

}

/* =========================================================

   JANELA

========================================================= */

.janela {

    position: absolute;

    width: 78px;

    height: 110px;

    top: 42px;

    right: 24px;

    overflow: hidden;

    border-radius:

        35px

        35px

        10px

        10px;

    border: 6px solid white;

    background:

        linear-gradient(

            180deg,

            #8ddfff 0%,

            #c7f1ff 53%,

            #a6e28d 54%,

            #71c66f 100%

        );

    box-shadow:

        0 5px 14px rgba(0,0,0,0.10);

}

.janela::before {

    content: "";

    position: absolute;

    width: 5px;

    height: 100%;

    background: white;

    left: 50%;

    transform: translateX(-50%);

}

.janela::after {

    content: "";

    position: absolute;

    width: 100%;

    height: 5px;

    background: white;

    top: 50%;

}

/* =========================================================

   CHUVEIRO

========================================================= */

.chuveiro-cano {

    position: absolute;

    width: 8px;

    height: 78px;

    top: 18px;

    left: 50%;

    transform: translateX(-50%);

    background:

        linear-gradient(

            90deg,

            #aab9c0,

            #f7ffff,

            #8ca2ab

        );

    border-radius: 8px;

}

.chuveiro {

    position: absolute;

    width: 68px;

    height: 28px;

    top: 83px;

    left: 50%;

    transform: translateX(-50%);

    border-radius:

        50%

        50%

        35%

        35%;

    background:

        linear-gradient(

            180deg,

            #eefaff,

            #8daab8

        );

    box-shadow:

        0 3px 8px rgba(0,0,0,0.15);

    z-index: 10;

}

/* =========================================================

   ÁGUA CAINDO

========================================================= */

.agua-chuveiro {

    position: absolute;

    width: 100px;

    height: 128px;

    top: 106px;

    left: 50%;

    transform: translateX(-50%);

    opacity: 0;

    transition: opacity 0.3s;

    z-index: 5;

    pointer-events: none;

}

.banho-ativo .agua-chuveiro {

    opacity: 1;

}

.filete {

    position: absolute;

    width: 2px;

    height: 90px;

    top: 0;

    background:

        linear-gradient(

            180deg,

            rgba(255,255,255,0.9),

            rgba(74,195,244,0.18)

        );

    border-radius: 4px;

    animation:

        aguaCaindo

        0.7s

        linear

        infinite;

}

.filete:nth-child(1) {

    left: 22px;

}

.filete:nth-child(2) {

    left: 38px;

    animation-delay: 0.2s;

}

.filete:nth-child(3) {

    left: 52px;

    animation-delay: 0.1s;

}

.filete:nth-child(4) {

    left: 67px;

    animation-delay: 0.35s;

}

.filete:nth-child(5) {

    left: 79px;

    animation-delay: 0.15s;

}

@keyframes aguaCaindo {

    0% {

        transform:

            translateY(-5px)

            scaleY(0.8);

        opacity: 0.4;

    }

    50% {

        opacity: 0.9;

    }

    100% {

        transform:

            translateY(30px)

            scaleY(1.1);

        opacity: 0;

    }

}

/* =========================================================

   ÁREA COMPLETA DA BANHEIRA

========================================================= */

.area-banheira {

    position: absolute;

    width: 94%;

    height: 255px;

    left: 3%;

    bottom: 20px;

    overflow: visible;

}

/* =========================================================

   PARTE INTERNA

   ESSA PARTE SEGURA A ÁGUA E ESPUMA

   PARA NÃO VAZAR PARA FORA

========================================================= */

.interior-banheira {

    position: absolute;

    width: 82%;

    height: 114px;

    left: 9%;

    top: 55px;

    overflow: hidden;

    border-radius:

        46%

        46%

        35%

        35%;

    z-index: 10;

}

/* =========================================================

   ÁGUA DENTRO DA BANHEIRA

========================================================= */

.agua-banheira {

    position: absolute;

    width: 100%;

    height: 82px;

    left: 0;

    bottom: 0;

    background:

        linear-gradient(

            180deg,

            rgba(112,218,255,0.68) 0%,

            rgba(66,190,240,0.72) 45%,

            rgba(32,160,221,0.75) 100%

        );

    border-radius:

        50%

        50%

        25%

        25%;

    box-shadow:

        inset 0 5px 12px rgba(255,255,255,0.45),

        inset 0 -12px 20px rgba(19,115,176,0.20);

    overflow: hidden;

}

/* BRILHO DA SUPERFÍCIE DA ÁGUA */

.agua-banheira::before {

    content: "";

    position: absolute;

    width: 130%;

    height: 18px;

    left: -15%;

    top: -3px;

    border-radius: 50%;

    background:

        rgba(199,245,255,0.78);

    box-shadow:

        0 3px 10px rgba(255,255,255,0.6);

    animation:

        movimentoAgua

        2.4s

        ease-in-out

        infinite;

}

/* REFLEXO NA ÁGUA */

.agua-banheira::after {

    content: "";

    position: absolute;

    width: 110px;

    height: 16px;

    top: 30px;

    left: 22px;

    border-radius: 50%;

    background:

        rgba(255,255,255,0.24);

    transform: rotate(-5deg);

    filter: blur(3px);

}

@keyframes movimentoAgua {

    0%,

    100% {

        transform:

            translateX(-4px)

            scaleX(1);

    }

    50% {

        transform:

            translateX(5px)

            scaleX(1.03);

    }

}

/* =========================================================

   PETTON

========================================================= */

.petton-banheira {

    position: absolute;

    width: 155px;

    max-height: 190px;

    object-fit: contain;

    left: 50%;

    bottom: 51px;

    transform:

        translateX(-50%);

    z-index: 20;

    filter:

        drop-shadow(

            0 5px 4px

            rgba(0,0,0,0.12)

        );

    transition:

        transform

        0.3s;

}

.banho-ativo .petton-banheira {

    animation:

        petBanho

        1.2s

        ease-in-out

        infinite;

}

@keyframes petBanho {

    0%,

    100% {

        transform:

            translateX(-50%)

            translateY(0)

            rotate(-1deg);

    }

    50% {

        transform:

            translateX(-50%)

            translateY(-4px)

            rotate(1deg);

    }

}

/* =========================================================

   ESPUMA

   FICA POR CIMA DA ÁGUA E DO CORPO DO PETTON

========================================================= */

.espuma {

    position: absolute;

    width: 100%;

    height: 72px;

    left: 0;

    bottom: -2px;

    z-index: 30;

    pointer-events: none;

}

/* =========================================================

   BOLHAS DE ESPUMA

========================================================= */

.bolha-espuma {

    position: absolute;

    border-radius: 50%;

    background:

        radial-gradient(

            circle at 35% 30%,

            #ffffff 0%,

            #ffffff 40%,

            #e8f8ff 70%,

            #d1eef9 100%

        );

    box-shadow:

        inset 2px 2px 4px rgba(255,255,255,0.9),

        0 2px 5px rgba(55,142,180,0.10);

}

.bolha-espuma:nth-child(1) {

    width: 55px;

    height: 55px;

    left: 0%;

    bottom: 1px;

}

.bolha-espuma:nth-child(2) {

    width: 67px;

    height: 67px;

    left: 9%;

    bottom: -9px;

}

.bolha-espuma:nth-child(3) {

    width: 50px;

    height: 50px;

    left: 23%;

    bottom: 13px;

}

.bolha-espuma:nth-child(4) {

    width: 72px;

    height: 72px;

    left: 33%;

    bottom: -12px;

}

.bolha-espuma:nth-child(5) {

    width: 54px;

    height: 54px;

    left: 49%;

    bottom: 15px;

}

.bolha-espuma:nth-child(6) {

    width: 72px;

    height: 72px;

    left: 58%;

    bottom: -12px;

}

.bolha-espuma:nth-child(7) {

    width: 52px;

    height: 52px;

    left: 74%;

    bottom: 11px;

}

.bolha-espuma:nth-child(8) {

    width: 68px;

    height: 68px;

    right: 0%;

    bottom: -8px;

}

.bolha-espuma:nth-child(9) {

    width: 35px;

    height: 35px;

    left: 18%;

    bottom: 35px;

}

.bolha-espuma:nth-child(10) {

    width: 38px;

    height: 38px;

    left: 66%;

    bottom: 35px;

}

/* =========================================================

   FRENTE DA BANHEIRA

   FICA NA FRENTE DA ÁGUA, ESPUMA E PETTON

========================================================= */

.frente-banheira {

    position: absolute;

    width: 94%;

    height: 125px;

    left: 3%;

    bottom: 5px;

    z-index: 40;

    border-radius:

        18% 18%

        34% 34%

        /

        28% 28%

        25% 25%;

    background:

        linear-gradient(

            180deg,

            #76d5f4 0%,

            #4dbce9 24%,

            #37a6dd 62%,

            #228bc9 100%

        );

    border:

        5px

        solid

        #e7faff;

    box-shadow:

        inset 0 8px 12px rgba(255,255,255,0.30),

        inset 0 -8px 14px rgba(15,101,165,0.20),

        0 9px 16px rgba(0,77,126,0.20);

}

/* BRILHO FRONTAL DA BANHEIRA */

.frente-banheira::after {

    content: "";

    position: absolute;

    width: 68%;

    height: 18px;

    top: 23px;

    left: 16%;

    border-radius: 50%;

    background:

        rgba(255,255,255,0.17);

    filter:

        blur(3px);

}

/* =========================================================

   BORDA SUPERIOR DA BANHEIRA

========================================================= */

.borda-banheira {

    position: absolute;

    width: 98%;

    height: 40px;

    left: 1%;

    top: 118px;

    z-index: 45;

    pointer-events: none;

    border-radius: 50%;

    border:

        7px

        solid

        #eafaff;

    border-bottom-color:

        rgba(224,248,255,0.65);

    box-shadow:

        inset 0 2px 4px rgba(0,100,150,0.16);

}

/* =========================================================

   PÉS

========================================================= */

.pe {

    position: absolute;

    width: 42px;

    height: 30px;

    bottom: 0;

    z-index: 5;

    border-radius:

        10px

        10px

        20px

        20px;

    background:

        linear-gradient(

            180deg,

            #ffdc73,

            #eaa72f

        );

    box-shadow:

        0 4px 5px rgba(0,0,0,0.15);

}

.pe-esquerdo {

    left: 64px;

}

.pe-direito {

    right: 64px;

}

/* =========================================================

   BOLHAS FLUTUANTES

========================================================= */

.bolhas-flutuantes {

    position: absolute;

    inset: 0;

    z-index: 60;

    pointer-events: none;

    overflow: hidden;

}

.bolha {

    position: absolute;

    bottom: 95px;

    border-radius: 50%;

    opacity: 0;

    background:

        radial-gradient(

            circle at 30% 28%,

            rgba(255,255,255,0.9) 0%,

            rgba(255,255,255,0.35) 15%,

            rgba(177,230,255,0.18) 60%,

            rgba(93,185,235,0.12) 100%

        );

    border:

        1px

        solid

        rgba(255,255,255,0.75);

    box-shadow:

        inset 2px 2px 4px rgba(255,255,255,0.65);

    animation:

        subirBolha

        3.8s

        linear

        infinite;

}

/* APARECEM MAIS QUANDO BANHO ESTÁ ATIVO */

.banho-ativo .bolha {

    opacity: 1;

}

.bolha:nth-child(1) {

    width: 24px;

    height: 24px;

    left: 18%;

    animation-delay: 0s;

}

.bolha:nth-child(2) {

    width: 34px;

    height: 34px;

    left: 29%;

    animation-delay: 0.6s;

}

.bolha:nth-child(3) {

    width: 20px;

    height: 20px;

    left: 45%;

    animation-delay: 1.3s;

}

.bolha:nth-child(4) {

    width: 40px;

    height: 40px;

    left: 58%;

    animation-delay: 0.3s;

}

.bolha:nth-child(5) {

    width: 25px;

    height: 25px;

    left: 72%;

    animation-delay: 1.8s;

}

.bolha:nth-child(6) {

    width: 31px;

    height: 31px;

    left: 82%;

    animation-delay: 2.3s;

}

.bolha:nth-child(7) {

    width: 17px;

    height: 17px;

    left: 36%;

    animation-delay: 2.8s;

}

.bolha:nth-child(8) {

    width: 26px;

    height: 26px;

    left: 66%;

    animation-delay: 3.1s;

}

@keyframes subirBolha {

    0% {

        transform:

            translateY(0)

            translateX(0)

            scale(0.7);

        opacity: 0;

    }

    15% {

        opacity: 0.85;

    }

    50% {

        transform:

            translateY(-110px)

            translateX(10px)

            scale(1);

    }

    85% {

        opacity: 0.65;

    }

    100% {

        transform:

            translateY(-230px)

            translateX(-8px)

            scale(1.15);

        opacity: 0;

    }

}

/* =========================================================

   PAINEL INFERIOR

========================================================= */

.painel {

    margin:

        0

        12px

        20px;

    padding: 18px;

    border-radius: 22px;

    background:

        rgba(255,255,255,0.96);

    box-shadow:

        0 6px 20px rgba(51,125,156,0.14);

    text-align: center;

}

.higiene-linha {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 15px;

}

.higiene-icone {

    font-size: 24px;

}

.barra {

    flex: 1;

    height: 16px;

    overflow: hidden;

    border-radius: 20px;

    background: #e8eef1;

    box-shadow:

        inset 0 2px 5px rgba(0,0,0,0.08);

}

.barra-preenchimento {

    height: 100%;

    width: 70%;

    border-radius: inherit;

    background:

        linear-gradient(

            90deg,

            #56c8ef,

            #4ae3bd

        );

    transition:

        width

        0.4s

        ease;

}

.valor-higiene {

    min-width: 45px;

    font-size: 14px;

    font-weight: 700;

    color: #4c7182;

}

/* =========================================================

   BOTÃO

========================================================= */

.btn-banho {

    width: 100%;

    min-height: 56px;

    border: none;

    border-radius: 17px;

    background:

        linear-gradient(

            135deg,

            #44bdea,

            #32d5c4

        );

    color: white;

    font-size: 18px;

    font-weight: 800;

    box-shadow:

        0 6px 14px rgba(37,168,199,0.28);

    cursor: pointer;

    transition:

        transform

        0.15s,

        opacity

        0.2s;

}

.btn-banho:active {

    transform: scale(0.97);

}

.btn-banho:disabled {

    opacity: 0.55;

}

/* =========================================================

   MENSAGEM

========================================================= */

.mensagem {

    min-height: 23px;

    margin-top: 12px;

    font-size: 14px;

    font-weight: 600;

    color: #4f7d8e;

}

/* =========================================================

   RESPONSIVO

========================================================= */

@media (max-width: 390px) {

    .banheiro {

        height: 415px;

    }

    .area-banheira {

        height: 240px;

    }

    .petton-banheira {

        width: 145px;

    }

}

/* =========================================================

   TELA MUITO PEQUENA

========================================================= */

@media (max-width: 340px) {

    .banheiro {

        height: 390px;

    }

    .petton-banheira {

        width: 128px;

    }

}

</style>

</head>

<body>

<div

    class="app"

    id="app"

>

    <!-- =====================================================

         TOPO

    ====================================================== -->

    <header class="topo">

        <button

            class="btn-voltar"

            onclick="voltar()"

            type="button"

        >

            ‹

        </button>

        <h1>

            Banho 🛁

        </h1>

    </header>

    <!-- =====================================================

         TÍTULO

    ====================================================== -->

    <section class="area-titulo">

        <h2>

            Hora do banho!

        </h2>

        <p id="subtitulo">

            Deixe seu Petton limpinho 🫧

        </p>

    </section>

    <!-- =====================================================

         CENÁRIO

    ====================================================== -->

    <section

        class="banheiro"

        id="banheiro"

    >

        <!-- JANELA -->

        <div class="janela"></div>

        <!-- CHUVEIRO -->

        <div class="chuveiro-cano"></div>

        <div class="chuveiro"></div>

        <!-- ÁGUA DO CHUVEIRO -->

        <div class="agua-chuveiro">

            <span class="filete"></span>

            <span class="filete"></span>

            <span class="filete"></span>

            <span class="filete"></span>

            <span class="filete"></span>

        </div>

        <!-- =================================================

             BANHEIRA

        ================================================== -->

        <div class="area-banheira">

            <!-- PÉS -->

            <div

                class="pe pe-esquerdo"

            ></div>

            <div

                class="pe pe-direito"

            ></div>

            <!-- INTERIOR DA BANHEIRA -->

            <div class="interior-banheira">

                <!--

                    ÁGUA

                    AGORA A BANHEIRA NÃO PARECE VAZIA

                -->

                <div class="agua-banheira"></div>

                <!--

                    PETTON

                    Se o nome da sua imagem for diferente,

                    altere somente o src abaixo.

                -->

                <img

                    id="pettonImagem"

                    class="petton-banheira"

                    src="petton-original.png"

                    alt="Petton"

                >

                <!-- ESPUMA -->

                <div class="espuma">

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                    <span class="bolha-espuma"></span>

                </div>

            </div>

            <!-- FRENTE DA BANHEIRA -->

            <div class="frente-banheira"></div>

            <!-- BORDA SUPERIOR -->

            <div class="borda-banheira"></div>

            <!-- BOLHAS QUE SOBEM -->

            <div class="bolhas-flutuantes">

                <span class="bolha"></span>

                <span class="bolha"></span>

                <span class="bolha"></span>

                <span class="bolha"></span>

                <span class="bolha"></span>

                <span class="bolha"></span>

                <span class="bolha"></span>

                <span class="bolha"></span>

            </div>

        </div>

    </section>

    <!-- =====================================================

         PAINEL

    ====================================================== -->

    <section class="painel">

        <!-- HIGIENE -->

        <div class="higiene-linha">

            <span class="higiene-icone">

                🧼

            </span>

            <div class="barra">

                <div

                    class="barra-preenchimento"

                    id="barraHigiene"

                ></div>

            </div>

            <span

                class="valor-higiene"

                id="valorHigiene"

            >

                0%

            </span>

        </div>

        <!-- BOTÃO -->

        <button

            class="btn-banho"

            id="btnBanho"

            type="button"

            onclick="darBanho()"

        >

            🫧 Dar banho

        </button>

        <!-- MENSAGEM -->

        <div

            class="mensagem"

            id="mensagem"

        ></div>

    </section>

</div>

<script>

/* =========================================================

   ELEMENTOS

========================================================= */

const banheiro =

    document.getElementById(

        "banheiro"

    );

const btnBanho =

    document.getElementById(

        "btnBanho"

    );

const mensagem =

    document.getElementById(

        "mensagem"

    );

const barraHigiene =

    document.getElementById(

        "barraHigiene"

    );

const valorHigiene =

    document.getElementById(

        "valorHigiene"

    );

const pettonImagem =

    document.getElementById(

        "pettonImagem"

    );

/* =========================================================

   VOLTAR

========================================================= */

function voltar() {

    if (

        window.history.length > 1

    ) {

        window.history.back();

    } else {

        window.location.href =

            "index.html";

    }

}

/* =========================================================

   PEGAR DADOS

========================================================= */

function pegarDadosPetton() {

    try {

        if (

            typeof carregarPetton ===

            "function"

        ) {

            return carregarPetton();

        }

    } catch (erro) {

        console.log(

            "Erro ao carregar Petton:",

            erro

        );

    }

    /* FALLBACK */

    try {

        const salvo =

            localStorage.getItem(

                "petton_dados_v3"

            );

        if (salvo) {

            return JSON.parse(

                salvo

            );

        }

    } catch (erro) {

        console.log(

            erro

        );

    }

    return {

        higiene: 70

    };

}

/* =========================================================

   PROCURAR IMAGEM DO PETTON

========================================================= */

function definirImagemPetton() {

    const dados =

        pegarDadosPetton();

    if (!dados) {

        return;

    }

    let imagem = null;

    /* IDENTIDADE VISUAL */

    if (

        dados.identidadeVisual &&

        dados.identidadeVisual.imagens

    ) {

        const imagens =

            dados.identidadeVisual.imagens;

        const fase =

            dados.fase ||

            "bebe";

        if (

            imagens[fase]

        ) {

            imagem =

                imagens[fase];

        }

    }

    /* OUTROS FORMATOS */

    if (

        !imagem &&

        dados.imagem

    ) {

        imagem =

            dados.imagem;

    }

    if (

        !imagem &&

        dados.imagemAtual

    ) {

        imagem =

            dados.imagemAtual;

    }

    if (imagem) {

        pettonImagem.src =

            imagem;

    }

}

/* =========================================================

   ATUALIZAR HIGIENE

========================================================= */

function atualizarTela() {

    const dados =

        pegarDadosPetton();

    let higiene =

        Number(

            dados &&

            dados.higiene

        );

    if (

        !Number.isFinite(

            higiene

        )

    ) {

        higiene = 70;

    }

    higiene =

        Math.max(

            0,

            Math.min(

                100,

                higiene

            )

        );

    barraHigiene.style.width =

        higiene + "%";

    valorHigiene.textContent =

        Math.round(

            higiene

        ) + "%";

    /*

        NO SISTEMA PETTON ATUAL,

        O BANHO SÓ PRECISA SER FEITO

        QUANDO A HIGIENE BAIXAR.

    */

    if (

        higiene >= 90

    ) {

        mensagem.textContent =

            "Seu Petton já está limpinho ✨";

    } else {

        mensagem.textContent =

            "";

    }

}

/* =========================================================

   DAR BANHO

========================================================= */

let banhoEmAndamento =

    false;

function darBanho() {

    if (

        banhoEmAndamento

    ) {

        return;

    }

    const dadosAntes =

        pegarDadosPetton();

    const higieneAntes =

        Number(

            dadosAntes &&

            dadosAntes.higiene

        ) || 0;

    /*

        NÃO DEIXA TOMAR BANHO

        SE JÁ ESTIVER LIMPO

    */

    if (

        higieneAntes >= 90

    ) {

        mensagem.textContent =

            "Seu Petton não precisa tomar banho agora 🐾";

        return;

    }

    banhoEmAndamento =

        true;

    btnBanho.disabled =

        true;

    btnBanho.textContent =

        "🫧 Tomando banho...";

    mensagem.textContent =

        "Splash! 🫧";

    /* ATIVA CHUVEIRO E BOLHAS */

    banheiro.classList.add(

        "banho-ativo"

    );

    /* =====================================================

       EXECUTA A FUNÇÃO DO PETTON.JS

    ===================================================== */

    let resultado =

        true;

    try {

        if (

            typeof limpar ===

            "function"

        ) {

            resultado =

                limpar();

        }

    } catch (erro) {

        console.log(

            "Erro no banho:",

            erro

        );

    }

    /*

        SE PETTON.JS NEGAR A AÇÃO

    */

    if (

        resultado === false

    ) {

        banheiro.classList.remove(

            "banho-ativo"

        );

        banhoEmAndamento =

            false;

        btnBanho.disabled =

            false;

        btnBanho.textContent =

            "🫧 Dar banho";

        mensagem.textContent =

            "Seu Petton não precisa tomar banho agora.";

        atualizarTela();

        return;

    }

    /* =====================================================

       DURAÇÃO DA ANIMAÇÃO

    ===================================================== */

    setTimeout(

        function () {

            atualizarTela();

        },

        700

    );

    setTimeout(

        function () {

            mensagem.textContent =

                "Pronto! Petton limpinho ✨🫧";

            banheiro.classList.remove(

                "banho-ativo"

            );

            btnBanho.disabled =

                false;

            btnBanho.textContent =

                "🫧 Dar banho";

            banhoEmAndamento =

                false;

            atualizarTela();

        },

        4200

    );

}

/* =========================================================

   INICIALIZAÇÃO

========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function () {

        definirImagemPetton();

        atualizarTela();

    }

);

/* =========================================================

   ATUALIZA A TELA SE OS DADOS MUDAREM

========================================================= */

window.addEventListener(

    "storage",

    function () {

        definirImagemPetton();

        atualizarTela();

    }

);

</script>

</body>

</html>

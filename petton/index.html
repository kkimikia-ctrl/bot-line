<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Petton 🐾</title>

<link rel="stylesheet" href="petton.css">

<style>

* {

    box-sizing: border-box;

}

html,

body {

    margin: 0;

    padding: 0;

    min-height: 100%;

}

body {

    background:

        radial-gradient(circle at top, #fff4d6 0%, #f8dfb0 42%, #e7c58e 100%);

    color: #4b3424;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    -webkit-tap-highlight-color: transparent;

}

button,

a {

    -webkit-tap-highlight-color: transparent;

}

.app {

    width: 100%;

    max-width: 520px;

    min-height: 100vh;

    margin: 0 auto;

    padding-bottom: 30px;

}

/* ==================================================

   TOPO

================================================== */

.topo {

    position: sticky;

    top: 0;

    z-index: 20;

    display: flex;

    align-items: center;

    justify-content: space-between;

    min-height: 62px;

    padding: 9px 12px;

    background: rgba(255, 250, 238, 0.96);

    border-bottom: 1px solid rgba(117, 78, 39, 0.15);

    box-shadow: 0 3px 12px rgba(80, 48, 20, 0.10);

    backdrop-filter: blur(8px);

}

.topo-titulo {

    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 19px;

    font-weight: 800;

    color: #70451f;

}

.topo-botao {

    width: 44px;

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 0;

    border-radius: 14px;

    background: #fff;

    color: #70451f;

    font-size: 21px;

    box-shadow: 0 2px 8px rgba(70, 40, 15, 0.12);

}

.topo-botao:active {

    transform: scale(0.94);

}

/* ==================================================

   CARTÃO PRINCIPAL

================================================== */

.painel {

    padding: 14px 12px 0;

}

.card-principal {

    overflow: hidden;

    background: rgba(255, 252, 245, 0.94);

    border: 1px solid rgba(126, 87, 45, 0.14);

    border-radius: 24px;

    box-shadow:

        0 8px 25px rgba(82, 50, 20, 0.13);

}

/* ==================================================

   NOME E IDADE

================================================== */

.identidade {

    padding: 17px 17px 12px;

    text-align: center;

}

.nome-linha {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

}

.nome-petton {

    margin: 0;

    font-size: 25px;

    font-weight: 850;

    color: #633d1e;

}

.botao-editar {

    width: 43px;

    height: 43px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    border: 0;

    border-radius: 13px;

    background: #f5dfb8;

    color: #69431f;

    font-size: 19px;

    box-shadow: 0 2px 6px rgba(70, 40, 15, 0.10);

}

.botao-editar:active {

    transform: scale(0.94);

}

.idade {

    margin-top: 5px;

    color: #8b725d;

    font-size: 14px;

    font-weight: 600;

}

/* ==================================================

   ÁREA DO PETTON

================================================== */

.petton-imagem-container {

    width: calc(100% - 24px);

    height: 260px;

    margin: 5px auto 13px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    overflow: hidden;

    background:

        radial-gradient(

            circle at 50% 40%,

            #fff8e8 0%,

            #f8e3bd 55%,

            #eac995 100%

        );

    border: 1px solid rgba(126, 87, 45, 0.14);

    border-radius: 21px;

    box-shadow:

        inset 0 0 25px rgba(255,255,255,0.5);

}

.petton-imagem {

    display: block;

    width: 88%;

    height: 88%;

    object-fit: contain;

    user-select: none;

    pointer-events: none;

    filter:

        drop-shadow(0 9px 7px rgba(72, 43, 17, 0.16));

    transition:

        transform 0.35s ease,

        opacity 0.35s ease;

}

.petton-imagem:hover {

    transform: scale(1.02);

}

/* ==================================================

   STATUS

================================================== */

.status {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 8px;

    padding: 0 13px 14px;

}

.status-card {

    min-height: 55px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 9px 10px;

    background: #fff;

    border: 1px solid rgba(126, 87, 45, 0.10);

    border-radius: 15px;

    box-shadow:

        0 2px 7px rgba(80, 48, 20, 0.06);

}

.status-icone {

    width: 31px;

    height: 31px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    background: #fff0d1;

    font-size: 18px;

}

.status-info {

    min-width: 0;

    flex: 1;

    text-align: left;

}

.status-nome {

    display: block;

    color: #987f68;

    font-size: 11px;

}

.status-valor {

    display: block;

    margin-top: 1px;

    color: #5e4027;

    font-size: 14px;

    font-weight: 800;

}

/* ==================================================

   AÇÕES

================================================== */

.titulo-secao {

    margin: 18px 14px 9px;

    color: #70451f;

    font-size: 17px;

    font-weight: 850;

}

.acoes {

    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 9px;

    padding: 0 13px;

}

.acao {

    min-height: 86px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    padding: 9px 6px;

    border: 1px solid rgba(126, 87, 45, 0.10);

    border-radius: 17px;

    background: #fffaf0;

    color: #604126;

    box-shadow:

        0 3px 9px rgba(80, 48, 20, 0.08);

    font-size: 15px;

    font-weight: 750;

    cursor: pointer;

    transition:

        transform 0.12s ease,

        background 0.12s ease;

}

.acao:active {

    transform: scale(0.96);

    background: #f8e8ca;

}

.acao .icone {

    width: 34px;

    height: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 11px;

    background: #f8e3bc;

    font-size: 22px;

}

/* ==================================================

   BÔNUS

================================================== */

.bonus {

    margin: 14px 13px 0;

    padding: 11px;

    display: flex;

    align-items: center;

    justify-content: space-between;

.bonus-texto {

.bonus-titulo {

    font-size: 14px;

    font-weight: 850;

    color: #795719;

}

.bonus-subtitulo {

    margin-top: 2px;

    font-size: 11px;

    color: #9a7a3c;

}

#btnBonus {

    min-width: 86px;

    height: 45px;

    border: 0;

    border-radius: 13px;

    background: #e7a928;

    color: white;

    font-size: 14px;

    font-weight: 800;

    box-shadow:

        0 3px 7px rgba(120, 75, 5, 0.16);

}

#btnBonus:active {

    transform: scale(0.95);

}

/* ==================================================

   MENU

================================================== */

.menu {

    display: grid;

    grid-template-columns:

        repeat(2, minmax(0, 1fr));

    gap: 9px;

    padding: 0 13px;

}

.menu-item {

    min-height: 79px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 5px;

    color: #604126;

    box-shadow:

    font-size: 13px;

    font-weight: 750;

}

.menu-item:active {

    transform: scale(0.96);

    background: #f7e8cd;

}

.menu-icone {

/* ==================================================

   MENSAGEM

================================================== */

#mensagem {

    min-height: 23px;

    margin: 12px 15px 0;

    text-align: center;

    color: #8a5c1e;

    font-size: 13px;

    font-weight: 750;

/* ==================================================

   MODAL

================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(40, 25, 12, 0.55);

.modal.ativo {

}

.modal-caixa {

.modal-topo {

}

.modal-titulo {

.modal-fechar {

#novoNome {

.modal-salvar {

/* ==================================================

   CELULARES PEQUENOS

================================================== */

@media (max-width: 380px) {

        padding: 8px;

    }

    .acao {

        min-height: 80px;

    }

    .menu-item {

    }

}

</style>

</head>

<script>

/* =========================================================

   TELA DO PETTON

========================================================= */

function atualizarTela() {

    if (typeof Petton === "undefined") {

        console.error(

            "petton.js não foi carregado."

        );

        return;

    }

    const dados = Petton.carregar();

    if (!dados) {

        return;

    }

    /*

     ======================================================

     CORREÇÃO DO NASCIMENTO

     

     Se o Petton já está sendo mostrado como gatinho,

     mas ainda não possui dateNascimento, consideramos

     este momento como o nascimento.

     Isso elimina definitivamente o estado "ovo".

     ======================================================

    */

    if (!dados.dateNascimento) {

        dados.dateNascimento =

            new Date().toISOString();

        Petton.dados =

            dados;

        Petton.salvar();

    }

    /* ==================================================

       NOME

    ================================================== */

    const nome =

        dados.nome || "Mimi";

    const nomeElemento =

        document.getElementById("pettonNome");

    if (nomeElemento) {

        nomeElemento.textContent =

            nome;

    }

    /* ==================================================

       IDADE

    ================================================== */

    const idadeElemento =

        document.getElementById("pettonIdade");

    if (idadeElemento) {

        const dias =

            Petton.idadeDias();

        if (dias < 1) {

            idadeElemento.textContent =

                "🐣 Recém-nascido";

        } else {

            idadeElemento.textContent =

                "🐾 " +

                formatarIdade(dias) +

                " • " +

                traduzirFase(Petton.fase());

        }

    }

    /* ==================================================

       STATUS

    ================================================== */

    const status =

        Petton.status();

    if (!status) {

        return;

    }

    definirTexto(

        "statusFome",

        Math.round(status.fome) + "%"

    );

    definirTexto(

        "statusFelicidade",

        Math.round(status.felicidade) + "%"

    );

    definirTexto(

        "statusEnergia",

        Math.round(status.energia) + "%"

    );

    definirTexto(

        "statusHigiene",

        Math.round(status.higiene) + "%"

    );

    definirTexto(

        "statusSaude",

        Math.round(status.saude) + "%"

    );

    definirTexto(

        "statusMoedas",

        String(

            Math.floor(

                dados.moedas || 0

            )

        )

    );

    /* ==================================================

       IMAGEM

    ================================================== */

    atualizarImagem(dados);

    /* ==================================================

       BÔNUS

    ================================================== */

    atualizarBonus(dados);

}

/* =========================================================

   DEFINIR TEXTO

========================================================= */

function definirTexto(id, texto) {

    const elemento =

        document.getElementById(id);

    if (elemento) {

        elemento.textContent =

            texto;

    }

}

/* =========================================================

   FORMATAR IDADE

========================================================= */

function formatarIdade(dias) {

    if (dias < 1) {

        return "menos de 1 dia";

    }

    if (dias < 30) {

        const numero =

            Math.floor(dias);

        return numero +

            (

                numero === 1

                    ? " dia"

                    : " dias"

            );

    }

    if (dias < 365) {

        const meses =

            Math.floor(

                dias / 30

            );

        const resto =

            Math.floor(

                dias % 30

            );

        if (resto > 0) {

            return meses +

                (

                    meses === 1

                        ? " mês "

                        : " meses "

                ) +

                "e " +

                resto +

                (

                    resto === 1

                        ? " dia"

                        : " dias"

                );

        }

        return meses +

            (

                meses === 1

                    ? " mês"

                    : " meses"

            );

    }

    const anos =

        Math.floor(

            dias / 365

        );

    return anos +

        (

            anos === 1

                ? " ano"

                : " anos"

        );

}

/* =========================================================

   TRADUZIR FASE

========================================================= */

function traduzirFase(fase) {

    const fases = {

        ovo: "Ovo",

        bebe: "Bebê",

        filhote: "Filhote",

        jovem: "Jovem",

        adulto: "Adulto"

    };

    return fases[fase] || fase;

}

/* =========================================================

   IMAGEM

========================================================= */

function atualizarImagem(dados) {

    const imagem =

        document.getElementById(

            "pettonImagem"

        );

    if (!imagem) {

        return;

    }

    /*

       Agora o estado "ovo" não é mais criado

       quando a data de nascimento está vazia.

    */

    if (dados.especie === "cachorro") {

        imagem.src =

            "FBC04FD9-CEFC-4D6D-AE9B-C77174DEB4E5.png";

        imagem.alt =

            "Petton cachorro";

        return;

    }

    imagem.src =

        "petton-original.png";

    imagem.alt =

        "Petton " +

        (

            dados.especie ||

            "animal"

        );

}

/* =========================================================

   ALIMENTAR

========================================================= */

function acaoAlimentar() {

    if (

        !Petton.dados ||

        Petton.fase() === "ovo"

    ) {

        mostrarMensagem(

            "🥚 O Petton ainda está no ovo."

        );

        return;

    }

    const sucesso =

        Petton.alimentar(15);

    if (!sucesso) {

        mostrarMensagem(

            "🍖 Não foi possível alimentar agora."

        );

        return;

    }

    mostrarMensagem(

        "🍖 O Petton comeu e ficou mais feliz!"

    );

    atualizarTela();

}

/* =========================================================

   BRINCAR

========================================================= */

function acaoBrincar() {

    if (

        !Petton.dados ||

        Petton.fase() === "ovo"

    ) {

        mostrarMensagem(

            "🥚 Espere o Petton nascer."

        );

        return;

    }

    if (

        Petton.status().energia < 10

    ) {

        mostrarMensagem(

            "😴 O Petton está cansado."

        );

        return;

    }

    Petton.brincar(8);

    mostrarMensagem(

        "🎾 Foi divertido brincar!"

    );

    atualizarTela();

}

/* =========================================================

   BANHO

========================================================= */

function acaoBanho() {

    if (

        !Petton.dados ||

        Petton.fase() === "ovo"

    ) {

        mostrarMensagem(

            "🥚 O Petton ainda está no ovo."

        );

        return;

    }

    Petton.dados.higiene =

        100;

    Petton.dados.felicidade =

        Math.min(

            100,

            Petton.dados.felicidade + 4

        );

    Petton.salvar();

    mostrarMensagem(

        "🛁 Banho tomado! O Petton está limpinho."

    );

    atualizarTela();

}

/* =========================================================

   LIMPAR

========================================================= */

function acaoLimpar() {

    if (

        !Petton.dados ||

        Petton.fase() === "ovo"

    ) {

        mostrarMensagem(

            "🥚 Ainda não há nada para limpar."

        );

        return;

    }

    Petton.dados.higiene =

        100;

    Petton.salvar();

    mostrarMensagem(

        "🧹 Tudo limpo!"

    );

    atualizarTela();

}

/* =========================================================

   DORMIR

========================================================= */

function acaoDormir() {

    if (

        !Petton.dados ||

        Petton.fase() === "ovo"

    ) {

        mostrarMensagem(

            "🥚 O ovo ainda está esperando o nascimento."

        );

        return;

    }

    Petton.dormir();

    mostrarMensagem(

        "😴 O Petton descansou."

    );

}

/* =========================================================

   CARINHO

========================================================= */

function acaoCarinho() {

    if (

        !Petton.dados ||

        Petton.fase() === "ovo"

    ) {

        mostrarMensagem(

            "🥚 Dê carinho quando ele nascer!"

        );

        return;

    }

    Petton.carinho();

    mostrarMensagem(

        "❤️ O Petton adorou o carinho!"

    );

    atualizarTela();

}

/* =========================================================

   RENOMEAR

========================================================= */

function abrirRenomear() {

    const modal =

        document.getElementById(

            "modalNome"

        );

    const input =

        document.getElementById(

            "novoNome"

        );

    if (!modal || !input) {

        return;

    }

    input.value =

        Petton.dados?.nome ||

        "Mimi";

    modal.classList.add(

        "ativo"

    );

    setTimeout(

        function() {

            input.focus();

        },

        100

    );

}

function fecharRenomear() {

    const modal =

        document.getElementById(

            "modalNome"

        );

    if (modal) {

        modal.classList.remove(

            "ativo"

        );

    }

}

function fecharModalFora(event) {

    if (

        event.target.id ===

        "modalNome"

    ) {

        fecharRenomear();

    }

}

function salvarNome() {

    const input =

        document.getElementById(

            "novoNome"

        );

    if (

        !input ||

        !Petton.dados

    ) {

        return;

    }

    const nome =

        input.value.trim();

    if (!nome) {

        mostrarMensagem(

            "⚠️ Digite um nome."

        );

        return;

    }

    Petton.dados.nome =

        nome.substring(

            0,

            20

        );

    Petton.salvar();

    fecharRenomear();

    mostrarMensagem(

        "✅ Nome salvo!"

    );

    atualizarTela();

}

/* =========================================================

   BÔNUS

========================================================= */

function pegarBonus() {

    if (!Petton.dados) {

        return;

    }

    const hoje =

        new Date()

            .toISOString()

            .slice(0, 10);

    if (

        Petton.dados.ultimoBonus ===

        hoje

    ) {

        mostrarMensagem(

            "🎁 Você já pegou o bônus de hoje."

        );

        return;

    }

    Petton.dados.moedas =

        Number(

            Petton.dados.moedas || 0

        ) + 20;

    Petton.dados.ultimoBonus =

        hoje;

    Petton.salvar();

    mostrarMensagem(

        "🎁 +20 moedas!"

    );

    atualizarTela();

}

function atualizarBonus(dados) {

    const botao =

        document.getElementById(

            "btnBonus"

        );

    if (!botao) {

        return;

    }

    const hoje =

        new Date()

            .toISOString()

            .slice(0, 10);

    if (

        dados.ultimoBonus ===

        hoje

    ) {

        botao.textContent =

            "Pegou";

        botao.disabled =

            true;

        botao.style.opacity =

            "0.55";

    } else {

        botao.textContent =

            "Pegar";

        botao.disabled =

            false;

        botao.style.opacity =

            "1";

    }

}

/* =========================================================

   MENSAGEM

========================================================= */

let mensagemTimer = null;

function mostrarMensagem(texto) {

    const elemento =

        document.getElementById(

            "mensagem"

        );

    if (!elemento) {

        return;

    }

    elemento.textContent =

        texto;

    clearTimeout(

        mensagemTimer

    );

    mensagemTimer =

        setTimeout(

            function() {

                elemento.textContent =

                    "";

            },

            2500

        );

}

/* =========================================================

   ÁLBUM

========================================================= */

function mostrarAlbum() {

    window.location.href =

        "album.html";

}

/* =========================================================

   VOLTAR

========================================================= */

function voltarMenu() {

    window.location.href =

        "../entretenimento.html";

}

/* =========================================================

   TECLA ENTER NO NOME

========================================================= */

document.addEventListener(

    "keydown",

    function(event) {

        if (

            event.key === "Enter" &&

            document

                .getElementById(

                    "modalNome"

                )

                ?.classList

                .contains("ativo")

        ) {

            salvarNome();

        }

        if (

            event.key === "Escape"

        ) {

            fecharRenomear();

        }

    }

);

/* =========================================================

   INICIAR

========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        atualizarTela();

    }

);

/* =========================================================

   ATUALIZA IDADE / STATUS

========================================================= */

setInterval(

    function() {

        atualizarTela();

    },

    60000

);

</script>

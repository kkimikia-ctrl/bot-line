<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petton - Gatinho Estilo Tamagotchi</title>
    <style>
        :root {
            --bg-color: #ffb6c1;
            --container-bg: #ffffff;
            --primary-color: #ff69b4;
            --primary-hover: #ff1493;
            --text-color: #4a4a4a;
            --border-radius: 20px;
        }

        body {
            margin: 0;
            padding: 10px;
            background: linear-gradient(to bottom, #ff9a9e, #fecfef);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            box-sizing: border-box;
        }

        .game-container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 380px;
            padding: 15px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .pet-title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            color: #d81b60;
            font-size: 1.6rem;
        }

        .stars-box {
            background: #fff8e1;
            border: 1px solid #ffe082;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #ffa000;
        }

        .screen {
            width: 100%;
            height: 200px;
            background: linear-gradient(to bottom, #e0f7fa, #b2ebf2);
            border: 2px dashed #ff80ab;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        #pet-avatar {
            font-size: 4.5rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
            position: relative;
            z-index: 2;
        }

        #pet-avatar:active {
            transform: scale(0.9);
        }

        .item-spawn {
            position: absolute;
            font-size: 1.8rem;
            z-index: 3;
            cursor: pointer;
        }

        .message-box {
            font-size: 0.85rem;
            margin-bottom: 12px;
            min-height: 20px;
            color: #d81b60;
            font-weight: 500;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            text-align: left;
            background: #fff0f5;
            padding: 10px;
            border-radius: 12px;
        }

        .stat-bar {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .stat-bar span {
            width: 85px;
        }

        .progress {
            flex-grow: 1;
            background-color: #ddd;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-left: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background-color: #ff4081;
            transition: width 0.3s ease;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        button {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 8px 4px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-full {
            width: 100%;
            margin-bottom: 6px;
            background-color: #26a69a;
        }
        .btn-full:hover {
            background-color: #00897b;
        }

        .btn-reset {
            background-color: #e57373;
        }
        .btn-reset:hover {
            background-color: #d32f2f;
        }

        .btn-central {
            background-color: #78909c;
        }
        .btn-central:hover {
            background-color: #607d8b;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header-top">
            <span>Cantinho Tamagotchi 🐾</span>
        </div>
        
        <div class="pet-title-area">
            <h1 id="pet-name">Mimi 🐱</h1>
            <div class="stars-box">⭐ <span id="score">57</span></div>
        </div>

        <div class="screen" id="game-screen">
            <div id="pet-avatar" onclick="interactPet()">🐱</div>
            <div id="extras-area"></div>
        </div>

        <div class="message-box" id="msg">Toque na tela para o gatinho pular!</div>

        <div class="stats">
            <div class="stat-bar">
                <span>🍗 Fome</span>
                <div class="progress"><div id="hunger-bar" class="progress-fill"></div></div>
                <span id="hunger-val" style="font-size:0.75rem; width:35px; text-align:right;">100%</span>
            </div>
            <div class="stat-bar">
                <span>💖 Felicidade</span>
                <div class="progress"><div id="happiness-bar" class="progress-fill"></div></div>
                <span id="happiness-val" style="font-size:0.75rem; width:35px; text-align:right;">100%</span>
            </div>
            <div class="stat-bar">
                <span>⚡ Energia</span>
                <div class="progress"><div id="energy-bar" class="progress-fill"></div></div>
                <span id="energy-val" style="font-size:0.75rem; width:35px; text-align:right;">70%</span>
            </div>
        </div>

        <div class="actions">
            <button onclick="feedPet()">🍽️ Comer</button>
            <button onclick="playPet()">🎮 Brincar</button>
            <button onclick="sleepPet()">💤 Dormir</button>
            <button onclick="bathPet()">🛁 Banho</button>
            <button onclick="cleanPet()">🧹 Limpar</button>
            <button onclick="brushPet()">🧹 Escovar</button>
        </div>

        <button class="action-btn btn-full" style="background-color: #ab47bc;" onclick="openHospital()">🏥 Hospital</button>
        <button class="action-btn btn-full" onclick="goWalk()">🌳 Ir Passear</button>
        <button class="action-btn btn-full btn-reset" onclick="resetGame()">🔄 Reiniciar Jogo</button>
        <button class="action-btn btn-full btn-central" onclick="goCentral()">⬅️ Voltar para a Central</button>
    </div>

    <script>
        let pet = {
            name: "Mimi",
            score: 57,
            hunger: 100,
            happiness: 100,
            energy: 70,
            isSleeping: false,
            isSick: false,
            hasPoop: false,
            hasDirt: false
        };

        const petAvatar = document.getElementById('pet-avatar');
        const msgBox = document.getElementById('msg');
        const scoreEl = document.getElementById('score');
        const hungerBar = document.getElementById('hunger-bar');
        const happinessBar = document.getElementById('happiness-bar');
        const energyBar = document.getElementById('energy-bar');
        const hungerVal = document.getElementById('hunger-val');
        const happinessVal = document.getElementById('happiness-val');
        const energyVal = document.getElementById('energy-val');
        const extrasArea = document.getElementById('extras-area');

        function updateUI() {
            scoreEl.textContent = pet.score;
            hungerBar.style.width = pet.hunger + '%';
            happinessBar.style.width = pet.happiness + '%';
            energyBar.style.width = pet.energy + '%';
            hungerVal.textContent = pet.hunger + '%';
            happinessVal.textContent = pet.happiness + '%';
            energyVal.textContent = pet.energy + '%';

            let extrasHTML = '';
            if (pet.hasPoop) extrasHTML += '<div class="item-spawn" style="bottom: 15px; left: 20px;" onclick="cleanPoop(event)">💩</div>';
            if (pet.hasDirt) extrasHTML += '<div class="item-spawn" style="bottom: 15px; right: 20px;" onclick="cleanDirt(event)">🦠</div>';
            extrasArea.innerHTML = extrasHTML;

            if (pet.isSleeping) {
                petAvatar.textContent = '😴';
            } else if (pet.isSick) {
                petAvatar.textContent = '🤒';
            } else {
                petAvatar.textContent = '🐱';
            }
        }

        function interactPet() {
            if (pet.isSleeping) {
                msgBox.textContent = "Mimi está dormindo, não perturbe!";
                return;
            }
            pet.score += 1;
            pet.happiness = Math.min(100, pet.happiness + 2);
            msgBox.textContent = "Mimi ronronou feliz! (+1 Ponto)";
            updateUI();
        }

        function feedPet() {
            pet.hunger = Math.min(100, pet.hunger + 20);
            pet.score += 2;
            msgBox.textContent = "Mimi comeou com apetite!";
            updateUI();
        }

        function playPet() {
            if (pet.energy < 15) {
                msgBox.textContent = "Mimi está cansada demais para brincar!";
                return;
            }
            pet.energy = Math.max(0, pet.energy - 15);
            pet.happiness = Math.min(100, pet.happiness + 15);
            pet.score += 5;
            msgBox.textContent = "Mimi se divertiu muito brincando!";
            updateUI();
        }

        function sleepPet() {
            pet.isSleeping = !pet.isSleeping;
            if (pet.isSleeping) {
                msgBox.textContent = "Mimi foi tirar uma soneca...";
                pet.energy = Math.min(100, pet.energy + 30);
            } else {
                msgBox.textContent = "Mimi acordou revigorada!";
            }
            updateUI();
        }

        function bathPet() {
            pet.happiness = Math.min(100, pet.happiness + 10);
            msgBox.textContent = "Banho tomado! Mimi está cheirosa.";
            updateUI();
        }

        function cleanPet() {
            pet.hasPoop = false;
            pet.hasDirt = false;
            pet.score += 3;
            msgBox.textContent = "Ambiente limpo e higienizado!";
            updateUI();
        }

        function brushPet() {
            pet.happiness = Math.min(100, pet.happiness + 10);
            msgBox.textContent = "Pelo escovado com sucesso!";
            updateUI();
        }

        function openHospital() {
            if (pet.isSick) {
                pet.isSick = false;
                msgBox.textContent = "Mimi foi tratada no hospital e está curada!";
            } else {
                msgBox.textContent = "Mimi já está saudável, não precisa de hospital!";
            }
            updateUI();
        }

        function goWalk() {
            pet.happiness = Math.min(100, pet.happiness + 20);
            pet.energy = Math.max(0, pet.energy - 10);
            pet.score += 10;
            if (Math.random() > 0.5) pet.hasPoop = true;
            msgBox.textContent = "Passeio divertido pelo parque concluído!";
            updateUI();
        }

        function cleanPoop(e) {
            e.stopPropagation();
            pet.hasPoop = false;
            pet.score += 2;
            msgBox.textContent = "Cocô limpo com sucesso!";
            updateUI();
        }

        function cleanDirt(e) {
            e.stopPropagation();
            pet.hasDirt = false;
            pet.score += 2;
            msgBox.textContent = "Sujeira limpa com sucesso!";
            updateUI();
        }

        function resetGame() {
            if (confirm("Deseja realmente reiniciar o jogo?")) {
                pet.score = 0;
                pet.hunger = 100;
                pet.happiness = 100;
                pet.energy = 70;
                pet.isSleeping = false;
                pet.isSick = false;
                pet.hasPoop = false;
                pet.hasDirt = false;
                msgBox.textContent = "Jogo reiniciado!";
                updateUI();
            }
        }

        function goCentral() {
            alert("Voltando para a Central...");
        }

        updateUI();
    </script>
</body>
</html>

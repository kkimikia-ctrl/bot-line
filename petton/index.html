<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petton - Seu Gatinho Virtual</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --container-bg: #ffffff;
            --primary-color: #ff80ab;
            --primary-hover: #ff4081;
            --text-color: #4a4a4a;
            --border-radius: 20px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .game-container {
            background-color: var(--container-bg);
            width: 380px;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            color: var(--primary-hover);
            font-size: 1.8rem;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            text-align: left;
            background: #fff0f5;
            padding: 10px;
            border-radius: 12px;
        }

        .stat-bar {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .stat-bar span {
            width: 70px;
        }

        .progress {
            flex-grow: 1;
            background-color: #ddd;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-left: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background-color: #4caf50;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .screen {
            width: 100%;
            height: 220px;
            background: linear-gradient(to bottom, #e0f7fa, #80deea);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* Avatar e Estados */
        #pet-avatar {
            font-size: 5rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
            position: relative;
            z-index: 2;
        }

        #pet-avatar:active {
            transform: scale(0.9);
        }

        .poop {
            position: absolute;
            bottom: 20px;
            right: 40px;
            font-size: 2rem;
            z-index: 3;
            cursor: pointer;
        }

        .zzz {
            position: absolute;
            top: 20px;
            right: 80px;
            font-size: 1.5rem;
            animation: floatZzz 1.5s infinite;
            display: none;
        }

        @keyframes floatZzz {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; }
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        button {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 10px 5px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .score-board {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        /* Mini-janela de Minigame */
        #minigame-container {
            display: none;
            margin-top: 10px;
            background: #fff;
            border: 2px dashed var(--primary-color);
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Petton 🐾</h1>
        
        <div class="stats">
            <div class="stat-bar">
                <span>Fome:</span>
                <div class="progress"><div id="hunger-bar" class="progress-fill"></div></div>
            </div>
            <div class="stat-bar">
                <span>Felicidade:</span>
                <div class="progress"><div id="happiness-bar" class="progress-fill"></div></div>
            </div>
            <div class="stat-bar">
                <span>Energia:</span>
                <div class="progress"><div id="energy-bar" class="progress-fill"></div></div>
            </div>
        </div>

        <div class="screen" id="game-screen">
            <div id="zzz" class="zzz">💤</div>
            <div id="pet-avatar">🥚</div>
            <div id="poop-area"></div>
        </div>

        <div class="actions">
            <button id="btn-feed" onclick="feedPet()">Alimentar</button>
            <button id="btn-play" onclick="openMinigame()">Brincar</button>
            <button id="btn-sleep" onclick="toggleSleep()">Dormir</button>
            <button id="btn-clean" onclick="cleanPoop()">Limpar</button>
            <button id="btn-heal" onclick="healPet()">Médico</button>
            <button id="btn-reset" onclick="resetGame()" style="background-color: #e57373;">Reiniciar</button>
        </div>

        <div id="minigame-container">
            <p id="minigame-text" style="margin: 0 0 8px 0; font-size: 0.85rem; font-weight: bold;">Escolha par ou ímpar com o Petton!</p>
            <button onclick="playMinigame('par')">Par ✌️</button>
            <button onclick="playMinigame('impar')">Ímpar ☝️</button>
        </div>

        <div class="score-board">
            Pontos Gerais: <span id="score">0</span> | Fase: <span id="stage">Ovo</span>
        </div>
    </div>

    <script>
        // Sistema de Áudio Simples (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        // Variáveis do Jogo
        let pet = {
            hunger: 100,
            happiness: 100,
            energy: 100,
            score: 0,
            stage: 'egg', // egg, baby, adult
            clicksToHatch: 12,
            isSleeping: false,
            isSick: false,
            hasPoop: false
        };

        const avatars = {
            egg: '🥚',
            baby: '🐱',
            adult: '🐈',
            sick: '🤒',
            sleeping: '😴'
        };

        // Carregar do LocalStorage se houver
        if (localStorage.getItem('petton_save')) {
            try {
                pet = JSON.parse(localStorage.getItem('petton_save'));
            } catch(e) { console.error("Erro ao carregar save"); }
        }

        function saveGame() {
            localStorage.setItem('petton_save', JSON.stringify(pet));
        }

        const petAvatar = document.getElementById('pet-avatar');
        const hungerBar = document.getElementById('hunger-bar');
        const happinessBar = document.getElementById('happiness-bar');
        const energyBar = document.getElementById('energy-bar');
        const scoreDisplay = document.getElementById('score');
        const stageDisplay = document.getElementById('stage');
        const zzzElement = document.getElementById('zzz');
        const poopArea = document.getElementById('poop-area');
        const minigameContainer = document.getElementById('minigame-container');

        petAvatar.addEventListener('click', () => {
            playSound(400, 'sine', 0.1);
            if (pet.stage === 'egg') {
                pet.clicksToHatch--;
                pet.score += 5;
                if (pet.clicksToHatch <= 0) {
                    pet.stage = 'baby';
                    playSound(600, 'triangle', 0.4);
                }
                updateUI();
                saveGame();
            } else if (!pet.isSleeping) {
                pet.happiness = Math.min(100, pet.happiness + 2);
                updateUI();
            }
        });

        function feedPet() {
            if (pet.isSleeping || pet.stage === 'egg') return;
            playSound(300, 'square', 0.2);
            pet.hunger = Math.min(100, pet.hunger + 25);
            pet.score += 10;
            
            // Chance de fazer cocô ao comer
            if (Math.random() > 0.5 && !pet.hasPoop) {
                pet.hasPoop = true;
            }

            // Crescer para adulto se tiver pontos suficientes
            if (pet.stage === 'baby' && pet.score > 150) {
                pet.stage = 'adult';
                playSound(800, 'sine', 0.5);
            }
            updateUI();
            saveGame();
        }

        function openMinigame() {
            if (pet.isSleeping || pet.stage === 'egg') return;
            minigameContainer.style.display = minigameContainer.style.display === 'block' ? 'none' : 'block';
        }

        function playMinigame(choice) {
            playSound(500, 'sine', 0.15);
            const petChoice = Math.random() > 0.5 ? 'par' : 'impar';
            if (choice === petChoice) {
                pet.happiness = Math.min(100, pet.happiness + 20);
                pet.score += 30;
                alert("Você venceu o minigame! O Petton adorou!");
            } else {
                pet.happiness = Math.min(100, pet.happiness + 5);
                alert("O Petton escolheu diferente, mas foi divertido!");
            }
            minigameContainer.style.display = 'none';
            updateUI();
            saveGame();
        }

        function toggleSleep() {
            if (pet.stage === 'egg') return;
            pet.isSleeping = !pet.isSleeping;
            if (pet.isSleeping) {
                playSound(200, 'sine', 0.4);
                zzzElement.style.display = 'block';
            } else {
                zzzElement.style.display = 'none';
            }
            updateUI();
            saveGame();
        }

        function cleanPoop() {
            if (pet.hasPoop) {
                playSound(450, 'sawtooth', 0.2);
                pet.hasPoop = false;
                pet.score += 15;
                updateUI();
                saveGame();
            }
        }

        function healPet() {
            if (pet.isSick) {
                playSound(700, 'sine', 0.3);
                pet.isSick = false;
                pet.happiness = Math.min(100, pet.happiness + 15);
                updateUI();
                saveGame();
            }
        }

        function resetGame() {
            if (confirm("Tem certeza que deseja reiniciar o seu Petton?")) {
                localStorage.removeItem('petton_save');
                pet = { hunger: 100, happiness: 100, energy: 100, score: 0, stage: 'egg', clicksToHatch: 12, isSleeping: false, isSick: false, hasPoop: false };
                zzzElement.style.display = 'none';
                minigameContainer.style.display = 'none';
                updateUI();
            }
        }

        // Loop principal de tempo (diminui status)
        setInterval(() => {
            if (pet.stage === 'egg') return;

            if (pet.isSleeping) {
                pet.energy = Math.min(100, pet.energy + 10);
                if (pet.energy >= 100) {
                    pet.isSleeping = false;
                    zzzElement.style.display = 'none';
                }
            } else {
                pet.hunger = Math.max(0, pet.hunger - 3);
                pet.happiness = Math.max(0, pet.happiness - 2);
                pet.energy = Math.max(0, pet.energy - 2);

                // Chance de ficar doente se a fome estiver zerada
                if (pet.hunger === 0 && Math.random() > 0.7) {
                    pet.isSick = true;
                }
            }
            updateUI();
            saveGame();
        }, 10000);

        function updateUI() {
            hungerBar.style.width = pet.hunger + '%';
            happinessBar.style.width = pet.happiness + '%';
            energyBar.style.width = pet.energy + '%';

            // Cores das barras
            hungerBar.style.backgroundColor = pet.hunger < 30 ? '#e57373' : '#4caf50';
            happinessBar.style.backgroundColor = pet.happiness < 30 ? '#e57373' : '#4caf50';
            energyBar.style.backgroundColor = pet.energy < 30 ? '#e57373' : '#4caf50';

            scoreDisplay.textContent = pet.score;
            
            let stageName = "Ovo";
            if (pet.stage === 'baby') stageName = "Filhote";
            if (pet.stage === 'adult') stageName = "Adulto";
            stageDisplay.textContent = stageName;

            // Atualizar avatar na tela
            if (pet.isSick) {
                petAvatar.textContent = avatars.sick;
            } else if (pet.isSleeping) {
                petAvatar.textContent = avatars.sleeping;
            } else {
                petAvatar.textContent = avatars[pet.stage];
            }

            // Exibir cocô se houver
            poopArea.innerHTML = pet.hasPoop ? '<div class="poop" onclick="cleanPoop()" title="Limpar cocô">💩</div>' : '';
        }

        // Inicializar UI na primeira abertura
        updateUI();
    </script>
</body>
</html>

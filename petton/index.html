<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petton - Seu Pet no LINE</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        h2 {
            margin-top: 0;
            color: #ff69b4;
            font-size: 22px;
        }
        .scenery {
            width: 100%;
            height: 130px;
            border-radius: 18px;
            background: #fff5f8;
            border: 2px dashed #ffe0ec;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 12px 0;
            position: relative;
            transition: background 0.5s ease;
        }
        .scenery.outdoor {
            background: linear-gradient(180deg, #bbf2f6 0%, #e1fed3 100%);
            border: 2px solid #a3e4d7;
        }
        .pet-avatar {
            font-size: 80px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .floating {
            animation: float 2.5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .walking {
            animation: walk 0.6s infinite alternate ease-in-out;
        }
        @keyframes walk {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-6px) rotate(5deg); }
        }
        .status-box {
            text-align: left;
            margin: 10px 0;
            background: #fff5f8;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #ffe0ec;
        }
        .status-label {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        .bar-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-top: 4px;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff758c, #ff7eb3);
            transition: width 0.4s ease;
            border-radius: 10px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.3);
            transition: all 0.2s;
        }
        button:active {
            transform: scale(0.94);
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-passeio {
            grid-column: span 2;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 4px 10px rgba(67, 233, 123, 0.3);
            color: #2c3e50;
        }
        .btn-voltar-menu {
            display: block;
            width: 100%;
            margin-top: 12px;
            background: #6b7280;
            box-shadow: 0 4px 10px rgba(107, 114, 128, 0.3);
            text-decoration: none;
            box-sizing: border-box;
            text-align: center;
            padding: 12px;
            border-radius: 14px;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }
        #user-greeting {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }
        #texto-status {
            font-size: 12px;
            color: #666;
            margin: 6px 0;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="user-greeting">Modo de Jogo Ativo! 🐾</div>
        <h2 id="pet-name">Mimi 🐱</h2>
        
        <div class="scenery" id="cenario-fundo">
            <div class="pet-avatar floating" id="pet-emoji" onclick="tocarPet()">🐱</div>
        </div>

        <div id="texto-status">Mimi está descansando confortavelmente no quarto.</div>
        
        <div class="status-box">
            <div class="status-label"><span>🍗 Fome</span> <span id="txt-fome">80%</span></div>
            <div class="bar-container"><div id="bar-fome" class="bar-fill" style="width: 80%;"></div></div>
        </div>

        <div class="status-box">
            <div class="status-label"><span>💖 Felicidade</span> <span id="txt-felicidade">90%</span></div>
            <div class="bar-container"><div id="bar-felicidade" class="bar-fill" style="width: 90%;"></div></div>
        </div>

        <div class="status-box">
            <div class="status-label"><span>⚡ Energia</span> <span id="txt-energia">100%</span></div>
            <div class="bar-container"><div id="bar-energia" class="bar-fill" style="width: 100%;"></div></div>
        </div>

        <div class="btn-grid">
            <button onclick="alimentar()">🍽️ Alimentar</button>
            <button onclick="brincar()">🎮 Brincar</button>
            <button onclick="dormir()">💤 Dormir</button>
            <button onclick="darBanho()">🛁 Banho</button>
            <button class="btn-passeio" id="btn-acao-passeio" onclick="alternarPasseio()">🌳 Ir Passear</button>
        </div>

        <a href="forca.html" class="btn-voltar-menu">⬅️ Voltar para a Central</a>
    </div>

    <script>
        let pet = {
            nome: "Mimi",
            fome: 80,
            felicidade: 90,
            energia: 100,
            emPasseio: false
        };

        function atualizarTela() {
            document.getElementById('bar-fome').style.width = pet.fome + '%';
            document.getElementById('txt-fome').innerText = pet.fome + '%';

            document.getElementById('bar-felicidade').style.width = pet.felicidade + '%';
            document.getElementById('txt-felicidade').innerText = pet.felicidade + '%';

            document.getElementById('bar-energia').style.width = pet.energia + '%';
            document.getElementById('txt-energia').innerText = pet.energia + '%';
        }

        function mudarExpressao(emoji) {
            document.getElementById('pet-emoji').innerText = emoji;
        }

        function alimentar() {
            if (pet.emPasseio) return;
            pet.fome = Math.min(100, pet.fome + 15);
            document.getElementById('texto-status').innerText = `${pet.nome} comeu com muita alegria! 🐟`;
            mudarExpressao("😻");
            animarEfeito();
            setTimeout(() => { if(!pet.emPasseio) mudarExpressao("🐱"); }, 2000);
            atualizarTela();
        }

        function brincar() {
            if (pet.emPasseio) return;
            if (pet.energia < 15) {
                alert("Seu pet está muito cansado para brincar! Coloque-o para dormir 💤");
                return;
            }
            pet.felicidade = Math.min(100, pet.felicidade + 15);
            pet.energia = Math.max(0, pet.energia - 15);
            document.getElementById('texto-status').innerText = `Você brincou bastante com ${pet.nome}! ✨`;
            mudarExpressao("😸");
            animarEfeito();
            setTimeout(() => { if(!pet.emPasseio) mudarExpressao("🐱"); }, 2000);
            atualizarTela();
        }

        function dormir() {
            if (pet.emPasseio) return;
            pet.energia = 100;
            pet.fome = Math.max(0, pet.fome - 10);
            document.getElementById('texto-status').innerText = `${pet.nome} tirou uma soneca profunda e recuperou as energias 💤`;
            mudarExpressao("😴");
            setTimeout(() => { if(!pet.emPasseio) mudarExpressao("🐱"); }, 3000);
            atualizarTela();
        }

        function darBanho() {
            if (pet.emPasseio) return;
            pet.felicidade = Math.min(100, pet.felicidade + 10);
            document.getElementById('texto-status').innerText = `${pet.nome} tomou banho e está cheirosinho(a) 🛁`;
            mudarExpressao("😽");
            animarEfeito();
            setTimeout(() => { if(!pet.emPasseio) mudarExpressao("🐱"); }, 2000);
            atualizarTela();
        }

        function alternarPasseio() {
            const cenario = document.getElementById('cenario-fundo');
            const avatar = document.getElementById('pet-emoji');
            const btnPasseio = document.getElementById('btn-acao-passeio');

            if (!pet.emPasseio) {
                if (pet.energia < 20) {
                    alert("Seu pet está muito cansado para passear! Deixe-o descansar um pouco primeiro 💤");
                    return;
                }
                pet.emPasseio = true;
                cenario.classList.add('outdoor');
                avatar.classList.remove('floating');
                avatar.classList.add('walking');
                btnPasseio.innerText = "🏠 Voltar para Casa";
                document.getElementById('texto-status').innerText = `${pet.nome} está passeando no parque ao ar livre! 🌳☀️`;
                mudarExpressao("😺");
                
                pet.energia = Math.max(0, pet.energia - 20);
                pet.felicidade = Math.min(100, pet.felicidade + 20);
            } else {
                pet.emPasseio = false;
                cenario.classList.remove('outdoor');
                avatar.classList.remove('walking');
                avatar.classList.add('floating');
                btnPasseio.innerText = "🌳 Ir Passear";
                document.getElementById('texto-status').innerText = `${pet.nome} voltou para o conforto do apartamento. 🏡`;
                mudarExpressao("🐱");
            }
            atualizarTela();
        }

        function tocarPet() {
            mudarExpressao("😽");
            document.getElementById('texto-status').innerText = `${pet.nome} adorou o carinho! ❤️`;
            animarEfeito();
            setTimeout(() => { if(!pet.emPasseio) mudarExpressao("🐱"); }, 1500);
        }

        function animarEfeito() {
            const emoji = document.getElementById('pet-emoji');
            emoji.style.transform = "scale(1.25) rotate(8deg)";
            setTimeout(() => {
                emoji.style.transform = "scale(1) rotate(0deg)";
            }, 300);
        }

        atualizarTela();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petton - Gatinho Kawaii</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.96);
            padding: 22px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            box-sizing: border-box;
            position: relative;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h2 {
            margin: 0;
            color: #ff5295;
            font-size: 18px;
            text-align: left;
        }
        .score-board {
            background: #fff0f5;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            color: #ff5295;
            border: 1px solid #ffb6c1;
        }
        .scenery {
            width: 100%;
            height: 160px;
            border-radius: 20px;
            background: #fff0f5;
            border: 2px dashed #ffb6c1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 12px 0;
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
        }
        .scenery.outdoor {
            background: linear-gradient(180deg, #bbf2f6 0%, #d4edbc 100%);
            border: 2px solid #82e0aa;
        }
        .scenery.minigame-bg {
            background: #fff9c4;
            border: 2px solid #fbc02d;
        }
        
        /* GATO DESENHADO EM CSS (KAWAII) */
        .cat-container {
            position: relative;
            width: 110px;
            height: 100px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        .cat-head {
            position: absolute;
            bottom: 5px;
            left: 10px;
            width: 90px;
            height: 75px;
            background-color: #ffb347;
            border-radius: 45px 45px 38px 38px;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.08);
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03) translateY(-2px); }
        }
        /* Orelhas */
        .cat-ear {
            position: absolute;
            top: -14px;
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 30px solid #ffb347;
        }
        .cat-ear.left { left: 4px; transform: rotate(-15deg); }
        .cat-ear.right { right: 4px; transform: rotate(15deg); }
        
        .cat-ear::after {
            content: '';
            position: absolute;
            top: 8px;
            left: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #ffcccc;
        }
        /* Olhos */
        .cat-eye {
            position: absolute;
            top: 28px;
            width: 10px;
            height: 12px;
            background-color: #333;
            border-radius: 50%;
            animation: blink 4s infinite;
        }
        .cat-eye.left { left: 24px; }
        .cat-eye.right { right: 24px; }
        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        /* Focinho e Boca */
        .cat-nose {
            position: absolute;
            top: 42px;
            left: 41px;
            width: 8px;
            height: 6px;
            background-color: #ff69b4;
            border-radius: 50%;
        }
        .cat-mouth {
            position: absolute;
            top: 47px;
            left: 37px;
            width: 16px;
            height: 8px;
            border-bottom: 2px solid #333;
            border-radius: 0 0 10px 10px;
        }
        /* Bochechas fofas */
        .cat-blush {
            position: absolute;
            top: 40px;
            width: 14px;
            height: 8px;
            background-color: rgba(255, 105, 180, 0.4);
            border-radius: 50%;
        }
        .cat-blush.left { left: 12px; }
        .cat-blush.right { right: 12px; }

        /* Estados do Gato */
        .cat-container.sleeping .cat-eye {
            height: 2px;
            background: none;
            border-top: 2px solid #333;
            top: 32px;
        }
        .cat-container.adult .cat-head {
            background-color: #e08250;
        }
        .cat-container.adult .cat-ear {
            border-bottom-color: #e08250;
        }

        /* Animações gerais */
        .floating { animation: float 2.5s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .walking-path {
            position: absolute;
            animation: walkSquare 8s linear infinite;
        }

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Forca</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
            text-align: center;
        }
        .card-game {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div id="container-jogo-forca" class="card-game">
        <button onclick="voltarMenuJogos()" style="background: #ccc; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: left;">⬅ Voltar</button>
        <button onclick="salvarPontuacaoRankingForcaManual()" style="background: #059669; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: right; font-weight: bold; font-size: 11px;">💾 Salvar Pontos</button>
        <div style="clear: both;"></div>
        
        <div style="background: #00796b; color: white; padding: 8px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
            <h3 id="forca-nivel-info" style="margin: 0; font-size: 13px;">🎯 Jogo da Forca</h3>
            <span>⏱️ <span id="forca-tempo">30</span>s</span>
        </div>
        
        <div id="status-forca" style="font-size: 13px; font-weight: bold; margin: 5px; color: #dc2626;">Erros: <span id="contador-erros">0</span> / 6 | Pontos: <span id="pontos-forca">0</span></div>
        <div id="palavra-secreta" style="font-size: 24px; letter-spacing: 6px; font-weight: bold; margin: 10px 0;">_ _ _ _ _</div>
        
        <div style="margin-bottom: 10px;">
            <button onclick="tocarEfeito('clique'); mostrarDicaForca()" style="background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">💡 Mostrar Dica</button>
            <p id="dica-palavra" style="font-weight: bold; color: #0284c7; font-size: 13px; margin: 5px 0; display: none;"></p>
        </div>

        <div id="teclado-letras" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 350px; margin: 0 auto;"></div>
    </div>

    <script>
        const bancoPalavrasForca = [
            { palavra: "COMPUTADOR", dica: "Equipamento eletrônico de dados" },
            { palavra: "PROGRAMACAO", dica: "Arte de criar softwares" },
            { palavra: "FUTEBOL", dica: "Esporte mais popular do Brasil" },
            { palavra: "BRASIL", dica: "País sede da central de jogos" },
            { palavra: "JAVASCRIPT", dica: "Linguagem de programação web" },
            { palavra: "BICICLETA", dica: "Meio de transporte de duas rodas" }
        ];

        let palavraForcaAtual = "";
        let dicaForcaAtual = "";
        let letrasAdivinhadasForca = [];
        let errosForca = 0;
        let pontosForca = 0;
        let tempoForcaRestante = 30;
        let timerForcaInterval = null;

        function iniciarJogoForca() {
            errosForca = 0;
            pontosForca = 0;
            letrasAdivinhadasForca = [];
            tempoForcaRestante = 30;

            document.getElementById('contador-erros').innerText = errosForca;
            document.getElementById('pontos-forca').innerText = pontosForca;
            document.getElementById('forca-tempo').innerText = tempoForcaRestante;
            
            let dicaP = document.getElementById('dica-palavra');
            dicaP.style.display = 'none';
            dicaP.innerText = "";

            let sorteio = bancoPalavrasForca[Math.floor(Math.random() * bancoPalavrasForca.length)];
            palavraForcaAtual = sorteio.palavra;
            dicaForcaAtual = sorteio.dica;

            atualizarTelaForca();
            criarTecladoForca();
            iniciarCronometroForca();
        }

        function iniciarCronometroForca() {
            clearInterval(timerForcaInterval);
            timerForcaInterval = setInterval(() => {
                tempoForcaRestante--;
                document.getElementById('forca-tempo').innerText = tempoForcaRestante;
                
                if (tempoForcaRestante <= 0) {
                    clearInterval(timerForcaInterval);
                    alert("⏰ O tempo acabou! A palavra era: " + palavraForcaAtual);
                    proximaPalavraForca(false);
                }
            }, 1000);
        }

        function criarTecladoForca() {
            const teclado = document.getElementById('teclado-letras');
            teclado.innerHTML = "";
            const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            
            for (let letra of letras) {
                let btn = document.createElement('button');
                btn.innerText = letra;
                btn.id = `tecla-forca-${letra}`;
                btn.style.cssText = "background: #e2e8f0; border: none; padding: 10px 0; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; color: #333;";
                btn.onclick = () => tentarLetraForca(letra);
                teclado.appendChild(btn);
            }
        }

        function tentarLetraForca(letra) {
            let btn = document.getElementById(`tecla-forca-${letra}`);
            if (btn) btn.disabled = true;

            if (palavraForcaAtual.includes(letra)) {
                letrasAdivinhadasForca.push(letra);
                atualizarTelaForca();

                let venceu = true;
                for (let l of palavraForcaAtual) {
                    if (!letrasAdivinhadasForca.includes(l)) {
                        venceu = false;
                        break;
                    }
                }

                if (venceu) {
                    clearInterval(timerForcaInterval);
                    pontosForca += 20 + tempoForcaRestante;
                    document.getElementById('pontos-forca').innerText = pontosForca;
                    alert("🎉 Parabéns! Você acertou!");
                    setTimeout(iniciarJogoForca, 500);
                }
            } else {
                errosForca++;
                document.getElementById('contador-erros').innerText = errosForca;

                if (errosForca >= 6) {
                    clearInterval(timerForcaInterval);
                    alert(`❌ Fim de jogo! A palavra era: ${palavraForcaAtual}`);
                    proximaPalavraForca(true);
                }
            }
        }

        function atualizarTelaForca() {
            let display = "";
            for (let l of palavraForcaAtual) {
                if (letrasAdivinhadasForca.includes(l)) {
                    display += l + " ";
                } else {
                    display += "_ ";
                }
            }
            document.getElementById('palavra-secreta').innerText = display.trim();
        }

        function mostrarDicaForca() {
            let dicaP = document.getElementById('dica-palavra');
            dicaP.innerText = "💡 Dica: " + dicaForcaAtual;
            dicaP.style.display = 'block';
        }

        function proximaPalavraForca(derrota) {
            iniciarJogoForca();
        }

        function salvarPontuacaoRankingForcaManual() {
            alert("Pontuação salva: " + pontosForca);
        }

        function voltarMenuJogos() {
            clearInterval(timerForcaInterval);
            alert("Voltando ao menu...");
        }

        window.onload = () => {
            iniciarJogoForca();
        };
    </script>
</body>
</html>

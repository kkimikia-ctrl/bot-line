<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendário do Mês</title>
    <!-- Firebase App (Core) SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            padding-top: 65px;
            padding-bottom: 20px;
            color: #1e293b;
            overflow-x: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2);
            box-sizing: border-box;
        }
        .header-title {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 45s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #eee;
            border: 1px solid #ddd;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-50% - 5px)); }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .calendar-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 12px;
        }
        .month-navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .month-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0d47a1;
            text-align: center;
            flex-grow: 1;
        }
        .nav-month-btn {
            background: #f1f5f9;
            border: none;
            color: #0d47a1;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .nav-month-btn:hover {
            background: #e2e8f0;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .week-day {
            text-align: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            padding-bottom: 6px;
        }
        .week-day.weekend {
            color: #ef4444;
        }
        .day-box {
            background: #f8fafc;
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .day-box:not(.empty):hover {
            background: #e2e8f0;
        }
        .day-box.selected {
            border: 2px solid #0d47a1;
            background: #e3f2fd !important;
        }
        .day-box.weekend-day {
            color: #ef4444;
        }
        .day-box.has-event {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            color: #0d47a1;
            font-weight: 800;
            border: 2px solid #90caf9;
        }
        .day-box.empty {
            background: transparent;
            color: transparent;
            cursor: default;
        }
        .dot {
            width: 5px;
            height: 5px;
            background-color: #ef4444;
            border-radius: 50%;
            position: absolute;
            bottom: 6px;
        }
        .event-detail-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border-left: 4px solid #0d47a1;
            max-height: 120px;
            overflow-y: auto;
        }
        .event-detail-card::-webkit-scrollbar {
            width: 4px;
        }
        .event-detail-card::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .detail-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: #0d47a1;
            margin-bottom: 4px;
        }
        .detail-content {
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="agenda.html" class="header-btn">◀ Semana</a>
        <div class="header-title">Calendário do Mês</div>
        <a href="index.html" class="header-btn">Home 🏠</a>
    </header>

    <section class="carousel-container" id="carouselWrapper">
        <div class="carousel-track" id="carouselTrack"></div>
    </section>

    <div class="container">
        <div class="calendar-card">
            <div class="month-navigation">
                <button class="nav-month-btn" onclick="mudarMes(-1)">◀</button>
                <div class="month-title" id="monthTitleText">Agosto 2026</div>
                <button class="nav-month-btn" onclick="mudarMes(1)">▶</button>
            </div>

            <div class="calendar-grid">
                <div class="week-day">Seg</div>
                <div class="week-day">Ter</div>
                <div class="week-day">Qua</div>
                <div class="week-day">Qui</div>
                <div class="week-day">Sex</div>
                <div class="week-day weekend">Sáb</div>
                <div class="week-day weekend">Dom</div>
            </div>

            <div class="calendar-grid" id="calendarDays" style="margin-top: 6px;"></div>
        </div>

        <div class="event-detail-card" id="eventDetailCard">
            <div class="detail-title" id="detailDateTitle">Selecione um dia</div>
            <div class="detail-content" id="detailContentText">Clique em um dia do calendário para ver os eventos.</div>
        </div>
    </div>

    <script>
        let eventosData = {};
        let dataAtual = new Date(2026, 7, 1); // Agosto de 2026
        const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

        function mudarMes(direcao) {
            dataAtual.setMonth(dataAtual.getMonth() + direcao);
            renderizarCalendario();
        }

        function renderizarCalendario() {
            const ano = dataAtual.getFullYear();
            const mes = dataAtual.getMonth();

            const titleEl = document.getElementById("monthTitleText");
            if (titleEl) titleEl.innerText = `${mesesNomes[mes]} ${ano}`;

            const grid = document.getElementById("calendarDays");
            if (!grid) return;
            grid.innerHTML = "";

            let primeiroDiaSemana = new Date(ano, mes, 1).getDay();
            primeiroDiaSemana = (primeiroDiaSemana === 0) ? 6 : primeiroDiaSemana - 1;

            const ultimoDia = new Date(ano, mes + 1, 0).getDate();

            for (let i = 0; i < primeiroDiaSemana; i++) {
                const vazio = document.createElement("div");
                vazio.className = "day-box empty";
                grid.appendChild(vazio);
            }

            for (let dia = 1; dia <= ultimoDia; dia++) {
                const box = document.createElement("div");
                box.className = "day-box";
                
                const posicaoNaGrid = (primeiroDiaSemana + (dia - 1)) % 7;
                if (posicaoNaGrid === 5 || posicaoNaGrid === 6) {
                    box.classList.add("weekend-day");
                }

                const mesStr = String(mes + 1).padStart(2, '0');
                const diaStr = String(dia).padStart(2, '0');
                const chaveData = `${ano}-${mesStr}-${diaStr}`;

                box.innerText = dia;

                if (eventosData[chaveData]) {
                    box.classList.add("has-event");
                    const dot = document.createElement("span");
                    dot.className = "dot";
                    box.appendChild(dot);
                }

                box.onclick = function() {
                    document.querySelectorAll('.day-box').forEach(b => b.classList.remove('selected'));
                    box.classList.add('selected');
                    
                    const tituloCard = document.getElementById("detailDateTitle");
                    const textoCard = document.getElementById("detailContentText");

                    if (tituloCard) tituloCard.innerText = `${dia} de ${mesesNomes[mes]} de ${ano}`;
                    
                    if (textoCard) {
                        if (eventosData[chaveData]) {
                            textoCard.innerHTML = `🌟 <b>Evento encontrado:</b><br>${eventosData[chaveData]}`;
                        } else {
                            textoCard.innerText = "Nenhum evento programado para este dia.";
                        }
                    }
                };

                grid.appendChild(box);
            }
        }

        async function carregarEventosFirebase() {
            renderizarCalendario(); // Desenha logo os dias de imediato
            const dbFirestore = window.db || (typeof firebase !== 'undefined' ? firebase.firestore() : null);
            
            if (dbFirestore) {
                try {
                    const querySnapshot = await dbFirestore.collection("eventos").get();
                    querySnapshot.forEach((doc) => {
                        const dados = doc.data();
                        const dataChave = dados.data || doc.id;
                        const textoEvento = dados.texto || dados.titulo || "Evento programado.";
                        if (dataChave) {
                            eventosData[dataChave] = textoEvento;
                        }
                    });
                    renderizarCalendario(); // Atualiza com os eventos do Firebase
                } catch (err) {
                    console.error("Erro ao carregar eventos:", err);
                }
            }
        }

        function carregarBannersFirebase() {
            const track = document.getElementById('carouselTrack');
            const wrapper = document.getElementById('carouselWrapper');
            if (!track) return;

            const dbFirestore = window.db || (typeof firebase !== 'undefined' ? firebase.firestore() : null);
            if (!dbFirestore) {
                if (wrapper) wrapper.style.display = "none";
                return;
            }

            // Carrega todos os banners da coleção sem filtros restritos
            dbFirestore.collection("anuncios")
                .get()
                .then((querySnapshot) => {
                    if (querySnapshot.empty) {
                        if (wrapper) wrapper.style.display = "none";
                        return;
                    }

                    let bannersHtml = "";
                    querySnapshot.forEach((docSnap) => {
                        const an = docSnap.data();
                        const imagemUrl = an.imagemUrl || an.url || "";
                        const link = an.linkDestino && an.linkDestino !== "#" ? an.linkDestino : "#";

                        if (imagemUrl) {
                            bannersHtml += `
                                <a href="${link}" target="_blank">
                                    <img src="${imagemUrl}" alt="${an.nomeAnunciante || 'Banner'}">
                                </a>
                            `;
                        }
                    });

                    if (bannersHtml !== "") {
                        track.innerHTML = bannersHtml + bannersHtml;
                        if (wrapper) wrapper.style.display = "block";
                    } else {
                        if (wrapper) wrapper.style.display = "none";
                    }
                })
                .catch(() => {
                    if (wrapper) wrapper.style.display = "none";
                });
        }

        carregarEventosFirebase();
        carregarBannersFirebase();
    </script>
</body>
</html>

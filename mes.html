<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mês Inteiro - Agenda</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            padding-top: 70px;
            padding-bottom: 40px;
            color: #1e293b;
        }
        .header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 18px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2);
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .calendar-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
        }
        .month-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 800;
            color: #0d47a1;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .week-day {
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            padding-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .week-day.weekend {
            color: #ef4444;
        }
        .day-box {
            background: #f8fafc;
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .day-box:not(.empty):hover {
            background: #e2e8f0;
        }
        .day-box.selected {
            border: 2px solid #0d47a1;
            background: #e3f2fd !important;
        }
        .day-box.weekend-day {
            color: #ef4444;
        }
        .day-box.has-event {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            color: #0d47a1;
            font-weight: 800;
            border: 2px solid #90caf9;
        }
        .day-box.empty {
            background: transparent;
            color: transparent;
            cursor: default;
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: #ef4444;
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
        }
        .event-detail-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            border-left: 4px solid #0d47a1;
            text-align: left;
        }
        .detail-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #0d47a1;
            margin-bottom: 6px;
        }
        /* Adicionada altura máxima e barra de rolagem automática */
        .detail-content {
            font-size: 0.9rem;
            color: #475569;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .back-btn-container {
            text-align: center;
        }
        .back-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            border: none;
            text-decoration: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.25);
            box-sizing: border-box;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        📅 Calendário do Mês
    </div>

    <div class="container">
        <div class="calendar-card">
            <div class="month-title">Agosto 2026</div>

            <div class="calendar-grid">
                <div class="week-day">Seg</div>
                <div class="week-day">Ter</div>
                <div class="week-day">Qua</div>
                <div class="week-day">Qui</div>
                <div class="week-day">Sex</div>
                <div class="week-day weekend">Sáb</div>
                <div class="week-day weekend">Dom</div>
            </div>

            <div class="calendar-grid" id="calendarDays" style="margin-top: 8px;"></div>
        </div>

        <!-- Cartão onde aparece o evento ao clicar no dia -->
        <div class="event-detail-card" id="eventDetailCard">
            <div class="detail-title" id="detailDateTitle">Toque num dia</div>
            <div class="detail-content" id="detailContentText">Selecione qualquer dia no calendário acima para ver os eventos programados.</div>
        </div>

        <!-- Botão Voltar na parte inferior -->
        <div class="back-btn-container">
            <a href="agenda.html" class="back-btn">Voltar</a>
        </div>
    </div>

    <script>
        const eventosData = {
            "2026-08-24": "🌸 Festival Cultural da Cidade - 14:00 na Praça Central",
            "2026-08-26": "🇧🇷 Encontro da Comunidade Brasileira - 19:30 no Centro Comunitário"
        };

        const ano = 2026;
        const mes = 7; // Agosto (0 a 11)
        const mesesNomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

        function renderizarCalendario() {
            const grid = document.getElementById("calendarDays");
            grid.innerHTML = "";

            let primeiroDiaSemana = new Date(ano, mes, 1).getDay();
            primeiroDiaSemana = (primeiroDiaSemana === 0) ? 6 : primeiroDiaSemana - 1;

            const ultimoDia = new Date(ano, mes + 1, 0).getDate();

            for (let i = 0; i < primeiroDiaSemana; i++) {
                const vazio = document.createElement("div");
                vazio.className = "day-box empty";
                grid.appendChild(vazio);
            }

            for (let dia = 1; dia <= ultimoDia; dia++) {
                const box = document.createElement("div");
                box.className = "day-box";
                
                const posicaoNaGrid = (primeiroDiaSemana + (dia - 1)) % 7;
                if (posicaoNaGrid === 5 || posicaoNaGrid === 6) {
                    box.classList.add("weekend-day");
                }

                const mesStr = String(mes + 1).padStart(2, '0');
                const diaStr = String(dia).padStart(2, '0');
                const chaveData = `${ano}-${mesStr}-${diaStr}`;

                box.innerText = dia;

                if (eventosData[chaveData]) {
                    box.classList.hasEvent = true;
                    box.classList.add("has-event");
                    const dot = document.createElement("span");
                    dot.className = "dot";
                    box.appendChild(dot);
                }

                box.onclick = function() {
                    document.querySelectorAll('.day-box').forEach(b => b.classList.remove('selected'));
                    box.classList.add('selected');
                    
                    const tituloCard = document.getElementById("detailDateTitle");
                    const textoCard = document.getElementById("detailContentText");

                    tituloCard.innerText = `${dia} de ${mesesNomes[mes]} de ${ano}`;
                    
                    if (eventosData[chaveData]) {
                        textoCard.innerHTML = `🌟 <b>Evento encontrado:</b><br>${eventosData[chaveData]}`;
                    } else {
                        textoCard.innerText = "Nenhum evento programado para este dia.";
                    }
                };

                grid.appendChild(box);
            }
        }

        renderizarCalendario();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mês Inteiro - Agenda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            padding-top: 60px;
            color: #333;
        }
        .header {
            background-color: #0d47a1;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            padding-bottom: 80px;
        }
        .month-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0d47a1;
            margin-bottom: 15px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .week-day {
            text-align: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: #666;
            padding-bottom: 5px;
        }
        .day-box {
            background: #f8f9fa;
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 0.9rem;
            font-weight: bold;
            color: #333;
        }
        .day-box.has-event {
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #90caf9;
        }
        .day-box.empty {
            background: transparent;
            color: #ccc;
        }
        /* Bolinha indicadora de evento no calendário */
        .dot {
            width: 6px;
            height: 6px;
            background-color: #e53935;
            border-radius: 50%;
            position: absolute;
            bottom: 6px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        📅 Calendário do Mês
    </div>

    <div class="container">
        <div class="month-title">Agosto de 2026</div>

        <div class="calendar-grid">
            <div class="week-day">Dom</div>
            <div class="week-day">Seg</div>
            <div class="week-day">Ter</div>
            <div class="week-day">Qua</div>
            <div class="week-day">Qui</div>
            <div class="week-day">Sex</div>
            <div class="week-day">Sáb</div>

            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
            <div class="day-box">1</div>

            <div class="day-box">2</div>
            <div class="day-box">3</div>
            <div class="day-box">4</div>
            <div class="day-box">5</div>
            <div class="day-box">6</div>
            <div class="day-box">7</div>
            <div class="day-box">8</div>

            <div class="day-box">9</div>
            <div class="day-box">10</div>
            <div class="day-box">11</div>
            <div class="day-box">12</div>
            <div class="day-box">13</div>
            <div class="day-box">14</div>
            <div class="day-box">15</div>

            <div class="day-box">16</div>
            <div class="day-box">17</div>
            <div class="day-box">18</div>
            <div class="day-box">19</div>
            <div class="day-box">20</div>
            <div class="day-box">21</div>
            <div class="day-box">22</div>

            <div class="day-box">23</div>
            <div class="day-box has-event">24 <span class="dot"></span></div>
            <div class="day-box">25</div>
            <div class="day-box has-event">26 <span class="dot"></span></div>
            <div class="day-box">27</div>
            <div class="day-box">28</div>
            <div class="day-box">29</div>

            <div class="day-box">30</div>
            <div class="day-box">31</div>
            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
            <div class="day-box empty"></div>
        </div>

        <a href="agenda.html" class="back-btn">Voltar</a>
    </div>

</body>
</html>

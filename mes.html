<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mês Inteiro - Agenda</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            padding-top: 70px;
            color: #1e293b;
        }
        .header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 18px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2);
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 90px;
        }
        .calendar-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }
        .month-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 800;
            color: #0d47a1;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .week-day {
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            padding-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .day-box {
            background: #f8fafc;
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s ease;
        }
        .day-box:not(.empty):hover {
            background: #e2e8f0;
            transform: scale(1.03);
        }
        .day-box.has-event {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            color: #0d47a1;
            font-weight: 800;
            border: 2px solid #90caf9;
            box-shadow: 0 4px 10px rgba(13, 71, 161, 0.1);
        }
        .day-box.empty {
            background: transparent;
            color: transparent;
            cursor: default;
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: #ef4444;
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
            box-shadow: 0 0 8px #ef4444;
        }
        .back-btn-container {
            text-align: center;
            margin-top: 25px;
        }
        .back-btn {
            display: inline-block;
            width: 100%;
            max-width: 220px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.25);
            transition: transform 0.2s;
        }
        .back-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="header">
        📅 Calendário do Mês
    </div>

    <div class="container">
        <div class="calendar-card">
            <div class="month-title">Agosto 2026</div>

            <div class="calendar-grid">
                <div class="week-day">Seg</div>
                <div class="week-day">Ter</div>
                <div class="week-day">Qua</div>
                <div class="week-day">Qui</div>
                <div class="week-day">Sex</div>
                <div class="week-day">Sáb</div>
                <div class="week-day">Dom</div>

                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
                <div class="day-box">1</div>
                <div class="day-box">2</div>

                <div class="day-box">3</div>
                <div class="day-box">4</div>
                <div class="day-box">5</div>
                <div class="day-box">6</div>
                <div class="day-box">7</div>
                <div class="day-box">8</div>
                <div class="day-box">9</div>

                <div class="day-box">10</div>
                <div class="day-box">11</div>
                <div class="day-box">12</div>
                <div class="day-box">13</div>
                <div class="day-box">14</div>
                <div class="day-box">15</div>
                <div class="day-box">16</div>

                <div class="day-box">17</div>
                <div class="day-box">18</div>
                <div class="day-box">19</div>
                <div class="day-box">20</div>
                <div class="day-box">21</div>
                <div class="day-box">22</div>
                <div class="day-box">23</div>

                <div class="day-box has-event">24 <span class="dot"></span></div>
                <div class="day-box">25</div>
                <div class="day-box has-event">26 <span class="dot"></span></div>
                <div class="day-box">27</div>
                <div class="day-box">28</div>
                <div class="day-box">29</div>
                <div class="day-box">30</div>

                <div class="day-box">31</div>
                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
                <div class="day-box empty"></div>
            </div>
        </div>

        <div class="back-btn-container">
            <!-- Nota: Se o seu arquivo principal da semana se chamar 'index.html', mude 'agenda.html' abaixo para 'index.html' -->
            <a href="agenda.html" class="back-btn">Voltar</a>
        </div>
    </div>

</body>
</html>

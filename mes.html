<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda do Mês</title>
    <!-- Firebase App (Core) SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            padding-top: 65px;
            padding-bottom: 20px;
            color: #1e293b;
            overflow-x: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2);
            box-sizing: border-box;
        }
        .header-title {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- CARROSSEL INFINITO --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 45s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-50% - 5px)); }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .day-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            margin-bottom: 10px;
            border-left: 4px solid #0d47a1;
        }
        .day-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #0d47a1;
            margin-bottom: 6px;
        }
        .day-content {
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="agenda.html" class="header-btn">◀ Semana</a>
        <div class="header-title">Agenda de Setembro</div>
        <a href="index.html" class="header-btn">Home 🏠</a>
    </header>

    <!-- Carrossel Infinito -->
    <section class="carousel-container" id="carouselWrapper">
        <div class="carousel-track" id="carouselTrack">
            <a href="agenda.html"><img src="https://via.placeholder.com/150x85/0d47a1/ffffff?text=Mes" alt="Mês"></a>
            <a href="agenda.html"><img src="https://via.placeholder.com/150x85/1565c0/ffffff?text=Eventos" alt="Eventos"></a>
        </div>
    </section>

    <div class="container" id="agendaContainer">
        <div class="day-card">
            <div class="day-title">1 de Setembro</div>
            <div class="day-content">Início das inscrições para as atividades comunitárias.</div>
        </div>
        <div class="day-card">
            <div class="day-title">15 de Setembro</div>
            <div class="day-content">Reunião geral da comunidade às 20:00.</div>
        </div>
    </div>

    <script>
        function carregarBannersCarrossel() {
            const track = document.getElementById("carouselTrack");
            if (!track) return;

            const dbFirestore = window.db || (typeof firebase !== 'undefined' ? firebase.firestore() : null);
            if (!dbFirestore) return;

            dbFirestore.collection("anuncios")
                .where("categoria", "==", "semanames")
                .get()
                .then((querySnapshot) => {
                    if (querySnapshot.empty) return;

                    let dynamicHTML = "";
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const imagemUrl = data.imagemUrl || data.url || "";
                        const linkUrl = data.linkDestino || data.linkUrl || "#";

                        if (imagemUrl) {
                            dynamicHTML += `
                                <a href="${linkUrl}" target="_blank">
                                    <img src="${imagemUrl}" alt="Banner Anúncio">
                                </a>
                            `;
                        }
                    });

                    if (dynamicHTML !== "") {
                        track.innerHTML = dynamicHTML + dynamicHTML;
                    }
                })
                .catch((error) => {
                    console.error("Erro ao carregar banners do carrossel:", error);
                });
        }

        carregarBannersCarrossel();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Diário - Ajuda JP</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #fdfbf7;
            --line-color: #e6e2d3;
            --margin-line: #f1b9b9;
            --text-main: #2c2a29;
            --text-muted: #78746e;
            --primary: #5c6b53;
            --primary-light: #eaf0e6;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f2eee3;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        /* --- CARROSSEL INFINITO DINÂMICO --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            border-radius: 12px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 16px;
            position: relative;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #dfdbce;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 30s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #eee;
            border: 1px solid #ddd;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        /* --- BOTÃO VOLTAR & TÍTULO --- */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .btn-back {
            background: #2b4c7e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: #1f375c;
        }

        .page-title-top {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* --- CORPO DO DIÁRIO (Estilo Caderno) --- */
        .diary-container {
            width: 100%;
            background-color: var(--paper-bg);
            background-image: 
                linear-gradient(90deg, transparent 50px, var(--margin-line) 50px, var(--margin-line) 52px, transparent 52px),
                linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 32px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid #dfdbce;
            padding: 35px 35px 35px 70px;
            position: relative;
        }

        /* Top Bar & Controls */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--paper-bg);
            padding-bottom: 10px;
            border-bottom: 1px dashed #d6d0bf;
        }

        .date-title h1 {
            font-family: 'Caveat', cursive;
            font-size: 2.1rem;
            color: var(--primary);
            line-height: 1;
        }

        .controls-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-btn {
            background: #f2eee3;
            border: 1px solid #d6d0bf;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: #e6e2d3;
        }

        /* Header Section: Goal Check */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 14px;
            margin-bottom: 20px;
            background: var(--paper-bg);
            flex-wrap: wrap;
            gap: 10px;
        }

        .goal-check-box {
            background: var(--primary-light);
            border: 1px solid #d0e0c8;
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
        }

        .goal-check-box span {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .radio-group label {
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Thermometer Section (1-5) */
        .thermometer-section {
            background: rgba(247, 245, 238, 0.9);
            border: 1px solid #e2ddd0;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .thermometer-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .thermo-row, .thermo-custom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .thermo-row span, .thermo-custom-row input {
            font-weight: 500;
            color: var(--text-main);
        }

        .thermo-custom-row input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--text-muted);
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            width: 120px;
            padding: 2px 4px;
        }

        .rating-scales {
            display: flex;
            gap: 6px;
        }

        .rating-scales label {
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border-radius: 4px;
            background: #fff;
            border: 1px solid #d6d0bf;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .rating-scales input {
            display: none;
        }

        .rating-scales input:checked + span, .rating-scales label:has(input:checked) {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Writing Area + Audio Button */
        .writing-area {
            position: relative;
            margin-bottom: 20px;
        }

        .writing-area textarea {
            width: 100%;
            height: 220px;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            line-height: 32px;
            color: var(--text-main);
            resize: none;
        }

        .writing-area textarea::placeholder {
            color: #b5b0a1;
            font-style: italic;
        }

        .mic-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--paper-bg);
            border: 1px solid #d6d0bf;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .mic-btn.recording {
            background: #f1b9b9;
            color: #721c24;
            border-color: #f5c6cb;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Footer Section */
        .footer-section {
            background: #f7f5ee;
            border: 1px dashed #d6d0bf;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .footer-section label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .footer-section input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .footer-section input::placeholder {
            color: #b5b0a1;
            font-style: italic;
        }

        .actions {
            text-align: right;
            background: var(--paper-bg);
        }

        .btn-save {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background-color: #4b5843;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-card {
            background: var(--paper-bg);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #dfdbce;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-card h3 {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .setting-item {
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .setting-item label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .setting-item select {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #d6d0bf;
            background: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .modal-close {
            margin-top: 10px;
            background: var(--text-muted);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
        }

        #verse-card {
            text-align: center;
        }

        #verse-text {
            font-style: italic;
            color: var(--text-main);
            margin: 16px 0;
            line-height: 1.5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BOTÃO VOLTAR & TÍTULO -->
        <div class="top-nav">
            <a href="rotina.html" class="btn-back">← Voltar</a>
            <span class="page-title-top">Meu Diário</span>
            <div style="width: 60px;"></div>
        </div>

        <!-- CARROSSEL INFINITO -->
        <section class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <a href="fale-conosco.html"><img src="mini-banner-1.jpg" alt="Destaque 1"></a>
                <a href="fale-conosco.html"><img src="mini-banner-2.jpg" alt="Destaque 2"></a>
                <a href="fale-conosco.html"><img src="mini-banner-3.jpg" alt="Destaque 3"></a>
                <a href="fale-conosco.html"><img src="mini-banner-4.jpg" alt="Destaque 4"></a>
            </div>
        </section>

        <div class="diary-container">
            <!-- TOP BAR: DATA & CONTROLS -->
            <div class="top-bar">
                <div class="date-title">
                    <h1 id="current-date">Quarta-feira, 4 de Setembro</h1>
                </div>
                <div class="controls-right">
                    <button class="icon-btn" id="sound-toggle" title="Ligar/Desligar Som">🔊</button>
                    <button class="icon-btn" id="settings-btn" title="Configurações">⚙️</button>
                </div>
            </div>

            <!-- HEADER SECTION: META DE HOJE -->
            <div class="header-section">
                <div class="goal-check-box">
                    <span>Cumpriu a meta de hj?</span>
                    <div class="radio-group">
                        <label><input type="radio" name="meta_hoje" value="sim"> Sim</label>
                        <label><input type="radio" name="meta_hoje" value="mais_ou_menos"> Mais ou menos</label>
                        <label><input type="radio" name="meta_hoje" value="nao"> Não deu</label>
                    </div>
                </div>
            </div>

            <!-- THERMOMETER (1 to 5) -->
            <div class="thermometer-section">
                <div class="thermometer-grid">
                    <div class="thermo-row">
                        <span>🔋 Cansado</span>
                        <div class="rating-scales">
                            <label><input type="radio" name="cansado" value="1">1</label>
                            <label><input type="radio" name="cansado" value="2">2</label>
                            <label><input type="radio" name="cansado" value="3">3</label>
                            <label><input type="radio" name="cansado" value="4">4</label>
                            <label><input type="radio" name="cansado" value="5">5</label>
                        </div>
                    </div>
                    <div class="thermo-row">
                        <span>⚡ Produtivo</span>
                        <div class="rating-scales">
                            <label><input type="radio" name="produtivo" value="1">1</label>
                            <label><input type="radio" name="produtivo" value="2">2</label>
                            <label><input type="radio" name="produtivo" value="3">3</label>
                            <label><input type="radio" name="produtivo" value="4">4</label>
                            <label><input type="radio" name="produtivo" value="5">5</label>
                        </div>
                    </div>
                    <div class="thermo-row">
                        <span>😊 Feliz</span>
                        <div class="rating-scales">
                            <label><input type="radio" name="feliz" value="1">1</label>
                            <label><input type="radio" name="feliz" value="2">2</label>
                            <label><input type="radio" name="feliz" value="3">3</label>
                            <label><input type="radio" name="feliz" value="4">4</label>
                            <label><input type="radio" name="feliz" value="5">5</label>
                        </div>
                    </div>
                    <div class="thermo-row">
                        <span>💡 Aprendizado</span>
                        <div class="rating-scales">
                            <label><input type="radio" name="aprendizado" value="1">1</label>
                            <label><input type="radio" name="aprendizado" value="2">2</label>
                            <label><input type="radio" name="aprendizado" value="3">3</label>
                            <label><input type="radio" name="aprendizado" value="4">4</label>
                            <label><input type="radio" name="aprendizado" value="5">5</label>
                        </div>
                    </div>
                    <div class="thermo-custom-row">
                        <input type="text" id="custom-metric-name" placeholder="Item livre...">
                        <div class="rating-scales">
                            <label><input type="radio" name="custom" value="1">1</label>
                            <label><input type="radio" name="custom" value="2">2</label>
                            <label><input type="radio" name="custom" value="3">3</label>
                            <label><input type="radio" name="custom" value="4">4</label>
                            <label><input type="radio" name="custom" value="5">5</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- WRITING AREA + AUDIO BUTTON -->
            <div class="writing-area">
                <textarea id="diary-text" placeholder="Escreva como foi o seu dia aqui..."></textarea>
                <button class="mic-btn" id="mic-toggle">🎤 Falar</button>
            </div>

            <!-- FOOTER: META PARA AMANHÃ -->
            <div class="footer-section">
                <label for="meta-amanha">Meta para amanhã</label>
                <input type="text" id="meta-amanha" placeholder="O que você quer realizar amanhã?">
            </div>

            <!-- SAVE BUTTON -->
            <div class="actions">
                <button class="btn-save" id="save-btn">Salvar Diário</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <h3>Configurações</h3>
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="setting-verse" checked> Exibir versículo ao salvar
                </label>
            </div>
            <div class="setting-item">
                <label>Trilha Sonora Ambiente:</label>
                <select id="setting-sound">
                    <option value="none">Nenhuma</option>
                    <option value="rain">Chuva suave</option>
                    <option value="piano">Piano calmo</option>
                </select>
            </div>
            <button class="modal-close" id="close-settings">Salvar Ajustes</button>
        </div>
    </div>

    <!-- SAVED / SCRIPTURE MODAL -->
    <div class="modal-overlay" id="verse-modal">
        <div class="modal-card" id="verse-card">
            <h3 id="modal-title">Diário Salvo!</h3>
            <p id="verse-text">"O Senhor é o meu pastor; de nada me faltará..."</p>
            <button class="modal-close" id="close-verse">Fechar</button>
        </div>
    </div>

    <script>
        // Script do Carrossel Infinito
        const track = document.getElementById('carouselTrack');
        const items = Array.from(track.children);
        items.forEach(item => {
            const clone = item.cloneNode(true);
            track.appendChild(clone);
        });
        window.addEventListener('load', () => {
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
        });

        // Data atual formatada (atualizada automaticamente para PT-BR)
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        const todayStr = new Date().toLocaleDateString('pt-BR', options);
        document.getElementById('current-date').textContent = todayStr.charAt(0).toUpperCase() + todayStr.slice(1);

        // Modais
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettings = document.getElementById('close-settings');
        
        const saveBtn = document.getElementById('save-btn');
        const verseModal = document.getElementById('verse-modal');
        const closeVerse = document.getElementById('close-verse');
        const settingVerseCheckbox = document.getElementById('setting-verse');
        const modalTitle = document.getElementById('modal-title');
        const verseText = document.getElementById('verse-text');

        settingsBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
        closeSettings.addEventListener('click', () => settingsModal.style.display = 'none');

        saveBtn.addEventListener('click', () => {
            const showVerse = settingVerseCheckbox.checked;
            if (showVerse) {
                modalTitle.textContent = "Diário Salvo com Sucesso!";
                verseText.style.display = "block";
                verseText.textContent = `"O Senhor é a minha luz e a minha salvação; de quem terei medo? O Senhor é a fortaleza da minha vida; a quem temerei?" — Salmo 27:1`;
            } else {
                modalTitle.textContent = "Pronto!";
                verseText.style.display = "none";
            }
            verseModal.style.display = 'flex';
        });

        closeVerse.addEventListener('click', () => verseModal.style.display = 'none');

        // Reconhecimento de Voz (Microfone)
        const micToggle = document.getElementById('mic-toggle');
        const diaryText = document.getElementById('diary-text');
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    }
                }
                if (finalTranscript) {
                    diaryText.value += (diaryText.value ? ' ' : '') + finalTranscript;
                }
            };

            recognition.onerror = () => stopRecording();
            recognition.onend = () => stopRecording();
        }

        function startRecording() {
            if (!recognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }
            try {
                recognition.start();
                isRecording = true;
                micToggle.classList.add('recording');
                micToggle.innerHTML = '🛑 Gravando...';
            } catch (e) {
                console.error(e);
            }
        }

        function stopRecording() {
            if (recognition && isRecording) {
                recognition.stop();
            }
            isRecording = false;
            micToggle.classList.remove('recording');
            micToggle.innerHTML = '🎤 Falar';
        }

        micToggle.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // Controles de Som
        const soundToggle = document.getElementById('sound-toggle');
        let soundOn = false;
        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊' : '🔇';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Diário - Ajuda JP</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5efe6; /* Marrom clarinho suave (tom pergaminho) */
            --line-color: #e3dcd2;
            --margin-color: #f28b82;
            --text-color: #2c2c2c;
            --primary-color: #556b2f; /* Cor Verde Principal */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 6px 10px;
            /* Linha vermelha jogada mais para a esquerda e recuo ajustado no container */
            background-image: 
                linear-gradient(90deg, transparent 14px, var(--margin-color) 14px, var(--margin-color) 16px, transparent 16px),
                linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 26px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-left: 12px; /* Espaço para afastar as letras da linha vermelha */
            display: flex;
            flex-direction: column;
            min-height: 94vh;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
        }

        .header-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .date-navigator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            font-family: 'Caveat', cursive;
            margin: 0;
            color: #1a1a1a;
            font-weight: 700;
            -webkit-text-stroke: 0.3px #1a1a1a;

html,

/* =========================================================
   CABEÇALHO

========================================================= */

.resumo-card.roxo {

}

.resumo-card.laranja {

.resumo-sub {

let tradutores =

/* =========================================================
   TIMESTAMP
========================================================= */

function timestampParaData(
    timestamp
) {

    if (!timestamp) {
        return null;
    }


    if (
        typeof timestamp.toDate ===
        "function"
    ) {

        return timestamp.toDate();

    }


    if (
        timestamp.seconds
    ) {

        return new Date(
            timestamp.seconds *
            1000
        );

    }


    return null;

}


/* =========================================================
   DURAÇÃO
========================================================= */

function calcularDuracaoSegundos(
    atendimento
) {

    const inicio =
        timestampParaData(
            atendimento.conectadoEm
        ) ||

        timestampParaData(
            atendimento.aceitoEm
        );


    const fim =
        timestampParaData(
            atendimento.finalizadoEm
        );


    if (
        !inicio ||
        !fim
    ) {

        return 0;

    }


    return Math.max(
        0,
        Math.floor(
            (
                fim.getTime() -
                inicio.getTime()
            ) /
            1000
        )
    );

}


/* =========================================================
   FORMATAR DURAÇÃO
========================================================= */

function formatarDuracao(
    segundos
) {

    if (!segundos) {
        return "0 min";
    }


    const horas =
        Math.floor(
            segundos /
            3600
        );


    const minutos =
        Math.floor(
            (
                segundos %
                3600
            ) /
            60
        );


    const resto =
        segundos %
        60;


    if (
        horas >
        0
    ) {

        if (
            minutos >
            0
        ) {

            return (
                horas +
                "h " +
                minutos +
                "m"
            );

        }


        return horas + "h";

    }


    if (
        minutos >
        0
    ) {

        if (
            resto >
            0
        ) {

            return (
                minutos +
                " min " +
                resto +
                " seg"
            );

        }


        return minutos +
            " min";

    }


    return resto +
        " seg";

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarData(
    data
) {

    if (!data) {
        return "-";
    }


    try {

        return new Intl.DateTimeFormat(
            "pt-BR",
            {
                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        ).format(
            data
        );

    }
    catch {

        return data.toLocaleString();

    }

}


/* =========================================================
   DATA DO ATENDIMENTO
========================================================= */

function obterDataAtendimento(
    atendimento
) {

    return (
        timestampParaData(
            atendimento.finalizadoEm
        ) ||

        timestampParaData(
            atendimento.conectadoEm
        ) ||

        timestampParaData(
            atendimento.aceitoEm
        ) ||

        timestampParaData(
            atendimento.criadoEm
        ) ||

        timestampParaData(
            atendimento.timestamp
        ) ||

        null
    );

}


/* =========================================================
   INÍCIO E FIM DO DIA
========================================================= */

function inicioDoDia(
    data
) {

    const resultado =
        new Date(
            data
        );


    resultado.setHours(
        0,
        0,
        0,
        0
    );


    return resultado;

}


function fimDoDia(
    data
) {

    const resultado =
        new Date(
            data
        );


    resultado.setHours(
        23,
        59,
        59,
        999
    );


    return resultado;

}


/* =========================================================
   INTERVALO DO PERÍODO
========================================================= */

function obterIntervaloPeriodo() {

    const valor =
        periodo.value;


    const agora =
        new Date();


    if (
        valor ===
        "todos"
    ) {

        return {

            inicio:
                null,

            fim:
                null,

            texto:
                "Todos"

        };

    }


    if (
        valor ===
        "hoje"
    ) {

        return {

            inicio:
                inicioDoDia(
                    agora
                ),

            fim:
                fimDoDia(
                    agora
                ),

            texto:
                "Hoje"

        };

    }


    if (
        valor ===
        "mes"
    ) {

        const escolhido =
            mesEscolhido.value;


        if (!escolhido) {
            return null;
        }


        const partes =
            escolhido.split(
                "-"
            );


        const ano =
            Number(
                partes[0]
            );


        const mes =
            Number(
                partes[1]
            );


        const inicio =
            new Date(
                ano,
                mes - 1,
                1,
                0,
                0,
                0,
                0
            );


        const fim =
            new Date(
                ano,
                mes,
                0,
                23,
                59,
                59,
                999
            );


        let texto =
            new Intl.DateTimeFormat(
                "pt-BR",
                {
                    month:
                        "long",

                    year:
                        "numeric"
                }
            ).format(
                inicio
            );


        texto =
            texto.charAt(
                0
            ).toUpperCase() +
            texto.slice(
                1
            );


        return {

            inicio,
            fim,
            texto

        };

    }


    let meses =
        1;


    let texto =
        "Último 1 mês";


    if (
        valor ===
        "3meses"
    ) {

        meses =
            3;

        texto =
            "Últimos 3 meses";

    }


    if (
        valor ===
        "6meses"
    ) {

        meses =
            6;

        texto =
            "Últimos 6 meses";

    }


    if (
        valor ===
        "1ano"
    ) {

        meses =
            12;

        texto =
            "Último 1 ano";

    }


    const inicio =
        new Date(
            agora
        );


    inicio.setMonth(
        inicio.getMonth() -
        meses
    );


    inicio.setHours(
        0,
        0,
        0,
        0
    );


    return {

        inicio,
        fim:
            agora,

        texto

    };

}


/* =========================================================
   VERIFICAR PERÍODO
========================================================= */

function atendimentoNoPeriodo(
    atendimento,
    intervalo
) {

    const data =
        obterDataAtendimento(
            atendimento
        );


    if (!data) {
        return false;
    }


    if (
        !intervalo.inicio &&
        !intervalo.fim
    ) {

        return true;

    }


    if (
        intervalo.inicio &&
        data <
        intervalo.inicio
    ) {

        return false;

    }


    if (
        intervalo.fim &&
        data >
        intervalo.fim
    ) {

        return false;

    }


    return true;

}


/* =========================================================
   CARREGAR FIREBASE
========================================================= */

async function carregar() {

    mensagem.style.display =
        "block";


    mensagem.classList.remove(
        "erro"
    );


    mensagem.textContent =
        "Carregando tradutores...";


    lista.innerHTML =
        "";


    try {

        const [
            snapshotTradutores,
            snapshotSolicitacoes
        ] =
        await Promise.all(
            [

                getDocs(
                    collection(
                        db,
                        "tradutor_usuarios"
                    )
                ),

                getDocs(
                    collection(
                        db,
                        "solicitacoes"
                    )
                )

            ]
        );


        tradutores =
            [];


        solicitacoes =
            [];


        snapshotTradutores.forEach(
            documento => {

                tradutores.push(
                    {

                        id:
                            documento.id,

                        ...documento.data()

                    }
                );

            }
        );


        snapshotSolicitacoes.forEach(
            documento => {

                solicitacoes.push(
                    {

                        id:
                            documento.id,

                        ...documento.data()

                    }
                );

            }
        );


        atualizarTudo();

    }
    catch (
        erro
    ) {

        console.error(
            erro
        );


        mensagem.classList.add(
            "erro"
        );


        mensagem.textContent =
            "Não foi possível carregar os tradutores.";

    }

}


/* =========================================================
   ATENDIMENTOS DO TRADUTOR
========================================================= */

function obterAtendimentosTradutor(
    tradutor,
    intervalo
) {

    return solicitacoes.filter(
        atendimento => {

            return (

                atendimento.tradutorId ===
                tradutor.id &&

                String(
                    atendimento.status ||
                    ""
                ).toLowerCase() ===
                "finalizado" &&

                atendimentoNoPeriodo(
                    atendimento,
                    intervalo
                )

            );

        }
    );

}


/* =========================================================
   ÚLTIMO ATENDIMENTO
========================================================= */

function obterUltimoAtendimento(
    atendimentos
) {

    if (
        atendimentos.length ===
        0
    ) {

        return null;

    }


    const ordenados =
        [
            ...atendimentos
        ];


    ordenados.sort(
        (a,b) => {

            const dataA =
                obterDataAtendimento(
                    a
                );


            const dataB =
                obterDataAtendimento(
                    b
                );


            return (
                (
                    dataB
                    ?
                    dataB.getTime()
                    :
                    0
                ) -

                (
                    dataA
                    ?
                    dataA.getTime()
                    :
                    0
                )
            );

        }
    );


    return ordenados[0];

}


/* =========================================================
   FILTRO DE TRADUTOR
========================================================= */

function obterTradutoresFiltrados() {

    const valor =
        filtroTradutor.value;


    if (
        valor ===
        "todos"
    ) {

        return tradutores;

    }


    if (
        valor ===
        "online"
    ) {

        return tradutores.filter(
            item =>
                item.online ===
                true
        );

    }


    if (
        valor ===
        "offline"
    ) {

        return tradutores.filter(
            item =>
                item.online !==
                true
        );

    }


    if (
        valor ===
        "ativos"
    ) {

        return tradutores.filter(
            item =>
                item.ativo ===
                true
        );

    }


    if (
        valor ===
        "inativos"
    ) {

        return tradutores.filter(
            item =>
                item.ativo !==
                true
        );

    }


    return tradutores;

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo(
    intervalo
) {

    totalTradutores.textContent =
        tradutores.length;


    const online =
        tradutores.filter(
            item =>
                item.online ===
                true
        ).length;


    totalOnline.textContent =
        online;


    const atendimentosPeriodo =
        solicitacoes.filter(
            atendimento => {

                return (

                    String(
                        atendimento.status ||
                        ""
                    ).toLowerCase() ===
                    "finalizado" &&

                    atendimentoNoPeriodo(
                        atendimento,
                        intervalo
                    )

                );

            }
        );


    totalAtendimentos.textContent =
        atendimentosPeriodo.length;


    let segundos =
        0;


    atendimentosPeriodo.forEach(
        atendimento => {

            segundos +=
                calcularDuracaoSegundos(
                    atendimento
                );

        }
    );


    tempoTotal.textContent =
        formatarDuracao(
            segundos
        );


    textoPeriodoAtendimentos.textContent =
        intervalo.texto;


    textoPeriodoTempo.textContent =
        intervalo.texto;

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar(
    intervalo
) {

    const dados =
        obterTradutoresFiltrados();


    lista.innerHTML =
        "";


    if (
        dados.length ===
        0
    ) {

        mensagem.style.display =
            "block";


        mensagem.textContent =
            "Nenhum tradutor encontrado.";


        return;

    }


    mensagem.style.display =
        "none";


    dados
        .sort(
            (a,b) => {

                return String(
                    a.nome ||
                    ""
                ).localeCompare(
                    String(
                        b.nome ||
                        ""
                    ),
                    "pt-BR"
                );

            }
        )
        .forEach(
            tradutor => {


                const atendimentos =
                    obterAtendimentosTradutor(
                        tradutor,
                        intervalo
                    );


                let segundosTotal =
                    0;


                atendimentos.forEach(
                    atendimento => {

                        segundosTotal +=
                            calcularDuracaoSegundos(
                                atendimento
                            );

                    }
                );


                const media =
                    atendimentos.length >
                    0

                        ?

                        Math.floor(
                            segundosTotal /
                            atendimentos.length
                        )

                        :

                        0;


                const ultimo =
                    obterUltimoAtendimento(
                        atendimentos
                    );


                let ultimoTexto =
                    "Nenhum atendimento no período";


                if (
                    ultimo
                ) {

                    ultimoTexto =
                        formatarData(
                            obterDataAtendimento(
                                ultimo
                            )
                        );

                }


                const nome =
                    tradutor.nome ||
                    "Tradutor";


                const email =
                    tradutor.email ||
                    "-";


                const online =
                    tradutor.online ===
                    true;


                const ativo =
                    tradutor.ativo ===
                    true;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "tradutor-card";


                card.innerHTML =
                    `

                    <div class="tradutor-topo">

                        <div class="tradutor-esquerda">

                            <div class="avatar">
                                🧑‍💼
                            </div>

                            <div style="min-width:0;">

                                <div class="tradutor-nome">
                                    ${escaparHTML(
                                        nome
                                    )}
                                </div>

                                <div class="tradutor-email">
                                    ${escaparHTML(
                                        email
                                    )}
                                </div>

                            </div>

                        </div>


                        <div class="badges">

                            <div
                                class="badge ${
                                    online
                                    ?
                                    "badge-online"
                                    :
                                    "badge-offline"
                                }"
                            >

                                ${
                                    online
                                    ?
                                    "● Online"
                                    :
                                    "● Offline"
                                }

                            </div>


                            <div
                                class="badge ${
                                    ativo
                                    ?
                                    "badge-ativo"
                                    :
                                    "badge-inativo"
                                }"
                            >

                                ${
                                    ativo
                                    ?
                                    "Ativo"
                                    :
                                    "Desativado"
                                }

                            </div>

                        </div>

                    </div>


                    <div class="stats">

                        <div class="stat">

                            <span class="stat-label">
                                ATENDIMENTOS
                            </span>

                            <span class="stat-valor">
                                ${atendimentos.length}
                            </span>

                        </div>


                        <div class="stat">

                            <span class="stat-label">
                                TEMPO TOTAL
                            </span>

                            <span class="stat-valor">
                                ${escaparHTML(
                                    formatarDuracao(
                                        segundosTotal
                                    )
                                )}
                            </span>

                        </div>


                        <div class="stat">

                            <span class="stat-label">
                                MÉDIA
                            </span>

                            <span class="stat-valor">
                                ${escaparHTML(
                                    formatarDuracao(
                                        media
                                    )
                                )}
                            </span>

                        </div>


                        <div class="stat">

                            <span class="stat-label">
                                PERÍODO
                            </span>

                            <span class="stat-valor">
                                ${escaparHTML(
                                    intervalo.texto
                                )}
                            </span>

                        </div>

                    </div>


                    <div class="ultimo">

                        <div class="ultimo-label">
                            ÚLTIMO ATENDIMENTO NO PERÍODO
                        </div>

                        <div class="ultimo-valor">
                            ${escaparHTML(
                                ultimoTexto
                            )}
                        </div>

                    </div>

                    `;


                lista.appendChild(
                    card
                );

            }
        );

}


/* =========================================================
   ATUALIZAR TUDO
========================================================= */

function atualizarTudo() {

    const intervalo =
        obterIntervaloPeriodo();


    if (
        !intervalo
    ) {

        mensagem.style.display =
            "block";


        mensagem.textContent =
            "Escolha o mês que deseja consultar.";


        lista.innerHTML =
            "";


        return;

    }


    atualizarResumo(
        intervalo
    );


    renderizar(
        intervalo
    );

}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escaparHTML(
    valor
) {

    return String(
        valor ??
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   EVENTOS
========================================================= */

periodo.addEventListener(
    "change",
    function() {

        blocoMes.style.display =
            periodo.value ===
            "mes"
                ?
                "block"
                :
                "none";


        atualizarTudo();

    }
);


mesEscolhido.addEventListener(
    "change",
    atualizarTudo
);


filtroTradutor.addEventListener(
    "change",
    atualizarTudo
);


btnAtualizar.addEventListener(
    "click",
    carregar
);


/* =========================================================
   MÊS PADRÃO
========================================================= */

const agora =
    new Date();


mesEscolhido.value =
    agora.getFullYear() +
    "-" +
    String(
        agora.getMonth() +
        1
    ).padStart(
        2,
        "0"
    );


/* =========================================================
   INICIAR
========================================================= */

carregar();

</script>

</body>

</html>

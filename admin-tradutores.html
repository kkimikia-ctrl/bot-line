<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="google" content="notranslate">

<title>Ajuda JP - Gestão de Tradutores</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #eef5ff 0%,
            #f8fafc 45%,
            #f1f5f9 100%
        );

    color: #1e293b;
}

button,
select {
    font-family: inherit;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.voltar {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;

    border: 0;
    border-radius: 14px;

    background: white;

    box-shadow:
        0 5px 18px rgba(
            15,
            23,
            42,
            .08
        );

    font-size: 22px;
    cursor: pointer;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 900;
}

.header p {
    margin: 4px 0 0;
    color: #64748b;
    font-size: 13px;
}


/* =========================================================
   RESUMO
========================================================= */

.resumo-grid {
    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap: 12px;
    margin-bottom: 18px;
}

.resumo-card {
    border-radius: 20px;
    padding: 17px;
    min-height: 125px;

    box-shadow:
        0 6px 22px rgba(
            15,
            23,
            42,
            .07
        );
}

.resumo-card.azul {
    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
        );
}

.resumo-card.verde {
    background:
        linear-gradient(
            135deg,
            #ecfdf5,
            #d1fae5
        );
}

.resumo-card.roxo {
    background:
        linear-gradient(
            135deg,
            #f5f3ff,
            #ede9fe
        );
}

.resumo-card.laranja {
    background:
        linear-gradient(
            135deg,
            #fff7ed,
            #ffedd5
        );
}

.resumo-label {
    font-size: 12px;
    color: #64748b;
    font-weight: 900;
}

.resumo-valor {
    display: block;
    margin-top: 8px;
    font-size: 30px;
    font-weight: 900;
}

.azul .resumo-valor {
    color: #2563eb;
}

.verde .resumo-valor {
    color: #059669;
}

.roxo .resumo-valor {
    color: #7c3aed;
}

.laranja .resumo-valor {
    color: #ea580c;
}


/* =========================================================
   FILTROS
========================================================= */

.filtros {
    background: white;
    border-radius: 19px;
    padding: 14px;
    margin-bottom: 18px;

    box-shadow:
        0 6px 22px rgba(
            15,
            23,
            42,
            .07
        );
}

.filtro-linha {
    display: flex;
    gap: 10px;
}

select {
    flex: 1;
    min-width: 0;

    border:
        1px solid #cbd5e1;

    border-radius: 12px;

    padding: 12px;

    background: white;

    color: #1e293b;

    font-size: 14px;
}

.btn-atualizar {
    border: 0;
    border-radius: 12px;

    padding:
        12px 16px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: white;

    font-size: 14px;
    font-weight: 900;

    cursor: pointer;
}


/* =========================================================
   LISTA
========================================================= */

.lista {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.tradutor-card {
    background: white;

    border:
        1px solid #e2e8f0;

    border-radius: 20px;

    padding: 16px;

    box-shadow:
        0 6px 22px rgba(
            15,
            23,
            42,
            .06
        );
}

.tradutor-topo {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
}

.tradutor-esquerda {
    display: flex;
    gap: 11px;
    align-items: center;
    min-width: 0;
}

.avatar {
    width: 48px;
    height: 48px;

    flex: 0 0 auto;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
}

.tradutor-nome {
    font-size: 16px;
    font-weight: 900;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tradutor-email {
    margin-top: 3px;

    color: #64748b;

    font-size: 11px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.badges {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
}

.badge {
    padding:
        6px 9px;

    border-radius:
        999px;

    font-size:
        10px;

    font-weight:
        900;

    white-space:
        nowrap;
}

.badge-online {
    background: #dcfce7;
    color: #166534;
}

.badge-offline {
    background: #f1f5f9;
    color: #64748b;
}

.badge-ativo {
    background: #dbeafe;
    color: #1d4ed8;
}

.badge-inativo {
    background: #fee2e2;
    color: #b91c1c;
}


/* =========================================================
   ESTATÍSTICAS DO TRADUTOR
========================================================= */

.stats {
    margin-top: 14px;

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap: 9px;
}

.stat {
    background: #f8fafc;

    border-radius: 13px;

    padding: 11px;
}

.stat-label {
    display: block;

    color: #94a3b8;

    font-size: 10px;

    font-weight: 900;
}

.stat-valor {
    display: block;

    margin-top: 4px;

    font-size: 14px;

    font-weight: 900;

    word-break: break-word;
}

.ultimo {
    margin-top: 10px;

    background: #f8fafc;

    border-radius: 13px;

    padding: 11px;
}

.ultimo-label {
    color: #94a3b8;
    font-size: 10px;
    font-weight: 900;
}

.ultimo-valor {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 800;
}


/* =========================================================
   MENSAGEM
========================================================= */

.mensagem {
    text-align: center;

    color: #64748b;

    padding:
        32px 15px;

    font-size: 14px;

    font-weight: 700;
}

.erro {
    color: #b91c1c;
}


/* =========================================================
   MOBILE
========================================================= */

@media (
    max-width: 480px
) {

    .app {
        padding: 14px;
    }

    .header h1 {
        font-size: 22px;
    }

    .resumo-valor {
        font-size: 27px;
    }

    .filtro-linha {
        align-items: stretch;
    }

}

</style>

</head>

<body>

<div class="app">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <div class="header">

        <button
            class="voltar"
            onclick="location.href='admin.html'"
        >
            ←
        </button>

        <div>

            <h1>
                Tradutores
            </h1>

            <p>
                Gestão da equipe · Ajuda JP
            </p>

        </div>

    </div>


    <!-- =====================================================
         RESUMO
    ====================================================== -->

    <div class="resumo-grid">

        <div class="resumo-card azul">

            <span class="resumo-label">
                Tradutores
            </span>

            <span
                class="resumo-valor"
                id="totalTradutores"
            >
                0
            </span>

        </div>


        <div class="resumo-card verde">

            <span class="resumo-label">
                Online agora
            </span>

            <span
                class="resumo-valor"
                id="totalOnline"
            >
                0
            </span>

        </div>


        <div class="resumo-card roxo">

            <span class="resumo-label">
                Ativos
            </span>

            <span
                class="resumo-valor"
                id="totalAtivos"
            >
                0
            </span>

        </div>


        <div class="resumo-card laranja">

            <span class="resumo-label">
                Atendimentos
            </span>

            <span
                class="resumo-valor"
                id="totalAtendimentos"
            >
                0
            </span>

        </div>

    </div>


    <!-- =====================================================
         FILTROS
    ====================================================== -->

    <div class="filtros">

        <div class="filtro-linha">

            <select id="filtro">

                <option value="todos">
                    Todos
                </option>

                <option value="online">
                    Online
                </option>

                <option value="offline">
                    Offline
                </option>

                <option value="ativos">
                    Ativos
                </option>

                <option value="inativos">
                    Desativados
                </option>

            </select>


            <button
                type="button"
                id="btnAtualizar"
                class="btn-atualizar"
            >
                Atualizar
            </button>

        </div>

    </div>


    <!-- =====================================================
         RESULTADOS
    ====================================================== -->

    <div
        id="mensagem"
        class="mensagem"
    >
        Carregando tradutores...
    </div>


    <div
        id="lista"
        class="lista"
    ></div>


</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",

    authDomain:
        "ajuda-jp.firebaseapp.com",

    projectId:
        "ajuda-jp",

    storageBucket:
        "ajuda-jp.firebasestorage.app",

    messagingSenderId:
        "40121072206",

    appId:
        "1:40121072206:web:8a844e632f004f61d0a11f"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


/* =========================================================
   ELEMENTOS
========================================================= */

const lista =
    document.getElementById(
        "lista"
    );


const mensagem =
    document.getElementById(
        "mensagem"
    );


const filtro =
    document.getElementById(
        "filtro"
    );


const btnAtualizar =
    document.getElementById(
        "btnAtualizar"
    );


const totalTradutores =
    document.getElementById(
        "totalTradutores"
    );


const totalOnline =
    document.getElementById(
        "totalOnline"
    );


const totalAtivos =
    document.getElementById(
        "totalAtivos"
    );


const totalAtendimentos =
    document.getElementById(
        "totalAtendimentos"
    );


let tradutores =
    [];


let solicitacoes =
    [];


/* =========================================================
   TIMESTAMP
========================================================= */

function timestampParaData(
    timestamp
) {

    if (!timestamp) {
        return null;
    }


    if (
        typeof timestamp.toDate ===
        "function"
    ) {

        return timestamp.toDate();

    }


    if (
        timestamp.seconds
    ) {

        return new Date(
            timestamp.seconds *
            1000
        );

    }


    return null;

}


/* =========================================================
   DURAÇÃO
========================================================= */

function calcularDuracaoSegundos(
    atendimento
) {

    const inicio =
        timestampParaData(
            atendimento.conectadoEm
        ) ||

        timestampParaData(
            atendimento.aceitoEm
        );


    const fim =
        timestampParaData(
            atendimento.finalizadoEm
        );


    if (
        !inicio ||
        !fim
    ) {

        return 0;

    }


    return Math.max(
        0,
        Math.floor(
            (
                fim.getTime() -
                inicio.getTime()
            ) / 1000
        )
    );

}


/* =========================================================
   FORMATAR DURAÇÃO
========================================================= */

function formatarDuracao(
    segundos
) {

    if (
        !segundos
    ) {

        return "0 min";

    }


    const horas =
        Math.floor(
            segundos / 3600
        );


    const minutos =
        Math.floor(
            (
                segundos %
                3600
            ) /
            60
        );


    const resto =
        segundos %
        60;


    if (
        horas >
        0
    ) {

        if (
            minutos >
            0
        ) {

            return (
                horas +
                "h " +
                minutos +
                "m"
            );

        }


        return (
            horas +
            "h"
        );

    }


    if (
        minutos >
        0
    ) {

        if (
            resto >
            0
        ) {

            return (
                minutos +
                " min " +
                resto +
                " seg"
            );

        }


        return (
            minutos +
            " min"
        );

    }


    return (
        resto +
        " seg"
    );

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarData(
    data
) {

    if (!data) {
        return "-";
    }


    try {

        return new Intl.DateTimeFormat(
            "pt-BR",
            {
                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        ).format(
            data
        );

    }
    catch {

        return data.toLocaleString();

    }

}


/* =========================================================
   CARREGAR
========================================================= */

async function carregar() {

    mensagem.style.display =
        "block";


    mensagem.classList.remove(
        "erro"
    );


    mensagem.textContent =
        "Carregando tradutores...";


    lista.innerHTML =
        "";


    try {

        const [
            snapshotTradutores,
            snapshotSolicitacoes
        ] =
        await Promise.all(
            [

                getDocs(
                    collection(
                        db,
                        "tradutor_usuarios"
                    )
                ),

                getDocs(
                    collection(
                        db,
                        "solicitacoes"
                    )
                )

            ]
        );


        tradutores =
            [];


        solicitacoes =
            [];


        snapshotTradutores.forEach(
            documento => {

                tradutores.push(
                    {
                        id:
                            documento.id,

                        ...documento.data()
                    }
                );

            }
        );


        snapshotSolicitacoes.forEach(
            documento => {

                solicitacoes.push(
                    {
                        id:
                            documento.id,

                        ...documento.data()
                    }
                );

            }
        );


        atualizarResumo();

        renderizar();

    }
    catch (
        erro
    ) {

        console.error(
            "Erro carregando tradutores:",
            erro
        );


        mensagem.classList.add(
            "erro"
        );


        mensagem.textContent =
            "Não foi possível carregar os tradutores.";

    }

}


/* =========================================================
   ATENDIMENTOS DO TRADUTOR
========================================================= */

function obterAtendimentosTradutor(
    tradutor
) {

    return solicitacoes.filter(
        atendimento => {

            return (
                atendimento.tradutorId ===
                tradutor.id &&

                String(
                    atendimento.status ||
                    ""
                ).toLowerCase() ===
                "finalizado"
            );

        }
    );

}


/* =========================================================
   ÚLTIMO ATENDIMENTO
========================================================= */

function obterUltimoAtendimento(
    atendimentos
) {

    if (
        atendimentos.length ===
        0
    ) {

        return null;

    }


    const ordenados =
        [
            ...atendimentos
        ];


    ordenados.sort(
        (a,b) => {

            const dataA =
                timestampParaData(
                    a.finalizadoEm
                ) ||
                timestampParaData(
                    a.aceitoEm
                );


            const dataB =
                timestampParaData(
                    b.finalizadoEm
                ) ||
                timestampParaData(
                    b.aceitoEm
                );


            return (
                (
                    dataB
                        ?
                        dataB.getTime()
                        :
                        0
                ) -

                (
                    dataA
                        ?
                        dataA.getTime()
                        :
                        0
                )
            );

        }
    );


    return ordenados[0];

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo() {

    totalTradutores.textContent =
        tradutores.length;


    const online =
        tradutores.filter(
            item =>
                item.online ===
                true
        ).length;


    const ativos =
        tradutores.filter(
            item =>
                item.ativo ===
                true
        ).length;


    const finalizados =
        solicitacoes.filter(
            item =>
                String(
                    item.status ||
                    ""
                ).toLowerCase() ===
                "finalizado"
        ).length;


    totalOnline.textContent =
        online;


    totalAtivos.textContent =
        ativos;


    totalAtendimentos.textContent =
        finalizados;

}


/* =========================================================
   FILTRO
========================================================= */

function obterTradutoresFiltrados() {

    const valor =
        filtro.value;


    if (
        valor ===
        "todos"
    ) {

        return tradutores;

    }


    if (
        valor ===
        "online"
    ) {

        return tradutores.filter(
            item =>
                item.online ===
                true
        );

    }


    if (
        valor ===
        "offline"
    ) {

        return tradutores.filter(
            item =>
                item.online !==
                true
        );

    }


    if (
        valor ===
        "ativos"
    ) {

        return tradutores.filter(
            item =>
                item.ativo ===
                true
        );

    }


    if (
        valor ===
        "inativos"
    ) {

        return tradutores.filter(
            item =>
                item.ativo !==
                true
        );

    }


    return tradutores;

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar() {

    const dados =
        obterTradutoresFiltrados();


    lista.innerHTML =
        "";


    if (
        dados.length ===
        0
    ) {

        mensagem.style.display =
            "block";


        mensagem.textContent =
            "Nenhum tradutor encontrado.";


        return;

    }


    mensagem.style.display =
        "none";


    dados
        .sort(
            (a,b) => {

                const nomeA =
                    String(
                        a.nome ||
                        ""
                    );


                const nomeB =
                    String(
                        b.nome ||
                        ""
                    );


                return nomeA.localeCompare(
                    nomeB,
                    "pt-BR"
                );

            }
        )
        .forEach(
            tradutor => {

                const atendimentos =
                    obterAtendimentosTradutor(
                        tradutor
                    );


                let segundosTotal =
                    0;


                atendimentos.forEach(
                    atendimento => {

                        segundosTotal +=
                            calcularDuracaoSegundos(
                                atendimento
                            );

                    }
                );


                const media =
                    atendimentos.length >
                    0
                        ?
                        Math.floor(
                            segundosTotal /
                            atendimentos.length
                        )
                        :
                        0;


                const ultimo =
                    obterUltimoAtendimento(
                        atendimentos
                    );


                let ultimoTexto =
                    "Nenhum atendimento finalizado";


                if (
                    ultimo
                ) {

                    const dataUltimo =
                        timestampParaData(
                            ultimo.finalizadoEm
                        ) ||

                        timestampParaData(
                            ultimo.aceitoEm
                        );


                    ultimoTexto =
                        formatarData(
                            dataUltimo
                        );

                }


                const nome =
                    tradutor.nome ||
                    "Tradutor";


                const email =
                    tradutor.email ||
                    "-";


                const online =
                    tradutor.online ===
                    true;


                const ativo =
                    tradutor.ativo ===
                    true;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "tradutor-card";


                card.innerHTML =
                    `

                    <div class="tradutor-topo">

                        <div class="tradutor-esquerda">

                            <div class="avatar">
                                🧑‍💼
                            </div>

                            <div style="min-width:0;">

                                <div class="tradutor-nome">
                                    ${escaparHTML(
                                        nome
                                    )}
                                </div>

                                <div class="tradutor-email">
                                    ${escaparHTML(
                                        email
                                    )}
                                </div>

                            </div>

                        </div>


                        <div class="badges">

                            <div
                                class="badge ${
                                    online
                                        ?
                                        "badge-online"
                                        :
                                        "badge-offline"
                                }"
                            >

                                ${
                                    online
                                        ?
                                        "● Online"
                                        :
                                        "● Offline"
                                }

                            </div>


                            <div
                                class="badge ${
                                    ativo
                                        ?
                                        "badge-ativo"
                                        :
                                        "badge-inativo"
                                }"
                            >

                                ${
                                    ativo
                                        ?
                                        "Ativo"
                                        :
                                        "Desativado"
                                }

                            </div>

                        </div>

                    </div>


                    <div class="stats">

                        <div class="stat">

                            <span class="stat-label">
                                ATENDIMENTOS
                            </span>

                            <span class="stat-valor">
                                ${atendimentos.length}
                            </span>

                        </div>


                        <div class="stat">

                            <span class="stat-label">
                                TEMPO TOTAL
                            </span>

                            <span class="stat-valor">
                                ${escaparHTML(
                                    formatarDuracao(
                                        segundosTotal
                                    )
                                )}
                            </span>

                        </div>


                        <div class="stat">

                            <span class="stat-label">
                                MÉDIA
                            </span>

                            <span class="stat-valor">
                                ${escaparHTML(
                                    formatarDuracao(
                                        media
                                    )
                                )}
                            </span>

                        </div>


                        <div class="stat">

                            <span class="stat-label">
                                ID
                            </span>

                            <span class="stat-valor">
                                ${escaparHTML(
                                    abreviarId(
                                        tradutor.id
                                    )
                                )}
                            </span>

                        </div>

                    </div>


                    <div class="ultimo">

                        <div class="ultimo-label">
                            ÚLTIMO ATENDIMENTO
                        </div>

                        <div class="ultimo-valor">
                            ${escaparHTML(
                                ultimoTexto
                            )}
                        </div>

                    </div>

                    `;


                lista.appendChild(
                    card
                );

            }
        );

}


/* =========================================================
   ABREVIAR ID
========================================================= */

function abreviarId(
    valor
) {

    if (!valor) {
        return "-";
    }


    const texto =
        String(
            valor
        );


    if (
        texto.length <=
        12
    ) {

        return texto;

    }


    return (
        texto.substring(
            0,
            8
        ) +
        "..."
    );

}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escaparHTML(
    valor
) {

    return String(
        valor ??
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   EVENTOS
========================================================= */

btnAtualizar.addEventListener(
    "click",
    carregar
);


filtro.addEventListener(
    "change",
    renderizar
);


/* =========================================================
   INÍCIO
========================================================= */

carregar();

</script>

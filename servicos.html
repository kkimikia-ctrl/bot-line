    <script>
        // Função para filtrar por região
        function filtrarRegiao(regiao) {
            document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.feed-banner-card').forEach(card => {
                if (regiao === 'todas' || card.getAttribute('data-regiao') === regiao) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Função infalível para o carrossel rodar sozinho
        const track = document.getElementById('carouselTrack');
        let direcao = 1; // 1 vai para frente, -1 volta para trás

        function rodarCarrosselAutomatico() {
            // Se chegou no final da direita, inverte e volta para a esquerda
            if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 5) {
                direcao = -1;
            } 
            // Se chegou no início da esquerda, volta a avançar para a direita
            else if (track.scrollLeft <= 0) {
                direcao = 1;
            }

            // Move o carrossel suavemente 120 pixels na direção atual
            track.scrollBy({ left: 120 * direcao, behavior: 'smooth' });
        }

        // Roda a cada 3 segundos (3000ms)
        setInterval(rodarCarrosselAutomatico, 3000);
    </script>

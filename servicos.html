<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços e Anúncios - Ajuda JP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO DO MINI APP -->
    <header class="app-header">
        <h1>Serviços e Anúncios</h1>
    </header>

    <!-- TOPO FIXO: CARROSSEL DE MINI BANNERS (SEM TÍTULO) -->
    <section class="carousel-container">
        <div class="carousel-track">
            <a href="#" target="_blank">
                <img src="mini-banner-1.jpg" alt="Destaque 1">
            </a>
            <a href="#" target="_blank">
                <img src="mini-banner-2.jpg" alt="Destaque 2">
            </a>
            <a href="#" target="_blank">
                <img src="mini-banner-3.jpg" alt="Destaque 3">
            </a>
        </div>
    </section>

    <!-- FILTRO POR REGIÕES DO JAPÃO -->
    <div class="region-filter">
        <button class="region-btn active" onclick="filtrarRegiao('todas')">Todas</button>
        <button class="region-btn" onclick="filtrarRegiao('toyohashi')">Toyohashi</button>
        <button class="region-btn" onclick="filtrarRegiao('hamamatsu')">Hamamatsu</button>
        <button class="region-btn" onclick="filtrarRegiao('nagoya')">Nagoya</button>
        <button class="region-btn" onclick="filtrarRegiao('tokyo')">Tokyo</button>
    </div>

    <!-- CENTRO: FEED VERTICAL DE BANNERS (ORDEM DE PUBLICAÇÃO) -->
    <section class="feed-container">
        <h2>Todos os Serviços</h2>

        <!-- Anúncio 1 (Mais recente / Primeiro da lista) -->
        <div class="feed-banner-card" data-regiao="toyohashi">
            <a href="#" target="_blank">
                <img src="banner-grande-1.jpg" alt="Anúncio Toyohashi">
            </a>
        </div>

        <!-- Anúncio 2 -->
        <div class="feed-banner-card" data-regiao="hamamatsu">
            <a href="#" target="_blank">
                <img src="banner-grande-2.jpg" alt="Anúncio Hamamatsu">
            </a>
        </div>

        <!-- Anúncio 3 -->
        <div class="feed-banner-card" data-regiao="nagoya">
            <a href="#" target="_blank">
                <img src="banner-grande-3.jpg" alt="Anúncio Nagoya">
            </a>
        </div>
    </section>

    <script>
        function filtrarRegiao(regiao) {
            document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.feed-banner-card').forEach(card => {
                if (regiao === 'todas' || card.getAttribute('data-regiao') === regiao) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>

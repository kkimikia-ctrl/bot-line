<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços e Anúncios - Ajuda JP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO DO MINI APP -->
    <header class="app-header">
        <h1>Serviços e Anúncios</h1>
    </header>

    <!-- TOPO FIXO: CARROSSEL DE MINI BANNERS -->
    <section class="carousel-container">
        <div class="carousel-track">
            <a href="#" target="_blank">
                <img src="mini-banner-1.jpg" alt="Destaque 1">
            </a>
            <a href="#" target="_blank">
                <img src="mini-banner-2.jpg" alt="Destaque 2">
            </a>
            <a href="#" target="_blank">
                <img src="mini-banner-3.jpg" alt="Destaque 3">
            </a>
        </div>
    </section>

    <!-- FILTRO POR REGIÕES DO JAPÃO -->
    <div class="region-filter">
        <button class="region-btn active" onclick="filtrarRegiao('todas')">Todas</button>
        <button class="region-btn" onclick="filtrarRegiao('tokai')">Tokai (Aichi/Shizuoka/Gifu)</button>
        <button class="region-btn" onclick="filtrarRegiao('kanto')">Kanto (Tokyo/Gunma...)</button>
        <button class="region-btn" onclick="filtrarRegiao('kansai')">Kansai (Osaka/Mie...)</button>
        <button class="region-btn" onclick="filtrarRegiao('hokkaido-tohoku')">Hokkaido / Tohoku</button>
        <button class="region-btn" onclick="filtrarRegiao('chugoku-shikoku')">Chugoku / Shikoku</button>
        <button class="region-btn" onclick="filtrarRegiao('kyushu-okinawa')">Kyushu / Okinawa</button>
    </div>

    <!-- CENTRO: FEED VERTICAL DE BANNERS (ORDEM DE PUBLICAÇÃO) -->
    <section class="feed-container">
        <h2>Todos os Serviços</h2>

        <!-- Anúncio 1: Tokai -->
        <div class="feed-banner-card" data-regiao="tokai">
            <a href="#" target="_blank">
                <img src="banner-grande-1.jpg" alt="Anúncio Tokai">
            </a>
        </div>

        <!-- Anúncio 2: Kanto -->
        <div class="feed-banner-card" data-regiao="kanto">
            <a href="#" target="_blank">
                <img src="banner-grande-2.jpg" alt="Anúncio Kanto">
            </a>
        </div>

        <!-- Anúncio 3: Kansai -->
        <div class="feed-banner-card" data-regiao="kansai">
            <a href="#" target="_blank">
                <img src="banner-grande-3.jpg" alt="Anúncio Kansai">
            </a>
        </div>

        <!-- Anúncio 4: Kyushu / Okinawa -->
        <div class="feed-banner-card" data-regiao="kyushu-okinawa">
            <a href="#" target="_blank">
                <img src="banner-grande-4.jpg" alt="Anúncio Kyushu">
            </a>
        </div>
    </section>

    <script>
        function filtrarRegiao(regiao) {
            document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.feed-banner-card').forEach(card => {
                if (regiao === 'todas' || card.getAttribute('data-regiao') === regiao) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>

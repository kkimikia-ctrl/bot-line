<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AjudaJP - Serviços e Anúncios</title>
    <!-- Vincula o arquivo style.css do seu repositório -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho com a sua logo real (logo.jpeg) nos dois cantos -->
    <header>
        <img src="logo.jpeg" alt="Logo Esquerda" class="header-logo" onerror="this.style.display='none'">
        <span>Serviços e Anúncios</span>
        <img src="logo.jpeg" alt="Logo Direita" class="header-logo" onerror="this.style.display='none'">
    </header>

    <div class="container">
        <!-- Carrossel Superior -->
        <div class="destaque-scroll">
            <div class="banner-destaque" onclick="abrirDetalhes('Destaque 1', 'Descrição completa do Destaque 1. Todos os dados estão na imagem.', '09012345678')">
                <img src="https://via.placeholder.com/120x80/0066cc/ffffff?text=Destaque+1" alt="Destaque 1">
            </div>
            <div class="banner-destaque" onclick="abrirDetalhes('Destaque 2', 'Descrição completa do Destaque 2. Todos os dados estão na imagem.', '09087654321')">
                <img src="https://via.placeholder.com/120x80/27ae60/ffffff?text=Destaque+2" alt="Destaque 2">
            </div>
            <div class="banner-destaque" onclick="abrirDetalhes('Destaque 3', 'Descrição completa do Destaque 3. Todos os dados estão na imagem.', '09033334444')">
                <img src="https://via.placeholder.com/120x80/f39c12/ffffff?text=Destaque+3" alt="Destaque 3">
            </div>
            <div class="banner-destaque" onclick="abrirDetalhes('Destaque 4', 'Descrição completa do Destaque 4. Todos os dados estão na imagem.', '09055556666')">
                <img src="https://via.placeholder.com/120x80/8e44ad/ffffff?text=Destaque+4" alt="Destaque 4">
            </div>
            <div class="banner-destaque" onclick="abrirDetalhes('Destaque 5', 'Descrição completa do Destaque 5. Todos os dados estão na imagem.', '08011112222')">
                <img src="https://via.placeholder.com/120x80/e74c3c/ffffff?text=Destaque+5" alt="Destaque 5">
            </div>
        </div>

        <!-- Filtros de Região -->
        <div class="regioes-scroll">
            <div class="tag-regiao active" onclick="filtrarRegiao(this)">Todas</div>
            <div class="tag-regiao" onclick="filtrarRegiao(this)">Tokai (Aichi/Shizuoka/Gifu)</div>
            <div class="tag-regiao" onclick="filtrarRegiao(this)">Kanto (Tokyo/Kanagawa/Saitama/Chiba)</div>
            <div class="tag-regiao" onclick="filtrarRegiao(this)">Kansai (Osaka/Kyoto/Hyogo)</div>
            <div class="tag-regiao" onclick="filtrarRegiao(this)">Kyushu (Fukuoka/Kumamoto/...)</div>
            <div class="tag-regiao" onclick="filtrarRegiao(this)">Chugoku / Shikoku</div>
            <div class="tag-regiao" onclick="filtrarRegiao(this)">Tohoku / Hokkaido</div>
        </div>

        <!-- Lista Principal -->
        <div class="lista-section">
            <div class="lista-title">Todos os Serviços</div>

            <div class="banner-normal" onclick="abrirDetalhes('Restaurante Sabor Brasil', 'Comida caseira todos os dias, marmitas e delivery. Confira os telefones e e-mail na arte da imagem.', '09012345678')">
                <img src="https://via.placeholder.com/400x180/2980b9/ffffff?text=Anuncio+Tokai" alt="Anúncio Tokai">
            </div>

            <div class="banner-normal" onclick="abrirDetalhes('Oficina Mecânica Gomes', 'Manutenção geral, freios e troca de óleo. Contatos disponíveis na foto do anúncio.', '08087654321')">
                <img src="https://via.placeholder.com/400x180/8e44ad/ffffff?text=Oficina+Mecanica" alt="Oficina Mecânica">
            </div>
        </div>
    </div>

    <!-- Tela Flutuante (Popup) -->
    <div id="modalDetalhes" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharDetalhes()">&times;</span>
            <div id="modalTitulo" class="modal-title">Título</div>
            <div id="modalTexto" class="modal-descricao">Descrição completa...</div>
            <a id="btnLigarModal" href="#" class="btn-ligar">📞 Ligar Agora</a>
        </div>
    </div>

    <script>
        function abrirDetalhes(titulo, descricao, telefone) {
            document.getElementById('modalTitulo').innerText = titulo;
            document.getElementById('modalTexto').innerText = descricao;
            document.getElementById('btnLigarModal').href = 'tel:' + telefone;
            document.getElementById('modalDetalhes').style.display = 'flex';
        }

        function fecharDetalhes() {
            document.getElementById('modalDetalhes').style.display = 'none';
        }

        function filtrarRegiao(elemento) {
            let tags = document.querySelectorAll('.tag-regiao');
            tags.forEach(t => t.classList.remove('active'));
            elemento.classList.add('active');
        }
    </script>

</body>
</html>

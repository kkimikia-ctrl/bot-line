<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - Ajuda JP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO DO MINI APP -->
    <header class="app-header">
        <h1>Serviços e Anúncios</h1>
    </header>

    <!-- TOPO: CARROSSEL DE MINI BANNERS (DESTAQUES) -->
    <section class="carousel-container">
        <h2>Destaques</h2>
        <div class="carousel-track">
            <a href="#" target="_blank">
                <img src="mini-banner-1.jpg" alt="Destaque 1">
            </a>
            <a href="#" target="_blank">
                <img src="mini-banner-2.jpg" alt="Destaque 2">
            </a>
            <a href="#" target="_blank">
                <img src="mini-banner-3.jpg" alt="Destaque 3">
            </a>
        </div>
    </section>

    <!-- CENTRO: FEED VERTICAL DE BANNERS -->
    <section class="feed-container">
        <h2>Todos os Serviços</h2>

        <div class="feed-banner-card">
            <a href="#" target="_blank">
                <img src="banner-grande-1.jpg" alt="Anúncio 1">
            </a>
        </div>

        <div class="feed-banner-card">
            <a href="#" target="_blank">
                <img src="banner-grande-2.jpg" alt="Anúncio 2">
            </a>
        </div>

        <div class="feed-banner-card">
            <a href="#" target="_blank">
                <img src="banner-grande-3.jpg" alt="Anúncio 3">
            </a>
        </div>
    </section>

</body>
</html>

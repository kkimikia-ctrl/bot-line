<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AjudaJP - Anúncios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            padding-bottom: 60px;
        }
        header {
            background-color: #0066cc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .container {
            padding: 15px;
        }
        /* Seção Destaque (Topo) */
        .destaque-section {
            margin-bottom: 20px;
        }
        .destaque-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .banner-destaque {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            background-color: #ddd;
        }
        .banner-destaque img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Seção Lista Principal (Banners Normais) */
        .lista-section {
            margin-top: 20px;
        }
        .lista-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .banner-normal {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            cursor: pointer;
            background-color: #ddd;
        }
        .banner-normal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Tela Flutuante (Popup) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #0066cc;
            margin-bottom: 10px;
        }
        .modal-descricao {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
        }

        /* Menu Inferior Fixo */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: white;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #666;
            text-decoration: none;
        }
        .nav-item.active {
            color: #0066cc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>AJUDAJP</header>

    <div class="container">
        <!-- Banner Destaque (Topo) -->
        <div class="destaque-section">
            <div class="destaque-title">Destaque da Semana</div>
            <div class="banner-destaque" onclick="abrirDetalhes('Auto Peças Tanaka', 'Trabalhamos com peças novas e usadas para todas as marcas. Entre em contato direto pelo telefone ou e-mail indicados na imagem!')">
                <!-- Coloque o link da arte do destaque abaixo -->
                <img src="https://via.placeholder.com/400x120/0066cc/ffffff?text=Auto+Pecas+Tanaka" alt="Destaque">
            </div>
        </div>

        <!-- Lista Principal (Banners Normais) -->
        <div class="lista-section">
            <div class="lista-title">Anúncios em Destaque</div>

            <!-- Banner 1 -->
            <div class="banner-normal" onclick="abrirDetalhes('Restaurante Sabor Brasil', 'Comida caseira todos os dias, marmitas e delivery. Faça seu pedido antecipado ligando no número que está na imagem do anúncio.')">
                <img src="https://via.placeholder.com/400x160/27ae60/ffffff?text=Restaurante+Sabor+Brasil" alt="Restaurante Sabor Brasil">
            </div>

            <!-- Banner 2 -->
            <div class="banner-normal" onclick="abrirDetalhes('Oficina Mecânica Gomes', 'Manutenção geral, troca de óleo, freios e revisão completa. Atendimento rápido e de confiança.')">
                <img src="https://via.placeholder.com/400x160/2980b9/ffffff?text=Oficina+Mecanica+Gomes" alt="Oficina Mecanica Gomes">
            </div>
        </div>
    </div>

    <!-- Tela Flutuante (Popup para Descrição) -->
    <div id="modalDetalhes" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharDetalhes()">&times;</span>
            <div id="modalTitulo" class="modal-title">Título</div>
            <div id="modalTexto" class="modal-descricao">Descrição completa do anunciante aparecerá aqui...</div>
        </div>
    </div>

    <!-- Menu Inferior -->
    <div class="nav-bar">
        <a href="#" class="nav-item active">🏠 Home</a>
        <a href="#" class="nav-item">📂 Categorias</a>
        <a href="#" class="nav-item">👤 Perfil</a>
        <a href="#" class="nav-item">📢 Anunciar</a>
    </div>

    <script>
        function abrirDetalhes(titulo, descricao) {
            document.getElementById('modalTitulo').innerText = titulo;
            document.getElementById('modalTexto').innerText = descricao;
            document.getElementById('modalDetalhes').style.display = 'flex';
        }

        function fecharDetalhes() {
            document.getElementById('modalDetalhes').style.display = 'none';
        }
    </script>

</body>
</html>

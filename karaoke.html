<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>Karaokê da Comunidade</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
        linear-gradient(
            180deg,
            #eef5ff 0%,
            #f8fafc 42%,
            #f1f5f9 100%
        );
    color:#1e293b;
    padding-top:154px;
}

button,
input{
    font-family:inherit;
}

/* =========================================================
   CABEÇALHO
========================================================= */

.app-header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:58px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 64px;

    background:
        linear-gradient(
            135deg,
            #0b5fc1,
            #2563eb
        );

    color:#fff;
    box-shadow:0 3px 12px rgba(15,23,42,.18);
}

.header-title{
    font-size:18px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.back-btn{
    position:absolute;
    left:12px;

    border:0;
    background:rgba(255,255,255,.14);
    color:white;

    width:40px;
    height:40px;
    border-radius:13px;

    font-size:21px;
    font-weight:900;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

/* =========================================================
   CARROSSEL
========================================================= */

.banner-carousel{
    position:fixed;
    top:58px;
    left:0;
    width:100%;
    height:96px;
    z-index:999;

    overflow:hidden;

    background:#e9eef5;
    border-bottom:1px solid #dbe4ef;
    box-shadow:0 3px 10px rgba(15,23,42,.08);

    display:flex;
    align-items:center;
}

.carousel-track{
    display:flex;
    align-items:center;
    gap:10px;

    width:max-content;
    padding:7px 10px;

    animation:rolarInfinito 38s linear infinite;
    will-change:transform;
}

.banner-carousel:active .carousel-track{
    animation-play-state:paused;
}

.ad-banner-card{
    flex:0 0 190px;
    width:190px;
    height:82px;

    border-radius:14px;
    overflow:hidden;

    position:relative;

    border:2px dashed #b8c5d2;
    background:white;

    box-shadow:0 3px 10px rgba(15,23,42,.08);
    cursor:pointer;
}

.ad-banner-card img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.ad-placeholder-text{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    text-align:center;
    color:#475569;
    font-size:12px;
    font-weight:900;
}

.ad-placeholder-text small{
    color:#94a3b8;
    font-size:10px;
    font-weight:700;
}

@keyframes rolarInfinito{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(var(--scroll-amount));
    }
}

/* =========================================================
   CONTEÚDO
========================================================= */

.app{
    width:100%;
    max-width:720px;
    margin:0 auto;
    padding:16px 14px 50px;
}

.hero{
    background:
        linear-gradient(
            135deg,
            #0f3f74,
            #0b5fc1
        );

    color:white;

    border-radius:22px;
    padding:20px;

    box-shadow:0 12px 30px rgba(37,99,235,.18);

    margin-bottom:14px;
}

.hero-small{
    font-size:11px;
    font-weight:900;
    opacity:.82;
    letter-spacing:.5px;
}

.hero h1{
    margin:4px 0 5px;
    font-size:24px;
}

.hero p{
    margin:0;
    font-size:13px;
    line-height:1.45;
    opacity:.9;
}

/* =========================================================
   BUSCA / FILTRO
========================================================= */

.toolbar{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:18px;
    padding:12px;

    box-shadow:0 7px 22px rgba(15,23,42,.05);

    margin-bottom:14px;
}

.search-wrap{
    position:relative;
}

.search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
    font-size:17px;
    pointer-events:none;
}

#buscaMusica{
    width:100%;
    height:46px;

    border:1px solid #cbd5e1;
    border-radius:14px;

    padding:0 14px 0 40px;

    background:#f8fafc;
    color:#1e293b;

    font-size:15px;
    outline:none;
}

#buscaMusica:focus{
    border-color:#2563eb;
    background:white;
}

.filtros{
    display:flex;
    gap:8px;

    margin-top:10px;
    overflow-x:auto;

    padding-bottom:2px;

    -webkit-overflow-scrolling:touch;
}

.filtros::-webkit-scrollbar{
    display:none;
}

.filtro-btn{
    flex:0 0 auto;

    border:0;
    border-radius:999px;

    background:#eef2f7;
    color:#475569;

    padding:8px 12px;

    font-size:11px;
    font-weight:900;

    cursor:pointer;
}

.filtro-btn.ativo{
    background:#2563eb;
    color:white;
}

/* =========================================================
   LISTA DE MÚSICAS
========================================================= */

.lista-topo{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:4px 2px 10px;
}

.lista-topo strong{
    font-size:16px;
}

#contadorMusicas{
    font-size:11px;
    color:#94a3b8;
    font-weight:800;
}

#container-musicas{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.music-card{
    background:white;

    border:1px solid #e2e8f0;
    border-radius:18px;

    box-shadow:0 7px 22px rgba(15,23,42,.055);

    overflow:hidden;
}

.music-main{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;
    padding:14px;
}

.music-left{
    min-width:0;
    flex:1;
}

.music-category{
    display:inline-block;

    margin-bottom:5px;

    padding:4px 8px;
    border-radius:7px;

    background:#eef2f7;
    color:#64748b;

    font-size:10px;
    font-weight:800;
}

.music-title{
    margin:0;

    color:#0f3f74;

    font-size:15px;
    line-height:1.28;

    font-weight:900;

    overflow-wrap:anywhere;
}

.sing-btn{
    flex:0 0 auto;

    min-width:105px;
    height:44px;

    border:0;
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #ff3b30,
            #ef4444
        );

    color:white;

    font-size:13px;
    font-weight:900;

    box-shadow:0 5px 14px rgba(239,68,68,.22);

    cursor:pointer;
}

.sing-btn:active{
    transform:scale(.98);
}

.sing-btn.tocando{
    background:
        linear-gradient(
            135deg,
            #059669,
            #10b981
        );

    box-shadow:0 5px 14px rgba(16,185,129,.22);
}

.player-area{
    display:none;
    padding:0 14px 14px;
}

.player-area.aberto{
    display:block;
}

.player-box{
    position:relative;

    width:100%;
    aspect-ratio:16/9;

    overflow:hidden;
    border-radius:14px;

    background:#000;
}

.player-box iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

.player-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:8px;
}

.close-player{
    border:0;
    background:#f1f5f9;
    color:#475569;

    border-radius:10px;

    padding:8px 11px;

    font-size:11px;
    font-weight:900;

    cursor:pointer;
}

.vazio{
    background:white;
    border:1px solid #e2e8f0;

    border-radius:18px;
    padding:26px 18px;

    text-align:center;

    box-shadow:0 7px 22px rgba(15,23,42,.05);
}

.vazio-icon{
    font-size:38px;
}

.vazio strong{
    display:block;
    margin-top:7px;
    font-size:15px;
}

.vazio span{
    display:block;
    margin-top:5px;
    font-size:12px;
    color:#64748b;
}

/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:390px){
    .header-title{
        font-size:16px;
    }

    .music-main{
        gap:8px;
        padding:12px;
    }

    .music-title{
        font-size:14px;
    }

    .sing-btn{
        min-width:92px;
        height:42px;
        padding:0 10px;
        font-size:12px;
    }
}

@media(prefers-reduced-motion:reduce){
    .carousel-track{
        animation:none;
    }
}
</style>
</head>

<body>

<header class="app-header">
    <button
        type="button"
        class="back-btn"
        onclick="location.href='entretenimento.html'"
        aria-label="Voltar"
    >
        ←
    </button>

    <div class="header-title">
        Karaokê da Comunidade
    </div>
</header>

<div class="banner-carousel">
    <div
        class="carousel-track"
        id="carouselTrack"
    >

        <div
            class="ad-banner-card"
            onclick="registrarCliqueBanner('banner-karaoke-1','fale-conosco.html')"
        >
            <div class="ad-placeholder-text">
                <span>🖼️ Anuncie Aqui</span>
                <small>Banner 1</small>
            </div>
        </div>

        <div
            class="ad-banner-card"
            onclick="registrarCliqueBanner('banner-karaoke-2','fale-conosco.html')"
        >
            <div class="ad-placeholder-text">
                <span>🖼️ Anuncie Aqui</span>
                <small>Banner 2</small>
            </div>
        </div>

        <div
            class="ad-banner-card"
            onclick="registrarCliqueBanner('banner-karaoke-3','fale-conosco.html')"
        >
            <div class="ad-placeholder-text">
                <span>🖼️ Anuncie Aqui</span>
                <small>Banner 3</small>
            </div>
        </div>

        <div
            class="ad-banner-card"
            onclick="registrarCliqueBanner('banner-karaoke-4','fale-conosco.html')"
        >
            <div class="ad-placeholder-text">
                <span>🖼️ Anuncie Aqui</span>
                <small>Banner 4</small>
            </div>
        </div>

    </div>
</div>

<main class="app">

    <section class="hero">
        <div class="hero-small">
            🎤 AJUDA JP
        </div>

        <h1>
            Karaokê
        </h1>

        <p>
            Escolha uma música, aperte em Cantar e divirta-se.
        </p>

    <section class="toolbar">

            >

            id="filtrosCategorias"
            class="filtros"
        ></div>

    </section>

    <div class="lista-topo">

        </strong>

        <span id="contadorMusicas">

    <div id="container-musicas"></div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="karaoke-musicas.js"></script>

<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfigKaraoke = {
    apiKey:
        "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",

    authDomain:
        "ajuda-jp.firebaseapp.com",

    projectId:
        "ajuda-jp",

    storageBucket:
        "ajuda-jp.firebasestorage.app",

    messagingSenderId:
        "40121072206",

    appId:
        "1:40121072206:web:23168abd254affb6d0a11f"
};

let dbKaraoke = null;

try{

    if(
        window.firebase &&
        firebase.apps.length === 0
    ){
        firebase.initializeApp(
            firebaseConfigKaraoke
        );
    }

    if(window.firebase){
        dbKaraoke =
            firebase.firestore();
    }

}catch(erro){
    console.warn(
        "Firebase do karaokê não iniciou:",
        erro
    );
}

/* =========================================================
   CARROSSEL
========================================================= */

function configurarCarrosselInfinito(){

    const track =
        document.getElementById(
            "carouselTrack"
        );

    if(
        !track ||
        track.dataset.initialized ===
        "true"
    ){
        return;
    }

    const items =
        Array.from(
            track.children
        );

    items.forEach(item=>{

        const clone =
            item.cloneNode(true);

        clone.setAttribute(
            "aria-hidden",
            "true"
        );

        track.appendChild(
            clone
        );

    });

    requestAnimationFrame(()=>{

        const larguraOriginal =
            track.scrollWidth / 2;

        track.style.setProperty(
            "--scroll-amount",
            `-${larguraOriginal}px`
        );

        track.dataset.initialized =
            "true";

    });
}

window.addEventListener(
    "load",
    configurarCarrosselInfinito
);

/* =========================================================
   CLIQUE EM BANNER
========================================================= */

async function registrarCliqueBanner(
    bannerId,
    urlDestino
){

    try{

        if(dbKaraoke){

            await dbKaraoke
                .collection("banners")
                .doc(bannerId)
                .set(
                    {
                        cliques:
                            firebase.firestore
                                .FieldValue
                                .increment(1),

                        ultimoCliqueEm:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );

        }

    }catch(erro){

        console.warn(
            "Não foi possível registrar clique:",
            erro
        );

    }finally{

        window.location.href =
            urlDestino;

    }
}

/* =========================================================
   AUXILIARES
========================================================= */

function escaparHTML(valor){

    return String(
        valor ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}

function extrairYoutubeId(link){

    const url =
        String(link || "");

    try{

        const parsed =
            new URL(url);

        if(
            parsed.hostname.includes(
                "youtu.be"
            )
        ){
            return parsed.pathname
                .replace("/","")
                .split("/")[0];
        }

        if(
            parsed.hostname.includes(
                "youtube.com"
            )
        ){

            if(
                parsed.pathname ===
                "/watch"
            ){
                return parsed
                    .searchParams
                    .get("v");
            }

            if(
                parsed.pathname.startsWith(
                    "/embed/"
                )
            ){
                return parsed.pathname
                    .split("/embed/")[1]
                    .split("/")[0];
            }

        }

    }catch{}

    return "";
}

function normalizarTexto(valor){

    return String(
        valor || ""
    )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase();
}

/* =========================================================
   MÚSICAS
========================================================= */

const wrapper =
    document.getElementById(
        "container-musicas"
    );

const buscaMusica =
    document.getElementById(
        "buscaMusica"
    );

const filtrosCategorias =
    document.getElementById(
        "filtrosCategorias"
    );

const contadorMusicas =
    document.getElementById(
        "contadorMusicas"
    );

const musicas =
    Array.isArray(
        window.listaKaraoke
    )
        ? window.listaKaraoke
        : (
            typeof listaKaraoke !==
            "undefined"
                ? listaKaraoke
                : []
        );

let categoriaAtual =
    "Todas";

let playerAbertoId =
    null;

/* =========================================================
   CATEGORIAS
========================================================= */

function montarFiltros(){

    const categorias =
        [
            "Todas",
            ...new Set(
                musicas
                    .map(
                        item=>
                            String(
                                item.categoria ||
                                "Outros"
                            )
                    )
                    .filter(Boolean)
            )
        ];

    filtrosCategorias.innerHTML =
        "";

    categorias.forEach(
        categoria=>{

            const botao =
                document.createElement(
                    "button"
                );

            botao.type =
                "button";

            botao.className =
                "filtro-btn" +
                (
                    categoria ===
                    categoriaAtual
                        ? " ativo"
                        : ""
                );

            botao.textContent =
                categoria;

            botao.addEventListener(
                "click",
                ()=>{

                    categoriaAtual =
                        categoria;

                    montarFiltros();
                    renderizarMusicas();

                }
            );

            filtrosCategorias
                .appendChild(
                    botao
                );

        }
    );
}

/* =========================================================
   RENDER
========================================================= */

function renderizarMusicas(){

    const termo =
        normalizarTexto(
            buscaMusica.value
        );

    const filtradas =
        musicas.filter(
            item=>{

                const categoria =
                    String(
                        item.categoria ||
                        "Outros"
                    );

                const bateCategoria =
                    categoriaAtual ===
                    "Todas" ||
                    categoria ===
                    categoriaAtual;

                const textoBusca =
                    normalizarTexto(
                        (
                            item.titulo ||
                            ""
                        ) +
                        " " +
                        categoria
                    );

                const bateBusca =
                    !termo ||
                    textoBusca.includes(
                        termo
                    );

                return (
                    bateCategoria &&
                    bateBusca
                );

            }
        );

    contadorMusicas.textContent =
        filtradas.length +
        (
            filtradas.length === 1
                ? " música"
                : " músicas"
        );

    wrapper.innerHTML =
        "";

    if(
        filtradas.length === 0
    ){

        wrapper.innerHTML =
            `
            <div class="vazio">
                <div class="vazio-icon">
                    🎵
                </div>

                <strong>
                    Nenhuma música encontrada
                </strong>

                <span>
                    Tente outro nome ou categoria.
                </span>
            </div>
            `;

        return;
    }

    filtradas.forEach(
        (item,index)=>{

            const videoId =
                extrairYoutubeId(
                    item.link
                );

            const embedUrl =
                videoId
                    ? `https://www.youtube.com/embed/${videoId}`
                    : String(
                        item.link ||
                        ""
                    );

            const categoria =
                escaparHTML(
                    item.categoria ||
                    "Outros"
                );

            const titulo =
                escaparHTML(
                    item.titulo ||
                    "Sem título"
                );

            const playerId =
                "player-" +
                index +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2,8);

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "music-card";

            card.innerHTML =
                `
                <div class="music-main">

                    <div class="music-left">

                        <span class="music-category">
                            ${categoria}
                        </span>

                        <h3 class="music-title">
                            ${titulo}
                        </h3>

                    </div>

                    <button
                        type="button"
                        class="sing-btn"
                    >
                        🎤 Cantar
                    </button>

                </div>

                <div
                    id="${playerId}"
                    class="player-area"
                >
                    <div class="player-box"></div>

                    <div class="player-actions">

                        <button
                            type="button"
                            class="close-player"
                        >
                            ✕ Fechar
                        </button>

                    </div>
                </div>
                `;

            const btnCantar =
                card.querySelector(
                    ".sing-btn"
                );

            const areaPlayer =
                card.querySelector(
                    ".player-area"
                );

            const playerBox =
                card.querySelector(
                    ".player-box"
                );

            const btnFechar =
                card.querySelector(
                    ".close-player"
                );

            btnCantar.addEventListener(
                "click",
                ()=>{

                    fecharTodosPlayers();

                    if(!embedUrl){

                        alert(
                            "Esta música ainda não possui vídeo."
                        );

                        return;
                    }

                    areaPlayer.classList.add(
                        "aberto"
                    );

                    btnCantar.classList.add(
                        "tocando"
                    );

                    btnCantar.textContent =
                        "▶ Tocando";

                    playerBox.innerHTML =
                        `
                        <iframe
                            src="${escaparHTML(embedUrl)}?autoplay=1&playsinline=1&rel=0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen
                            referrerpolicy="strict-origin-when-cross-origin"
                        ></iframe>
                        `;

                    playerAbertoId =
                        playerId;

                    setTimeout(
                        ()=>{
                            areaPlayer.scrollIntoView({
                                behavior:"smooth",
                                block:"center"
                            });
                        },
                        120
                    );

                }
            );

            btnFechar.addEventListener(
                "click",
                fecharTodosPlayers
            );

            wrapper.appendChild(
                card
            );

        }
    );
}

function fecharTodosPlayers(){

    document
        .querySelectorAll(
            ".player-area"
        )
        .forEach(
            area=>{

                area.classList.remove(
                    "aberto"
                );

                const box =
                    area.querySelector(
                        ".player-box"
                    );

                if(box){
                    box.innerHTML =
                        "";
                }

            }
        );

    document
        .querySelectorAll(
            ".sing-btn"
        )
        .forEach(
            botao=>{

                botao.classList.remove(
                    "tocando"
                );

                botao.textContent =
                    "🎤 Cantar";

            }
        );

    playerAbertoId =
        null;
}

buscaMusica.addEventListener(
    "input",
    renderizarMusicas
);

montarFiltros();
renderizarMusicas();

</script>

</body>
</html>

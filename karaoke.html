<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaokê da Comunidade</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
            padding: 20px;
            padding-top: 70px;
        }
        .app-header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn {
            position: absolute;
            left: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .music-card {
            background: white;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .music-info {
            margin-bottom: 12px;
        }
        .music-info h3 {
            margin: 5px 0 0 0;
            font-size: 16px;
            color: #003366;
        }
        .music-info span {
            font-size: 11px;
            color: #fff;
            background: #007bff;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .sing-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #ff3b30;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }
        .sing-btn:hover {
            background-color: #d32f2f;
        }
        /* Estilo da área onde o vídeo vai tocar dentro da página */
        .player-container {
            margin-top: 15px;
            display: none;
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Proporção 16:9 */
            height: 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <button class="back-btn" onclick="location.href='entretenimento.html'">⬅ Voltar</button>
        Karaokê da Comunidade
    </div>

    <!-- Container das músicas -->
    <div id="container-musicas"></div>

    <script src="karaoke-musicas.js"></script>
    <script>
        const wrapper = document.getElementById('container-musicas');

        if (typeof listaKaraoke !== 'undefined') {
            listaKaraoke.forEach((item, index) => {
                // Transforma o link normal do YouTube em link embutido (embed)
                let videoId = "";
                if (item.link.includes("youtu.be/")) {
                    videoId = item.link.split("youtu.be/")[1].split("?")[0];
                } else if (item.link.includes("watch?v=")) {
                    videoId = item.link.split("watch?v=")[1].split("&")[0];
                }

                const embedUrl = videoId ? `https://www.youtube.com/embed/${videoId}` : item.link;

                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <div class="music-info">
                        <span>${item.categoria}</span>
                        <h3>${item.titulo}</h3>
                    </div>
                    <button class="sing-btn" onclick="tocarVideo('${embedUrl}', 'player-${index}')">🎤 Cantar esta música</button>
                    <div id="player-${index}" class="player-container"></div>
                `;
                wrapper.appendChild(card);
            });
        } else {
            wrapper.innerHTML = '<p style="text-align:center; color:#666; margin-top:50px;">Nenhuma música encontrada no seu arquivo karaoke-musicas.js.</p>';
        }

        function tocarVideo(url, playerId) {
            // Fecha todos os outros players abertos antes de abrir o novo
            document.querySelectorAll('.player-container').forEach(container => {
                container.style.display = 'none';
                container.innerHTML = '';
            });

            // Abre o player da música clicada
            const containerAtual = document.getElementById(playerId);
            containerAtual.style.display = 'block';
            containerAtual.innerHTML = `<iframe src="${url}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaokê da Comunidade</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
            padding: 20px;
            padding-top: 70px; /* Espaço para o header */
        }
        .app-header {
            background-color: #0056b3;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn {
            position: absolute;
            left: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Ajuste do card para dar destaque ao retângulo */
        .music-card {
            background: white;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .music-info {
            margin-bottom: 12px;
        }
        .music-info h3 {
            margin: 5px 0 0 0;
            font-size: 16px;
            color: #003366;
        }
        .music-info span {
            font-size: 11px;
            color: #fff;
            background: #007bff;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        /* Botão Cantar em formato de retângulo */
        .sing-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #ff3b30;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }
        .sing-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <button class="back-btn" onclick="location.href='entretenimento.html'">⬅ Voltar</button>
        Karaokê da Comunidade
    </div>

    <!-- Container das músicas -->
    <div id="container-musicas"></div>

    <script src="karaoke-musicas.js"></script>
    <script>
        const wrapper = document.getElementById('container-musicas');

        if (typeof listaKaraoke !== 'undefined') {
            listaKaraoke.forEach(item => {
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <div class="music-info">
                        <span>${item.categoria}</span>
                        <h3>${item.titulo}</h3>
                    </div>
                    <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="sing-btn">🎤 Cantar esta música</a>
                `;
                wrapper.appendChild(card);
            });
        } else {
            wrapper.innerHTML = '<p style="text-align:center; color:#666; margin-top:50px;">Nenhuma música encontrada no seu arquivo karaoke-musicas.js.</p>';
        }
    </script>

</body>
</html>

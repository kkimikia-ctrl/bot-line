<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>Karaokê da Comunidade</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
        radial-gradient(circle at top left, rgba(236,72,153,.10), transparent 34%),
        radial-gradient(circle at top right, rgba(99,102,241,.12), transparent 32%),
        linear-gradient(180deg,#fff7fb 0%,#f7f8ff 34%,#f8fafc 100%);
    color:#1e293b;
    padding-top:156px;
}

button,input{
    font-family:inherit;
}

/* =========================================================
   CABEÇALHO
========================================================= */

.app-header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 65px;

    background:
        linear-gradient(
            135deg,
            #7c3aed 0%,
            #ec4899 48%,
            #f97316 100%
        );

    color:#fff;

    box-shadow:
        0 8px 28px rgba(124,58,237,.25);
}

.app-header::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.20),transparent 18%),
        radial-gradient(circle at 80% 35%,rgba(255,255,255,.14),transparent 20%);
    pointer-events:none;
}

.header-title{
    position:relative;
    z-index:2;
    font-size:18px;
    font-weight:950;
    letter-spacing:.1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.back-btn{
    position:absolute;
    left:12px;
    z-index:3;

    width:40px;
    height:40px;
    border:0;
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.18);
    color:#fff;

    font-size:20px;
    font-weight:900;
    cursor:pointer;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

/* =========================================================
   CARROSSEL
========================================================= */

.banner-carousel{
    position:fixed;
    top:60px;
    left:0;
    width:100%;
    height:96px;
    z-index:999;

    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            #fff1f8 0%,
            #f4f0ff 50%,
            #fff6ed 100%
        );

    border-bottom:1px solid #eadcf2;

    box-shadow:
        0 4px 18px rgba(15,23,42,.08);

    display:flex;
    align-items:center;
}

.carousel-track{
    display:flex;
    align-items:center;
    gap:10px;

    width:max-content;
    padding:7px 10px;

    animation:rolarInfinito 38s linear infinite;
    will-change:transform;
}

.banner-carousel:active .carousel-track{
    animation-play-state:paused;
}

.ad-banner-card{
    flex:0 0 190px;
    width:190px;
    height:82px;

    border-radius:16px;
    overflow:hidden;

    position:relative;

    border:1px solid rgba(124,58,237,.18);

    background:
        linear-gradient(
            135deg,
            #fff 0%,
            #f8f5ff 55%,
            #fff1f2 100%
        );

    box-shadow:
        0 6px 18px rgba(15,23,42,.08);

    cursor:pointer;
}

.ad-banner-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at top right,rgba(236,72,153,.15),transparent 34%),
        radial-gradient(circle at bottom left,rgba(99,102,241,.12),transparent 36%);
}

.ad-banner-card img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:2;
}

.ad-placeholder-text{
    position:relative;
    z-index:1;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    text-align:center;

    color:#5b21b6;

    font-size:12px;
    font-weight:950;
}

.ad-placeholder-text small{
    color:#9f67d6;
    font-size:10px;
    font-weight:800;
}

@keyframes rolarInfinito{
    from{transform:translateX(0)}
    to{transform:translateX(var(--scroll-amount))}
}

/* =========================================================
   CONTEÚDO
========================================================= */

.app{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:16px 14px 50px;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;
    overflow:hidden;

    border-radius:26px;
    padding:22px;

    background:
        linear-gradient(
            135deg,
            #4c1d95 0%,
            #7c3aed 36%,
            #db2777 72%,
            #f97316 100%
        );

    color:white;

    box-shadow:
        0 16px 40px rgba(124,58,237,.24);

    margin-bottom:14px;
}

.hero::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-60px;
    top:-75px;

    border-radius:50%;
    background:rgba(255,255,255,.10);
}

.hero::after{
    content:"🎤";
    position:absolute;
    right:20px;
    bottom:8px;
    font-size:64px;
    opacity:.16;
    transform:rotate(-8deg);
}

.hero-small{
    position:relative;
    z-index:2;

    display:inline-flex;
    align-items:center;
    gap:6px;

    padding:5px 9px;
    border-radius:999px;

    background:rgba(255,255,255,.14);

    font-size:10px;
    font-weight:950;
    letter-spacing:.45px;
}

.hero h1{
    position:relative;
    z-index:2;

    margin:8px 0 5px;

    font-size:29px;
    line-height:1.1;
}

.hero p{
    position:relative;
    z-index:2;

    margin:0;
    max-width:480px;

    font-size:13px;
    line-height:1.45;
    opacity:.94;
}

.hero-stats{
    position:relative;
    z-index:2;

    display:flex;
    gap:8px;
    flex-wrap:wrap;

    margin-top:14px;
}

.hero-chip{
    padding:7px 10px;
    border-radius:999px;

    background:rgba(255,255,255,.15);

    font-size:10px;
    font-weight:900;
}

/* =========================================================
   BUSCA / FILTROS
========================================================= */

.toolbar{
    background:rgba(255,255,255,.94);

    border:1px solid rgba(226,232,240,.95);
    border-radius:20px;

    padding:12px;

    box-shadow:
        0 8px 26px rgba(15,23,42,.06);

    margin-bottom:14px;

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.search-wrap{
    position:relative;
}

.search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);

    font-size:17px;
    pointer-events:none;
}

#buscaMusica{
    width:100%;
    height:48px;

    border:1px solid #ddd6fe;
    border-radius:15px;

    padding:0 14px 0 42px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #faf7ff 100%
        );

    color:#1e293b;
    font-size:15px;
    outline:none;

    transition:.18s ease;
}

#buscaMusica:focus{
    border-color:#a855f7;
    box-shadow:0 0 0 4px rgba(168,85,247,.10);
}

.filtros{
    display:flex;
    gap:8px;

    margin-top:10px;
    overflow-x:auto;

    padding-bottom:2px;

    -webkit-overflow-scrolling:touch;
}

.filtros::-webkit-scrollbar{
    display:none;
}

.filtro-btn{
    flex:0 0 auto;

    border:0;
    border-radius:999px;

    background:#f1f5f9;
    color:#475569;

    padding:8px 12px;

    font-size:11px;
    font-weight:950;

    cursor:pointer;

    transition:.16s ease;
}

.filtro-btn.ativo{
    color:white;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #ec4899
        );

    box-shadow:
        0 5px 14px rgba(124,58,237,.20);
}

/* =========================================================
   TÍTULO DA LISTA
========================================================= */

.lista-topo{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:5px 2px 10px;
}

.lista-topo strong{
    font-size:16px;
}

#contadorMusicas{
    padding:5px 8px;
    border-radius:999px;

    background:#fff;
    color:#7c3aed;

    font-size:10px;
    font-weight:950;

    border:1px solid #ede9fe;
}

/* =========================================================
   CARDS
========================================================= */

#container-musicas{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.music-card{
    --cat1:#7c3aed;
    --cat2:#a855f7;
    --catSoft:#f5f3ff;

    position:relative;
    overflow:hidden;

    background:white;

    border:1px solid #e2e8f0;
    border-left:5px solid var(--cat1);

    border-radius:20px;

    box-shadow:
        0 8px 24px rgba(15,23,42,.06);
}

.music-card::after{
    content:"";
    position:absolute;
    right:-44px;
    top:-44px;

    width:120px;
    height:120px;

    border-radius:50%;
    background:var(--catSoft);

    opacity:.65;
    pointer-events:none;
}

.music-main{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;
    padding:14px;
}

.music-left{
    min-width:0;
    flex:1;
}

.music-category{
    display:inline-flex;
    align-items:center;
    gap:4px;

    margin-bottom:6px;

    padding:4px 8px;
    border-radius:999px;

    background:var(--catSoft);
    color:var(--cat1);

    font-size:9px;
    font-weight:950;
}

.music-title{
    margin:0;

    color:#0f172a;

    font-size:15px;
    line-height:1.3;
    font-weight:950;

    overflow-wrap:anywhere;
}

.music-sub{
    margin-top:5px;

    color:#94a3b8;

    font-size:10px;
    font-weight:700;
}

.sing-btn{
    flex:0 0 auto;

    min-width:106px;
    height:44px;

    border:0;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--cat1),
            var(--cat2)
        );

    color:white;

    font-size:12px;
    font-weight:950;

    box-shadow:
        0 6px 16px rgba(15,23,42,.14);

    cursor:pointer;

    transition:.15s ease;
}

.sing-btn:active{
    transform:scale(.98);
}

.sing-btn.tocando{
    background:
        linear-gradient(
            135deg,
            #059669,
            #10b981
        );
}

.sing-btn.sem-link{
    background:#e2e8f0;
    color:#94a3b8;
    box-shadow:none;
}

.sing-btn.sem-link:active{
    transform:none;
}

.player-area{
    display:none;
    padding:0 14px 14px;
}

.player-area.aberto{
    display:block;
}

.player-box{
    position:relative;

    width:100%;
    aspect-ratio:16/9;

    overflow:hidden;
    border-radius:15px;

    background:#000;

    box-shadow:
        0 8px 20px rgba(15,23,42,.16);
}

.player-box iframe{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border:0;
}

.player-actions{
    display:flex;
    justify-content:flex-end;

    margin-top:8px;
}

.close-player{
    border:0;

    background:#f1f5f9;
    color:#475569;

    border-radius:11px;

    padding:8px 11px;

    font-size:11px;
    font-weight:950;

    cursor:pointer;
}

/* =========================================================
   VAZIO
========================================================= */

.vazio{
    background:white;

    border:1px solid #e2e8f0;
    border-radius:20px;

    padding:28px 18px;

    text-align:center;

    box-shadow:
        0 8px 24px rgba(15,23,42,.05);
}

.vazio-icon{
    font-size:40px;
}

.vazio strong{
    display:block;

    margin-top:8px;

    font-size:15px;
}

.vazio span{
    display:block;

    margin-top:5px;

    font-size:12px;
    color:#64748b;
}

/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:390px){

    .header-title{
        font-size:16px;
    }

    .hero{
        padding:19px;
    }

    .hero h1{
        font-size:25px;
    }

    .music-main{
        gap:8px;
        padding:12px;
    }

    .music-title{
        font-size:14px;
    }

    .sing-btn{
        min-width:94px;
        height:42px;
        padding:0 10px;
        font-size:11px;
    }
}

@media(prefers-reduced-motion:reduce){
    .carousel-track{
        animation:none;
    }
}
</style>
</head>

<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfigKaraoke = {

    apiKey:
        "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",

    authDomain:
        "ajuda-jp.firebaseapp.com",

    projectId:
        "ajuda-jp",

    storageBucket:
        "ajuda-jp.firebasestorage.app",

    messagingSenderId:
        "40121072206",

    appId:
        "1:40121072206:web:23168abd254affb6d0a11f"

};

let dbKaraoke = null;

try{

    if(
        window.firebase &&
        firebase.apps.length === 0
    ){
        firebase.initializeApp(
            firebaseConfigKaraoke
        );
    }

    if(window.firebase){
        dbKaraoke =
            firebase.firestore();
    }

}catch(erro){

    console.warn(
        "Firebase do karaokê não iniciou:",
        erro
    );

}

/* =========================================================
   CARROSSEL
========================================================= */

function configurarCarrosselInfinito(){

    const track =
        document.getElementById(
            "carouselTrack"
        );

    if(
        !track ||
        track.dataset.initialized ===
        "true"
    ){
        return;
    }

    const items =
        Array.from(
            track.children
        );

    items.forEach(item=>{

        const clone =
            item.cloneNode(true);

        clone.setAttribute(
            "aria-hidden",
            "true"
        );

        track.appendChild(
            clone
        );

    });

    requestAnimationFrame(()=>{

        const larguraOriginal =
            track.scrollWidth / 2;

        track.style.setProperty(
            "--scroll-amount",
            `-${larguraOriginal}px`
        );

        track.dataset.initialized =
            "true";

    });

}

window.addEventListener(
    "load",
    configurarCarrosselInfinito
);

/* =========================================================
   BANNERS
========================================================= */

async function registrarCliqueBanner(
    bannerId,
    urlDestino
){

    try{

        if(dbKaraoke){

            await dbKaraoke
                .collection("banners")
                .doc(bannerId)
                .set(
                    {
                        cliques:
                            firebase.firestore
                                .FieldValue
                                .increment(1),

                        ultimoCliqueEm:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );

        }

    }catch(erro){

        console.warn(
            "Erro registrando clique:",
            erro
        );

    }finally{

        window.location.href =
            urlDestino;

    }

}

/* =========================================================
   AUXILIARES
========================================================= */

function escaparHTML(valor){

    return String(
        valor ?? ""
    )
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function normalizarTexto(valor){

    return String(
        valor || ""
    )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase();

}

function extrairYoutubeId(link){

    const url =
        String(link || "");

    if(!url){
        return "";
    }

    try{

        const parsed =
            new URL(url);

        if(
            parsed.hostname.includes(
                "youtu.be"
            )
        ){
            return parsed.pathname
                .replace("/","")
                .split("/")[0];
        }

        if(
            parsed.hostname.includes(
                "youtube.com"
            )
        ){

            if(
                parsed.pathname ===
                "/watch"
            ){
                return parsed
                    .searchParams
                    .get("v") || "";
            }

            if(
                parsed.pathname.startsWith(
                    "/embed/"
                )
            ){
                return parsed.pathname
                    .split("/embed/")[1]
                    .split("/")[0];
            }

        }

    }catch{}

    return "";

}

function corCategoria(categoria){

    const mapa = {

        "Sertanejo & Modão":{
            a:"#f97316",
            b:"#ea580c",
            soft:"#fff7ed",
            icon:"🤠"
        },

        "Rock Nacional":{
            a:"#dc2626",
            b:"#7f1d1d",
            soft:"#fef2f2",
            icon:"🎸"
        },

        "MPB":{
            a:"#059669",
            b:"#047857",
            soft:"#ecfdf5",
            icon:"🌿"
        },

        "Pagode & Samba":{
            a:"#16a34a",
            b:"#15803d",
            soft:"#f0fdf4",
            icon:"🥁"
        },

        "Pop Nacional":{
            a:"#ec4899",
            b:"#db2777",
            soft:"#fdf2f8",
            icon:"✨"
        },

        "Anos 80/90":{
            a:"#7c3aed",
            b:"#5b21b6",
            soft:"#f5f3ff",
            icon:"📼"
        },

        "Rock Internacional":{
            a:"#334155",
            b:"#0f172a",
            soft:"#f1f5f9",
            icon:"⚡"
        },

        "Pop Internacional":{
            a:"#2563eb",
            b:"#4f46e5",
            soft:"#eff6ff",
            icon:"🌍"
        },

        "Festa & Dance":{
            a:"#eab308",
            b:"#f97316",
            soft:"#fefce8",
            icon:"🪩"
        },

        "Românticas":{
            a:"#e11d48",
            b:"#be123c",
            soft:"#fff1f2",
            icon:"❤️"
        }

    };

    return mapa[categoria] || {
        a:"#7c3aed",
        b:"#ec4899",
        soft:"#f5f3ff",
        icon:"🎵"
    };

}

/* =========================================================
   DADOS
========================================================= */

const wrapper =
    document.getElementById(
        "container-musicas"
    );

const buscaMusica =
    document.getElementById(
        "buscaMusica"
    );

const filtrosCategorias =
    document.getElementById(
        "filtrosCategorias"
    );

const contadorMusicas =
    document.getElementById(
        "contadorMusicas"
    );

const heroTotal =
    document.getElementById(
        "heroTotal"
    );

const heroCategorias =
    document.getElementById(
        "heroCategorias"
    );

const musicas =
    Array.isArray(
        window.listaKaraoke
    )
        ? window.listaKaraoke
        : (
            typeof listaKaraoke !==
            "undefined"
                ? listaKaraoke
                : []
        );

let categoriaAtual =
    "Todas";

/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo(){

    const categorias =
        [
            ...new Set(
                musicas.map(
                    item=>
                        String(
                            item.categoria ||
                            "Outros"
                        )
                )
            )
        ];

    heroTotal.textContent =
        "🎵 " +
        musicas.length +
        (
            musicas.length === 1
                ? " música"
                : " músicas"
        );

    heroCategorias.textContent =
        "🌈 " +
        categorias.length +
        (
            categorias.length === 1
                ? " categoria"
                : " categorias"
        );

}

/* =========================================================
   FILTROS
========================================================= */

function montarFiltros(){

    const categorias =
        [
            "Todas",
            ...new Set(
                musicas
                    .map(
                        item=>
                            String(
                                item.categoria ||
                                "Outros"
                            )
                    )
                    .filter(Boolean)
            )
        ];

    filtrosCategorias.innerHTML =
        "";

    categorias.forEach(
        categoria=>{

            const botao =
                document.createElement(
                    "button"
                );

            botao.type =
                "button";

            botao.className =
                "filtro-btn" +
                (
                    categoria ===
                    categoriaAtual
                        ? " ativo"
                        : ""
                );

            const cor =
                corCategoria(
                    categoria
                );

            botao.textContent =
                categoria ===
                "Todas"
                    ? "🌈 Todas"
                    : cor.icon +
                      " " +
                      categoria;

            botao.addEventListener(
                "click",
                ()=>{

                    categoriaAtual =
                        categoria;

                    montarFiltros();
                    renderizarMusicas();

                }
            );

            filtrosCategorias
                .appendChild(
                    botao
                );

        }
    );

}

/* =========================================================
   RENDER
========================================================= */

function renderizarMusicas(){

    const termo =
        normalizarTexto(
            buscaMusica.value
        );

    const filtradas =
        musicas.filter(
            item=>{

                const categoria =
                    String(
                        item.categoria ||
                        "Outros"
                    );

                const bateCategoria =
                    categoriaAtual ===
                    "Todas" ||
                    categoria ===
                    categoriaAtual;

                const textoBusca =
                    normalizarTexto(
                        (
                            item.titulo ||
                            ""
                        ) +
                        " " +
                        categoria
                    );

                const bateBusca =
                    !termo ||
                    textoBusca.includes(
                        termo
                    );

                return (
                    bateCategoria &&
                    bateBusca
                );

            }
        );

    contadorMusicas.textContent =
        filtradas.length +
        (
            filtradas.length === 1
                ? " música"
                : " músicas"
        );

    wrapper.innerHTML =
        "";

    if(
        filtradas.length === 0
    ){

        wrapper.innerHTML =
            `
            <div class="vazio">

                <div class="vazio-icon">
                    🎵
                </div>

                <strong>
                    Nenhuma música encontrada
                </strong>

                <span>
                    Tente outro nome ou outra categoria.
                </span>

            </div>
            `;

        return;
    }

    filtradas.forEach(
        (item,index)=>{

            const categoriaReal =
                String(
                    item.categoria ||
                    "Outros"
                );

            const cores =
                corCategoria(
                    categoriaReal
                );

            const linkOriginal =
                String(
                    item.link ||
                    ""
                );

            const videoId =
                extrairYoutubeId(
                    linkOriginal
                );

            const embedUrl =
                videoId
                    ? `https://www.youtube.com/embed/${videoId}`
                    : "";

            const categoria =
                escaparHTML(
                    categoriaReal
                );

            const titulo =
                escaparHTML(
                    item.titulo ||
                    "Sem título"
                );

            const playerId =
                "player-" +
                index +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2,8);

            const temLink =
                Boolean(
                    embedUrl
                );

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "music-card";

            card.style.setProperty(
                "--cat1",
                cores.a
            );

            card.style.setProperty(
                "--cat2",
                cores.b
            );

            card.style.setProperty(
                "--catSoft",
                cores.soft
            );

            card.innerHTML =
                `
                <div class="music-main">

                    <div class="music-left">

                        <span class="music-category">
                            ${cores.icon} ${categoria}
                        </span>

                        <h3 class="music-title">
                            ${titulo}
                        </h3>

                        <div class="music-sub">
                            ${
                                temLink
                                    ? "Karaokê disponível"
                                    : "Vídeo será adicionado"
                            }
                        </div>

                    </div>

                    <button
                        type="button"
                        class="sing-btn ${temLink ? "" : "sem-link"}"
                        ${temLink ? "" : "disabled"}
                    >
                        ${
                            temLink
                                ? "🎤 Cantar"
                                : "⏳ Em breve"
                        }
                    </button>

                </div>

                <div
                    id="${playerId}"
                    class="player-area"
                >

                    <div class="player-box"></div>

                    <div class="player-actions">

                        <button
                            type="button"
                            class="close-player"
                        >
                            ✕ Fechar
                        </button>

                    </div>

                </div>
                `;

            const btnCantar =
                card.querySelector(
                    ".sing-btn"
                );

            const areaPlayer =
                card.querySelector(
                    ".player-area"
                );

            const playerBox =
                card.querySelector(
                    ".player-box"
                );

            const btnFechar =
                card.querySelector(
                    ".close-player"
                );

            if(temLink){

                btnCantar.addEventListener(
                    "click",
                    ()=>{

                        fecharTodosPlayers();

                        areaPlayer
                            .classList
                            .add(
                                "aberto"
                            );

                        btnCantar
                            .classList
                            .add(
                                "tocando"
                            );

                        btnCantar.textContent =
                            "▶ Tocando";

                        playerBox.innerHTML =
                            `
                            <iframe
                                src="${escaparHTML(embedUrl)}?autoplay=1&playsinline=1&rel=0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen
                                referrerpolicy="strict-origin-when-cross-origin"
                            ></iframe>
                            `;

                        setTimeout(
                            ()=>{
                                areaPlayer
                                    .scrollIntoView({
                                        behavior:"smooth",
                                        block:"center"
                                    });
                            },
                            120
                        );

                    }
                );

            }

            btnFechar.addEventListener(
                "click",
                fecharTodosPlayers
            );

            wrapper.appendChild(
                card
            );

        }
    );

}

function fecharTodosPlayers(){

    document
        .querySelectorAll(
            ".player-area"
        )
        .forEach(
            area=>{

                area.classList.remove(
                    "aberto"
                );

                const box =
                    area.querySelector(
                        ".player-box"
                    );

                if(box){
                    box.innerHTML =
                        "";
                }

            }
        );

    document
        .querySelectorAll(
            ".sing-btn"
        )
        .forEach(
            botao=>{

                if(
                    botao.classList.contains(
                        "sem-link"
                    )
                ){
                    return;
                }

                botao.classList.remove(
                    "tocando"
                );

                botao.textContent =
                    "🎤 Cantar";

            }
        );

}

/* =========================================================
   EVENTOS
========================================================= */

buscaMusica.addEventListener(
    "input",
    renderizarMusicas
);

atualizarResumo();
montarFiltros();
renderizarMusicas();

</script>

</body>
</html>

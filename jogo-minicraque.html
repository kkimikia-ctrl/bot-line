<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Craque - Central de Jogos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 10px;
            color: #333;
            padding-bottom: 50px;
            text-align: center;
            padding-top: 155px !important; /* Espaço para o banner fixo no topo */
            overscroll-behavior-y: none;
        }
        
        .container { max-width: 600px; margin: 0 auto; }

        .card-game {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        /* Canvas do Mini Craque */
        canvas#gameCanvas {
            border: 4px solid #2e7d32;
            background-color: #2e7d32;
            cursor: pointer;
            border-radius: 8px;
            display: block;
            margin: 0 auto 10px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            touch-action: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="container-minicraque" class="card-game" style="display: block;">
            <!-- Removido o botão voltar duplicado daqui, mantendo apenas o Salvar Pontos -->
            <button onclick="salvarPontuacaoRankingMiniCraqueManual()" style="background: #059669; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px; cursor: pointer; float: right; font-weight: bold; font-size: 11px;">💾 Salvar Pontos</button>
            <div style="clear: both;"></div>
            
            <div style="background: #2e7d32; color: white; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold;">
                <span>⚽ Pontuação: <span id="minicraque-score">0</span></span>
                <span>Tentativas: <span id="minicraque-attempts">3</span></span>
            </div>

            <canvas id="gameCanvas" width="360" height="500"></canvas>
            <p style="font-size: 11px; color: #666; margin: 5px 0 0 0;">Puxe a bola para trás (estilo arco e flecha) e solte para chutar!</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",
          authDomain: "ajuda-jp.firebaseapp.com",
          projectId: "ajuda-jp",
          storageBucket: "ajuda-jp.firebasestorage.app",
          messagingSenderId: "40121072206",
          appId: "1:40121072206:web:8a844e632f004f61d0a11f"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            window.dbFirebase = db;
        } catch (err) {
            console.error("Erro Firebase:", err);
        }

        window.salvarNoFirebase = async function(nomeJogador, pontosJogador) {
            if (!window.dbFirebase) {
                alert("Erro de conexão com o banco de dados do Ranking Global.");
                return;
            }
            try {
                const idUnicoDoc = `${nomeJogador}_${Date.now()}`;
                await setDoc(doc(window.dbFirebase, "ranking_minicraque", idUnicoDoc), {
                    nome: nomeJogador,
                    pontos: Number(pontosJogador),
                    data: new Date().toISOString()
                });
                tocarEfeito('vitoria');
                alert("✅ Pontuação salva com sucesso no Ranking Global!");
                window.location.href = "ranking.html";
            } catch (e) {
                console.error("Erro ao salvar no Firebase:", e);
                alert("Erro ao salvar pontuação online.");
            }
        };
    </script>

    <script>
        /* SISTEMA DE ÁUDIO E MÚSICA */
        let audioCtx = null;
        let somLigado = true;
        let musicaIntervalo = null;
        let passoMusica = 0;

        const notas = { C4: 261.63, E4: 329.63, G4: 392.00, B4: 493.88, D5: 587.33 };

        function inicializarAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        window.alternarAudioGlobal = function(e) {
            if (e) e.stopPropagation();
            inicializarAudioContext();
            somLigado = !somLigado;
            
            document.querySelectorAll('.btnAudioToggleNav').forEach(btn => {
                btn.innerText = somLigado ? "🔊 Som: Ligado" : "🔇 Sem Som";
            });

            if (somLigado) {
                iniciarMusicaDeFundo();
            } else {
                pararMusicaDeFundo();
            }
        };

        function tocarEfeito(tipo) {
            if (!somLigado) return;
            inicializarAudioContext();
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let agora = audioCtx.currentTime;

                if (tipo === 'clique') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, agora);
                    gain.gain.setValueAtTime(0.1, agora);
                    gain.gain.exponentialRampToValueAtTime(0.001, agora + 0.1);
                    osc.start(agora);
                    osc.stop(agora + 0.1);
                } else if (tipo === 'vitoria') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, agora + (idx * 0.1));
                        g.gain.setValueAtTime(0.12, agora + (idx * 0.1));
                        g.gain.exponentialRampToValueAtTime(0.001, agora + (idx * 0.1) + 0.2);
                        o.start(agora + (idx * 0.1));
                        o.stop(agora + (idx * 0.1) + 0.2);
                    });
                }
            } catch (err) {}
        }

        function tocarNotaFundo(freq, tipoOnda = 'sine', duracao = 0.25) {
            if (!somLigado || !audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = tipoOnda;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duracao);
            } catch(e) {}
        }

        function iniciarMusicaDeFundo() {
            pararMusicaDeFundo();
            passoMusica = 0;
            musicaIntervalo = setInterval(() => {
                if (!somLigado) return;
                const melodiaCraque = [notas.G4, notas.B4, notas.D5, notas.B4];
                tocarNotaFundo(melodiaCraque[passoMusica % melodiaCraque.length], 'triangle', 0.25);
                passoMusica++;
            }, 350);
        }

        function pararMusicaDeFundo() {
            if (musicaIntervalo) {
                clearInterval(musicaIntervalo);
                musicaIntervalo = null;
            }
        }

        function voltarMenuJogos() {
            pararMiniCraque();
            window.location.href = "forca.html";
        }

        /* LÓGICA DO MINI CRAQUE */
        const canvasCraque = document.getElementById('gameCanvas');
        const ctxCraque = canvasCraque.getContext('2d');
        let minicraqueInterval = null;
        let scoreCraque = 0;
        let attemptsCraque = 3;

        const ball = {
            x: 180, y: 410, radius: 12,
            startX: 180, startY: 410,
            vx: 0, vy: 0,
            isDragging: false, isMoving: false
        };

        const goalKeeper = {
            x: 140, y: 30, width: 70, height: 16,
            baseSpeed: 2.4, speed: 2.4, direction: 1,
            minX: 90, maxX: 270
        };

        const defenders = [
            { x: 100, y: 160, width: 65, height: 14, baseSpeed: 1.8, speed: 1.8, direction: 1 },
            { x: 140, y: 260, width: 65, height: 14, baseSpeed: 2.2, speed: 2.2, direction: -1 },
            { x: 120, y: 360, width: 65, height: 14, baseSpeed: 2.6, speed: 2.6, direction: 1 }
        ];

        function iniciarMiniCraque() {
            scoreCraque = 0;
            attemptsCraque = 3;
            document.getElementById('minicraque-score').innerText = scoreCraque;
            document.getElementById('minicraque-attempts').innerText = attemptsCraque;
            atualizarDificuldadeCraque();
            resetBall();
            pararMiniCraque();
            minicraqueInterval = requestAnimationFrame(loopMiniCraque);
            iniciarMusicaDeFundo();
        }

        function pararMiniCraque() {
            if (minicraqueInterval) {
                cancelAnimationFrame(minicraqueInterval);
                minicraqueInterval = null;
            }
        }

        function atualizarDificuldadeCraque() {
            let fatorVelocidade = 1 + Math.floor(scoreCraque / 30) * 0.35;
            goalKeeper.speed = goalKeeper.baseSpeed * fatorVelocidade;
            defenders.forEach((def, idx) => {
                def.speed = (def.baseSpeed + (idx * 0.2)) * fatorVelocidade;
            });
        }

        function getMousePos(e) {
            const rect = canvasCraque.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvasCraque.addEventListener('mousedown', (e) => {
            inicializarAudioContext();
            if (ball.isMoving) return;
            const pos = getMousePos(e);
            if (Math.hypot(pos.x - ball.x, pos.y - ball.y) < ball.radius * 2.5) {
                ball.isDragging = true;
            }
        });

        canvasCraque.addEventListener('mousemove', (e) => {
            if (!ball.isDragging) return;
            const pos = getMousePos(e);
            ball.x = Math.max(30 + ball.radius, Math.min(360 - 30 - ball.radius, pos.x));
            ball.y = Math.max(30 + ball.radius, Math.min(470 - ball.radius, pos.y));
        });

        canvasCraque.addEventListener('mouseup', () => {
            if (!ball.isDragging) return;
            ball.isDragging = false;
            ball.isMoving = true;
            tocarEfeito('clique');
            const forceMultiplier = 0.18;
            ball.vx = (ball.startX - ball.x) * forceMultiplier;
            ball.vy = (ball.startY - ball.y) * forceMultiplier;
            ball.x = ball.startX;
            ball.y = ball.startY;
        });

        canvasCraque.addEventListener('touchstart', (e) => {
            inicializarAudioContext();
            if (ball.isMoving) return;
            const pos = getMousePos(e);
            if (Math.hypot(pos.x - ball.x, pos.y - ball.y) < ball.radius * 2.5) {
                ball.isDragging = true;
            }
            e.preventDefault();
        }, {passive: false});

        canvasCraque.addEventListener('touchmove', (e) => {
            if (!ball.isDragging) return;
            const pos = getMousePos(e);
            ball.x = Math.max(30 + ball.radius, Math.min(360 - 30 - ball.radius, pos.x));
            ball.y = Math.max(30 + ball.radius, Math.min(470 - ball.radius, pos.y));
            e.preventDefault();
        }, {passive: false});

        canvasCraque.addEventListener('touchend', (e) => {
            if (!ball.isDragging) return;
            ball.isDragging = false;
            ball.isMoving = true;
            tocarEfeito('clique');
            const forceMultiplier = 0.18;
            ball.vx = (ball.startX - ball.x) * forceMultiplier;
            ball.vy = (ball.startY - ball.y) * forceMultiplier;
            ball.x = ball.startX;
            ball.y = ball.startY;
            e.preventDefault();
        }, {passive: false});

        function updateMiniCraque() {
            if (ball.isMoving) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy *= 0.99;

                if (ball.x - ball.radius < 30 || ball.x + ball.radius > 330) {
                    ball.vx *= -1;
                }

                if (ball.y <= 45 && ball.x >= 90 && ball.x <= 270) {
                    scoreCraque += 10;
                    document.getElementById('minicraque-score').innerText = scoreCraque;
                    atualizarDificuldadeCraque();
                    tocarEfeito('vitoria');
                    resetBall();
                }

                if (ball.x > goalKeeper.x && ball.x < goalKeeper.x + goalKeeper.width &&
                    ball.y - ball.radius < goalKeeper.y + goalKeeper.height && ball.y + ball.radius > goalKeeper.y) {
                    missShotCraque();
                }

                let numDefendersAtivos = Math.min(3, Math.floor(scoreCraque / 30) + 1);
                for (let i = 0; i < numDefendersAtivos; i++) {
                    let def = defenders[i];
                    if (ball.x > def.x && ball.x < def.x + def.width &&
                        ball.y - ball.radius < def.y + def.height && ball.y + ball.radius > def.y) {
                        missShotCraque();
                    }
                }

                if (ball.y < 0 || ball.y > 500 || ball.x < 0 || ball.x > 360) {
                    if (ball.y > 0) missShotCraque();
                    else resetBall();
                }
            }

            goalKeeper.x += goalKeeper.speed * goalKeeper.direction;
            if (goalKeeper.x <= goalKeeper.minX || goalKeeper.x + goalKeeper.width >= goalKeeper.maxX) {
                goalKeeper.direction *= -1;
            }

            let numDefendersAtivos = Math.min(3, Math.floor(scoreCraque / 30) + 1);
            for (let i = 0; i < numDefendersAtivos; i++) {
                let def = defenders[i];
                def.x += def.speed * def.direction;
                if (def.x <= 40 || def.x + def.width >= 320) def.direction *= -1;
            }
        }

        function missShotCraque() {
            attemptsCraque--;
            document.getElementById('minicraque-attempts').innerText = attemptsCraque;
            tocarEfeito('clique');
            if (attemptsCraque <= 0) {
                let finalScore = scoreCraque;
                alert('Fim de jogo no Mini Craque! Pontuação final: ' + finalScore);
                
                if (finalScore > 0) {
                    let nome = prompt("🏆 Digite seu nome para o Ranking Global:", "Jogador") || "Jogador";
                    if (window.salvarNoFirebase) {
                        window.salvarNoFirebase(nome, finalScore);
                    }
                }

                scoreCraque = 0;
                attemptsCraque = 3;
                document.getElementById('minicraque-score').innerText = scoreCraque;
                document.getElementById('minicraque-attempts').innerText = attemptsCraque;
                atualizarDificuldadeCraque();
            }
            resetBall();
        }

        function resetBall() {
            ball.isMoving = false;
            ball.isDragging = false;
            ball.x = ball.startX;
            ball.y = ball.startY;
            ball.vx = 0;
            ball.vy = 0;
        }

        function drawMiniCraque() {
            ctxCraque.fillStyle = '#2e7d32';
            ctxCraque.fillRect(0, 0, canvasCraque.width, canvasCraque.height);

            ctxCraque.strokeStyle = '#ffffff';
            ctxCraque.lineWidth = 3;
            ctxCraque.strokeRect(30, 30, 300, 440);
            ctxCraque.strokeRect(90, 30, 180, 70);

            ctxCraque.fillStyle = '#64748b';
            ctxCraque.fillRect(goalKeeper.x, goalKeeper.y, goalKeeper.width, goalKeeper.height);

            let numDefendersAtivos = Math.min(3, Math.floor(scoreCraque / 30) + 1);
            
            if (numDefendersAtivos >= 1) {
                ctxCraque.fillStyle = '#ef4444';
                ctxNav(defenders[0].x, defenders[0].y, defenders[0].width, defenders[0].height);
                ctxCraque.fillRect(defenders[0].x, defenders[0].y, defenders[0].width, defenders[0].height);
            }
            if (numDefendersAtivos >= 2) {
                ctxCraque.fillStyle = '#3b82f6';
                ctxCraque.fillRect(defenders[1].x, defenders[1].y, defenders[1].width, defenders[1].height);
            }
            if (numDefendersAtivos >= 3) {
                ctxCraque.fillStyle = '#10b981';
                ctxCraque.fillRect(defenders[2].x, defenders[2].y, defenders[2].width, defenders[2].height);
            }

            if (ball.isDragging) {
                ctxCraque.beginPath();
                ctxCraque.moveTo(ball.startX, ball.startY);
                let aimX = ball.startX + (ball.startX - ball.x);
                let aimY = ball.startY + (ball.startY - ball.y);
                ctxCraque.lineTo(aimX, aimY);
                ctxCraque.strokeStyle = '#ffeb3b';
                ctxCraque.lineWidth = 3;
                ctxCraque.stroke();
            }

            ctxCraque.beginPath();
            ctxCraque.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctxCraque.fillStyle = '#ffffff';
            ctxCraque.fill();
            ctxCraque.lineWidth = 2;
            ctxCraque.strokeStyle = '#000000';
            ctxCraque.stroke();
            ctxCraque.closePath();
        }

        function loopMiniCraque() {
            updateMiniCraque();
            drawMiniCraque();
            minicraqueInterval = requestAnimationFrame(loopMiniCraque);
        }

        function salvarPontuacaoRankingMiniCraqueManual() { 
            if (scoreCraque <= 0) {
                alert("Jogue e acumule pontos antes de salvar!");
                return;
            }
            let nome = prompt("🏆 Digite seu nome para o Ranking Global:", "Jogador") || "Jogador";
            if (window.salvarNoFirebase) {
                window.salvarNoFirebase(nome, scoreCraque);
            }
        }

        window.onload = () => {
            iniciarMiniCraque();
        };
    </script>

    <!-- Sistema de Banners Dinâmicos com Botão de Som Limpo no Topo -->
    <script src="bannersjogo.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof carregarSistemaDeBanners === 'function') {
                carregarSistemaDeBanners("⚽ Mini Craque", "forca.html", `
                    <button class="btnAudioToggleNav" onclick="alternarAudioGlobal(event)" style="background: rgba(255,255,255,0.25); border: 1px solid white; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold;">🔊 Som: Ligado</button>
                `);
            }
        });
    </script>
</body>
</html>

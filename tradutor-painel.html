<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<meta name="google" content="notranslate">

<title>Ajuda JP - Painel do Tradutor</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{

    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

}

html,

body{

    margin:0;

    padding:0;

    width:100%;

    min-height:100%;

}

body{

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Arial,

        sans-serif;

    background:#f4f6f9;

    color:#333;

}

header{

    background:#1a73e8;

    color:white;

    padding:16px;

    text-align:center;

    position:sticky;

    top:0;

    z-index:10;

    box-shadow:0 2px 8px rgba(0,0,0,.12);

}

header h1{

    margin:0;

    font-size:20px;

}

header p{

    margin:5px 0 0;

    font-size:13px;

    opacity:.9;

}

.container{

    width:100%;

    max-width:600px;

    margin:auto;

    padding:16px;

}

.status-tradutor{

    background:white;

    border-radius:16px;

    padding:16px;

    margin-bottom:16px;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

}

.status-linha{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

}

.status-info{

    display:flex;

    align-items:center;

    gap:10px;

}

.status-bolinha{

    width:12px;

    height:12px;

    border-radius:50%;

    background:#20b15a;

    box-shadow:0 0 0 5px rgba(32,177,90,.12);

}

.status-titulo{

    font-weight:700;

    font-size:16px;

}

.status-texto{

    font-size:13px;

    color:#777;

    margin-top:3px;

}

.tradutor-nome{

    font-size:13px;

    color:#666;

    text-align:right;

}

.titulo-area{

    margin:22px 3px 12px;

    font-size:18px;

    font-weight:800;

}

#listaSolicitacoes{

    display:flex;

    flex-direction:column;

    gap:14px;

}

.vazio{

    background:white;

    border-radius:18px;

    padding:35px 20px;

    text-align:center;

    box-shadow:0 3px 12px rgba(0,0,0,.06);

}

.vazio-icone{

    font-size:45px;

    margin-bottom:12px;

}

.vazio-titulo{

    font-weight:800;

    font-size:17px;

}

.vazio-texto{

    margin-top:7px;

    color:#777;

    font-size:14px;

    line-height:1.5;

}

.pedido{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 4px 14px rgba(0,0,0,.09);

    border:1px solid #e8e8e8;

}

.pedido-topo{

    background:#fff3f3;

    padding:12px 15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}

.novo-pedido{

    color:#d93025;

    font-size:13px;

    font-weight:900;

}

.hora-pedido{

    color:#777;

    font-size:12px;

}

.pedido-corpo{

    padding:16px;

}

.cliente{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:15px;

}

.avatar{

    width:43px;

    height:43px;

    border-radius:50%;

    background:#e8f0fe;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

}

.cliente-nome{

    font-weight:800;

    font-size:16px;

}

.cliente-label{

    color:#888;

    font-size:12px;

    margin-top:2px;

}

.dados{

    background:#f7f9fc;

    border-radius:13px;

    padding:12px 14px;

    margin-bottom:14px;

}

.dado{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:7px 0;

    border-bottom:1px solid #e9edf3;

}

.dado:last-child{

    border-bottom:none;

}

.dado-label{

    color:#777;

    font-size:13px;

}

.dado-valor{

    font-weight:700;

    text-align:right;

    font-size:14px;

}

.btn-aceitar{

    width:100%;

    border:none;

    border-radius:13px;

    background:#20b15a;

    color:white;

    font-size:16px;

    font-weight:900;

    padding:14px;

    cursor:pointer;

}

.btn-aceitar:active{

    transform:scale(.98);

}

.btn-aceitar:disabled{

    background:#aaa;

    cursor:not-allowed;

    transform:none;

}

.aviso{

    margin-top:20px;

    padding:13px;

    border-radius:12px;

    background:#fff8e1;

    color:#735b00;

    font-size:12px;

    line-height:1.5;

}

</style>

</head>

<body>

<header>

    <h1>🌐 Painel do Tradutor</h1>

    <p>Ajuda JP • Tradução Online</p>

</header>

<div class="container">

    <div class="status-tradutor">

        <div class="status-linha">

            <div class="status-info">

                <div class="status-bolinha"></div>

                <div>

                    <div class="status-titulo">

                        Disponível

                    </div>

                    <div class="status-texto">

                        Aguardando solicitações

                    </div>

                </div>

            </div>

            <div

                class="tradutor-nome"

                id="tradutorNome"

            >

                Carregando...

            </div>

        </div>

    </div>

    <div class="titulo-area">

        Solicitações

    </div>

    <div id="listaSolicitacoes">

        <div class="vazio">

            <div class="vazio-icone">

                🔎

            </div>

            <div class="vazio-titulo">

                Procurando solicitações...

            </div>

            <div class="vazio-texto">

                Novos pedidos aparecerão aqui automaticamente.

            </div>

        </div>

    </div>

    <div class="aviso">

        ⚠️ Ao aceitar uma solicitação,

        ela deixa de ficar disponível

        para os outros tradutores.

    </div>

</div>

<script type="module">

/* =========================================================

   FIREBASE

========================================================= */

import {

    initializeApp

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {

    getFirestore,

    collection,

    query,

    where,

    onSnapshot,

    doc,

    runTransaction,

    serverTimestamp

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {

    apiKey:

        "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",

    authDomain:

        "ajuda-jp.firebaseapp.com",

    projectId:

        "ajuda-jp",

    storageBucket:

        "ajuda-jp.firebasestorage.app",

    messagingSenderId:

        "40121072206",

    appId:

        "1:40121072206:web:23168abd254affb6d0a11f"

};

const app =

    initializeApp(firebaseConfig);

const db =

    getFirestore(app);

/* =========================================================

   LINE

========================================================= */

const LIFF_ID =

    "2010902449-KWNNNsxn";

let tradutor = {

    id:

        localStorage.getItem(

            "line_user_id"

        ) || "",

    nome:

        localStorage.getItem(

            "line_user_name"

        ) || "Tradutor"

};

async function iniciarLINE(){

    try{

        await liff.init({

            liffId:LIFF_ID

        });

        if(!liff.isLoggedIn()){

            liff.login();

            return;

        }

        const perfil =

            await liff.getProfile();

        tradutor.id =

            perfil.userId;

        tradutor.nome =

            perfil.displayName

            || "Tradutor";

        localStorage.setItem(

            "line_user_id",

            tradutor.id

        );

        localStorage.setItem(

            "line_user_name",

            tradutor.nome

        );

        document.getElementById(

            "tradutorNome"

        ).innerText =

            tradutor.nome;

    }

    catch(error){

        console.error(

            "Erro LINE:",

            error

        );

        document.getElementById(

            "tradutorNome"

        ).innerText =

            "Tradutor";

    }

}

/* =========================================================

   PROTEÇÃO DO TEXTO

========================================================= */

function escaparHTML(texto){

    const elemento =

        document.createElement("div");

    elemento.textContent =

        texto == null

        ? ""

        : String(texto);

    return elemento.innerHTML;

}

/* =========================================================

   FORMATAR LOCAL

========================================================= */

function formatarLocal(valor){

    if(!valor){

        return "Não informado";

    }

    const locais = {

        hospital:

            "🏥 Hospital",

        prefeitura:

            "🏢 Prefeitura",

        escola:

            "🏫 Escola",

        outros:

            "📍 Outros"

    };

    const chave =

        String(valor)

        .toLowerCase();

    return locais[chave]

        || escaparHTML(valor);

}

/* =========================================================

   FORMATAR TEMPO

========================================================= */

function formatarTempo(valor){

    if(!valor){

        return "30 minutos";

    }

    const texto =

        String(valor);

    if(

        texto === "30"

        ||

        texto === "30m"

    ){

        return "30 minutos";

    }

    if(

        texto === "60"

        ||

        texto === "1h"

    ){

        return "1 hora";

    }

    if(

        texto === "120"

        ||

        texto === "2h+"

    ){

        return "2 horas ou mais";

    }

    return escaparHTML(texto);

}

/* =========================================================

   FORMATAR DATA

========================================================= */

function formatarHora(timestamp){

    if(

        !timestamp

        ||

        typeof timestamp.toDate

        !== "function"

    ){

        return "Agora";

    }

    try{

        return timestamp

            .toDate()

            .toLocaleTimeString(

                "pt-BR",

                {

                    hour:"2-digit",

                    minute:"2-digit"

                }

            );

    }

    catch{

        return "Agora";

    }

}

/* =========================================================

   MOSTRAR SOLICITAÇÕES

========================================================= */

function iniciarSolicitacoes(){

    const lista =

        document.getElementById(

            "listaSolicitacoes"

        );

    const consulta =

        query(

            collection(

                db,

                "solicitacoes"

            ),

            where(

                "status",

                "==",

                "procurando"

            )

        );

    onSnapshot(

        consulta,

        snapshot => {

            lista.innerHTML = "";

            if(snapshot.empty){

                lista.innerHTML = `

                    <div class="vazio">

                        <div class="vazio-icone">

                            🕐

                        </div>

                        <div class="vazio-titulo">

                            Nenhuma solicitação agora

                        </div>

                        <div class="vazio-texto">

                            Quando alguém chamar um tradutor,

                            o pedido aparecerá aqui.

                        </div>

                    </div>

                `;

                return;

            }

            const pedidos = [];

            snapshot.forEach(

                documento => {

                    pedidos.push({

                        id:

                            documento.id,

                        ...documento.data()

                    });

                }

            );

            /*

               Mais novos primeiro.

            */

            pedidos.sort(

                (a,b) => {

                    const dataA =

                        a.criadaEm

                        &&

                        typeof a.criadaEm.toMillis

                        === "function"

                        ?

                        a.criadaEm.toMillis()

                        :

                        0;

                    const dataB =

                        b.criadaEm

                        &&

                        typeof b.criadaEm.toMillis

                        === "function"

                        ?

                        b.criadaEm.toMillis()

                        :

                        0;

                    return dataB - dataA;

                }

            );

            pedidos.forEach(

                pedido => {

                    criarCard(

                        pedido,

                        lista

                    );

                }

            );

        },

        error => {

            console.error(

                "Erro solicitações:",

                error

            );

            lista.innerHTML = `

                <div class="vazio">

                    <div class="vazio-icone">

                        ⚠️

                    </div>

                    <div class="vazio-titulo">

                        Não foi possível carregar

                    </div>

                    <div class="vazio-texto">

                        Verifique a conexão e as regras do Firebase.

                    </div>

                </div>

            `;

        }

    );

}

/* =========================================================

   CARD DA SOLICITAÇÃO

========================================================= */

function criarCard(

    pedido,

    lista

){

    const card =

        document.createElement(

            "div"

        );

    card.className =

        "pedido";

    const clienteNome =

        pedido.usuarioNome

        ||

        pedido.clienteNome

        ||

        pedido.nome

        ||

        "Cliente";

    const local =

        pedido.localAtendimento

        ||

        pedido.local

        ||

        "Não informado";

    const tempo =

        pedido.tempoAtendimento

        ||

        pedido.tempo

        ||

        "30";

    const dataPedido =

        pedido.criadaEm

        ||

        pedido.dataHora

        ||

        pedido.data;

    card.innerHTML = `

        <div class="pedido-topo">

            <div class="novo-pedido">

                🔴 NOVA SOLICITAÇÃO

            </div>

            <div class="hora-pedido">

                ${formatarHora(dataPedido)}

            </div>

        </div>

        <div class="pedido-corpo">

            <div class="cliente">

                <div class="avatar">

                    👤

                </div>

                <div>

                    <div class="cliente-nome">

                        ${escaparHTML(clienteNome)}

                    </div>

                    <div class="cliente-label">

                        Cliente

                    </div>

                </div>

            </div>

            <div class="dados">

                <div class="dado">

                    <div class="dado-label">

                        Local

                    </div>

                    <div class="dado-valor">

                        ${formatarLocal(local)}

                    </div>

                </div>

                <div class="dado">

                    <div class="dado-label">

                        Tempo

                    </div>

                    <div class="dado-valor">

                        ${formatarTempo(tempo)}

                    </div>

                </div>

            </div>

            <button

                class="btn-aceitar"

                id="aceitar-${pedido.id}"

            >

                ACEITAR

            </button>

        </div>

    `;

    const botao =

        card.querySelector(

            ".btn-aceitar"

        );

    botao.addEventListener(

        "click",

        () => {

            aceitarSolicitacao(

                pedido.id,

                botao

            );

        }

    );

    lista.appendChild(

        card

    );

}

/* =========================================================

   ACEITAR SOLICITAÇÃO

========================================================= */

async function aceitarSolicitacao(

    solicitacaoId,

    botao

){

    if(!tradutor.id){

        alert(

            "Não foi possível identificar o tradutor pelo LINE."

        );

        return;

    }

    botao.disabled = true;

    botao.innerText =

        "ACEITANDO...";

    try{

        const solicitacaoRef =

            doc(

                db,

                "solicitacoes",

                solicitacaoId

            );

        await runTransaction(

            db,

            async transaction => {

                const snapshot =

                    await transaction.get(

                        solicitacaoRef

                    );

                if(!snapshot.exists()){

                    throw new Error(

                        "SOLICITACAO_NAO_EXISTE"

                    );

                }

                const dados =

                    snapshot.data();

                /*

                   Evita dois tradutores

                   aceitarem o mesmo pedido.

                */

                if(

                    dados.status !==

                    "procurando"

                ){

                    throw new Error(

                        "JA_ACEITA"

                    );

                }

                transaction.update(

                    solicitacaoRef,

                    {

                        status:

                            "aceita",

                        tradutorId:

                            tradutor.id,

                        tradutorNome:

                            tradutor.nome,

                        aceitaEm:

                            serverTimestamp()

                    }

                );

            }

        );

        alert(

            "✅ Solicitação aceita!"

        );

        /*

           Guardamos para a próxima tela

           de atendimento.

        */

        localStorage.setItem(

            "solicitacao_tradutor_atual",

            solicitacaoId

        );

        /*

           Depois vamos trocar isto

           pela sala de vídeo.

        */

        botao.innerText =

            "ACEITA";

    }

    catch(error){

        console.error(

            "Erro ao aceitar:",

            error

        );

        if(

            error.message ===

            "JA_ACEITA"

        ){

            alert(

                "Outro tradutor já aceitou esta solicitação."

            );

        }

        else if(

            error.message ===

            "SOLICITACAO_NAO_EXISTE"

        ){

            alert(

                "Esta solicitação não existe mais."

            );

        }

        else{

            alert(

                "Não foi possível aceitar a solicitação."

            );

        }

        botao.disabled = false;

        botao.innerText =

            "ACEITAR";

    }

}

/* =========================================================

   INICIAR

========================================================= */

await iniciarLINE();

iniciarSolicitacoes();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="google" content="notranslate">

<title>Painel do Tradutor - Ajuda JP</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f4f7fb;
    color: #1f2937;
}

.header {
    background: #2474e5;
    color: white;
    text-align: center;
    padding: 30px 20px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
}

.header p {
    margin: 8px 0 0;
    font-size: 18px;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 32px;
}

.status-card {
    background: white;
    border-radius: 28px;
    padding: 28px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.status-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.status-dot-wrap {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #e1f7ea;
    display: flex;
    align-items: center;
    justify-content: center;
}

.status-dot {
    width: 24px;
    height: 24px;
    background: #1dbb68;
    border-radius: 50%;
}

.status-title {
    font-size: 27px;
    font-weight: 800;
}

.status-subtitle {
    margin-top: 4px;
    font-size: 19px;
    color: #777;
}

.tradutor-nome {
    font-size: 18px;
    color: #666;
    font-weight: 700;
}

.section-title {
    margin: 44px 6px 24px;
    font-size: 29px;
    font-weight: 800;
}

#listaSolicitacoes {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.vazio {
    background: white;
    border-radius: 28px;
    padding: 75px 30px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.06);
}

.vazio-icon {
    font-size: 68px;
    margin-bottom: 24px;
}

.vazio-titulo {
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 15px;
}

.vazio-texto {
    font-size: 18px;
    line-height: 1.5;
    color: #777;
}

.solicitacao-card {
    background: white;
    border-radius: 28px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.solicitacao-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.cliente-nome {
    font-size: 24px;
    font-weight: 800;
}

.novo-badge {
    background: #e7f0ff;
    color: #1765d8;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
}

.info {
    background: #f6f8fb;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
}

.info-linha {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 8px 0;
    font-size: 17px;
}

.info-label {
    color: #777;
}

.info-valor {
    font-weight: 700;
    text-align: right;
}

.botao-aceitar {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 18px;
    background: #20b866;
    color: white;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
}

.botao-aceitar:disabled {
    opacity: 0.55;
}

.aviso {
    margin-top: 38px;
    background: #fff7d9;
    color: #7b5a00;
    border-radius: 22px;
    padding: 23px;
    font-size: 17px;
    line-height: 1.5;
    font-weight: 600;
}

.erro {
    background: #ffe4e4;
    color: #a30000;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    font-weight: 700;
}

@media (max-width: 600px) {

    .container {
        padding: 24px 16px;
    }

    .header {
        padding: 28px 15px;
    }

    .header h1 {
        font-size: 27px;
    }

    .status-card {
        padding: 24px 20px;
    }

    .status-title {
        font-size: 24px;
    }

    .status-subtitle {
        font-size: 17px;
    }

    .tradutor-nome {
        font-size: 16px;
    }
}

</style>
</head>

<body>

<header class="header">
    <h1>🌐 Painel do Tradutor</h1>
    <p>Ajuda JP • Tradução Online</p>
</header>

<main class="container">

    <section class="status-card">

        <div class="status-left">

            <div class="status-dot-wrap">
                <div class="status-dot"></div>
            </div>

            <div>
                <div class="status-title">
                    Disponível
                </div>

                <div class="status-subtitle">
                    Aguardando solicitações
                </div>
            </div>

        </div>

        <div
            class="tradutor-nome"
            id="tradutorNome"
        >
            Tradutor
        </div>

    </section>

    <h2 class="section-title">
        Solicitações
    </h2>

    <section id="listaSolicitacoes">

        <div class="vazio">

            <div class="vazio-icon">
                🕐
            </div>

            <div class="vazio-titulo">
                Nenhuma solicitação agora
            </div>

            <div class="vazio-texto">
                Quando alguém chamar um tradutor,
                o pedido aparecerá aqui.
            </div>

        </div>

    </section>

    <div class="aviso">
        ⚠️ Ao aceitar uma solicitação, ela deixa de ficar
        disponível para os outros tradutores.
    </div>

</main>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getFirestore,
    collection,
    query,
    where,
    onSnapshot,
    doc,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",

    authDomain:
        "ajuda-jp.firebaseapp.com",

    databaseURL:
        "https://ajuda-jp-default-rtdb.firebaseio.com",

    projectId:
        "ajuda-jp",

    storageBucket:
        "ajuda-jp.firebasestorage.app",

    messagingSenderId:
        "40121072206",

    appId:
        "1:40121072206:web:23168abd254affb6d0a11f"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================================================
   LINE
========================================================= */

const LIFF_ID =
    "2010902449-KWNNNsxn";


let tradutor = {

    id:
        localStorage.getItem("line_user_id") || "",

    nome:
        localStorage.getItem("line_user_name") || "Tradutor"

};


/* =========================================================
   ELEMENTOS
========================================================= */

const listaSolicitacoes =
    document.getElementById(
        "listaSolicitacoes"
    );

const tradutorNome =
    document.getElementById(
        "tradutorNome"
    );


/* =========================================================
   INICIAR LINE
========================================================= */

async function iniciarLINE() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

            liff.login({
                redirectUri:
                    window.location.origin +
                    "/tradutor-painel.html"
            });

            return;
        }


        const profile =
            await liff.getProfile();


        tradutor.id =
            profile.userId;


        tradutor.nome =
            profile.displayName ||
            "Tradutor";


        localStorage.setItem(
            "line_user_id",
            tradutor.id
        );


        localStorage.setItem(
            "line_user_name",
            tradutor.nome
        );


        tradutorNome.textContent =
            tradutor.nome;


        iniciarEscutaSolicitacoes();

    }
    catch (erro) {

        console.error(
            "Erro LINE:",
            erro
        );


        if (tradutor.id) {

            tradutorNome.textContent =
                tradutor.nome;

            iniciarEscutaSolicitacoes();

        }
        else {

            listaSolicitacoes.innerHTML = `
                <div class="erro">
                    Não foi possível identificar
                    o tradutor pelo LINE.
                </div>
            `;

        }

    }

}


/* =========================================================
   ESCUTAR SOLICITAÇÕES
========================================================= */

function iniciarEscutaSolicitacoes() {

    /*
       O cliente cria a solicitação com:
       status = "aguardando"
    */

    const q = query(

        collection(
            db,
            "solicitacoes"
        ),

        where(
            "status",
            "==",
            "aguardando"
        )

    );


    onSnapshot(

        q,

        (snapshot) => {

            const solicitacoes = [];


            snapshot.forEach(
                (documento) => {

                    solicitacoes.push({

                        id:
                            documento.id,

                        ...documento.data()

                    });

                }
            );


            /*
               MAIS NOVOS PRIMEIRO
            */

            solicitacoes.sort(
                (a, b) => {

                    const dataA =
                        a.criadoEm?.toMillis?.() ||
                        0;

                    const dataB =
                        b.criadoEm?.toMillis?.() ||
                        0;

                    return dataB - dataA;

                }
            );


            renderizarSolicitacoes(
                solicitacoes
            );

        },

        (erro) => {

            console.error(
                "Erro ao ouvir solicitações:",
                erro
            );


            listaSolicitacoes.innerHTML = `
                <div class="erro">
                    Não foi possível carregar
                    as solicitações.
                </div>
            `;

        }

    );

}


/* =========================================================
   RENDERIZAR SOLICITAÇÕES
========================================================= */

function renderizarSolicitacoes(
    solicitacoes
) {

    if (!solicitacoes.length) {

        listaSolicitacoes.innerHTML = `

            <div class="vazio">

                <div class="vazio-icon">
                    🕐
                </div>

                <div class="vazio-titulo">
                    Nenhuma solicitação agora
                </div>

                <div class="vazio-texto">
                    Quando alguém chamar um tradutor,
                    o pedido aparecerá aqui.
                </div>

            </div>

        `;

        return;
    }


    listaSolicitacoes.innerHTML =
        "";


    solicitacoes.forEach(
        (solicitacao) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "solicitacao-card";


            const clienteNome =
                solicitacao.clienteNome ||
                "Cliente";


            const local =
                solicitacao.local ||
                "Não informado";


            const tempo =
                solicitacao.tempoMinutos ||
                30;


            let horario =
                "Agora";


            if (
                solicitacao.criadoEm &&
                solicitacao.criadoEm.toDate
            ) {

                const data =
                    solicitacao.criadoEm.toDate();


                horario =
                    data.toLocaleTimeString(
                        "pt-BR",
                        {
                            hour:
                                "2-digit",

                            minute:
                                "2-digit"
                        }
                    );

            }


            card.innerHTML = `

                <div class="solicitacao-topo">

                    <div class="cliente-nome">
                        👤 ${escaparHTML(clienteNome)}
                    </div>

                    <div class="novo-badge">
                        NOVA
                    </div>

                </div>


                <div class="info">

                    <div class="info-linha">

                        <span class="info-label">
                            Local
                        </span>

                        <span class="info-valor">
                            ${escaparHTML(local)}
                        </span>

                    </div>


                    <div class="info-linha">

                        <span class="info-label">
                            Tempo
                        </span>

                        <span class="info-valor">
                            ${tempo} minutos
                        </span>

                    </div>


                    <div class="info-linha">

                        <span class="info-label">
                            Solicitado
                        </span>

                        <span class="info-valor">
                            ${horario}
                        </span>

                    </div>

                </div>


                <button
                    class="botao-aceitar"
                    data-id="${solicitacao.id}"
                >
                    ACEITAR SOLICITAÇÃO
                </button>

            `;


            const botao =
                card.querySelector(
                    ".botao-aceitar"
                );


            botao.addEventListener(
                "click",
                () => {

                    aceitarSolicitacao(
                        solicitacao.id,
                        botao
                    );

                }
            );


            listaSolicitacoes.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   ACEITAR SOLICITAÇÃO
========================================================= */

async function aceitarSolicitacao(
    solicitacaoId,
    botao
) {

    if (!tradutor.id) {

        alert(
            "Não foi possível identificar o tradutor."
        );

        return;
    }


    botao.disabled =
        true;

    botao.textContent =
        "ACEITANDO...";


    try {

        const referencia =
            doc(
                db,
                "solicitacoes",
                solicitacaoId
            );


        await runTransaction(

            db,

            async (transaction) => {

                const snapshot =
                    await transaction.get(
                        referencia
                    );


                if (!snapshot.exists()) {

                    throw new Error(
                        "Solicitação não encontrada."
                    );

                }


                const dados =
                    snapshot.data();


                /*
                   Evita que dois tradutores
                   aceitem o mesmo pedido.
                */

                if (
                    dados.status !==
                    "aguardando"
                ) {

                    throw new Error(
                        "Esta solicitação já foi aceita ou cancelada."
                    );

                }


                /*
                   IMPORTANTE:

                   O INDEX DO CLIENTE ESPERA:

                   status = "aceito"

                   Portanto usamos exatamente
                   "aceito" aqui.
                */

                transaction.update(
                    referencia,
                    {

                        status:
                            "aceito",

                        tradutorId:
                            tradutor.id,

                        tradutorNome:
                            tradutor.nome,

                        aceitoEm:
                            serverTimestamp(),

                        atualizadoEm:
                            serverTimestamp()

                    }
                );

            }

        );


        localStorage.setItem(
            "solicitacao_tradutor_atual",
            solicitacaoId
        );


        alert(
            "Solicitação aceita! O cliente foi avisado."
        );


        /*
           O pedido desaparecerá desta lista
           automaticamente porque não terá
           mais status "aguardando".

           O cliente receberá status "aceito"
           pelo onSnapshot do index.html.

           A próxima etapa será criar
           a sala de vídeo entre os dois.
        */


    }
    catch (erro) {

        console.error(
            "Erro ao aceitar:",
            erro
        );


        alert(
            erro.message ||
            "Não foi possível aceitar a solicitação."
        );


        botao.disabled =
            false;

        botao.textContent =
            "ACEITAR SOLICITAÇÃO";

    }

}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escaparHTML(valor) {

    return String(valor)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   INICIAR
========================================================= */

iniciarLINE();

</script>

</body>
</html>

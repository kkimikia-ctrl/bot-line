<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Ajuda JP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            padding-bottom: 80px;
        }
        .header {
            background-color: #0047ab;
            color: white;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: white;
            border: 2px solid white;
            flex-shrink: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            text-align: center;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px auto;
        }
        .profile-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .profile-email {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .menu-list {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .menu-item-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
        }
        .menu-item-link:last-child {
            border-bottom: none;
        }
        .menu-item-link:active {
            background-color: #f8fafc;
        }
        button.btn-danger {
            background-color: #dc2626;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn-danger:active {
            background-color: #b91c1c;
        }

        /* --- BARRA DE NAVEGAÇÃO INFERIOR FIXA --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 0.75rem;
            flex-grow: 1;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: #0047ab;
            font-weight: bold;
        }
        .nav-item span.icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.jpeg" class="logo-img" alt="Logo" onerror="this.onerror=null; this.src='logo.png';">
        Ajuda JP - Meu Perfil
    </div>

    <!-- Informações do Usuário -->
    <div class="card">
        <div class="profile-avatar">👤</div>
        <div class="profile-name">Usuário Ajuda JP</div>
        <div class="profile-email">usuario@exemplo.com</div>
    </div>

    <!-- Opções de Perfil -->
    <div class="menu-list">
        <a href="#" class="menu-item-link" onclick="alert('Funcionalidade em desenvolvimento')">
            <span>⚙️ Configurações da Conta</span>
            <span>&rsaquo;</span>
        </a>
        <a href="#" class="menu-item-link" onclick="alert('Funcionalidade em desenvolvimento')">
            <span>💳 Meus Créditos e Histórico</span>
            <span>&rsaquo;</span>
        </a>
        <a href="servicos.html" class="menu-item-link">
            <span>📢 Meus Anúncios</span>
            <span>&rsaquo;</span>
        </a>
        <a href="#" class="menu-item-link" onclick="alert('Funcionalidade em desenvolvimento')">
            <span>📞 Histórico de Chamadas</span>
            <span>&rsaquo;</span>
        </a>
    </div>

    <div style="padding: 0 5px;">
        <button class="btn-danger" onclick="alert('Sessão encerrada (Simulação)')">Sair da Conta</button>
    </div>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR FIXA -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="perfil.html" class="nav-item active">
            <span class="icon">👤</span>
            <span>Perfil</span>
        </a>
        <a href="servicos.html" class="nav-item">
            <span class="icon">📢</span>
            <span>Anunciar</span>
        </a>
    </nav>
    <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="servicos.html" class="nav-item">
            <span class="icon">📋</span>
            <span>Serviços</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <span class="icon">👤</span>
            <span>Perfil</span>
        </a>
        <a href="anunciar.html" class="nav-item active">
            <span class="icon">📢</span>
            <span>Anunciar</span>
        </a>
    </nav>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Ajuda JP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            padding-bottom: 30px;
        }
        .header {
            background-color: #0047ab;
            color: white;
            padding: 12px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: white;
            border: 2px solid white;
            flex-shrink: 0;
        }
        /* Botão Voltar no Canto Superior Direito */
        .btn-voltar {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-voltar:active {
            background-color: rgba(255, 255, 255, 0.4);
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            text-align: center;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px auto;
        }
        .profile-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .profile-email {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        .credit-badge {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .credit-info {
            text-align: left;
        }
        .credit-info span {
            font-size: 12px;
            color: #166534;
            display: block;
        }
        .credit-info strong {
            font-size: 16px;
            color: #15803d;
        }
        .btn-buy {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-buy:active {
            background-color: #15803d;
        }
        .menu-list {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .menu-item-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
        }
        .menu-item-link:last-child {
            border-bottom: none;
        }
        .menu-item-link:active {
            background-color: #f8fafc;
        }
        button.btn-danger {
            background-color: #dc2626;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn-danger:active {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="logo.jpeg" class="logo-img" alt="Logo" onerror="this.onerror=null; this.src='logo.png';">
            <span>Meu Perfil</span>
        </div>
        <a href="index.html" class="btn-voltar">Voltar</a>
    </div>

    <div class="card">
        <div class="profile-avatar">👤</div>
        <div class="profile-name">Usuário Ajuda JP</div>
        <div class="profile-email">usuario@exemplo.com</div>

        <div class="credit-badge">
            <div class="credit-info">
                <span>Seus Créditos</span>
                <strong>150 pts</strong>
            </div>
            <a href="carteira.html" class="btn-buy">+ Comprar</a>
        </div>
    </div>

    <div class="menu-list">
        <a href="historicocreditos.html" class="menu-item-link">
            <span>💳 Meus Créditos e Histórico</span>
            <span>&rsaquo;</span>
        </a>
        <a href="servicos.html" class="menu-item-link">
            <span>📢 Meus Anúncios</span>
            <span>&rsaquo;</span>
        </a>
        <a href="#" class="menu-item-link" onclick="alert('Histórico de chamadas em breve')">
            <span>📞 Histórico de Chamadas</span>
            <span>&rsaquo;</span>
        </a>
        <a href="#" class="menu-item-link" onclick="alert('Configurações em breve')">
            <span>⚙️ Configurações da Conta</span>
            <span>&rsaquo;</span>
        </a>
    </div>

    <div style="padding: 0 5px;">
        <button class="btn-danger" onclick="alert('Sessão encerrada (Simulação)')">Sair da Conta</button>
    </div>

</body>
</html>

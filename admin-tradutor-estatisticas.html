<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="google" content="notranslate">

<title>Ajuda JP - Estatísticas do Tradutor</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #eef5ff 0%,
            #f8fafc 45%,
            #f1f5f9 100%
        );

    color: #1e293b;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 18px;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {
    margin-bottom: 18px;
}

.header-topo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.voltar {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: white;
    box-shadow:
        0 4px 14px rgba(
            15,
            23,
            42,
            0.08
        );
    font-size: 20px;
    cursor: pointer;
}

.header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header p {
    margin: 5px 0 0;
    color: #64748b;
    font-size: 14px;
}


/* =========================================================
   CARDS
========================================================= */

.resumo-grid {
    display: grid;
    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );
    gap: 12px;
    margin-bottom: 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.08
        );
}

.card .titulo {
    font-size: 13px;
    color: #64748b;
    font-weight: 700;
}

.card .valor {
    margin-top: 6px;
    font-size: 28px;
    font-weight: 800;
    color: #2563eb;
}


/* =========================================================
   CONTROLES
========================================================= */

.barra {
    background: white;
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 18px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.08
        );
}

.barra-linha {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

button,
select {
    font-family: inherit;
}

.btn-atualizar {
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

select {
    flex: 1;
    min-width: 150px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 11px;
    font-size: 14px;
    background: white;
}


/* =========================================================
   LISTA
========================================================= */

.lista {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.item {
    background: white;
    border-radius: 18px;
    padding: 16px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.07
        );
}

.item-topo {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 12px;
}

.item-data {
    font-size: 14px;
    font-weight: 800;
    color: #0f172a;
}

.item-hora {
    font-size: 12px;
    color: #64748b;
    margin-top: 3px;
}

.badge {
    font-size: 12px;
    font-weight: 800;
    padding: 6px 10px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1d4ed8;
}

.info-grid {
    display: grid;
    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );
    gap: 10px;
}

.info {
    background: #f8fafc;
    border-radius: 12px;
    padding: 10px;
}

.info .rotulo {
    font-size: 11px;
    color: #64748b;
    font-weight: 700;
}

.info .conteudo {
    margin-top: 3px;
    font-size: 14px;
    font-weight: 700;
    word-break: break-word;
}


/* =========================================================
   STATUS
========================================================= */

.status {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

.erro {
    color: #b91c1c;
}


/* =========================================================
   MOBILE
========================================================= */

@media (
    max-width: 600px
) {

    .header h1 {
        font-size: 22px;
    }

    .resumo-grid {
        grid-template-columns: 1fr 1fr;
    }

    .info-grid {
        grid-template-columns: 1fr 1fr;
    }

}

</style>

</head>

<body>

<div class="app">

    <div class="header">

        <div class="header-topo">

            <button
                class="voltar"
                onclick="location.href='admin.html'"
            >
                ←
            </button>

            <div>

                <h1>
                    Estatísticas do Tradutor
                </h1>

                <p>
                    Ajuda JP · Tradução rápida
                </p>

            </div>

        </div>

    </div>


    <div class="resumo-grid">

        <div class="card">

            <div class="titulo">
                Traduções hoje
            </div>

            <div
                class="valor"
                id="totalHoje"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="titulo">
                Caracteres hoje
            </div>

            <div
                class="valor"
                id="caracteresHoje"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="titulo">
                Português → Japonês
            </div>

            <div
                class="valor"
                id="ptJaHoje"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="titulo">
                Japonês → Português
            </div>

            <div
                class="valor"
                id="jaPtHoje"
            >
                0
            </div>

        </div>

    </div>


    <div class="barra">

        <div class="barra-linha">

            <select id="filtro">

                <option value="todos">
                    Todos os registros
                </option>

                <option value="hoje">
                    Somente hoje
                </option>

                <option value="pt">
                    Português → Japonês
                </option>

                <option value="ja">
                    Japonês → Português
                </option>

            </select>

            <button
                class="btn-atualizar"
                id="btnAtualizar"
            >
                Atualizar
            </button>

        </div>

    </div>


    <div
        id="status"
        class="status"
    >
        Carregando...
    </div>


    <div
        id="lista"
        class="lista"
    ></div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp,
    getApps,
    getApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    orderBy,
    limit,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",

    authDomain:
        "ajuda-jp.firebaseapp.com",

    projectId:
        "ajuda-jp",

    storageBucket:
        "ajuda-jp.firebasestorage.app",

    messagingSenderId:
        "40121072206",

    appId:
        "1:40121072206:web:8a844e632f004f61d0a11f"

};


/* =========================================================
   INICIALIZAR
========================================================= */

const app =
    getApps().length
        ? getApp()
        : initializeApp(
            firebaseConfig
        );


const db =
    getFirestore(
        app
    );


/* =========================================================
   ELEMENTOS
========================================================= */

const lista =
    document.getElementById(
        "lista"
    );

const status =
    document.getElementById(
        "status"
    );

const filtro =
    document.getElementById(
        "filtro"
    );

const btnAtualizar =
    document.getElementById(
        "btnAtualizar"
    );

const totalHoje =
    document.getElementById(
        "totalHoje"
    );

const caracteresHoje =
    document.getElementById(
        "caracteresHoje"
    );

const ptJaHoje =
    document.getElementById(
        "ptJaHoje"
    );

const jaPtHoje =
    document.getElementById(
        "jaPtHoje"
    );


let registros = [];


/* =========================================================
   DATA HOJE
========================================================= */

function obterDataHoje() {

    const agora =
        new Date();

    const ano =
        agora.getFullYear();

    const mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${ano}-${mes}-${dia}`;

}


/* =========================================================
   CARREGAR
========================================================= */

async function carregarDados() {

    status.style.display =
        "block";

    status.classList.remove(
        "erro"
    );

    status.textContent =
        "Carregando registros...";

    lista.innerHTML =
        "";


    try {

        const referencia =
            collection(
                db,
                "tradutor_estatisticas"
            );


        const consulta =
            query(
                referencia,
                orderBy(
                    "timestamp",
                    "desc"
                ),
                limit(
                    200
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        registros =
            [];


        resultado.forEach(
            function(documento) {

                registros.push(
                    {

                        id:
                            documento.id,

                        ...documento.data()

                    }
                );

            }
        );


        atualizarResumo();

        renderizarLista();


    } catch (
        erro
    ) {

        console.error(
            "Erro ao carregar estatísticas:",
            erro
        );


        status.classList.add(
            "erro"
        );


        status.textContent =
            "Não foi possível carregar os dados.";

    }

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo() {

    const hoje =
        obterDataHoje();


    const registrosHoje =
        registros.filter(
            function(item) {

                return (
                    item.data ===
                    hoje
                );

            }
        );


    totalHoje.textContent =
        registrosHoje.length;


    let totalCaracteres =
        0;

    let totalPtJa =
        0;

    let totalJaPt =
        0;


    registrosHoje.forEach(
        function(item) {

            totalCaracteres +=
                Number(
                    item.caracteres ||
                    0
                );


            if (
                item.origem ===
                "pt"
            ) {

                totalPtJa++;

            }


            if (
                item.origem ===
                "ja"
            ) {

                totalJaPt++;

            }

        }
    );


    caracteresHoje.textContent =
        totalCaracteres;

    ptJaHoje.textContent =
        totalPtJa;

    jaPtHoje.textContent =
        totalJaPt;

}


/* =========================================================
   FILTRO
========================================================= */

function obterRegistrosFiltrados() {

    const valor =
        filtro.value;

    const hoje =
        obterDataHoje();


    if (
        valor ===
        "hoje"
    ) {

        return registros.filter(
            item =>
                item.data ===
                hoje
        );

    }


    if (
        valor ===
        "pt"
    ) {

        return registros.filter(
            item =>
                item.origem ===
                "pt"
        );

    }


    if (
        valor ===
        "ja"
    ) {

        return registros.filter(
            item =>
                item.origem ===
                "ja"
        );

    }


    return registros;

}


/* =========================================================
   LISTA
========================================================= */

function renderizarLista() {

    const dados =
        obterRegistrosFiltrados();


    lista.innerHTML =
        "";


    if (
        dados.length ===
        0
    ) {

        status.style.display =
            "block";

        status.textContent =
            "Nenhum registro encontrado.";

        return;

    }


    status.style.display =
        "none";


    dados.forEach(
        function(item) {

            const elemento =
                document.createElement(
                    "div"
                );


            elemento.className =
                "item";


            const direcao =
                item.origem ===
                "pt"
                    ?
                    "PT → JA"
                    :
                    "JA → PT";


            const romaji =
                item.romaji
                    ?
                    "Sim"
                    :
                    "Não";


            let hora =
                "-";


            if (
                item.timestamp &&
                item.timestamp.toDate
            ) {

                try {

                    const data =
                        item.timestamp.toDate();


                    hora =
                        data.toLocaleTimeString(
                            "pt-BR",
                            {

                                hour:
                                    "2-digit",

                                minute:
                                    "2-digit"

                            }
                        );

                } catch (
                    erro
                ) {

                    hora =
                        "-";

                }

            }


            elemento.innerHTML =
                `

                <div class="item-topo">

                    <div>

                        <div class="item-data">
                            ${escaparHtml(
                                item.data ||
                                "-"
                            )}
                        </div>

                        <div class="item-hora">
                            ${escaparHtml(
                                hora
                            )}
                        </div>

                    </div>

                    <div class="badge">
                        ${direcao}
                    </div>

                </div>


                <div class="info-grid">

                    <div class="info">

                        <div class="rotulo">
                            Caracteres
                        </div>

                        <div class="conteudo">
                            ${Number(
                                item.caracteres ||
                                0
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            Romaji
                        </div>

                        <div class="conteudo">
                            ${romaji}
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            Tipo usuário
                        </div>

                        <div class="conteudo">
                            ${escaparHtml(
                                item.tipoUsuario ||
                                "-"
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            Usuário
                        </div>

                        <div class="conteudo">
                            ${escaparHtml(
                                abreviarId(
                                    item.usuarioId
                                )
                            )}
                        </div>

                    </div>

                </div>

                `;


            lista.appendChild(
                elemento
            );

        }
    );

}


/* =========================================================
   ID ABREVIADO
========================================================= */

function abreviarId(
    valor
) {

    if (
        !valor
    ) {

        return "-";

    }


    const texto =
        String(
            valor
        );


    if (
        texto.length <=
        12
    ) {

        return texto;

    }


    return (
        texto.substring(
            0,
            8
        ) +
        "..."
    );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHtml(
    texto
) {

    return String(
        texto
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   EVENTOS
========================================================= */

btnAtualizar.addEventListener(
    "click",
    carregarDados
);


filtro.addEventListener(
    "change",
    renderizarLista
);


/* =========================================================
   INÍCIO
========================================================= */

carregarDados();

</script>

</body>

</html>

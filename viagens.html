<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazer e Viagens</title>
    <style>
        /* ... [Manter estilos anteriores do Header, Banner e Grid] ... */
        
        /* Novos estilos para os botões de controle */
        .details-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-edit { background: #0d47a1; color: white; }
        .btn-delete { background: #ff5252; color: white; }

        /* ... [Manter o restante dos estilos] ... */
    </style>
</head>
<body>

    <!-- ... [Manter o Header, Banners e Grid anteriores] ... -->

    <!-- Tela de Detalhes da Postagem -->
    <div class="details-overlay" id="detailsView">
        <div class="details-header">
            <button class="back-btn" onclick="closeDetails()">⬅️ Voltar</button>
            <h2 id="detTitleHeader">Detalhes do Local</h2>
            <div style="width: 40px;"></div>
        </div>
        <div class="details-body">
            <div class="details-gallery" id="detailsGalleryContainer">
                <button class="gallery-nav gallery-prev" onclick="prevPhoto()">❮</button>
                <button class="gallery-nav gallery-next" onclick="nextPhoto()">❯</button>
            </div>
            <div class="details-info-box">
                <h3 class="details-title" id="detTitle">Título do Local</h3>
                <p class="details-loc" id="detLocation">📍 Localização</p>
                <p class="details-desc" id="detDesc">Descrição...</p>
                
                <!-- Botões que aparecerão para o dono do post -->
                <div class="details-actions" id="ownerButtons">
                    <button class="btn-action btn-edit" onclick="editPost()">✏️ Editar</button>
                    <button class="btn-action btn-delete" onclick="deletePost()">🗑️ Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ... [Manter o Modal de Publicação e Scripts] ... -->

    <script>
        // Função atualizada para abrir detalhes
        function openDetails(title, location, desc, photos, isOwner = true) {
            document.getElementById('detTitle').innerText = title;
            document.getElementById('detTitleHeader').innerText = title;
            document.getElementById('detLocation').innerText = location;
            document.getElementById('detDesc').innerText = desc;
            
            // Lógica para mostrar botões apenas se for o dono (isOwner)
            const ownerButtons = document.getElementById('ownerButtons');
            ownerButtons.style.display = isOwner ? 'flex' : 'none';
            
            currentPhotos = photos;
            currentPhotoIndex = 0;
            renderGallery();

            document.getElementById('detailsView').style.display = 'block';
        }

        function editPost() {
            alert('Função de editar em construção no Firebase/LIFF!');
        }

        function deletePost() {
            if(confirm('Deseja realmente excluir esta postagem?')) {
                alert('Postagem excluída!');
                closeDetails();
            }
        }

        // ... [Restante do script igual] ...
    </script>
</body>
</html>

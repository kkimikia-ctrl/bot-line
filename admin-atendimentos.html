<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="google" content="notranslate">

<title>Ajuda JP - Atendimentos</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #eef5ff 0%,
            #f8fafc 45%,
            #f1f5f9 100%
        );

    color: #1e293b;
}

button,
select {
    font-family: inherit;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 18px;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {
    margin-bottom: 18px;
}

.header-topo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.voltar {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: white;
    box-shadow:
        0 4px 14px rgba(
            15,
            23,
            42,
            0.08
        );
    font-size: 20px;
    cursor: pointer;
}

.header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header p {
    margin: 5px 0 0;
    color: #64748b;
    font-size: 14px;
}


/* =========================================================
   RESUMO
========================================================= */

.resumo-grid {
    display: grid;
    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );
    gap: 12px;
    margin-bottom: 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.08
        );
}

.card-titulo {
    font-size: 12px;
    color: #64748b;
    font-weight: 800;
}

.card-valor {
    margin-top: 6px;
    font-size: 28px;
    font-weight: 900;
    color: #2563eb;
}


/* =========================================================
   CONTROLES
========================================================= */

.barra {
    background: white;
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 18px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.08
        );
}

.barra-linha {
    display: flex;
    gap: 10px;
    align-items: center;
}

select {
    flex: 1;
    min-width: 0;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    background: white;
}

.btn {
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    background: #2563eb;
    color: white;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
}


/* =========================================================
   LISTA
========================================================= */

.lista {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.atendimento {
    background: white;
    border-radius: 18px;
    padding: 16px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.07
        );
}

.atendimento-topo {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 12px;
}

.cliente-nome {
    font-size: 16px;
    font-weight: 900;
}

.data {
    margin-top: 3px;
    font-size: 12px;
    color: #64748b;
}

.status {
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 900;
    background: #e2e8f0;
    color: #334155;
    white-space: nowrap;
}

.status-aguardando {
    background: #fef3c7;
    color: #92400e;
}

.status-aceito {
    background: #dbeafe;
    color: #1d4ed8;
}

.status-conectado {
    background: #dcfce7;
    color: #166534;
}

.status-finalizado {
    background: #e0f2fe;
    color: #0369a1;
}

.status-cancelado {
    background: #fee2e2;
    color: #b91c1c;
}

.info-grid {
    display: grid;
    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );
    gap: 10px;
}

.info {
    background: #f8fafc;
    border-radius: 12px;
    padding: 10px;
}

.rotulo {
    font-size: 10px;
    color: #64748b;
    font-weight: 800;
}

.valor {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 800;
    word-break: break-word;
}

.separador {
    height: 1px;
    background: #e2e8f0;
    margin: 14px 0 12px;
}

.timeline {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.timeline-item {
    background: #f8fafc;
    border-radius: 11px;
    padding: 9px;
}

.timeline-label {
    font-size: 9px;
    color: #94a3b8;
    font-weight: 800;
}

.timeline-value {
    margin-top: 3px;
    font-size: 12px;
    font-weight: 800;
}


/* =========================================================
   MENSAGEM
========================================================= */

.mensagem {
    text-align: center;
    padding: 30px 15px;
    color: #64748b;
}

.erro {
    color: #b91c1c;
}


/* =========================================================
   MOBILE
========================================================= */

@media (
    max-width: 520px
) {

    .app {
        padding: 14px;
    }

    .header h1 {
        font-size: 22px;
    }

}

</style>

</head>

<body>

<div class="app">


    <div class="header">

        <div class="header-topo">

            <button
                class="voltar"
                onclick="location.href='admin.html'"
            >
                ←
            </button>

            <div>

                <h1>
                    Atendimentos
                </h1>

                <p>
                    Tradutor ao vivo · Ajuda JP
                </p>

            </div>

        </div>

    </div>


    <div class="resumo-grid">

        <div class="card">

            <div class="card-titulo">
                Aguardando
            </div>

            <div
                class="card-valor"
                id="totalAguardando"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-titulo">
                Em atendimento
            </div>

            <div
                class="card-valor"
                id="totalEmAtendimento"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-titulo">
                Finalizados hoje
            </div>

            <div
                class="card-valor"
                id="totalHoje"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-titulo">
                Tempo hoje
            </div>

            <div
                class="card-valor"
                id="tempoHoje"
            >
                0 min
            </div>

        </div>

    </div>


    <div class="barra">

        <div class="barra-linha">

            <select id="filtro">

                <option value="todos">
                    Todos
                </option>

                <option value="aguardando">
                    Aguardando
                </option>

                <option value="aceito">
                    Aceitos
                </option>

                <option value="conectado">
                    Conectados
                </option>

                <option value="finalizado">
                    Finalizados
                </option>

                <option value="cancelado">
                    Cancelados
                </option>

                <option value="hoje">
                    Finalizados hoje
                </option>

            </select>

            <button
                class="btn"
                id="btnAtualizar"
            >
                Atualizar
            </button>

        </div>

    </div>


    <div
        id="mensagem"
        class="mensagem"
    >
        Carregando...
    </div>


    <div
        id="lista"
        class="lista"
    ></div>


</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",

    authDomain:
        "ajuda-jp.firebaseapp.com",

    projectId:
        "ajuda-jp",

    storageBucket:
        "ajuda-jp.firebasestorage.app",

    messagingSenderId:
        "40121072206",

    appId:
        "1:40121072206:web:8a844e632f004f61d0a11f"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


const lista =
    document.getElementById(
        "lista"
    );


const mensagem =
    document.getElementById(
        "mensagem"
    );


const filtro =
    document.getElementById(
        "filtro"
    );


const btnAtualizar =
    document.getElementById(
        "btnAtualizar"
    );


const totalAguardando =
    document.getElementById(
        "totalAguardando"
    );


const totalEmAtendimento =
    document.getElementById(
        "totalEmAtendimento"
    );


const totalHoje =
    document.getElementById(
        "totalHoje"
    );


const tempoHoje =
    document.getElementById(
        "tempoHoje"
    );


let solicitacoes =
    [];


/* =========================================================
   TIMESTAMP
========================================================= */

function timestampParaData(
    timestamp
) {

    if (!timestamp) {
        return null;
    }


    if (
        typeof timestamp.toDate ===
        "function"
    ) {

        return timestamp.toDate();

    }


    if (
        timestamp.seconds
    ) {

        return new Date(
            timestamp.seconds *
            1000
        );

    }


    return null;

}


/* =========================================================
   DATA PRINCIPAL
========================================================= */

function obterDataPrincipal(
    item
) {

    return (
        timestampParaData(
            item.finalizadoEm
        ) ||

        timestampParaData(
            item.conectadoEm
        ) ||

        timestampParaData(
            item.aceitoEm
        ) ||

        timestampParaData(
            item.criadoEm
        ) ||

        timestampParaData(
            item.timestamp
        ) ||

        timestampParaData(
            item.atualizadoEm
        ) ||

        null
    );

}


/* =========================================================
   HOJE
========================================================= */

function mesmaData(
    dataA,
    dataB
) {

    return (
        dataA.getFullYear() ===
        dataB.getFullYear() &&

        dataA.getMonth() ===
        dataB.getMonth() &&

        dataA.getDate() ===
        dataB.getDate()
    );

}


/* =========================================================
   DURAÇÃO
========================================================= */

function calcularDuracaoSegundos(
    item
) {

    const inicio =
        timestampParaData(
            item.conectadoEm
        );


    const fim =
        timestampParaData(
            item.finalizadoEm
        );


    if (
        !inicio ||
        !fim
    ) {

        return 0;

    }


    return Math.max(
        0,
        Math.floor(
            (
                fim.getTime() -
                inicio.getTime()
            ) / 1000
        )
    );

}


function formatarDuracao(
    segundos
) {

    if (!segundos) {
        return "0 min";
    }


    const minutos =
        Math.floor(
            segundos / 60
        );


    const resto =
        segundos % 60;


    if (
        minutos ===
        0
    ) {

        return resto + " seg";

    }


    if (
        resto ===
        0
    ) {

        return minutos + " min";

    }


    return (
        minutos +
        " min " +
        resto +
        " seg"
    );

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarDataHora(
    timestamp
) {

    const data =
        timestampParaData(
            timestamp
        );


    if (!data) {
        return "-";
    }


    try {

        return new Intl.DateTimeFormat(
            "pt-BR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(
            data
        );

    }
    catch {

        return data.toLocaleString();

    }

}


/* =========================================================
   CARREGAR
========================================================= */

async function carregar() {

    mensagem.style.display =
        "block";


    mensagem.classList.remove(
        "erro"
    );


    mensagem.textContent =
        "Carregando atendimentos...";


    lista.innerHTML =
        "";


    try {

        const resultado =
            await getDocs(
                collection(
                    db,
                    "solicitacoes"
                )
            );


        solicitacoes =
            [];


        resultado.forEach(
            function(documento) {

                solicitacoes.push(
                    {

                        id:
                            documento.id,

                        ...documento.data()

                    }
                );

            }
        );


        solicitacoes.sort(
            function(a,b) {

                const dataA =
                    obterDataPrincipal(
                        a
                    );


                const dataB =
                    obterDataPrincipal(
                        b
                    );


                const valorA =
                    dataA
                        ?
                        dataA.getTime()
                        :
                        0;


                const valorB =
                    dataB
                        ?
                        dataB.getTime()
                        :
                        0;


                return (
                    valorB -
                    valorA
                );

            }
        );


        atualizarResumo();

        renderizar();


    }
    catch (
        erro
    ) {

        console.error(
            "Erro ao carregar solicitações:",
            erro
        );


        mensagem.classList.add(
            "erro"
        );


        mensagem.textContent =
            "Não foi possível carregar os atendimentos.";

    }

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo() {

    const hoje =
        new Date();


    let aguardando =
        0;


    let emAtendimento =
        0;


    let finalizadosHoje =
        0;


    let segundosHoje =
        0;


    solicitacoes.forEach(
        function(item) {

            const status =
                String(
                    item.status ||
                    ""
                ).toLowerCase();


            if (
                status ===
                "aguardando"
            ) {

                aguardando++;

            }


            if (
                status ===
                "aceito" ||
                status ===
                "conectado"
            ) {

                emAtendimento++;

            }


            if (
                status ===
                "finalizado"
            ) {

                const finalizado =
                    timestampParaData(
                        item.finalizadoEm
                    );


                if (
                    finalizado &&
                    mesmaData(
                        finalizado,
                        hoje
                    )
                ) {

                    finalizadosHoje++;


                    segundosHoje +=
                        calcularDuracaoSegundos(
                            item
                        );

                }

            }

        }
    );


    totalAguardando.textContent =
        aguardando;


    totalEmAtendimento.textContent =
        emAtendimento;


    totalHoje.textContent =
        finalizadosHoje;


    const minutos =
        Math.floor(
            segundosHoje / 60
        );


    if (
        minutos <
        60
    ) {

        tempoHoje.textContent =
            minutos +
            " min";

    }
    else {

        const horas =
            Math.floor(
                minutos / 60
            );


        const resto =
            minutos %
            60;


        tempoHoje.textContent =
            horas +
            "h " +
            resto +
            "m";

    }

}


/* =========================================================
   FILTRO
========================================================= */

function obterFiltrados() {

    const valor =
        filtro.value;


    if (
        valor ===
        "todos"
    ) {

        return solicitacoes;

    }


    if (
        valor ===
        "hoje"
    ) {

        const hoje =
            new Date();


        return solicitacoes.filter(
            function(item) {

                if (
                    item.status !==
                    "finalizado"
                ) {

                    return false;

                }


                const finalizado =
                    timestampParaData(
                        item.finalizadoEm
                    );


                return (
                    finalizado &&
                    mesmaData(
                        finalizado,
                        hoje
                    )
                );

            }
        );

    }


    return solicitacoes.filter(
        function(item) {

            return (
                String(
                    item.status ||
                    ""
                ).toLowerCase() ===
                valor
            );

        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function obterClasseStatus(
    status
) {

    const texto =
        String(
            status ||
            ""
        ).toLowerCase();


    if (
        texto ===
        "aguardando"
    ) {

        return "status-aguardando";

    }


    if (
        texto ===
        "aceito"
    ) {

        return "status-aceito";

    }


    if (
        texto ===
        "conectado"
    ) {

        return "status-conectado";

    }


    if (
        texto ===
        "finalizado"
    ) {

        return "status-finalizado";

    }


    if (
        texto ===
        "cancelado"
    ) {

        return "status-cancelado";

    }


    return "";

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar() {

    const dados =
        obterFiltrados();


    lista.innerHTML =
        "";


    if (
        dados.length ===
        0
    ) {

        mensagem.style.display =
            "block";


        mensagem.textContent =
            "Nenhum atendimento encontrado.";


        return;

    }


    mensagem.style.display =
        "none";


    dados.forEach(
        function(item) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "atendimento";


            const nome =
                item.clienteNome ||
                item.cliente ||
                "Cliente";


            const local =
                item.local ||
                "Não informado";


            const tempo =
                Number(
                    item.tempoMinutos ||
                    item.tempo ||
                    30
                );


            const tradutor =
                item.tradutorNome ||
                item.tradutor ||
                "-";


            const status =
                item.status ||
                "-";


            const criadoEm =
                item.criadoEm ||
                item.timestamp ||
                null;


            const dataPrincipal =
                obterDataPrincipal(
                    item
                );


            let dataTopo =
                "-";


            if (
                dataPrincipal
            ) {

                try {

                    dataTopo =
                        new Intl.DateTimeFormat(
                            "pt-BR",
                            {
                                day:
                                    "2-digit",

                                month:
                                    "2-digit",

                                year:
                                    "numeric",

                                hour:
                                    "2-digit",

                                minute:
                                    "2-digit"
                            }
                        ).format(
                            dataPrincipal
                        );

                }
                catch {

                    dataTopo =
                        dataPrincipal.toLocaleString();

                }

            }


            const duracao =
                formatarDuracao(
                    calcularDuracaoSegundos(
                        item
                    )
                );


            card.innerHTML =
                `

                <div class="atendimento-topo">

                    <div>

                        <div class="cliente-nome">
                            ${escaparHTML(
                                nome
                            )}
                        </div>

                        <div class="data">
                            ${escaparHTML(
                                dataTopo
                            )}
                        </div>

                    </div>


                    <div class="status ${obterClasseStatus(
                        status
                    )}">
                        ${escaparHTML(
                            status
                        )}
                    </div>

                </div>


                <div class="info-grid">


                    <div class="info">

                        <div class="rotulo">
                            LOCAL
                        </div>

                        <div class="valor">
                            📍 ${escaparHTML(
                                local
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            TEMPO SOLICITADO
                        </div>

                        <div class="valor">
                            ⏱️ ${tempo} min
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            TRADUTOR
                        </div>

                        <div class="valor">
                            ${escaparHTML(
                                tradutor
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            DURAÇÃO REAL
                        </div>

                        <div class="valor">
                            ${escaparHTML(
                                duracao
                            )}
                        </div>

                    </div>


                </div>


                <div class="separador"></div>


                <div class="timeline">


                    <div class="timeline-item">

                        <div class="timeline-label">
                            SOLICITADO
                        </div>

                        <div class="timeline-value">
                            ${escaparHTML(
                                formatarDataHora(
                                    criadoEm
                                )
                            )}
                        </div>

                    </div>


                    <div class="timeline-item">

                        <div class="timeline-label">
                            ACEITO
                        </div>

                        <div class="timeline-value">
                            ${escaparHTML(
                                formatarDataHora(
                                    item.aceitoEm
                                )
                            )}
                        </div>

                    </div>


                    <div class="timeline-item">

                        <div class="timeline-label">
                            CONECTADO
                        </div>

                        <div class="timeline-value">
                            ${escaparHTML(
                                formatarDataHora(
                                    item.conectadoEm
                                )
                            )}
                        </div>

                    </div>


                    <div class="timeline-item">

                        <div class="timeline-label">
                            FINALIZADO
                        </div>

                        <div class="timeline-value">
                            ${escaparHTML(
                                formatarDataHora(
                                    item.finalizadoEm
                                )
                            )}
                        </div>

                    </div>


                </div>

                `;


            lista.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(
    valor
) {

    return String(
        valor ??
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   EVENTOS
========================================================= */

btnAtualizar.addEventListener(
    "click",
    carregar
);


filtro.addEventListener(
    "change",
    renderizar
);


/* =========================================================
   INÍCIO
========================================================= */

carregar();

</script>

</body>

</html>

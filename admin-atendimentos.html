/* =========================================================
   TIMESTAMP
========================================================= */

function timestampParaData(timestamp) {

    if (!timestamp) {
        return null;
    }

    if (
        typeof timestamp.toDate ===
        "function"
    ) {
        return timestamp.toDate();
    }

    if (timestamp.seconds) {
        return new Date(
            timestamp.seconds * 1000
        );
    }

    return null;

}


/* =========================================================
   DATAS
========================================================= */

function obterDataPrincipal(item) {

    return (
        timestampParaData(item.finalizadoEm) ||
        timestampParaData(item.conectadoEm) ||
        timestampParaData(item.aceitoEm) ||
        timestampParaData(item.criadoEm) ||
        timestampParaData(item.timestamp) ||
        timestampParaData(item.atualizadoEm) ||
        null
    );

}


function obterDataCriacao(item) {

    return (
        timestampParaData(item.criadoEm) ||
        timestampParaData(item.timestamp) ||
        timestampParaData(item.aceitoEm) ||
        obterDataPrincipal(item)
    );

}


/* =========================================================
   DURAÇÃO
========================================================= */

function calcularDuracaoSegundos(item) {

    const inicio =
        timestampParaData(
            item.conectadoEm
        ) ||
        timestampParaData(
            item.aceitoEm
        );


    const fim =
        timestampParaData(
            item.finalizadoEm
        );


    if (!inicio || !fim) {
        return 0;
    }


    return Math.max(
        0,
        Math.floor(
            (
                fim.getTime() -
                inicio.getTime()
            ) / 1000
        )
    );

}


function formatarDuracao(segundos) {

    if (!segundos) {
        return "0 min";
    }


    const horas =
        Math.floor(
            segundos / 3600
        );


    const minutos =
        Math.floor(
            (segundos % 3600) / 60
        );


    const resto =
        segundos % 60;


    if (horas > 0) {

        if (minutos > 0) {
            return horas + "h " + minutos + "m";
        }

        return horas + "h";
    }


    if (minutos > 0) {

        if (resto > 0) {
            return minutos + " min " + resto + " seg";
        }

        return minutos + " min";
    }


    return resto + " seg";

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarDataObjeto(data) {

    try {

        return new Intl.DateTimeFormat(
            "pt-BR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(data);

    }
    catch {

        return data.toLocaleString();

    }

}


function formatarDataHora(timestamp) {

    const data =
        timestampParaData(
            timestamp
        );


    if (!data) {
        return "-";
    }


    return formatarDataObjeto(data);

}


/* =========================================================
   INTERVALO
========================================================= */

function inicioDoDia(data) {

    const resultado =
        new Date(data);

    resultado.setHours(
        0,
        0,
        0,
        0
    );

    return resultado;

}


function fimDoDia(data) {

    const resultado =
        new Date(data);

    resultado.setHours(
        23,
        59,
        59,
        999
    );

    return resultado;

}


function obterIntervaloPeriodo() {

    const valor =
        periodo.value;


    const agora =
        new Date();


    if (valor === "todos") {

        return {
            inicio: null,
            fim: null,
            texto: "Todos os registros"
        };

    }


    if (valor === "hoje") {

        return {
            inicio: inicioDoDia(agora),
            fim: fimDoDia(agora),
            texto: "Hoje"
        };

    }


    if (valor === "mes") {

        const escolhido =
            mesEscolhido.value;


        if (!escolhido) {
            return null;
        }


        const partes =
            escolhido.split("-");


        const ano =
            Number(partes[0]);


        const mes =
            Number(partes[1]);


        const inicio =
            new Date(
                ano,
                mes - 1,
                1,
                0,
                0,
                0,
                0
            );


        const fim =
            new Date(
                ano,
                mes,
                0,
                23,
                59,
                59,
                999
            );


        let texto =
            new Intl.DateTimeFormat(
                "pt-BR",
                {
                    month: "long",
                    year: "numeric"
                }
            ).format(inicio);


        texto =
            texto.charAt(0).toUpperCase() +
            texto.slice(1);


        return {
            inicio,
            fim,
            texto
        };

    }


    let meses = 1;
    let texto = "Último 1 mês";


    if (valor === "3meses") {
        meses = 3;
        texto = "Últimos 3 meses";
    }


    if (valor === "6meses") {
        meses = 6;
        texto = "Últimos 6 meses";
    }


    if (valor === "1ano") {
        meses = 12;
        texto = "Último 1 ano";
    }


    const inicio =
        new Date(agora);


    inicio.setMonth(
        inicio.getMonth() - meses
    );


    inicio.setHours(
        0,
        0,
        0,
        0
    );


    return {
        inicio,
        fim: agora,
        texto
    };

}


/* =========================================================
   FILTRO DE PERÍODO
========================================================= */

function estaNoPeriodo(item, intervalo) {

    const data =
        obterDataCriacao(item);


    if (!data) {
        return false;
    }


    if (
        !intervalo.inicio &&
        !intervalo.fim
    ) {
        return true;
    }


    if (
        intervalo.inicio &&
        data < intervalo.inicio
    ) {
        return false;
    }


    if (
        intervalo.fim &&
        data > intervalo.fim
    ) {
        return false;
    }


    return true;

}


/* =========================================================
   CARREGAR
========================================================= */

async function carregar() {

    mensagem.style.display =
        "block";


    mensagem.classList.remove(
        "erro"
    );


    mensagem.textContent =
        "Carregando atendimentos...";


    lista.innerHTML =
        "";


    try {

        const resultado =
            await getDocs(
                collection(
                    db,
                    "solicitacoes"
                )
            );


        solicitacoes =
            [];


        resultado.forEach(
            documento => {

                solicitacoes.push(
                    {
                        id:
                            documento.id,

                        ...documento.data()
                    }
                );

            }
        );


        solicitacoes.sort(
            (a,b) => {

                const dataA =
                    obterDataPrincipal(a);


                const dataB =
                    obterDataPrincipal(b);


                return (
                    (dataB ? dataB.getTime() : 0) -
                    (dataA ? dataA.getTime() : 0)
                );

            }
        );


        atualizarTudo();

    }
    catch (erro) {

        console.error(
            erro
        );


        mensagem.classList.add(
            "erro"
        );


        mensagem.textContent =
            "Não foi possível carregar os atendimentos.";

    }

}


/* =========================================================
   SITUAÇÃO ATUAL
========================================================= */

function atualizarAgora() {

    let aguardando = 0;
    let atendimento = 0;


    solicitacoes.forEach(
        item => {

            const status =
                String(
                    item.status ||
                    ""
                ).toLowerCase();


            if (
                status ===
                "aguardando"
            ) {
                aguardando++;
            }


            if (
                status ===
                "aceito" ||
                status ===
                "conectado"
            ) {
                atendimento++;
            }

        }
    );


    agoraAguardando.textContent =
        aguardando;


    agoraAtendimento.textContent =
        atendimento;

}


/* =========================================================
   DADOS FILTRADOS
========================================================= */

function obterDadosDoPeriodo() {

    const intervalo =
        obterIntervaloPeriodo();


    if (!intervalo) {
        return null;
    }


    const status =
        statusFiltro.value;


    let dados =
        solicitacoes.filter(
            item =>
                estaNoPeriodo(
                    item,
                    intervalo
                )
        );


    if (status !== "todos") {

        dados =
            dados.filter(
                item =>
                    String(
                        item.status ||
                        ""
                    ).toLowerCase() ===
                    status
            );

    }


    return {
        intervalo,
        dados
    };

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo(dadosPeriodo) {

    const dados =
        dadosPeriodo.dados;


    const intervalo =
        dadosPeriodo.intervalo;


    let finalizados = 0;
    let segundos = 0;


    dados.forEach(
        item => {

            if (
                String(
                    item.status ||
                    ""
                ).toLowerCase() ===
                "finalizado"
            ) {

                finalizados++;


                segundos +=
                    calcularDuracaoSegundos(
                        item
                    );

            }

        }
    );


    totalPeriodo.textContent =
        dados.length;


    finalizadosPeriodo.textContent =
        finalizados;


    tempoPeriodo.textContent =
        formatarDuracao(
            segundos
        );


    const media =
        finalizados > 0
            ?
            Math.floor(
                segundos /
                finalizados
            )
            :
            0;


    mediaPeriodo.textContent =
        formatarDuracao(
            media
        );


    textosPeriodo.forEach(
        elemento => {

            elemento.textContent =
                intervalo.texto;

        }
    );

}


/* =========================================================
   RANKING
========================================================= */

function atualizarRanking(dadosPeriodo) {

    const mapa =
        {};


    dadosPeriodo.dados.forEach(
        item => {

            if (
                String(
                    item.status ||
                    ""
                ).toLowerCase() !==
                "finalizado"
            ) {
                return;
            }


            const nome =
                item.tradutorNome ||
                item.tradutor ||
                "Sem tradutor";


            if (!mapa[nome]) {

                mapa[nome] = {
                    nome,
                    total: 0,
                    segundos: 0
                };

            }


            mapa[nome].total++;


            mapa[nome].segundos +=
                calcularDuracaoSegundos(
                    item
                );

        }
    );


    const ranking =
        Object.values(
            mapa
        )
        .sort(
            (a,b) =>
                b.total -
                a.total
        );


    rankingTradutores.innerHTML =
        "";


    if (
        ranking.length ===
        0
    ) {

        rankingTradutores.innerHTML = `

            <div class="mensagem">
                Nenhum tradutor com atendimento finalizado neste período.
            </div>

        `;

        return;

    }


    ranking.forEach(
        (item,index) => {

            const media =
                item.total > 0
                    ?
                    Math.floor(
                        item.segundos /
                        item.total
                    )
                    :
                    0;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "ranking-item";


            div.innerHTML = `

                <div class="ranking-topo">

                    <div class="ranking-nome">
                        ${escaparHTML(
                            item.nome
                        )}
                    </div>

                    <div class="ranking-posicao">
                        ${index + 1}
                    </div>

                </div>

                <div class="ranking-grid">

                    <div class="ranking-info">

                        <span class="ranking-label">
                            ATENDIMENTOS
                        </span>

                        <span class="ranking-valor">
                            ${item.total}
                        </span>

                    </div>

                    <div class="ranking-info">

                        <span class="ranking-label">
                            TEMPO
                        </span>

                        <span class="ranking-valor">
                            ${escaparHTML(
                                formatarDuracao(
                                    item.segundos
                                )
                            )}
                        </span>

                    </div>

                    <div class="ranking-info">

                        <span class="ranking-label">
                            MÉDIA
                        </span>

                        <span class="ranking-valor">
                            ${escaparHTML(
                                formatarDuracao(
                                    media
                                )
                            )}
                        </span>

                    </div>

                </div>

            `;


            rankingTradutores.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   RESUMO POR MÊS
========================================================= */

function atualizarResumoMeses(dadosPeriodo) {

    const valor =
        periodo.value;


    if (
        valor !== "6meses" &&
        valor !== "1ano"
    ) {

        secaoMeses.style.display =
            "none";

        return;

    }


    secaoMeses.style.display =
        "block";


    const mapa =
        {};


    dadosPeriodo.dados.forEach(
        item => {

            const data =
                obterDataCriacao(
                    item
                );


            if (!data) {
                return;
            }


            const chave =
                data.getFullYear() +
                "-" +
                String(
                    data.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            if (!mapa[chave]) {

                mapa[chave] = {
                    chave,
                    total: 0,
                    data
                };

            }


            mapa[chave].total++;

        }
    );


    const meses =
        Object.values(
            mapa
        )
        .sort(
            (a,b) =>
                a.chave.localeCompare(
                    b.chave
                )
        );


    listaMeses.innerHTML =
        "";


    if (
        meses.length ===
        0
    ) {

        listaMeses.innerHTML = `

            <div class="mensagem">
                Nenhum registro no período.
            </div>

        `;

        return;

    }


    meses.forEach(
        item => {

            let nome =
                new Intl.DateTimeFormat(
                    "pt-BR",
                    {
                        month:
                            "long",

                        year:
                            "numeric"
                    }
                ).format(
                    item.data
                );


            nome =
                nome.charAt(0).toUpperCase() +
                nome.slice(1);


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "mes-item";


            div.innerHTML = `

                <span class="mes-nome">
                    ${escaparHTML(
                        nome
                    )}
                </span>

                <span class="mes-total">
                    ${item.total}
                </span>

            `;


            listaMeses.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function obterClasseStatus(status) {

    const texto =
        String(
            status ||
            ""
        ).toLowerCase();


    if (texto === "aguardando") {
        return "status-aguardando";
    }


    if (texto === "aceito") {
        return "status-aceito";
    }


    if (texto === "conectado") {
        return "status-conectado";
    }


    if (texto === "finalizado") {
        return "status-finalizado";
    }


    if (texto === "cancelado") {
        return "status-cancelado";
    }


    return "";

}


/* =========================================================
   ATENDIMENTO TRAVADO
========================================================= */

function verificarTravado(item) {

    const status =
        String(
            item.status ||
            ""
        ).toLowerCase();


    if (
        status !== "aceito" &&
        status !== "conectado"
    ) {
        return null;
    }


    const inicio =
        timestampParaData(
            item.conectadoEm
        ) ||
        timestampParaData(
            item.aceitoEm
        );


    if (!inicio) {
        return null;
    }


    const agora =
        new Date();


    const diferenca =
        agora.getTime() -
        inicio.getTime();


    const horas =
        diferenca /
        (
            1000 *
            60 *
            60
        );


    if (horas < 3) {
        return null;
    }


    if (horas < 24) {

        return (
            "⚠️ Possivelmente travado há " +
            Math.floor(horas) +
            " hora(s)"
        );

    }


    const dias =
        Math.floor(
            horas /
            24
        );


    return (
        "⚠️ Possivelmente travado há " +
        dias +
        " dia(s)"
    );

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar(dadosPeriodo) {

    const dados =
        dadosPeriodo.dados;


    lista.innerHTML =
        "";


    if (
        dados.length ===
        0
    ) {

        mensagem.style.display =
            "block";


        mensagem.textContent =
            "Nenhum atendimento encontrado neste período.";


        return;

    }


    mensagem.style.display =
        "none";


    dados.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );


            const avisoTravado =
                verificarTravado(
                    item
                );


            card.className =
                avisoTravado
                    ?
                    "atendimento travado"
                    :
                    "atendimento";


            const nome =
                item.clienteNome ||
                item.cliente ||
                "Cliente";


            const local =
                item.local ||
                "Não informado";


            const tempo =
                Number(
                    item.tempoMinutos ||
                    item.tempo ||
                    30
                );


            const tradutor =
                item.tradutorNome ||
                item.tradutor ||
                "-";


            const status =
                item.status ||
                "-";


            const criadoEm =
                item.criadoEm ||
                item.timestamp ||
                null;


            const dataPrincipal =
                obterDataPrincipal(
                    item
                );


            const dataTopo =
                dataPrincipal
                    ?
                    formatarDataObjeto(
                        dataPrincipal
                    )
                    :
                    "-";


            const duracao =
                formatarDuracao(
                    calcularDuracaoSegundos(
                        item
                    )
                );


            card.innerHTML = `

                <div class="atendimento-topo">

                    <div>

                        <div class="cliente-nome">
                            ${escaparHTML(
                                nome
                            )}
                        </div>

                        <div class="data">
                            ${escaparHTML(
                                dataTopo
                            )}
                        </div>

                    </div>

                    <div class="status ${obterClasseStatus(
                        status
                    )}">
                        ${escaparHTML(
                            status
                        )}
                    </div>

                </div>

                ${
                    avisoTravado
                    ?
                    `
                    <div class="aviso-travado">
                        ${escaparHTML(
                            avisoTravado
                        )}
                    </div>
                    `
                    :
                    ""
                }

                <div class="info-grid">

                    <div class="info">

                        <div class="rotulo">
                            LOCAL
                        </div>

                        <div class="valor">
                            📍 ${escaparHTML(
                                local
                            )}
                        </div>

                    </div>

                    <div class="info">

                        <div class="rotulo">
                            TEMPO SOLICITADO
                        </div>

                        <div class="valor">
                            ⏱️ ${tempo} min
                        </div>

                    </div>

                    <div class="info">

                        <div class="rotulo">
                            TRADUTOR
                        </div>

                        <div class="valor">
                            ${escaparHTML(
                                tradutor
                            )}
                        </div>

                    </div>

                    <div class="info">

                        <div class="rotulo">
                            DURAÇÃO REAL
                        </div>

                        <div class="valor">
                            ${escaparHTML(
                                duracao
                            )}
                        </div>

                    </div>

                </div>

                <div class="separador"></div>

                <div class="timeline">

                    <div class="timeline-item">

                        <div class="timeline-label">
                            SOLICITADO
                        </div>

                        <div class="timeline-value">
                            ${escaparHTML(
                                formatarDataHora(
                                    criadoEm
                                )
                            )}
                        </div>

                    </div>

                    <div class="timeline-item">

                        <div class="timeline-label">
                            ACEITO
                        </div>

                        <div class="timeline-value">
                            ${escaparHTML(
                                formatarDataHora(
                                    item.aceitoEm
                                )
                            )}
                        </div>

                    </div>

                    <div class="timeline-item">

                        <div class="timeline-label">
                            CONECTADO
                        </div>

                        <div class="timeline-value">
                            ${escaparHTML(
                                formatarDataHora(
                                    item.conectadoEm
                                )
                            )}
                        </div>

                    </div>

                    <div class="timeline-item">

                        <div class="timeline-label">
                            FINALIZADO
                        </div>

                        <div class="timeline-value">
                            ${escaparHTML(
                                formatarDataHora(
                                    item.finalizadoEm
                                )
                            )}
                        </div>

                    </div>

                </div>

            `;


            lista.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   ATUALIZAR TUDO
========================================================= */

function atualizarTudo() {

    atualizarAgora();


    const dadosPeriodo =
        obterDadosDoPeriodo();


    if (!dadosPeriodo) {

        mensagem.style.display =
            "block";


        mensagem.textContent =
            "Escolha o mês que deseja consultar.";


        lista.innerHTML =
            "";


        rankingTradutores.innerHTML =
            "";


        secaoMeses.style.display =
            "none";


        return;

    }


    atualizarResumo(
        dadosPeriodo
    );


    atualizarRanking(
        dadosPeriodo
    );


    atualizarResumoMeses(
        dadosPeriodo
    );


    renderizar(
        dadosPeriodo
    );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(valor) {

    return String(
        valor ??
        ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   EVENTOS
========================================================= */

periodo.addEventListener(
    "change",
    function() {

        blocoMes.style.display =
            periodo.value ===
            "mes"
                ?
                "block"
                :
                "none";


        atualizarTudo();

    }
);


mesEscolhido.addEventListener(
    "change",
    atualizarTudo
);


statusFiltro.addEventListener(
    "change",
    atualizarTudo
);


btnAtualizar.addEventListener(
    "click",
    carregar
);


/* =========================================================
   MÊS PADRÃO
========================================================= */

const agora =
    new Date();


mesEscolhido.value =
    agora.getFullYear() +
    "-" +
    String(
        agora.getMonth() + 1
    ).padStart(
        2,
        "0"
    );


/* =========================================================
   INICIAR
========================================================= */

carregar();

</script>

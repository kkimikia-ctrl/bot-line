<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="google" content="notranslate">

<title>Ajuda JP - Atendimentos</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #eef5ff 0%,
            #f8fafc 45%,
            #f1f5f9 100%
        );

    color: #1e293b;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 18px;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {
    margin-bottom: 18px;
}

.header-topo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.voltar {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: white;
    box-shadow:
        0 4px 14px rgba(
            15,
            23,
            42,
            0.08
        );
    font-size: 20px;
    cursor: pointer;
}

.header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header p {
    margin: 5px 0 0;
    color: #64748b;
    font-size: 14px;
}


/* =========================================================
   RESUMO
========================================================= */

.resumo-grid {
    display: grid;
    grid-template-columns: repeat(
        2,
        minmax(
            0,
            1fr
        )
    );
    gap: 12px;
    margin-bottom: 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.08
        );
}

.card-titulo {
    font-size: 13px;
    color: #64748b;
    font-weight: 700;
}

.card-valor {
    margin-top: 6px;
    font-size: 28px;
    font-weight: 800;
    color: #2563eb;
}


/* =========================================================
   CONTROLES
========================================================= */

.barra {
    background: white;
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 18px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.08
        );
}

.barra-linha {
    display: flex;
    gap: 10px;
}

select {
    flex: 1;
    min-width: 0;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    background: white;
}

.btn {
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    background: #2563eb;
    color: white;
    font-weight: 800;
    font-size: 14px;
}


/* =========================================================
   ATENDIMENTOS
========================================================= */

.lista {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.atendimento {
    background: white;
    border-radius: 18px;
    padding: 16px;
    box-shadow:
        0 5px 20px rgba(
            15,
            23,
            42,
            0.07
        );
}

.atendimento-topo {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
}

.data {
    font-weight: 800;
    font-size: 15px;
}

.hora {
    margin-top: 3px;
    color: #64748b;
    font-size: 12px;
}

.status {
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    background: #e2e8f0;
    color: #334155;
}

.status-aguardando {
    background: #fef3c7;
    color: #92400e;
}

.status-andamento {
    background: #dbeafe;
    color: #1d4ed8;
}

.status-finalizado {
    background: #dcfce7;
    color: #166534;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(
        2,
        minmax(
            0,
            1fr
        )
    );
    gap: 10px;
}

.info {
    background: #f8fafc;
    border-radius: 12px;
    padding: 10px;
}

.rotulo {
    font-size: 11px;
    color: #64748b;
    font-weight: 700;
}

.valor {
    margin-top: 4px;
    font-size: 14px;
    font-weight: 700;
    word-break: break-word;
}


/* =========================================================
   STATUS DA PÁGINA
========================================================= */

.mensagem {
    text-align: center;
    padding: 30px 15px;
    color: #64748b;
}

.erro {
    color: #b91c1c;
}

@media (
    max-width: 520px
) {

    .app {
        padding: 14px;
    }

    .header h1 {
        font-size: 22px;
    }

}

</style>

</head>

<body>

<div class="app">


    <div class="header">

        <div class="header-topo">

            <button
                class="voltar"
                onclick="location.href='admin.html'"
            >
                ←
            </button>

            <div>

                <h1>
                    Atendimentos
                </h1>

                <p>
                    Tradutor ao vivo · Ajuda JP
                </p>

            </div>

        </div>

    </div>


    <div class="resumo-grid">

        <div class="card">

            <div class="card-titulo">
                Total
            </div>

            <div
                class="card-valor"
                id="total"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-titulo">
                Hoje
            </div>

            <div
                class="card-valor"
                id="totalHoje"
            >
                0
            </div>

        </div>

    </div>


    <div class="barra">

        <div class="barra-linha">

            <select id="filtro">

                <option value="todos">
                    Todos
                </option>

                <option value="hoje">
                    Somente hoje
                </option>

                <option value="aguardando">
                    Aguardando
                </option>

                <option value="andamento">
                    Em andamento
                </option>

                <option value="finalizado">
                    Finalizados
                </option>

            </select>

            <button
                class="btn"
                id="btnAtualizar"
            >
                Atualizar
            </button>

        </div>

    </div>


    <div
        id="mensagem"
        class="mensagem"
    >
        Carregando...
    </div>


    <div
        id="lista"
        class="lista"
    ></div>


</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCTQTWEyj8f-Ddkj6PD9Fe8JHCVVjmkS_o",

    authDomain:
        "ajuda-jp.firebaseapp.com",

    projectId:
        "ajuda-jp",

    storageBucket:
        "ajuda-jp.firebasestorage.app",

    messagingSenderId:
        "40121072206",

    appId:
        "1:40121072206:web:8a844e632f004f61d0a11f"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


const lista =
    document.getElementById(
        "lista"
    );


const mensagem =
    document.getElementById(
        "mensagem"
    );


const filtro =
    document.getElementById(
        "filtro"
    );


const btnAtualizar =
    document.getElementById(
        "btnAtualizar"
    );


const total =
    document.getElementById(
        "total"
    );


const totalHoje =
    document.getElementById(
        "totalHoje"
    );


let atendimentos =
    [];


/* =========================================================
   HOJE
========================================================= */

function obterHoje() {

    const agora =
        new Date();


    const ano =
        agora.getFullYear();


    const mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${ano}-${mes}-${dia}`;

}


/* =========================================================
   CONVERTER DATA
========================================================= */

function obterDataRegistro(
    item
) {

    const campos =
        [
            item.criadoEm,
            item.timestamp,
            item.dataCriacao,
            item.createdAt
        ];


    for (
        const campo of campos
    ) {

        if (
            campo &&
            typeof campo.toDate ===
            "function"
        ) {

            return campo.toDate();

        }

    }


    if (
        item.data
    ) {

        const data =
            new Date(
                item.data
            );


        if (
            !isNaN(
                data.getTime()
            )
        ) {

            return data;

        }

    }


    return null;

}


/* =========================================================
   CARREGAR
========================================================= */

async function carregarAtendimentos() {

    mensagem.style.display =
        "block";


    mensagem.classList.remove(
        "erro"
    );


    mensagem.textContent =
        "Carregando atendimentos...";


    lista.innerHTML =
        "";


    try {

        const resultado =
            await getDocs(
                collection(
                    db,
                    "atendimentos"
                )
            );


        atendimentos =
            [];


        resultado.forEach(
            function(documento) {

                const dados =
                    documento.data();


                atendimentos.push(
                    {

                        id:
                            documento.id,

                        ...dados

                    }
                );

            }
        );


        /* MAIS NOVOS PRIMEIRO */

        atendimentos.sort(
            function(a, b) {

                const dataA =
                    obterDataRegistro(
                        a
                    );


                const dataB =
                    obterDataRegistro(
                        b
                    );


                const valorA =
                    dataA
                        ?
                        dataA.getTime()
                        :
                        0;


                const valorB =
                    dataB
                        ?
                        dataB.getTime()
                        :
                        0;


                return (
                    valorB -
                    valorA
                );

            }
        );


        atualizarResumo();

        renderizar();


    } catch (
        erro
    ) {

        console.error(
            erro
        );


        mensagem.classList.add(
            "erro"
        );


        mensagem.textContent =
            "Erro ao carregar atendimentos.";

    }

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo() {

    total.textContent =
        atendimentos.length;


    const hoje =
        obterHoje();


    let quantidadeHoje =
        0;


    atendimentos.forEach(
        function(item) {

            const data =
                obterDataRegistro(
                    item
                );


            if (
                data
            ) {

                const dataFormatada =
                    formatarDataBanco(
                        data
                    );


                if (
                    dataFormatada ===
                    hoje
                ) {

                    quantidadeHoje++;

                }

            }

        }
    );


    totalHoje.textContent =
        quantidadeHoje;

}


/* =========================================================
   FILTRAR
========================================================= */

function obterFiltrados() {

    const valor =
        filtro.value;


    if (
        valor ===
        "todos"
    ) {

        return atendimentos;

    }


    if (
        valor ===
        "hoje"
    ) {

        const hoje =
            obterHoje();


        return atendimentos.filter(
            function(item) {

                const data =
                    obterDataRegistro(
                        item
                    );


                return (
                    data &&
                    formatarDataBanco(
                        data
                    ) ===
                    hoje
                );

            }
        );

    }


    return atendimentos.filter(
        function(item) {

            const status =
                String(
                    item.status ||
                    item.estado ||
                    ""
                )
                .toLowerCase();


            if (
                valor ===
                "andamento"
            ) {

                return (
                    status.includes(
                        "andamento"
                    ) ||
                    status.includes(
                        "atendimento"
                    ) ||
                    status.includes(
                        "conectado"
                    )
                );

            }


            return status.includes(
                valor
            );

        }
    );

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar() {

    const dados =
        obterFiltrados();


    lista.innerHTML =
        "";


    if (
        dados.length ===
        0
    ) {

        mensagem.style.display =
            "block";


        mensagem.textContent =
            "Nenhum atendimento encontrado.";


        return;

    }


    mensagem.style.display =
        "none";


    dados.forEach(
        function(item) {

            const elemento =
                document.createElement(
                    "div"
                );


            elemento.className =
                "atendimento";


            const data =
                obterDataRegistro(
                    item
                );


            let dataTexto =
                "-";


            let horaTexto =
                "-";


            if (
                data
            ) {

                dataTexto =
                    data.toLocaleDateString(
                        "pt-BR"
                    );


                horaTexto =
                    data.toLocaleTimeString(
                        "pt-BR",
                        {

                            hour:
                                "2-digit",

                            minute:
                                "2-digit"

                        }
                    );

            }


            const statusValor =
                item.status ||
                item.estado ||
                "-";


            const classeStatus =
                obterClasseStatus(
                    statusValor
                );


            const cliente =
                item.cliente ||
                item.clienteId ||
                item.usuarioId ||
                "-";


            const tradutor =
                item.tradutor ||
                item.tradutorId ||
                "-";


            const tempo =
                item.tempo ||
                item.duracao ||
                item.minutos ||
                "-";


            const local =
                item.local ||
                item.localizacao ||
                "-";


            elemento.innerHTML =
                `

                <div class="atendimento-topo">

                    <div>

                        <div class="data">
                            ${escaparHtml(
                                dataTexto
                            )}
                        </div>

                        <div class="hora">
                            ${escaparHtml(
                                horaTexto
                            )}
                        </div>

                    </div>


                    <div class="status ${classeStatus}">
                        ${escaparHtml(
                            statusValor
                        )}
                    </div>

                </div>


                <div class="info-grid">


                    <div class="info">

                        <div class="rotulo">
                            Cliente
                        </div>

                        <div class="valor">
                            ${escaparHtml(
                                abreviar(
                                    cliente
                                )
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            Tradutor
                        </div>

                        <div class="valor">
                            ${escaparHtml(
                                abreviar(
                                    tradutor
                                )
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            Tempo
                        </div>

                        <div class="valor">
                            ${escaparHtml(
                                tempo
                            )}
                        </div>

                    </div>


                    <div class="info">

                        <div class="rotulo">
                            Local
                        </div>

                        <div class="valor">
                            ${escaparHtml(
                                local
                            )}
                        </div>

                    </div>


                </div>

                `;


            lista.appendChild(
                elemento
            );

        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function obterClasseStatus(
    status
) {

    const texto =
        String(
            status
        ).toLowerCase();


    if (
        texto.includes(
            "aguard"
        )
    ) {

        return "status-aguardando";

    }


    if (
        texto.includes(
            "final"
        ) ||
        texto.includes(
            "conclu"
        )
    ) {

        return "status-finalizado";

    }


    if (
        texto.includes(
            "andamento"
        ) ||
        texto.includes(
            "conect"
        ) ||
        texto.includes(
            "atendimento"
        )
    ) {

        return "status-andamento";

    }


    return "";

}


/* =========================================================
   DATA BANCO
========================================================= */

function formatarDataBanco(
    data
) {

    const ano =
        data.getFullYear();


    const mes =
        String(
            data.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dia =
        String(
            data.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${ano}-${mes}-${dia}`;

}


/* =========================================================
   ABREVIAR
========================================================= */

function abreviar(
    valor
) {

    const texto =
        String(
            valor ||
            "-"
        );


    if (
        texto.length <=
        16
    ) {

        return texto;

    }


    return (
        texto.substring(
            0,
            12
        ) +
        "..."
    );

}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escaparHtml(
    valor
) {

    return String(
        valor ??
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   EVENTOS
========================================================= */

btnAtualizar.addEventListener(
    "click",
    carregarAtendimentos
);


filtro.addEventListener(
    "change",
    renderizar
);


/* =========================================================
   INICIAR
========================================================= */

carregarAtendimentos();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omikuji do Dia - Sorte & Fortuna</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #70b7ff 100%);
            margin: 0;
            padding: 10px;
            padding-top: 130px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-header {
            background-color: #003366;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .back-btn {
            position: absolute;
            left: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Contêiner fixo no topo para os dois banners lado a lado */
        .banners-top-container {
            position: fixed;
            top: 48px;
            left: 0;
            width: 100%;
            background: rgba(30, 60, 114, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 6px 10px;
            z-index: 999;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }
        .banner-retangulo {
            width: 48%;
            max-width: 190px;
            height: 55px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            background: #fff;
        }
        .banner-slide {
            width: 100%;
            height: 100%;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
        }
        .banner-slide.active {
            display: block;
        }
        .omikuji-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 30px;
        }
        .omikuji-container h1 {
            color: #d32f2f;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .sub-explanation {
            font-size: 12px;
            color: #555;
            background: #f0f4f8;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.4;
            border-left: 3px solid #2a5298;
            text-align: left;
        }
        .box-image {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin: 5px auto;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .draw-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .draw-btn:active {
            transform: scale(0.95);
        }
        .result-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: #fff8e1;
            border: 2px dashed #ffb300;
            animation: fadeIn 0.5s ease;
            text-align: left;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 8px;
            text-align: center;
        }
        .result-text {
            font-size: 13px;
            color: #444;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <button class="back-btn" onclick="location.href='entretenimento.html'">⬅ Voltar</button>
        Omikuji do Dia ⛩️
    </div>

    <!-- Dois Banners Retangulares Fixos no Topo com 10 imagens no total (5 de cada lado rodando) -->
    <div class="banners-top-container">
        <!-- Retângulo Esquerdo (5 imagens) -->
        <div class="banner-retangulo">
            <img src="https://images.unsplash.com/photo-1528164344705-475426879c0d?w=400&auto=format&fit=crop&q=60" class="banner-slide left-slide active" alt="L1">
            <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=400&auto=format&fit=crop&q=60" class="banner-slide left-slide" alt="L2">
            <img src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=400&auto=format&fit=crop&q=60" class="banner-slide left-slide" alt="L3">
            <img src="https://images.unsplash.com/photo-1533050487297-09b450131914?w=400&auto=format&fit=crop&q=60" class="banner-slide left-slide" alt="L4">
            <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400&auto=format&fit=crop&q=60" class="banner-slide left-slide" alt="L5">
        </div>
        <!-- Retângulo Direito (5 imagens) -->
        <div class="banner-retangulo">
            <img src="https://images.unsplash.com/photo-1518684079-3c830dcef090?w=400&auto=format&fit=crop&q=60" class="banner-slide right-slide active" alt="R1">
            <img src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=400&auto=format&fit=crop&q=60" class="banner-slide right-slide" alt="R2">
            <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=400&auto=format&fit=crop&q=60" class="banner-slide right-slide" alt="R3">
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400&auto=format&fit=crop&q=60" class="banner-slide right-slide" alt="R4">
            <img src="https://images.unsplash.com/photo-1526481280693-3bfa7568e0f3?w=400&auto=format&fit=crop&q=60" class="banner-slide right-slide" alt="R5">
        </div>
    </div>

    <div class="omikuji-container">
        <h1>Sorte Sagrada 🍀</h1>
        
        <!-- Explicação -->
        <div class="sub-explanation">
            <strong>Como funciona:</strong> Tire 1 sorte por dia! Os níveis variam desde o <em>Dai-Kichi</em> (Grande Sorte), passando por <em>Kichi/Kokichi</em> (Boa Sorte), até augúrios de prosperidade e calmaria.
        </div>

        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Descubra a mensagem especial que o destino reservou para você hoje:</p>
        
        <!-- Ícone de pergaminho tradicional (sem ser de aniversário) -->
        <img src="https://cdn-icons-png.flaticon.com/512/2919/2919639.png" alt="Omikuji Pergaminho" class="box-image">

        <br>
        <button class="draw-btn" id="btnSortear" onclick="tirarSorte()">✨ Sortear Agora (1x ao dia)</button>

        <div id="resultado" class="result-box">
            <div id="tituloSorte" class="result-title"></div>
            <div id="textoSorte" class="result-text"></div>
        </div>
    </div>

    <!-- Puxa as mensagens do arquivo omikuji-mensagens.js -->
    <script src="omikuji-mensagens.js"></script>
    <script>
        // Carrossel esquerdo (alterna entre as 5 imagens)
        let currentLeft = 0;
        const leftSlides = document.querySelectorAll('.left-slide');
        function nextLeftSlide() {
            leftSlides[currentLeft].classList.remove('active');
            currentLeft = (currentLeft + 1) % leftSlides.length;
            leftSlides[currentLeft].classList.add('active');
        }
        setInterval(nextLeftSlide, 3500);

        // Carrossel direito (alterna entre as 5 imagens)
        let currentRight = 0;
        const rightSlides = document.querySelectorAll('.right-slide');
        function nextRightSlide() {
            rightSlides[currentRight].classList.remove('active');
            currentRight = (currentRight + 1) % rightSlides.length;
            rightSlides[currentRight].classList.add('active');
        }
        setInterval(nextRightSlide, 4000);

        // Verificar se já tirou a sorte hoje ao carregar a página
        window.onload = function() {
            const hoje = new Date().toLocaleDateString();
            const ultimoDiaSorteio = localStorage.getItem('omikuji_data_v2');
            
            if (ultimoDiaSorteio === hoje) {
                const tituloSalvo = localStorage.getItem('omikuji_titulo_v2');
                const textoSalvo = localStorage.getItem('omikuji_texto_v2');
                
                document.getElementById('tituloSorte').innerText = tituloSalvo;
                document.getElementById('textoSorte').innerText = textoSalvo;
                document.getElementById('resultado').style.display = 'block';
                document.getElementById('btnSortear').style.display = 'none';
            }
        };

        function tirarSorte() {
            const hoje = new Date().toLocaleDateString();

            if (typeof listaOmikuji === 'undefined' || listaOmikuji.length === 0) {
                alert("Erro: As mensagens do Omikuji não foram encontradas.");
                return;
            }

            const randomIndex = Math.floor(Math.random() * listaOmikuji.length);
            const sorteEscolhida = listaOmikuji[randomIndex];
            
            const tituloFinal = sorteEscolhida.titulo;
            const textoFinal = sorteEscolhida.texto + "\n\n⏳ Você já retirou a sua sorte de hoje! Volte amanhã para abrir um novo Omikuji.";

            localStorage.setItem('omikuji_data_v2', hoje);
            localStorage.setItem('omikuji_titulo_v2', tituloFinal);
            localStorage.setItem('omikuji_texto_v2', textoFinal);

            document.getElementById('tituloSorte').innerText = tituloFinal;
            document.getElementById('textoSorte').innerText = textoFinal;
            
            document.getElementById('resultado').style.display = 'block';
            document.getElementById('btnSortear').style.display = 'none';
        }
    </script>

</body>
</html>

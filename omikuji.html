<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omikuji do Dia - Sorte & Fortuna</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #70b7ff 100%);
            margin: 0;
            padding: 10px;
            padding-top: 65px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-header {
            background-color: #003366;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .back-btn {
            position: absolute;
            left: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Estilo do Carrossel de Banners no Topo */
        .banner-carrossel {
            max-width: 400px;
            width: 90%;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: #fff;
        }
        .banner-slide {
            width: 100%;
            height: 100%;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
        }
        .banner-slide.active {
            display: block;
        }
        .omikuji-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 30px;
        }
        .omikuji-container h1 {
            color: #d32f2f;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .sub-explanation {
            font-size: 12px;
            color: #555;
            background: #f0f4f8;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.4;
            border-left: 3px solid #2a5298;
            text-align: left;
        }
        .box-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin: 5px auto;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .draw-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .draw-btn:active {
            transform: scale(0.95);
        }
        .result-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: #fff8e1;
            border: 2px dashed #ffb300;
            animation: fadeIn 0.5s ease;
            text-align: left;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 8px;
            text-align: center;
        }
        .result-text {
            font-size: 13px;
            color: #444;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <button class="back-btn" onclick="location.href='entretenimento.html'">⬅ Voltar</button>
        Omikuji do Dia ⛩️
    </div>

    <!-- Carrossel de Banners no Topo -->
    <div class="banner-carrossel">
        <img src="https://images.unsplash.com/photo-1528164344705-475426879c0d?w=600&auto=format&fit=crop&q=60" class="banner-slide active" alt="Banner 1">
        <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&auto=format&fit=crop&q=60" class="banner-slide" alt="Banner 2">
        <img src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=600&auto=format&fit=crop&q=60" class="banner-slide" alt="Banner 3">
    </div>

    <div class="omikuji-container">
        <h1>Sorte Sagrada 🍀</h1>
        
        <!-- Pequena explicação sobre os níveis de sorte -->
        <div class="sub-explanation">
            <strong>Como funciona:</strong> Tire 1 sorte por dia! Os níveis variam desde o <em>Dai-Kichi</em> (Grande Sorte), passando por <em>Kichi/Kokichi</em> (Boa Sorte), até augúrios de prosperidade e calmaria.
        </div>

        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Descubra a mensagem especial que o destino reservou para você hoje:</p>
        
        <img src="https://cdn-icons-png.flaticon.com/512/3245/3245012.png" alt="Omikuji" class="box-image">

        <br>
        <button class="draw-btn" id="btnSortear" onclick="tirarSorte()">✨ Sortear Agora (1x ao dia)</button>

        <div id="resultado" class="result-box">
            <div id="tituloSorte" class="result-title"></div>
            <div id="textoSorte" class="result-text"></div>
        </div>
    </div>

    <!-- Puxa as mensagens do arquivo omikuji-mensagens.js -->
    <script src="omikuji-mensagens.js"></script>
    <script>
        // Lógica do Carrossel de Banners
        let currentSlide = 0;
        const slides = document.querySelectorAll('.banner-slide');
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 3500);

        // Verificar se já tirou a sorte hoje ao carregar a página
        window.onload = function() {
            const hoje = new Date().toLocaleDateString();
            const ultimoDiaSorteio = localStorage.getItem('omikuji_data_v2');
            
            if (ultimoDiaSorteio === hoje) {
                const tituloSalvo = localStorage.getItem('omikuji_titulo_v2');
                const textoSalvo = localStorage.getItem('omikuji_texto_v2');
                
                document.getElementById('tituloSorte').innerText = tituloSalvo;
                document.getElementById('textoSorte').innerText = textoSalvo;
                document.getElementById('resultado').style.display = 'block';
                document.getElementById('btnSortear').style.display = 'none';
            }
        };

        function tirarSorte() {
            const hoje = new Date().toLocaleDateString();

            if (typeof listaOmikuji === 'undefined' || listaOmikuji.length === 0) {
                alert("Erro: As mensagens do Omikuji não foram encontradas.");
                return;
            }

            const randomIndex = Math.floor(Math.random() * listaOmikuji.length);
            const sorteEscolhida = listaOmikuji[randomIndex];
            
            const tituloFinal = sorteEscolhida.titulo;
            const textoFinal = sorteEscolhida.texto + "\n\n⏳ Você já retirou a sua sorte de hoje! Volte amanhã para abrir um novo Omikuji.";

            // Salva no navegador para travar por 1 dia
            localStorage.setItem('omikuji_data_v2', hoje);
            localStorage.setItem('omikuji_titulo_v2', tituloFinal);
            localStorage.setItem('omikuji_texto_v2', textoFinal);

            document.getElementById('tituloSorte').innerText = tituloFinal;
            document.getElementById('textoSorte').innerText = textoFinal;
            
            document.getElementById('resultado').style.display = 'block';
            document.getElementById('btnSortear').style.display = 'none';
        }
    </script>

</body>
</html>

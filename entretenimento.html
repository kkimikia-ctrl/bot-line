<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Entretenimento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-block;
        }
        button:hover {
            background-color: #ff6b81;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-height: 80vh;
            overflow-y: auto;
        }
        .close-btn {
            background: #ccc;
            color: #333;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Área de Entretenimento</h1>
        <p>Escolha uma opção abaixo para curtir:</p>

        <!-- Botões principais na tela -->
        <button onclick="abrirModalRadio()">🎵 Ouvir Rádios</button>
        <button onclick="abrirModalOmikuji()">🔮 Omikuji (Sorte do Dia)</button>
    </div>

    <!-- Modal da Rádio -->
    <div id="modalRadio" class="modal">
        <div class="modal-content">
            <h2>Rádios Ao Vivo</h2>
            <button onclick="tocarRadio('https://sua-url-de-stream-aqui.com/stream', 'Rádio Pop')">Rádio Pop</button>
            <button onclick="tocarRadio('https://sua-url-de-stream-aqui.com/stream2', 'Rádio Rock')">Rádio Rock</button>
            
            <div id="containerPlayer" style="display:none; margin-top: 15px;">
                <p id="nomeRadioTocando" style="font-weight: bold;"></p>
                <audio id="audioRadio" controls style="width: 100%;">
                    <source id="sourceAudio" src="" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                </audio>
            </div>

            <button class="close-btn" onclick="fecharModalRadio()">Fechar</button>
        </div>
    </div>

    <!-- Modal do Omikuji -->
    <div id="modalOmikuji" class="modal">
        <div class="modal-content">
            <h2 id="omikujiTitulo">Sorte do Dia</h2>
            <p id="omikujiTexto" style="line-height: 1.6; text-align: justify; margin: 15px 0;">Toque no botão abaixo para descobrir a sua mensagem de hoje.</p>
            
            <button id="btnSortearOmikuji" onclick="sortearOmikuji()">Tirar Sorte</button>
            <br>
            <button class="close-btn" onclick="fecharModalOmikuji()">Fechar</button>
        </div>
    </div>

    <script>
        function abrirModalRadio() {
            document.getElementById('modalRadio').style.display = 'flex';
        }

        function tocarRadio(urlStream, nomeEstilo) {
            const container = document.getElementById('containerPlayer');
            const player = document.getElementById('audioRadio');
            const source = document.getElementById('sourceAudio');
            const titulo = document.getElementById('nomeRadioTocando');

            container.style.display = 'block';
            titulo.innerText = "Tocando: " + nomeEstilo;
            source.src = urlStream;
            player.load();
            player.play().catch(error => {
                console.log("Aguardando play manual");
            });
        }

        function fecharModalRadio() {
            const player = document.getElementById('audioRadio');
            player.pause();
            document.getElementById('containerPlayer').style.display = 'none';
            document.getElementById('modalRadio').style.display = 'none';
        }

        // Funções do Omikuji (1 vez por dia com 80 opções positivas)
        function abrirModalOmikuji() {
            document.getElementById('modalOmikuji').style.display = 'flex';
            verificarOmikujiDiario();
        }

        function fecharModalOmikuji() {
            document.getElementById('modalOmikuji').style.display = 'none';
        }

        function verificarOmikujiDiario() {
            const hoje = new Date().toLocaleDateString();
            const ultimoDiaSorteio = localStorage.getItem('omikuji_data');
            const tituloEl = document.getElementById('omikujiTitulo');
            const textoEl = document.getElementById('omikujiTexto');
            const btnSortear = document.getElementById('btnSortearOmikuji');

            if (ultimoDiaSorteio === hoje) {
                const tituloSalvo = localStorage.getItem('omikuji_titulo_salvo');
                const textoSalvo = localStorage.getItem('omikuji_texto_salvo');

                tituloEl.innerText = tituloSalvo;
                textoEl.innerText = textoSalvo;
                if (btnSortear) btnSortear.style.display = 'none';
            } else {
                tituloEl.innerText = "Toque no botão para sua sorte!";
                textoEl.innerText = "Descubra a mensagem detalhada e inspiradora que o destino reservou para o seu dia hoje.";
                if (btnSortear) btnSortear.style.display = 'block';
            }
        }

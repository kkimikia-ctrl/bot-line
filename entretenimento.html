<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazer e Entretenimento</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
        .content-section { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-action { background-color: #1a73e8; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-action:disabled { background-color: #ccc; }
    </style>
</head>
<body>

    <!-- SEÇÃO RÁDIO (Áudio direto, sem YouTube) -->
    <div class="content-section">
        <h2>📻 Rádio Online</h2>
        <audio controls style="width: 100%;">
            <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
        </audio>
    </div>

    <!-- SEÇÃO HORÓSCOPO (Com trava de uso) -->
    <div class="content-section">
        <h2>🔮 Horóscopo do Dia</h2>
        <div id="resultadoOmikuji" style="font-weight: bold; color: #e65100; margin: 10px 0;"></div>
        <button id="btnSorte" class="btn-action" onclick="tirarSorte()">Tirar Sorte de Hoje</button>
    </div>

    <script>
        function tirarSorte() {
            const btn = document.getElementById("btnSorte");
            btn.disabled = true;
            const sortes = ["🌸 Daikichi", "🍀 Chukichi", "⭐ Shokichi", "☀️ Suekichi"];
            const sorte = sortes[Math.floor(Math.random() * sortes.length)];
            
            localStorage.setItem('sorte_data', new Date().toLocaleDateString());
            localStorage.setItem('sorte_texto', sorte);
            document.getElementById("resultadoOmikuji").innerText = sorte;
        }

        window.onload = () => {
            if(localStorage.getItem('sorte_data') === new Date().toLocaleDateString()){
                document.getElementById("resultadoOmikuji").innerText = localStorage.getItem('sorte_texto');
                document.getElementById("btnSorte").disabled = true;
            }
        }
    </script>
</body>
</html>

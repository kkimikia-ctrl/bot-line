<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazer e Entretenimento - Ajuda JP</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; padding-bottom: 80px; }
        .header { background-color: #1a73e8; color: white; padding: 10px 15px; font-size: 18px; font-weight: bold; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .logo-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: white; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .menu-item { background: white; padding: 18px 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; cursor: pointer; border: 2px solid transparent; font-size: 15px; font-weight: bold; color: #1a73e8; }
        .menu-item.active { border-color: #1a73e8; background-color: #e8f0fe; }
        
        .content-section { display: none; background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .content-section.active { display: block; }
        
        .section-title { font-size: 1.1rem; color: #1a73e8; margin-top: 0; margin-bottom: 12px; }
        .btn-action { background-color: #1a73e8; color: white; border: none; padding: 12px 15px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-action:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <header class="header">
        <img src="logo.jpeg" class="logo-img" alt="Logo" onerror="this.style.display='none'">
        <span>Lazer & Comunidade</span>
        <img src="logo.jpeg" class="logo-img" alt="Logo" onerror="this.style.display='none'">
    </header>

    <!-- MENU -->
    <div class="grid-menu">
        <button class="menu-item active" onclick="mostrarSecao('radio', this)">📻 Rádio</button>
        <button class="menu-item" onclick="mostrarSecao('horoscopo', this)">🔮 Horóscopo</button>
    </div>

    <!-- SEÇÃO RÁDIO -->
    <div id="radio" class="content-section active">
        <h2 class="section-title">📻 Rádio Online</h2>
        <audio controls style="width: 100%;">
            <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>
    </div>

    <!-- SEÇÃO HORÓSCOPO -->
    <div id="horoscopo" class="content-section">
        <h2 class="section-title">🔮 Horóscopo do Dia</h2>
        <div id="resultadoOmikuji" style="font-weight: bold; color: #e65100; margin: 10px 0; text-align: center;">Sua sorte de hoje espera por você!</div>
        <button id="btnSorte" class="btn-action" onclick="tirarSorte()">Tirar Sorte de Hoje</button>
    </div>

    <script>
        function mostrarSecao(idSecao, elementoBotao) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
            document.getElementById(idSecao).classList.add('active');
            elementoBotao.classList.add('active');
        }

        function tirarSorte() {
            const btn = document.getElementById("btnSorte");
            btn.disabled = true;
            btn.style.backgroundColor = "#ccc";

            const sortes = ["🌸 Daikichi", "🍀 Chukichi", "⭐ Shokichi", "☀️ Suekichi"];
            const sorte = sortes[Math.floor(Math.random() * sortes.length)];
            
            localStorage.setItem('sorte_data', new Date().toLocaleDateString());
            localStorage.setItem('sorte_texto', sorte);
            
            document.getElementById("resultadoOmikuji").innerText = sorte;
        }

        window.onload = function() {
            if(localStorage.getItem('sorte_data') === new Date().toLocaleDateString()){
                document.getElementById("resultadoOmikuji").innerText = localStorage.getItem('sorte_texto');
                const btn = document.getElementById("btnSorte");
                btn.disabled = true;
                btn.style.backgroundColor = "#ccc";
            }
        }
    </script>
</body>
</html>

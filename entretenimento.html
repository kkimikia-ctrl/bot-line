<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entretenimento e Lazer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; text-align: center; }
        .header { background-color: #0d47a1; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header h1 { font-size: 18px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .card-btn { background: white; border: none; padding: 15px 10px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; text-align: center; transition: transform 0.2s; }
        .card-btn:active { transform: scale(0.98); }
        .card-btn .icon { font-size: 24px; display: block; margin-bottom: 6px; }
        .card-btn .title { font-size: 14px; font-weight: bold; color: #0d47a1; display: block; }
        .card-btn .subtitle { font-size: 11px; color: #666; display: block; }
        .section-box { background: white; border-radius: 14px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: left; margin-bottom: 20px; }
        .section-box h3 { font-size: 15px; color: #0d47a1; margin-top: 0; display: flex; align-items: center; gap: 8px; }
        .rule-card { background: #e8f0fe; border-left: 4px solid #1967d2; padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #174ea6; margin-bottom: 12px; }
        .action-btn { background-color: #1976d2; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 14px; width: 92%; max-width: 450px; text-align: center; max-height: 85vh; overflow-y: auto; }
        .close-btn { background: #d32f2f; color: white; margin-top: 15px; border: none; padding: 10px 20px; border-radius: 8px; width: 100%; font-weight: bold; }
        .radio-category { font-size: 11px; font-weight: bold; color: #666; text-align: left; margin: 15px 0 5px 0; text-transform: uppercase; }
        .radio-option { background: #f8f9fa; border: 1px solid #ddd; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; font-size: 13px; font-weight: bold; color: #0d47a1; text-align: left; }
    </style>
</head>
<body>

    <div class="header"><h1>Entretenimento e Lazer</h1></div>

    <div class="container">
        <div class="grid-menu">
            <button class="card-btn" onclick="abrirSecaoLives()">🔴<br><span class="title">Lives</span></button>
            <button class="card-btn" onclick="abrirModalRadio()">📻<br><span class="title">Rádios</span></button>
            <button class="card-btn" onclick="abrirModalKaraoke()">🎤<br><span class="title">Karaokê</span></button>
            <button class="card-btn" onclick="abrirModalOmikuji()">🔮<br><span class="title">Horóscopo</span></button>
        </div>

        <div class="section-box" id="secaoLives">
            <h3>🔴 Lives da Comunidade</h3>
            <div class="rule-card">🎁 Regra de Presentes: Os primeiros 300¥ doados vão inteiros para o criador!</div>
            <button class="action-btn">Assistir Live Ativa</button>
        </div>
    </div>

    <!-- Modal Karaokê -->
    <div id="modalKaraoke" class="modal">
        <div class="modal-content">
            <h2>🎤 Karaokê</h2>
            <div id="listaKaraokeHTML"></div>
            <!-- AVISO DE SEGURANÇA ADICIONADO ABAIXO -->
            <p style="font-size: 10px; color: #888; margin-top: 15px; padding: 5px; border: 1px dashed #ccc;">
                *Se o vídeo não abrir, toque nos três pontinhos (...) no rodapé e escolha "Abrir no Safari".
            </p>
            <button class="close-btn" onclick="document.getElementById('modalKaraoke').style.display='none'">Fechar</button>
        </div>
    </div>

    <script>
        function abrirSecaoLives() { document.getElementById('secaoLives').scrollIntoView({ behavior: 'smooth' }); }
        
        function abrirModalKaraoke() {
            document.getElementById('modalKaraoke').style.display = 'flex';
            carregarListaKaraoke();
        }

        function carregarListaKaraoke() {
            const container = document.getElementById('listaKaraokeHTML');
            if(container.innerHTML.trim() !== "") return;
            
            // Exemplo de como percorrer a lista
            if (typeof listaKaraoke !== 'undefined') {
                listaKaraoke.forEach(musica => {
                    container.innerHTML += `
                        <div class="radio-option" onclick="abrirLinkYouTube('${musica.link}')">
                            ${musica.titulo} <span>▶️ Cantar</span>
                        </div>
                    `;
                });
            }
        }

        function abrirLinkYouTube(linkWeb) {
            // A tentativa mais segura para iOS: abrir em uma nova janela de sistema
            // O uso de 'confirm' ou 'window.open' em resposta ao clique direto do usuário
            // costuma contornar o bloqueio de pop-up do Safari/WebView.
            
            const abrir = confirm("Deseja abrir este vídeo no YouTube?");
            if (abrir) {
                // Tenta abrir no sistema externo
                window.open(linkWeb, '_blank'); 
            }
        }
    </script>
    <script src="karaoke-musicas.js"></script>
</body>
</html>

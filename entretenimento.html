<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazer e Entretenimento - Ajuda JP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            padding-bottom: 80px;
        }

        .header {
            background-color: #1a73e8;
            color: white;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            background: white;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .menu-item {
            background: white;
            padding: 18px 10px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 15px;
            font-weight: bold;
            color: #1a73e8;
        }

        .menu-item.active {
            border-color: #1a73e8;
            background-color: #e8f0fe;
        }

        .menu-item span {
            display: block;
            font-size: 12px;
            color: #666;
            font-weight: normal;
            margin-top: 4px;
        }

        .content-section {
            display: none;
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        .content-section.active {
            display: block;
        }

        .section-title {
            font-size: 1.1rem;
            color: #1a73e8;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .btn-action {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-action:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .radio-card {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .omikuji-box {
            background: #fff8e1;
            border: 2px dashed #ffb300;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 0.70rem;
            flex-grow: 1;
        }
        .nav-item.active { color: #1a73e8; font-weight: bold; }
        .nav-item span.icon { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <header class="header">
        <img src="logo.jpeg" class="logo-img" alt="Logo" onerror="this.style.display='none'">
        <span>Lazer & Comunidade</span>
        <img src="logo.jpeg" class="logo-img" alt="Logo" onerror="this.style.display='none'">
    </header>

    <div class="grid-menu">
        <button class="menu-item active" onclick="mudarAba('radio', this)">
            📻 Rádio
            <span>Músicas e Animação</span>
        </button>
        <button class="menu-item" onclick="mudarAba('horoscopo', this)">
            🔮 Horóscopo
            <span>Omikuji do Dia</span>
        </button>
    </div>

    <!-- RÁDIO -->
    <div id="radio" class="content-section active">
        <h2 class="section-title">📻 Rádio Online</h2>
        <div class="radio-card">
            <h3>🎧 Transmissão Ao Vivo</h3>
            <p style="font-size: 0.85rem; opacity: 0.9;">Clique no play para ouvir</p>
            <audio controls preload="none" style="width: 100%; margin-top: 10px;">
                <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mp4">
                <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
                Seu navegador não suporta áudio.
            </audio>
        </div>
    </div>

    <!-- HORÓSCOPO -->
    <div id="horoscopo" class="content-section">
        <h2 class="section-title">🔮 Horóscopo do Dia (Omikuji)</h2>
        <div class="omikuji-box">
            <div style="font-size: 0.85rem; color: #795548; font-weight: bold; margin-bottom: 5px;" id="tituloSorte">✨ SUA SORTE DE HOJE:</div>
            <div id="textoHoroscopo" style="font-size: 1.05rem; font-weight: bold; color: #e65100; min-height: 50px; display: flex; align-items: center; justify-content: center; text-align: center;">
                Carregando...
            </div>
        </div>
        <button id="botaoSorte" class="btn-action" onclick="pegarSorte()" style="background-color: #f57c00;">🎯 Revelar Sorte do Dia</button>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="entretenimento.html" class="nav-item active">
            <span class="icon">🎬</span>
            <span>Lazer</span>
        </a>
    </nav>

    <script>
        const mensagens = [
            "🌸 Daikichi: Excelente dia para finanças, trabalho e novos projetos!",
            "🍀 Chukichi: Sua dedicação trará frutos maravilhosos muito em breve.",
            "⭐ Shokichi: Pequenos detalhes e sorrisos vão alegrar o seu dia.",
            "🌻 Kichi: O dia será incrivelmente tranquilo, próspero e produtivo.",
            "☀️ Suekichi: Grandes oportunidades estão se aproximando do seu caminho."
        ];

        function mudarAba(id, el) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        window.onload = function() {
            const hoje = new Date().toISOString().slice(0, 10);
            const salvoData = localStorage.getItem('omikuji_data');
            const salvoTexto = localStorage.getItem('omikuji_texto');
            const salvoStatus = localStorage.getItem('omikuji_status');

            if (salvoData === hoje && salvoTexto) {
                document.getElementById('textoHoroscopo').innerText = salvoTexto;
                if (salvoStatus === 'travado') {
                    travarBotao();
                }
            } else {
                const sorteDoDia = mensagens[Math.floor(Math.random() * mensagens.length)];
                localStorage.setItem('omikuji_data', hoje);
                localStorage.setItem('omikuji_texto', sorteDoDia);
                localStorage.setItem('omikuji_status', 'novo');
                document.getElementById('textoHoroscopo').innerText = "Toque no botão abaixo para revelar sua sorte!";
            }
        };

        function pegarSorte() {
            const sorteDoDia = localStorage.getItem('omikuji_texto');
            document.getElementById('textoHoroscopo').innerText = sorteDoDia;
            localStorage.setItem('omikuji_status', 'travado');
            travarBotao();
        }

        function travarBotao() {
            const btn = document.getElementById('botaoSorte');
            btn.innerText = "Já revelado hoje (Volte amanhã)";
            btn.disabled = true;
        }
    </script>
</body>
</html>

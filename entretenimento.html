<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entretenimento e Lazer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; text-align: center; }
        .header { background-color: #0d47a1; color: white; padding: 15px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .card-btn { background: white; border: none; padding: 15px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 14px; width: 90%; max-width: 400px; }
        .radio-item { background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .play-btn { background-color: #1976d2; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .close-btn { background: #d32f2f; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header"><h1>Entretenimento e Lazer</h1></div>

    <div class="container">
        <div class="grid-menu">
            <button class="card-btn" onclick="alert('Abrindo Lives...')">🔴 <b>Lives</b></button>
            <button class="card-btn" onclick="abrirModalRadio()">📻 <b>Rádios</b></button>
            <button class="card-btn" onclick="alert('Karaokê...')">🎤 <b>Karaokê</b></button>
            <button class="card-btn" onclick="alert('Horóscopo...')">🔮 <b>Horóscopo</b></button>
            <button class="card-btn" onclick="alert('Chat...')">💬 <b>Chat</b></button>
            <button class="card-btn" onclick="alert('Ranking...')">🏆 <b>Ranking</b></button>
            <button class="card-btn" onclick="alert('Descontos...')">🎟️ <b>Descontos</b></button>
            <button class="card-btn" onclick="alert('Jogos...')">🎮 <b>Jogos</b></button>
        </div>
    </div>

    <div id="modalRadio" class="modal">
        <div class="modal-content">
            <h2>🎧 Escolha o Áudio</h2>
            
            <div class="radio-item">
                <span>CBN São Paulo</span>
                <button class="play-btn" onclick="tocarRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/CBN_SPAAC.aac', 'CBN São Paulo')">Ouvir</button>
            </div>
            <div class="radio-item">
                <span>Lofi Beats</span>
                <button class="play-btn" onclick="tocarRadio('https://stream.zeno.fm/f3wvbbqmdg8uv', 'Lofi Beats')">Ouvir</button>
            </div>

            <div id="containerPlayer" style="display:none; margin-top: 15px;">
                <p id="nomeRadioTocando" style="font-weight: bold;"></p>
                <audio id="audioRadio" controls style="width: 100%;"></audio>
            </div>

            <button class="close-btn" onclick="fecharModalRadio()">Fechar</button>
        </div>
    </div>

    <script>
        function abrirModalRadio() { document.getElementById('modalRadio').style.display = 'flex'; }
        
        function tocarRadio(url, nome) {
            const player = document.getElementById('audioRadio');
            document.getElementById('containerPlayer').style.display = 'block';
            document.getElementById('nomeRadioTocando').innerText = nome;
            player.src = url;
            player.play();
        }

        function fecharModalRadio() {
            document.getElementById('audioRadio').pause();
            document.getElementById('modalRadio').style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda JP - Entretenimento</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
        .header { background-color: #0047ab; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 14px; text-align: center; }
        .radio-option { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; color: #1e3a8a; display: flex; justify-content: space-between; }
        .menu-item { background: white; padding: 20px; border-radius: 12px; border: none; width: 100%; font-size: 16px; font-weight: bold; color: #1e3a8a; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">Entretenimento e Lazer</div>

    <button class="menu-item" onclick="abrirModal()">📻 Abrir Rádios</button>

    <div id="modalRadio" class="modal">
        <div class="modal-content">
            <h3>Escolha o Canal</h3>
            <!-- TODOS estes usam o servidor que funcionou para você -->
            <div class="radio-option" onclick="tocar('https://playerservices.streamtheworld.com/api/livestream-redirect/CBN_SP_SC.mp3', 'CBN SP')">CBN SP <span>▶️</span></div>
            <div class="radio-option" onclick="tocar('https://playerservices.streamtheworld.com/api/livestream-redirect/CBN_RIO_SC.mp3', 'CBN Rio')">CBN Rio <span>▶️</span></div>
            <div class="radio-option" onclick="tocar('https://playerservices.streamtheworld.com/api/livestream-redirect/JOP_S1.mp3', 'Jovem Pan')">Jovem Pan <span>▶️</span></div>
            <div class="radio-option" onclick="tocar('https://playerservices.streamtheworld.com/api/livestream-redirect/GAU_AM_SC.mp3', 'Rádio Gaúcha')">Rádio Gaúcha <span>▶️</span></div>

            <div id="containerPlayer" style="display:none; margin-top:20px; background:#e0f2fe; padding:10px; border-radius:10px;">
                <p id="txt" style="font-weight:bold; color:#0369a1; margin-bottom:10px;"></p>
                <audio id="player" controls style="width:100%;"><source src="" id="srcAudio"></audio>
            </div>
            <button onclick="fechar()" style="margin-top:20px; padding:10px 20px; background:#dc2626; color:white; border:none; border-radius:8px;">Fechar</button>
        </div>
    </div>

    <script>
        function abrirModal() { document.getElementById('modalRadio').style.display = 'flex'; }
        function tocar(url, nome) {
            document.getElementById('containerPlayer').style.display = 'block';
            document.getElementById('txt').innerText = "Tocando: " + nome;
            const p = document.getElementById('player');
            document.getElementById('srcAudio').src = url;
            p.load(); p.play();
        }
        function fechar() { 
            document.getElementById('player').pause(); 
            document.getElementById('modalRadio').style.display = 'none'; 
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazer e Comunidade - Ajuda JP</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; padding-bottom: 80px; }
        .header { background-color: #1a73e8; color: white; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section-box { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn-action { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 15px; cursor: pointer; font-size: 16px; }
        .btn-action:disabled { background: #ccc; cursor: not-allowed; }
        .radio-box { text-align: center; padding: 20px; background: #1a73e8; color: white; border-radius: 10px; }
        .omikuji-box { text-align: center; padding: 20px; background: #fff8e1; border: 2px dashed #ffb300; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="header">
    <span>Lazer & Comunidade</span>
</div>

<!-- BLOCO DA RÁDIO -->
<div class="section-box">
    <div class="radio-box">
        <h3 style="margin-top:0;">📻 Rádio Online</h3>
        <p style="font-size: 13px; margin-bottom: 15px;">Transmissão Ao Vivo - Clique no play para ouvir</p>
        <audio controls style="width: 100%;">
            <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>
    </div>
</div>

<!-- BLOCO DO HORÓSCOPO -->
<div class="section-box">
    <h3 style="color: #1a73e8; margin-top:0; text-align:center;">🔮 Horóscopo / Omikuji do Dia</h3>
    <div class="omikuji-box">
        <h3 id="resultado" style="color: #b78103; margin:0;">Sua sorte de hoje espera por você!</h3>
    </div>
    <button id="btnSorte" class="btn-action" onclick="sortear()">Revelar Sorte</button>
</div>

<script>
    function sortear() {
        const frases = [
            "🌸 Daikichi (Ótimo dia! Muita sorte e alegria em tudo o que fizer.)", 
            "🍀 Chukichi (Dia bom! Boas energias e surpresas agradáveis.)", 
            "⭐ Shokichi (Dia leve! Paciência trará ótimos resultados.)", 
            "☀️ Suekichi (Dia calmo! Siga firme e seu esforço dará frutos.)"
        ];
        const sorte = frases[Math.floor(Math.random() * frases.length)];
        localStorage.setItem('sorte_data', new Date().toLocaleDateString());
        localStorage.setItem('sorte_texto', sorte);
        document.getElementById('resultado').innerText = sorte;
        document.getElementById('btnSorte').disabled = true;
        document.getElementById('btnSorte').innerText = "Já revelado hoje";
    }

    window.onload = () => {
        if(localStorage.getItem('sorte_data') === new Date().toLocaleDateString()){
            document.getElementById('resultado').innerText = localStorage.getItem('sorte_texto');
            document.getElementById('btnSorte').disabled = true;
            document.getElementById('btnSorte').innerText = "Já revelado hoje";
        }
    }
</script>
</body>
</html>

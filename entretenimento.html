<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazer - Ajuda JP</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; padding-bottom: 80px; }
        .header { background-color: #1a73e8; color: white; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .menu-btn { background: white; padding: 15px; border-radius: 10px; border: 2px solid #ddd; cursor: pointer; text-align: center; font-weight: bold; color: #1a73e8; }
        .menu-btn.active { border-color: #1a73e8; background: #e8f0fe; }
        .content { display: none; background: white; padding: 20px; border-radius: 10px; }
        .content.active { display: block; }
        .btn-action { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 15px; }
        .btn-action:disabled { background: #ccc; }
        .radio-box { text-align: center; padding: 20px; background: #1a73e8; color: white; border-radius: 10px; }
        .omikuji-box { text-align: center; padding: 20px; background: #fff8e1; border: 2px dashed #ffb300; border-radius: 10px; }
    </style>
</head>
<body>

<header class="header">Lazer e Entretenimento</header>

<div class="grid-menu">
    <button class="menu-btn active" onclick="mostrar('radio', this)">📻 Rádio</button>
    <button class="menu-btn" onclick="mostrar('horoscopo', this)">🔮 Horóscopo</button>
</div>

<div id="radio" class="content active">
    <div class="radio-box">
        <h3>Rádio Ao Vivo</h3>
        <audio controls style="width: 100%;">
            <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
        </audio>
    </div>
</div>

<div id="horoscopo" class="content">
    <div class="omikuji-box">
        <h3 id="resultado">Sua sorte de hoje espera por você!</h3>
    </div>
    <button id="btnSorte" class="btn-action" onclick="sortear()">Revelar Sorte</button>
</div>

<script>
    function mostrar(id, el) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function sortear() {
        const frases = ["🌸 Daikichi (Ótimo dia!)", "🍀 Chukichi (Dia bom)", "⭐ Shokichi (Dia leve)", "☀️ Suekichi (Dia calmo)"];
        const sorte = frases[Math.floor(Math.random() * frases.length)];
        localStorage.setItem('sorte_data', new Date().toLocaleDateString());
        localStorage.setItem('sorte_texto', sorte);
        document.getElementById('resultado').innerText = sorte;
        document.getElementById('btnSorte').disabled = true;
        document.getElementById('btnSorte').innerText = "Já revelado hoje";
    }

    window.onload = () => {
        if(localStorage.getItem('sorte_data') === new Date().toLocaleDateString()){
            document.getElementById('resultado').innerText = localStorage.getItem('sorte_texto');
            document.getElementById('btnSorte').disabled = true;
            document.getElementById('btnSorte').innerText = "Já revelado hoje";
        }
    }
</script>
</body>
</html>

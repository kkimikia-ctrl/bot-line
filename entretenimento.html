<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entretenimento e Lazer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; text-align: center; }
        .header { background-color: #0d47a1; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header h1 { font-size: 18px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .card-btn { background: white; border: none; padding: 15px 10px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; text-align: center; }
        .card-btn .icon { font-size: 24px; display: block; margin-bottom: 6px; }
        .card-btn .title { font-size: 14px; font-weight: bold; color: #0d47a1; display: block; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 14px; width: 92%; max-width: 450px; text-align: center; max-height: 85vh; overflow-y: auto; }
        .close-btn { background: #d32f2f; color: white; margin-top: 15px; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; }
        .radio-category { font-size: 11px; font-weight: bold; color: #666; text-align: left; margin: 15px 0 5px 0; text-transform: uppercase; }
        .radio-option { background: #f8f9fa; border: 1px solid #ddd; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; font-size: 13px; font-weight: bold; color: #0d47a1; text-align: left; }
    </style>
</head>
<body>

    <div class="header"><h1>Entretenimento e Lazer</h1></div>

    <div class="container">
        <div class="grid-menu">
            <button class="card-btn" onclick="abrirModalRadio()"><span class="icon">📻</span><span class="title">Rádios</span></button>
            <button class="card-btn" onclick="abrirModalKaraoke()"><span class="icon">🎤</span><span class="title">Karaokê</span></button>
            <button class="card-btn" onclick="abrirModalOmikuji()"><span class="icon">🔮</span><span class="title">Horóscopo</span></button>
        </div>
    </div>

    <!-- Modal Karaokê -->
    <div id="modalKaraoke" class="modal">
        <div class="modal-content">
            <h2 style="color: #1e3a8a;">🎤 Karaokê</h2>
            <div id="listaKaraokeHTML"></div>
            <button class="close-btn" onclick="fecharModalKaraoke()">Fechar</button>
        </div>
    </div>

    <script>
        function abrirModalKaraoke() {
            document.getElementById('modalKaraoke').style.display = 'flex';
            const containerLista = document.getElementById('listaKaraokeHTML');
            if(containerLista.innerHTML.trim() !== "") return;

            let htmlFinal = "";
            let categoriaAtual = "";
            listaKaraoke.forEach(musica => {
                if (musica.categoria !== categoriaAtual) {
                    htmlFinal += `<div class="radio-category">🎶 ${musica.categoria}</div>`;
                    categoriaAtual = musica.categoria;
                }
                htmlFinal += `<a href="${musica.link}" target="_blank" style="text-decoration:none;"><div class="radio-option">${musica.titulo} <span>▶️</span></div></a>`;
            });
            containerLista.innerHTML = htmlFinal;
        }

        function fecharModalKaraoke() { document.getElementById('modalKaraoke').style.display = 'none'; }
        function abrirModalRadio() { alert('Abra o arquivo de rádios para configurar.'); }
        function abrirModalOmikuji() { alert('Abra o arquivo de Omikuji para configurar.'); }
    </script>
    <script src="karaoke-musicas.js"></script>
</body>
</html>

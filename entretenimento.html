<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda JP - Entretenimento e Lazer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
            padding-bottom: 80px;
        }
        .header {
            background-color: #0047ab;
            color: white;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: white;
            border: 2px solid white;
            flex-shrink: 0;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        h3 {
            margin-top: 0;
            font-size: 16px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 0.75rem;
            flex-grow: 1;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: #0047ab;
            font-weight: bold;
        }
        .nav-item span.icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.jpeg" class="logo-img" alt="Logo" onerror="this.onerror=null; this.src='logo.png';">
        Ajuda JP - Entretenimento
    </div>

    <div class="card">
        <h3>🎬 Lives, Aulas e Notícias</h3>
        <p style="font-size: 14px; color: #666;">Bem-vindo à tela de entretenimento e utilidades do Ajuda JP. Em breve mais conteúdos disponíveis aqui!</p>
    </div>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="servicos.html" class="nav-item">
            <span class="icon">📋</span>
            <span>Serviços</span>
        </a>
        <a href="entretenimento.html" class="nav-item active">
            <span class="icon">🎬</span>
            <span>Lazer</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <span class="icon">👤</span>
            <span>Perfil</span>
        </a>
    </nav>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entretenimento e Lazer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; text-align: center; }
        .header { background-color: #0d47a1; color: white; padding: 15px 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .card-btn { background: white; border: none; padding: 15px 10px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 14px; width: 92%; max-width: 450px; max-height: 85vh; overflow-y: auto; }
        .radio-item { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .play-btn { background-color: #1976d2; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
        .close-btn { background: #d32f2f; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header"><h1>Entretenimento e Lazer</h1></div>

    <div class="container">
        <div class="grid-menu">
            <button class="card-btn" onclick="abrirModalRadio()">📻 <b>Rádios</b></button>
            <button class="card-btn" onclick="alert('Funcionalidades em breve!')">🎮 <b>Outros</b></button>
        </div>
    </div>

    <!-- Modal das Rádios -->
    <div id="modalRadio" class="modal">
        <div class="modal-content">
            <h2>🎧 Escolha o Canal</h2>
            
            <!-- Lista com URLs Corretas -->
            <div class="radio-item">
                <span>CBN São Paulo</span>
                <button class="play-btn" onclick="tocarRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/CBN_SPAAC.aac', 'CBN São Paulo')">Ouvir</button>
            </div>
            <div class="radio-item">
                <span>Classic Hits (80/90)</span>
                <button class="play-btn" onclick="tocarRadio('https://ais-sa2.cdnstream1.com/2443_128.mp3', 'Classic Hits')">Ouvir</button>
            </div>
            <div class="radio-item">
                <span>Pop & Rock Global</span>
                <button class="play-btn" onclick="tocarRadio('https://n08.radiojar.com/8s5u5tp8wzzuv', 'Pop & Rock')">Ouvir</button>
            </div>
            <div class="radio-item">
                <span>Techno Club</span>
                <button class="play-btn" onclick="tocarRadio('https://live.hunter.fm/techno_high', 'Techno Club')">Ouvir</button>
            </div>
            <div class="radio-item">
                <span>Lofi Beats</span>
                <button class="play-btn" onclick="tocarRadio('https://stream.zeno.fm/f3wvbbqmdg8uv', 'Lofi Beats')">Ouvir</button>
            </div>
            <div class="radio-item">
                <span>Ambient Sleep</span>
                <button class="play-btn" onclick="tocarRadio('https://stream.zeno.fm/0wr32a6n1uhvv', 'Ambient Sleep')">Ouvir</button>
            </div>

            <div id="containerPlayer" style="display:none; margin-top: 15px; background: #e8f0fe; padding: 10px; border-radius: 8px;">
                <p id="nomeRadioTocando" style="font-weight: bold;"></p>
                <audio id="audioRadio" controls style="width: 100%;"></audio>
            </div>

            <button class="close-btn" onclick="fecharModalRadio()">Fechar</button>
        </div>
    </div>

    <script>
        function abrirModalRadio() { document.getElementById('modalRadio').style.display = 'flex'; }
        
        function tocarRadio(urlStream, nome) {
            const container = document.getElementById('containerPlayer');
            const player = document.getElementById('audioRadio');
            container.style.display = 'block';
            document.getElementById('nomeRadioTocando').innerText = "Tocando: " + nome;
            player.src = urlStream;
            player.play();
        }

        function fecharModalRadio() {
            document.getElementById('audioRadio').pause();
            document.getElementById('modalRadio').style.display = 'none';
        }
    </script>
</body>
</html>

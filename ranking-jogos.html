<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking dos Jogos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e3a8a;
            color: #f8fafc;
            margin: 0;
            padding: 10px;
            text-align: center;
            padding-bottom: 40px;
        }
        h1 { color: #f8fafc; font-size: 20px; margin: 10px 0 15px 0; }
        
        /* Carrossel de Banners Pequenos no Topo */
        .carousel-container {
            max-width: 450px;
            height: 80px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background: #0f172a;
            position: relative;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn-voltar {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            float: left;
            margin-bottom: 10px;
        }

        .container-card {
            background: white;
            color: #333;
            max-width: 450px;
            margin: 0 auto;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: left;
        }

        h2.titulo-secao {
            text-align: center;
            color: #1e3a8a;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        /* Abas de Modalidade */
        .abas-container {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        .aba-btn {
            background: #f1f5f9;
            border: none;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            color: #64748b;
        }
        .aba-btn.active {
            background: #1e3a8a;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid #f1f5f9;
        }
        .pos { font-weight: bold; text-align: center; width: 40px; }
        .gold { color: #d97706; }
        .silver { color: #64748b; }
        .bronze { color: #b45309; }
        .pts { text-align: right; font-weight: bold; color: #1e3a8a; }
        
        .tabela-wrapper {
            max-height: 420px;
            overflow-y: auto;
        }
    </style>
</head>
<body onscroll="pausarCarrosselAoRolar()">

    <div style="max-width: 450px; margin: 0 auto;">
        <button class="btn-voltar" onclick="window.location.href='entretenimento.html'">⬅ Voltar</button>
        <div style="clear: both;"></div>
        <h1>Ranking dos Jogos 🏆</h1>
    </div>

    <!-- CARROSSEL DE BANNERS PEQUENOS NO TOPO -->
    <div class="carousel-container" id="carouselContainer">
        <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide"><img src="https://via.placeholder.com/450x80/1e3a8a/ffffff?text=Destaque+Semanal+1" alt="Banner 1"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/450x80/0f172a/ffffff?text=Novos+Recordes+2" alt="Banner 2"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/450x80/3b82f6/ffffff?text=Desafio+Global+3" alt="Banner 3"></div>
        </div>
    </div>

    <div class="container-card">
        <h2 class="titulo-secao">Top 30 por Modalidade</h2>
        
        <!-- Abas de Navegação dos Jogos (Incluindo Jankeipo) -->
        <div class="abas-container">
            <button class="aba-btn active" onclick="mudarAba('Cobrinha', this)">🐍 Cobrinha</button>
            <button class="aba-btn" onclick="mudarAba('Forca', this)">❌ Forca</button>
            <button class="aba-btn" onclick="mudarAba('Memória', this)">🧠 Memória</button>
            <button class="aba-btn" onclick="mudarAba('Jankeipo', this)">✌️ Jankeipo</button>
        </div>

        <div class="tabela-wrapper">
            <table>
                <tbody id="corpoTabela">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Lógica do Carrossel Pequeno com pausa automática ao rolar a página
        let currentSlide = 0;
        const track = document.getElementById('carouselTrack');
        const slides = document.querySelectorAll('.carousel-slide');
        let intervaloCarrossel = setInterval(mudarSlideAutomatico, 3500);
        let timeoutRetomada = null;

        function mudarSlideAutomatico() {
            currentSlide = (currentSlide + 1) % slides.length;
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        function pausarCarrosselAoRolar() {
            clearInterval(intervaloCarrossel);
            clearTimeout(timeoutRetomada);
            timeoutRetomada = setTimeout(() => {
                intervaloCarrossel = setInterval(mudarSlideAutomatico, 3500);
            }, 1000);
        }

        // Dados e Renderização do Ranking com Top 30 e Pontuações Baixas
        const nomesBase = [
            "Carlos Silva", "Ana Souza", "Marcos Lima", "Juliana Mendes", "Roberto Santos", 
            "Fernanda Costa", "Lucas Oliveira", "Mariana Rocha", "Paulo Ribeiro", "Camila Duarte",
            "Bruno Souza", "Beatriz Lima", "Gabriel Alves", "Larissa Dias", "Matheus Pinto",
            "Tatiane Rocha", "Rodrigo Mendes", "Vanessa Costa", "Felipe Santos", "Renata Oliveira",
            "Eduardo Lima", "Sabrina Souza", "Marcelo Dias", "Letícia Alves", "Vinicius Pinto",
            "Bianca Rocha", "Thiago Mendes", "Patrícia Costa", "Alexandre Santos", "Amanda Oliveira"
        ];

        function obterDadosJogo(modalidade) {
            let chavesPossiveis = [];
            if (modalidade === 'Jankeipo') {
                chavesPossiveis = ['ranking_jankeipo', 'ranking_jokenpo', 'ranking_jokenp_brasil', 'ranking_jokenpô'];
            } else {
                chavesPossiveis = [`ranking_${modalidade.toLowerCase()}`];
            }

            let lista = [];
            for (let chave of chavesPossiveis) {
                let dadosSalvos = JSON.parse(localStorage.getItem(chave) || "[]");
                if (dadosSalvos.length > 0) {
                    lista = dadosSalvos;
                    break;
                }
            }

            // Se não houver 30 registros reais, preenche com pontuações baixas progressivas
            if (lista.length < 30) {
                nomesBase.forEach((nome, idx) => {
                    if (lista.length < 30) {
                        let ptsBaixos = Math.max(5, (30 - idx) * 3); // Pontuações baixas
                        if (!lista.some(item => item.nome === nome)) {
                            lista.push({ nome: nome, pontos: ptsBaixos });
                        }
                    }
                });
            }

            lista.sort((a, b) => b.pontos - a.pontos);
            return lista.slice(0, 30); // Garante exatamente o Top 30
        }

        function mudarAba(modalidade, elementoBtn) {
            // Atualiza botões ativos
            document.querySelectorAll('.aba-btn').forEach(btn => btn.classList.remove('active'));
            elementoBtn.classList.add('active');

            let dados = obterDadosJogo(modalidade);
            let corpo = document.getElementById('corpoTabela');
            let html = "";

            dados.forEach((item, index) => {
                let posClass = index === 0 ? "gold" : index === 1 ? "silver" : index === 2 ? "bronze" : "";
                let posSimbolo = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `${index + 1}.`;
                
                html += `
                    <tr>
                        <td class="pos ${posClass}">${posSimbolo}</td>
                        <td>${item.nome}</td>
                        <td class="pts">${item.pontos} pts</td>
                    </tr>
                `;
            });

            corpo.innerHTML = html;
        }

        // Inicializa abrindo a aba da Cobrinha por padrão
        window.onload = function() {
            mudarAba('Cobrinha', document.querySelector('.aba-btn'));
        };
    </script>
</body>
</html>

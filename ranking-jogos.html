<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Ranking Geral - Jogos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 24px; }
        p.sub { color: #94a3b8; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
        
        /* Estilos do Carrossel de Banners Pequenos no Topo */
        .carousel-container {
            max-width: 600px;
            height: 90px;
            margin: 0 auto 20px auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            background: #1e293b;
            position: relative;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .grid-rankings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
            text-align: left;
        }
        .card-rank {
            background: #1e293b;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card-rank h2 {
            font-size: 16px;
            color: #38bdf8;
            margin-top: 0;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 6px 10px;
            border-bottom: 1px solid #334155;
        }
        tr:hover { background: rgba(255,255,255,0.02); }
        .pos { font-weight: bold; text-align: center; width: 45px; }
        .gold { color: #facc15; }
        .silver { color: #cbd5e1; }
        .bronze { color: #d97706; }
        .pts { text-align: right; font-weight: bold; color: #38bdf8; }
        .btn-voltar {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-voltar:hover { background: #7dd3fc; }
    </style>
</head>
<body onscroll="pausarCarrosselAoRolar()">

    <h1>🏆 Painel Moderno de Ranking Geral</h1>
    <p class="sub">Os 30 melhores competidores separados por modalidade de jogo</p>
    
    <!-- CARROSSEL DE BANNERS PEQUENOS NO TOPO -->
    <div class="carousel-container" id="carouselContainer">
        <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x90/0047ab/ffffff?text=Banner+Promocional+1" alt="Banner 1"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x90/00796b/ffffff?text=Banner+Promocional+2" alt="Banner 2"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x90/7b1fa2/ffffff?text=Banner+Promocional+3" alt="Banner 3"></div>
            <div class="carousel-slide"><img src="https://via.placeholder.com/600x90/e65100/ffffff?text=Banner+Promocional+4" alt="Banner 4"></div>
        </div>
    </div>

    <button class="btn-voltar" onclick="window.close()">✖ Fechar Página</button>
    
    <div class="grid-rankings" id="gridRankings">
        <!-- Os rankings por jogo serão injetados dinamicamente aqui -->
    </div>

    <script>
        // Lógica do Carrossel Pequeno com pausa automática ao rolar a página
        let currentSlide = 0;
        const track = document.getElementById('carouselTrack');
        const slides = document.querySelectorAll('.carousel-slide');
        let intervaloCarrossel = setInterval(mudarSlideAutomatico, 3500);
        let timeoutRetomada = null;

        function mudarSlideAutomatico() {
            currentSlide = (currentSlide + 1) % slides.length;
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        // Para o carrossel quando rolar a página para cima/baixo
        function pausarCarrosselAoRolar() {
            clearInterval(intervaloCarrossel);
            clearTimeout(timeoutRetomada);
            timeoutRetomada = setTimeout(() => {
                intervaloCarrossel = setInterval(mudarSlideAutomatico, 3500);
            }, 1000);
        }

        function carregarRankingGeralPagina() {
            const modalidadeJogos = [
                { nome: "Jogo da Velha", chave: "ranking_jogo_da_velha" },
                { nome: "Jogo da Forca", chave: "ranking_jogo_da_forca" },
                { nome: "Jogo da Memória", chave: "ranking_jogo_da_memoria" },
                { nome: "Jankeipo", chave: "ranking_jankeipo" }
            ];

            const nomesBase = ["Lucas", "Mariana", "Gabriel", "Beatriz", "Matheus", "Ana", "Rafael", "Larissa", "Bruno", "Camila", "Diego", "Juliana", "Thiago", "Fernanda", "Rodrigo", "Patrícia", "Alexandre", "Vanessa", "Carlos", "Renata", "Felipe", "Tatiane", "Eduardo", "Carolina", "Marcelo", "Sabrina", "Vinicius", "Letícia", "Leonardo", "Bianca"];

            let containerGrid = document.getElementById('gridRankings');
            containerGrid.innerHTML = "";

            modalidadeJogos.forEach(modalidade => {
                let card = document.createElement('div');
                card.className = 'card-rank';
                
                let lista = JSON.parse(localStorage.getItem(modalidade.chave) || "[]");

                // Preenche com pontuações baixas progressivas até atingir o Top 30 caso faltem dados
                if (lista.length < 30) {
                    nomesBase.forEach((nome, idx) => {
                        if (lista.length < 30) {
                            let ptsBaixos = Math.max(1, (30 - idx));
                            if (!lista.some(item => item.nome === nome)) {
                                lista.push({ nome: `${nome}`, pontos: ptsBaixos });
                            }
                        }
                    });
                }

                lista.sort((a, b) => b.pontos - a.pontos);

                let htmlCard = `
                    <h2><span>🎮 ${modalidade.nome}</span> <span style="font-size:11px; color:#94a3b8; font-weight:normal;">Top 30</span></h2>
                    <div style="max-height: 400px; overflow-y: auto;">
                        <table>
                `;

                lista.slice(0, 30).forEach((item, index) => {
                    let posClass = index === 0 ? "gold" : index === 1 ? "silver" : index === 2 ? "bronze" : "";
                    let posSimbolo = index === 0 ? "🥇 1º" : index === 1 ? "🥈 2º" : index === 2 ? "🥉 3º" : `${index + 1}º`;
                    
                    htmlCard += `
                        <tr>
                            <td class="pos ${posClass}">${posSimbolo}</td>
                            <td>${item.nome}</td>
                            <td class="pts">${item.pontos} pts</td>
                        </tr>
                    `;
                });

                htmlCard += `
                        </table>
                    </div>
                `;
                
                card.innerHTML = htmlCard;
                containerGrid.appendChild(card);
            });
        }

        carregarRankingGeralPagina();
    </script>
</body>
</html>

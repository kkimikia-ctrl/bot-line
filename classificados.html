<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificados - Ajuda JP</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #333;
        }

        /* --- TOPO / CABEÇALHO --- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #ffffff;
            border-bottom: 1px solid #eee;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-voltar-home {
            display: inline-flex;
            align-items: center;
            background-color: #f0f2f5;
            color: #333;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
        }

        .app-title {
            font-size: 17px;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0;
            margin-left: 8px;
        }

        .btn-anunciar {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        /* --- CARROSSEL INFINITO DE BANNERS --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 30s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #eee;
            border: 1px solid #ddd;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        /* --- RESTANTE DO CONTEÚDO (Abas, Pesquisa e Listagem) --- */
        .content-body {
            padding: 0 16px 16px 16px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <a href="index.html" class="btn-voltar-home">🏠 Início</a>
            <h1 class="app-title">Classificados Ajuda JP</h1>
        </div>
        <a href="anunciar.html" class="btn-anunciar">+ Anunciar</a>
    </header>

    <section class="carousel-container">
        <div class="carousel-track" id="carouselTrack">
            <a href="fale-conosco.html"><img src="mini-banner-1.jpg" alt="Destaque 1" loading="lazy"></a>
            <a href="fale-conosco.html"><img src="mini-banner-2.jpg" alt="Destaque 2" loading="lazy"></a>
            <a href="fale-conosco.html"><img src="mini-banner-3.jpg" alt="Destaque 3" loading="lazy"></a>
            <a href="fale-conosco.html"><img src="mini-banner-4.jpg" alt="Destaque 4" loading="lazy"></a>
        </div>
    </section>

    <div class="content-body">
        </div>

    <script>
        // Script do Carrossel Infinito
        const track = document.getElementById('carouselTrack');
        const items = Array.from(track.children);
        
        items.forEach(item => {
            const clone = item.cloneNode(true);
            track.appendChild(clone);
        });

        function initCarousel() {
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
        }

        window.addEventListener('load', initCarousel);
        setTimeout(initCarousel, 500);
    </script>

</body>
</html>

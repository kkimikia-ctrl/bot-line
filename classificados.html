<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificados - Ajuda JP</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #333;
        }

        /* --- TOPO / CABEÇALHO --- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #ffffff;
            border-bottom: 1px solid #eee;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-voltar-home {
            display: inline-flex;
            align-items: center;
            background-color: #f0f2f5;
            color: #333;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
        }

        .app-title {
            font-size: 17px;
            font-weight: bold;
            color: #1a1a1a;
            margin: 0;
        }

        .btn-anunciar {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        /* --- CARROSSEL DE BANNERS (Tamanho Normal/Compacto) --- */
        .carousel-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            padding: 10px 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: rolarInfinito 30s linear infinite;
        }
        .carousel-container:hover .carousel-track,
        .carousel-container:active .carousel-track {
            animation-play-state: paused;
        }
        .carousel-track a {
            display: block;
            flex-shrink: 0;
            width: 150px;  /* Tamanho original compacto */
            height: 85px;  /* Tamanho original compacto */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background: #eee;
            border: 1px solid #ddd;
        }
        .carousel-track img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rolarInfinito {
            0% { transform: translateX(0); }
            100% { transform: translateX(var(--scroll-amount)); }
        }

        /* --- CONTEÚDO PRINCIPAL (Abas, Busca e Filtros) --- */
        .content-body {
            padding: 0 16px 16px 16px;
        }

        .tabs-container {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 12px;
            background: #fff;
            border-radius: 6px 6px 0 0;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            color: #666;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            font-size: 14px;
            cursor: pointer;
            background: #fff;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: #fdfdfd;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }

        .filters-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .filter-select, .filter-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            box-sizing: border-box;
        }

        /* --- GRADE DE PRODUTOS --- */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .product-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .product-image-container {
            position: relative;
            width: 100%;
            height: 140px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .product-price-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .product-info {
            padding: 8px 10px 10px 10px;
            background: #fff;
        }
        
        .product-title {
            font-size: 13px;
            color: #333;
            margin: 0;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <a href="index.html" class="btn-voltar-home">🏠 Início</a>
            <h1 class="app-title">Classificados Ajuda JP</h1>
        </div>
        <a href="anunciar.html" class="btn-anunciar">+ Anunciar</a>
    </header>

    <section class="carousel-container">
        <div class="carousel-track" id="carouselTrack">
            <a href="fale-conosco.html"><img src="mini-banner-1.jpg" alt="Destaque 1" loading="lazy"></a>
            <a href="fale-conosco.html"><img src="mini-banner-2.jpg" alt="Destaque 2" loading="lazy"></a>
            <a href="fale-conosco.html"><img src="mini-banner-3.jpg" alt="Destaque 3" loading="lazy"></a>
            <a href="fale-conosco.html"><img src="mini-banner-4.jpg" alt="Destaque 4" loading="lazy"></a>
        </div>
    </section>

    <div class="content-body">
        <div class="tabs-container">
            <button class="tab active" onclick="mudarAba('vendas')">🏷️ Vendas</button>
            <button class="tab" onclick="mudarAba('doacoes')">🎁 Doações (0円)</button>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="O que você procura? (ex: carro, sofá...)" onkeyup="filtrarProdutos()">

        <div class="filters-row">
            <select id="regionSelect" class="filter-select" onchange="filtrarProdutos()">
                <option value="">Todas as Regiões</option>
                <option value="Toyohashi">Toyohashi</option>
                <option value="Hamamatsu">Hamamatsu</option>
            </select>
            <input type="text" id="cityInput" class="filter-input" placeholder="Cidade (ex: Toyohashi)" onkeyup="filtrarProdutos()">
        </div>

        <div class="products-grid" id="productsGrid">
            <div class="product-card" data-tipo="vendas" data-nome="carro mercedes" data-cidade="toyohashi">
                <div class="product-image-container">
                    <span class="product-tag">Toyohashi</span>
                    <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=400" alt="Carro">
                    <div class="product-price-tag">¥350,000</div>
                </div>
                <div class="product-info">
                    <p class="product-title">Carro Mercedes</p>
                </div>
            </div>

            <div class="product-card" data-tipo="vendas" data-nome="sofa verde" data-cidade="hamamatsu">
                <div class="product-image-container">
                    <span class="product-tag">Hamamatsu</span>
                    <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400" alt="Sofá">
                    <div class="product-price-tag">¥8,000</div>
                </div>
                <div class="product-info">
                    <p class="product-title">Sofá Verde</p>
                </div>
            </div>

            <div class="product-card" data-tipo="doacoes" data-nome="microondas doacao" data-cidade="toyohashi" style="display: none;">
                <div class="product-image-container">
                    <span class="product-tag">Toyohashi</span>
                    <img src="https://images.unsplash.com/photo-1585659722983-3f6755dcc98e?w=400" alt="Microondas">
                    <div class="product-price-tag" style="background: rgba(22, 163, 74, 0.9);">0円</div>
                </div>
                <div class="product-info">
                    <p class="product-title">Microondas Usado</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let abaAtual = 'vendas';

        // Script do Carrossel Infinito
        const track = document.getElementById('carouselTrack');
        const items = Array.from(track.children);
        
        items.forEach(item => {
            const clone = item.cloneNode(true);
            track.appendChild(clone);
        });

        function initCarousel() {
            const totalWidth = track.scrollWidth / 2;
            track.style.setProperty('--scroll-amount', `-${totalWidth}px`);
        }

        window.addEventListener('load', initCarousel);
        setTimeout(initCarousel, 500);

        function mudarAba(tipo) {
            abaAtual = tipo;
            const botoes = document.querySelectorAll('.tab');
            botoes.forEach(btn => btn.classList.remove('active'));

            if (tipo === 'vendas') {
                botoes[0].classList.add('active');
            } else {
                botoes[1].classList.add('active');
            }

            filtrarProdutos();
        }

        function filtrarProdutos() {
            const termoBusca = document.getElementById('searchInput').value.toLowerCase();
            const regiaoSelecionada = document.getElementById('regionSelect').value.toLowerCase();
            const termoCidade = document.getElementById('cityInput').value.toLowerCase();
            
            const cards = document.querySelectorAll('.product-card');

            cards.forEach(card => {
                const tipoProduto = card.getAttribute('data-tipo');
                const nomeProduto = card.getAttribute('data-nome').toLowerCase();
                const cidadeProduto = card.getAttribute('data-cidade').toLowerCase();

                const correspondeAba = (tipoProduto === abaAtual);
                const correspondeBusca = nomeProduto.includes(termoBusca);
                const correspondeRegiao = regiaoSelecionada === "" || cidadeProduto.includes(regiaoSelecionada);
                const correspondeCidade = cidadeProduto.includes(termoCidade);

                if (correspondeAba && correspondeBusca && correspondeRegiao && correspondeCidade) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>

</body>
</html>

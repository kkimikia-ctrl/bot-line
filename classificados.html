<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificados & Doações - Ajuda JP</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5efe6;
            --line-color: #e3dcd2;
            --margin-color: #f28b82;
            --text-color: #2c2c2c;
            --primary-color: #3b5998;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 6px 10px;
            background-image: 
                linear-gradient(90deg, transparent 14px, var(--margin-color) 14px, var(--margin-color) 16px, transparent 16px),
                linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 26px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-left: 12px;
            display: flex;
            flex-direction: column;
            min-height: 94vh;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
        }

        .header-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 1.5rem;
            font-family: 'Caveat', cursive;
            margin: 0;
            color: #1a1a1a;
            font-weight: 700;
            -webkit-text-stroke: 0.3px #1a1a1a;
            text-align: center;
        }

        .icon-btn {
            background: rgba(255,255,255,0.9);
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #dcd3bd;
            border-radius: 6px;
            padding: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            color: #555;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: #2e4679;
        }

        .content-section {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #dcd6ce;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .placeholder-text {
            text-align: center;
            color: #777;
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-top">
                <a href="index.html" class="icon-btn" title="Voltar para Início">🏠</a>
                <h1>Classificados & Doações</h1>
                <button class="icon-btn" title="Adicionar Anúncio">➕</button>
            </div>
        </header>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="mudarAba('classificados')">📦 Classificados (Venda)</button>
            <button class="tab-btn" onclick="mudarAba('doacoes')">🎁 Doações (0円)</button>
        </div>

        <div class="content-section" id="painel-conteudo">
            <div class="placeholder-text">Nenhum anúncio cadastrado no momento. Clique no ➕ para adicionar.</div>
        </div>
    </div>

    <script>
        function mudarAba(tipo) {
            const botoes = document.querySelectorAll('.tab-btn');
            botoes.forEach(b => b.classList.remove('active'));
            
            event.target.classList.add('active');
            
            const painel = document.getElementById('painel-conteudo');
            if (tipo === 'classificados') {
                painel.innerHTML = '<div class="placeholder-text">Lista de produtos à venda aparecerá aqui.</div>';
            } else {
                painel.innerHTML = '<div class="placeholder-text">Lista de itens para doação (0円) aparecerá aqui.</div>';
            }
        }
    </script>
</body>
</html>

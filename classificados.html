<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificados - Ajuda JP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK do LINE LIFF para pegar dados do usuário logado automaticamente -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/liff.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Cabeçalho -->
    <header class="bg-white text-gray-800 shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-base font-bold flex items-center gap-2 text-blue-600">
                <i class="fa-solid fa-store"></i> Classificados Ajuda JP
            </h1>
            <a href="novo-anuncio.html" class="bg-blue-600 text-white px-3 py-1.5 rounded-full text-xs font-semibold shadow hover:bg-blue-700 transition">
                <i class="fa-solid fa-plus"></i> Anunciar
            </a>
        </div>
    </header>

    <!-- Abas Principais (Vendas vs Doações 0円) -->
    <div class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-4xl mx-auto flex">
            <button onclick="mudarAba('vendas')" id="btn-vendas" class="flex-1 py-2.5 text-center font-bold text-blue-600 border-b-2 border-blue-600 text-xs transition">
                <i class="fa-solid fa-tags"></i> Vendas
            </button>
            <button onclick="mudarAba('doacoes')" id="btn-doacoes" class="flex-1 py-2.5 text-center font-bold text-gray-400 border-b-2 border-transparent text-xs transition">
                <i class="fa-solid fa-gift"></i> Doações (0円)
            </button>
        </div>
    </div>

    <!-- Filtros: Região, Cidade e Lupa de Itens -->
    <main class="max-w-4xl mx-auto p-3 space-y-2">
        
        <!-- Barra de Pesquisa por Item (Lupa) -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" id="input-busca" onkeyup="filtrarAnuncios()" placeholder="O que você procura? (ex: carro, sofá...)" 
                class="w-full pl-9 pr-4 py-2 bg-white border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 text-xs">
        </div>

        <!-- Seletor de Região / Cidade Compacto -->
        <div class="flex gap-2">
            <select id="filtro-regiao" onchange="filtrarAnuncios()" class="w-1/2 p-2 bg-white border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="">Todas as Regiões</option>
                <option value="Hokkaido/Tohoku">❄️ Hokkaido / Tohoku</option>
                <option value="Kanto">🗼 Kanto</option>
                <option value="Tokai">🏯 Tokai (Aichi, Shizuoka...)</option>
                <option value="Kansai">⛩️ Kansai</option>
                <option value="Chugoku/Shikoku">🌊 Chugoku / Shikoku</option>
                <option value="Kyushu/Okinawa">🌴 Kyushu / Okinawa</option>
            </select>
            <input type="text" id="input-cidade" onkeyup="filtrarAnuncios()" placeholder="Cidade (ex: Toyohashi)" 
                class="w-1/2 p-2 bg-white border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <!-- Vitrine de Anúncios Estilo App (Compacta) -->
        <div id="lista-anuncios" class="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-1">
            <!-- Os cards serão injetados via JavaScript -->
        </div>

    </main>

    <script>
        // Variável que vai armazenar os anúncios vindos do banco de dados
        let anuncios = [];
        let abaAtual = 'vendas';

        // Inicializar o LINE LIFF ao carregar a página
        async function inicializarLiff() {
            try {
                // Substitua pelo seu LIFF ID real quando configurar no painel do LINE Developers
                // await liff.init({ liffId: "SEU-LIFF-ID-AQUI" });
                // if (!liff.isLoggedIn()) {
                //     liff.login();
                // }
                
                // Enquanto testa localmente, carregamos dados de exemplo
                carregarAnunciosDoBanco();
            } catch (error) {
                console.error("Erro ao inicializar o LIFF:", error);
                carregarAnunciosDoBanco();
            }
        }

        // Função que simula (ou realiza) a busca dos dados no Firebase/Supabase
        function carregarAnunciosDoBanco() {
            // No futuro, aqui você faria o fetch ou chamada do Firebase Firestore
            anuncios = [
                { id: 1, tipo: 'vendas', titulo: 'Toyota Corolla em ótimo estado', preco: '¥350,000', regiao: 'Tokai', cidade: 'Toyohashi', imagem: 'https://images.unsplash.com/photo-1590362891991-f776e747a588?auto=format&fit=crop&w=500&q=80' },
                { id: 2, tipo: 'vendas', titulo: 'Sofá 3 lugares confortável', preco: '¥8,000', regiao: 'Tokai', cidade: 'Hamamatsu', imagem: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=500&q=80' },
                { id: 3, tipo: 'doacoes', titulo: 'Geladeira usada funcionando', preco: '0円', regiao: 'Kanto', cidade: 'Gunma', imagem: 'https://images.unsplash.com/photo-1584568694244-14fbdf88bd2d?auto=format&fit=crop&w=500&q=80' },
                { id: 4, tipo: 'vendas', titulo: 'Carro compacto econômico', preco: '¥180,000', regiao: 'Tokai', cidade: 'Toyohashi', imagem: 'https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&w=500&q=80' }
            ];
            filtrarAnuncios();
        }

        function mudarAba(aba) {
            abaAtual = aba;
            const btnVendas = document.getElementById('btn-vendas');
            const btnDoacoes = document.getElementById('btn-doacoes');

            if (aba === 'vendas') {
                btnVendas.className = "flex-1 py-2.5 text-center font-bold text-blue-600 border-b-2 border-blue-600 text-xs transition";
                btnDoacoes.className = "flex-1 py-2.5 text-center font-bold text-gray-400 border-b-2 border-transparent text-xs transition";
            } else {
                btnDoacoes.className = "flex-1 py-2.5 text-center font-bold text-blue-600 border-b-2 border-blue-600 text-xs transition";
                btnVendas.className = "flex-1 py-2.5 text-center font-bold text-gray-400 border-b-2 border-transparent text-xs transition";
            }
            filtrarAnuncios();
        }

        function filtrarAnuncios() {
            const textoBusca = document.getElementById('input-busca').value.toLowerCase();
            const regiaoSelecionada = document.getElementById('filtro-regiao').value;
            const cidadeBusca = document.getElementById('input-cidade').value.toLowerCase();
            const container = document.getElementById('lista-anuncios');

            const filtrados = anuncios.filter(anuncio => {
                const matchAba = anuncio.tipo === abaAtual;
                const matchTexto = anuncio.titulo.toLowerCase().includes(textoBusca);
                const matchRegiao = regiaoSelecionada === "" || anuncio.regiao === regiaoSelecionada;
                const matchCidade = cidadeBusca === "" || anuncio.cidade.toLowerCase().includes(cidadeBusca);

                return matchAba && matchTexto && matchRegiao && matchCidade;
            });

            container.innerHTML = "";
            if (filtrados.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 text-xs">Nenhum anúncio encontrado.</div>`;
                return;
            }

            filtrados.forEach(anuncio => {
                container.innerHTML += `
                    <div onclick="abrirDetalhe(${anuncio.id})" class="relative bg-white rounded-lg overflow-hidden shadow-sm hover:shadow transition cursor-pointer group">
                        <!-- Imagem do Produto -->
                        <img src="${anuncio.imagem}" alt="${anuncio.titulo}" class="w-full h-36 sm:h-44 object-cover group-hover:scale-105 transition duration-300">
                        
                        <!-- Nome da Cidade (Topo Esquerdo) -->
                        <span class="absolute top-1.5 left-1.5 bg-black/65 text-white text-[10px] font-medium px-2 py-0.5 rounded backdrop-blur-sm">
                            ${anuncio.cidade}
                        </span>

                        <!-- Preço (Inferior Esquerdo) -->
                        <span class="absolute bottom-1.5 left-1.5 bg-black/75 text-white text-xs font-extrabold px-2 py-0.5 rounded backdrop-blur-sm">
                            ${anuncio.preco}
                        </span>
                    </div>
                `;
            });
        }

        function abrirDetalhe(id) {
            // Redireciona para a página de detalhes do produto passando o ID
            window.location.href = `detalhe.html?id=${id}`;
        }

        // Executar inicialização ao carregar a página
        window.onload = inicializarLiff;
    </script>
</body>
</html>

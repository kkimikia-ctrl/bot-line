<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificados - Ajuda JP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-store"></i> Classificados Ajuda JP
            </h1>
            <a href="novo-anuncio.html" class="bg-white text-blue-600 px-3 py-1.5 rounded-full text-sm font-semibold shadow hover:bg-blue-50 transition">
                <i class="fa-solid fa-plus"></i> Anunciar
            </a>
        </div>
    </header>

    <!-- Abas Principais (Vendas vs Doações 0円) -->
    <div class="bg-white border-b shadow-sm">
        <div class="max-w-4xl mx-auto flex">
            <button onclick="mudarAba('vendas')" id="btn-vendas" class="flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition">
                <i class="fa-solid fa-tags"></i> Vendas
            </button>
            <button onclick="mudarAba('doacoes')" id="btn-doacoes" class="flex-1 py-3 text-center font-bold text-gray-400 border-b-2 border-transparent transition">
                <i class="fa-solid fa-gift"></i> Doações (0円)
            </button>
        </div>
    </div>

    <!-- Filtros: Região e Lupa de Itens -->
    <main class="max-w-4xl mx-auto p-4 space-y-4">
        
        <!-- Barra de Pesquisa por Item (Lupa) -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="input-busca" onkeyup="filtrarAnuncios()" placeholder="O que você procura? (ex: carro, sofá, TV...)" 
                class="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>

        <!-- Seletor de Região / Província -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 space-y-2">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Filtrar por Região / Cidade</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <select id="filtro-regiao" onchange="filtrarAnuncios()" class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Todas as Regiões</option>
                    <option value="Hokkaido/Tohoku">❄️ Hokkaido / Tohoku</option>
                    <option value="Kanto">🗼 Kanto (Tóquio, Gunma...)</option>
                    <option value="Tokai">🏯 Tokai (Aichi, Shizuoka...)</option>
                    <option value="Kansai">⛩️ Kansai (Osaka, Kyoto...)</option>
                    <option value="Chugoku/Shikoku">🌊 Chugoku / Shikoku</option>
                    <option value="Kyushu/Okinawa">🌴 Kyushu / Okinawa</option>
                </select>
                <input type="text" id="input-cidade" onkeyup="filtrarAnuncios()" placeholder="Cidade (ex: Toyohashi)" 
                    class="p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- Vitrine de Anúncios -->
        <div id="lista-anuncios" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Os cards serão injetados via JavaScript -->
        </div>

    </main>

    <script>
        // Dados de exemplo (simulando anúncios cadastrados com região e cidade reais)
        const anuncios = [
            { id: 1, tipo: 'vendas', titulo: 'Toyota Corolla em ótimo estado', preco: '¥350,000', regiao: 'Tokai', cidade: 'Toyohashi', imagem: 'https://images.unsplash.com/photo-1590362891991-f776e747a588?auto=format&fit=crop&w=500&q=80' },
            { id: 2, tipo: 'vendas', titulo: 'Sofá 3 lugares confortável', preco: '¥8,000', regiao: 'Tokai', cidade: 'Hamamatsu', imagem: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=500&q=80' },
            { id: 3, tipo: 'doacoes', titulo: 'Geladeira usada funcionando', preco: '0円', regiao: 'Kanto', cidade: 'Gunma', imagem: 'https://images.unsplash.com/photo-1584568694244-14fbdf88bd2d?auto=format&fit=crop&w=500&q=80' },
            { id: 4, tipo: 'vendas', titulo: 'Carro compacto econômico', preco: '¥180,000', regiao: 'Tokai', cidade: 'Toyohashi', imagem: 'https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&w=500&q=80' }
        ];

        let abaAtual = 'vendas';

        function mudarAba(aba) {
            abaAtual = aba;
            const btnVendas = document.getElementById('btn-vendas');
            const btnDoacoes = document.getElementById('btn-doacoes');

            if (aba === 'vendas') {
                btnVendas.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition";
                btnDoacoes.className = "flex-1 py-3 text-center font-bold text-gray-400 border-b-2 border-transparent transition";
            } else {
                btnDoacoes.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition";
                btnVendas.className = "flex-1 py-3 text-center font-bold text-gray-400 border-b-2 border-transparent transition";
            }
            filtrarAnuncios();
        }

        function filtrarAnuncios() {
            const textoBusca = document.getElementById('input-busca').value.toLowerCase();
            const regiaoSelecionada = document.getElementById('filtro-regiao').value;
            const cidadeBusca = document.getElementById('input-cidade').value.toLowerCase();
            const container = document.getElementById('lista-anuncios');

            const filtrados = anuncios.filter(anuncio => {
                // Filtro por Aba (Vendas vs Doações)
                const matchAba = anuncio.tipo === abaAtual;
                
                // Filtro por Texto na Lupa (Título)
                const matchTexto = anuncio.titulo.toLowerCase().includes(textoBusca);
                
                // Filtro por Região
                const matchRegiao = regiaoSelecionada === "" || anuncio.regiao === regiaoSelecionada;
                
                // Filtro por Cidade específica digitada
                const matchCidade = cidadeBusca === "" || anuncio.cidade.toLowerCase().includes(cidadeBusca);

                return matchAba && matchTexto && matchRegiao && matchCidade;
            });

            // Renderizar na tela
            container.innerHTML = "";
            if (filtrados.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400">Nenhum anúncio encontrado.</div>`;
                return;
            }

            filtrados.forEach(anuncio => {
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                        <img src="${anuncio.imagem}" alt="${anuncio.titulo}" class="w-full h-40 object-cover">
                        <div class="p-3 space-y-1">
                            <span class="text-xs font-semibold px-2 py-0.5 bg-blue-50 text-blue-600 rounded-md">${anuncio.cidade} (${anuncio.regiao})</span>
                            <h3 class="font-bold text-sm text-gray-800 line-clamp-1">${anuncio.titulo}</h3>
                            <p class="text-blue-600 font-extrabold text-base">${anuncio.preco}</p>
                        </div>
                    </div>
                `;
            });
        }

        // Executar na carga inicial
        filtrarAnuncios();
    </script>
</body>
</html>
